<div class="blk"><b>概念</b>：安全=无伤亡无损失的<span class="hl">状态</span>；危险=可能性超出承受程度（<span class="hl">必须指明具体对象</span>）；<span class="hl">本质安全＝人机环管四要素</span>（传统仅指机器设备自身安全性能）；广义本质安全理念=<span class="hl">所有事故都可以预防和避免</span>；安全生产=人机物环方法和谐运作、风险处于<span class="hl">有效控制状态</span>（危险不能完全避免但要控制）；管理=决策计划指挥协调控制和不断改进。</div>
<div class="blk"><b>四大管理方法「戴检险目」</b>：①戴明循环PDCA ②安全检查法（<span class="hl">最常用</span>，老师：一年到头都在检查；三形式=定期/不定期/特殊检查；思想+业务两准备；<span class="hl">三结合＝领导与群众+自查与互查+检查与整改</span>）③风险预控法 ④安全目标管理法——「强制比例法」是凑数干扰项。<b>目标管理</b>：任务转化为明确目标+<span class="hl">分解到各部门和个人</span>+严格自觉按目标工作+<span class="hl">信任性指导性、重视人激励人</span>+定方针定目标排日程+自觉与严格检查两靠。<b>PDCA八步</b>：P四步（分析现状找问题→查原因→查<span class="hl">主要原因</span>→拟定计划）、D执行、C检查效果、A两步（<span class="hl">总结经验纳入标准＋重大遗留问题转入下期</span>）——后两件都在<span class="hl">处理阶段</span>；每阶段可嵌套小PDCA。<b>风险预控</b>：基础=<span class="hl">危险源辨识和风险评估</span>（不是事故分析）；企业建立风险预控管理程序+分级分类监测预警；七步骤。</div>
<div class="blk"><b>现状</b>：国家层面步入良性循环（预防→减少事故→降低工伤基金率）但<span class="hl">总量基数大、重特大仍频发</span>；通信工程总体规模和人员在增加、<span class="hl">事故总量逐年减少</span>，但存在管理松懈/投入不足/责任制不落实/培训重形式轻实质/意识淡薄。<b>地位</b>：人=基本需要（马斯洛需求<span class="hl">第二层安全需求</span>，缺失性需求）；企业=实现经济效益的<span class="hl">前提</span>、潜在的有益投资+提高员工积极性；国家=<span class="hl">基本政策、严肃的政治问题</span>（宪法）。<b>作用</b>：保人身安全/促进经济发展/维护社会和谐（安全经济学的<span class="hl">三角形理论：经济是两条斜边、安全是底边</span>）。<b>方针三阶段</b>：1983前「生产必须安全、安全为了生产」→84~04「安全第一预防为主」→<span class="hl">2005至今+综合治理</span>。三者统一体；安全第一=冲突时安全优先；预防为主=<span class="hl">关口前移、超前防范、预测预报预警递进立体化隐患预防体系</span>；综合治理=抓主要矛盾关键环节+经济法律行政多手段+人管法治技防多管齐下+社会职工舆论监督+<span class="hl">标本兼治重在治本</span>。<b>机制五块</b>：单位负责（<span class="hl">基础</span>；制定修改安全制度应听取工会意见）/职工参与（<span class="hl">60%以上事故因劳动者缺意识违章</span>）/政府监管/行业自律/社会监督。<b>四原则</b>：改革引领创新驱动/依法治理系统建设/预防为主源头管控/<span class="hl">社会协同齐抓共管（党政统一领导+部门依法监管+企业全面负责+群众参与监督+全社会支持）</span>。<b>指导原则六条</b>：方针+主要负责人全面负责+<span class="hl">谁主管谁负责</span>+管业务管生产经营必须管安全+全员参与+<span class="hl">持续改进（动态管理）</span>。<b>主要任务</b>：执行法规+分析不安全因素+组织技术管理多层面措施消除控制。<b>12方面工作内容</b>：机构人员/责任制/制度规程/教育培训/<span class="hl">安全费足额投入</span>/分包选择清退标准/现场管理/安全检查/隐患排查危险因素识别/事故预防应急预案/<span class="hl">专项管理（高危物品职业病消防）</span>/持续改进/考核机制。<b>目标管理</b>：依据总体发展规划+内外部环境制定<span class="hl">年度和中长期目标</span>（事故控制指标+安全文明施工管理目标）；任务=确定目标分解目标明确责任落实措施严格考核实施奖惩；三块内容=目标体系建立+实施+成果检查考核。</div>
` },

{ id:'m5', tab:'组织制度保障', grp:'📗 管理篇', day:'9/8 下午', title:'第五章 企业安全生产组织制度保障',
  law:'题库61题', quiz:'05第五章.html', html: `
<h3>组织体系</h3>
<div class="blk">2016年改革意见：企业对本单位安全和职业健康<span class="hl">负全面责任</span>+自我约束持续改进内生机制。体系构成=决策机构+管理机构+各级职能部门岗位+项目部+工会+<span class="hl">应急救援组织</span>。<b>决策机构</b>=<span class="hl">安委会或安全生产决策岗位</span>（「必须成立安委会」表述错——但有决策岗位即可）；<span class="hl">中央施工企业必须成立安委会、由董事长或总经理担任</span>；<span class="hl">党政同责：董事长、党组织书记、总经理共同承担领导责任</span>；安委会组成=管理层+各职能部门负责人。<b>管理机构</b>=负责安全管理工作的<span class="hl">独立职能部门</span>（安委会领导下开展工作）；央企配<span class="hl">注册安全工程师</span>等专业人员。<b>配备「二三四」</b>：劳务分包资质≥<span class="n">2</span>人；总承包一级≥<span class="n">4</span>人、二级及以下≥<span class="n">3</span>人；较大分支机构≥2人。<b>项目部</b>：常设项目部参照较大分支机构；<span class="hl">单项工程项目部对本项目全面负责</span>+按规定配专职安全员；分包服从总包；<span class="hl">作业人员四不伤害＝不伤害自己、不伤害他人、不被他人伤害、不使他人受到伤害</span>（多选高频一个不能少）；需分包的工程项目要成立<span class="hl">项目安全管理领导小组</span>（总包+专业承包+劳务分包三单位的项目经理+技术负责人+专职安全员组成）；通信项目按合同价<span class="n">5000万/1亿</span>配1/2/3人；班组可设<span class="hl">兼职安全巡查员</span>。<b>工会</b>：民主管理民主监督+三同时监督提意见+要求纠正违章+强令冒险提解决建议+<span class="hl">建议撤离危险场所</span>+参加事故调查——<span class="hl">只有建议权监督权</span>。<b>应急救援组织</b>（安法82条）：建筑施工单位应建；规模较小可不建但<span class="hl">指定兼职应急救援人员</span>；总包分包各自配器材、分别组织演练。</div>
<h3>安全生产责任制</h3>
<div class="blk"><span class="hl">定义＝企业最基本、最核心的安全生产管理制度</span>：明确各岗位<span class="hl">责任人员、责任范围、考核标准</span>。总要求「<span class="hl">横向到边、纵向到底</span>」；由<span class="hl">主要负责人组织建立</span>。目的=明确职责范围+考核标准+增强责任感。施工企业法定责任六方面=<span class="hl">企业、员工、设施设备、检查、技术交底、现场管理（+应急）</span>。企业方面：四条件（钱/人/物/环）+<span class="hl">资质证书+安全生产许可证缺一不可</span>+决策机构管理机构+责任制制度+资金投入（费用制度明确提取使用程序职责权限）+专款专用+统一管理承租分包+不得发包给无资质+签安全协议+同一区域协议+专职协调+主体结构自行完成+不得转包肢解。员工方面：<span class="hl">培训五类</span>=三类人（工信部/通管局考核）+全员年训+两新四新+特种作业持证+<span class="hl">被派遣劳动者视同本单位从业人员统一管理</span>；防护用品两证进场前查验+专人管理档案（老师案例：18年的安全帽还在用——采购记录有但没发到人）；保险：工伤强制+意外险施工/总包付+安责险鼓励。设备方面：两证+专业生产+检测合格+安全使用证标志+<span class="hl">四方验收（总包分包出租安装）</span>+特种设备监督检验+<span class="n">30日内</span>登记+标志显著位置+不得用淘汰工艺设备。交底检查方面：经常性检查+如实记录；技术负责人组织编制专项方案；<span class="hl">项目负责人组织安全技术交底（技术负责人向班组作业人员+书面告知危险岗位规程和违章危害+双方签字）</span>。现场方面：分区距离+宿舍禁未竣工+疏散标志畅通+防火+环保+封闭管理。<b>责任制建立四原则</b>：合法合规/与企业实际相适应/突出重点兼顾一般抓住关键/<span class="hl">动态调整</span>；程序11步（成立机构→配置人员→风险识别→制定大纲→编制→征求意见→审查通过（<span class="hl">安委会或领导小组</span>）→<span class="hl">主要负责人签批发布</span>→落地执行→动态修订）。<b>内容横向（各职能部门机构）+纵向（各级各类人员）</b>。决策机构职责=定方针/解决重大问题/决定奖惩；管理部门职责15条（宣传贯彻法规/拟定制度/编预案演练/组织培训/协调配备/检查计划/监督费用使用/纠正违章/评优/考核/参加事故调查/危险源辨识评估/整改落实）；新教材其他部门主要提<span class="hl">工会</span>。领导小组九条职责（落实法规/制度/预案演练/安全费专款专用/专项方案/教育培训/检查排查/档案/如实报告事故）。<b>各类人员（全员10类）</b>：主要负责人=第一责任人（七职责+签责任书+检查项目不胜任就换+设专职分管负责人协助）；<span class="hl">分管安全生产负责人＝直接责任</span>；<span class="hl">技术负责人＝技术领导责任</span>；财务=监督检查安全费；其他领导=分管范围；安管人员=<span class="hl">安法25条七职责</span>（组织或参与拟制度规程预案/组织或参与培训并如实记录/组织或参与演练/组织危险源辨识评估督促重大危险源管控/检查排查提建议/<span class="hl">制止纠正违章</span>/督促整改；企业不得因履责降低工资福利待遇）+393条23条职责；项目负责人=<span class="hl">法定代表人授权+职业资格+考核合格+施工现场安全生产第一责任人</span>（建立项目体系/组织落实/安全费/施工前组织交底/总承包成立领导小组/总包项目负责人定期考核分包）；班组长=本班组；施工人员=本岗位直接责任+四不伤害。<b>考核奖惩</b>：对象全员；内容=目标实现程度/职责落实/安全行为/安全业绩；奖惩原则=<span class="hl">谁主管谁负责、谁出问题谁承担责任</span>。</div>
<h3>安全生产管理制度</h3>
<div class="blk">定义=以<span class="hl">企业名义颁发</span>的安全生产文件；作用=防范风险+保障安全健康+加强管理。<b>内容四要素</b>=工作内容+职责权限+工作程序及标准；随法规和体制变化<span class="hl">及时更新</span>。<b>必要性三方面</b>：法律法规要求（法定责任）/贯彻法规防止随意性保障权益/控制风险继承经验。<b>依据</b>：依法依规+<span class="hl">核心是危险有害因素辨识和控制</span>+借鉴国内外先进经验。<b>建立原则四条</b>：安全生产方针（12字）/主要负责人负责/<span class="hl">系统性（全过程全员全方位）</span>/规范化和标准化（目的明确流程清晰标准明确可操作）。<b>分类三维度</b>：安全系统工程人机工程原理=四类（<span class="hl">综合管理/人员管理/设备设施管理/环境管理</span>——通信工程用这个）；标准化体系=技术标准/管理标准/工作标准；职业健康体系=手册/程序文件/作业指导书。综合管理类15项含安全生产责任制/安全技术管理制度/隐患排查/监督检查等；人员类=教育培训/防护用品/工器具；设备类=巡视维护检测操作规程；环境类=安全标志/作业环境/职业卫生。<b>制定步骤</b>：起草（明确目的+适用范围+主管部门解释部门实施日期+资料收集）→征求意见（正式渠道，不一致由<span class="hl">分管领导组织讨论统一</span>）→审核（<span class="hl">法律部门审合规性+技术专家审专业性+全员性制度经职工代表大会或职工代表审核</span>）→<span class="hl">签发（全局性=主要负责人；安全技术性强=主管生产领导或总工程师）</span>→发布（范围涵盖执行部门和人员）→修订（<span class="hl">一般每3~5年全面修订一次</span>，每年细节修订）。</div>

<h3>许可和审批管理</h3>
<div class="blk">国家三方面许可：<span class="hl">企业施工资质+人员资格+施工作业审批</span>——不具备资格不得参与。<b>企业三证照</b>：营业执照（工商部门+年度报告公示+变更手续）/企业资质（<span class="hl">建设行政主管部门颁发建筑业企业资质证书</span>+有效期延续+人员装备条件达标）/安全生产许可证（2004年许可条例+<span class="hl">未取得不得从事生产活动</span>）。<b>通信工程资质三级</b>：持证现场管理人员一级≥<span class="n">50</span>人、二级≥<span class="n">30</span>人、三级≥<span class="n">15</span>人（三级施工员质量员安全员必备）；承接=一级<span class="hl">不限</span>、二级≤<span class="n">2000万</span>、三级≤<span class="n">500万</span>。<b>人员三类</b>：安全生产管理人员（三类人+<span class="hl">通信主管部门考试+持续教育</span>+<span class="hl">大中型项目负责人还需通信与广电专业一级建造师</span>）；<b>特种作业人员</b>（定义=易发生伤亡对本人他人设施有重大危害；通信常见=电工+登高+焊接热切割+制冷空调；北京上海要求有限空间地面监护人证；培训以<span class="hl">操作技能为主</span>；<span class="hl">操作证6年有效、全国有效</span>；<span class="hl">2026-06-01起换证新规：届满前6个月内完成理论培训考试+届满前60日内申请</span>；<span class="hl">失效未超1年按换证办、超1年按首次取证</span>）；<b>特种设备作业人员</b>（8种设备=锅炉/压力容器/压力管道/电梯/起重机械/客运索道/大型游乐设施/场内专用机动车；<span class="hl">县级以上质监部门</span>发证；18周岁+健康+文化程度；<span class="hl">4年复审一次、期满前3个月申请</span>，复审合格盖章，不合格或逾期取消）。<b>六类作业审批</b>：<span class="hl">动火</span>（禁火区焊接切割+易燃易爆场所喷灯火钻砂轮临时作业；<span class="hl">一个动火点一张动火证</span>、不得异地使用扩大范围、超期重新办理）/<span class="hl">有限空间</span>（封闭部分封闭出口窄+有毒气体积聚；<span class="hl">严格审批严禁擅自进入</span>）/<span class="hl">动土</span>（挖土打桩深度<span class="n">0.5米</span>以上+推土机压路机填土平整+影响地下隐蔽设施；<span class="hl">动土所在单位→作业点管理部门办理</span>）/<span class="hl">道路作业</span>（城镇交通在用道路施工吊装；<span class="hl">作业单位办理→工程管理部门审批</span>）/<span class="hl">割接作业</span>（电源系统+通信设备+线路；<span class="hl">建设单位审批</span>）/高处作业。</div>
<h3>安全技术措施</h3>
<div class="blk">技术负责人对管理范围内安全技术管理负责；定期技术分析改造淘汰落后。<b>施组编安全技术措施+临电方案</b>（393号26条：<span class="hl">施工单位技术负责人+总监理工程师双签字</span>）。<b>两类措施</b>：<span class="hl">防止事故发生</span>=消除危险源/限制能量或危险物质/<span class="hl">隔离</span>/故障-安全设计（低能状态）/减少故障和失误；<span class="hl">减少事故损失</span>=隔离/设置薄弱环节（<span class="hl">易熔塞、熔断器</span>）/<span class="hl">个体防护（保护人身安全的最后一道防线）</span>/避难与救援（提前设避难场所撤回路线）；<span class="hl">隔离攻防两用</span>；安全监控系统两类兼用。<b>编制要求</b>：开工前与施组一同编+针对性+全面具体可靠+<span class="hl">必须包括应急处置措施</span>（应对地震台风泥石流等突发事件+逃生救援）+可行可操作。<b>临电方案</b>：<span class="hl">临时用电设备5台以上或总容量50kW及以上→编临时用电组织设计</span>；以下→制定安全用电和电气防火措施；与施组一同审批。<b>专项施工方案</b>：施组基础上+对<span class="hl">危大工程</span>编专项方案+<span class="hl">附安全验算结果</span>；危大四类=<span class="hl">基坑工程</span>（超<span class="n">3米</span>或地质周边复杂）/起重吊装及安拆（单件<span class="n">10kN</span>以上起重机械安装；超规模=100kN以上吊装/300kN或200米以上起重机械安拆）/<span class="hl">拆除工程</span>（影响行人交通电力通信建筑；超规模=码头桥梁高架烟囱水塔+有毒有害粉尘扩散+文保历史建筑）/其他（钢结构网架模块+水下+装配式构件+<span class="hl">四新无国家行业标准</span>；超规模=钢结构<span class="n">36米</span>及以上/网架<span class="n">60米</span>及以上/1000kN以上整体提升）；另有模板支撑体系/脚手架/暗挖也要编。<b>危大工程各方</b>：建设单位提供真实准确完整地质水文周边资料+招标文件列危大清单+要求投标补充完善+<span class="hl">及时支付危大技术措施费和安全防护文明施工措施费</span>；勘察单位说明地质风险；设计注明重点部位+必要时专项设计。<b>编制审批实施</b>：施工前编；总承包由<span class="hl">总包单位编制</span>（分包的可由分包编）；方案<span class="n">9项内容</span>（概况/依据/计划/工艺技术/安全保证措施/人员分工/验收要求/处置措施/计算书图纸）；<span class="hl">超过一定规模→施工单位组织专家论证会</span>，结论三种：通过（可实施）/修改后通过（<span class="hl">专家明确修改内容</span>+施工单位修改后<span class="hl">履行审核审查手续</span>+修改情况告知专家）/不通过（修改后重新论证）。<span class="hl">审批＝施工单位技术负责人审核签字+总监理工程师审查签字+加盖执业印章</span>；分包编的<span class="hl">总包技术负责人+分包技术负责人共同审核签字+盖单位公章</span>。<span class="hl">实施前两级交底</span>=编制人员或项目技术负责人→现场管理人员；现场管理人员→作业人员；<span class="hl">交底人+被交底人+项目专职安全员三方签字确认</span>；规划调整设计变更→修改后<span class="hl">重新审核论证</span>；资金工期调整建设单位按约支付；监理编<span class="hl">监理实施细则+对危大工程专项巡视检查</span>。<b>安全技术措施计划</b>：<span class="hl">安全生产管理部门牵头</span>，工会财务人力参与；四原则=必要可行性/自力更生勤俭节约/<span class="hl">轻重缓急统筹安排</span>/领导群众相结合；项目范围四类=<span class="hl">安全技术措施（防工伤）/卫生技术措施（防尘毒噪改善环境——第24题考点）/辅助保障措施（急救箱等）/宣传教育措施</span>；每项含7部分（单位场所/目的内容/经费来源/实施部门负责人/开竣工日期/验收标准）。<b>编制方法</b>：与年度生产技术财务物资计划同时编→领导布置→确定项目内容→编制→审批→下达（主要负责人审后与生产计划同时下达）→实施→监督检查。</div>
<h3>安全教育培训管理</h3>
<div class="blk"><b>必要性三方面</b>=实现安全目标的基本保障+法律法规要求+改善通信施工队伍现状（<span class="hl">人/物/管理/环境四方面不安全因素，人是重点</span>）。<b>特点四个</b>=<span class="hl">全员性（横向部门纵向层级）/长期性（贯穿职业生涯，拿证还要继续教育）/针对性（不同专业环境+四新+新岗位）/多样性（内容多样+对象多样）</span>——考题给一个培训情景问体现哪个特点。<b>对象</b>=全员（新上岗/重新上岗转岗/新现场/特种/派遣/实习）。<b>学时全表</b>：单位全员<span class="hl">每年至少1次</span>；主要负责人和安管人员初次<span class="n">≥32学时</span>+每年再培训<span class="n">≥12学时</span>；新上岗<span class="n">≥24学时</span>；<span class="hl">建筑企业新职工岗前≥32学时+每年再培训≥20学时</span>；专职安管<span class="hl">每年≥40学时</span>；其他管理技术人员<span class="n">≥20学时</span>；特种作业<span class="n">≥20学时</span>；待岗转岗换岗<span class="n">20学时</span>；<span class="hl">新工人三级教育＝公司级15+项目级15+班组级≥20学时</span>。<span class="hl">所有培训必须在上岗前或作业前</span>；<span class="hl">调整岗位或离岗1年以上重新上岗→重新接受车间班组级培训</span>（通信=项目部或工程处级）。<b>内容</b>：安全生产月主题（<span class="n">1980年5月</span>开始、每年<span class="hl">6月</span>；19~21年主题=防风险除隐患遏事故/消除事故隐患筑牢安全防线/落实安全责任推动安全发展）+分级差异化（公司=法规制度/项目=本项目状况规范/班组=劳动纪律防护用品操作规程）+继续教育（新法规新标准新经验）+经常性（四新+季节+岗位危险因素）。<b>特种作业培训</b>：<span class="hl">三统一＝统一培训大纲、统一考核教材、统一证件</span>（全国通用）；2025年7月新大纲；低压电工高压电工/焊接热切割压力焊/登高架设/<span class="hl">高处安装维护拆除——登高架设和高处安装维护拆除易搞混（老师案例：招标要后者现场给前者）</span>；考核=安全技术考试（理论+实操<span class="hl">均合格</span>）+资格审核；<span class="hl">实体证书和电子证书同等效力</span>。<b>培训档案</b>：<span class="hl">必须涵盖被派遣劳动者</span>+记录时间内容参加人员考核结果；<span class="hl">分级管理＝施工人员记录存所在管理组织、机关人员存安全生产主管部门</span>+动态跟踪（调动带档）+<span class="hl">丢失一律重新考核</span>+未经培训上岗立即停止作业。方式：化整为零晨会+案例教育问答式+好老师。</div>
<h3>安全生产投入（安全费+保险）</h3>
<div class="blk"><b>安全费定义</b>=按规定标准提取+成本中列支+专门用于完善改进安全生产条件的资金。保证人：股份制=董事会/国企=总经理/个体=投资人，<span class="hl">投入不足致事故担法律责任</span>。<span class="hl">提取比例＝建安费2%</span>（2022年11月21日新规136号文；2012年旧版1.5%）；<span class="hl">列入造价、标外管理、竞标不得删减</span>；<span class="hl">总包按比例直接支付分包+监督使用、分包不重复提取</span>；<span class="hl">建设单位开工日1个月内付≥50%</span>、总包对分包同样；<span class="hl">竣工决算结余退回建设单位</span>；<span class="hl">年度赤字年末补齐、结余结转下年</span>。管理：建立使用制度+台账定期统计报上级+纳入财务预算。<span class="hl">使用范围</span>：完善改造维护安全防护设施设备（<span class="hl">不含三同时要求初期投入</span>）/应急救援器材设备+应急演练支出/重大危险源和隐患评估监控整改/安全检查评价（<span class="hl">不含新改扩建项目安全评价</span>）/咨询和标准化/防护用品/宣传培训四新/特种设备检测检验/🔥22年新增=<span class="hl">风险分级管控和隐患排查整改支出、信息化建设运维和网络安全支出、隐患报告奖励、安责险支出</span>；<span class="hl">员工薪酬福利不得从安全费列支</span>（奖励支出可以）；承揽服务外购成本占收入85%以上按净额计提；<span class="hl">不足年度应计提额60%→信息披露+次年4月底前向县级以上部门提交董事会审议的书面说明</span>。<b>保险</b>：工伤（工作中或特殊情况意外伤害职业病致丧失劳动能力死亡；对象=生产劳动过程中劳动者；<span class="hl">丧葬补助金=6个月上年度本地区职工月平均工资</span>；<span class="hl">供养亲属抚恤金=配偶每月40%、其他亲属每人30%、孤寡老人孤儿加10%、合计不超生前工资</span>；<span class="hl">一次性工亡补助金=上年度全国城镇居民人均可支配收入×20倍</span>）+安责险（<span class="hl">商业保险、受益人是投保企业</span>；涵盖本单位人员伤亡+第三者伤亡财产+抢险救援医疗救护鉴定诉讼费用；<span class="hl">同一企业从业人员赔偿标准统一、不因用工方式差别对待</span>；<span class="hl">每死亡一人≥30万</span>，按<span class="hl">本地区</span>城镇居民人均可支配收入调整；未死亡事故按合同约定；<span class="n">25年3月</span>实施办法优化）+老师延展：雇主险（赔雇主经济责任）与团体意外险（付被保人）区别，中通服150万=100万意外+50万雇主。</div>
<h3>劳动防护用品+特种设备</h3>
<div class="blk"><b>防护用品</b>=施工企业配备、免遭减轻事故伤害职业危害的个人防护装备。按部位分：头部/呼吸器官/眼面/听觉/手部/足部/躯干/护肤；按用途两类=防伤亡事故（坠落冲击触电）+防职业病（尘毒噪）。<span class="hl">必须符合国标或行标</span>+<span class="hl">监督教育按规定佩戴使用</span>（老师案例：草帽上班+安全帽不系带）；<span class="hl">建立健全管理制度、以人为单位建档（2024年起电子归档：谁、何时领的什么、有效期）</span>；<span class="hl">不得用货币或其他物品替代</span>；进口品防护性能不低于国标可用；派遣工实习生纳入统一管理；选用=识别评价选择程序+考虑个人特点劳动强度+<span class="hl">同一地点多种危害同时提供各类防护用品</span>+兼容性合适舒适性；<span class="hl">急性职业损伤场所配应急防护用品+现场醒目标识</span>；<span class="hl">保证有效期内</span>（老师案例：批量采购后发放时临期）；定期维护更换报废。<b>特种设备</b>：8种设备；通信相关=电梯/锅炉/刮缆气吹设备/氧气瓶乙炔/起重机械/卷扬机/叉车。使用单位义务：管理制度+<span class="hl">采购使用取得许可生产且经检验合格的</span>+不超年限+禁用淘汰报废+设机构配人员+<span class="hl">人员管理台账+培训</span>+<span class="hl">办理使用登记领使用登记证、注销交回</span>+<span class="hl">事故应急专项预案+定期演练</span>+事故及时上报县级以上部门；<span class="hl">检验合格有效期届满前1个月</span>向检验机构提出定期检验要求；<span class="hl">经常性维护保养和定期自行检查+记录在案</span>。人员层级：<span class="hl">实际最高管理者=特种设备安全管理主要负责人（负总责）</span>；<span class="hl">安全管理负责人（持证）＝协助履职+组织制定管理制度+组织定期演练（宏观）</span>；<span class="hl">安全管理员＝具体负责+建立安全技术档案+办理使用登记+组织定期自查</span>；<span class="hl">作业人员持证+每班至少1名持证人员在岗</span>。</div>

<h3>危险源辨识与控制</h3>
<div class="blk"><b>危险源定义</b>：安全生产角度=可能造成人员伤害疾病、财产损失、环境破坏的<span class="hl">根源或状态</span>；职业健康角度=可能导致伤害和健康损害的来源；<span class="hl">国内口径：仅涉及物或财产损害的也属于危险源</span>。辨识=<span class="hl">识别危险的存在并确定其特性</span>的过程（不只识别、还要判断性质）。<b>辨识四原则</b>=<span class="hl">科学性（分辨识别分析确定，不是防措施）/系统性（全面剖析+系统间约束关系）/全面性（现状+过去曾发生的）/预测性（潜在危险性+存在条件+触发事件）</span>。<b>方法10种</b>，工程建设常用4种=<span class="hl">直观经验法（依赖过去经验、不能用于无先例的新系统）/对照分析法（对照标准法规检查表——检查表法就是它的运用、受个人经验局限）/类比推断法（利用同类工程统计）/专家评议法（专家素质要求高）</span>；研究类6种=FMEA（飞机发动机故障分析起源）/危险可操作性研究（关键词引导）/事故树分析/危险指数法/人的可靠性分析/概率危险评价。<b>风险评价</b>：风险=发生危险事件的有害暴露<b>可能性</b>；评价=定性定量分析+确定严重程度+考虑控制措施充分可靠性+<span class="hl">是否可接受</span>；管理=按结果定优先级和措施。评价小组=技术人员+管理人员；方法=专家经验法/头脑风暴法/专家打分法/<span class="hl">作业条件危险性评价法（LEC）</span>。<span class="hl">LEC：D＝L×E×C</span>（L=事故发生的可能性、E=人体暴露于危险环境的<span class="hl">频繁程度</span>、C=后果严重程度、D=风险等级值）——L取值10（完全可能预料）到0.1（基本不可能）；E取值10（连续暴露）到0.5；C取值100（大灾难多人死亡）到1（引人注意需救护）。<span class="hl">风险五级：D＞320极危险不能继续作业；160~320高度危险立即整改；70~160显著危险需要整改；20~70一般危险需要注意；＜20稍有危险</span>。<b>控制策略</b>=避免/转移/减轻；防范措施三类=<span class="hl">组织措施</span>（安管机构=企业内设监督机构+专职或兼职；高危必须设机构或专职、其他100人界限回顾；安法25条七职责）/<span class="hl">管理措施</span>（人物的不安全难完全消除所以管理尤为重要；责任制/教育培训/检查）/<span class="hl">技术措施</span>（消除物的不安全状态：隔离/专用工具如管线探测仪气体检测/自身防护/避难救援）。<b>通信工程常见危险源三类</b>：线路（架空=高低压电力线变压器+缺陷夹头绳脚扣+<span class="hl">关闭高压告警器</span>；直埋=地下电力线+挖开无警示标志光缆沟+车上固定不牢重物；管道光缆=特殊地形+人手孔有毒气体）；管道（长途=地下电力线+输油输气管道+无警示管道沟；室内=燃气管道）；设备安装（室内=有缺陷电钻试电笔；室外=特殊环境+失灵吊装设备）。<span class="case">老师案例：装维晚上单人装拉缆，梯子抽升碰到高压线——双人不落实+告警器被关的叠加教训。</span></div>
<h3>事故隐患排查与治理</h3>
<div class="blk"><b>隐患定义</b>=违反法规或其他因素导致的物的危险状态/人的不安全行为/管理缺陷。<span class="hl">生产经营单位是排查治理防控的责任主体、单位负责人全面负责</span>。<b>分级</b>：一般（危害整改难度小，发现后立即整改排除）vs 重大（危害和整改难度大、需局部或全部停产停业经过一定时间治理、<span class="hl">外部因素致自身难以排除的也算重大</span>）。<b>通信隐患五级</b>：<span class="hl">特别监控</span>（全部停产停业+<span class="hl">主要负责人</span>组织制定治理方案+<span class="hl">行政主管部门</span>动态监控）/<span class="hl">重点监控</span>（局部停产停业+主要负责人组织+<span class="hl">行业主管部门或建设单位</span>动态监控）/一般监控（立即整改+<span class="hl">项目负责人</span>落实整改验收+企业负责人动态监控）/轻微（需整改但不要求立即+<span class="hl">现场负责人</span>）/关注（现场负责人关注即可不需整改验收）。<b>排查</b>：统计每季每年+<span class="hl">统计报表主要负责人签字</span>+重大隐患及时报安监部门，报告三内容=<span class="hl">现状及产生原因+危害程度和整改难易+治理方案</span>（不能只提问题不给方案）。要求：<span class="hl">逐级建立从主要负责人到每位从业人员的防控责任制+闭环管理</span>+清单制+范围含分包商供应商等相关方+<span class="hl">全覆盖零容忍严督查重实效</span>+<span class="hl">三点控制＝危险点、危害点、事故多发点</span>+全过程全方位+综合/专业/季节性/节假日/日常检查方式+相关方隐患统一纳入企业管理。<b>治理</b>：一般由车间分厂负责人立即改；重大由<span class="hl">主要负责人组织制定治理方案</span>，方案内容=<span class="hl">目标和任务+方法和措施+经费和物资+机构和人员+时限+安全措施和应急预案</span>；通信施工单位处理=当场指正切实纠正（一般违章）+重大隐患制定治理方案+记录及时整改；<span class="hl">五定＝定整改责任人、定整改措施、定整改完成时间、定整改完成单位及具体人员、定整改验收人</span>（三定跟人相关）；按<span class="hl">谁主管谁负责</span>制定方案+自查自纠限期整改+分析统计查找原因+<span class="hl">通病（多处同类）顽症（重复出现）</span>+跟踪验证。</div>
<h3>安全生产检查</h3>
<div class="blk"><b>意义</b>=预报预测预防不安全因素+降低伤亡损失+改善条件环境+宣传培训+相互学习交流+掌握状态提供依据。<b>内容两系统</b>：<span class="hl">软件系统＝查思想意识、制度管理、事故处理、隐患整改</span>；<span class="hl">硬件系统＝设备设施、作业环境</span>。<b>类型三维度</b>：时间维度=定期（计划性强领导带队年度季度月度）+季节性（北方冬防冻南方夏防汛）+特殊时期（节日重保）；内容维度=经常性（班组/项目部日常巡视）+专业性（技术负责人或专职安管牵头）；手段维度=现场/远程。<b>方法三种</b>=常规检查（靠经验有局限）/安全生产检查表法（<span class="hl">把个人行为对结果的影响减到最小</span>，各行业都有本行业表）/仪器检查和数据分析法（可定量+实施难）。<b>程序七环节</b>=检查准备（了解企业概貌风险+人员选择）→实施检查（访谈/查阅文件/现场/仪器测量）→综合分析→结果反馈（<span class="hl">上级主管部门或政府部门组织的检查必须书面反馈</span>）→提出整改要求→整改落实（计划+台账+定期跟踪<span class="hl">闭环</span>；<span class="hl">台账内容=隐患分类/描述/问题依据/整改要求/责任单位/期限+反馈跟进</span>；自行检查由<span class="hl">安全管理部门组织验收</span>；上级检查整改后<span class="hl">上报申请复查验收</span>）→总结。<b>企业检查八方面</b>=目标职责/制度化/教育培训/现场管理/风险管控及隐患治理/应急管理/事故管理/持续改进；<span class="hl">评分≥90优秀、80~89良好、70~79合格、＜70不合格</span>；项目达标<span class="hl">抽查3个以上项目、合格率100%</span>（<span class="tip">⚠题库25题答4个——记教材口径3个以上，做题按题库</span>）；<span class="hl">安委会每年2次以上会议</span>；培训率持证率达标率重大隐患整改率<span class="hl">100%</span>。项目检查要点=责任制/施组专项方案/人员管理/交底/教育培训/应急管理/检查/分包管理/作业人员/消防/警示标志/文明施工（表7-6）；<span class="hl">项目负责人每周组织专职安全员分包负责人等全面检查一次</span>；现场检查评价<span class="hl">80分以上优良、70~80合格</span>；不合格=总分＜70+<span class="hl">违反强制性条款</span>+安全行为规范＜40分+作业安全＜24分；<span class="hl">专管员评分权重占60%、其他人员40%</span>。</div>
<h3>职业健康安全管理体系+安全文化</h3>
<div class="blk"><b>体系作用</b>=科学管理手段+推动法规贯彻+<span class="hl">被动强制转主动自愿</span>+良好社会形象。标准11章；为管理风险和机遇提供框架；<span class="hl">实施体系是组织的战略和经营决策</span>；成功取决于<span class="hl">最高管理者的领导作用</span>；文件化程度取决于环境范围活动性质；<span class="hl">PDCA持续改进</span>。<b>建立五步</b>=体系策划动员准备→危险辨识与风险评价→管理文件编制→试运行→内部审核与管理评审→<span class="hl">申请外部审核（第三方认证）才能取得证书</span>。体系文件=管理手册/管理制度/<span class="hl">作业指导书</span>/现场处置方案及运行记录（质量手册属质量体系不算）。<b>内审</b>：<span class="hl">每年至少1次、最长不超过12个月</span>；<span class="hl">增加内审三情形＝组织机构职能重大变动/发生重大质量环境职业健康安全事故或重大投诉/最高管理者认为需要</span>（「体系管理部门负责人认为需要」不算——第39题坑）。<b>管理评审</b>：每年≥1次≤12个月。<b>第三方认证</b>=取得资质并经国务院认证认可监管部门批准的机构实施+<span class="hl">每年一次、3年一个周期</span>。<b>安全文化</b>：定义=<span class="hl">企业员工群体共享的安全价值观、态度、道德和行为规范组成的统一体</span>；建设是一个<span class="hl">过程</span>。总体模式：核心=<span class="hl">安全承诺</span>→行为规范与程序→安全行为激励/信息传播沟通/自主学习改进/安全事务参与→审核评估。<span class="hl">安全承诺＝企业（主要负责人）代表全体员工公开作出</span>（「管理层代表全体员工」错——第45题坑）；内容=价值观+愿景+使命与目标；切合实际+领导者<span class="hl">有形表率</span>（该给钱给钱该配资源配资源）+传达相关方。<span class="hl">企业内部行为规范＝安全承诺的具体体现和安全文化建设的基础要求</span>；程序=行为规范的重要组成部分；程序建立执行=<span class="hl">识别并说明主要的风险</span>+简单易懂易操作+<span class="hl">使用者参与制定改进</span>+清楚理解不遵守的后果+正式文件发布+培训阐明特殊要求原因+保持警觉+<span class="hl">鼓励质疑的安全态度</span>。<b>激励</b>=消极指标（事故发生率）+积极指标（对安全绩效直接认可）+鼓励挑战不安全实践识别缺陷+积极反馈+绩效评估系统+树榜样。<b>自主学习过程顺序（考排序）</b>=既有知识和能力→预知与反思→概念与方案→实践与实施→评估与总结→新的知识和能力。<b>员工参与方式</b>=<span class="hl">微小差错员工报告机制/员工安全改进小组/定期召开有员工代表参加的安全会议/岗位风险预见性分析和不安全行为状态自查自评</span>+承包商参与机制。<b>审核评估</b>=定期全面审核+领导者按结果落实整改。<b>推进保障</b>=规划计划+骨干选拔培养（训练内容=理论/经验/实施的方法/事例）。<b>建设步骤</b>=建立机构（<span class="hl">安全文化建设委员会、主要负责人任主任</span>）→制定规划（评估现状+理念设计+时间表）→培养骨干→宣传教育激励感化+努力实践。<b>文化与制度关系</b>=文化<span class="hl">指导和约束</span>企业及员工行为+指导制度的<span class="hl">制定和执行</span>+两种有力工具<span class="hl">紧密融合缺一不可（绝不各自独立）</span>+相互促进（员工认同转化为行为是关键）+相互交替。</div>
` },

{ id:'m8', tab:'应急管理', grp:'📗 管理篇', day:'9/9 下午', title:'第八章 安全生产应急管理',
  law:'题库28题', quiz:'08第八章.html', html: `
<h3>事故应急救援</h3>
<div class="blk"><span class="hl">应急管理是动态过程、四阶段＝预防、准备、响应、恢复</span>（防备响恢）：预防=安全管理和安全技术手段（收集法规/制定制度/买保险/风险分析评价/设防护墙）；<span class="hl">准备=极其关键的环节</span>（机构设立职责落实/预案编制/队伍建设/设施设备准备维护/演练）；响应=事故后立即采取的应急与救援行动；恢复=先恢复相对安全再逐步正常。<b>总目标</b>=通过有效应急行动尽可能降低事故后果（人员伤亡/财产损失/环境破坏）。<b>基本任务5件</b>=<span class="hl">营救遇险人员（首要任务）</span>+控制事态发展+消除危害后果做好现场恢复+查清事故原因评估危害程度+其他。事故特点=<span class="hl">突发性偶然性</span>。应急思想=<span class="hl">预防为主、常备不懈</span>（贯穿前中后全过程）。<b>组织机构10个</b>：<span class="hl">应急救援中心＝整个系统的重心</span>（统一指挥协调+统筹安排）；<span class="hl">应急救援专家组＝参谋</span>；+医疗救治/消防抢险/监测组织/公共疏散/警戒治安/后勤保障/信息发布等。<b>支撑保障系统5方面</b>=法律法规+<span class="hl">通信系统（救援工作开展的关键、必须设立可靠的通信保障系统并设备用）</span>+警报系统+技术与信息支持+宣传教育培训。<b>响应程序5步</b>=接警→<span class="hl">响应级别的确定</span>→启动救援行动→应急恢复（现场清理/人员清点撤离/警戒解除/善后处理/事故调查）→应急结束（<span class="hl">由事故总指挥宣布</span>）。</div>
<h3>企业应急救援与预案体系</h3>
<div class="blk">企业要做=建组织机构+组建队伍+定期演练+<span class="hl">应急物资保障体系</span>+设备器材定期检查维护保养+<span class="hl">管理层对全体从业人员预案培训交底</span>。预案定义=针对可能发生的事故、为迅速有序开展应急行动而<span class="hl">预先制定</span>的行动方案。<span class="hl">三体系</span>：<span class="hl">综合应急预案</span>=应对各种事故的综合性方案+总体工作程序措施和体系总纲（<span class="hl">风险种类多、可能发生多种类型事故的单位编制</span>；内容=应急组织机构职责+预案体系+事故风险描述+预警及信息报告+应急响应+保障措施+预案管理）；<span class="hl">专项应急预案</span>=某一或多种类型事故+重要生产设施重大危险源重大活动（<span class="hl">可并入综合预案</span>）；<span class="hl">现场处置方案</span>=具体场所装置设施（<span class="hl">体现自救互救、信息报告、先期处置</span>；危大场所装置设施要编；<span class="hl">风险单一危险性小可只编现场处置方案</span>）。<b>编制8步</b>=成立工作组→资料收集→风险评估→应急资源调查→预案编制（<span class="hl">以应急处置为核心</span>）→桌面推演（模拟完善）→评审（<span class="hl">准备→组织评审→修改完善</span>三步）→批准（<span class="hl">主要负责人签发</span>）。<b>内容</b>：总则含<span class="hl">适用范围+响应分级</span>；响应六阶段=<span class="hl">信息报告→预警→响应启动→应急处置→应急支援→响应终止</span>；信息报告要明确<span class="hl">应急值守电话+事故信息接收通报程序+责任人+向上级报告的流程内容时限+向本以外单位通报的方法程序责任人</span>；<span class="hl">响应启动由应急领导小组做出决策并宣布</span>；响应终止明确<span class="hl">基本条件、要求、责任人</span>；应急保障含队伍（专家+专职+兼职+协议救援队伍）和装备物资。<b>附件8部分</b>=单位概况+风险评估成果+预案体系衔接+物资名单等。</div>
<h3>演练与评估</h3>
<div class="blk"><b>演练定义</b>=针对事故情景、<span class="hl">依据应急预案而模拟</span>开展的应急救援活动。作用=评估应急准备状态+发现及时修改预案和程序缺陷+提高应急人员业务素质能力。<b>目的5个</b>=检验预案/锻炼队伍/磨合机制/宣传教育/完善准备。<b>原则4个</b>=符合相关规定/切合企业实际/注重能力提高（<span class="hl">练响应能力不是知识水平</span>）/确保安全有序。<b>形式两种</b>=<span class="hl">桌面演练</span>（交互式讨论+图面沙盘模拟+不动实物）/<span class="hl">现场演练</span>（选择或模拟设备设施装置场所+<span class="hl">先设定事故情景</span>+依据预案模拟——企业常做火灾逃生）。<b>内容</b>=单项演练/综合演练（预警报告指挥协调全流程）。<b>计划</b>=目的+类型+时间地点+主要内容（<span class="hl">不含演练效果评价——那是结束后的事</span>）。<b>准备</b>=成立机构+编制演练文件<span class="hl">五样＝方案+脚本+评估方案+保障方案+观摩手册</span>。<b>实施</b>=熟悉任务角色+组织预演+<span class="hl">安全检查（不能因演练形成新风险）</span>+演练记录（<span class="hl">安排专人用文字照片音像记录</span>）+结束由<span class="hl">演练总指挥宣布</span>。<b>评估总结归档备案</b>：评估=<span class="hl">现场点评或书面评估</span>，评估报告重点=<span class="hl">组织实施+目标实现+参演人员表现+暴露的问题</span>；总结=概要+问题+经验教训+管理建议；归档=图片视频音频；<span class="hl">主管部门要求组织的演练结束后资料报备案</span>。<b>持续改进</b>=演练评估报告的改进建议→由<span class="hl">预案编制部门</span>按程序修订完善。` },

{ id:'m9', tab:'项目现场管理', grp:'📗 管理篇', day:'9/10 上午', title:'第九章 通信工程项目的安全生产管理',
  law:'题库47题 · 四部分：安全生产责任＋技术管理＋现场管理＋分包管理',
  quiz:'09第九章.html', html: `
<h3>一、项目安全生产责任（五方主体）</h3>
<div class="blk">老师开章先重复<span class="hl">三必须</span>：管行业必须管安全、管业务必须管安全、管生产必须管安全——管这三方面的人都必须管安全。习总书记要求落实<span class="hl">党政同责、一岗双责、齐抓共管</span>。通信工程建设五方主体＝建设单位、勘察单位、设计单位、施工单位、监理单位（老师：实际勘察设计基本是同一家，所以也可以说是四方），都要执行国家标准、行业标准和通信工程建设<span class="hl">强制性标准</span>。</div>
<div class="blk"><b>建设单位责任</b>：①<span class="hl">每年至少组织一次应急演练</span>（老师提醒：建设单位也要组织演练，别以为只有施工单位演）②安全费<span class="hl">不得删减</span>，合同中明确<span class="hl">支付方式、数额和时限</span>，<span class="hl">开工1个月内至少支付50%</span>安全生产费用（22年标准反复强调）③开工前部署安全生产举措措施＋明确相关单位责任＋<span class="hl">对持证上岗的人员和作业进行核验</span>（老师案例：招标时安排的人什么证都有，施工单位劳务单位真派来的人啥证都没有——所以建设单位开工前必须核验）④不得随意压缩<span class="hl">合同约定工期或合理工期</span> ⑤不得明示或暗示施工单位<span class="hl">购买指定产品</span>。<div class="kd">📌 考点：开工1个月内付≥50%安全费是9/9、9/10两天反复强调的数字；「核验持证上岗」的主体是建设单位，监理单位在监理过程中也要检验作业人员上岗资格（人证匹配）——两个单位都有核验动作，题干换主体不换动作。</div></div>
<div class="blk"><b>勘察设计单位</b>：勘察成果<span class="hl">真实准确</span>（勘察单位对勘察结果负责、设计单位对设计负责），勘察作业时保证作业人员自身安全＋管线、建筑物及其他设施安全。设计单位依照法律法规、强制性标准<span class="hl">和勘察成果文件</span>进行设计（老师强调：这里比一般表述多了「勘察成果文件」）；对施工<span class="hl">重点部位和环节在设计文件中注明</span>＋对防范事故提出指导意见；<span class="hl">设计交底环节向施工单位详细说明</span>安全风险防范措施；四新（新工艺新设备新材料新结构）在设计文件中提出保证安全生产的意见和建议；编制概预算时安全费<span class="hl">全额列出</span>。</div>
<div class="blk"><b>监理单位</b>：对整个工程建设承担<span class="hl">监理责任</span>，依据法律法规、强制性标准和监理实施规范开展工作。<span class="hl">5类人持证上岗</span>：单位主要负责人、项目总监理工程师、专业监理工程师、现场监理员、安全监理人员。编制<span class="hl">监理规划和监理实施细则</span>，配置安全监理人员；审查施工组织设计中的安全技术措施和危大工程专项施工方案（看是否符合<span class="hl">工程建设强制性标准和操作规范</span>），并<span class="hl">监督施工单位按方案落实执行</span>；检验作业人员持证上岗情况；发现隐患要求整改；情节严重（老师举例：所有人都没有登高证又涉及登高）→<span class="hl">暂停施工＋向建设单位报告</span>（信息化手段或书面两种方式）；施工单位拒不整改→<span class="hl">书面报告通信管理局</span>（向通管局必须是书面，向建设单位可以信息化或书面）。<div class="kd">📌 考点：题库9题「多家单位同时作业时由建设单位协调作业顺序（可委托监理）」；报告方式是高频坑——对建设单位：信息化或书面；对通管局：书面。</div></div>
<div class="blk"><b>分包与施工单位</b>：分包单位在<span class="hl">资质等级许可范围内</span>承揽工程，主要负责人对本单位安全生产全面负责。施工单位：严格按强制性标准和安全生产操作规范施工＋按规定<span class="hl">配备专职安管人员</span>（现场由安全生产考核合格人员监督）＋特种作业人员<span class="hl">100%持证</span>＋提供符合国标行标的防护用品并<span class="hl">书面告知危险岗位操作规程和违规操作的危害</span>；危险作业（有限空间、动火、高处、带电）除防护用品外还要配器材：<span class="hl">气体检测报警仪</span>（有限空间）、<span class="hl">消防器材</span>（动火）、<span class="hl">防护绳</span>（高处，或安全带）、<span class="hl">防触电器具</span>（带电）；各种口设置<span class="hl">符合国家标准的安全警示标志放在显著位置</span>。</div>
<h3>二、项目安全生产组织与管理原则</h3>
<div class="blk"><b>安全领导小组</b>：实施总承包的要成立项目<span class="hl">安全管理领导小组</span>，由总包＋专业承包＋劳务分包单位的<span class="hl">项目经理、技术负责人、专职安管人员</span>共同组成，承担项目安全管理职责；没有成立领导小组的，<span class="hl">由项目部履行</span>。施工单位向项目<span class="hl">委派专职安全生产管理人员</span>监督落实（现场专职安全员由施工单位委派，对本单位负责）。领导小组职责教材197~198页（编制安全技术措施方案、应急预案等）。</div>
<div class="blk"><b>项目专职安管人员</b>：<span class="hl">每天到现场</span>开展安全检查（不是远程）；发现违章指挥违章作业<span class="hl">必须现场制止</span>；危大工程专项方案实施要做好记录；发现问题能处理的立即处理、不能处理的立即向上汇报；检查处理情况<span class="hl">记录档案</span>，定期向企业报告项目安全生产情况。<div class="kd">📌 考点：题库1/2题——施工现场专职安管由「施工单位」委派（建设单位监理无权委派施工方的安全员）；分包现场专职安全员由分包单位自行委派（谁用工谁负责）。</div></div>
<div class="blk"><b>四个管理原则</b>：①<span class="hl">安全考核一票否决（100-1=0）</span>——适用于通信工程项目管理：项目部各项指标考核、工作成绩评价和经济利益分配时，必须首先考虑安全生产指标完成情况，安全指标没完成可以一票否决其他指标 ②<span class="hl">管生产必须管安全</span> ③坚持目标管理——安全管理内容含<span class="hl">人、机、料、环、法</span>五方面，项目部针对五方面危险性因素制定管理目标并针对性管理 ④坚持过程管控。</div>
<h3>三、项目技术管理（八个针对性）</h3>
<div class="blk">通信工程专业多（管线、设备、室内室外、长途跨省），同类工程也有差异，所以安全技术措施编制<span class="hl">必须有针对性、结合工程特点</span>，在<span class="hl">开工前经过现场考察</span>的基础上编制。八个针对：①不同<span class="hl">工程特点</span>可能造成的施工危害 ②不同<span class="hl">施工方法</span> ③不同<span class="hl">分部分项工程</span>的不安全因素 ④各种<span class="hl">机械设备</span>（吊车、推土设备、挖沟机、地下钻）的危险因素 ⑤<span class="hl">有毒有害易燃易爆作业</span>（硫酸、炸药）可能的伤害 ⑥<span class="hl">施工现场及周边环境</span> ⑦不同<span class="hl">季节和地区</span>施工特点 ⑧<span class="hl">四新</span>（新技术新工艺新材料）要研究其规律方法特性，必要时咨询设计和其他有关部门。另有防火、防毒、防爆、防尘等通用措施。<div class="kd">📌 考点：题库4题——居民稠密区、重要交通路口、铁路沿线、变电站附近等周边环境作业需要编制相应安全技术措施（绿化区不算）；「施组以单位工程为对象编制」。</div></div>
<h3>四、专项施工方案＋四类作业技术保障</h3>
<div class="blk"><b>专项施工方案</b>：在编制施工组织设计的基础上，针对<span class="hl">危险性较大的施工作业活动</span>单独编制的安全技术文件（「在施组基础上衍生」说反了就是坑——专项方案是单独编制）。通信工程中达到一定规模的<span class="hl">拆除工程、起重吊装工程、土方开挖工程</span>应编制专项方案；<span class="hl">割接和临时用电工程参照专项方案要求</span>编制割接方案和临时用电方案。内容9部分：工程概况、编制依据、施工计划（<span class="hl">进度计划＋材料设备购置计划</span>）、施工工艺、施工安全保证措施（<span class="hl">组织保障＋技术措施＋监测监控</span>）、施工管理、检查验收标准等。三方责任分工：建设单位＝<span class="hl">监督责任</span>、监理单位＝<span class="hl">监理责任</span>、施工单位＝<span class="hl">直接管理责任</span>；多家施工单位共同施工由<span class="hl">建设单位和监理单位协调作业顺序</span>。<span class="hl">项目经理对专项施工作业安全生产负全面领导责任</span>；方案经<span class="hl">施工单位技术负责人和总工程师双签字</span>后方可实施；作业人员购买意外险＋配备防护用品＋培训合格上岗＋特种持证；作业前技术交底＋设置警示标志＋设置消防通道逃生救援通道；<span class="hl">作业前制定应急预案</span>；建立安全技术文档；<span class="hl">专项施工作业不得立体交叉作业</span>。<div class="kd">📌 考点：施工计划不含「资金配备计划」（见资金即排除）；安全保证措施不含「事故处理方法」（那是事后）；题库10题项目经理负「领导」责任。</div></div>
<div class="blk"><b>拆除作业（先次后主）</b>：总原则记四个字<span class="hl">「先拆次要、后拆主要」</span>。局站通信设备拆除顺序：先拆<span class="hl">备用</span>电路后拆主用、先拆<span class="hl">支路</span>后拆群路、先拆<span class="hl">线缆</span>后拆设备、先拆<span class="hl">设备</span>后拆走线架；拆除前核对、完成后清点＋明细记录＋清理现场＋办理交接手续。线缆拆除：戴防滑手套＋拆前<span class="hl">逐条核验确认无业务</span>＋贴醒目拆除标签＋两端<span class="hl">做好绝缘防护</span>＋按规格型号长度分类排放指定地点；拆尾纤不得影响其他尾纤运行。设备拆除：通过<span class="hl">网管中心逐一核实</span>设备位置→<span class="hl">先切断供电电源</span>（断错了要立即按一级预案恢复）→统一标记→再拆除；防碰撞，拆设备板件戴<span class="hl">防静电手环</span>；标识记录归类摆放，可重复利用的搬到指定地点。走线架拆除：先核实机房内走线架数量布置再定方案，做好<span class="hl">防尘</span>（消防空调气体喷头保护），完毕查漏水损坏。天线及室外单元拆除：施工前检查整体情况＋<span class="hl">制定吊装方案</span>＋专人协同业主对站点摸底＋做好周边居民工作；用电气焊明火要<span class="hl">动火审批</span>，在批准的时间指定的地点作业；用电机具仪表做好接地保护；<span class="hl">夜间施工大功率灯泡不得靠近易燃物</span>；警示隔离带画禁区；高空作业<span class="hl">安全带牢固</span>（老师：24年就出过高空作业安全带问题的事故）。<div class="kd">📌 考点：题库11题——天线及室外单元拆除遇六级及以上大风应立即停工（「快速完成当前作业再停工」是错误做法）；拆除接地线：先拆导体端后拆接地端（装设相反）。</div></div>
<div class="blk"><b>起重吊装</b>：四个严禁——<span class="hl">严禁有人在吊臂下停留或走动</span>、<span class="hl">严禁在吊具或被吊物上载人</span>、<span class="hl">严禁作业人员在吊装物上配重找平衡</span>、<span class="hl">严禁吊拉固定在地面或设备上的物件</span>；起吊物重量不清楚时<span class="hl">先试吊</span>；设备停放位置离沟渠基坑<span class="hl">足够安全距离</span>，土质松软采取措施。架空电力线附近作业安全距离（<span class="n">1kV以下1.5米｜6~10kV 2米｜35~110kV 4米｜220kV 6米</span>，老师：1.5、2.0、4.0、6 要记住）。<div class="kd">📌 考点：题库93/94题就考 10kV→2米、35kV→4米；注意这是「吊车与输电线路」的距离表，与高处作业带电体距离表（第十二章）不是一张表。</div></div>
<div class="blk"><b>土方开挖</b>：施工前施工单位按批准的设计位置向有关部门<span class="hl">办理挖掘手续</span>；人工开挖土方和路面时相邻作业人员距离保持<span class="n">2米</span>以上。必须支撑护土板的情形：空沟坑<span class="hl">距离机动车道较近</span>、与其他沟<span class="hl">交叉或平行距离较近</span>、<span class="hl">不能按规定放坡且距离建筑物或设施较近</span>、沟坑<span class="hl">低于地下水位或在回填土</span>等地段。挖出土石<span class="hl">不得堆放在消防井、油桶、水井等盖上</span>；沟坑边缘60厘米以内禁止堆放土石方，80厘米以外堆放；<span class="n">一侧出土不超过1.5米、两侧出土不超过1米</span>。<div class="kd">📌 考点：题库12题护土板情形是多选高频；「挖出的土石不得堆在消防栓井上」单独考过；13章题库口径「土石应堆放在距沟坑边沿60厘米以外」。</div></div>
<div class="blk"><b>割接作业</b>：割接前要有<span class="hl">割接方案（审批很严格）＋应急预案</span>；电源设备临时通电时<span class="hl">加假负载</span>，经试运行可靠后才能替换；操作人员使用<span class="hl">绝缘工具或绝缘处理后的工具</span>；带电操作<span class="hl">现场必须有专人监护</span>（监护人须具备带电作业资格有实践经验）；新设备安装前把设备<span class="hl">开关处于关的位置</span>；设备加电必须<span class="hl">穿绝缘鞋戴绝缘手套、两人互相配合</span>（老师案例：有分公司施工单位没戴绝缘手套出了事）；<span class="hl">沿电流方向逐级加电</span>、逐级测量并留存测试记录；双路供电<span class="hl">先割接备用电源线再割接主用</span>（先次后主）。<div class="kd">📌 考点：题库13/14题——带电作业严禁无监护独立完成；监护人由具备带电作业资格且有实践经验的人员担任（班组长/培训过/技术人员都不够格）。</div></div>
<div class="blk"><b>临时用电</b>：<span class="hl">三相五线制</span>；现场临时用电必须符合<span class="hl">三级配电结构</span>（总配电箱→分配电箱→开关箱）；每台用电设备<span class="hl">一机一箱一锁</span>，严禁同一开关箱直接控制两台及以上设备；必须采用<span class="hl">两级漏电保护</span>；安装、巡检、维修、移动或拆除临时用电设备和线路<span class="hl">由电工完成</span>（持证人员），穿绝缘鞋戴绝缘手套使用绝缘工具；<span class="hl">人孔内、天花板及竖井内等有电气危险环境电压不超过36伏</span>、作业两人以上配合。用电工具：用前检查，导线老化裸露不能用；使用<span class="hl">带漏电保护器的插座</span>，插头插座配套，不得将导线直接插入插孔；转移作业、上下传递用电工具<span class="hl">先切断电源</span>；手提手柄不得用导线拉扯；<span class="hl">易燃易爆场所必须使用防爆式</span>用电工具；带电设备上使用电动工具要用<span class="hl">隔离变压器</span>；<span class="hl">手电钻电锤不得戴手套</span>；装卸钻头先切断电源、完全停止转动后再装卸；移动式排风扇金属外壳及支架接地保护；<span class="hl">电焊机一次侧电源线≤5米、二次侧防水橡皮护套铜芯软电缆≤30米</span>；关焊机再切断电源，突然停电立即关闭电焊机；路面切割机手柄上装电源控制开关做好绝缘保护、电源线<span class="n">≤50米</span>、采用耐气温变化的橡胶皮护套铜芯软电缆、<span class="hl">一人操作一人随机整理电源线</span>（判断题「边收边整」是错的）、操作及整理人员戴绝缘手套穿绝缘鞋、放置平稳。<div class="kd">📌 考点：题库87题电焊机「一次侧≤5米」（张冠李戴到30米就错）；88题路面切割机「边操作边整理电源线」错误做法；千斤顶旋升最大行程不得超过丝杠总长的3/5。</div></div>
<h3>五、安全技术交底</h3>
<div class="blk">交底时间＝<span class="hl">工程施工前</span>（或作业人员进入施工地点之前），由<span class="hl">技术人员向施工作业班组或作业人员</span>交底。内容5方面：①工程项目施工作业特点和<span class="hl">危险因素</span> ②针对危险因素采取的<span class="hl">具体预防措施</span>（面向最一线人员要具体） ③<span class="hl">操作规程和标准</span> ④施工中注意的事项 ⑤发生事故后的<span class="hl">应急措施</span>。交完底<span class="hl">双方签字确认</span>；形式可以逐级或集中（没有强制要求），可以会议口头文字图像，但无论什么形式<span class="hl">都要形成交底记录＋双方签字＋全覆盖</span>（相关人员全面覆盖）。一次性交底是不够的：<span class="hl">重点危险作业施工前、或安全技术人员认为不交底难以保证施工正常进行时要及时交底</span>；通信工程重点危险作业＝<span class="hl">高空、人孔、大件运输、公路铁路作业</span>。总包对分包<span class="hl">两级交底</span>：总包<span class="hl">项目技术负责人</span>→分包相关负责人（签字）→分包相关负责人向<span class="hl">所有作业人员</span>交底，记录上报总包单位。<div class="kd">📌 考点：题库24题交底内容不含「事故处理报告」（事后）；25/26题时间点＝开工前＋作业班组进场前（投标前/竣工前不选）；「关键作业实施前」按教材口径不入选。</div></div>
<h3>六、施工现场安全管理</h3>
<div class="blk"><b>多单位现场</b>：两个以上施工单位→<span class="hl">建设单位明确各方职责，并对施工现场安全统一管理</span>（「指定其中一个施工单位统一管理」是错的——施工方之间无管理权）。现场管理内容：日常安全管理＋自觉接受监督检查＋按企业制度实施（安全目标＋责任制＋配置人财物＋技术措施＋检查整改隐患）＋<span class="hl">文明施工文明生活</span>＋确保消防安全（<span class="hl">确定消防安全责任人</span>＋制定消防制度和操作规程）＋组织应急救援抢险＋管理活动记录。<b>责任制7部分</b>：<span class="hl">项目经理是第一责任人</span>负责分解落实考核；领导小组由总分包项目经理技术负责人专职安管组成协调管理现场；<span class="hl">项目经理按规定到岗带班指挥生产</span>；分包服从总包；作业人员遵章做到四不伤害；专职安管按规定到岗履职（巡查＋三违记录＋危大监护记录＋建立项目安全档案＋编施组专项方案＋定期及时报告）。</div>
<div class="blk"><b>三点控制</b>：重点做好<span class="hl">危险点、危害点、事故多发点</span>三点控制，实行<span class="hl">挂牌制</span>（标明危险或危害性质、类型、定量、注意事项）。危险点＝比其他作业点更危险的点；危害点＝更具危害的点；事故多发点＝<span class="hl">曾经发生过或多次发生事故</span>的点。<b>三违</b>＝<span class="hl">不违章指挥、不违规操作、不违反劳动纪律</span>（视频口诀：违章指挥等于杀人、违章作业等于自杀、三违不除安全不保）。常见违章指挥：不履行职责、不按规定培训、<span class="hl">强令员工冒险违章作业</span>、隐患不处理放任自流；常见违规操作：不按规定佩戴防护用品、设备缺失不反馈直接操作、冒险进入危险区域；违反劳动纪律：迟到早退、干私活、不服从分配。<b>四不伤害</b>＝不伤害自己、不伤害他人、不被他人伤害、不使他人受到伤害（保护自己：保持良好状态＋着装防护齐全＋注意安全标识＋辨识危险有害因素）。<div class="kd">📌 考点：题库31/32题三点控制（「质量控制点」是干扰项）；33题「强令他人冒险进入危险区域」属违章指挥而非常见违规操作；34题帮助「不伤害他人」——主动告知隐患、分享经验、关注他人状态、虚心接受纠正。</div></div>
<div class="blk"><b>环境与文明施工</b>：室内不良环境（地面滑、作业狭窄）vs 室外（恶劣气候环境，同一施工区域不同时段不良因素可能不一样，不能完全依赖经验）。环保（通信工程建设环境保护技术暂行规定）：保护<span class="hl">植被、水源、自然和城市景观</span>；优先采用节能节水废物再生利用产品；线路建设<span class="hl">尽量减少林木砍伐</span>和天然植被破坏；<span class="hl">废弃沙石土必须运到规定专门存放地</span>堆放，不得向江河湖泊水库倾倒；山区丘陵埋设管道缆线采取<span class="hl">水土保持</span>措施；不得随意倾倒堆放固体废弃物；发现<span class="hl">地下文物立即报告文物管理部门</span>，未经批准<span class="hl">严禁开发名胜古迹和革命纪念地</span>；严禁使用持久性有机污染物做杀虫剂；跨河穿河施工可能妨碍行洪的要经有关部门批准。文明施工：责任制明确责任人＋制定措施＋<span class="hl">提前了解当地民风民俗</span>＋不野蛮操作＋办上岗证。<div class="kd">📌 考点：题库35题室内作业环境不良（恶劣气候属室外）；36/37题环保措施多选；「向废弃沟渠倾倒并植树种草」仍是违法倾倒。</div></div>
<h3>七、分包管理</h3>
<div class="blk"><b>三环节四方面</b>：防止资质低劣分包单位进入现场，从<span class="hl">源头抓起＋全过程控制</span>。三环节＝<span class="hl">分包单位资格评价和选择（事前）＋分包合同条款约定（事中）＋履约过程控制和结果再评价（事后）</span>。四方面＝明确双方责任＋严审资质和专业技术能力＋现场作业安全管理＋开展分包商安全评价。发包要以<span class="hl">企业名义</span>（不能以某部门名义）；明确<span class="hl">归口管理部门</span>统一管理发包工程；建立承包商安全管理制度；对不能履行安全职责甚至发生事故的分包商<span class="hl">考核直至清退</span>；同一项目多个分包商施工→签<span class="hl">专门安全管理协议</span>或合同注明各自职责，发包单位<span class="hl">统一协调和管理</span>。</div>
<div class="blk"><b>资质审查（两部分）</b>：<span class="hl">先业务资质审查（施工单位主管部门）→再安全资质审查（安全管理部门）→合格后报主管领导审批</span>。业务资质材料：准入审查表＋企业资质证明（营业执照、法定代表人证明书、税务登记、施工资质证书、特种作业证书、安全生产许可证）＋业绩（近三年同类工程数量或合同金额）。安全资质材料：安全资质审查表＋安全生产许可证＋职业安全健康管理体系证书＋<span class="hl">三管人员合格证书</span>＋<span class="hl">近两年安全业绩</span>。分包商要取得国家规定从业安全资质证书＋建立安全管理机构＋配备不少于一定比例专职安全员。</div>
<div class="blk"><b>现场管理与安全评价</b>：设备工具管理＋门禁管理（机房登记、防无关人员）＋安全交底与危害告知（含<span class="hl">泄漏、火灾、爆炸、中毒</span>等信息）＋对分包商<span class="hl">作业方案和作业安全措施进行审查、细化和补充</span>＋施工方案审查（组织机构、人员组成、技术方案、应急预案）＋安全教育培训＋全过程监督（用电管理、个人防护用品使用、文明施工）。<b>安全评价三内容</b>＝安全管理机构设置人员配置资格情况＋<span class="hl">违约记录违章记录</span>＋安全生产绩效。<div class="kd">📌 考点：题库38题同一项目多分包商由「总包单位」统一协调管理分包安全；39题总包对分包安全审核＝安全资质证书＋安全管理机构＋专职安全员配备比例；40题定期考核评价＝机构设置＋人员配置资格＋违约违章记录＋安全绩效（质量进度不算）。</div></div>
` },
];

const LSKEY = 'yuanwen_v1';
let st = { read:{}, last:'x0' };
try { const s = JSON.parse(localStorage.getItem(LSKEY)); if (s && s.read) st = s; } catch(e){}
function save(){ try { localStorage.setItem(LSKEY, JSON.stringify(st)); } catch(e){} }

function renderNav(){
  const nav = document.getElementById('nav');
  let h = ''; let lastGrp = '';
  SECTIONS.forEach(s => {
    if(s.grp !== lastGrp){ h += '<span class="grp">' + s.grp + '</span>'; lastGrp = s.grp; }
    const d = st.read[s.id] ? '<span style="color:#b8f0cd;font-weight:800">✓</span>' : '';
    h += '<button data-s="' + s.id + '" class="' + (s.id === st.last ? 'on' : '') + '">' + d + s.tab + '</button>';
  });
  nav.innerHTML = h;
  nav.querySelectorAll('button').forEach(b => b.addEventListener('click', () => go(b.dataset.s)));
}
function go(id){ stopSpeak(); st.last = id; save(); renderNav(); renderSec(); window.scrollTo({ top: 0 }); }
function renderSec(){
  const s = SECTIONS.find(x => x.id === st.last) || SECTIONS[0];
  const idx = SECTIONS.indexOf(s);
  const r = !!st.read[s.id];
  let links = s.quiz ? '<div class="golinks"><a href="刷题/精讲-' + s.quiz + '">✍️ 去刷对应章节题</a></div>' : '';
  let h = '<div class="card"><h2>' + s.title + '<span class="day">' + s.day + '</span></h2><div class="idline">' + s.law + '</div>' + links + s.html;
  h += '<div class="navrow"><button ' + (idx <= 0 ? 'disabled' : '') + ' onclick="go(SECTIONS[' + (idx-1) + '].id)">← 上一节</button><button ' + (idx >= SECTIONS.length-1 ? 'disabled' : '') + ' onclick="go(SECTIONS[' + (idx+1) + '].id)">下一节 →</button></div>';
  h += '<div class="donebar"><button class="' + (r ? 'off' : '') + '" onclick="toggleRead(\'' + s.id + '\')">' + (r ? '↩ 取消已读' : '✅ 回顾完成，标记已读') + '</button></div></div>';
  document.getElementById('app').innerHTML = h;
}
function toggleRead(id){ st.read[id] = !st.read[id]; save(); renderNav(); renderSec(); }
function renderProg(){
  const n = SECTIONS.filter(s => st.read[s.id]).length;
  document.getElementById('prog').innerHTML = '已读 <b>' + n + '</b> / ' + SECTIONS.length + ' 节';
}
let speaking = false;
function stopSpeak(){ speaking = false; try { speechSynthesis.cancel(); } catch(e){} const b = document.getElementById('ttsBtn'); if (b) b.textContent = '🔊 朗读本节'; }
function speakSection(){
  const app = document.getElementById('app');
  const text = app.innerText;
  const parts = text.split(/(?<=[。；！？])/);
  const chunks = [];
  let cur = '';
  parts.forEach(p => { p = p.trim(); if (!p) return; if ((cur + p).length > 180) { if (cur) chunks.push(cur); cur = p; } else { cur += p; } });
  if (cur) chunks.push(cur);
  if (!chunks.length) return;
  speaking = true;
  const b = document.getElementById('ttsBtn'); if (b) b.textContent = '⏹ 停止朗读';
  const u = new SpeechSynthesisUtterance();
  u.lang = 'zh-CN'; u.rate = 1.05;
  let i = 0;
  u.onend = function(){ if (speaking && i < chunks.length) { u.text = chunks[i++]; speechSynthesis.speak(u); } else { stopSpeak(); } };
  u.onerror = function(){ stopSpeak(); };
  u.text = chunks[i++];
  speechSynthesis.speak(u);
}
renderNav(); renderSec(); renderProg();
</script>
