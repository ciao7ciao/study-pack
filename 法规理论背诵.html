<script>
'use strict';
const SECTIONS = {
s1: { title: '① 《建设工程安全生产管理条例》', law: '国务院令第393号 · 全文8章71条（总则5/建设单位6/勘察设计监理8/施工单位19/监督管理8/应急救援6/法律责任16/附则3）', html: `
<h3 class="blk">一句话框架</h3>
<div class="big">这部条例管的是<b>「建工程时谁该干什么」</b>：建设单位出钱出资料、勘察设计保源头、监理盯方案查隐患、施工单位干活守规矩——四方各管一段，谁越位缺位谁挨罚。</div>
<h3 class="blk">四方责任（背这张表）</h3>
<table><tr><th>单位</th><th>核心义务</th><th>典型违规罚款</th></tr>
<tr><td><b>建设单位</b></td><td>提供管线气象等真实资料；安全生产费不打折、合同明确支付；不得压缩工期；拆除工程发包给有资质的并备案</td><td>20万~50万</td></tr>
<tr><td><b>勘察设计</b></td><td>按强制性标准设计；四新（新结构新材料新工艺）和特殊结构要提安全防范措施</td><td>10万~30万</td></tr>
<tr><td><b>监理</b></td><td>审查施组安措/专项方案（对照强制性标准）；一般隐患喊整改、严重隐患喊暂停+报建设单位；拒不停工报主管部门</td><td>10万~30万</td></tr>
<tr><td><b>施工单位</b></td><td>19条义务：设机构配专职安全员、教育培训、持证上岗、警示标志、专项方案、防护用具进场前查验等</td><td>按安法罚款；挪用安全费罚挪用额20%~50%</td></tr></table>
<h3 class="blk">注册执业人员三档</h3>
<div class="big">未执行强制性标准 → <b>停止执业 3 个月~1 年</b>；情节严重 → 吊销证书 <b>5 年不予注册</b>；造成重大安全事故 → <b>终身不予注册</b>。</div>
<div class="why"><b>为什么这么设计：</b>注册执业人员（建筑师/结构师等）签字即担责，处罚走「资格罚」而非单纯罚款——停你执业资格比罚钱更疼。</div>
<h3 class="blk">设备租赁与拆装</h3>
<div class="big">出租单位：机械设备要有<b>检测合格证明</b>才能出租，违规罚 <b>5 万~10 万</b>。拆装单位：要编拆装方案+安全措施+专业技术人员现场监督，违规/出具假证明罚 <b>5 万~10 万</b>。提供缺陷配件罚<b>合同价款 1~3 倍</b>。</div>
<div class="mem"><b>口诀：</b>「建设五十（万）设计十（到）三十，监理也是十到三十；出租拆装五到十，缺陷配件一比三；注册停业三月至一年，吊销五年终身不算」。<span class="hide">（点击遮住/显示）</span></div>
` },
s2: { title: '② 《生产安全事故应急条例》', law: '国务院令第708号 · 2019年2月17日公布，2019年4月1日起施行（注意：2019年9月1日施行的是《生产安全事故应急预案管理办法》修改决定，两个日期别混）', html: `
<h3 class="blk">一句话框架</h3>
<div class="big">这部条例管的是<b>「事故来之前ready不ready」</b>：预案要编、队伍要练、器材要养、现场要有人统一指挥。</div>
<h3 class="blk">核心义务清单</h3>
<table><tr><th>环节</th><th>要求</th></tr>
<tr><td>预案</td><td>主要负责人组织编制并实施，对预案真实性、实用性负责（不是技术负责人！）</td></tr>
<tr><td>演练与培训</td><td>定期组织演练；对从业人员开展应急教育和培训</td></tr>
<tr><td>物资</td><td>应急器材设备物资经常性维护保养——否则按《突发事件应对法》追责</td></tr>
<tr><td>响应</td><td>现场指挥部实行<b>总指挥负责制</b>，参与救援一律服从统一指挥</td></tr>
<tr><td>信息库</td><td>县级以上政府建应急预案信息库，可请求邻近救援队伍支援</td></tr></table>
<div class="mem"><b>口诀：</b>「主要负责人编预案，演练培训不能懒；器材维护要经常，总指挥说了算」。<span class="hide">（点击遮住/显示）</span></div>
` },
s3: { title: '③ 《生产安全事故报告和调查处理条例》', law: '国务院令第493号 · 事故等级「3-13-15-151」记忆法', html: `
<h3 class="blk">事故等级四档（一道必考题）</h3>
<table><tr><th>等级</th><th class="c">死亡</th><th class="c">重伤</th><th class="c">直接经济损失</th><th>调查主体</th></tr>
<tr><td><b>一般</b></td><td class="c">&lt;3 人</td><td class="c">&lt;10 人</td><td class="c">&lt;1000 万</td><td>县级政府</td></tr>
<tr><td><b>较大</b></td><td class="c">3~9</td><td class="c">10~49</td><td class="c">1000 万~5000 万</td><td>设区的市级政府</td></tr>
<tr><td><b>重大</b></td><td class="c">10~29</td><td class="c">50~99</td><td class="c">5000 万~1 亿</td><td>省级政府</td></tr>
<tr><td><b>特别重大</b></td><td class="c">≥30</td><td class="c">≥100</td><td class="c">≥1 亿</td><td>国务院或授权部门</td></tr></table>
<div class="mem"><b>口诀：</b>「313、151、151」——死亡看 3 和 10（3~9 较大、10~29 重大），重伤看 10/50/100，钱看 1000 万/5000 万/1 亿。以上含本数。<span class="hide">（点击遮住/显示）</span></div>
<h3 class="blk">报告链条与时限</h3>
<div class="big">现场人员<b>立即</b>报本单位负责人 → 负责人 <b>1 小时内</b>报县级以上安监部门和负有安全监管职责的部门；情况紧急时现场人员可<b>越级直报</b>。监管部门逐级上报<b>每级不超 2 小时</b>。伤亡变化补报：<b>30 日</b>内（道路交通/火灾 7 日）。调查期间负责人不得擅离职守。</div>
<h3 class="blk">调查规则</h3>
<div class="big">调查按级别分工（见上表）；事故发生地政府主导，事故单位所在地政府派人参加；伤亡人数升级的，<b>上级政府可另行组织调查</b>；无人员伤亡的一般事故，县级政府可<b>委托事故单位</b>自己调查。</div>
<div class="why"><b>为什么「30日/7日」：</b>人受伤后可能抢救无效死亡，30 日内伤情变化要补报升级；交通事故和火灾处置快、结论早，所以只有 7 日。</div>
` },
s4: { title: '④ 《通信建设工程安全生产管理规定》', law: '工信部 2025 年 51 号文（此文件整合了原 495 号等规定）· 安全生产费 + 事故报告 + 通管局职责', html: `
<h3 class="blk">安全生产费（数字考点密集区）</h3>
<table><tr><th>考点</th><th>规定</th></tr>
<tr><td>提取标准</td><td>建安费 <b>2%</b>（2022 年财政部办法从 1.5% 上调）</td></tr>
<tr><td>管理原则</td><td>筹措有章、支出有据、管理有序、监督有效；专项核算、专款专用，不得挤占挪用；年度赤字年末补齐</td></tr>
<tr><td>投标</td><td>安全生产费<b>不得作为竞争性报价</b>；投标报价要包含并<b>单列</b></td></tr>
<tr><td>支付</td><td>建设单位<b>开工日 1 个月内</b>支付至少 <b>50%</b>；总包对分包同样开工 1 个月内支付至少 50%，直接支付并监督使用；分包不重复提取</td></tr>
<tr><td>结余</td><td>结算后结余<b>退回建设单位</b></td></tr>
<tr><td>使用范围（2022新增）</td><td>风险分级管控与隐患排查支出、信息化建设运维、隐患报告奖励、安责险支出</td></tr></table>
<h3 class="blk">事故报告（通信行业特殊时限）</h3>
<div class="big">施工单位 <b>1 小时内</b>报省通管局 → 通管局 <b>2 小时内</b>报工信部（较大及以上事故）；一般事故按月汇总，<b>每月初 5 个工作日内</b>书面报工信部。施工现场<b>没有建设单位人员</b>时：施工单位立即告知建设单位 → 由建设单位报通管局。涉死亡举报线索转县级以上政府处理。</div>
<h3 class="blk">通管局职责（多选题库）</h3>
<div class="big">贯彻执行法规标准 / 监督指导全国通信建设安全 / 监督检查安全费计列支付提取使用 / 通报制度 / 监督管理安管人员 / 参加事故调查处理 / 向社会公布举报电话信箱。</div>
<div class="mem"><b>口诀：</b>「安全费两%、开工一月付一半；施工一小时报通管，通管两小时报工信；一般事故按月报」。<span class="hide">（点击遮住/显示）</span></div>
` },
s5: { title: '⑤ 《安管人员考核管理规定》', law: '工信部 2016 年 255 号（A/B/C 三类证书）', html: `
<h3 class="blk">三类人与证书</h3>
<div class="big"><b>A 证＝企业主要负责人</b>（法定代表人、总经理、分管安全生产副总、企业技术负责人）；<b>B 证＝项目负责人</b>（法定代表人授权）；<b>C 证＝专职安全生产管理人员</b>。证书统一制作、统一编号、<b>全国有效</b>。</div>
<h3 class="blk">考核条件</h3>
<table><tr><th>证书</th><th>年龄</th><th>学历</th><th>工作年限</th></tr>
<tr><td class="c">A 证</td><td>60 岁以内（企业主要负责人本人不受此限）</td><td>大专以上，或中级以上职称</td><td>通信工程建设满 3 年</td></tr>
<tr><td class="c">B 证</td><td>—</td><td>大专以上</td><td>施工管理 3 年以上</td></tr>
<tr><td class="c">C 证</td><td>—</td><td>中专以上</td><td>通信工程建设 2 年以上</td></tr></table>
<div class="big">申请考核之日前 <b>1 年内</b>，无一般及以上等级安全事故的责任记录——时限 1 年、门槛「一般及以上」，两个数字都考过。</div>
<h3 class="blk">证书管理</h3>
<div class="big">有效期 <b>3 年</b>，期满<b>前 3 个月</b>内申请延续，通管局 <b>20 个工作日</b>内核发/延续；延续条件＝无行政处罚+无不良记录+教育培训合格。变更受聘企业：与原单位解约→向核发通管局申请；跨省变更：向变更后所在地通管局申请。<b>换证书类型要重新考核</b>，一人只能持一类证书。隐瞒/虚假材料申请→1 年内不得再申请；涂改倒卖出租证书→通报批评。</div>
<h3 class="blk">专职安全员配备（三个维度）</h3>
<table><tr><th>维度</th><th>分档</th></tr>
<tr><td>按建筑面积（建筑/装修）</td><td>&lt;1 万㎡:1 人；1~5 万㎡:2 人；&gt;5 万㎡:3 人+按专业配</td></tr>
<tr><td>按合同价</td><td>&lt;5000 万:1 人；5000 万~1 亿:2 人；≥1 亿:3 人+按专业配</td></tr>
<tr><td>按劳务分包人数</td><td>&lt;50 人:1 人；50~200 人:2 人；&gt;200 人:≥3 人且≥总人数 5‰</td></tr></table>
<div class="mem"><b>口诀：</b>「A3B3C2 三年证；一年清白才能考；面积一万起一二三；合同五千万一二三；五十两百劳务一二三；专安员天天巡现场」。<span class="hide">（点击遮住/显示）</span></div>
<div class="why"><b>易混点：</b>专职安管员每天检查现场、监督危大工程专项方案实施；企业安管机构检查项目负责人和专职安管员的履职（记企业档案）；专管员现场检查记项目档案——两个「档案」别搞混。通信主管部门现场检查至少<b>两人</b>，不得妨碍正常经营。</div>
` },
s6: { title: '⑥ 《安全生产许可证管理规定》', law: '建设部令第 128 号（建筑施工企业）· 有效期与变更', html: `
<h3 class="blk">数字三连</h3>
<div class="big">有效期 <b>3 年</b>；变更名称/地址/法定代表人 → <b>10 日内</b>办变更手续；期满需延续的<b>提前 3 个月</b>申请。</div>
<h3 class="blk">暂扣 vs 吊销</h3>
<table><tr><th>情形</th><th>处罚</th></tr>
<tr><td>发生较大事故</td><td><b>暂扣</b>许可证</td></tr>
<tr><td>不再具备安全生产条件且情节严重</td><td><b>吊销</b>许可证</td></tr>
<tr><td>未取证擅自生产</td><td>责令停止、没收违法所得+罚款</td></tr>
<tr><td>期满未延续继续施工</td><td>责令停业、限期补办+罚款</td></tr></table>
<h3 class="blk">取证条件（多选高频）</h3>
<div class="big">安全制度操作规程完备 / 安全投入满足需求 / 管理人员和作业人员<b>每年至少一次</b>培训考核合格 / 依法参加工伤保险 / 退还意外伤害保险（现行口径为施工单位自主办理，不再是许可前置）/ 厂房作业场所设施符合安全标准 / 有职业病危害防治措施等 12+ 条件。<b>「意外伤害保险」不再是许可前置条件</b>是新版考点。</div>
<h3 class="blk">安全费不得竞争</h3>
<div class="big">建设工程安全生产费<b>不得作为竞争性报价</b>——招标时删掉安全费压价＝违法。报价要包含且单列。<div class="tip">出处：工信部51号文第十四条、财资〔2022〕136号第十七条（不是128号令，出题若问出处按这两个答）。</div></div>
<div class="mem"><b>口诀：</b>「许可三年十日变更；较大暂扣严重吊；意外险不再是门槛；安全费用不竞标」。<span class="hide">（点击遮住/显示）</span></div>
` }
};
function render(key){
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.s === key));
  const s = SECTIONS[key];
  document.getElementById('app').innerHTML = '<div class="sec on"><h2>' + s.title + '</h2><div class="law">' + s.law + '</div>' + s.html + '</div>';
}
