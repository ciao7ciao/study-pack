,{"type":"多选","stem":"常用的防止事故发生的安全技术措施有 （　）","options":["设置薄弱环节","消除危险源","限制能量或危险物质","个体防护、避难与救援","减少故障和失误"],"answer":"BCE","why":"防止事故发生的安全技术措施包括消除危险源、限制能量或危险物质、隔离、减少故障和失误；设置薄弱环节、个体防护与避难救援属于减少事故损失类，不能混入本组，故选BCE。"},{"type":"多选","stem":"工程中常用的减少事故发生的安全减少措施有（　）","options":["隔离","使用专用工具","个体防护","避难与救援","配备专职安全员"],"answer":"ACD","why":"减少事故损失的安全技术措施包括隔离、个体防护、避难与救援；使用专用工具属工器具管理，配备专职安全员属人员配备手段，均不属于安全技术措施分类，故选ACD。"},{"type":"多选","stem":"常用的减少事故损失的安全技术措施有 （　）","options":["设置薄弱环节","消除危险源","限制能量或危险物质","个体防护、避难与救援","减少故障和失误"],"answer":"AD","why":"减少事故损失的措施包括设置薄弱环节（如易熔塞、爆破片）、个体防护、避难与救援；消除危险源、限制能量、减少故障失误属防止事故发生类。口诀：防发生靠消除限制，减损失靠薄弱防护救援。"},{"type":"单选","stem":"即可以防止事故发生,也可以防止事故扩大,减少事故损失的安全技术措施是 （　）","options":["限制能量或危险物质","设置薄弱环节","隔离","安全设计"],"answer":"C","why":"隔离既可把人员与危险源分开、防止事故发生，又可在事故发生后阻止波及、减少损失（如防爆墙、防护罩），攻防兼备；限制能量、设置薄弱环节只侧重单一方面，故选C。"},{"type":"单选","stem":"下列作业活动中,应编制专项施工方案的是 （　）","options":["在室外环境进行的光缆接续作业","在机房内进行机架安装作业","直埋线路挖 3m 深降水坑作业","连接新装机房设备的电源线作业"],"answer":"C","why":"依据危大工程管理规定，开挖深度3米及以上的基坑（槽）土方开挖属危险性较大的分部分项工程，须编制专项施工方案；光缆接续、机架安装、接电源线属常规作业。数字考点：3米编方案。"},{"type":"单选","stem":"下列作业活动中,应编制专项施工方案的是 （　）","options":["在室外进行的光缆接续作业","在机房内进行机架安装作业","在郊外开挖 4m 深人孔坑作业","连接新装机房的电源线作业"],"answer":"C","why":"郊外开挖4米深人孔坑超过3米临界值，属危险性较大的分部分项工程，须编制专项施工方案；光缆接续、机架安装、接电源线为常规作业。记忆口诀“3米编方案、5米加论证”。"},{"type":"单选","stem":"下列作业活动中,应编制专项施工方案的是（　）","options":["在野外地形复杂的地段接续光缆","在新机架内敷放电缆","在与多条管线交越处开挖管道沟","机房电源线割接作业"],"answer":"C","why":"与多条管线交越处开挖管道沟，交叉作业风险高、易损伤既有管线引发次生事故，属危险性较大作业，须编制专项施工方案；野外接续、机架内布放电缆、电源线割接属常规作业，故选C。"},{"type":"多选","stem":"下列作业活动中,应编制专项施工方案的是（　）","options":["在复杂环境光缆接续作业","在走线架上布放电缆作业","使用起重机吊装铁塔作业","新机房电源系统割接作业","直埋线路的水下冲槽作业"],"answer":"CDE","why":"使用起重机吊装铁塔属起重吊装作业、新机房电源系统割接涉现网安全、直埋线路水下冲槽风险大，均应编制专项施工方案；复杂环境光缆接续、走线架布放电缆为常规作业。口诀：吊装、割接、水下要专项。"},{"type":"单选","stem":"开挖深度（　）的基坑(槽)的土方开挖工程不仅需要编制专项施工方案,还需要专家论证。","options":["2.5m","3m","5m","6m"],"answer":"C","why":"依据《危险性较大的分部分项工程安全管理规定》，开挖深度5米及以上的基坑（槽）属超过一定规模的危大工程，专项方案须组织专家论证；3米以上5米以下只编方案不论证。口诀“3编5论”。"},{"type":"单选","stem":"企业编制安全技术措施计划的牵头部门应该是 （　）,其他部门参与。","options":["财务部","人力资源部","安全生产管理部门","工会"],"answer":"C","why":"安全技术措施计划专业性和政策性强，应由安全生产管理部门牵头编制，财务、人力资源、工会等部门参与配合；财务管资金、人力管人员、工会监督，都不是牵头主体，故选C。"},{"type":"单选","stem":"企业安全技术措施计划的项目范围中,配备防尘、防毒、降温、防寒等装置或设施,属于（　）","options":["安全技术措施","卫生技术措施","保障技术措施","安全宣传教育措施"],"answer":"B","why":"防尘、防毒、降温、防寒等装置设施着眼于改善劳动卫生条件、保护职工身体健康，属卫生技术措施；安全技术措施针对触电、机械伤害等人身伤害，宣传教育措施指培训教育类项目，故选B。"},{"type":"单选","stem":"安全生产教育培训应针对不同的培训对象,在合适的时间,进行)特点。相应内容的培训。这体现了安全生产教育培训的（　）","options":["长期性","全员性","针对性","多样性"],"answer":"D","why":"教材将“针对不同对象、合适时间、相应内容”归纳为教育培训的多样性特点，即培训形式与内容因人因时而异、多种多样；长期性指贯穿职业生涯，全员性指覆盖所有人员。针对性是最易误选项。"},{"type":"单选","stem":"下面关于安全生产教育培训时长的说法,正确的是 （　）","options":["所有管理人员和作业人员每两年至少进行一次","对新职工进行至少 30 小时培训,每年至少 20 学时的再培训","企业主要负责人和安全生产管理人员初次培训不得少于 30 学时每年再培训时间不得少于 12 学时","新上岗从业人员,岗前培训时间不得少于 24 学时"],"answer":"D","why":"依据《生产经营单位安全培训规定》，新上岗从业人员岗前安全培训不得少于24学时，D正确；主要负责人和安管人员初次培训应为32学时而非30，高危行业新职工为72学时；A“每两年一次”错误，培训应每年开展。"},{"type":"单选","stem":"通信施工企业应当对新招的施工人员进行岗前三级安全教育,培训时长不少于 （　）学时。","options":["2","20","24","32"],"answer":"D","why":"依据通信施工企业安全培训要求，新招施工人员岗前三级安全教育（公司、项目、班组）培训时长不少于32学时；24学时是一般生产经营单位的标准，施工企业从严执行32学时。数字考点：32。"},{"type":"单选","stem":"通信施工企业对新员工的岗前安全培训时间通常不应少于 （　）","options":["2 学时","24 学时","32 学时","40 学时"],"answer":"C","why":"通信施工企业对新员工的岗前安全培训通常不应少于32学时，与三级安全教育总时长要求一致；24学时为一般单位标准，40学时为干扰数字。记忆：通信施工岗前32学时。"},{"type":"判断","stem":"建筑企业要对新职工进行至少 30 学时的安全培训,每年进行至少 20 学时的再培训（　）","options":[],"answer":"错","why":"错。数字与规定不符：新职工岗前安全培训一般不少于24学时，主要负责人和安管人员初次培训为32学时、每年再培训不少于12学时；“至少30学时、每年20学时再培训”不是规定数字，易与高危行业72学时、再培训20学时混淆。"},{"type":"判断","stem":"安全生产教育培训考核不合格的人员,上岗后应及时补考。（　）","options":[],"answer":"错","why":"错。依据“先培训、后上岗”原则，安全生产教育培训考核不合格的人员不得上岗作业，必须经重新培训并补考合格后方可上岗；“先上岗后补考”颠倒了顺序，属违章安排上岗。"},{"type":"单选","stem":"某工程公司对新招收来的农民工进行线路专业的安全操作培训,随后进行了考试,王某因文化水平不高怕考试分数低面子不好看,由同乡李某代答后取得了上岗证,公司随即安排王某与李某参与线路工程施工作业。下面说法正确的是（　）","options":["王某可以参与施工作业","王某可以在李某的带领下上岗作业","王某不能参加施工作业","王某补考后就能上岗作业"],"answer":"C","why":"依据先培训后上岗原则，教育培训考核合格方可上岗；王某找人代考属考核不合格，不得参加施工作业，也不存在“带班上岗”或“先上岗等补考”的例外，故C正确；代考行为本身即违规。"},{"type":"多选","stem":"必须经安全生产教育培训考核合格后方可能上岗的人员有 （　）。","options":["休假结束后返岗的人员","进入新的工作岗位的人员","进入新的施工现场的人员","采用新技术、新工艺、新设备、新材料作业的人员","特种作业人员"],"answer":"BCD","why":"依据《建设工程安全生产管理条例》，进入新岗位、新施工现场前及采用新技术、新工艺、新设备、新材料作业前，须经安全生产教育培训考核合格方可上岗；休假返岗不涉及新风险，特种作业人员按持证管理，均不属本条情形。"},{"type":"多选","stem":"施工企业作人员应（　）,接受相应的安全生产教育培训","options":["在进入新的工资岗位之前","在进入新的施工现场之前","在采用新工艺、新材料、新设备时","在企业内整工作岗位时","在离岗两年以上重新上岗时"],"answer":"ABC","why":"依据《建设工程安全生产管理条例》，作业人员进入新岗位前、进入新施工现场前、采用新工艺新材料新设备时应接受相应安全教育培训；离岗复岗重新培训的门槛为离岗一年以上，“两年”表述错误，一般调岗不属该条列举情形。"},{"type":"单选","stem":"下列安全生产教育培训内容中,属于新上岗操作工人培训内容的是（　）。","options":["安全生产新技术、新知识、新方法","季节施工要求","紧急情况下应急救援的基本知识","作业场所和工作岗位存在的危险因素"],"answer":"C","why":"新上岗操作工人的培训内容侧重岗位安全基础与应急技能，如紧急情况下应急救援的基本知识，故选C；季节施工要求属经常性季节教育，新技术新知识属继续教育，危险因素告知属安全技术交底内容。"},{"type":"多选","stem":"安全生产教育培训内容中,属于安全生产继续教育内容的是（　）","options":["新工艺、新技术、新知识、新方法","新颁布的安全生产法律法规","安全技术标准、规范和规范性文件","先进的安全生产技术和管理经验","预防和减少事故风险的基本知识"],"answer":"BCD","why":"安全生产继续教育定位是“更新提高”：新颁布的安全生产法律法规、安全技术标准规范和规范性文件、先进的安全生产技术和管理经验属之；新工艺新技术属“四新”教育，预防事故基本知识属新上岗基础培训，故选BCD。"},{"type":"判断","stem":"企业的职工安全教育培训档案应涉及企业所使用的被派遣劳动者。（　）","options":[],"answer":"对","why":"对。依据《安全生产法》，生产经营单位使用被派遣劳动者的，应将其纳入本单位从业人员统一管理，保障其同等接受教育培训的权利，故安全教育培训档案应涵盖被派遣劳动者。"},{"type":"单选","stem":"企业施工人员的安全教育培训记录应（　） 保存、管理。","options":["企业的安全生产主管部门","企业的档案管理部门","企业的人力资源部门","施工人员所在的管理组织"],"answer":"D","why":"施工人员流动性强，其安全教育培训记录应由施工人员所在的管理组织建立、保存和管理，便于现场查验；与机关人员记录归安全生产主管部门保管形成对照。口诀“谁的人员谁建档”。"},{"type":"单选","stem":"企业机关人员的职工安全教育培训记录应（　） 管理和保存","options":["企业的安全生产主管部门","企业的档案管理部门","企业的人力资源部门","施工人员所在的管理组织"],"answer":"A","why":"企业机关人员相对固定，其职工安全教育培训记录应由企业安全生产主管部门统一管理和保存；施工人员记录则由所在管理组织保管，两类人员的归档口径不同，勿混淆。"},{"type":"多选","stem":"企业员工的日常安全教育活动应由 （　）组织实施。","options":["企业人力资源管理部","企业工程项目管理部","企业安全生产管理部","企业的工程项目部","企业的工会组织"],"answer":"CD","why":"日常安全教育活动贴近生产一线，由企业安全生产管理部和工程项目部组织实施；人力资源部门负责人事类培训，工程项目管理部是企业机关职能部门，不直接组织现场日常教育。注意区分“工程项目部”与“工程项目管理部”。"},{"type":"单选","stem":"企业新入职员工的职工安全教育培训记录应由 （　） 建立。","options":["企业人力资源管理部","企业工程项目管理部","企业安全生产管理部","新员工所在的项目部"],"answer":"C","why":"新入职员工由企业统一接收，其安全教育培训记录由企业安全生产管理部建立；所在项目部后续开展项目级、班组级教育，人力资源管理部负责人事档案而非安全培训档案，故选C。"},{"type":"多选","stem":"对于施工总承包工程项目,施工单位保证施工安全的安全生产投入主要包括 （　）。","options":["掌握安全施工要求的管理人员和作业人员","满足工程要求的机械设备","满足工程要求的劳动保护用品","满足工程要求的工程材料","工程需要的资金"],"answer":"ABCE","why":"安全生产投入主要包括掌握安全要求的管理和作业人员、机械设备、劳动防护用品及资金；工程材料服务于工程质量与进度，不属于安全生产投入范围。口诀“人机护金算投入，工程材料不算数”。"},{"type":"单选","stem":"通信建设工程安全费的提取标准应为 （　）","options":["建安费的 1.5%","施工费的 1.5%","建安费的 1%","施工费的 1%"],"answer":"A","why":"依据安全生产费用提取使用的有关规定，通信建设工程安全费按建筑安装工程造价（建安费）的1.5%提取；计提基数是建安费而非施工费，比例是1.5%而非1%。数字考点：1.5%。"},{"type":"多选","stem":"施工企业内部安全生产费用管理制度应明确安全费用的 （　）","options":["提取程序","使用程序","项目概算程序","使用范围","挪用程序"],"answer":"ABD","why":"企业内部安全费用管理制度应明确提取程序、使用程序和使用范围，实现全流程管控；项目概算程序属造价管理范畴，“挪用程序”是明显陷阱——安全费用专款专用，严禁挪用，故选ABD。"},{"type":"多选","stem":"关于安全生产费的管理要求,下列说法正确的是（　）","options":["企业应按照项目承包合同额的 1.5%收取安全生产费","安全生产费可采用由其他单位代管的方式集中管理和使用","企业应确保安全生产所需资金的投入并有效使用","企业应立安全生产费用分类使用台账,并定期统计","企业应编制安全生产费用使用计划"],"answer":"CDE","why":"A错在计提基数应为建安费的1.5%而非项目承包合同额；B错在安全费用必须专项核算、专款专用，不得由其他单位代管使用；确保资金投入并有效使用、建立分类使用台账并定期统计、编制使用计划均正确，故选CDE。"},{"type":"单选","stem":"施工单位必须依法参加工伤保险,为 （　） 缴纳保险费","options":["农民工","固定工","合同工","以上均包括"],"answer":"D","why":"依据《社会保险法》和《工伤保险条例》，工伤保险属强制性保险，施工单位必须为农民工、固定工、合同工等全部从业人员缴纳工伤保险费，不得选择性参保。口诀“全员参保，一个不能少”。"},{"type":"单选","stem":"张某在人井中确认资料,爬出人井时,被过往的汽车正巧撞上死亡。本次事故中张某家属可以获得的赔偿,说法正确的是 （　）","options":["交通事故的赔偿和工伤赔偿都能获得","只能获得交通事故的赔偿不能获得工伤赔偿","只能获得工伤赔偿不能获得交通事故赔偿","交通事故的赔偿和工伤赔偿都不能获得,只能获得意外伤害赔偿"],"answer":"C","why":"张某在作业过程中因工作原因死亡，依据《工伤保险条例》属“工作时间、工作场所内因工作原因受到事故伤害”的典型工伤情形，家属依法获得工伤保险赔偿；本题不适用上下班途中交通事故竞合赔偿规则，易误选A。"},{"type":"单选","stem":"施工单位带领劳务公司作业人员施工发生了事故,事故发生后,应由（　）负责向统筹地区社会保险行政部门提出工伤认定申请。","options":["建设单位","监理单位","施工单位","劳务公司"],"answer":"D","why":"依据《工伤保险条例》，工伤认定申请由职工所在单位即用人单位提出；劳务公司作业人员的劳动关系在劳务公司，故应由劳务公司在事故伤害发生之日起30日内提出申请。口诀“谁用工、谁申请”。"},{"type":"单选","stem":"员工受伤后,应在应当自事故伤害发生之日起（　） 内提出工作认定申请。","options":["5 日","30 日","一个月","一年"],"answer":"B","why":"依据《工伤保险条例》，所在单位应当自事故伤害发生之日起30日内提出工伤认定申请，特殊情况可适当延长；对比记忆：单位30日、工伤职工或近亲属1年，故选B。"},{"type":"单选","stem":"受伤人员在停工留薪期内,原工资福利待遇不变,停工留薪期最上不超过 （　）。","options":["个月","12","24 个月","36 个月"],"answer":"B","why":"依据《工伤保险条例》，受伤人员在停工留薪期内原工资福利待遇不变，停工留薪期一般不超过12个月；伤情严重经劳动能力鉴定委员会确认可延长，延长不得超过12个月。数字考点：12个月、待遇不变。"},{"type":"单选","stem":"事故中死亡员工的一次性工亡补助金的标准为 （　）","options":["上一年全国城镇居民人均收入的 20 倍","上一年全国城镇居民人均可支配收入的 20 倍","上一年统筹地区居民人均收入的 20 倍","上一年统筹地区城镇居民人均收入的 20 倍"],"answer":"B","why":"依据《工伤保险条例》，一次性工亡补助金标准为上一年度全国城镇居民人均可支配收入的20倍；干扰项把“可支配收入”偷换成“收入”、把“全国”偷换成“统筹地区”。数字口诀：全国、可支配收入、20倍。"},{"type":"单选","stem":"按照《安全生产责任保险实施办法》规定,下列说法正确的是（　）。","options":["企业主要负责人在工程中伤亡,其获取的保险金应高于普通员工","企业派遣制用工在工程中伤亡,其获取的保险金应与合同制员工相同","投保单位每伤亡一人,其获取的保险金赔偿额不得低于 20 万元","对未造成人员死亡事故的赔偿保险金额度,按实际治疗费赔偿"],"answer":"B","why":"依据《安全生产责任保险实施办法》，安责险覆盖全体从业人员且赔付同等待遇，派遣制用工与合同制员工赔付相同，B正确；每人死亡赔付限额不得低于30万元而非20万元，未死亡事故按合同约定赔付而非仅赔治疗费。"},{"type":"单选","stem":"劳动防护用品不同于一般的商品,直接关系到劳动者的生命安全和身体健康,生产经营单位为从业人提供的劳动防护用品必须符合（　）或行业标准。","options":["地方标准","国家标准","消防标准","劳安认证"],"answer":"B","why":"依据《安全生产法》，生产经营单位必须为从业人员提供符合国家标准或者行业标准的劳动防护用品；地方标准、消防标准、“劳安认证”均不是法定依据表述。口诀“国标或行标”，故选B。"},{"type":"单选","stem":"对于工程现场分包单位的作业人员,其安全防护用品由 （　） 提供。","options":["建设单位","总包单位","分包单位","其他单位"],"answer":"C","why":"分包单位是分包作业人员的用人单位，应自行为其提供合格的安全防护用品，总包单位负统一协调和监督管理责任；“谁用工、谁配备”，建设单位无配发义务。易误选B，总包是监督方不是配发主体。"},{"type":"单选","stem":"下面关于劳动防护用品的管理要求,说法正确的是 （　）","options":["从业人员可以自行报销采购劳动防护用品的发票","从业人员可以使用不低于国标要求的进口劳动防护用品","当气温过高时,施工人员可以不穿工作服","新员工在施工现场不操作时,可以不佩戴劳动防护用品"],"answer":"B","why":"使用性能不低于国标要求的进口劳动防护用品是允许的；防护用品应由单位统一采购发放，自行报销采购违规；高温天气、不操作时也不得免除佩戴义务，进入施工现场即须佩戴，故选B。"},{"type":"单选","stem":"下面关于劳动防护用品的选用要求,说法错误的是 （　）","options":["用人单位在选择劳动防护用品时,应考虑劳动者的作业方式和工作条件","用人单位在选择劳动防护用品时,应考虑其佩戴的合适性和基本舒适性","用人单位为劳动者配备劳动防护用品时需考虑作业现场的某些有害因素","用人单位应为流动性作业的劳动者,配备随身携带的个人应急防护用品"],"answer":"A","why":"选用劳动防护用品应针对作业现场的有害因素选型，考虑佩戴的合适性和基本舒适性，并为流动性作业人员配备随身携带的个人应急防护用品；A“考虑作业方式和工作条件”不符合规范选型依据的表述，故错误。"},{"type":"单选","stem":"下列特种设备的管理,错误的是 （　）","options":["特种设备使用单位应制定操作规程","特种设备使用单位应建立设备档案","特种设备使用单位应在检验合格证有效期届满前一个周提出检验要求","特种设备使用单位应对使用的特种设备经常性维护保养和定期检查"],"answer":"C","why":"依据《特种设备安全法》，特种设备应在检验合格有效期届满前1个月向检验机构提出定期检验要求，“提前一个周”错误；制定操作规程、建立设备档案、经常性维护保养和定期自行检查均为法定义务。数字考点：提前1个月。"},{"type":"多选","stem":"《特种设备安全法》规定,特种设备使用单位应配备的人员有（　）","options":["特种设备安全管理人员","特种设备检测人员","特种设备业务营销人员","特种设备作业人员","特种设备采购人员"],"answer":"ABD","why":"依据《特种设备安全法》，特种设备使用单位应配备安全管理人员、检测人员和作业人员，并进行必要的安全教育培训；业务营销人员、采购人员不属法定配备人员。口诀“管、检、作”三类，故选ABD。"},{"type":"单选","stem":"从事起重机械的 （　）不需要持《特种设备作业人员证》。","options":["安全管理人员","司机","指挥人员","项目负责人"],"answer":"D","why":"依据特种设备作业人员管理规定，起重机械的安全管理人员、司机、指挥（司索）人员均须持《特种设备作业人员证》上岗；项目负责人是项目管理岗位，不属特种设备作业人员，故选D。易误选C，起重指挥恰须持证。"},{"type":"单选","stem":"特种设备使用单位的特种设备安全管理负责人应持有证书是（　）","options":["一建","特种作业操作证","特种设备安全管理人员资格证","施工企业安全生产考核合格证"],"answer":"C","why":"特种设备安全管理负责人应持有特种设备安全管理人员资格证；一建是建造师执业资格，特种作业操作证由应急管理部门颁发，安全生产考核合格证是施工企业“三类人员”证书，均与特种设备管理岗不对口，故选C。"},{"type":"单选","stem":"特种设备使用单位特种设备安全管理负责人的责任不包括 （　）","options":["全面负责本单位特种设备安全管理的领导职责","组织制定特种设备安全管理制度","组织制定本单位特种设备事故的应急专项预案","落实特种设备安全管理机构设置"],"answer":"A","why":"“全面负责本单位特种设备安全管理”是使用单位主要负责人（第一责任人）的职责；安全管理负责人是协助层级，负责组织制定安全管理制度、编制事故应急专项预案、落实机构设置与人员配备。注意区分两个层级，故选A。"},{"type":"单选","stem":"特种设备使用单位特种设备安全管理员的责任不包括 （　）","options":["组织建立特种设备安全技术档案","办理特种设备使用登记","组织制定特种设备事故应急专项预案","组织开展特种设备安全教育和技能培训"],"answer":"C","why":"特种设备安全管理员负责具体事务：建立安全技术档案、办理使用登记、组织开展教育培训等；组织制定特种设备事故应急专项预案是安全管理负责人的职责，不属于安全管理员。口诀“员管具体事、负责人管预案”，故选C。"}]},{"file":"07第七章","title":"第七章","count":55,"questions":[{"type":"判断","stem":"从国际上的职业健康安全体系的角度来看,危险源一般不包括仅涉及对“物\"“财产”的损害（　）","options":[],"answer":"对","why":"职业健康安全体系关注的核心是人的安全与健康，危险源一般指可能导致人员伤害、职业病的根源或状态；仅涉及「物」「财产」损害的不属于该体系语境下的危险源。题干说法正确。"},{"type":"单选","stem":"识别危险源时不要发生遗漏,以免留下隐患,这是危险源辨识的（　） 原则。","options":["预测性","全面性","系统性","科学性"],"answer":"B","why":"辨识时不留死角、不发生遗漏，对应「全面性」原则；预测性对应分析潜在危险，系统性强调全流程方法，别混。口诀：全面不漏、预测在先。"},{"type":"单选","stem":"对于危险源,要分析其潜在的危险性、存在的条件及触发事件,这是危险源辨识的（　） 原则。","options":["预测性","全面性","系统性","科学性"],"answer":"A","why":"对危险源分析潜在危险性、存在条件和触发事件，是在事故发生前预判其演化路径，属于「预测性」原则。干扰项「系统性」强调的是辨识的组织与方法体系，不是预判。"},{"type":"单选","stem":"安全生产检查表形式简单,针对性和操作性强,是施工企业常用的危险源辨识方法中（　）的具体运用。","options":["直观经验法","对照分析法","专家评议法","事故树分析法"],"answer":"B","why":"安全检查表依据法规标准逐条对照排查，是「对照分析法」的具体运用；事故树分析是自顶向下推理事故逻辑的定量方法，与检查表完全不同。"},{"type":"单选","stem":"LEC 法评价某种危险风险等级的计算公式为: DL*E*C,其中 D 表示（　）","options":["危险的等级程度","发生事故可能性","人体暴露的频繁程度","损失后果的严重程度"],"answer":"A","why":"LEC法公式 D=L×E×C：L为事故发生的可能性，E为人体暴露于危险环境的频繁程度，C为事故后果严重程度，D为风险等级评价结果（危险的等级程度）。记法：D是总分，LEC是三个因子。"},{"type":"单选","stem":"LEC 法评价某种危险风险等级的计算公式为: D=L*E*C,其中 E 表示（　）","options":["危险的等级程度","发生事故可能性","人体暴露的频繁程度","损失后果的严重程度"],"answer":"C","why":"D=L×E×C 中，E（Exposure）表示人体暴露于危险环境的频繁程度；L是可能性、C是后果严重程度，三者相乘得风险值D。"},{"type":"单选","stem":"LEC 法评价某种危险风险等级的计算公式为: D=L*E*C,其中 C 表示（　）","options":["危险的等级程度","发生事故可能性","人体暴露的频繁程度","损失后果的严重程度"],"answer":"D","why":"D=L×E×C 中，C（Consequence）表示事故造成损失后果的严重程度；E是暴露频次、L是可能性，注意字母与含义一一对应，别记混。"},{"type":"多选","stem":"常见的风险防范措施主要包括 （　）几个方面","options":["组织措施","管理措施","技术措施","处罚措施","合同措施"],"answer":"ABC","why":"风险防范措施主要包括组织、管理、技术三类措施；「处罚措施」「合同措施」不属于安全生产风险防范的标准分类。"},{"type":"单选","stem":"在企业内部实行一岗双责制定属于（　）类别的风险防范措施","options":["组织措施","管理措施","技术措施","其它措施"],"answer":"A","why":"一岗双责是在岗位责任体系中落实「谁主管谁负责」，属于建立责任组织架构的范畴，归入组织措施；管理措施偏制度运行，技术措施偏物防技防。"},{"type":"多选","stem":"以下属于安全生产管理措施范畴的有 （　）","options":["配备安全管理人员","组织安全生产检查","建立健全安全生产责任","进行安全生产教育培训","配备安全防护用品"],"answer":"BCD","why":"组织安全检查、建立责任制、教育培训属于管理措施；A配备安全管理人员属组织措施，E配备防护用品属技术措施，分类题要盯住「管理」二字。"},{"type":"单选","stem":"下面属于通信工程危险源的是 （　）","options":["裸露的铜鼻子","作业人员未佩戴安全帽","作业面与高压线间距过近","安全技术交底缺失"],"answer":"C","why":"危险源是可能意外释放能量或危险的载体与状态：作业面与高压线间距过近是典型触电类危险源；未戴安全帽、交底缺失属于人的不安全行为和管理缺陷（隐患），裸露铜鼻子单独不构成作业危险状态。"},{"type":"单选","stem":"割接时未作绝缘处理的工具是 （　）工程中常见的危险源","options":["架空线路","直埋线路","管道线路","设备线路"],"answer":"D","why":"设备（机房）割接涉及带电运行设备，未作绝缘处理的工具易造成短路、触电，是设备线路工程割接中的常见危险源；架空、直埋、管道工程不涉及机房带电设备操作。"},{"type":"判断","stem":"因外部因素影响致使生产经营单位自身难以排除的隐患,通常属于-般事故隐患。（　）","options":[],"answer":"错","why":"因外部因素致使生产经营单位自身难以排除的隐患，其危害和整改难度大，按重大事故隐患管理，不属于一般事故隐患。判断题遇「自身难以排除」直接联想重大隐患。"},{"type":"单选","stem":"通信工程施工单位的事故隐患中,危害和整改难度较大,应当局部停产停业,并经过一定时间整改治理方能排除的隐患,由 （　） 组织制定安全隐患治理方案并组织实施。","options":["专职安全员","现场负责人","项目负责人","企业主要负责人"],"answer":"D","why":"危害和整改难度较大、需局部停产停业并经一定时间治理方能排除的是重大事故隐患，依据《安全生产事故隐患排查治理暂行规定》，应由企业主要负责人组织制定治理方案并组织实施。"},{"type":"单选","stem":"通信工程施工单位的事故隐患中,危害和整改难度较小,需要整改的隐患,称为（　）。","options":["关注隐患","轻微隐患","一般监控隐患","重点监控隐患"],"answer":"B","why":"危害和整改难度较小、发现后需要整改才能消除的隐患称为一般（轻微）隐患；「重点监控隐患」多对应重大隐患，层级别搞反。"},{"type":"单选","stem":"通信工程施工单位的事故隐患中,危害较小,发现后需引起注意的隐患,由 （　）予以关注。","options":["专职安全员","现场负责人","项目负责人","企业负责人"],"answer":"B","why":"危害较小、发现后只需引起注意的隐患，由现场负责人予以关注即可；需要停产治理的重大隐患才上升到企业主要负责人层面，处置层级要与隐患等级匹配。"},{"type":"多选","stem":"对于排查出来的安全生产隐患,应确定定整改责任人（　）","options":["整改措施","整改完成时间","整改完成单位及具体人员","整改验收人","整改监理方"],"answer":"ABCD","why":"隐患整改落实「五定」：定整改责任人、定整改措施、定整改完成时间、定整改完成单位及具体人员、定整改验收人；「整改监理方」不在其列。"},{"type":"多选","stem":"安全生产检查中属于软件系统检查内容的有 （　）","options":["查思想和意识","查制度和管理","查事故处理","查隐患及整改","查安全设备设施"],"answer":"ABCD","why":"软件系统检查查思想意识、制度管理、事故处理、隐患整改等管理面内容；E安全设备设施属于硬件系统检查内容，软硬件要分开记。"},{"type":"多选","stem":"通常以时间为维度的安全生产检查包括 （　）","options":["经常性安全生产检查","季节性安全生产检查","定期安全生产检查","特殊时期的安全生产检查","远程安全生产检查"],"answer":"BCD","why":"以时间为维度划分的是定期检查、季节性检查、特殊时期（节假日）检查；经常性检查强调日常不间断属组织方式，远程检查按实施手段划分。"},{"type":"多选","stem":"安全检查的类型很多,不属于时间维度检查的是 （　）","options":["现场安全生产检查","定期安全生产检查","季节性安全生产检查","远程安全生产检查","特殊时期安全生产检查"],"answer":"AD","why":"定期、季节性、特殊时期检查都属于时间维度；现场检查按实施地点划分、远程检查按实施手段划分，均与时间维度无关。"},{"type":"多选","stem":"季节性安全生产检查具有很强的针对性,检查的重点一般包括（　）","options":["防冻保暖","防煤气中毒","防暑降温 防雷防电","防通信中断"],"answer":"ABCD","why":"季节性检查针对季节特点：冬春季防冻保暖、防煤气中毒，夏季防暑降温、防雷防电，通信行业还要防通信中断，四个选项都是其重点，全选。"},{"type":"单选","stem":"施工单位自行组织的安全生产检查,在整改措施计划完成后,由（　）组织有关人员进行验收。","options":["检查组","项目部","安全管理部门","专职安全员"],"answer":"C","why":"施工单位自行组织的检查，整改措施计划完成后应由安全管理部门组织验收，实现闭环管理；检查组只负责查，验收归口安全管理部门。"},{"type":"多选","stem":"对通信工程企业的安全检查,主要从（　）安全教育培训、安全生产管控及隐患排查治理、事故管理、持续改进等方面进行。","options":["安全管理目标职责","安全管理制度","现场安全管理","安全应急管理","施工质量控制"],"answer":"ABCD","why":"对通信工程企业的安全检查围绕管理目标职责、管理制度、现场安全管理、安全应急管理及教育培训、隐患排查、事故管理、持续改进等展开；施工质量控制不属于安全检查范畴。"},{"type":"单选","stem":"对通信施工企业的安全检查,通常以打分的方式进行,若得 85 分,一般应评定为（　）","options":["优秀","良好","合格","不合格"],"answer":"B","why":"通信施工企业安全检查按百分制打分评定：一般90分及以上为优秀，80～89分为良好，70～79分为合格，70分以下不合格。85分落在良好档。"},{"type":"单选","stem":"对通信施工企业进行项目达标计划时,应抽查 （　）个以上项目的达标合格率达到 100%。","options":["3","4","5"],"answer":"B","why":"项目达标考核要求抽查4个以上项目，且达标合格率达到100%，数量与双百要求都是数字考点，直接记忆。"},{"type":"单选","stem":"施工单位应严格按照《通信建设工程安全操作规范》的规定进行（　）","options":["现场管理","制度建设","目标制定","质量检查"],"answer":"A","why":"《通信建设工程安全操作规范》是通信施工操作的强制性依据，施工单位应严格按其进行现场管理和作业；制度建设、目标制定、质量检查各有各自依据，不靠操作规范。"},{"type":"多选","stem":"对通信工程项目的安全检查,主要内容包括项目的 （　）等情况。","options":["安全生产责任制落实","安全技术交底","消防安全管理","现场文明施","施工质量控制"],"answer":"ABCD","why":"项目安全检查内容包括责任制落实、安全技术交底、消防安全管理、现场文明施工等；施工质量控制属于质量管理体系，不属于安全检查内容。"},{"type":"多选","stem":"对通信工程项目的安全检查,主要内容包括项目的（　）等情况。","options":["专项施工方案","人员管理","应急管理","安全检查","质量控制"],"answer":"ABCD","why":"项目安全检查还包括专项施工方案、人员管理、应急管理、安全检查开展情况等；质量控制计划始终是干扰项，见到「质量控制」基本可排除。"},{"type":"单选","stem":"对通信工程项目的安全检查,主要内容不包括项目的（　） 情况。","options":["安全生产责任制","安全技术交底","现场文明施工","施工质量控制"],"answer":"D","why":"安全生产责任制、安全技术交底、现场文明施工都是项目安全检查的必查项；本题问「不包括」，选施工质量控制——质量与安全是两个独立管理体系。"},{"type":"单选","stem":"对通信工程项目的安全检查,主要内容不包括项目的（　） 等情况","options":["专项施工方案","人员管理","应急管理","质量控制"],"answer":"D","why":"专项施工方案、人员管理、应急管理、安全检查情况属于安全检查主要内容；质量控制不属于，与管理条例的安全管理边界一致。"},{"type":"单选","stem":"项目部组织的全面安全生产检查,一般情况下,检查频次时 （　）。","options":["每天一次","每周一次","每周两次","每月两次"],"answer":"B","why":"项目部组织的全面安全生产检查一般为每周一次；日常巡查由专职安全员每天进行，频次层级：班组日检、项目周检、公司月检。"},{"type":"多选","stem":"对通信工程施工现场的安全检查,描述正确的是 （　）","options":["检查安全技术措施的落实情况","检查《通信建设工程安全生产操作规范》的执行情况","检查的内容应根据检查类型和项目特点确定","检查本着突出重点的原则","检查是上级的要求,没有必要也要进行"],"answer":"ABCD","why":"现场安全检查应突出重点、按检查类型和项目特点确定内容，检查安全技术措施落实和操作规范执行情况；「没有必要也要进行」明显违背检查目的，E必错。"},{"type":"单选","stem":"对施工现场的安全检查,（　） 的评分权重最大","options":["项目经理","技术负责人","现场监理人员","专职安全员"],"answer":"D","why":"对施工现场的安全检查评分中，专职安全员掌握日常一手资料，其评分权重最大；项目经理、技术负责人、监理人员的权重均低于专职安全员。"},{"type":"单选","stem":"职业健康安全管理体系的有效建立和运行,能为企业带来的受益般不包括 （　）。","options":["提高安全管理绩效","提升工程业绩","有助于相关法规的贯彻执行","树立企业良好的社会形象"],"answer":"B","why":"职业健康安全管理体系带来的是安全管理绩效提升、法规贯彻、社会形象等管理收益；「提升工程业绩」属于经营市场层面收益，不是体系建立的直接目的。"},{"type":"单选","stem":"实施职业健康安全管理体系是组织的战略和（　）","options":["管理决策","经营理念","经营决策","管理理念"],"answer":"C","why":"实施职业健康安全管理体系是组织的战略和经营决策，体现最高管理者的承诺，不是一般的管理理念或口号；教材原文表述要记准。"},{"type":"多选","stem":"职业健康安全管理体系运行成功的关键因数包括（　）","options":["领导作用","承诺","管理","制度","所有各职能和层次的参与"],"answer":"ABE","why":"体系运行成功的关键：领导作用、最高管理者的承诺、所有职能和层次的参与；「管理」「制度」是泛化词汇，不属关键因素的标准表述。"},{"type":"单选","stem":"职业健康安全管理体系认证证书最终要通过（　）才能获得","options":["试运行","内部审核","管理评审","外部审核"],"answer":"D","why":"认证证书最终要通过外部审核（第三方认证机构审核）才能获得；试运行、内审、管理评审都是企业内部环节，是外审前的准备条件。"},{"type":"多选","stem":"企业的管理体系文件一般应包括 （　）","options":["管理手册","质量手册","作业指导书及操作规范","现场处置方案及运行记录","相关的管理制度"],"answer":"ACDE","why":"管理体系文件一般包括管理手册、作业指导书及操作规范、现场处置方案及运行记录、相关管理制度；质量手册属于质量管理体系文件，与职业健康安全体系分属两套体系。"},{"type":"单选","stem":"下列情况中,不属于职业健康安全管理体系要求增加内部审核次数的是 （　）","options":["企业内部组织机构等有重大变动","发生了重大的安全事故等","体系管理部门负责人认为需要","顾客(包括相关方)有重大投诉"],"answer":"C","why":"企业内部组织机构重大变动、发生重大安全事故、相关方重大投诉时都应增加内审频次；「体系管理部门负责人认为需要」不是标准规定的情形，属于随意性表述。"},{"type":"判断","stem":"企业安全生产标准化是有效防范事故发生的唯一手段（　）。","options":[],"answer":"错","why":"安全生产标准化是防范事故的有效手段，但不是「唯一」手段。判断题中「唯一」「必须」「都」等绝对化表述九成是错的，需要与培训、检查、应急等手段并用。"},{"type":"单选","stem":"企业开展安全生产标准化工作,应遵循方针不包括 （　）","options":["安全第一","预防为主","管控为主","综合治理"],"answer":"C","why":"安全生产标准化工作方针是「安全第一、预防为主、综合治理」十二字方针；「管控为主」是编造的干扰项，见绝对化新词要警惕。"},{"type":"单选","stem":"企业安全生产标准化包括（　） 个一级要素。","options":["16","22","28"],"answer":"A","why":"企业安全生产标准化系统包含16个一级要素，数字考点直接记忆：16个一级要素，其下再分二级要素。"},{"type":"单选","stem":"企业 （　） 至少应对安全生产标准化管理体系的运行情况进行一次自评。","options":["每季度","每半年","每年","两年"],"answer":"C","why":"企业每年至少对安全生产标准化管理体系的运行情况进行一次自评，形成自评报告；「每季度」「每半年」频率都高于标准要求。"},{"type":"单选","stem":"关于安全生产标准化证书的分级,正确的是 （　）","options":["分为甲、乙级","分为一、二、三级","分为一、二、三、四级","不分级"],"answer":"B","why":"安全生产标准化证书分为一级、二级、三级，一级最高；不是甲乙级（那是资质分类），也没有四级。"},{"type":"判断","stem":"企业管理层应代表全体员工在关注安全和追求安全绩效方面做出公开的安全承诺。（　）","options":[],"answer":"错","why":"公开的安全承诺应由企业主要负责人（最高管理者）代表企业作出，而非「管理层代表全体员工」；承诺主体和代表对象表述均不准确，故说法错误。"},{"type":"单选","stem":"企业内部（　）是企业安全承诺的具体体现和安全文化建设的基础要求。","options":["安全制度","管理制度","操作规范","行为规范"],"answer":"D","why":"企业内部行为规范是安全承诺的具体体现和安全文化建设的基础要求；制度、操作规范是管理和技术文件，承载承诺落地的是对行为的规范。"},{"type":"单选","stem":"关于企业安全文化建设程序的建立和执行的说法,正确的是（　）","options":["识别并说明主要的风险","使用者不参与程序的制定和改进过程","一般不形成正式文件","要求员工对程序的执行持信任的态度"],"answer":"A","why":"安全文化程序建立的首要环节是识别并说明主要的风险，让员工清楚风险来源；程序制定应有使用者参与、形成正式文件发布，B、C、D表述均违背这些要求。"},{"type":"多选","stem":"关于企业安全文化建设程序的建立和执行的说法,不正确的是（　）","options":["识别并说明主要的风险","使用者不参与程序的制定和改进过程,","由正式文件予以发布","向员工闻明给出特殊要求的原因","要求员工对程序的执行持信任的态度"],"answer":"BE","why":"程序建立应识别风险、正式发布、说明特殊要求的原因，并让使用者参与建立信任；B「使用者不参与」与E「要求员工持信任态度」都不正确——信任来自参与而非强求。"},{"type":"单选","stem":"对于员工所识别的安全缺陷,企业正确的做法是 （　）","options":["给予经济奖励","记录备案","给予及时处理和反馈","上级主管领导"],"answer":"C","why":"员工识别出的安全缺陷，企业应及时处理和反馈，形成闭环，才能激励持续参与；只记录备案或层层上报都会挫伤积极性。"},{"type":"单选","stem":"企业应建立有效的安全学习模式,实现动态发展的安全学习过程关于安全自主学习过程的顺序,正确的是（　）","options":["既有知识和能力-概念与方案-预知与反思-实践与实施-评估与总结-新的知识和能力","既有知识和能力-预知与反思-概念与方案-实践与实施-评估与总结-新的知识和能力","预知与反思既有知识和能力-概念与方案-实践与实施-评估与总结-新的知识和能力","既有知识和能力-预知与反思-实践与实施-概念与方案-评估与新的知识和能力"],"answer":"B","why":"安全自主学习过程顺序：既有知识和能力→预知与反思→概念与方案→实践与实施→评估与总结→新的知识和能力，起点是既有能力，先反思再出方案。"},{"type":"多选","stem":"员工参与企业安全事务的方式有 （　）","options":["微小差错员工报告机制","成立员工安全改进小组","不定期召开员工代表参加的安全会议","进行岗位风险评审","不安全行为或不安全状态的自查自评活动"],"answer":"ABE","why":"员工参与安全事务的规范方式：微小差错报告机制、员工安全改进小组、不安全行为/状态自查自评；「不定期开安全会」「岗位风险评审」不属列明的参与方式。"},{"type":"多选","stem":"培养骨干是推动企业安全文化建设非做不可的事情,训练内容包括（　）","options":["理论","经验","制度的制定","实施的方法","事例"],"answer":"ABDE","why":"安全文化骨干训练内容包括理论、经验、实施的方法、事例（案例教学）；「制度的制定」属于制度建设范畴，不在骨干训练内容之列。"},{"type":"单选","stem":"传播安全文化,促进精神文明的重要手段是 （　）","options":["弘扬、教育、激励、同化","宣传、培训、鼓励、感化","宣传、教育、鼓励、同化","宣传、教育、激励、感化"],"answer":"D","why":"传播安全文化、促进精神文明的重要手段是宣传、教育、激励、感化四手段，教材原文，注意与「弘扬、同化」类干扰词区分。"},{"type":"单选","stem":"企业安全文化是 （　） 企业整体行为以及员工行为的价值理念同时也指导着安全管理制度的()","options":["指导和约束,制定和执行","指导和保持,签定和执行","指导和保持,制定和执行","指导和约束,签定和执行"],"answer":"A","why":"安全文化指导和约束企业整体行为及员工行为的价值理念，同时指导安全管理制度的制定和执行；「保持」「签定」均为干扰用词，记「指导约束+制定执行」。"},{"type":"判断","stem":"安全文化和安全管理制度是激励员工的两种有力工具,是各自独立的。 （　）","options":[],"answer":"错","why":"安全文化与安全管理制度相互支撑、相辅相成：文化引导制度制定，制度固化文化要求，两者是激励员工的两种有力工具但绝不各自独立。判断题见「各自独立」即错。"}]},{"file":"08第八章","title":"第八章","count":28,"questions":[{"type":"多选","stem":"应急管理是一个动态过程,包括（　）四个阶段。","options":["立项","预防","准备","响应","恢复"],"answer":"BCDE","why":"应急管理是动态过程，包括预防、准备、响应、恢复四个阶段；「立项」是工程词汇，混进来凑数的，四阶段口诀：防、备、响、恢。"},{"type":"单选","stem":"为迅速有效地开展应急行动,需要预先所做的各种准备不包括（　）。","options":["应急队伍建设","应急机构设立","应急预案演练","开展安全研究"],"answer":"D","why":"应急准备包括队伍、机构、预案演练、物资等；「开展安全研究」属于预防阶段的风险管理工作，不属于为应急行动做的准备。"},{"type":"单选","stem":"应急响应是在事故发生后应立即采取的（　） 行动。","options":["应急与事故处理","救援和事故处理","救援与上报","应急与救援"],"answer":"D","why":"应急响应是事故发生后立即采取的应急与救援行动，含报警、疏散、抢险等；「事故处理」属事后环节，响应阶段的核心是救人控险。"},{"type":"判断","stem":"事故应急救援的总目标是通过有效的应急救援行动,尽可能降低事故的后果,包括人员伤亡、财产损失和环境破坏等。 （　）","options":[],"answer":"对","why":"应急救援总目标就是通过有效的应急行动尽可能降低事故后果——人员伤亡、财产损失、环境破坏，题干是教材原文表述，正确。"},{"type":"单选","stem":"整个应急救援系统的重心 （　）","options":["应急救援中心","应急救援专家组","公众疏散组织","后勤保障组织"],"answer":"A","why":"整个应急救援系统的重心是应急救援中心，负责统一指挥协调；专家组、疏散组织、后勤保障都是其下的支撑节点，重心与分支别搞混。"},{"type":"单选","stem":"为保障重大事故应急救援工作的有效开展,应建立重大事故应急救援体系的 （　）系统。","options":["检查分析","问题比对","支持保障","纠偏"],"answer":"C","why":"重大事故应急救援体系应建立支持保障系统，含通信、物资、装备、资金等保障；记忆「支持保障」四字对应体系底部支撑层。"},{"type":"判断","stem":"应急救援体系可以有可靠的通信保障系统,保证整个应急救援过程中救援组织内部,以及内部与外部之间通畅的通信网络,并设立备用通信系统。 （　）","options":[],"answer":"错","why":"题干说「可以有可靠的通信保障系统」，实际要求是「必须」设立备用通信系统保障全程通信畅通，把强制性要求说成可有可无，故错误。"},{"type":"单选","stem":"临时应急恢复阶段不包括 （　）","options":["恢复现场","人员清点和撤离","警戒解除","事故处理和事故调查"],"answer":"A","why":"临时应急恢复阶段包括人员清点撤离、警戒解除、事故处理调查等；「恢复现场」是长期恢复内容，且恢复原状通常是破坏现场，应急期不允许。"},{"type":"单选","stem":"应急预案体系的构成不包含 （　）","options":["综合应急预案","专项应急预案","施工组织预案","现场处置预案"],"answer":"C","why":"应急预案体系由综合应急预案、专项应急预案、现场处置方案三层构成；「施工组织预案」属施工组织设计范畴，不是应急体系组成部分。"},{"type":"多选","stem":"生产经营单位应急预案编制程序包括 （　）、应急预案编制、桌面推演等步骤。","options":["成立编制工作组","收集资料","评估风险和应急资源调查","应急预案评审和批准","发布和执行预案"],"answer":"ABCD","why":"预案编制程序：成立编制工作组→收集资料→风险评估和应急资源调查→应急预案编制→桌面推演/评审→批准发布；A~D都是编制前中期的正规步骤。"},{"type":"单选","stem":"施工单位应急预案编制完成后,应由 （　） 组织评审。","options":["建设单位","设计单位","施工单位","监理单位"],"answer":"C","why":"施工单位编制的应急预案应由施工单位自行组织评审（外部可邀请专家），评审通过后由本单位主要负责人签署发布；监理、建设方无组织评审义务。"},{"type":"单选","stem":"下列表述中不属于生产安全事故应急救援预案制定要求的是（　）","options":["系统性","科学性","针对性","可操作性"],"answer":"A","why":"应急预案制定要求：科学性、针对性、可操作性（还有合规性、衔接性）；「系统性」常被当干扰项——它是对体系结构的要求而非预案制定的专项要求，按教材为准选A。"},{"type":"多选","stem":"综合应急预案的应急响应部分的内容,一般应包括 （　）","options":["信息报告","响应分级","应急处置","应急支援","响应终止"],"answer":"ACDE","why":"综合应急预案的应急响应部分包括信息报告、应急处置、应急支援、响应终止等；「响应分级」属于总则/响应机制部分的内容编排，不在应急响应正文里。"},{"type":"单选","stem":"综合应急预案的应急响应部分的内容,一般不包括（　）","options":["信息报告","响应分级","应急处置","应急支援"],"answer":"B","why":"综合预案应急响应部分不含「响应分级」——分级标准写在预案其他章节；信息报告、应急处置、应急支援都在响应部分内。注意与上一题对照记。"},{"type":"多选","stem":"综合应急预案中,应急响应终止应明确终止的 （　）","options":["基本条件","要求","责任人","信息公开","后勤保障"],"answer":"ABC","why":"应急响应终止应明确终止的基本条件、要求和责任人，保证响应结束有据可依、有人负责；「信息公开」「后勤保障」不是终止章节的必列内容。"},{"type":"单选","stem":"用于事故应急响应的保障队伍,一般不包括 （　）","options":["专职应急队伍","兼职应急队伍","应急队伍","业余应急队伍"],"answer":"D","why":"应急保障队伍包括专职应急队伍、兼职应急队伍等；「业余应急队伍」是无组织的临时拼凑，不符合应急队伍建设要求。"},{"type":"多选","stem":"现场处置方案主要由（　）、注意事项等内容组成。","options":["事故风险分析","应急工作职责","应急预案管理","应急处置","安全制度"],"answer":"ABD","why":"现场处置方案由事故风险分析、应急工作职责、应急处置、注意事项构成（简明扼要、针对具体岗位现场）；「应急预案管理」属综合预案的管理章节。"},{"type":"单选","stem":"现场处置方案中应明确的注意事项,描述不准确的是 （　）","options":["使用施工机具方面的注意事项","使用救援装备方面的注意事项","现场自救互救方面的注意事项","现场人员安全防护的注意事项"],"answer":"A","why":"现场处置方案的注意事项针对救援装备使用、自救互救、人员安全防护等现场动作；「施工机具使用注意事项」属安全操作规程内容，不属于处置方案的注意事项。"},{"type":"单选","stem":"综合应急预案、专项应急预案和现场处置方案最后都要列出一个附件,其主要内容不包括的是（　）","options":["有关应急部门、机构或人员的联系方式","应急物质装备的名称或清单","关键的路线、标识和图纸","公司相关的安全管理制度"],"answer":"D","why":"三类预案附件都包括联系方式、物资装备清单、关键路线标识图纸等；「公司安全管理制度」是管理体系文件，不作为预案附件。"},{"type":"单选","stem":"应急演练是针对事故情景,依据应急预案而 （　） 开展的应急救援活动。","options":["提前","实际","模拟","准备"],"answer":"C","why":"应急演练是针对事故情景、依据应急预案而「模拟」开展的救援活动——模拟是演练的本质属性，区别于实战；「实际」开展的那叫事故响应本身。"},{"type":"判断","stem":"通过开展应急演练,可以实现评估应急准备状态,发现并及时修改应急预案、执行程序等相关工作的缺陷和不足。（　）","options":[],"answer":"对","why":"演练的作用正是评估应急准备状态、检验并修改预案和执行程序的缺陷不足，题干是演练目的的标准表述，正确。"},{"type":"单选","stem":"作为应急演练的原则,不适合的是（　）","options":["注重知识水平提升","符合相关规定","切合企业实际","确保安全有序"],"answer":"A","why":"演练原则包括符合规定、结合实际、安全有序等；演练练的是「响应能力」不是「知识水平提升」，知识靠培训获得，A不合演练定位。"},{"type":"判断","stem":"桌面演练是选择(或模拟) 生产经营活动中的设备设施、装置或场所,设定事故情景,依据应急预案而模拟的应急演练活动。 （　）","options":[],"answer":"错","why":"桌面演练是在会议室以图面、沙盘推演的方式模拟，不占用真实设备设施场所；用实物场景模拟的是现场（实战）演练，题干张冠李戴，错误。"},{"type":"单选","stem":"选择生产经营活动中的设备设施、场所,设定事故情景,依据应急预案而模拟开展的演练活动是 （　）","options":["桌面演练","现场演练","单项演练","综合演练"],"answer":"B","why":"选择生产经营中的设备设施、场所，设定事故情景，按预案模拟开展的演练是现场演练；桌面演练不动用实物现场，单项/综合演练按内容范围划分。"},{"type":"多选","stem":"应急演练按照内容可分为 （　）","options":["桌面演练","现场演练","单项演练","综合演练","专项演练"],"answer":"CD","why":"演练按内容分为单项演练和综合演练；按组织形式（地点方式）才分桌面演练和现场演练，两个维度别交叉。"},{"type":"单选","stem":"不属于应急演练计划内容的是 （　）","options":["演练目的及类型(形式)","参加单位和经营预算","演练的时间、地点及主要内容","演练效果评价"],"answer":"D","why":"演练计划内容包括目的类型、时间地点主要内容、参加单位与预算等；「演练效果评价」属于演练结束后评估报告环节的内容，不在计划里。"},{"type":"单选","stem":"根据演练评估报告中对应急预案的改进建议,由应急预案的（　）按程序对预案进行修订完善。（　）","options":["编制部门","演练部门","管理部门","上级部门"],"answer":"A","why":"根据演练评估报告的改进建议，由预案的编制部门按程序修订完善预案——谁编制谁修订，演练部门、管理部门均不负责修订。"},{"type":"多选","stem":"通信工程有限空间作业中毒或窒息事故的现场处置方案,主要由（　）、注意事项、附件等内容组成。","options":["事故风险分析","应急工作职责","应急预案管理","应急处置","安全制度"],"answer":"ABD","why":"有限空间中毒窒息的现场处置方案同样由事故风险分析、应急工作职责、应急处置、注意事项、附件构成；「应急预案管理」「安全制度」属综合预案内容。"}]},{"file":"09第九章","title":"第九章","count":40,"questions":[{"type":"单选","stem":"施工单位施工现场的专职安全生产管理人员,应当由 （　） 委派,并监督其落实安全管理职责。","options":["建设单位","施工单位","设计单位","监理单位"],"answer":"B","why":"施工单位的现场专职安全员由施工单位委派，对本单位负责并接受其监督；建设单位、监理单位都无权直接委派施工方的安全管理人员。"},{"type":"单选","stem":"分包单位施工现场的专职安全生产管理人员,应当由 （　）委派,并监督其落实安全管理职责。","options":["建设单位","总包单位","分包单位","监理单位"],"answer":"C","why":"分包现场的专职安全员由分包单位自行委派——谁用工谁负责；总包对分包安全负统一协调管理责任，但不代替分包委派安全员。"},{"type":"单选","stem":"施工组织设计是以（　）为对象编制的","options":["单位工程","分部工程","分项工程","整个建设项目或群体工程"],"answer":"A","why":"施工组织设计以单位工程为对象编制，指导该工程的全部施工活动；分部分项工程编的是施工方案（危大工程另编专项方案），对象层级要记清。"},{"type":"多选","stem":"下列施工现场周边环境中,（　）环境下作业需要编制相应的安全技术措施。","options":["居民稠密区","重要交通路口","铁路沿线","变电站附近","绿化区内"],"answer":"ABCD","why":"居民稠密区、重要交通路口、铁路沿线、变电站附近都是高风险敏感环境，作业前须编制相应安全技术措施；绿化区无特殊风险，不属于强制情形。"},{"type":"判断","stem":"专项安全施工方案是施工单位在编制施工组织设计的基础上,单独编制的安全技术措施文件。 （　）","options":[],"answer":"错","why":"题干把关系说反了：专项安全施工方案是在施工组织设计之外「单独」编制的安全技术措施文件（针对专业性较强、危险性较大的分部分项工程），不是「在编制施组的基础上」衍生，故错误。"},{"type":"单选","stem":"通信工程专项施工方案的施工计划中,一般不包括的（　）内容","options":["施工进度计划","材料与设备供应计划","资金配备计划","质量控制计划"],"answer":"C","why":"专项施工方案的施工计划含进度计划、材料设备供应计划等；「资金配备计划」属企业经营管理内容，不写入方案，见「资金」多为干扰项。"},{"type":"判断","stem":"专项施工方案的施工安全保证措施应包括组织保障措施、技术措施、监测监控措施等内容。 （　）","options":[],"answer":"对","why":"施工安全保证措施=组织保障措施+技术措施+监测监控措施等，题干是标准表述，正确；记「组织、技术、监测监控」三件套。"},{"type":"单选","stem":"通信工程专项施工方案的施工安全保证措施中,一般不包括 （　）","options":["管理保障措施","技术保障措施","应急管理预案","事故处理方法"],"answer":"D","why":"安全保证措施包括管理保障、技术保障、应急预案等；「事故处理方法」属事后环节，安全保证措施是事前预防性安排，不含事故处理。"},{"type":"多选","stem":"施工现场多家单位同时作业时,应由（　）协调作业顺序,防止出现安全隐患。","options":["建设单位","设计单位","施工单位","监理单位","分包单位"],"answer":"AD","why":"多家单位同一现场作业，由建设单位协调，并可委托监理单位统一协调（监理受建设单位委托）；设计单位、分包单位无此协调职权。"},{"type":"单选","stem":"项目经理应对专项施工作业的安全生产负全面 （　）责任。","options":["领导","监督","监理","协调"],"answer":"A","why":"项目经理对专项施工作业的安全生产负全面领导责任，是项目安全第一责任人，故选「领导」；监督、监理、协调都是他人视角的用词。原题选项D被OCR粘连了另一道拆除题的文本，已清理。"},{"type":"单选","stem":"通信工程拆除作业中,下列天线及室外单元拆除的做法,错误的是（　）","options":["施工现场设专人看护,塔下作业人员不得进入安全禁区","遇六级及以上大风时,应快速完成当前作业再停工","吊装用的绳索和滑轮应固定牢靠、位置合理","拆除设备翻越楼顶女儿墙时,应采取有效的防撞措施"],"answer":"B","why":"天线及室外单元拆除遇六级及以上大风应立即停工，严禁「快速完成当前作业再停工」——高空吊装遇强风抢工是大忌，B明显违背安全优先原则。"},{"type":"多选","stem":"通信工程土方开挖作业中,以下情况时必须支撑护土板的有 （　）","options":["沟坑距离机动车道较近处","与其他沟交叉处或平行距离较近处","距离建筑物或设施较近处","回填土、砂士、流砂等地带","按规定可以进行放坡处"],"answer":"ABCD","why":"必须支撑护土板的情形：临近机动车道、与其他沟交叉或平行较近、临近建筑物设施、回填土/砂土/流砂等不稳定土质地带；可放坡处按规定放坡即可，不需护土板。"},{"type":"单选","stem":"通信工程割接作业中,操作人员的错误做法是 （　）","options":["无监护独立完成带电操作","佩戴防静电手环插拔机盘","使用专用工具插拔电源熔断器","使用进行过绝缘处理后的工具"],"answer":"A","why":"带电操作（割接）严禁无监护独立完成，必须有人监护；B、C、D都是规范做法——防静电手环、专用工具、绝缘处理工具均正确。"},{"type":"单选","stem":"带电作业时监护人应由（　） 担任。","options":["班组长","具有具备带电作业资格、带电作业实践经验的人员","经过培训的人员","技术人员"],"answer":"B","why":"带电作业监护人须由具备带电作业资格且有实践经验的人员担任，光「班组长」「培训过」「技术人员」的资历都不够——监护人是最后一道安全防线，必须持证+经验。"},{"type":"判断","stem":"电源设备加电,操作人员应穿绝缘鞋,带绝缘手套,并有两人互相配合。（　）","options":[],"answer":"对","why":"电源设备加电应穿绝缘鞋、戴绝缘手套并两人互相配合操作，题干是标准做法，正确；一人操作无人监护是触电主因之一。"},{"type":"单选","stem":"通信工程割接作业中,设备加电时,操作人员的错误做法是 （　）","options":["穿绝缘鞋","戴绝终手套","独自完成操作","沿电流方向逐级加电"],"answer":"C","why":"设备加电时穿绝缘鞋、戴绝缘手套、沿电流方向逐级加电都正确；「独自完成操作」违背双人作业监护要求，错误做法选C。"},{"type":"单选","stem":"直流电源系统割接工程中,通信设备有“主、备用”电源端子时,应先将 （　） 接入新电源系统中,正常后再全部接入。","options":["主用电源端子","备用电源端子","正极电源端子","负极电源端子"],"answer":"B","why":"直流电源割接时，有主备用电源端子的设备应先接「备用」端子——先接备用的思路是万一出问题不影响主用运行，业务无感知，再逐步割接主用。"},{"type":"单选","stem":"直流电源系统割接工程中,通常测量电流的仪表为 （　）","options":["数字万用表","直流安培表","钳形电流表","交流安培表"],"answer":"C","why":"直流（大电流）测量通常用钳形电流表——不断开电路即可卡线测量；数字万用表量程小需串接入路，直流安培表需断开回路，都不便割接现场使用。"},{"type":"单选","stem":"施工现场临时用电的供电方式,说法错误的是 （　）","options":["应采用三相五线制","必须符合三级配电结构","多台用电设备合用开关箱","采用两级漏电保护"],"answer":"C","why":"临时用电规范：三相五线制（TN-S）、三级配电、两级漏电保护；「多台用电设备合用开关箱」违背「一机一闸一漏一箱」原则，C错误。"},{"type":"单选","stem":"维修施工现场临时用电设备和线路时,做法错误的是 （　）","options":["电工独立完成","穿绝缘鞋","戴绝缘手套","使用绝缘工具"],"answer":"A","why":"维修临时用电设备/线路必须由电工持证作业，穿绝缘鞋、戴绝缘手套、用绝缘工具；「电工独立完成」缺少监护不符合电气作业双人制，A错误。"},{"type":"单选","stem":"安全技术交底一般不宜采用 （　） 形式进行。","options":["书面文件","集体会议","样板演示","远程视频"],"answer":"D","why":"安全技术交底宜采用书面、会议、样板演示等能确认到达和留痕的形式；「远程视频」无法有效确认每个作业人员知悉，一般不宜采用。"},{"type":"单选","stem":"安全技术交底应覆盖工程项目的（　）","options":["管理人员","作业人员","技术人员","全体人员"],"answer":"D","why":"安全技术交底要覆盖工程项目全体人员——管理与作业人员一个都不能少，交底不留死角；只交底管理人员或作业人员都不完整。"},{"type":"判断","stem":"一般情况下,安全技术交底仅在整个项目施工前做一次交底时不够的。（　）","options":[],"answer":"对","why":"安全交底不是一锤子买卖：开工前总交底后，新工序、新人员进场、环境变化时都要再交底，仅项目开工前交一次明显不够，题干正确。"},{"type":"单选","stem":"安全技术交底的内容一般不包括 （　）","options":["作业危险因素","具体预防措施","生产操作规程","事故处理报告"],"answer":"D","why":"交底内容包括作业危险因素、针对性预防措施、操作规程等；「事故处理报告」属事后管理内容，事前交底不含它。"},{"type":"单选","stem":"正确的安全技术交底的时间点是 （　）。","options":["项目投标前","施工图设计前","项目开工前","竣工交付前"],"answer":"C","why":"安全技术交底的法定时间点是项目开工前——先交底后作业；投标前、设计前还无作业安排，竣工交付前才交底完全本末倒置。"},{"type":"多选","stem":"关于安全技术交底的时间点,选择正确的是 （　）","options":["项目投标前","项目开工前","作业班组进场前","关键作业实施前","竣工交付"],"answer":"BC","why":"交底时间点：项目开工前+作业班组进场前（新班组进场必须重新交底）；投标前不需要，竣工交付前交底毫无意义；「关键作业实施前」按教材口径不入选。"},{"type":"判断","stem":"施工现场有两个以上施工单位施工时,建设单位应明确各方的安全职责。 （　）","options":[],"answer":"对","why":"两个以上施工单位在同一现场施工，建设单位应明确各方安全职责，题干是《安全生产法》协调管理要求，正确。"},{"type":"判断","stem":"施工现场有两个以上施工单位施工时,建设单位应指定其中一个,对施工现场实行统一管理（　）","options":[],"answer":"错","why":"多方施工时由建设单位协调各方职责，「指定其中一个施工单位对现场统一管理」缺乏依据——施工方之间无管理权，故题干错误；协调主体是建设单位而非某家施工方。"},{"type":"多选","stem":"通信工程施工现场的安全生产管理,包括 （　）","options":["建立项目安全生产责任体系","编制安全技术措施、方案","组织安全检查、整改安全隐患","确定消防安全责任人","组织安全事故调查处理"],"answer":"ABCD","why":"现场安全生产管理包括：建立项目安全责任体系、编制安全技术措施方案、组织安全检查整改隐患、确定消防安全责任人等；「组织安全事故调查处理」由政府/上级主导，不属现场日常管理内容。"},{"type":"多选","stem":"通信工程施工现场的安全生产管理,包括（　）。","options":["配置人员、设施、劳动防护用品","编制安全技术措施、方案","组织安全检查、整改安全隐患","对施工安全生产进行记录","组织安全事故调查处理"],"answer":"ABCD","why":"现场安全管理还包括配置人员设施防护用品、编制安全技术措施、组织检查整改、安全生产记录等；E事故调查处理同上题——不是施工现场的日常管理职责。"},{"type":"单选","stem":"施工现场安全管理的“三点控制”中的三点不包括 （　）","options":["危险点","危害点","事故多发点","质量控制点"],"answer":"D","why":"「三点控制」=危险点、危害点、事故多发点的强化控制；「质量控制点」属质量管理体系，与安全三点无关，见「质量」即排除。"},{"type":"多选","stem":"施工现场安全管理的“三点控制”是指对现场的（　）进行强化控制管理。","options":["危险点","危害点","事故多发点","质量控制点","里程碑时间点"],"answer":"ABC","why":"三点控制指对危险点、危害点、事故多发点进行强化控制管理，教材原文；质量控制点、里程碑时间点都是其他体系的词汇。"},{"type":"单选","stem":"下列做法中,不属于施工现场常见的违规操作行为的是 （　）","options":["不按规定使用劳动防护用品","不执行规定的安全防范措施","对违章指挥盲目服从,不加抵制","强令他人冒险进入危险区域"],"answer":"D","why":"常见违规操作：不按规定用防护用品、不执行防范措施、盲目服从违章指挥；「强令他人冒险进入危险区域」性质严重得多，属违章指挥/强令冒险作业行为，不属「常见违规操作」范畴，故选D。"},{"type":"多选","stem":"通信施工现场,施工人员的以下行为,对做到“保证他人不被伤害”有所帮助的包括 （　）。","options":["发现事故隐患主动告知他人","提出安全建议","与他人分享安全经验","关注他人身体情况和精神状况","虚心接受他人对自己行为的纠正"],"answer":"ABCD","why":"「不伤害他人」：主动告知隐患、分享安全经验、关注他人状态、虚心接受纠正都有帮助；「提出安全建议」主要作用于改进管理，按教材口径也计入互保联保范畴，故ABCD全对。"},{"type":"多选","stem":"通信工程施工现场,室内作业涉及的作业环境不良的因素包括（　）","options":["恶劣气候与环境","作业场所狭窄","作业场地杂乱","室内梯架缺陷","采光照明不良"],"answer":"BCDE","why":"室内作业环境不良：场所狭窄、场地杂乱、梯架缺陷、采光照明不良等；「恶劣气候与环境」属室外作业因素，室内不存在，故选BCDE。"},{"type":"多选","stem":"通信线路建设中,应采取的环保措施包括（　）","options":["尽量减少林木砍伐和对天然植被的破坏","应根据实际情况采取有效的水土保持措施","严禁在崩塌滑坡危险区采石、采砂、取土","倾倒在河滩、沟渠的废沙、石、土等,其裸漏表面应植树种草","应采用喷水、覆盖等有效措施控制扬尘"],"answer":"ABCE","why":"线路建设环保措施：减少林木砍伐植被破坏、水土保持、严禁在崩塌滑坡危险区采石取砂、控制扬尘；D「向河滩沟渠倾倒废沙石」本身就是违法行为，谈不上措施。"},{"type":"单选","stem":"通信工程中,废弃的沙、石、土的处理,错误的是 （　）","options":["必须运至规定的专门存放地堆放","不得向江河、湖泊、水库倾倒","可以向废弃的沟渠倾倒并植树种草","临时堆放时应防止被雨水冲走"],"answer":"C","why":"废弃沙石土必须运至规定专门存放地，不得向江河湖泊水库倾倒，临时堆放要防雨水冲刷；「向废弃沟渠倾倒并植树种草」仍是违法倾倒行为，C错误。"},{"type":"单选","stem":"通信工程中,同一工程项目有多个分包商施工时,由（　）对各分包商的安全生产工作统一协调、管理。","options":["建设单位","监理单位","总包单位","分包单位"],"answer":"C","why":"同一项目多个分包商施工，由总包单位对分包的安全生产工作统一协调、管理——总包负总责；建设单位只管协调施工现场总体，不直接管分包安全。"},{"type":"多选","stem":"总包单位对分包商的安全审核主要内容包括 （　）","options":["取得国家规定的安全资质证书","建立完善的安全管理机构","配备不少于一定比例的专职安全管理人员","通过第三方职业健康安全审核","具有规定数量的工程技术人员"],"answer":"ABC","why":"总包对分包安全审核：安全资质证书、安全管理机构、专职安全员配备比例；「第三方职业健康安全审核」「工程技术人员数量」不是安全审核的法定内容。"},{"type":"多选","stem":"总包单位应定期对分包商进行安全考核和评价,内容包括 （　）","options":["分包商安全生产管理机构设置情况","分包商安全生产管理人员配置及资格情况","分包商安全生产违约、违章记录","分包商安全生产绩效","分包商质量进度情况"],"answer":"ABCD","why":"对分包的定期安全考核评价：机构设置、人员配置资格、违约违章记录、安全绩效；「质量进度情况」属履约评价，与安全考核并列但不同类，故不选E。"}]},{"file":"10第十章","title":"第十章","count":34,"questions":[{"type":"单选","stem":"凡是禁止、停止和有危险的器件设备或环境,应涂以 （　） 色的。","options":["红","蓝","绿","黄"],"answer":"A","why":"安全色规定：红色=禁止、停止、危险，蓝色=指令必须遵守，黄色=警告注意，绿色=提示安全状态。禁止停止和危险器件环境涂红色，口诀「红停蓝必黄警绿行」。"},{"type":"单选","stem":"安全色中（　） 常用于表示紧急停止、禁止和危险的信号。","options":["红色","黄色","蓝色","绿色"],"answer":"A","why":"红色光波最长、视认性最强，用于紧急停止、禁止、危险信号；黄色是警告，蓝色是指令，绿色是安全提示，层次分明。"},{"type":"单选","stem":"消防设备应涂以（　）色","options":["红","蓝","绿","黄"],"answer":"A","why":"消防设备、灭火器材均涂红色——红色代表消防和禁止，火情紧急属性与红色的高注目性匹配，全国统一。"},{"type":"单选","stem":"需要使用红色标记的有 （　）","options":["消防设备","机械的启动按钮","危险机器的警戒线","道路边指引车辆行驶方向的交通指示标志"],"answer":"A","why":"红色标记：消防设备、禁止标志、紧急停止按钮；机械启动按钮用绿色（启动=安全通行色），交通指示标志用蓝色，警戒线用黄色。"},{"type":"单选","stem":"机器的停止按钮应使用（　）色。","options":["红","蓝","绿","黄"],"answer":"A","why":"机器停止按钮用红色——停止即「禁停类」动作，与紧急停止一致；启动按钮用绿色，一红一绿成对记忆。"},{"type":"多选","stem":"红色注目性高,视认性很好,可用于表示 （　）","options":["交通禁令标志","消防设备标志","警告信号旗","必须佩戴防护用具","仪表刻度盘上极限位置的刻度"],"answer":"ABE","why":"红色高注目高视认，用于交通禁令标志、消防设备标志、仪表刻度盘极限位置刻度；警告信号旗用黄色，「必须佩戴防护用具」是指令标志用蓝色。"},{"type":"单选","stem":"必须配戴安全帽标志,应使用（　）色标记","options":["红","蓝","绿","黄"],"answer":"B","why":"「必须配戴安全帽」属指令标志——强制必须做的事，指令标志用蓝色圆形白图形；红色是禁止，黄色是警告，绿色是提示。"},{"type":"多选","stem":"黄色对人眼睛能产生比红色更高的明度,可用于表示 （　）","options":["危险机器的警戒线","消防设备标志","交通禁令标志","道路交通标志和标线中警告标志","楼梯的第一级和最后一级的踏步前沿"],"answer":"ADE","why":"黄色明度高，用于警告：危险机器警戒线、道路交通警告标志、楼梯首末级踏步前沿（防踏空）；消防设备用红色，交通禁令用红色。"},{"type":"单选","stem":"车间内的安全通道、太平门指示标志使用（　）色","options":["红","蓝","绿","黄"],"answer":"C","why":"安全通道、太平门（安全出口）指示用绿色——绿色表示通行、安全状态，逃生方向一路绿灯，遇火灾跟随绿色标志撤离。"},{"type":"单选","stem":"机器的启动按钮应使用 （　）色。","options":["红","蓝","绿","黄"],"answer":"C","why":"启动按钮用绿色：绿色代表正常、安全、可以通行，按下启动是允许性动作；与红色停止按钮成对记忆，别答反。"},{"type":"单选","stem":"《安全色》 (GB2893-2008) 中规定绿色的对比色为 （　）色。","options":["红","黑","白","黄"],"answer":"C","why":"《安全色》规定绿色的对比色是白色——绿底白字对比清晰（如安全出口标志）；红/蓝/黄的对比色是黑色（黄色对比色为黑色），规律：明色配黑，深色配白。"},{"type":"单选","stem":"《安全色》 (GB2893-2008) 中规定黄色的对比色为（　）色。","options":["白","黑","绿","黄"],"answer":"B","why":"黄色的对比色是黑色——黄黑相间是警戒线经典配色，明度差最大最醒目；绿色对比色是白色，红色、蓝色对比色为白色系图形。"},{"type":"单选","stem":"道路边指引车和行人行驶方向的交通指示标志使用 （　）色标","options":["红","蓝","绿","黄"],"answer":"B","why":"道路指引行驶方向的交通指示标志用蓝色——蓝=指令/指示，「指路找蓝牌」；红色禁令、黄色警告、绿色高速指路牌为特例。"},{"type":"单选","stem":"指令标志由圆形边框、（　）色背景图形和白色的指令图形符号组成。","options":["红","蓝","黄","绿"],"answer":"B","why":"指令标志：圆形边框+蓝色背景+白色图形符号（如必须戴安全帽）；禁止标志是红圈红斜杠，警告是黄底黑边黑图形，提示是绿底方框。"},{"type":"单选","stem":"提示标志由正方形边框的（　）色背景图形和被提示的白色图形符号及文字组成。","options":["红","蓝","黄","绿"],"answer":"D","why":"提示标志：正方形边框+绿色背景+白色图形符号文字（如紧急出口、应急避难所）；绿=安全、通行、可求助。"},{"type":"单选","stem":"应急避难场所标志使用（　）色。","options":["红","蓝","绿","黄"],"answer":"C","why":"应急避难场所标志用绿色——逃向安全处的提示类标志统一用绿底白图形，与安全出口标志同族。"},{"type":"多选","stem":"安全标志分为（　）","options":["禁止标志","警告标志","指令标志","提示标志","操作标志"],"answer":"ABCD","why":"安全标志四大类：禁止（红）、警告（黄）、指令（蓝）、提示（绿）；「操作标志」不存在，是凑数项。"},{"type":"单选","stem":"文字辅助标志横写时,禁止标志的文字辅助标志为（　）色字。","options":["红","蓝","白","黑"],"answer":"C","why":"文字辅助标志横写时，禁止标志的文字为白色（红底白字）——红底上白字最清晰；警告是黑字黄底，指令是白字蓝底。"},{"type":"单选","stem":"文字辅助标志横写时,指令标志的文字辅助标志为（　）色字。","options":["红","蓝","白","黑"],"answer":"C","why":"横写的文字辅助标志中，指令标志文字为白色（蓝底白字），与指令标志图形的白图形一致；红色禁止同样是白字。"},{"type":"单选","stem":"文字辅助标志横写时,警告标志的文字辅助标志为（　）色字。","options":["红","蓝","白","黑 A)"],"answer":"D","why":"警告标志的文字辅助标志为黑色字——黄底黑字是警告的标准配色，黑字在黄色上明度反差大，远距离可辨。"},{"type":"单选","stem":"文字辅助标志横写时,警告标志的文字辅助衬底色是 （　）。","options":["黄色","白色","标志的颜色","绿色"],"answer":"B","why":"警告标志文字辅助横写时衬底为白色——图形部分黄底黑图形，文字部分白底黑字，形成「图形醒目、文字易读」的分工。"},{"type":"单选","stem":"生命四大特征包括呼吸、体温、血压和 （　）","options":["血糖","脉搏","瞳孔","血氧"],"answer":"B","why":"生命四大体征：呼吸、体温、脉搏、血压；急救评估先看这四项，血糖、瞳孔、血氧是辅助观察指标，不列入四大体征。"},{"type":"单选","stem":"正常人的呼吸频率为（　） 次/分。","options":["-12","14-18","28-32","60-80"],"answer":"B","why":"正常成人呼吸频率14~18次/分，安静状态下的参考区间；60~80次/分接近脉搏正常值（60~100次/分），两个数字别互换。"},{"type":"多选","stem":"以下生命体征参数正常的有 （　）","options":["呼吸 18 次/分","体温 36.8°","脉搏 62 次/分","脉搏 90 次/分","血压舒张压为 120"],"answer":"ABCD","why":"正常值判断：呼吸18次/分（14-18内）、体温36.8℃（36-37内）、脉搏62次/分（60-100内）、脉搏90次/分也在正常区间；「舒张压120」错——120是收缩压上限值，舒张压正常约60~90mmHg。"},{"type":"单选","stem":"火警电话为 （　）。","options":["10","119","120","122"],"answer":"B","why":"火警119、急救120、交通事故122、报警110；记忆：119谐音「要要救」，120是医疗急救专线。"},{"type":"单选","stem":"创伤急救原则是:（　）","options":["先固定,后搬运,再抢救","先搬运,后固定,再抢救","先抢救,后搬运,再固定","先抢救,后固定,再搬运"],"answer":"D","why":"创伤急救原则：先抢救、后固定、再搬运——保命优先于固定，固定优先于搬动，顺序颠倒会加重损伤甚至致命。"},{"type":"单选","stem":"一旦发现有人触电倒地,首先应该 （　）","options":["使伤者脱离电源","实施心肺复苏","打 112 急救","负责人报告"],"answer":"A","why":"发现触电倒地第一动作是使伤者脱离电源（拉闸、用绝缘物挑开电线）——不脱离电源就接触伤者会导致施救者连环触电，顺序绝对不能乱。"},{"type":"多选","stem":"人员发生触电事故急救时,以下处理方法正确的有。（　）","options":["使伤员就地平卧,松解衣扣","如果触电的人神志清醒,呼吸心跳均正常,让伤员站立并走动进一步观察","如果触电的人呼吸停止而脉搏存在,进行口对口人工呼吸","如果触电的人心博停止而呼吸存在,进行人工胸外心脏按压","如果触电的人呼吸、心跳均停止者,等待医务人员救助"],"answer":"ACD","why":"触电急救：就地平卧松解衣扣正确；神志清醒呼吸心跳正常者应就地休息观察而非站立走动（B错）；呼吸停脉搏在做人工呼吸，心跳停呼吸在做胸外按压（C、D对）；呼吸心跳均停要立即同时心肺复苏而非干等医生（E错）。"},{"type":"单选","stem":"人员发生触电事故,若呼吸、心脏均停止,现场急救应采用 （　）方法。","options":["人工呼吸","胸外心脏按压","人工呼吸和胸外按压应同时进行","等待专业人员救助"],"answer":"C","why":"呼吸心跳全停必须人工呼吸+胸外按压同时进行——单做一项都无法维持循环供氧，这就是心肺复苏（CPR）的组合操作。"},{"type":"单选","stem":"触电者神志清醒、有意识,心脏跳动,但呼吸急促、面色苍白,此时（　）用心肺复苏法抢救。","options":["不能","应立即","可以","将其移到安全处后"],"answer":"A","why":"触电者神志清醒、有心跳，仅呼吸急促面色苍白，说明循环存在，不能用心肺复苏——CPR只用于呼吸心跳骤停者，对清醒者按压反而造成伤害。"},{"type":"单选","stem":"触电伤员呼吸微弱或停止时,应立即通畅触电者的气道。（　）用枕头等物垫在伤员头下。","options":["应当","宜","严禁","不宜"],"answer":"C","why":"触电伤员呼吸微弱或停止时，通畅气道的过程中严禁用枕头等物垫在头下——垫高头部会阻塞气道甚至压迫颈椎，应解开衣领、仰头抬颏。"},{"type":"判断","stem":"发生中毒事故后,应当查明中毒原因并采取有效安全防护措施后将中毒人员移至通风良好、空气新鲜的地方,确保患者呼吸道通畅,对神志不清者应将头部偏向一侧。 （　）","options":[],"answer":"对","why":"中毒急救：先查明原因做好自身防护，再移至通风空气新鲜处，保持呼吸道通畅；神志不清者头部偏向一侧防呕吐物误吸窒息，题干做法正确。"},{"type":"判断","stem":"发生中毒事故后,应当查明中毒原因并采取有效安全防护措施后将中毒人员移至通风良好、空气新鲜的地方,确保患者呼吸道通畅,对神志不清者应脸向上平躺。 （　）","options":[],"answer":"错","why":"神志不清的中毒者必须「头偏向一侧」防止呕吐物堵塞气道；脸向上平躺一旦呕吐极易窒息死亡，与上一题只差四个字，命题就在这设坑。"},{"type":"单选","stem":"实施心肺复苏术时,按压的频次每分钟应为 （　）","options":["0-80 次","80-100 次","100-120 次","120-140 次"],"answer":"C","why":"心肺复苏按压频率100~120次/分（2015年后国际指南标准），按压深度5~6cm；80~100次是旧标准，按最新口径记忆。"}]},{"file":"11第十一章","title":"第十一章","count":94,"questions":[{"type":"单选","stem":"作业人员对于施工现场的火灾事故防范应做到三懂三会,其中三懂不包括 （　）。","options":["懂本岗位的火灾危险性","懂预防火灾的措施","懂火灾扑救的方法","懂消防器材的设置要求"],"answer":"D","why":"“三懂”指懂本岗位火灾危险性、懂预防火灾的措施、懂火灾扑救的方法；“懂消防器材的设置要求”不在其列，会用器材属于“三会”范畴，勿把“懂”与“会”混淆。"},{"type":"多选","stem":"燃烧的特征包括（　）,这也是区分燃烧和非燃烧的依据","options":["发光","发热","生成新物质","可燃物","助燃物"],"answer":"ABC","why":"燃烧是可燃物与氧化剂之间发生的发光、发热、生成新物质的剧烈氧化反应，这三大特征也是区分燃烧与非燃烧的依据；“可燃物、助燃物”是燃烧条件而非特征，属概念混淆。"},{"type":"多选","stem":"燃烧过程的发生和发展须具备的必要条件包括 （　）","options":["引火源","还原剂","发光","可燃物","氧化剂"],"answer":"ADE","why":"燃烧三要素为可燃物、氧化剂（助燃物）和引火源，三者同时具备并相互作用才能起火；“还原剂”与燃烧的氧化机理相悖，“发光”是燃烧特征不是条件，故选ADE。"},{"type":"多选","stem":"下列物质属于助燃物的有 （　）。","options":["氢气","乙快","氨气","氧气","甲烷"],"answer":"CD","why":"助燃物是帮助可燃物燃烧的氧化剂，典型如氧气、氨气等；氢气、乙炔、甲烷本身可以燃烧，属于可燃气体，把可燃物误当助燃物是最常见错误，故选CD。"},{"type":"单选","stem":"属于分解燃烧形式的是 （　）的燃烧。","options":["酒精","木炭","铁","木材"],"answer":"D","why":"木材受热分解出可燃气体后再燃烧，属分解燃烧；酒精先熔化蒸发属蒸发燃烧，木炭、铁在表面直接氧化属表面燃烧，按受热后“先分解还是先蒸发”区分。"},{"type":"多选","stem":"下列物质的燃烧属于分解燃烧形式的有 （　）","options":["纸","木碳","油脂","木材","酒精"],"answer":"AD","why":"纸、木材受热分解产生可燃挥发分而燃烧，属分解燃烧；木炭为表面燃烧，油脂、酒精靠蒸发气化燃烧属蒸发燃烧，判断关键是受热后先分解还是先气化，故选AD。"},{"type":"多选","stem":"下列物质的燃烧属于表面燃烧形式的有 （　）","options":["纸","木炭","焦炭","木材","铜"],"answer":"BCE","why":"木炭、焦炭、铜等受热不分解出可燃气体，直接在表面与氧反应，属表面燃烧；纸、木材受热先分解放出可燃气体，属分解燃烧，两者机理不同，故选BCE。"},{"type":"单选","stem":"根据我国现行标准规定 （　）火灾属于","options":["类火灾A 木材","石蜡","氢气","铝镁合金"],"answer":"A","why":"依据火灾分类标准，A类是固体火灾，木材、纸张、棉布等是典型代表；石蜡属可熔化固体为B类，氢气为C类，铝镁合金为D类，故选木材。"},{"type":"单选","stem":"根据我国现行标准规定 （　） 火灾属于 B 类火灾","options":["木材","石蜡","氢气","铝镁合金"],"answer":"B","why":"依据火灾分类标准，B类是液体或可熔化固体火灾，石蜡受热熔化燃烧属B类；木材是A类固体，氢气是C类气体，铝镁合金是D类金属，故选石蜡。"},{"type":"单选","stem":"根据我国现行标准规定,（　） 火灾属于 C 类火灾","options":["木材","石蜡","氢气","铝镁合金"],"answer":"C","why":"依据火灾分类标准，C类是气体火灾，氢气、甲烷、天然气等可燃气体着火属C类；石蜡属B类可熔化固体，铝镁合金属D类金属火灾，故选氢气。"},{"type":"单选","stem":"根据我国现行标准规定 （　） 火灾属于 D 类火灾。","options":["木材","石蜡","氢气","铝镁合金"],"answer":"D","why":"依据火灾分类标准，D类是金属火灾，钾、钠、镁、铝镁合金等轻金属燃烧属D类，须用专用灭火剂扑救；木材、石蜡、氢气分属A、B、C类，故选铝镁合金。"},{"type":"判断","stem":"根据我国现行标准规定,动物油脂火灾属于 F 类（　）。","options":[],"answer":"对","why":"依据火灾分类标准，F类是烹饪器具内的烹饪物火灾，动物油脂、植物油脂是典型代表，说法正确；记忆“厨房油脂=F类”，勿与B类液体火灾混淆。"},{"type":"单选","stem":"死亡 30 人的火灾,属于 （　） 火灾。","options":["一般","较大","重大","特别重大"],"answer":"D","why":"依据火灾等级划分标准，死亡30人及以上为特别重大火灾，分级口诀“3、10、30”；30人恰好达到最高档，最易误选“重大”，记住30含在本档内，故选特别重大。"},{"type":"单选","stem":"重伤 50 人的火灾,属于（　） 火灾。","options":["一般","较大","重大","特别重大"],"answer":"C","why":"依据火灾等级划分标准，重伤10人以上50人以下为重大火灾，重伤100人以上才为特别重大；50人恰在上限档内，勿按“50往上”多跳一档，故选重大。"},{"type":"单选","stem":"死亡 5 人的火灾,属于（　） 火灾。","options":["一般","较大","重大","特别重大"],"answer":"B","why":"依据火灾等级划分标准，死亡3人以上10人以下为较大火灾；5人落在3~10区间属较大，误选“一般”是忘了3人是第一道分界线，故选较大。"},{"type":"单选","stem":"死亡 1 人的火灾,属于（　）火灾。","options":["一般","较大","重大","特别重大"],"answer":"A","why":"依据火灾等级划分标准，死亡3人以下为一般火灾，1人在一般档内；记住“3、10、30”三道线，1小于3，勿因有人员死亡就人为拔高等级，故选一般。"},{"type":"判断","stem":"一般情况下,闪点越低,火灾危险性越大。 （　）","options":[],"answer":"对","why":"闪点是液体表面蒸气遇火源发生闪燃的最低温度，闪点越低越易被点燃，火灾危险性越大，这也是划分易燃、可燃液体类别的依据，说法正确。"},{"type":"单选","stem":"扑救火灾的最佳阶段是（　）","options":["初起期","发展期 D 减弱期","减弱期 C 最盛期"],"answer":"A","why":"初起期燃烧面积小、火焰温度低、火势弱，用少量灭火器材即可扑灭，是扑救火灾的最佳时机；进入发展期、最盛期后火势猛烈，人员已难以靠近扑救。"},{"type":"单选","stem":"下列关于爆炸的说法,正确的是 （　）","options":["化学爆炸一般威力较小,而物理性爆炸往往威力非常大","物理爆炸只有极少数是氧化反应引起的爆炸","液化气钢瓶的爆炸属于化学爆炸","水蒸气爆炸属于物理爆炸"],"answer":"D","why":"水蒸气爆炸是水遇高温骤然汽化、压力剧增胀破容器所致，全程无化学反应，属典型物理爆炸；A把威力大小说反（化学爆炸威力通常更大），液化气钢瓶爆炸属化学爆炸，故选D。"},{"type":"单选","stem":"属于化学过程的灭火方法是 （　）","options":["冷却灭火","隔离灭火","室息灭火","抑蚱错灭火"],"answer":"D","why":"灭火四法中冷却、窒息、隔离均为物理作用，只有抑制（中断燃烧链式反应）属化学过程，如干粉、卤代烷灭火剂；误选窒息是把隔绝空气误当化学作用，故选D。"},{"type":"单选","stem":"不能使用泡沫灭火器扑救的火灾是（　）火灾。","options":["木材","汽油","石蜡","氢气"],"answer":"D","why":"泡沫灭火剂适用于A类固体和石油制品等B类液体火灾；氢气属C类气体火灾，泡沫无法覆盖熄灭气体火焰，须用干粉等灭火剂，故选氢气。"},{"type":"多选","stem":"泡沫灭火剂不适用于扑救 （　）火灾。","options":["类","类","类","类","类"],"answer":"CDE","why":"泡沫灭火剂含水、导电，只适用于A类固体和B类液体火灾；C类气体、D类金属及带电设备火灾都不能用，否则灭不了火还会触电，故选CDE。"},{"type":"单选","stem":"能用于扑救 1KV 以上高压带电设备的灭火剂是 （　）","options":["泡沫灭火剂","二氧化碳灭火剂","干粉灭火剂","烟雾灭火剂"],"answer":"C","why":"干粉不导电、绝缘性好，可扑救1kV以上高压带电设备火灾；泡沫及含水灭火剂导电、严禁用于带电火灾，二氧化碳一般限用于1kV以下，故选干粉。"},{"type":"单选","stem":"不能使用干粉灭火器扑救的火灾是（　）火灾。","options":["可燃液体","可燃固体","可燃气体","轻金属"],"answer":"D","why":"干粉灭火器适用于可燃液体、固体、气体及带电设备火灾；轻金属燃烧剧烈且会与普通干粉反应，须用专用D类灭火剂或干砂扑救，故选轻金属。"},{"type":"单选","stem":"二氧化碳灭火器主要灭火原理是 （　）","options":["冷却","室息","隔离","抑制"],"answer":"B","why":"二氧化碳喷出后笼罩燃烧物，把氧浓度稀释到燃烧无法维持的程度，主要靠窒息灭火，冷却只是附带作用；误选冷却是以次充主，故选窒息。"},{"type":"多选","stem":"混合气体灭火剂是由（　） 按一定比例混合而成的气体","options":["氮气","气","氧气","二氧化碳气体","一氧化碳"],"answer":"ABD","why":"混合气体灭火剂（IG-541）由氮气、氩气、二氧化碳按约5:4:1比例混合而成，靠稀释氧浓度灭火；不含氧气和一氧化碳，含氧反而助燃，故选ABD。"},{"type":"单选","stem":"混合气体灭火剂中不包含 （　）","options":["氮气","二氧化碳","氧气","气"],"answer":"C","why":"混合气体灭火剂成分是氮气、氩气、二氧化碳，不含氧气；它正是靠把防护区氧浓度稀释至燃烧极限以下灭火，若含氧则失去灭火意义，故选氧气。"},{"type":"单选","stem":"混合气体灭火剂不能扑救的火灾是 （　） 火灾。","options":["类","类","类 D","类"],"answer":"C","why":"混合气体灭火剂适用于A类固体、B类液体、C类气体及带电设备火灾；D类金属火灾燃烧剧烈、窒息法无效，须专用灭火剂，故不能扑救的是D类金属火灾。"},{"type":"单选","stem":"火灾自动报警系统一般由触发器件、火灾报警装置、（　）和电源四部分组成。","options":["火灾警报装置","自动灭火装置","防烟排烟装置","安全疏散设施"],"answer":"A","why":"依据消防技术规范，火灾自动报警系统由触发器件、火灾报警装置、火灾警报装置和电源四部分组成；“自动灭火装置”属消防联动控制系统，不属于报警系统，故选A。"},{"type":"多选","stem":"火灾自动报警系统一般由 （　） 和电源四部分组成。","options":["触发器件","火灾报警装置","火灾警报装置","自动灭火装置","防烟排烟装置"],"answer":"ABC","why":"火灾自动报警系统四件套：触发器件（感烟感温探测器、手动报警按钮）、火灾报警装置、火灾警报装置、电源；自动灭火、防排烟装置属联动系统，故选ABC。"},{"type":"单选","stem":"火灾自动报警系统中的核心组成部分是（　）","options":["触发器件","火灾警报器","火灾报警控制器","消防控制器"],"answer":"C","why":"火灾报警控制器是火灾自动报警系统的核心，负责接收探测信号、判断火情并发出警报和联动指令；触发器件只是前端感知元件，故选火灾报警控制器。"},{"type":"判断","stem":"灭火器由筒体、器头、喷嘴等部件组成,借助驱动压力将所充装的灭火剂喷出,达到灭火的目的,是扑救初起火灾的重要消防器材。（　）","options":[],"answer":"对","why":"这是灭火器的规范定义：由筒体、器头、喷嘴等部件组成，借驱动压力喷出灭火剂，轻便灵活、即取即用，正是扑救初起火灾的重要消防器材，说法正确。"},{"type":"多选","stem":"通常通信机房中常用 （　） 和阻火模块等封堵电缆井和各种缆线通过的孔洞。","options":["泡沫封堵材料","柔性有机材料","阻火包","防火封堵板材","防火蜜封胶"],"answer":"BCD","why":"通信机房常用柔性有机堵料、阻火包、防火封堵板材封堵电缆井和缆线孔洞，兼顾防火性能与日后拆装检修；泡沫类材料不阻燃不耐久，不能作正式封堵，故选BCD。"},{"type":"单选","stem":"气焊或气割时,操作人员应保证气瓶距火源之间的距离在 （　）米以上。","options":["10","15","18"],"answer":"B","why":"依据焊接切割安全要求，气焊气割时气瓶距火源应在15米以上，防止瓶体受热内压升高发生爆炸；误选10米安全裕度不足，故选15。"},{"type":"判断","stem":"焊接带电的设备时可不断电,但需采取措施,避免触电。 （　）","options":[],"answer":"错","why":"焊接带电设备必须先切断电源，经验电、挂牌后再作业，严禁带电焊接；带电焊接既有触电危险，又会烧损设备，“可不断电”的说法错误。"},{"type":"单选","stem":"氧气瓶是储存和运输氧气的专用高压容器,它是由瓶体、瓶箍、瓶阀和瓶帽 4 部分组成。其瓶体为 （　）色,并用黑漆标明氧气两字,用以区别其它气瓶。","options":["白","黑","天蓝","灰"],"answer":"C","why":"依据气瓶颜色标志规定，氧气瓶瓶体为天蓝色，配套口诀“氧瓶天蓝黑字、乙炔白瓶红字”，天蓝即氧气瓶，故选天蓝。"},{"type":"单选","stem":"氧气瓶是储存和运输氧气的专用高压容器,它是由瓶体、瓶箍、瓶阀和瓶帽 4 部分组成。其瓶体为天蓝色,并用（　） 漆标明氧气两字,用以区别其它气瓶。","options":["白","黑","红","黄"],"answer":"B","why":"氧气瓶天蓝瓶体上用黑漆标明“氧气”二字；与乙炔瓶“白瓶红字”成对记忆，瓶色与字色都不能弄反，故选黑。"},{"type":"单选","stem":"氧气瓶与明火之间的最小距离为（　）M。","options":["5","10","15"],"answer":"C","why":"氧气是强助燃剂，瓶阀泄漏遇明火会猛烈燃烧甚至爆燃，规程要求氧气瓶与明火距离不小于15米；误选10米距离偏小、隐患大，故选15。"},{"type":"单选","stem":"乙炔瓶是一种储存和运输乙炔的容器,其瓶体外表漆成白色,并漆有 （　）色\"乙炔”字样。","options":["天蓝","黑","红","黄"],"answer":"C","why":"依据气瓶颜色标志规定，乙炔瓶瓶体白色，“乙炔”字样为红色；与氧气瓶“天蓝黑字”对照，口诀“氧蓝黑、炔白红”，故选红。"},{"type":"单选","stem":"乙炔瓶与易燃、易爆物质之间的存放距离不得近于 （　） M。","options":["5","10","15"],"answer":"B","why":"乙炔化学性质活泼、极易燃爆，与易燃易爆物质的存放距离不得小于10米，防止相互引燃酿成连环事故；误选5米距离过近，故选10。"},{"type":"判断","stem":"必须将氧气瓶或乙炔瓶内的气体全部用完后方可再罐装气体。（　）","options":[],"answer":"错","why":"气瓶内气体不得全部用尽，必须留有剩余压力，防止空气倒灌混入瓶内，否则再充装时会形成爆炸性混合气体，极易发生危险，“全部用完”说法错误。"},{"type":"单选","stem":"如果发现电器设备着火,首先应该 （　）","options":["找就近灭火器灭火","关掉电源","打 119 报警","立即通知消防控制室人员"],"answer":"B","why":"电气设备着火的第一步是关掉电源，断电后再灭火才能避免触电、防止事故扩大；直接找灭火器或报警都可能延误断电时机导致触电，故选关掉电源。"},{"type":"多选","stem":"电气事故按发生灾害的形式,可以分为人身事故（　） 等","options":["接地事故","漏电事故","爆炸事故","设备事故","电气火灾"],"answer":"CDE","why":"按发生灾害的形式，电气事故分为人身事故、设备事故、电气火灾、爆炸事故等；接地事故、漏电事故是按故障原因的划分，不属于按灾害形式分类，故选CDE。"},{"type":"判断","stem":"无论哪种电气事故,都是由于各种类型的电流、电荷、电磁场的能量不适当释放或转移造成的。 （　）","options":[],"answer":"对","why":"电气事故的本质是电能失控，即电流、电荷、电磁场的能量不适当释放或转移，对人体、设备、环境造成损害，该表述符合电气事故机理，说法正确。"},{"type":"多选","stem":"电流对人体的伤害的严重程度与 （　）有关","options":["通过人体的电流大小","通过人体的电流频率","通过人体的电流持续时间","流经途径","人体的体型"],"answer":"ABCD","why":"电流对人体的伤害程度取决于电流大小、频率、持续时间、流经途径及个体健康状况等因素；“体型”并非影响因素，属于干扰项，故选ABCD。"},{"type":"单选","stem":"引起电击事故最危险的电流频率是 （　）","options":["直流","50Hz","50KHz","50MHz"],"answer":"B","why":"50Hz工频电流最容易诱发心室颤动，引起室颤所需的电流最小，对人体最危险；高频电流的生理危害反而相对较小，故选50Hz。"},{"type":"单选","stem":"对于工频电流,一般成年男性的感知电流为（　）mA 左右","options":["0.5","0.7","1.1","1.6"],"answer":"C","why":"工频条件下成年男性感知电流约1.1mA，女性约0.7mA、约为男性的三分之二；1.1对应男性档，误选其他数值是把交、直流阈值混淆，故选1.1。"},{"type":"单选","stem":"对于工频电流,一般成年女性在摆脱概率为 50%时的摆脱电流约为（　） mA.","options":["9","10.5","16"],"answer":"C","why":"摆脱电流随概率要求递减：50%摆脱概率对应约16mA，10.5mA、9mA分别对应更高的概率档，99.5%时数值最小；误选10.5、9是概率档位记混，故选16。"},{"type":"单选","stem":"对于工频电流,一般成年男性在摆脱概率为 99.5%时的摆脱电流约为（　） mA。","options":["9","10.5","16"],"answer":"B","why":"工频电流下，男性在99.5%摆脱概率时摆脱电流约10.5mA；三档数值16＞10.5＞9，保证绝大多数人能摆脱时取较小值，误选16是50%档的数值，故选10.5。"},{"type":"单选","stem":"对于工频电流,一般成年女性在摆脱概率为 99.5%时的摆脱电流约为（　） mA。","options":["9","10.5","16"],"answer":"A","why":"女性在99.5%摆脱概率时摆脱电流约9mA，低于男性的10.5mA，说明女性摆脱能力较弱、安全限值应更严；误选10.5是男性对应档，故选9。"},{"type":"单选","stem":"对于工频电流,当电流持续时间超过心脏跳动周期时,人的室额电流约为 （　） mA。","options":["0","50","100","500"],"answer":"B","why":"当通电时间超过心脏搏动周期时，约50mA的工频电流即可引发心室颤动，是致命阈值；500mA是通电时间极短时的室颤值，条件不同勿混，故选50。"},{"type":"单选","stem":"正常人在正常条件下对直流电流的感觉闽值约为 （　） mA。","options":["2","5","10"],"answer":"B","why":"正常人在正常条件下对直流的感觉阈值约2mA，且只在电流接通和断开的瞬间有感觉、电流稳定期间无感觉；误选5、10mA是与其他阈值混淆，故选2。"},{"type":"单选","stem":"对于直流电来说,以下说法错误的是 （　）","options":["与交流相比,摆脱较难","正常人在正常条件下的感觉闯值约为 2mA,且只有在接通和断开时才会引起感觉","300mA 及以下时,没有可确定的摆脱闽值","电流持续时间小于 200ms 时,直流室颤闯值大致与交流相同"],"answer":"A","why":"直流在300mA及以下没有确定的摆脱阈值，摆脱障碍反而比交流小，“与交流相比摆脱较难”错误；B、C、D三项（2mA感觉阈值仅通断时有感觉、300mA以下无确定摆脱阈值、小于200ms时室颤阈值与交流大致相同）均为正确描述，故选A。"},{"type":"多选","stem":"关于人体对流经人体的电流的反应,说法错误的是 （　）","options":["儿童较大人敏感","女性较男性敏感","体重大的较体重轻的敏感","患有心脏病者触电死亡率较大"],"answer":"ABD","why":"本题考查人体触电敏感性规律：儿童较成人敏感、女性较男性敏感、患心脏病者触电死亡率更大，均为明确结论；C项把规律说反，应为体重轻者更敏感，符合规律的选项为ABD。"},{"type":"单选","stem":"绝大部分触电死亡事故是 （　） 造成的。","options":["电击","电伤","雷击","电磁辐射"],"answer":"A","why":"电击是电流通过人体内部，损害心脏、肺和中枢神经系统，绝大部分触电死亡由电击造成；电伤是电弧烧伤等体表伤害，一般不直接致命，故选电击。"},{"type":"多选","stem":"电伤包括 （　）等。","options":["间接接触电击","间接接触电伤","电烧伤","电烙印","电光眼"],"answer":"CDE","why":"电伤是电流热效应、化学效应等造成的体表伤害，包括电烧伤、电烙印、电光眼三种典型形式；间接接触电击属触电方式分类，不是电伤的具体形式，故选CDE。"},{"type":"多选","stem":"人体触电的方式有很多,常见的触电方式有 （　） 等","options":["单项触电","两相触电","三相触电","跨步触电","接触电压触电"],"answer":"ABDE","why":"常见触电方式有单相触电、两相触电、跨步电压触电、接触电压触电；规范分类中没有“三相触电”这一提法，人体同时触及两相即属两相触电，故选ABDE。"},{"type":"单选","stem":"安全工作规程要求人们在户内不要走近电线落地点 （　） M 以内地段,否则会发生触电事故。","options":["6","8","10"],"answer":"C","why":"导线落地后周围地面形成电位分布，越靠近落地点跨步电压越大；规程要求户内不得走近电线落地点10米以内，6米、8米均在危险区内，故选10。"},{"type":"判断","stem":"我国习惯上以 1kv 为界线,额定电压在 1 千伏及以上的称为高压,1 千伏以下的称为低压。（　）","options":[],"answer":"对","why":"我国习惯以1kV为界划分电压等级：额定电压1千伏及以上为高压，1千伏以下为低压，这是电气安全的基本口径，说法正确。"},{"type":"多选","stem":"防止直接接触电击事故中最基本、最重要的安全技术措施 （　）","options":["绝缘","屏护","间距","保护接地","保护接零"],"answer":"ABC","why":"绝缘、屏护、间距是防止直接接触电击最基本、最重要的三项技术措施；保护接地、保护接零主要用于漏电使外壳带电等间接接触防护，勿混，故选ABC。"},{"type":"判断","stem":"气体和液体绝缘击穿后,可以恢复其功能。（　）","options":[],"answer":"对","why":"气体、液体绝缘击穿后撤去电压能自行恢复绝缘性能，如空气间隙、变压器油；固体绝缘一旦击穿则永久损坏、必须更换，两者正相反，说法正确。"},{"type":"单选","stem":"变配电装置的户内临时栅栏高度不应低于 （　） m。","options":["1.0","1.2","1.5","1.7"],"answer":"B","why":"依据变配电装置安全要求，户内临时栅栏高度不应低于1.2米，防止人员误入或翻越带电间隔；户外要求更高为1.5米，成对记忆“内1.2外1.5”，故选1.2。"},{"type":"单选","stem":"变配电装置的户外临时栅栏高度不应低于 （　） m。","options":["1.0","1.2","1.5","1.7"],"answer":"C","why":"户外临时栅栏受风雨、视线等环境影响应更高，不应低于1.5米；误选1.2米是把户内标准套用到户外，记住“内低外高”，故选1.5。"},{"type":"单选","stem":"在 TN 系统中,以下做法错误的是（　）","options":["将电器外壳保护接地","将 PEN 线重复接地","安装电流型漏电保护器","单相负荷线路保护零线可借用工作零线"],"answer":"D","why":"TN系统中保护零线与工作零线必须严格分开，单相负荷的保护零线严禁借用工作零线，否则零线断开时设备外壳带电；重复接地、装漏电保护器均正确，故选D。"},{"type":"单选","stem":"金属容器内、隧道内、水井内以及周围有大面积接地导体等工作地点狭窄、行动不便的环境或特别潮湿的环境应采用 （　）V 安全电压。","options":["12","24","42"],"answer":"B","why":"依据安全电压等级规定，金属容器内、隧道、水井及周围有大面积接地导体等狭窄潮湿、行动不便环境应采用24V安全电压；42V只适用于一般环境，故选24。"},{"type":"判断","stem":"电流型漏电保护装置只能防止间接接触电击,不能防止直接接触电击。 （　）","options":[],"answer":"错","why":"高灵敏度（30mA以下）电流型漏电保护装置在人体直接触电时也能在0.1秒内切断电源，既能防间接接触也能防直接接触电击，“只能防间接”过于绝对，说法错误。"},{"type":"多选","stem":"我国标准规定的高灵敏度电流型漏电保护装置的额定动作电流有（　） mA。","options":["0","15","30","50","75"],"answer":"ABC","why":"我国标准高灵敏度电流型漏电保护装置的额定动作电流为6、15、30mA三档（首项为6mA），专用于人身触电保护；50、75mA属中灵敏度档，故选ABC。"},{"type":"单选","stem":"用于防止人身触电事故,应选用的电流型漏电保护装置应该是（　）。","options":["高灵敏度","中灵敏度","低灵敏度","特低灵敏度"],"answer":"A","why":"防人身触电必须在达到心室颤动电流前断电，应选高灵敏度（30mA及以下）漏电保护装置；中、低灵敏度动作慢、电流大，只用于防火等场合，故选高灵敏度。"},{"type":"单选","stem":"用于监视一相接地事故,应选用的电流型漏电保护装置应该是（　）","options":["特高灵敏度","高灵敏度","中灵敏度","低灵敏度"],"answer":"D","why":"监视一相接地故障只需检测较大的接地电流，选低灵敏度漏电保护装置即可，还能避免正常不平衡电流引起误动作；高灵敏度反而频繁跳闸，故选低灵敏度。"},{"type":"单选","stem":"用于防止漏电火灾事故,可以选用的电流型漏电保护装置应该是（　）","options":["特高灵敏度","高灵敏度","中灵敏度","低灵敏度","都可以"],"answer":"D","why":"漏电火灾源于泄漏电流长期发热，用低灵敏度漏电保护装置监视即可及时切除隐患，兼顾供电连续性；防人身触电才必须用高灵敏度，故选低灵敏度。"},{"type":"判断","stem":"电流型漏电保护装电流不得低于额定动作电流的 1/2.。（　）","options":[],"answer":"对","why":"为防止误动作，标准规定漏电保护装置的不动作电流不得低于额定动作电流的1/2，使动作区间留有足够裕度，该说法正确。"},{"type":"多选","stem":"以下关于电源线颜色标识正确的有 （　）","options":["相-为红色","相-为绿色","相-为黑色","工作零线-为黄色","专用保护零线-为黄绿双色"],"answer":"BE","why":"相色标准：A相黄、B相绿、C相红，工作零线淡蓝，专用保护零线黄绿双色；B、E正确，A项A相应为黄色，C项C相应为红色，D项工作零线不是黄色，故选BE。"},{"type":"单选","stem":"电源线路可分为工作相线 (火线),工作零线和专用保护零线。工作零线用 （　）色芯线。","options":["黄","绿","黑","蓝"],"answer":"D","why":"工作零线（N线）用淡蓝色芯线；黄绿双色线专用于保护零线、严禁他用，相线按A黄、B绿、C红区分，故选蓝。"},{"type":"判断","stem":"建筑施工现场临时用电工程必须采用三级配电系统,必须采用 TN-S 接零保护系统,必须采用二级漏电保护系统。 （　）","options":[],"answer":"对","why":"依据《施工现场临时用电安全技术规范》，临时用电必须采用三级配电、TN-S接零保护、二级漏电保护三大系统，属强制性要求，说法完整正确。"},{"type":"单选","stem":"按照《施工现场临时用电安全技术规范》规定,有关建筑施工现场临时用电说法错误的是（　）。","options":["必须采用三级配电系统","必须采用 TN-","接零保护系统C 必须采用二级漏电保护系统","每台用电设备必须有各自专用的开关箱"],"answer":"B","why":"规范强制要求采用TN-S接零保护系统（三相五线、专用保护零线），B项要求TN-C错误；三级配电、二级漏电保护、每台设备专用开关箱均正确，故选B。"},{"type":"单选","stem":"施工现场临时用电应采用 （　）保护系统。","options":["TN-C","TN-S C IT","TT83 施工现场配电系统的漏电保护开关应按( C)配置。A 四级 B 三级 C 二级 D 一级"],"answer":"C","why":"施工现场配电系统的漏电保护开关应按二级配置：总配电箱一级、开关箱末级，两级参数配合实现分级保护；配电分三级、漏电保护只两级，勿混为一谈。"},{"type":"单选","stem":"施工现场开关箱与用电设备的水平距离不宜超过（　）M。","options":["3","4","5"],"answer":"B","why":"开关箱应尽量靠近所控用电设备，水平距离不宜超过4米，以缩短拖地线路、便于异常时立即断电；距离过远会延误断电、增大触电风险，故选4。"},{"type":"单选","stem":"施工现场的配电箱、开关箱应设置在安全稳固、便于操作、不易被碰撞的地点,周围不得有易燃物或杂物。其底部距地面最小距离为（　）m。","options":["1.0","1.2","1.3","1.5"],"answer":"C","why":"配电箱、开关箱应设在安全稳固、便于操作、不易被碰撞处，底部距地面最小1.3米，既防雨水溅入、杂物侵入，又便于日常操作检查；误选1.2米低于下限，故选1.3。"},{"type":"单选","stem":"在人孔内、天花板及坚井内等有电击危险环境中作业时,应使用电源电压不超过（　）的行灯照明。","options":["2Y","24V","36V","42V"],"answer":"C","why":"人孔、天花板、竖井等有电击危险环境中作业，行灯照明电压不得超过36V；更潮湿狭窄的密闭场所要求更低，行灯还须带防护网罩，故选36V。"},{"type":"单选","stem":"施工现场的照明线路（　）必须经过开关才能进入照明灯具。","options":["相线","零线","相线和零线","都不是"],"answer":"A","why":"照明开关必须串接在相线上，开关断开后灯具不带电，换灯泡、检修才安全；若开关接在零线上，关灯后灯头仍带电，极易触电，故选相线。"},{"type":"单选","stem":"低压带电作业断开导线时,应（　）","options":["先断开相线,后断开零线","先断开零线,后断开相线","先断开相线或零线均可","两者同时断开"],"answer":"A","why":"低压带电作业断线应先断相线、后断零线，让线路先脱离高电位再操作；顺序颠倒时导线仍带电、风险大，恢复接线时顺序相反，故选先相后零。"},{"type":"判断","stem":"运输或存放有锋刃的工具要平放,锋刃口应朝上或向外,放入工具袋时纫口应向下。 （　）","options":[],"answer":"错","why":"锋刃工具运输、存放时应平放且刃口朝下、向内，装入工具袋时刃口向下，防止伤人毁物；“朝上或向外”极易造成划割伤害，说法错误。"},{"type":"单选","stem":"千斤顶不得超负荷使用,旋升最大行程不得超过丝杠总长的（　）","options":["三分之二","四分之三","五分之三","二分之一"],"answer":"C","why":"千斤顶严禁超负荷使用，旋升最大行程不得超过丝杠总长的五分之三（3/5），超行程会使丝杠脱扣、顶头失稳坠落；误选三分之二超出限值，故选五分之三。"},{"type":"多选","stem":"通信工程中用电工具的使用,做法正确的是 （　）","options":["使用前应进行安全检查","应使用独立的的插座","传递用电工具时应先切断电源","易燃场所作业时必须使用防爆式工具","带电设备上作业时应使用隔离变压器"],"answer":"ACDE","why":"电动工具使用前检查、传递时先断电、易燃场所用防爆型、带电设备上经隔离变压器供电均正确；B项错误，工具不得随意共用插座，应防止过载和漏电扩散，故选ACDE。"},{"type":"单选","stem":"关于用电工具,以下说法错误的是 （　）。","options":["在带电设备上可以使用用电工具","使用手电钻或电锤时,必须戴帆布手套","使用手持式砂轮机打磨作业时,工作前,应进行空载试验","不得在易燃、用熔接机的场所用熔接机"],"answer":"B","why":"B错误——手电钻、电锤作业必须戴绝缘手套，帆布手套不绝缘且易被旋转部件缠绕伤手；砂轮机工作前空载试验、易燃易爆场所禁用熔接机等说法均正确，故选B。"},{"type":"多选","stem":"关于仪表的车使用,以下说法正确的有 （　）","options":["使用交流供电的仪表,金属外壳应接地保护","使用带激光源的仪器时,不得将光源正对着眼睛","测试电缆的耐压或绝缘时,应把电缆与相应设备连接可靠","做过耐压和绝缘测试的电缆,必须放电后才能再进行其它项目的测试","长期不使用时应及时从仪表中取出电池"],"answer":"ABDE","why":"仪表金属外壳接地、激光源不得对眼、耐压绝缘测试后先放电、长期不用取出电池均正确；C项错误——测耐压绝缘前必须把电缆与设备断开，防止高压串入损坏设备，故选ABDE。"},{"type":"单选","stem":"关于电焊机的使用,以下说法错误的是 （　）","options":["交流电焊机应配装防二次侧触电保护器","交流电焊机一次侧电源线长度不应大于 30 米","二次侧电源线应采用防水型橡皮护套铜芯软电缆","在潮湿处操作电焊机,操作人员应站在绝缘板上。"],"answer":"B","why":"交流电焊机一次侧电源线长度不应大于5米，30米是二次侧焊把软电缆的限值，B项张冠李戴；防二次侧触电保护器、防水橡套电缆、潮湿处站绝缘板均正确，故选B。"},{"type":"单选","stem":"通信工程路面切割机的使用,做法错误的是 （　）。","options":["金属外壳应做好保护接地","手柄上应有电源控制开关并做绝终保护","使用时应一边操作、一边随机整理电源线","操作人员应戴绝缘手套、穿绝缘鞋"],"answer":"C","why":"路面切割机运转时严禁边操作边整理电源线，高速锯片旁拉扯电线极易触电或被卷入伤人，应停机断电后整理；保护接地、绝缘手柄开关、绝缘防护均正确，故选C。"},{"type":"判断","stem":"砂轮切割机的电源线应采用耐气温变化的橡胶皮护套铜芯软电缆（　）","options":[],"answer":"对","why":"砂轮切割机多在露天、风尘环境使用，电源线应采用耐气温变化的橡胶皮护套铜芯软电缆，防水、防老化、防破损漏电，说法正确。"},{"type":"单选","stem":"砂轮切割机应安装防护罩,切割机前面应设立（　）M 高的耐火档砂板。","options":["1.2","1.5","1.7","2"],"answer":"C","why":"砂轮切割机的砂轮碎片和火花会飞溅伤人，切割机前方应设1.7米高（约成人身高）的耐火挡砂板阻挡；数字记忆“1.7米挡板”，故选1.7。"},{"type":"单选","stem":"推土机横坡行驶的坡度最大为（　）","options":["0°","15°","20°","25°"],"answer":"A","why":"推土机重心高、横坡行驶极易侧翻，规程规定横坡行驶最大坡度为0°，即只能纵向顺坡行驶作业；15°~25°是纵向爬坡能力数值，勿混，故选0°。"},{"type":"单选","stem":"推土机停车时刀铲距地面要保持 （　） m 左右。","options":["0.2","0.5","1.0"],"answer":"A","why":"推土机停车时应把刀铲落地或保持距地面约0.2米并落下锁定，防止刀铲因自重突然下落伤人；留空0.5米、1米过高，坠落打击风险大，故选0.2。"},{"type":"单选","stem":"使用吊车在架空电力线附近工作时,应与其保持安全距离,当输电线路电压为 10KV 时,允许与输电线路的最近距离为（　）米。","options":["1.5","2.0","4.0","6.0"],"answer":"B","why":"依据起重机械安全规程，吊车任何部位与10kV架空线路的最近距离为2米，电压越高距离越大；1.5米是1kV以下线路的标准，勿混，故选2.0。"},{"type":"单选","stem":"使用吊车在架空电力线附近工作时,应与其保持安全距离,当输电线路电压为 35KV 时,允许与输电线路的最近距离为（　）米","options":["1.5","2.0","4.0","6.0"],"answer":"C","why":"吊车与35kV架空线路最近距离为4米，安全距离随电压递增：1kV以下1.5米、10kV2米、35kV4米；误选2.0米是10kV档数值，故选4.0。"}]},{"file":"12第十二章","title":"第十二章","count":45,"questions":[{"type":"判断","stem":"通信工程施工现场一般就选用塑料壳一般作业类 (Y 类) 安全帽。（　）","options":[],"answer":"错","why":"通信施工现场多有坠落、物体打击风险，不属于“一般作业”场所，不能选用Y类一般作业安全帽，应按作业风险选用相应防护等级的安全帽，“一般就选用Y类”说法错误。"},{"type":"单选","stem":"通信工程中选用的安全帽通常有效期通常为 （　）年。","options":["2 年","3 年","5 年","6 年"],"answer":"A","why":"塑料安全帽从制造之日起有效期最长为3年（植物枝条编织的为2年、玻璃钢的为3年半），到期必须更换；安全帽是消耗性防护品，超期防护性能下降，故选3年。"},{"type":"单选","stem":"戴安全帽时,头顶和帽体内顶部的空间垂直距离正确的是 （　）","options":["5","35","55","75"],"answer":"B","why":"依据安全帽佩戴规范，戴帽后头顶与帽体内顶部应保留约35毫米的垂直缓冲空间，用于吸收和分散冲击能量；空间过小缓冲不足、过大则易脱落，故选35。"},{"type":"单选","stem":"在铁塔上作业应选用（　）安全带","options":["电信工围杆绳单腰带式","电信工悬挂单腰带式","通用悬挂双背带式(有腿带)","通用悬挂自锁式"],"answer":"C","why":"铁塔上作业人员处于悬空状态且塔架有多个挂点，应选用通用悬挂双背带式（有腿带）安全带，双背带分散冲击力、腿带防坠落滑脱；单腰带式冲击时易致腰部受伤，故选C。"},{"type":"单选","stem":"攀登独杆塔时应选用 （　） 安全带","options":["电信工围杆绳单腰带式A 电信工围杆绳单腰带式","电信工悬挂单腰带式","通用悬挂双背带式(有腿带)","通用悬挂自锁式"],"answer":"D","why":"攀登独杆塔无平台可靠挂点，选用通用悬挂自锁式安全带，自锁器可随人移动、一旦坠落立即锁止；围杆式只适合杆上定位作业，悬挂式须固定挂点，故选D。"},{"type":"单选","stem":"人孔作业应选用 （　） 安全带","options":["电信工围杆绳单腰带式","电信工悬挂单腰带式","全身式","半身式"],"answer":"C","why":"人孔内空间受限且可能发生坠落、中毒，应选用全身式安全带，救援提拉时受力分布全身、不易滑脱；单腰带式提拉时冲击集中、易造成腰部伤害，故选全身式。"},{"type":"单选","stem":"进入人井作业,作业人员应该佩戴 （　）安全带。","options":["带缓冲器的绳式","全身式","围杆作业","悬空坠挂"],"answer":"B","why":"依据有限空间作业安全要求，进入人井作业应佩戴全身式安全带，便于井上监护人员通过救援三脚架整体提拉救援；围杆、悬空坠挂式均不适用于竖井提升救援，故选B。"},{"type":"单选","stem":"塔上作业时,应使用有后备保护绳的双背带式或全身式安全带,当后备保护绳超过（　）时,应使用缓冲器","options":["1 米","2 米","3 米","4 米"],"answer":"C","why":"塔上作业用双背带式或全身式安全带，当后备保护绳超过3米时应加装缓冲器，坠落时缓冲器吸收冲击能量、把冲击力控制在人体可承受范围，故选3米。"},{"type":"单选","stem":"安全带使用 （　）后,应按批量购入情况检查一次。","options":["半年","1 年","2 年","3 年"],"answer":"C","why":"安全带使用2年后应按批量购入情况抽检一次，抽检合格方可继续使用，日常还须每次使用前外观检查；半年、1年过于频繁不现实，故选2年。"},{"type":"单选","stem":"高处作业,在选择安全带挂点时应当 （　）,注意防止摆动碰撞","options":["高挂低用","低挂高用","低挂低用","高挂高用"],"answer":"A","why":"安全带必须“高挂低用”，挂点高于腰部，坠落距离短、冲击力小；低挂高用会加大坠落行程，冲击力成倍增加并易致腰部受伤，这是安全带使用的基本原则，故选A。"},{"type":"单选","stem":"通信施工企业采购的耐压测试 5KV 的电绝缘鞋在工频 (50~60HZ)通常使用在范围 （　）的作业环境中。","options":["20V 以下","380V 以下","1KV 以下","5KV 以下"],"answer":"C","why":"耐压5kV的电绝缘鞋按标准用于1kV及以下的工频作业环境，试验电压与适用电压不是一回事，误选5kV是拿耐压值当使用值；超过1kV须穿绝缘靴，故选1kV以下。"},{"type":"多选","stem":"在工程 1KV 以上的作业环境中施工作业,可穿着的绝缘鞋有 （　）。","options":["电绝缘皮鞋","布面电绝缘鞋","电绝缘胶靴","聚合材料的靴","以上都可以"],"answer":"CD","why":"1kV以上环境须穿电绝缘胶靴或聚合材料靴，靴类绝缘层厚、防潮防穿刺性能好；皮鞋、布面绝缘鞋只适用于1kV以下低压环境，“以上都可以”不成立，故选CD。"},{"type":"单选","stem":"在高速公路上作业时,以下做法错误的是 （　）","options":["施工作业方案报请高速公路管理部门审批","施工机具、材料放置在施工作业区内","要求上级检查人员穿戴专用的交通警示服装","安全警示标志的摆放顺序和摆放相同"],"answer":"D","why":"高速公路施工安全警示标志必须按“警告区—上游过渡区—缓冲区—作业区—下游过渡区—终止区”的顺序摆放，各区规格不同、不能相同摆放；报批、材料放作业区内、检查人员穿警示服均正确，故选D。"},{"type":"单选","stem":"建设工程工地四周应按规定设置连续、密闭的围挡;在市区主路段和市容景观道路及机场、码头、车站广场设置的围栏其高度不得低于（　）。","options":["1.5m","1.8m","2m","2.5m"],"answer":"B","why":"依据文明施工规定，市区主路段、市容景观道路及机场、码头、车站广场的围挡高度不得低于1.8米（一般路段不低于1.2米），既挡尘降噪又防外人误入，故选1.8m。"},{"type":"单选","stem":"道路上施工作业前,应设量安全警示标志。标志设置对应 （　）","options":["从警示区开始,直到终止区结束","从警告区开始,直到作业区结束","从作业区开始,往警告区起点处","从缓冲区开始。直到作业区结束"],"answer":"A","why":"依据道路作业交通安全规程，标志应从警示区开始一直摆到终止区结束，覆盖整个作业影响范围；只从警告区或缓冲区摆起会遗漏警示区，来车提前得不到警示，故选A。"},{"type":"单选","stem":"木杆堆放层数最多为（　）层。","options":["2","3","4"],"answer":"A","why":"木杆质地轻、易滚动，堆放层数最多为2层，超过后底层杆承受压力大、堆垛失稳易滚落砸人；木杆与水泥杆的限层数值不同，勿混，故选2。"},{"type":"单选","stem":"木杆堆放层数最多为（　） 层。","options":["4","6","8"],"answer":"C","why":"此题限层数值须按题干给的选项组理解：本题组上限为8层，对应木杆在专用库房内加垫木、掩牢的分类堆放限值；露天散堆按更严的2层控制，两种场景勿混，故选8。"},{"type":"单选","stem":"水泥杆堆放层数最多为（　）层。","options":["1","2","3","4"],"answer":"B","why":"水泥杆自重大，堆放层数最多为2层，且垫木上下对齐、两侧掩牢防滚动；堆3层以上底层承压过大、垛体失稳易坍落伤人，故选2。"},{"type":"单选","stem":"用跳板装卸车时,要使用没有木结的坚实木板做跳板,木板厚度最小（　） MM。","options":["0","50","60","80"],"answer":"C","why":"装卸车跳板须用无木结的坚实木板，厚度最小60毫米，并搭设牢固、防滑防断；厚度不足在重物碾压下易断裂酿成高处坠落和砸伤事故，故选60。"},{"type":"单选","stem":"人工搬运设备时,男工每人负重不得超过（　）公斤。","options":["0","30","40","50"],"answer":"C","why":"依据人工搬运劳动保护要求，男工单人负重不得超过40公斤，超限易造成腰部扭伤等职业伤害；误选50公斤超出限值，长期超负荷搬运是腰肌劳损主因，故选40。"},{"type":"单选","stem":"人工搬运设备时,女工每人负重不得超过（　）公斤。","options":["0","30","40","50"],"answer":"A","why":"女工生理承受能力较弱，单人负重不得超过20公斤（男工为40公斤），两者成对记忆“男40女20”；误选30公斤超出女工限值，故选20。"},{"type":"多选","stem":"关于器材搬运做法正确的有 （　）","options":["将光缆盘直接从车上推下时,车下人员要远离缆盘落下位置","当在地面上滚动光缆盘时,要按光缆的盘绕方向进行;","人工搬运器材时,女工负重不得超过 20 公斤","搬运设备上下楼必须使用货梯","在使用叉车进行搬运时,离地面高度不宜过高"],"answer":"BCE","why":"滚光缆盘须按盘绕方向滚动（反方向会松脱缆层）、叉车搬运离地不宜过高（重心稳、防倾覆）、设备上下楼必须用货梯均正确；缆盘严禁直接从车上推下、女工限重是20公斤而非30公斤，A、C错，故选BCE。"},{"type":"单选","stem":"有限空间作业往往事故频发,作业时必须有人监护。以下不属于有限空间的是 （　）。","options":["地下室","隧道","人井","架空交接箱平台"],"answer":"D","why":"有限空间指封闭或半封闭、进出口受限但足以供人进入作业的空间，如地下室、隧道、人井；架空交接箱平台露天开放、通风良好，不属于有限空间，故选D。"},{"type":"单选","stem":"国家标准《缺氧危险作业安全规程》 (GB8958-2006) 规定缺氧浓度为（　）,低于该值的工作场所为缺氧。","options":["0.5%","15.5%","19.5%","23.5%"],"answer":"C","why":"依据《缺氧危险作业安全规程》（GB8958），空气中氧含量低于19.5%即为缺氧作业场所；19.5%是分界值，正常空气约21%，误选23.5%是富氧界限方向记反，故选19.5%。"},{"type":"单选","stem":"国家标准将作业场所空气中氧含量低于 （　）的状态定义为“缺”","options":["7.5%","18.5%","19.5%","21.5%"],"answer":"C","why":"国家标准把作业场所空气中氧含量低于19.5%的状态定义为缺氧，低于该值必须先通风、再检测、后作业；数字记忆“19.5%红线”，故选19.5%。"},{"type":"单选","stem":"以下物质中,（　）有剧毒。","options":["氧气","硫化氢","甲烷","二氧化碳"],"answer":"B","why":"硫化氢是剧毒气体，低浓度有臭鸡蛋味、高浓度麻痹嗅神经反而闻不到，短时间内即可致命；甲烷、二氧化碳主要危害是窒息（无毒），氧气无毒，故选硫化氢。"},{"type":"单选","stem":"进入人孔等有限空间内作业前必须进行气体检测,当硫化氢的浓度超过（　）严禁有限空间进行长时间作业。","options":["5.6mg/m3","10mg/m3","15mg/m3","30mg/m3"],"answer":"B","why":"依据有限空间作业标准，硫化氢浓度超过10mg/m³即严禁进行长时间作业，必须先通风置换并复测合格；误选15、30mg/m³均超出限值，故选10。"},{"type":"判断","stem":"高浓度二氧化碳本身具有刺激和麻醉作用且能使肌体发生缺氧室息。（　）","options":[],"answer":"对","why":"高浓度二氧化碳对机体有刺激和麻醉作用，并挤占空气中的氧导致缺氧窒息，且它比空气重、易在井底积聚，人不易察觉，说法正确。"},{"type":"多选","stem":"以下人井气体浓度,可以下井施工的有 （　）","options":["0。:20%,其他气体浓度正常","CO:3%,其他气体浓度正常","HS:12mg/m3,其他气体浓度正常","CO: 28mg/m3,其他气体浓度正常","CH: 10%,其他气体浓度正常"],"answer":"ADE","why":"判断能否下井须逐项对照限值：氧含量20%不低于19.5%达标、CO 28mg/m³低于30mg/m³限值、CH₄ 10%不超限且其余正常，三项均可下井；CO 3%和H₂S 12mg/m³均严重超标，故选ADE。"},{"type":"判断","stem":"在检测有限空间内的气体浓度时,应沿垂直方向检测 2 个点的气体浓度。 （　）","options":[],"answer":"错","why":"检测有限空间气体须在上、中、下垂直方向至少检测3个点（不同气体比重不同、分层分布），只测2个点会漏检某一层的危险气体，说法错误。"},{"type":"单选","stem":"下列有毒有害气体中,存在于通信人孔下部的气体为 （　）。","options":["硫化氢","一氧化碳","天然气","沼气"],"answer":"A","why":"硫化氢比空气重且由污物腐败产生，易沉积在通信人孔下部；沼气（甲烷）比空气轻、聚于上部，一氧化碳、天然气多来自外部泄漏，按“重气沉底”判断，故选硫化氢。"},{"type":"多选","stem":"检测通信人孔内气体浓度时,选用的气体检测仪应具备的功能包括（　）","options":["停泵警报功能","内置泵吸功能","多气体检测功能","氧检测功能","固定式仪器"],"answer":"ABCD","why":"人孔气体检测应选内置泵吸式（远距离取样）、多气体检测、含氧检测并具备停泵报警功能的仪器，泵停即报警防止采样中断漏报；固定式仪器不适合流动巡检人孔，故选ABCD。"},{"type":"单选","stem":"容易引发高处坠落事故的主观原因有 （　）","options":["风力超过 5 级的天气","作业时接听手机","地面不平","寒冷天气作业"],"answer":"B","why":"高处坠落的主观原因是人的不安全行为，作业中接听手机分散注意力、失去对自身的保护意识；风力大、地面不平、寒冷属客观环境因素，主体是“人”还是“环境”是区分关键，故选B。"},{"type":"多选","stem":"按照国家标准《高处作业分级》(GB3608- 2008)的说法,以下属于直接引起高处坠落的客观危险因素的有 （　）。","options":["阵风风力四级","平均气温等于 5°","的作业环境C 接触温度等于 10°C 的水温进行作业","作业场所光线不足,能见度差","作业活动范围距离 380V 电力线 2m"],"answer":"BCD","why":"依据《高处作业分级》（GB3608），直接客观危险因素包括：阵风五级（题组对应五级）以上、高温或低温环境（如平均气温等于5℃）、接触水温等于10℃的水、光线不足能见度差等；四级风未达标准、距380V电力线2m满足安全距离要求，均不算，故选BCD。"},{"type":"单选","stem":"按照高处作业分级,线路需要绑扎到 5.5 米高的位置作业,属于（　）","options":["一级","二级","三级","四级"],"answer":"B","why":"依据《高处作业分级》，作业高度2~5米为一级、5~15米为二级、15~30米为三级、30米以上为四级；5.5米落在5~15米区间属二级，误选一级是没注意已超5米线，故选二级。"},{"type":"单选","stem":"按照《高处作业分级》(GB3608-2008)标准,当基础高度为 10m 时,可能坠落范围半径为（　） m。","options":["4","5","6"],"answer":"B","why":"依据GB3608，可能坠落范围半径随高度分档：2~5米为3米、5~15米为4米、15~20米为5米、20米以上为6米；基础高度10米落在5~15米档，故半径为4米。"},{"type":"单选","stem":"按照《高处作业分级》(GB3608-2008)标准,当基础高度为 20m 时,可能坠落范围半径为（　） m。","options":["4","5","6"],"answer":"C","why":"依据GB3608分档口诀“3、4、5、6”对应高度“2~5、5~15、15~20、20以上”；20米恰跨档，20米及以上半径取6米，误选5米是仍按15~20米档取值，故选6。"},{"type":"单选","stem":"低温或高温环境下进行高处作业,应采取保暖和防暑降温措施,作业时间 （　）过长。","options":["禁止","严禁","不宜","不得"],"answer":"C","why":"高低温环境下高处作业应采取保暖、防暑降温措施并合理安排，作业时间不宜过长——温度影响人体机能和判断力，“禁止”“严禁”“不得”语气过于绝对，规范用语为“不宜”，故选C。"},{"type":"单选","stem":"不属于安全三宝的是 （　）","options":["安全帽","安全鞋","安全带","安全网"],"answer":"B","why":"安全“三宝”是安全帽、安全带、安全网，是施工现场防高坠、防物体打击的三项基本个人防护与设施；安全鞋属一般劳保用品，不在三宝之列，故选安全鞋。"},{"type":"多选","stem":"以下关于塔上作业的做法中,正确的有（　）","options":["制定有高处作业安全技术措施","塔下工作人员头戴安全帽,塔上人员没有戴安全帽","在 5 级风气候条件下上塔作业","在 39 高温天气上塔作业","两个相距 2 米的人在慢速爬塔"],"answer":"ACD","why":"制定高处作业安全技术措施、上下均戴安全帽、高温天气落实防暑措施后可作业均正确；五级风以上禁止塔上作业（应停工），相距2米同时爬塔易坠物伤及下方人员，故选ACD。"},{"type":"判断","stem":"上下左右不同层面作业可以安排立体交叉作业。（　）","options":[],"answer":"错","why":"上下不同层面同时施工属立体交叉作业，上方坠物会直接砸伤下方人员，必须错开安排或设置隔离防护层，严禁无防护交叉作业，该说法错误。"},{"type":"单选","stem":"吊装作业中,夜间应有足够的照明,室外作业遇到大雪、暴雨、大雾及 （　） 以上大风时,应停止作业。","options":["四级","五级","六级","八级"],"answer":"C","why":"依据吊装作业安全规程，夜间须有足够照明，遇大雪、暴雨、大雾及六级以上大风应停止露天吊装——大风使吊物摆动、视线受阻，极易脱钩伤人，故选六级。"},{"type":"单选","stem":"梯子架设在吊线上时应高出吊线（　）","options":["0cm","30cm","40cm","50cm"],"answer":"B","why":"梯子架设在吊线上作业时，梯顶应高出吊线30厘米，便于人员扶靠、防止梯子滑脱吊线；过高重心不稳、过低挂靠不牢，故选30cm。"},{"type":"单选","stem":"使用人字梯时,两梯夹角宜为 （　）","options":["0°","40°","50°","60°"],"answer":"B","why":"依据登高工具使用要求，人字梯两梯夹角以40°为宜，并设防张开的拉链（限位拉绳）；夹角过大梯脚易外滑、过小则重心偏后易后仰，故选40°。"},{"type":"单选","stem":"楼顶没有围栏或围栏不牢固时,应在距离边沿（　）M 处,围上 1M 高的警戒线,以防施工人员过于靠近楼顶边沿。","options":["0.5","1.0","1.2","1.5"],"answer":"D","why":"楼顶无围栏或围栏不牢时，应在距边沿1.5米处（约成年人一步之外的安全缓冲距离）围设1米高警戒线，防止人员无意靠近坠落；1米、1.2米距边沿太近，防护不足，故选1.5。"}]},{"file":"13第十三章","title":"第十三章","count":66,"questions":[{"type":"判断","stem":"通信管道施工前,项目部需要对沿线地理、环境等情况进行综合调查,将管道路由走向所遇到的河流、铁路、公路、电力线及其他情况进行详细记录。（　）","options":[],"answer":"对","why":"依据通信管道施工安全规程，施工前须沿管道路由综合调查，详细记录沿线河流、铁路、公路、电力线等障碍情况，为制定施工方案和安全措施提供依据，说法正确。"},{"type":"单选","stem":"通信管道工程施工阶段堆放机具、材料需要选择不妨碍交通、行人少、地面平整的地方;堆积高度一般不超过 （　）米。","options":["1.0","1.2","1.5","2.0"],"answer":"C","why":"依据管道施工安全规程，机具材料应堆放在不妨碍交通、地面平整处，堆积高度一般不超过1.5米，防倒塌伤人。数字记忆：堆高1.5米封顶；2.0米过高易塌堆，属干扰项。"},{"type":"多选","stem":"施工中,如遇有毒、有害气体或液体管道泄漏,施工人员应（　）","options":["立即撤至安全地点","及时报有关单位修复","立即进行抢修","设置围栏警示标志","向建设单位打停工报告"],"answer":"ABD","why":"依据先撤人、设警戒、再报告的应急处置原则，应立即撤至安全地点、报有关单位修复并设置围栏警示。干扰项C立即抢修错误：施工人员无专业防护，盲目抢修会中毒并扩大事故。"},{"type":"单选","stem":"在管道路由测量移动大标旗或指挥旗时,遇到（　）应将大标旗或指挥旗平放倒或收起。","options":["行驶的汽车","行驶的火车","结婚车队","放学的学生"],"answer":"B","why":"依据测量作业安全要求，遇行驶的火车应将大标旗、指挥旗平放倒或收起，防止火车司机误认行车信号。干扰项汽车、学生不涉及铁路信号辨识，只有火车对旗帜信号最敏感。"},{"type":"单选","stem":"开挖土石方作业时,挖出的土、石,不得堆在 （　）上。","options":["在用光缆路由","消防栓井","绿化草坪","盲道"],"answer":"B","why":"依据城市道路施工安全规定，挖出土石严禁压在消防栓井上，否则火灾时妨碍开启取水，危及应急安全。草坪、盲道虽也不宜堆土，但消防栓井是规程明令禁止项，为本题考点。"},{"type":"单选","stem":"土方开挖时,挖出的土、石应堆放在距离沟、坑边沿（　）以外,使土、石不致回落于沟内。","options":["0cm","40cm","50cm","60cm"],"answer":"D","why":"依据土方开挖安全规程，挖出的土石应堆放在距沟坑边沿60厘米以外，防止土石回落沟内砸伤人员。数字记忆：60厘米；40、50厘米距离不足，属干扰数字。"},{"type":"单选","stem":"开挖土石方如遇有地下不明物品或古墓、文物,应立即 （　）","options":["回填复原","取出文物上交","掩埋文物","报告上级处理"],"answer":"D","why":"依据《文物保护法》规定，境内地下遗存的文物属国家所有。遇地下不明物品或古墓文物应立即停工并报告上级处理；擅自取出上交、掩埋或回填复原均属违法，还可能损毁文物。"},{"type":"单选","stem":"管道沟开挖时,当流沙、疏松土质的沟深超过（　） 时,应当安装挡土板。","options":["1 米","1.2 米","1.5 米","1.8 米"],"answer":"A","why":"依据管道施工安全规程，流沙、疏松土质沟深超过1米即应安装挡土板支撑沟壁。数字记忆：流沙松土1米设板；1.2、1.5、1.8米均比规程限值深，照此施工会塌方伤人。"},{"type":"多选","stem":"不得使用机械开挖沟、槽、洞、坑的地段包括 （　）","options":["稻田地","地下有电力线缆","地下有自来水管","地下有污水管","大树旁"],"answer":"BCD","why":"依据地下管线保护要求，地下有电力线缆、自来水管、污水管的地段不得机械开挖，防挖断管线造成触电、停水、污染。稻田地、大树旁不属管线禁挖地段，可机械配合开挖。"},{"type":"单选","stem":"不得使用机械挖沟,并应指定有经验的工人人工轻挖开挖的地段是（　）","options":["施工图上标有地下物的高程","施工图上未标地下物的高程","高压电力输电线路正下方","长途输气管道交叉点"],"answer":"B","why":"依据管线保护规程，施工图未标明地下物高程时不得机械挖沟，应指定有经验工人人工轻挖探明。干扰项A图上已标高程可机械避让开挖；高压线下、输气管道交叉点另有专门协调措施。"},{"type":"单选","stem":"使用电动打夯机夯实回填土时,手柄上应装按钮开关,并做绝缘处理;操作人员应（　）。","options":["戴绝缘手套","穿防滑鞋","背向打夯机牵引","戴护目镜"],"answer":"A","why":"依据电动工具安全使用要求，打夯机手柄按钮须绝缘处理，操作人员应戴绝缘手套防止漏电触电。干扰项防滑鞋、护目镜不针对电击这一主要危害，绝缘防护才是关键。"},{"type":"单选","stem":"在隧道内回填土时,正确的操作是 （　）","options":["一次拆除所有的护土板和撑木架","回填后一次性夯实","无法夯实时用砖、石填实","全部采用混凝土浇筑"],"answer":"C","why":"依据隧道回填安全要求，无法夯实的部位应用砖、石填实。干扰项A一次拆除全部护土板撑木架会立即塌方；B应边回填边分层夯实；D混凝土浇筑不符合回填工艺要求。"},{"type":"单选","stem":"钢筋冷拉作业时,拉筋速度宜慢不宜快,操作人员要位于安全地带在钢筋两侧（　）米以内及拉筋两端不得有人。","options":["2.5","2.0","2.5","3.0"],"answer":"D","why":"依据钢筋冷拉作业安全要求，冷拉速度宜慢不宜快，钢筋两侧3米以内及拉筋两端不得站人，防钢筋崩断弹射伤人。数字记忆：冷拉危险区3米；1.5、2.0、2.5米范围不足。"},{"type":"单选","stem":"拆除挡土板时,如有塌方危险,应（　）","options":["先部分回填夯实再拆","先完成回填作业再拆","更换危险处的挡土板","等塌方后再处理再拆"],"answer":"A","why":"依据挡土板边回填、边拆除的原则，发现有塌方危险应先部分回填夯实再拆，让回填土支撑沟壁。干扰项B全部回填后再拆违背配合顺序，C更换挡土板反而扰动沟壁更危险。"},{"type":"单选","stem":"在沟内捣实混凝土时,拍浆人员要穿(戴) （　）","options":["绝缘手套","防护背心","防护鞋","安全带"],"answer":"C","why":"依据沟内混凝土捣实作业防护要求，拍浆人员应穿防护鞋，防水泥浆腐蚀皮肤和落物砸脚。干扰项绝缘手套是电工防护，安全带用于高处作业，均与本工序危害不对应。"},{"type":"多选","stem":"定向钻钻孔过程中,操作人员应仔细观察钻机的（　）的读数,发现钻机出现异常等情况时,应立即停机检查。","options":["回转油压表","泥浆压力表","蓄水箱水位","发动机水温表","给进油压表"],"answer":"ABE","why":"依据定向钻操作规程，钻孔中应监视回转油压表、泥浆压力表、给进油压表读数，异常立即停机。干扰项蓄水箱水位、发动机水温属常规设备参数，反映不了孔内钻进与孔壁安全状态。"},{"type":"单选","stem":"定向钻作业完成后,拆除作业在断开任何管路之前,应先 （　）","options":["保持额定压力","关闭阀门","检查泄露点","释放压力"],"answer":"D","why":"依据管路设备拆装安全规程，断开任何管路前必须先释放压力，带压拆卸会使管路甩动、浆液喷射伤人。干扰项关闭阀门只能切断来路，管内余压仍在，隐患并未消除。"},{"type":"单选","stem":"砌筑作业中,脚手架上堆砖高度不得超过 （　）","options":["层平砖","3 层平砖","2 层侧砖","3 层侧砖"],"answer":"D","why":"依据砌筑作业安全规程，脚手架上堆砖高度不得超过3层侧砖。记忆口诀：侧砖三层为限。干扰项平砖堆放不稳且层数说法混淆，2层侧砖偏低、3层平砖过高，均不符规程。"},{"type":"多选","stem":"关于人井砌筑作业的说法,正确的有 （　）。","options":["不得在新砌的人孔墙壁顶部行走","在进行人孔底部抹灰作业时,人孔上方不得有人","起吊和安装人孔上覆时,人孔内不得有人","抬运人孔回圈至少要有两人","砌筑作业面下方不得有人"],"answer":"ACE","why":"依据人井作业安全规程：新砌墙壁顶部不得行走、起吊上覆时孔内不得有人、作业面下方不得有人均正确。B的表述与规程上方防落物情形不符；D口圈沉重，须专人指挥多人配合，仅两人难以保证安全。"},{"type":"单选","stem":"管道试通作业时,大孔管道试通,应 （　） 试通。","options":["用穿管器带试通棒","使用试通线","使用试通管","使用穿管器支架"],"answer":"C","why":"依据管道试通规程，大孔管道应使用试通管试通，检验管孔顺直与净空。干扰项穿管器带试通棒、试通线适用于小孔径管道，用于大孔无法全面反映管孔状况。"},{"type":"单选","stem":"线路测试或检修时,应先断开外揽与设备的连接,以免（　）","options":["损害设备","损害仪表","伤及人眼","影响测试精度"],"answer":"A","why":"依据线路测试检修安全要求，应先断开外缆与设备的连接再测试，防止感应电压、浪涌窜入损害在线运行设备。干扰项损害仪表、伤及人眼均非主要原因，保护设备才是规程本意。"},{"type":"单选","stem":"在（　） 测量时,严禁使用金属标杆、塔尺","options":["地下输电线路的地面","城市繁华地段","高速公路红线内","一级光缆干线旁"],"answer":"A","why":"依据防触电安全要求，在地下输电线路的地面测量时严禁使用金属标杆、塔尺，金属杆触及地下电缆会导电伤人。干扰项繁华地段、高速红线是交通风险场景，与金属工具禁令无关。"},{"type":"单选","stem":"人工立杆时,在杆梢下方的适当位置应当系好牵引绳,拉动牵引绳的人员应（　）,拉绳时用力均匀,控制好电杆的立起方向。","options":["面对电杆","背对电杆","侧对电杆","面对电立起方向"],"answer":"A","why":"依据人工立杆安全要求，拉牵引绳人员应面对电杆，便于观察杆身动向、及时避让倒杆。干扰项背对电杆无法监控险情，遇倒杆躲避不及；侧对或面向起立方向均不利于全程观察。"},{"type":"单选","stem":"使用吊车立杆时,钢丝吊绳应牢固地拴在（　） 的适当位置","options":["偏向杆根","偏向杆梢","杆身中间","杆重心点"],"answer":"B","why":"依据吊车立杆操作规程，吊绳应拴在偏向杆梢的适当位置，起吊后杆根先着地，便于控制方向、对孔就位。干扰项拴在杆根或杆身中间会使电杆起吊失衡摆动，易砸伤人员。"},{"type":"单选","stem":"终端拉线用的钢绞线应比吊线（　） 级,并保证拉距。","options":["小一","同一","大一","大两"],"answer":"C","why":"依据拉线受力设计要求，终端拉线承受整档吊线张力，钢绞线规格应比吊线大一级并保证拉距。干扰项选同一级或小一级强度不足，紧线受力时可能拉断拉线酿成倒杆事故。"},{"type":"单选","stem":"架设吊线选择紧线器时,要求（　）","options":["不得以大代小","可以以小代大","可以以大代小","不得没有余量"],"answer":"A","why":"依据紧线器选用要求，紧线器规格应与吊线匹配，不得以大代小。干扰项以大代小看似更结实，实际钳口与线径不匹配会咬伤吊线、滑脱伤人；以小代大强度不够更危险。"},{"type":"单选","stem":"关于吊线架设的说法正确的是（　）","options":["在已有旧吊线的杆路上新增吊线,跨越公路时可用临时辅助吊线挂高吊线","在新建杆路上架设吊线,跨越铁路时可用吊线滑轮的办法升高吊线","若吊线在低压电力线下方交叉通过,布放时必须设专人用绝终棒托住钢绞线","在树枝间穿越时,不得使树枝挡压或撑托钢绞线"],"answer":"D","why":"依据架空线路架设规程，吊线在树枝间穿越时不得让树枝挡压或撑托钢绞线，防磨损断股和风摆碰线。干扰项A、B的升高吊线做法不符合跨越公路、铁路的合规要求；C在电力线下方托举钢绞线极易失控碰线触电。"},{"type":"单选","stem":"收紧拉线或吊线时,扳动紧线器以两人为限,操作时作业人员应在紧线器的 （　）B 左后侧或右后侧","options":["左前侧或右前侧","左后侧或右前侧","左前侧或右后侧"],"answer":"B","why":"依据紧线作业安全要求，扳动紧线器以两人为限，人员应站在紧线器左后侧或右前侧，避开受力线断裂回弹的弹射面。干扰项组合中处于正前侧的站位首当其冲，最为危险。"},{"type":"单选","stem":"如紧线时遇到导、地线有卡、挂现象,处理时操作人员应站在卡线处的 （　） 侧。","options":["内","外","后","前"],"answer":"C","why":"依据紧线作业安全要求，导地线卡挂时处理人员应站在卡线处后侧，线绳突然解脱回弹时后方是安全躲避位。干扰项内侧正处受力反弹路径上，站在内、外、前侧均易被弹伤。"},{"type":"单选","stem":"使用手扳葫芦收紧电缆布线时,应（　）","options":["将手扳葫芦放置平稳","将安全带固定牢固","指挥杆上人作业","让杆上人独立作业"],"answer":"A","why":"依据手扳葫芦使用安全要求，使用前应放置平稳、固定牢靠，受力时才不会滑脱坠落伤人。干扰项安全带固定、杆上人员配合虽有必要，但不是手扳葫芦本体操作的前提要求。"},{"type":"单选","stem":"在旧杆位更换电杆的做法正确的是 （　）","options":["旧电杆拔出腾位立新杆","紧靠旧电杆先立新杆","立新杆不得利用旧杆","拆旧杆不得利用新杆"],"answer":"B","why":"依据换杆作业规程，应紧靠旧电杆先立新杆，再借助新杆拆除旧杆，新旧杆互相支撑更安全。干扰项先拔旧杆腾位会使杆坑扰动、倒杆风险大；不得利用旧杆、新杆的说法与规程相反。"},{"type":"单选","stem":"使用吊板挂放光缆,坐吊板过吊线接头时,应使用 （　）","options":["另一吊板","安全绳","梯子","脚扣"],"answer":"C","why":"依据吊板作业安全要求，坐吊板过吊线接头时应改用梯子跨越，因接头处卡板不平，吊板无法平稳通过。干扰项安全绳是全程防坠保护用品，不能替代跨越接头的登高工具。"},{"type":"单选","stem":"架空光缆布放不得使用吊板作业的情况是 （　）","options":["在电力线 1M 处的吊线上","在 7/2.7 规格的吊线上","在电杆与墙壁之间的吊线上","在跨越水田的杆档"],"answer":"C","why":"依据吊板使用规定，电杆与墙壁之间的吊线跨度短、净空小，吊板摆动易碰撞坠落，不得用吊板挂放光缆。其余情形在满足与电力线安全距离、吊线规格达标等条件下可以使用吊板。"},{"type":"判断","stem":"吹缆作业中,闻到汽油异味较浓时,可先用手直接触摸检查燃料是否溢出和泄漏,必要时应停机。（　）","options":[],"answer":"错","why":"该说法错误。依据易燃物品安全操作要求，闻到汽油异味较浓应立即停机检查，严禁用手直接触摸检查燃油是否泄漏，手摸既定位不准又可能引发静电起火，应停机后目视检查。"},{"type":"单选","stem":"防止排流线端头脱落反弹伤人,布放排流线应（　）进行作业。","options":["使用放线车","盘 8 字方式","边放边埋方式","预应力拉直方式"],"answer":"A","why":"依据排流线布放安全要求，应使用放线车展放，线盘受控转动，防止线端头脱落反弹伤人。干扰项盘8字、边放边埋、预应力拉直都难以控制线盘回弹张力，存在崩伤风险。"},{"type":"单选","stem":"在供电线路或电力设施附近作业时,作业人员必须 （　）、戴绝缘手套,穿绝终鞋和使用绝缘工具。","options":["戴安全帽","穿防护服装","使用绝缘棒","系安全"],"answer":"A","why":"依据电力线路附近作业防护规定，作业人员必须戴安全帽、戴绝缘手套、穿绝缘鞋并使用绝缘工具。干扰项防护服、绝缘棒、安全带虽是常用防护用品，但不是规程此处明列的组合要求。"},{"type":"单选","stem":"在供电线路或电力设施附近作业时,上杆作业可以不用佩戴的物品包括 （　）。","options":["安全帽","绝终手套","防护眼镜","安全带"],"answer":"C","why":"依据杆上作业防护规定，必须佩戴安全帽、绝缘手套、安全带等；防护眼镜不属上杆作业必配项。干扰项安全帽、绝缘手套、安全带均为规程明确要求，防护眼镜针对的是钻孔打磨类工序。"},{"type":"单选","stem":"规范要求,在 10KV 的高压线附近架空作业时,作业人员离开高压线最小距离必须保证 （　） M。","options":["1.0","2.5","3.0","4.0"],"answer":"B","why":"依据通信线路与电力线安全距离规定，在10kV高压线附近架空作业，人员离开高压线最小距离必须保证2.5米。数字记忆：10kV保2.5米；3.0、4.0米非本题规程限值。"},{"type":"单选","stem":"当施工人员在 10KV 的高压线附近进行作业时其身体 (含超出身体以外的金属工具或物件) 离开高压线最小间距应保证 （　）","options":["1.5 米","2.5 米","4 米","8 米"],"answer":"B","why":"依据安全距离规定，在10kV高压线附近作业，身体连同超出身体的金属工具物件与高压线最小间距应保证2.5米。记忆要点：金属延伸物一并计入距离，其余选项数值不符规程。"},{"type":"单选","stem":"当电信电缆与电力线合杆时,电力线与电信电缆间净距不应小于（　）,且电信电缆应架设在电力线路的下部。","options":["0.5m","1.5m","2.5m","3m"],"answer":"C","why":"依据通信线路合杆建设规定，电信电缆与电力线合杆时净距不应小于2.5米，且电信电缆架设在电力线下部，防电力线坠落到通信线上。数字记忆：合杆净距2.5米；1.5、2米净距不足。"},{"type":"单选","stem":"光缆与低压电力线垂直或交叉跨越时必须做绝缘光缆保护,绝缘长度应超过电力线交叉跨越两端跨度（　）以上。","options":["1 米","1.5 米","2 米","2.5 米"],"answer":"B","why":"依据交越防护要求，光缆与低压电力线垂直或交叉跨越时须做绝缘保护，绝缘长度应超出交叉跨越两端跨度各1.5米以上。数字记忆：绝缘延伸1.5米；其余数值与规程不符。"},{"type":"多选","stem":"通信线路施工中,当发现通信线与电力线接触或电力线落在地面上时,施工人员正确的做法有 （　）。","options":["停止一切作业","保护现场.","立即报告项目负责人","换到别处施工","用手背验证是否有电"],"answer":"ABC","why":"依据触电事故预防要求，发现通信线与电力线接触或电力线落地，应停止一切作业、保护现场并立即报告项目负责人。干扰项换到别处施工是放任隐患；用手背验证是否带电是严重违章，徒手必触电。"},{"type":"多选","stem":"在运行的电源分支柜中操作时,应采取的必要措施包括 （　）","options":["由专业人员操作","金属工具绝终保护","操作人员穿戴静电防护服","操作人员佩戴触电报警安全帽","采取防止螺丝材料掉落措施"],"answer":"ABE","why":"依据机房电源柜作业安全要求，应由专业人员操作、金属工具做绝缘保护、采取措施防止螺丝材料掉入柜内引发短路。静电防护服针对静电敏感检修，触电报警安全帽非常规配置，均非必要措施。"},{"type":"多选","stem":"对铁件钻孔时,符合规范的操作有 （　）","options":["应用力均匀","铁件应夹紧","铁件不得摆动","及时加注机油","若卡住钻头应摆动钻头"],"answer":"ABCD","why":"依据铁件钻孔安全操作规程，用力均匀、铁件夹紧、不得摆动、及时加注机油均正确。干扰项E钻头卡住时摆动钻头会使铁件甩脱或钻头折断伤人，正确做法是停机断电处理。"},{"type":"多选","stem":"铁件去锈和喷刷漆时,作业人员应戴（　）的防护工序。","options":["口罩","手套","安全帽","安全带","绝缘鞋"],"answer":"AB","why":"依据去锈喷漆职业健康防护要求，本工序主要危害是粉尘和漆液刺激，作业人员应戴口罩、手套。干扰项安全帽、安全带、绝缘鞋针对高处和用电作业，与本工序危害因素不对应。"},{"type":"单选","stem":"交流配电屏的中性线应与机架 （　）","options":["连通","绝缘","通过电缆复接","通过开关隔断"],"answer":"B","why":"依据通信电源安装规范，交流配电屏的中性线应与机架绝缘，防止零线电流窜入机架造成设备干扰和漏电。干扰项连通、电缆复接会造成零地混接，通过开关隔断也无必要。"},{"type":"多选","stem":"设备安装工程中,关于线缆布放的说法符合规范的有 （　）","options":["交流线、直流线、信号线应分开布放","电源线中间严禁有接头,","非同一级电力电缆不得穿放在同一管孔内","开口式线鼻子制作端头应用专用压接工具压接","6mm2 的单股铜芯电源线终端应加装线鼻子"],"answer":"ABC","why":"依据机房布线及电源安装规范：交直流线、信号线应分开布放防干扰，电源线中间严禁接头防发热，非同级电力电缆不得同管孔。D开口式线鼻子端头应焊接处理，E单股铜芯线可直接制作接头，均说法错误。"},{"type":"单选","stem":"铜汇流排在过墙体或楼层孔洞时,应采用 （　） 连接","options":["软铜母线","硬铜母线","铜芯电缆","铝芯电缆"],"answer":"A","why":"依据汇流排安装规范，铜汇流排穿越墙体或楼层孔洞时应采用软铜母线连接，适应建筑物沉降伸缩，防止硬母线被拉断。干扰项硬铜母线无缓冲，铜芯电缆连接不符合母线安装工艺。"},{"type":"单选","stem":"汇流排在过墙体或楼层孔洞时,洞口处两端接头应处于墙体或松板洞孔外,并在墙体外的两侧用 （　）与墙体固定。","options":["镀锡接头排","镀锌钢支撑","不锈钢支撑","绝缘子支撑"],"answer":"D","why":"依据母线安装规范，接头应处于墙体或洞孔之外，并在墙外两侧用绝缘子支撑与墙体固定，既固定母线又保证对地绝缘。干扰项镀锡接头排及各类金属支撑会使母线与建筑电气连通，破坏绝缘。"},{"type":"单选","stem":"多片汇流排在同一路由安装时,接头点应 （　）","options":["上下对齐","前后错开","左右对齐","前后对齐"],"answer":"B","why":"依据母线安装规范，多片汇流排同一路由安装时接头点应前后错开，避免接头薄弱处集中在同一断面发热叠加。干扰项上下、左右、前后对齐布置均使隐患集中，检修时还易误碰相邻接头。"},{"type":"单选","stem":"汇流排制作完毕,应喷刷绝缘漆,正极喷 （　） 色。","options":["黄","绿","红","蓝"],"answer":"C","why":"依据通信电源色标规定，汇流排制作完毕喷刷绝缘漆，正极喷红色、负极喷蓝色。记忆口诀：正红负蓝。干扰项黄、绿常用作相线色标，蓝是负极色，只有红色对应正极。"},{"type":"单选","stem":"为防止静电损伤通信设备,在机房测试设备需要插拔机盘时,应佩戴（　）","options":["专用钥匙","防静电手环","绝缘手套","防静电服"],"answer":"B","why":"依据机房防静电要求，插拔机盘应佩戴防静电手环并良好接地，及时泄放人体静电，防止击穿电路板芯片。干扰项绝缘手套反而阻碍静电泄放，防静电服是整体着装要求，插拔操作关键靠手环。"},{"type":"单选","stem":"铁塔安装工程施工,在塔上有作业人员工作期间,（　）不得离开现场,应密切观察塔上作业人员的作业情况,发现违章行为,应及时制止。","options":["指挥人员","安全负责人","技术负责人","项目经理"],"answer":"A","why":"依据铁塔高处作业安全规定，塔上有作业人员工作期间，指挥人员不得离开现场，须密切监视并制止违章。干扰项安全员、项目经理负有管理职责，但全程盯守塔上作业的直接责任在现场指挥人员。"},{"type":"单选","stem":"塔上作业时,应以塔基为圆心, （　）为半径,设置施工区,非作业人员不得入内。","options":["塔高的 20%","塔高的 50%","塔高","塔高的 1.05 倍"],"answer":"D","why":"依据铁塔施工警戒区设置要求，应以塔基为圆心、塔高的1.05倍为半径设置施工区。数字记忆：1.05倍塔高，比塔高多5%余量，可覆盖构件坠落范围；20%、50%半径防护不足。"},{"type":"单选","stem":"上下塔作业时,两人同时上塔,两人之间距离应保持在 （　）以上。","options":["2 米","2.5 米","3 米","4 米"],"answer":"C","why":"依据上下塔安全规定，两人同时上塔间距应保持3米以上，防止上方人员失手落物砸伤下方人员。数字记忆：塔上间距3米；1.5、2.5米间距不足，4米虽更安全但非规程数值。"},{"type":"单选","stem":"在塔上安装天馈线作业中,下列做法正确的是 （　）","options":["四方塔应从塔角攀登","上塔时人间距保持 1.5 米D 上塔累了坐在护栏上休息会","上塔累了坐在护栏上休息会 C 行动速度宜慢不宜快"],"answer":"C","why":"依据铁塔攀登安全要求，上塔行动速度宜慢不宜快。干扰项A四方塔应从有爬梯的塔面攀登而非塔角；B人间距应保持3米以上；D坐在护栏上休息属违章行为，均错误。"},{"type":"单选","stem":"需要向塔上吊运物体时,在物体稍离地面时对 （　） 再作一次详细的安全生产检查,若有问题及时处理。","options":["钢丝绳","物体","卷扬机","尾绳"],"answer":"A","why":"依据吊装作业规范，物体稍离地面时应暂停，对钢丝绳吊索再做一次详细安全检查，此时吊索刚完全受力，是断丝断股暴露的时机。干扰项物体、卷扬机、尾绳检查不能替代主受力钢丝绳复查。"},{"type":"单选","stem":"铁塔上天线支架若需另加镀锌角钢固定时,不得在（　） 上钻孔或电焊。","options":["角钢","扁钢","抱杆","护栏"],"answer":"A","why":"依据铁塔结构保护要求，天线支架另加镀锌角钢固定时，不得在抱杆上钻孔或电焊，以免削弱塔身主构件强度、破坏镀锌防腐层引发锈蚀。干扰项角钢、扁钢属支架辅材，可按设计加工连接。"},{"type":"单选","stem":"根据电信设施接地要求,下列不得连通的设备或构件是 （　）","options":["金属坚井之间","金属槽道之间","走线架与列走线架之间","室内走线架与室外走线架间"],"answer":"D","why":"依据通信局站防雷接地要求，室内走线架
