.nqopt:hover { border-color: #9ec2ee; }
.nqopt.right { border-color: #2e9e5b; background: #e9f7ef; }

.nqfb.nqno { background: #fff8e6; color: #6b5416; }
.nqb { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 20px; padding: 1px 8px; }

.nqb.no { background: #fdecec; color: #d64545; }

<script>
'use strict';
const DATA = [{"file":"00绪论","title":"绪论","count":3,"questions":[{"type":"多选","stem":"《中共中央、国务院关于推进安全生产领域改革发展的意见》 (2016)中指出,推进安全生产领域改革的基本原则有 （　）。","options":["坚持安全发展","坚持改革创新","坚持过程防范","坚持依法监管","坚持重点治理"],"answer":"ABD","why":"依据2016年《中共中央、国务院关于推进安全生产领域改革发展的意见》，基本原则为：坚持安全发展、坚持改革创新、坚持依法监管、坚持源头防范、坚持系统治理。C错在“过程防范”应为“源头防范”，E错在“重点治理”应为“系统治理”，均系偷换表述。"},{"type":"单选","stem":"各级党委和政府要坚决落实安全生产责任制,切实做的党政同责)、失职追责。（　）","options":["巡查考核","分工负责","一岗双责","党政分开"],"answer":"C","why":"依据该《意见》，各级党委和政府要坚决落实安全生产责任制，切实做到党政同责、一岗双责、齐抓共管、失职追责。“一岗双责”指领导干部既管业务又必须管安全；“党政分开”与“党政同责”相悖，是最易误选的干扰项。"},{"type":"单选","stem":"安全生产举报投诉专线电话是 （　）","options":["2350","12306","12315","12335"],"answer":"A","why":"安全生产举报投诉专线是12350，务必记准五位数。12306是铁路客服热线，12315是消费者（市场监管）投诉热线，12335是商务领域举报投诉专线，均与安全生产举报无关，属号码混搭干扰。"}]},{"file":"01第一章","title":"第一章","count":109,"questions":[{"type":"单选","stem":"我国最早的一部《安全生产法》是 （　） 年制定的。","options":["1999 年","2002 年","2014 年","2016 年"],"answer":"B","why":"依据2016年《中共中央、国务院关于推进安全生产领域改革发展的意见》，基本原则是坚持安全发展、改革创新、依法监管、源头防范、系统治理。C“过程防范”应为“源头防范”，E“重点治理”应为“系统治理”，均系偷换关键词。"},{"type":"单选","stem":"现行的《安全生产法》自（　）起施行。","options":["2020 年 12 月 1 日","2021 年 6 月 10 日","2021 年 9 月 1 日","2021 年 12 月 1 日"],"answer":"C","why":"2021年6月10日全国人大常委会通过修正决定，新《安全生产法》自2021年9月1日起施行；6月10日是通过日期，别和施行日期混淆。"},{"type":"单选","stem":"有关《安全生产法》的适用范围,下面表述最准确的是 （　）。","options":["具有独立法人资格的单位","在工商部门注册的单位","在我国领域内从事生产经营活动的单位","对具有危险作业的单位"],"answer":"C","why":"安全生产举报投诉专线为12350，五位数务必记牢。12306是铁路客服，12315是市场监管消费投诉，12335是商务举报专线，均与安全生产无关，属号码混搭干扰。"},{"type":"判断","stem":"安全生产工作应当以人为本,坚持安全发展,坚持安全第一预防为主、科技创新的方针,强化和落实生产经营单位的主体责任。（　）","options":[],"answer":"错","why":"错误。方针的法定表述是“安全第一、预防为主、综合治理”，题干用“科技创新”替换了“综合治理”；强化生产经营单位主体责任虽对，但方针表述错误，整句判错。"},{"type":"多选","stem":"下面关于安全生产工作机制的内容,说法正确的是 （　）。","options":["生产经营单位负责","职工参与","政府监管","行业自律","社会共享"],"answer":"ABCD","why":"安全生产工作机制为：生产经营单位负责、职工参与、政府监管、行业自律、社会支持。E“社会共享”应为“社会支持”，属关键词偷换；前四项均与法条一致。"},{"type":"多选","stem":"根据《安全生产法》要求,生产经营单位在生产经营过程中必须（　）","options":["贯彻“管安全必须管生产”理念","遵守有关安全生产的法律、法规","加强安全生产管理,提高安全生产水平,确保安全生产","建立、健全安全生产责任制和安全生产规章制度","改善安全生产条件,加强安全生产标准化、信息化建设"],"answer":"BCDE","why":"依据《安全生产法》，生产经营单位必须遵守安全生产法律法规，加强管理确保安全，建立健全责任制和规章制度，改善条件并推进标准化、信息化建设。A理念颠倒，正确表述是“管生产必须管安全”。"},{"type":"单选","stem":"生产经营单位的（　）是本单位的安全生产第一责任人。","options":["专职安全生产分管负责人","安全总监","主要负责人","注册安全工程师"],"answer":"C","why":"依据《安全生产法》，主要负责人是本单位安全生产第一责任人，对安全生产工作全面负责。专职分管负责人、安全总监只承担分管责任，注册安全工程师是专业管理人员，均非第一责任人。"},{"type":"多选","stem":"依据《安全生产法》,生产经营单位的工会组织在安全生产方面的职责包括（　）","options":["依法组织职工参加本单位安全生产工作的民主管理","对本单位落实职工的安全防护情况负责","依法组织职工参加本单位安全生产工作的民主监督","对本单位的安全生产工作进行管理","维护职工在安全生产方面的合法权益"],"answer":"ACE","why":"工会职责是依法组织职工参加安全生产的民主管理和民主监督，维护职工在安全生产方面的合法权益。B、D把落实防护、直接管理安全的行政责任安到工会头上，工会是参与和监督而非管理部门。"},{"type":"判断","stem":"乡、镇人民政府以及街道办事处等地方人民政府的派出机关有权对本行政区域内生产经营单位安全生产状况进行监督检查。 （　）","options":[],"answer":"错","why":"错误。依据《安全生产法》，乡镇政府和街道办等派出机关是协助上级人民政府有关部门依法履行安全生产监督管理职责，自身不享有独立的监督检查权，“有权监督检查”表述不准确。"},{"type":"多选","stem":"乡镇人民政府和街道办事处等应当（　）","options":["按照职责对本行政区域或者管理区域内生产经营单位安全生产状况进行监督检查","按照授权依法履行安全生产监督管理职责","协助人民政府有关部门","实施综合监督管理","地方人民政府具有安全生产执法权"],"answer":"ABC","why":"乡镇街道应按职责对本行政区域生产经营单位安全生产状况进行监督检查，按照授权依法履行监管职责，并协助政府有关部门工作。D综合监督管理属应急管理部门，E乡镇街道无执法权，均错误。"},{"type":"判断","stem":"安全生产监管部门对安全生产进行专业监管、行业管理和指导。（　）","options":[],"answer":"错","why":"错误。应急管理部门对安全生产工作实施综合监督管理；专业监管、行业管理和指导是有关行业主管部门的职责，题干把两类监管主体的分工张冠李戴。"},{"type":"判断","stem":"应急管理部门和对有关行业、领域的安全生产工作实施监督管理的部门,统称负有安全生产监督管理职责的部门。（　）","options":[],"answer":"对","why":"正确。依据《安全生产法》，应急管理部门和对有关行业、领域安全生产工作实施监督管理的部门，统称负有安全生产监督管理职责的部门，与法条原文一致。"},{"type":"多选","stem":"生产经营单位应当具备的安全生产条件所必须的资金投入,应有（　）予以保证。","options":["生产经营单位的安全生产管理机构","生产经营单位的决策机构","生产经营单位的主要负责人","个人经营的投资人","生产经营单位的项目负责人"],"answer":"BCD","why":"安全生产条件所必需的资金投入，由生产经营单位的决策机构、主要负责人或者个人经营的投资人予以保证，投入不足并导致后果的要承担责任。安全机构和项目负责人无资金决策权。"},{"type":"判断","stem":"生产经营单位应当按照规定提取和使用安全生产费用,主要用于改善安全生产条件。 （　）","options":[],"answer":"错","why":"错误。安全生产费用应按规定提取并“专门用于”改善安全生产条件，属专款专用；题干“主要用于”弱化了专款属性，易致费用挪用，与法条表述不符。"},{"type":"多选","stem":"根据相关法律法规,下列单位中需要配备专职安全生产管理人员的有（　）","options":["建筑施工企业","餐饮企业","通信施工企业","客运公司","烟花销售公司"],"answer":"ACDE","why":"矿山、建筑、运输、危险物品等高危行业须配备专职安全员：建筑施工（含通信施工）、道路客运、烟花爆竹销售均在列；普通餐饮企业风险较低，不属于强制配备专职安全员的范围，故选ACDE。"},{"type":"判断","stem":"从业人员少于一百人的建筑施工企业,应当设置安全生产管理机构或者配备专职安全生产管理人员。（　）","options":[],"answer":"对","why":"正确。依据《安全生产法》和《建设工程安全生产管理条例》，建筑施工企业应当设置安全生产管理机构或者配备专职安全生产管理人员，该要求不以人数为前提，与其他行业以一百人划界不同。"},{"type":"单选","stem":"“矿山、金属冶炼、建筑施工、运输单位和危险物品的生产、经营、储存、装卸单位”以外的其他生产经营单位规模在 （　）的生产经营单位应当配备专职或者兼职安全生产管理人员。","options":["100 人以下","150 人以下","200 人以下","300 人以下"],"answer":"A","why":"除矿山、金属冶炼、建筑施工、运输和危险物品单位外，其他单位从业人员超过一百人的应设机构或配专职安全员，一百人以下配专职或兼职。法定分界就是一百人，150、200、300均为干扰数字。"},{"type":"判断","stem":"生产经营单位作出涉及安全生产的经营决策,应当听取安全生产管理机构以及安全生产管理人员的意见。（　）","options":[],"answer":"对","why":"正确。依据《安全生产法》，生产经营单位作出涉及安全生产的经营决策，应当听取安全生产管理机构以及安全生产管理人员的意见，保障安全管理人员的参与权。"},{"type":"单选","stem":"生产经营单位的主要负责人和安全生产管理人员必须具备与本单位所从事的生产经营活动相应的安全生产知识和（　）。","options":["管理经历","相关学历","救援能力","管理能力"],"answer":"D","why":"主要负责人和安全生产管理人员必须具备与本单位经营活动相应的安全生产知识和管理能力。学历、经历、救援能力都不是法定必备条件，固定搭配是“安全生产知识＋管理能力”。"},{"type":"多选","stem":"生产经营单位的主要负责人和安全生产管理人员必须具备与本单位所从事的生产经营活动相应的 （　）。","options":["管理经历","管理能力","救援能力","相关学历","安全生产知识"],"answer":"BE","why":"与上题同源，法定要求为两项：相应的安全生产知识和相应的管理能力。A管理经历、C救援能力、D相关学历均为编造搭配，只有BE组合与法条一致。"},{"type":"单选","stem":"关于生产经营单位的安全生产管理机构以及安全生产管理人员的表述,错误的是（　）。","options":["生产经营单位做出涉及安全生产的经营决策,应当听取安全生产管理人员的意见","生产经营单位不得因安全生产管理人员依法履行职责而降低其工资、福利等待通","建筑设施单位的安全生产管理人员的任免,应当经应急管理部门批准","安全生产管理人员必须具备与本单位所从事的生产经营活动相应的安全生产知识和管理能力"],"answer":"C","why":"本题选错误项C：危险物品、矿山、金属冶炼等单位安全管理人员的任免只需告知主管的负有安监职责的部门，是告知备案而非“经批准”。A、B、D均为法条正确表述。"},{"type":"单选","stem":"依照《安全生产法》规定,生产经营单位必须保证上岗的从业人员都经过（　）,否则,生产经营单位要承担法律责任。","options":["安全生产教育和培训","安全审查","安全生产高等教育","安全和保密培训"],"answer":"A","why":"依据《安全生产法》，从业人员必须经安全生产教育和培训合格后方可上岗作业，未经教育培训上岗的，生产经营单位要承担法律责任。安全审查、高等教育、保密培训均非法定上岗前提。"},{"type":"多选","stem":"生产经营单位应当对从业人员进行安全生产教育和培训,保证从业人员（　）","options":["具备必要的安全生产知识","熟悉有关的安全生产规章制度和安全操作规程","掌握本岗位的安全操作技能,了解事故应急处理措施","知悉自身在安全生产方面的权利和义务","具备应急管理部门的考核合格证"],"answer":"ABCD","why":"培训应保证从业人员：具备必要安全知识，熟悉规章制度和操作规程，掌握本岗位操作技能并了解事故应急处理措施，知悉自身权利义务。E考核合格证仅针对负责人、安管人员和特种作业人员，非全体从业人员。"},{"type":"判断","stem":"企业应对被派遣劳动者纳入本单位从业人员统一管理,进行岗位安全操作规程和安全操作技能的教育和培训。 （　）","options":[],"answer":"对","why":"正确。依据《安全生产法》，被派遣劳动者纳入本单位从业人员统一管理，由用工单位对其进行岗位安全操作规程和安全操作技能的教育培训，题干与法条一致。"},{"type":"判断","stem":"施工企业的被派遣劳动者应当和本企业从业人员分别管理。（　）","options":[],"answer":"错","why":"错误。被派遣劳动者应当与本企业从业人员统一管理，而不是分别管理；统一管理才能确保安全培训、防护配备和应急管理落实到每个人。"},{"type":"多选","stem":"对被派遣劳动者具有教育和培训义务的单位有 （　）负责","options":["安全生产监督管理部门","使用被派遣劳动者的单位","特种作业培训机构","劳务派遣单位","劳动就业指导中心"],"answer":"BD","why":"依据《安全生产法》，劳务派遣单位和使用被派遣劳动者的单位（用工单位）都负有教育培训义务。监管部门、培训机构、就业指导中心均不承担该法定义务，故选BD。"},{"type":"单选","stem":"《中华人民共和国安全生产法》规定生产经营单位应当建立健全生产安全事故隐患排查治理制度,采取技术、管理措施,及时发现并消除事故隐患。事故隐患排查治理情况应当如实记录,并向 （　）通报。","options":["安管机构","监督机构","从业人员","管理人员"],"answer":"C","why":"事故隐患排查治理情况应当如实记录，并向从业人员通报，保障职工知情权。向监管部门报告仅限重大事故隐患，安管机构、管理人员均非法定通报对象。"},{"type":"单选","stem":"《安全生产法》规定,重大事故隐患排查治理情况应当及时向负有安全生产监督管理职责的部门和（　）报告。","options":["职工大会","党员大会股东大会","股东大会","全体员工"],"answer":"A","why":"重大事故隐患排查治理情况应及时向负有安全生产监督管理职责的部门和职工大会（职工代表大会）报告。股东大会是公司治理机构，党员大会与安全无关，全体员工表述不规范。"},{"type":"判断","stem":"生产、经营、储存、使用危险品的车间、商店、仓库周边的安全防护应当符合国家有关规定,不得与员工宿舍在同一座建筑物内,并与员工宿舍保持安全距离。（　）","options":[],"answer":"对","why":"正确。依据《安全生产法》，生产、经营、储存、使用危险物品的车间、商店、仓库不得与员工宿舍在同一座建筑物内，并应当与员工宿舍保持安全距离，这是防范群死群伤事故的刚性规定。"},{"type":"单选","stem":"依据《安全生产法》要求,下列作业中需要安排专门人员进行现场安全管理的是 （　）。","options":["土方开挖","设备安装","临时用电","消防设施安装"],"answer":"C","why":"依据《安全生产法》，爆破、吊装、动火、临时用电等危险作业应当安排专门人员进行现场安全管理。临时用电在法定列举之内；土方开挖、设备安装、消防安装不在列举中。"},{"type":"判断","stem":"生产经营单位应依法为从业人员提供劳动防护用品,并监督教育其正确佩戴和使用。（　）","options":[],"answer":"对","why":"正确。生产经营单位必须为从业人员提供符合国家或行业标准的劳动防护用品，并监督、教育从业人员按照使用规则正确佩戴和使用，免费提供与监督教育缺一不可。"},{"type":"判断","stem":"生产经营单位将生产经营项目、场所、设备发包或者出租是一种民事行为,生产经营单位可以随意发包或出租。（　）","options":[],"answer":"错","why":"错误。发包出租并非可随意处分的民事行为：不得发包给不具备安全生产条件或相应资质的单位、个人，且应签订安全生产管理协议或约定各自安全职责，否则要承担相应法律责任。"},{"type":"单选","stem":"关于项目发包安全管理的说法,正确的是（　）","options":["不得将生产经营项目发包给不具备安全生产条件或者相应资质的单位或者个人","将项目发包给不具备相应资质的个人时,发包单位必须对该项目进行统一管理,确保安全","招标时可以约定将项目的安全生产管理责任整体发包","项目发包给多个单位时,可以约定由其中某个分包方统一进行安全管理并承担全部责任"],"answer":"A","why":"正确表述A：不得将生产经营项目、场所、设备发包给不具备安全生产条件或者相应资质的单位、个人，资质与条件是硬门槛。B试图用“统一管理”规避资质要求，C、D用合同约定整体转嫁安全责任，均违法。"},{"type":"单选","stem":"生产经营单位发生生产安全事故时,单位的主要负责人应当（　）井不得在事故调查期间擅离职守。","options":["立即组织调查","立即封锁事故消息","立即查处责任人","立即组织抢救"],"answer":"D","why":"依据《安全生产法》，事故发生后单位主要负责人应立即组织抢救，并在事故调查处理期间不得擅离职守。先救人后问责，封锁消息违法，组织事故调查是政府部门的职权。"},{"type":"单选","stem":"下列保险中,生产经营单位必须依法参加并为从业人员缴纳保险费的是（　）.","options":["重大疾病险","意外伤害保险","工伤保险","安全生产责任保险"],"answer":"C","why":"工伤保险是法定强制社会保险，生产经营单位必须依法为从业人员缴纳保险费。安责险国家仅鼓励投保（高危行业要求投保），意外险、重疾险均属商业保险，不具有强制性。"},{"type":"单选","stem":"施工企业必须依法为从业人员投保的险种是（　）","options":["工伤社会保险","意外伤害保险","安全生产责任保险","工程一切险"],"answer":"A","why":"施工企业必须依法为从业人员缴纳工伤社会保险。意外伤害保险、安全生产责任险均为鼓励或按约定投保，工程一切险是商业工程保险，都不具有法定强制性。"},{"type":"单选","stem":"依据《安全生产法》,国家 （　） 生产经营单位投保安全生产责任保险,","options":["强制","反对","不要求","鼓励"],"answer":"D","why":"依据《安全生产法》，国家鼓励生产经营单位投保安全生产责任保险，以市场机制分散事故风险；只有高危行业、领域才要求强制投保，本题问一般性表述，故选鼓励。"},{"type":"多选","stem":"生产经营单位与从业人员订立的劳动合同,应载明的事项有 （　）","options":["劳动安全","晋升时限","工伤保险","工作地点","职业病防护"],"answer":"ACDE","why":"劳动合同应当载明劳动安全、防止职业危害（职业病防护）、工伤保险以及工作地点等事项。B晋升时限与劳动安全无关，不属于法定载明事项，属凑数干扰。"},{"type":"单选","stem":"依照《生产安全法》的规定,企业（　） 与从业人员订立协议,免除或者减轻其对从业人员因生产安全事故伤亡依法应承担的责任。","options":["在民法的范围内可以","经有关部门批准可以","不得","一般不得"],"answer":"C","why":"依据《安全生产法》，生产经营单位不得以任何形式与从业人员订立协议，免除或者减轻其对从业人员因事故伤亡依法应承担的责任，即“生死合同”一律无效，没有任何例外或批准渠道。"},{"type":"单选","stem":"生产经营单位不得因从业人员（　）而降低其工资、福利等待遇或者解除与其订立的劳动合同。","options":["选择性地履行安全生产义务","拒绝安全生产义务","行使安全生产权力","行使安全生产法外特权"],"answer":"C","why":"从业人员依法行使安全生产权利（如拒绝违章指挥、紧急避险）时，单位不得降低其工资福利或解除劳动合同。A、B、D所述“选择性履行”“拒绝义务”“法外特权”本身即不合法，谈不上受保护。"},{"type":"单选","stem":"安全生产从业人员不享有的权力是 （　）","options":["了解其作业场所和工作岗位存在的危险因素","对本单位的安全生产工作提出建议","本单位生产管理工作中存在的问题提出批评、检举、控告","发现直接危及人身安全的紧急情况时立即撤离作业现场"],"answer":"D","why":"知情权、建议权、批评检举控告权均为法定权利；紧急避险权的法定表述是“停止作业或者在采取可能的应急措施后撤离作业场所”，D称可“立即撤离”缺少法定前提，表述不成立，故为本题所选的不享有项。"},{"type":"多选","stem":"在生产经营活动中,从业人员必须履行一定的义务,同时也依法享有定的权力,下列属于从业人员依法享有的安全生产权力的是 （　）。","options":["了解工作岗位危险因素和应急措施的权力","拒绝超级指挥和垂直管理的权力","获得安全保障、工伤保险和民事赔偿的权力","紧急情况下停止作业和撤离现场的权力","拒绝佩戴劳动防护用品的权力"],"answer":"ACD","why":"A知情权、C获得安全保障及工伤保险和民事赔偿权、D紧急情况下停止作业和撤离现场权均为法定权利。B的表述并非法定权利（法定为拒绝违章指挥和强令冒险作业权），E错在把佩戴劳保用品的义务当成可拒绝的权利。"},{"type":"多选","stem":"施工作业人员应当享有的安全生产权力有 （　）。","options":["获得防护用品的权力","获得工伤保险赔偿的权力","拒绝违章指挥的权力","拒绝教育培训的权力","紧急避险的权力"],"answer":"ABCE","why":"获得防护用品、工伤保险赔偿、拒绝违章指挥、紧急避险均为施工作业人员法定权利，ABCE正确。D接受安全教育培训是从业人员的义务，“拒绝教育培训”不是权利，注意权利义务不能混淆。"},{"type":"多选","stem":"依据《安全生产法》,下列属于从业人员安全生产基本义务的有（　）","options":["落实岗位安全责任","接受安全生产教育和培训","保证安全生产投入的有效实施","遵守规章制度","遵从管理人员的一切指挥"],"answer":"ABD","why":"从业人员义务包括落实岗位安全责任、接受教育培训、遵守规章制度并服从管理。C保证安全生产投入是单位的资金保障义务，与从业人员无关；E“一切指挥”绝对化，对违章指挥从业人员有权拒绝。"},{"type":"多选","stem":"按照安全生产从业人员享有义务的规定,从业人员有义务（　）。","options":["正确佩戴和使用劳动防护用品","严格遵守本单位的安全生产规章制度","严格遵守本单位的安全生产操作规程","拒绝违章作业和强令冒险作业","接受安全生产教育和培训"],"answer":"ABCE","why":"正确佩戴劳保用品、遵守规章制度和操作规程、接受教育培训均为从业人员义务，ABCE正确。D拒绝违章作业和强令冒险作业是权利而非义务，混入义务清单故不选，做题时分清权利义务两栏。"},{"type":"判断","stem":"工会是维护职工权益的组织,无权干涉和监督建设项目安全设施的“三同时”情况。 （　）","options":[],"answer":"错","why":"错误。依据《安全生产法》，工会有权对建设项目的安全设施与主体工程同时设计、同时施工、同时投入生产和使用的情况进行监督并提出意见，题干“无权监督”与法条相悖。"},{"type":"多选","stem":"依据《安全生产法》,下列属于工会安全权力的有 （　）。","options":["监督建设项目的安全设施与主体工程同时设计、同时施工、同时投入生产和使用情况","要求追究安全生产事故中有关人员的责任","发现危及从业人员生命安全的情况时,决定保证人员安全撤离危险场所","发现事故隐患时,作解决的决定","依法参加事故调查,向有关部门提出处理意见"],"answer":"ABE","why":"工会安全权力包括：监督“三同时”落实情况、发现问题时提出意见并要求追究有关人员责任、依法参加事故调查处理并向有关部门提出处理意见。C、D错在工会只能建议、提请，无权直接决定撤离或处置隐患。"},{"type":"单选","stem":"应急管理部门在开展安全生产行政执法时,对检查中发现的事故隐患,下列处理方式合适的是 （　）。","options":["应当责令撤出作业人员","应当责令立即排除","应当责令立即停产停业","应当立即该单位进行罚款"],"answer":"B","why":"检查发现事故隐患应当责令立即排除；重大隐患排除前或排除过程中无法保证安全的，才责令从危险区域撤出作业人员、责令暂时停产停业。A是重大隐患时的升级措施，C、D处罚有违比例原则。"},{"type":"判断","stem":"应急管理部门和其他负有安全生产监督管理职责的部门在对生产经营单位进行监督检查时不得影响被检查单位的正常生产经营活动。 （　）","options":[],"answer":"对","why":"正确。依据《安全生产法》，监督检查不得影响被检查单位的正常生产经营活动，这是依法行政、规范执法的基本要求，题干表述与法条一致。"},{"type":"单选","stem":"安全生产监督检查人员执行监督检查任务时,必须出示 （　）","options":["有效的行政执法文件","有效的个人身份证件","全国统一的监察证件","有效的行政执法证件"],"answer":"D","why":"安全生产监督检查人员执行监督检查任务时，必须出示有效的行政执法证件以表明执法身份。身份证不能代替执法证，A、C的表述也不是法定的证件名称，考点锁定“行政执法证件”。"},{"type":"单选","stem":"某地级市应急管理部门负责监管的执法人员孙某,深入该市某企业检查,孙某在检查过程中的正确的做法是 （　）","options":["检查前,向企业负责人出示执法证件","忘带执法证件时,可以出示有效身份证件代替","指定使用某大品牌的安全帽替换不合格的安全帽","以抽查方式查验时可以不要求被检查单位负责人签字"],"answer":"A","why":"A正确：检查前必须向被检查单位出示执法证件。B身份证不能代替执法证件；C指定品牌安全帽属于滥用职权干预企业自主经营；D检查情况应由被检查单位负责人签字确认，抽查也不例外。"},{"type":"单选","stem":"安全生产监督检查人员应当将检查的时间、地点、内容、发现的问题及其处理情况,作出书面记录,并由检查人员和（　）签字。","options":["被检查单位的负责人","检查单位的负责人","被检查现场的作业人员","检查现场的见证人员"],"answer":"A","why":"检查的时间、地点、内容、发现的问题及处理情况应当作出书面记录，由检查人员和被检查单位的负责人签字；负责人拒绝签字的，检查人员应当将情况记录在案。其余人员均非法定签字人。"},{"type":"多选","stem":"负有安全生产监督管理职贵的部门应当建立安全生产违法行为信息库,如实记录生产经营单位及其从业人员的安全生产违法行为信息;对违法行为情节严重的生产经营单位及其有关从业人员,应当及时向社会并通报 （　）等单位。","options":["交通主管部门","行业主管部门","投资主管部门","自然资源主管部门","证券监督管理机构以及有关金融机构"],"answer":"BCDE","why":"依据《安全生产法》，对违法行为情节严重的单位及从业人员应向社会公示，并通报行业主管部门、投资主管部门、自然资源主管部门、证券监督管理机构以及有关金融机构，实施联合惩戒。A交通主管部门不在法定通报之列。"},{"type":"单选","stem":"根据《安全生产法》的相关规定,关于生产安全事故应急救援预案,以下表述错误的是（　）。","options":["县级以上地方各级人民政府应当组织有关部门制定本行政区域内生产安全事故应急救援预案","人数较少的小型建筑施工单位可以不制定生产安全事故应急救援预案","生产经营单位的生产安全事故应急救援预案,应当与所在地县级以上地方人民政府组织制定的生产安全事故应急救援预案衔接","生产经营单位应当定期组织应急预案演练"],"answer":"B","why":"本题选错误项B：任何生产经营单位都应当制定本单位生产安全事故应急救援预案，小型单位也不例外，只是可简化并与所在地县级以上政府预案相衔接。“人数较少可不制定”于法无据。"},{"type":"多选","stem":"生产经营规模较小的建筑施工单位（　）","options":["必须建立应急救援组织","不必建立应急救援组织","必须指定专职的应急救援人员","应当配备必要的应急救援器材","可以不建立应急救援组织,但应当指定兼职的应急救援人品"],"answer":"BDE","why":"规模较小的建筑施工单位可以不建立应急救援组织，但应当指定兼职的应急救援人员，并配备必要的应急救援器材、设备。B、D、E正确；C错在“专职”，A错在“必须建立组织”。"},{"type":"单选","stem":"依据《安全生产法》,生产经营单位发生生产安全事故后,事故现场有关人员应当立即报告 （　）。","options":["应急管理部门","行业主管部门","本单位负责人","本单位工会负责人"],"answer":"C","why":"事故现场有关人员应当立即报告本单位负责人，再由单位负责人按规定向政府部门报告。报告链条是“现场人员→单位负责人→监管部门”，应急、行业部门都是后续环节，不能跳过本单位。"},{"type":"单选","stem":"事故发生后,应由（　）负贵向安全生产监督管理部门上报事故情。","options":["法定代表人","技术负责人","项目负责人","吊车司机况"],"answer":"A","why":"单位负责人（法定代表人）接到事故报告后，应当立即如实向负有安全生产监督管理职责的部门报告，不得迟报、漏报、谎报、瞒报。项目负责人、技术负责人只是单位内部接报环节，对外上报责任人是单位负责人。"},{"type":"单选","stem":"生产经营单位主要负责人未履行《安全生产法》规定的安全生产管理职责,导致发生生产安全事故,尚不构成刑事处罚的,给予撤职处分,并在（　）年内不得担任任何生产经营单位的主要负责人。","options":["5","7","终身"],"answer":"A","why":"依据《安全生产法》，主要负责人未履行安全管理职责导致事故、尚不构成犯罪的，给予撤职处分，并在五年内不得担任任何生产经营单位的主要负责人；原题库答案“7年”无法律依据，正确为5年。顺带记：受刑事处罚或撤职处分期满后同样5年禁任，重大/特别重大事故责任人终身禁任本行业。"},{"type":"判断","stem":"生产经营单位的主要负责人违反《安全生产法》规定受刑事处罚或者撤职处分的,自刑罚执行完毕或者受处分之日起,五年内不得担任何生产经营单位的主要负责人;对重大、特别重大生产安全事故负有责任的,终身不得担任任何生产经营单位的主要负责人。（　）","options":[],"answer":"错","why":"错在「终身不得担任任何生产经营单位」——法律规定对重大、特别重大事故负有责任的，终身不得担任本行业生产经营单位的主要负责人，前半句「五年内不得担任任何单位主要负责人」是对的。「本行业」与「任何」一字之差就是命题点。"},{"type":"单选","stem":"根据《生产安全法》,生产经营单位的主要负责人因未履行安全生产管理职责,生产安全事故被判处有期徒刑的,自刑期执行完毕之日起（　）","options":["2 年内不得担任本施工企业的中层管理人员","3 年内不得担任监理单位的主要负责人","5 年内不得担任任何生产经营单位的主要负责人","专业技术性较强的管理制度,应由企业安全主管部门负责审核"],"answer":"C","why":"主要负责人未履行安全生产管理职责受刑事处罚的，自刑罚执行完毕之日起，五年内不得担任任何生产经营单位的主要负责人。A、B的年限和岗位范围均与法定表述不符，只有C完整对应法条。"},{"type":"单选","stem":"根据《生产安全法》,生产经营单位的主要负责人因未履行安全生产管理职责,导致发生一般安全生产事故被判处有期徒刑的,自刑期执行完毕之日起 （　）。","options":["2 年内不得担任本施工企业的中层管理人员","3 年内不得担任监理单位的主要负责人","5 年内不得担任任何生产经营单位的主要负责人","终身不得担任本行业生产经营单位的主要负责人"],"answer":"C","why":"即使因一般事故被判刑，也是自刑罚执行完毕之日起五年内不得担任任何生产经营单位的主要负责人，从业禁止不因事故等级减轻；“终身”仅适用于对重大、特别重大事故负有责任的情形，且限于本行业。"},{"type":"单选","stem":"某生产经营单位发生了较大生产安全事故,该单位主要负责人可能受到的处罚有 （　）。","options":["处上一年年收入百分之三十的罚款","处上一年年收入百分之六十的罚款","处上一年年收入百分之九十的罚款","处上一年年收入百分之一百的罚款"],"answer":"B","why":"主要负责人未履行职责导致较大事故的，处上一年年收入百分之六十的罚款。比例口诀：一般事故40%、较大60%、重大80%、特别重大100%，本题较大事故对应60%，选B。"},{"type":"单选","stem":"生产经营单位的其他负责人和安全生产管理人员未履行《安全生产法》规定的安全生产管理职责,尚未构成犯罪的,可能受到的处罚是（　）","options":["批评教育","贵令限期改正并处罚款","暂停或者吊销其安全生产有关的资格","处上一年年收入百分之二十以上百分之五十以下的罚款"],"answer":"B","why":"其他负责人和安管人员未履职的，责令限期改正并处一万元以上三万元以下罚款。暂停或吊销资格、处年收入20%～50%罚款是“导致发生生产安全事故”后的加重责任，本题未构成犯罪，适用基础处罚。"},{"type":"多选","stem":"生产经营单位的其他负责人和安全生产管理人员未履行《安全生产法》规定的安全生产管理职贵,构成犯罪的,可能受到的处罚有 （　）","options":["罚款","限期改正","批评教育","追究刑事责任","暂停或撤销其与安全生产有关的资格"],"answer":"ADE","why":"未履职构成犯罪的，依照刑法追究刑事责任，同时可处罚款，并暂停或者撤销其与安全生产有关的资格。B限期改正、C批评教育是行政层面的轻措施，与“构成犯罪”情形不匹配，故选ADE。"},{"type":"单选","stem":"依据《安全生产法》,生产经营单位与从业人员订立协议,免除或者减轻其对从业人员因生产安全事故伤亡依法应承担的责任的,该协议无效对生产经营单位（　）","options":["责令停止生产","责令停产整顿","降低资质等级","主要负责人予以罚款"],"answer":"D","why":"与从业人员订立免责减责“生死协议”的，协议无效，并对生产经营单位的主要负责人、个人经营的投资人处二万元以上十万元以下罚款。A、B、C均不是该违法行为的法定责任形式。"},{"type":"单选","stem":"某公司与临时招聘的农民工订立书面协议,施工过程中如出现个人违章而导致生产安全伤亡事故,一切责任后果均由个人自负,与公司无关。对于该协议说法错误的 （　）。","options":["该协议是双方意愿的体现,双方都应严格遵守","该协议违反了《安全生产法》,该约定无效","应急管理部门可以对该公司的主要负责人处二万元以上十万元以下的罚款","生产经营单位不得以任何形式与从业人员订立协议,免除或者减轻其对从业人员因生产安全事故伤亡依法应承担的责任的"],"answer":"A","why":"本题选错误项A：“伤亡自负”条款违反《安全生产法》强制性规定，属无效协议，不受法律保护，谈不上双方严格遵守。依据法条，应急管理部门可对主要负责人处2万～10万元罚款，C、D表述正确。"},{"type":"单选","stem":"依据《安全生产法》,高危行业、领域的生产经营单位未按照国家规定投保安全生产责任保险的,可能承担的法律责任是（　）。","options":["责令停止生产","责令停产整顿","责令限期改正并处以罚款","追究刑事责任"],"answer":"C","why":"高危行业、领域单位未按国家规定投保安责险的，责令限期改正，处五万元以上十万元以下罚款；逾期未改正的，责令停产停业整顿，并处十万元以上二十万元以下罚款。基础责任是限期改正并罚款。"},{"type":"多选","stem":"下列情形中可以对生产经营单位予以关闭处罚的有（　）","options":["经停产停业整顿,仍不具备法律、行政法规和国家标准或者行业标准规定的安全生产条件的","存在重大事故隐患,一年内三次受到《安全生产法》规定的行政处罚","存在重大事故隐患,一百八十日内二次受到《安全生产法》规定的行政处罚","拒不执行负有安全生产监督管理职责的部门作出的停产停业整顿决定的","不具备法律、行政法规和国家标准或者行业标准规定的安全生产条件,导致发生重大、特别重大生产安全事故的"],"answer":"ADE","why":"可予关闭的情形：经停产停业整顿仍不具备安全生产条件；不具备安全条件导致重大、特别重大事故；拒不执行停产停业整顿决定。B、C数字错误，法定门槛是一百八十日内三次、一年内四次受到行政处罚。"},{"type":"单选","stem":"某事故导致一人死亡,依据事故等级情况,安监部门可以对事故发生单位处以 （　）罚款。","options":["200 万元以上、1000 万元以下","10 万元以上、20 万元以下","30 万元以上、100 万元以下","100 万元以上、200 万元以下"],"answer":"C","why":"死亡一人属一般事故，依据现行《安全生产法》对负有责任的事故发生单位处三十万元以上一百万元以下罚款（选C）。罚款档次联动记忆：一般30万～100万、较大100万～200万、重大200万～1000万、特别重大1000万～2000万；B的10万～20万是2007年旧条例口径，别混用。"},{"type":"单选","stem":"某事故导致三人死亡,该起事故中施工企业可能被处于 （　）罚款","options":["10-20 万元","30-100 万元","100-200 万元","200-1000 万元"],"answer":"C","why":"死亡三人达到较大事故标准（三至十人死亡），对负有责任的施工企业处一百万元以上二百万元以下罚款。A对应一般事故、D对应重大事故档次，事故等级判断错则罚款档次必错。"},{"type":"单选","stem":"依据《安全生产法》,应急管理部门对发生生产安全事故且负有责任的生产经营单位处以罚款的最高限额是 （　）。","options":["一千万元","二千万元","四千万元","一亿元"],"answer":"D","why":"特别重大事故对责任单位处一千万元以上二千万元以下罚款；情节特别严重、影响特别恶劣的，可按罚款数额的二倍以上五倍以下处以罚款，故最高限额为二千万元的五倍，即一亿元。"},{"type":"单选","stem":"生产经营单位发生生产安全事故造成人员伤亡、他人财产损失的,应当依法承担赔偿责任,拒不承担或者其负责人逃匿的,由 （　）依法强制执行。","options":["应急管理部门","公安机关","劳动行政主管部门","人民法院"],"answer":"D","why":"事故赔偿责任属民事责任，单位拒不承担或其负责人逃匿的，由人民法院依法强制执行。强制执行权专属于审判机关，应急、公安、劳动部门均无权直接强制划拨单位财产。"},{"type":"单选","stem":"关于建筑施工企业编制施工组织设计的要求,下列说法正确的是（　）","options":["可以用公司的安全计划来代替项目施工组织设计中的安全计划","对专业性较强的工程项目,如果规模较小,可以只编写施工方案","对专业性较强的工程项目,应当编制专项安全施工组织设计,并采取安全技术措施","所有的工程项目,都必须编制专项安全施工组织设计,并采取安全技术措施"],"answer":"C","why":"依据《建设工程安全生产管理条例》，对专业性较强的工程项目应当编制专项安全施工组织设计，并采取安全技术措施。A以公司计划代替、B以规模小为由免编均错误，D“所有工程”扩大了适用范围。"},{"type":"单选","stem":"依据《建筑法》规定,对专业性较强的工程项目,应当编制（　）,并采取安全技术措施。","options":["专项安全施工组织设计","专项应急预案","适宜的安全管理制度","专项安全资金预算"],"answer":"A","why":"《建筑法》规定，对专业性较强的工程项目，应当编制专项安全施工组织设计并采取安全技术措施。应急预案、管理制度、资金预算均不是该条款要求的编制对象。"},{"type":"多选","stem":"建筑施工企业应当在施工现场采取 （　）等措施,有条件的,应当对施工现场实行封闭管理。","options":["维护安全","防范危险","预防火灾","警民联动","以包代管"],"answer":"ABC","why":"依据《建筑法》，建筑施工企业应当在施工现场采取维护安全、防范危险、预防火灾等措施；有条件的，应当对施工现场实行封闭管理。D、E均非法定措施，“以包代管”更是安全管理的大忌。"},{"type":"单选","stem":"建筑施工企业必须依法加强对建筑安全生产的管理,执行安全生产责任制。实行施工总承包的建筑工程,施工现场安全由 （　）负责。","options":["建设单位","总承包单位","监理单位","相应的分包单位"],"answer":"B","why":"实行施工总承包的，施工现场安全由总承包单位负责，总包对现场安全负总责。分包单位只对分包范围内的安全负责并服从总包管理，建设单位、监理单位均不承担现场安全的总责。"},{"type":"单选","stem":"关于施工现场的安全管理,下列说法错误的是 （　）","options":["实行施工总承包的,由总承包单位负责","分包单位向总承包单位负责","分包单位向建设单位负责","分包单位应服从总承包单位的安全生产管理"],"answer":"C","why":"本题选错误项C：分包单位只向总承包单位负责，不直接向建设单位负责。A、B、D均为正确表述：总包对施工现场安全总负责，分包对其分包工程的安全负责并服从总包的安全生产管理。"},{"type":"单选","stem":"建筑法规定,施工企业必须按照工程设计图纸和施工技术标准施工,不得偷工减料。如施工单位发现工程设计不合理需要修改的,应由（　）负责修改。","options":["施工单位","原设计单位","建设单位","总包单位"],"answer":"B","why":"施工单位必须按照工程设计图纸和施工技术标准施工，不得擅自修改设计。发现设计不合理应通过建设单位提出，由原设计单位负责修改设计，施工单位、建设单位、总包单位均无设计修改权。"},{"type":"单选","stem":"建筑施工企业违反《建筑法》规定,对建筑安全事故隐患不采取措施予以消除,情节一般的,可对其（　）","options":["责令停业整顿","降低资质等级或者吊销资质证书","追究刑事责任","责令改正,可以处以罚款"],"answer":"D","why":"违反《建筑法》，对建筑安全事故隐患不采取措施消除且情节一般的，责令改正，可以处以罚款；情节严重的才责令停业整顿、降低资质等级或吊销资质证书。注意“情节一般”对应最轻的处罚档次。"},{"type":"单选","stem":"在施工过程中,施工人员发现设计图纸不符合技术标准,施工单位技术负责人采取的正确做法（　）","options":["继续按照工程设计图纸施工","按照技术标准修改工程设计","追究设计单位违法责任","及时提出意见和建议"],"answer":"D","why":"发现图纸不符合技术标准，施工单位应当及时提出意见和建议，通过建设单位交原设计单位处理；无权自行修改设计，也不能明知违规仍照图施工，更无权直接追究设计单位责任。"},{"type":"单选","stem":"《中华人民共和国消防法》规定,对建筑消防设施每年至少进行（　）次全面检测,确保完好有效。","options":["一","二","三","四"],"answer":"A","why":"《消防法》规定，对建筑消防设施每年至少进行一次全面检测，确保完好有效，检测记录应当完整准确并存档备查。“至少一次”是底线数字，二、三、四次均为干扰。"},{"type":"单选","stem":"施工现场应当制定的消防安全管理制度不包括（　）等。","options":["社区联防制度","用火用电作业及使用易燃易爆危险物品的管理制度","消防设施维护保养制度","消防安全检查制度"],"answer":"A","why":"施工现场消防安全制度包括用火用电作业及易燃易爆危险品管理制度、消防设施器材维护保养制度、消防安全检查制度等。社区联防属于社区治安范畴，与施工现场内部消防管理无关。"},{"type":"单选","stem":"《消防法》规定,进行（　）等具有火灾危险的作业人员和自动消系统的操作人员,必须持证上岗,并严格遵守消防安全操作规程。","options":["木工","电焊","油漆","防水"],"answer":"B","why":"进行电焊等具有火灾危险的作业人员和自动消防系统的操作人员，必须持证上岗并严格遵守消防安全操作规程。木工、油漆、防水工种不在该强制持证的列举之内。"},{"type":"单选","stem":"《中华人民共和国消防法》规定,消防产品必须符合（　）","options":["地方标准","国际标准","国家标准","社团标准"],"answer":"C","why":"消防产品必须符合国家标准；没有国家标准的，必须符合行业标准。题干问一般性要求，故选国家标准；地方标准、社团标准、国际标准均不能作为消防产品的合格判定依据。"},{"type":"多选","stem":"依法实行强制性产品认证的消防产品,由具有法定资质的认证机构按照国家标准、行业标准的强制性要求认证合格后,方可 （　）。","options":["设计","生产","销售","使用","销毁"],"answer":"BCD","why":"依法实行强制性产品认证的消防产品，由具有法定资质的认证机构按国家标准、行业标准的强制性要求认证合格后，方可生产、销售、使用。设计、销毁不属于认证后的市场准入环节，故选BCD。"},{"type":"单选","stem":"《消防法》规定了建筑构件和建筑材料的（　）必须符合国家标或行业标准。","options":["保湿性能","力学性能","防火性能","防水性能"],"answer":"C","why":"《消防法》规定，建筑构件、建筑材料和室内装修、装饰材料的防火性能必须符合国家标准或行业标准。保湿、力学、防水性能均非该条款规定的性能指标，考点锁定“防火性能”。"},{"type":"判断","stem":"没有国家防火性能标准的建筑构件、建筑材料和室内装修、装饰术料,防火性能必须符合行业标准。 （　）","options":[],"answer":"对","why":"正确。防火性能实行“国标优先、行标递补”规则：没有国家标准的，建筑构件、建筑材料和室内装修装饰材料的防火性能必须符合行业标准，题干表述与法条一致。"},{"type":"单选","stem":"施工企业拒不执行公安机关消防机构作出的停止施工处罚决定由（　）负责强制执行。","options":["公安机关","作出决定的部门或者机构","人民法院","安监部门"],"answer":"B","why":"依据《消防法》，当事人逾期不执行停止施工等处罚决定的，由作出决定的部门或者机构强制执行。人民法院的强制执行主要针对金钱给付义务，本题是对行为的处罚执行，主体是作出决定的机构。"},{"type":"单选","stem":"在道路上施工作作业时,施工单位应当在经批准的路段和时间内施工作业,并在距离施工地点（　）方向安全更离处设置安全警示标志","options":["四周","会车","背离","来车"],"answer":"D","why":"依据《道路交通安全法》，占道施工应在批准的路段和时间内进行，并在距离施工地点来车方向安全距离处设置明显的安全警示标志，提前警示来车避让。四周、会车、背离均不符合“来车方向”的法定要求。"},{"type":"多选","stem":"未经批准,擅自挖据道路、占用道路施工影响道路下通安全活动的,停止违法行为。可以由（　）责令停止违法行为。","options":["应急管理部门","公安机关交通管理部门","市政监管部门","城市综合管理部门","道路主管部门"],"answer":"BE","why":"依据《道路交通安全法》，擅自挖掘、占用道路施工影响交通安全的，由道路主管部门责令停止违法行为并恢复原状；公安机关交通管理部门也可责令停止违法行为、迅速消除隐患，故选BE，其余部门非法定主体。"},{"type":"单选","stem":"未经批准,擅自挖掘道路、占用道路施工影响交通安全活动的,由道路主管部门责令停止违法行为,并恢复原状,并可以依法给予责任单位或人员（　）处罚。","options":["罚款","警告","记过","停业整顿"],"answer":"A","why":"道路主管部门对擅自挖掘、占用道路施工的，可责令停止违法行为、恢复原状，并依法给予罚款处罚。记过属内部行政处分，警告太轻，停业整顿不属于该条款规定的处罚种类。"},{"type":"多选","stem":"用人单位由于生产经营需要,经与（　）协商后可适长工作时间。","options":["所在部门领导","人力资源部","工会","现场管理人","劳动者本人"],"answer":"CE","why":"《劳动法》规定，用人单位由于生产经营需要，经与工会和劳动者协商后可以延长工作时间，一般每日不得超过一小时。部门领导、人力资源部、现场管理员均非法定协商对象，必须与工会和劳动者本人协商。"},{"type":"单选","stem":"正常情况下,用人单位因特珠原因需要加班的,在保障劳动者身体健康的条件下超长工作时间每日不得超过（　）小时","options":["1","2","3","4"],"answer":"C","why":"依据《劳动法》，加班时长三档记法：一般每日不超过1小时；特殊原因在保障劳动者身体健康的条件下每日不超过3小时；每月总计不超过36小时。口诀「一、三、三十六」。B的2小时是凑数干扰项；原题库只给了2/3/4且答案标成4小时，已订正为3小时。"},{"type":"单选","stem":"某企业因赶工安排职工周末加班且无法安全补休,依据《劳动法》规定该企业应支付加斑职工不低于工资的（　） 的工资报酬。","options":["100%","150%","200%","300%"],"answer":"C","why":"休息日安排工作又不能安排补休的，支付不低于工资200%的工资报酬。150%对应工作日延时加班，300%对应法定休假日加班，三档比例务必对应清楚，本题周末加班不能补休对应200%。"},{"type":"单选","stem":"《劳动法》规定,用人单位必须建立健全劳动安全卫生制度,产格力安全卫生教育卫生规程和标准,对劳动者进行安全卫生教育,防止劳动过程中的事故,减少（　）","options":["人身伤害","职业危售","财产损失","经济损失"],"answer":"B","why":"《劳动法》规定，用人单位必须建立健全部劳动安全卫生制度，严格执行劳动安全卫生规程和标准，对劳动者进行安全卫生教育，防止劳动过程中的事故，减少职业危害，“职业危害”是法定表述。"},{"type":"单选","stem":"《劳动法》规定,用人单位必须对从事有职业危遇作业的劳动者定期进行（　）","options":["专门培训","健康检查","安全教育","资格复审"],"answer":"B","why":"《劳动法》规定，用人单位必须对从事有职业危害作业的劳动者定期进行健康检查，并建立职业健康监护档案。专门培训、安全教育、资格复审都不是该条款的法定要求，考点锁定“健康检查”。"},{"type":"单选","stem":"在劳动安全卫生方面,下列用人单位的做法中错误的是 （　）","options":["用人单位补习建立、健全劳动安全卫生制度","对劳动者进行劳动安全卫生教育,防止劳动过程中的事故,减少职业危害","用人单位必须为劳动者提供符合国家规定的劳动安全卫生条件和必要的劳动防护用品。","对从事有职业危害作业的劳动者应当在结束劳动合同时进行健康检查,合同期间再进行一次健康检查。"],"answer":"D","why":"本题选错误项D：对从事有职业危害作业的劳动者应当定期进行健康检查，而非只在劳动合同结束时检查一次，离职体检只是职业健康检查的一环。A、B、C均为用人单位的法定义务。"},{"type":"多选","stem":"依据《劳动法》规定,用人单位必须对劳动者履行的义务包括（　）","options":["提供晋升机会","提供劳动安全卫生条件","提供意外伤害保险","不得延长劳动时间","提供必要的劳动防护用品。"],"answer":"BE","why":"用人单位的法定义务包括提供符合国家规定的劳动安全卫生条件和必要的劳动防护用品。晋升机会、意外伤害保险、“不得延长劳动时间”（可依法延长）均不是其法定义务，故选BE。"},{"type":"多选","stem":"《劳动法》规定,国家对其实行特殊劳动保护的有（　）","options":["学生","女职工","老人","未成年工","儿童"],"answer":"BD","why":"《劳动法》对女职工和未成年工实行特殊劳动保护。未成年工指年满十六周岁未满十八周岁的劳动者；学生、老人、儿童不是劳动法意义上的特殊劳动保护对象，故选BD。"},{"type":"单选","stem":"根据《劳动法》规定,国家对女职工和未成年工实行特殊劳动保护,下列做法合法的是（　）","options":["安排女职工从事矿山井下劳动","安排女职工在经期从事高处作业","安排怀孕 8 个月的女职工加班","安排未成年工定期进行健康检查"],"answer":"D","why":"合法做法是D：安排未成年工定期进行健康检查。禁止安排女职工从事矿山井下等禁忌劳动，禁止安排经期女职工从事高处、低温、冷水作业，怀孕七个月以上的女职工不得安排加班和夜班。"},{"type":"多选","stem":"根据《劳动法》规定,用人单位应当对其定期进行健康检查的人员（　）","options":["未成年工","专职安全员","从事有职业危害作业的劳动者","女职工","业务骨干"],"answer":"AC","why":"法定应定期健康检查的仅两类人：未成年工和从事有职业危害作业的劳动者。专职安全员、女职工、业务骨干均不属于强制定期体检范围，记住“未成年工＋职业危害作业”两类即可。"},{"type":"单选","stem":"关于劳动合同与劳动关系说法以下正确的是（　）","options":["建立劳动关系就应当订立书面劳动合同","提交工伤申请时应当提供劳动合同","双方劳动关系在劳动合同签订时确立","先工作后签合同的最迟不超过 1 个月"],"answer":"A","why":"依据《劳动合同法》，建立劳动关系应当订立书面劳动合同，A正确。劳动关系自用工之日起建立而非合同签订时，C错；申请工伤可凭工资支付记录、考勤等证明劳动关系，不以劳动合同为前提。"},{"type":"单选","stem":"在生产、作业中违反有关安全管理的规定,因而发生重大伤亡事故者造成其他严重后果的,属 （　）。","options":["重大责任事故罪","重大劳动安全事故罪","强今违章冒险罪","工程重大安全事犯罪"],"answer":"A","why":"在生产、作业中违反有关安全管理的规定，因而发生重大伤亡事故或者造成其他严重后果的，构成重大责任事故罪。B的主体是安全设施、条件不符合规定的责任人员，C须有强令行为，D针对降低工程质量的建设各方。"},{"type":"单选","stem":"施工单位的现场负责人违反有关安全管理的规定,发生了事故,现场责人可能遭受（　）的刑事处罚。","options":["3 年以下","5 年以下","3-7 年","5 年以上"],"answer":"A","why":"依据《刑法》重大责任事故罪：在生产作业中违反安全管理规定，因而发生重大伤亡事故的，处三年以下有期徒刑或者拘役；情节特别恶劣的，处三年以上七年以下有期徒刑。题目问基本情形，选「3 年以下」。记忆：基本档3年以下，恶劣档3-7年。"},{"type":"单选","stem":"在生产、作业中强令他人违章冒险作业,因而发生重大伤亡事故或者造成其他严重后果的,处（　） 年以下有期徒刑或者拘役","options":["一","三","五","七"],"answer":"C","why":"强令、组织他人违章冒险作业，因而发生重大伤亡事故或者造成其他严重后果的，处五年以下有期徒刑或者拘役；情节特别恶劣的，处五年以上有期徒刑。基础刑档是五年以下，而非一年、三年、七年。"},{"type":"多选","stem":"依据《中华人民共和国刑法修正案(十一)》,下列行为中可能构成“危险作业罪”的有 （　）","options":["篡改、隐瞒、销毁直接关系生产安全的监控相关数据、信息的","未经依法批准或者许可,擅自从事交通运输的","涉及安全生产的事项未经依法批准,擅自从事建筑施工的","未经依法批准或者许可,擅自从事危险物品生产、经营、储存等高度危险的生产作业活动的","因存在重大事故隐患被依法责令立即采取排除危险的整改措施拒不执行的"],"answer":"ACDE","why":"依据《刑法修正案（十一）》，危险作业罪包括：篡改、隐瞒、销毁直接关系生产安全的监控等相关数据信息；存在重大事故隐患被责令整改而拒不执行；未经批准擅自从事建筑施工以及危险物品生产、经营、储存等高度危险作业。B交通运输不在列举范围。"},{"type":"单选","stem":"在施工过程中,某施工企业的安全生产条件不符合国家规定,致使多人重伤、死亡,那么该事故责任人可能构成（　）","options":["重大责任事故罪","重大劳动安全事故罪","强令、组织他人违章冒险作业罪","工程重大安全事故罪"],"answer":"B","why":"安全生产设施或者安全生产条件不符合国家规定，因而发生重大伤亡事故的，构成重大劳动安全事故罪，追究直接负责的主管人员和其他直接责任人员。A针对作业中违章行为，C须有强令行为，D针对降低工程质量。"},{"type":"单选","stem":"某施工单位为降低造价,在施工中偷工减料,故意使用不合格建筑材料、构配件和设备,降低工程质量,导致建筑工程坍塌,致多人重伤、死亡该施工单位的行为构成（　）","options":["重大劳动安全事故罪","强令冒险作业罪","重大责任事故罪","工程重大安全事故罪"],"answer":"D","why":"建设单位、设计单位、施工单位、工程监理单位违反国家规定，降低工程质量标准，造成重大安全事故的，构成工程重大安全事故罪。偷工减料、故意使用不合格建材、降低工程质量是其典型行为特征，故选D。"},{"type":"单选","stem":"某施工企业施工中偷工减料,降低工程质标准,造成但尚未达到后果特别严重的程度。事故处理应追究直除了罚金还应该处（　）有期徒刑。","options":["1 年以上 3 年以下","5 年以下","3 年以上 5 年以下","5 年以上"],"answer":"B","why":"工程重大安全事故罪对直接责任人员处五年以下有期徒刑或者拘役，并处罚金；后果特别严重的，处五年以上十年以下有期徒刑。本题后果尚未达到特别严重，对应五年以下档，除罚金外处五年以下有期徒刑。"}]},{"file":"02第二章","title":"第二章","count":64,"questions":[{"type":"单选","stem":"《建设工程安全生产管理条例》所称的建设工程,不包括（　）","options":["土木建筑工程","线路管道工程","设备安装工程","园林绿化工程"],"answer":"D","why":"依据《建设工程安全生产管理条例》，建设工程指土木工程、建筑工程、线路管道和设备安装工程及装修工程；园林绿化工程不属其范围，土木、线路管道、设备安装三项均在列。"},{"type":"多选","stem":"根据《建设工程安全生产管理条例》规定,建设工程,是指（　）","options":["土木工程","软件开发工程","线路管道工程","设备安装工程","装修工程"],"answer":"ACDE","why":"条例界定建设工程为土木工程、线路管道工程、设备安装工程和装修工程四类；软件开发工程属信息化项目，不是条例所称建设工程，勿被“工程”二字误导。"},{"type":"多选","stem":"建设单位应当向施工单位提供施工现场及毗邻区域内的有关资料包括（　） 。","options":["地下管线资料","气象水文资料","相邻建筑物资料","地下工程资料","运输保障资料"],"answer":"ABCD","why":"依据条例，建设单位应向施工单位提供施工现场及毗邻区域内的地下管线、气象和水文观测、相邻建筑物构筑物、地下工程等资料，并保证真实、准确、完整；运输保障资料不属法定提供范围。"},{"type":"单选","stem":"建设单位在编制工程（　）时。应当确定建设工程安全作业环境及安全施工措施所需费用。","options":["概算","预算","结算","决算"],"answer":"A","why":"条例规定建设单位在编制工程概算时就应确定安全作业环境及安全施工措施所需费用，从投资源头保障安全投入；概算在前、预算在后，结算决算更靠后，法定时点是概算。"},{"type":"单选","stem":"关于建设单位安全责任的说法,错误的是（　）。","options":["建设单位应当向施工单位提供地下管线资料,并对资料的真实性、正确性、完整性负责。","建设单位应当依法履行合同,不得压缩合同约定的工期。","建设单位应当进行安全施工技术交底。","建设单位应当对拆除工程进行备案。"],"answer":"C","why":"安全施工技术交底是施工单位的职责，由施工前项目技术负责人向作业班组作出；提供真实管线资料、不压缩约定工期、拆除工程备案才是建设单位义务，C项张冠李戴。"},{"type":"单选","stem":"《建设工程安全生产管理条例》规定,设计单位应当考虑施工安全操作和防护的需要,对涉及施工安全的（　）在设计文件中注明,并对防范生产安全事故提出指导意见。","options":["重点部位和环节","所有危险、有害因素","关键与特殊过程","项目安全设施的搭建"],"answer":"A","why":"设计单位应考虑施工安全操作和防护需要，对涉及施工安全的重点部位和环节在设计文件中注明，并对防范事故提出指导意见；“所有危险有害因素”范围过宽，法定要求只针对重点部位环节。"},{"type":"多选","stem":"设计单位的安全责任包括 （　）","options":["按照法律、法规和工程建设强制性标准进行设计","提出防范安全生产事故的指导意见和措施建议","对安全技术措施或专项施工方案进行审查","依法对施工安全事故隐患进行处理","对设计成果"],"answer":"ABE","why":"设计单位安全责任是依法依强制性标准设计、注明重点部位并提防范建议、对设计成果负责，对应ABE；审查专项施工方案、处理事故隐患是监理单位的职责，混到设计单位即错。"},{"type":"多选","stem":"下列责任中,属于设计单位安全责任的有（　）。","options":["对涉及施工安全的重点部位和环节在设计文件中注明,并对防范生产安全事故提出指导意见","发现存在安全事故隐患的,应当要求施工单位整改","审查专项施工方案是否符合工程建设强制性标准","对涉及施工安全的重点部位和环节在设计文件中注明,并对防范生产安全事故提出指导意见","采用新结构新材料。新工艺的时,应当在设计中提出保障施工作业人员安全和预防生产安全事故的措施建议。"],"answer":"ADE","why":"设计单位的责任集中在“注明＋建议”：注明涉及施工安全的重点部位环节、提出防范事故指导意见，采用新结构新材料新工艺时提出保障作业人员安全的措施建议；要求整改、审查专项方案属监理职责。"},{"type":"多选","stem":"为防止因设计合理导致生产安全事故的发生,设计单位应做到以下几点（　）。","options":["注明涉及施工安全的重点部位和环节","安全风险","提出保障施工作业人员安全的措施建议","提出预防生产安全事故的措施建议","全额列出工程警示标志费用"],"answer":"ACD","why":"为防止因设计不合理引发事故，设计应注明施工安全重点部位环节，并提出保障作业人员安全和预防事故的措施建议，对应ACD；列支警示标志费用属造价内容，“安全风险”表述不是具体措施。"},{"type":"单选","stem":"《建设工程安全生产管理条例》规定,（　）应当审查施工组织设计中的安全技术措施或者专项施工方案是否符合工程建设强制性标准。","options":["应急管理部门","勘察单位","设计单位","监理单位"],"answer":"D","why":"依据条例，审查施工组织设计中安全技术措施或专项施工方案是否符合工程建设强制性标准是工程监理单位的法定职责；勘察、设计单位无此义务，应急管理部门是行政监管方。"},{"type":"单选","stem":"《建设工程安全生产管理条例》规定,（　）应当审查施工组织设计中的安全技术措施或者专项施工方案是否符合工程建设强制性标准。","options":["工程概算要求","工程建设强制性标准","工艺方案要求","监理规划要求"],"answer":"B","why":"监理审查安全技术措施和专项施工方案的对照基准是工程建设强制性标准，属国家强制性技术要求；概算、工艺方案、监理规划均不是判定合格与否的依据。"},{"type":"单选","stem":"监理单位在实施通信工程项目监理过程中,发现存在一般安全事故隐患,应当（　）。","options":["要求暂时停止施工","要求进行现场整改","及时向建设单位报告","向有关主管部门报告"],"answer":"B","why":"隐患处置分级递进：一般隐患要求施工单位整改；情况严重的才要求暂停施工并报告建设单位。本题是一般隐患，故应要求现场整改，直接上报主管部门是最后手段。"},{"type":"单选","stem":"工程监理单位在实施监理过程中,发现存在安全事故隐患,情况严重的,应当要求施工单位暂时停止施工,并及时报告建设单位,施工单位拒不整改或者不停止施工的,工程监理单位应当及时向（　）报告。","options":["设计单位","总包单位","当地公安部门","有关主管部门"],"answer":"D","why":"严重隐患的处理链条：要求暂停施工、报告建设单位，施工单位拒不整改或不停止施工的，及时向有关主管部门报告；报告对象是建设主管部门，不是公安或总包单位。"},{"type":"单选","stem":"根据《建设工程安全生产管理条例》,出租单位在签订机械设备租赁合同时,应出具（　）","options":["购货发票","检测合格证明","产品使用说明书","相应的图片"],"answer":"B","why":"依据条例，出租机械设备应在签订租赁协议时出具检测合格证明，证明设备安全性能合格可用；发票只证明购买，说明书只介绍使用，都不能替代检测合格证明。"},{"type":"单选","stem":"施工单位从事建设工程的新建、扩建、改建和拆除等活动,应当具备国家规定的注册资本、专业技术人员、技术装备和安全生产等条件,依法取得相应等级的资质证书,并在其（　）许可的范围内承揽工程。","options":["营业执照","技术能力","资质等级","注册资本"],"answer":"C","why":"施工单位从事新建、扩建、改建和拆除活动，须具备注册资本、专业技术人员、技术装备和安全生产等条件，取得相应等级资质证书，并在资质等级许可范围内承揽工程；营业执照不能替代资质约束。"},{"type":"单选","stem":"《建设工程安全生产管理条例》规定,施工单位的项目负责人应当由（　）的人员担任。","options":["建设单位认可","取得相应执业资格","取得安全员 C 证","注册安全工程师"],"answer":"B","why":"项目负责人应由取得相应执业资格的人员担任，这是法定任职资格；安全员C证是专职安全员的证件，注册安全工程师是另一执业序列，均不等于项目负责人的执业资格。"},{"type":"单选","stem":"某通信施工公司承接了总包单位分包的施工任务发生了事故,该起事故的“事故发生单位”应当是（　）。","options":["电信运营商","监理公司","总包单位","某通信施工公司"],"answer":"C","why":"实行施工总承包的，施工现场安全由总承包单位负总责，事故认定中的“事故发生单位”应为总包单位，由其对事故报告和救援负总责；分包公司是具体作业方，运营商和监理不是施工主体。"},{"type":"单选","stem":"关于工程项目的总包与分包,说法错误的是(","options":[")A 总承包单位可以将全部工程量分包给分包单位,双方应签订分包合同","分包合同中应当明确各自的安全生产方面的权力、义务","总包单位和分包单位对分包工程的安全生产承担连带责任","分包单位不服从总包单位管理而导致生产安全事故的,分包单位承担主要责任"],"answer":"A","why":"错误的是A：总承包单位不得将全部工程量分包给他人，主体结构施工必须自行完成，全部转分包属违法转包；分包合同明确安全权责、双方连带责任、分包不服从管理自担主责均为正确规定。"},{"type":"单选","stem":"专项施工方案应由（　）审核签字、加盖单位公章,并由总监理工程师审查签字后实施,由专职安全生产管理人员进行现场监督。","options":["施工单位项目技术负责人和现场监理工程师","施工单位负责人和建设单位负责人","建设单位负责人和总监理工程师","施工单位技术负责人和总监理工程师"],"answer":"D","why":"依据《危险性较大的分部分项工程安全管理规定》：专项施工方案应当由施工单位技术负责人审核签字并加盖单位公章，总监理工程师审查签字后实施；项目专职安全生产管理人员对方案实施情况进行现场监督。口诀「施工技术负责人+总监，双签才能干，专职安全员盯现场」。题库原题干漏了「总监审查」半句且答案键残缺，已订正。"},{"type":"多选","stem":"专项施王方案应由（　）签字后实施,由专职安全生产管理人员进行现场监督。","options":["施工单位项目现场作业队长","施工单位技术负责人","施工单位专职安全管理人员","总监理工程师","建设单位项目负责人"],"answer":"BD","why":"专项施工方案应由施工单位技术负责人和总监理工程师签字后实施，由专职安全生产管理人员现场监督落实；作业队长、安全员本人、建设单位负责人都不是法定签字人。"},{"type":"单选","stem":"下列分部分项工程中,不需要编制专项施工方案的是（　）。","options":["起重吊装工程","模板工程","砌筑工程","拆除、爆破工程"],"answer":"C","why":"起重吊装、模板、拆除与爆破工程均属危险性较大工程，必须编制专项施工方案；砌筑工程工艺常规、风险可控，不在法定必须编制专项方案之列。"},{"type":"单选","stem":"建设工程施工前,（　）应当对有关安全施工的技术要求向施工作业班组、作业人员作出详细说明。","options":["施工单位项目负责人","项目技术负责人","施工单位专职安全管理人员","建设单位项目负责人"],"answer":"B","why":"建设工程施工前，施工单位项目技术负责人应对有关安全施工的技术要求向施工作业班组、作业人员作出详细说明并双方签字确认，即安全技术交底；交底主体是技术负责人而非安全员。"},{"type":"单选","stem":"由于建设单位采购的主设备未到货,施工现场暂时停止施工的,施工单位应当做好现场防护,所费用由（　）承担,或者按照合同约定执行。","options":["设计单位","施工单位","停工令下达单位","建设单位"],"answer":"D","why":"停工期间的防护费用按责任承担：因建设单位原因（主设备未到货）停工的，费用由建设单位承担或按合同约定执行；施工单位无过错不担费用，与停工令由谁下达无关。"},{"type":"单选","stem":"施工现场临时搭建的建筑物应当符合安全使用要求,施工现场使用的装配式活动房屋应当具有（　）","options":["生产许可证","出厂证明","检测报告","产品合格证"],"answer":"D","why":"施工现场临时搭建的建筑物应符合安全使用要求，使用的装配式活动房屋应当具有产品合格证，证明其结构安全可靠；生产许可证、出厂证明、检测报告都不是条例规定的使用凭证。"},{"type":"单选","stem":"《建设工程安全生产管理条例》规定,施工单位因建设工程施工可能造成损害的毗邻建筑物、构筑物和地下管线等,应当采取（　）措施。","options":["专项保护","公告方式告知产权单位","选用专业熟练工","采取通用防护"],"answer":"A","why":"依据《建设工程安全生产管理条例》：施工可能造成损害的毗邻建筑物、构筑物和地下管线等，应当实行专项保护——量身定制保护方案并监测变形；公告告知产权单位只是告知义务，「通用防护」不满足「专项」法定要求，专业熟练工与防护无关。"},{"type":"判断","stem":"在城市市区内的建设工程,施工单位应当对施工现场实行封闭围挡。（　）","options":[],"answer":"对","why":"依据条例，在城市市区内的建设工程，施工单位应当对施工现场实行封闭围挡，隔离施工区域与公共环境，防止无关人员进入受伤，该说法正确。"},{"type":"多选","stem":"《建设工程安全生产管理条例》规定,施工单位应当在施工现场建立消防安全责任制度,可采取的措施有（　）。","options":["确定消防安全责任人","制定用火用电、使用易燃易爆材料等各项消防安全管理制度和操作规程","设置消防通道、消防水源","配备消防设施和灭火器材","在施工现场设置明显标志"],"answer":"ABCD","why":"施工现场消防安全制度包括：确定消防安全责任人，制定用火用电和易燃易爆材料管理制度及操作规程，设置消防通道、消防水源，配备消防设施和灭火器材；设明显标志属安全警示要求，不属消防措施。"},{"type":"单选","stem":"《建设工程安全生产管理条例》规定,施工单位应当向作业人员提供（　）,并书面告知危险岗位的操作规程和违章操作的危害。","options":["劳动保障用品","安全防护用具和安全防护服装","安全逃生用品","个人施工工具"],"answer":"B","why":"条例原文是提供“安全防护用具和安全防护服装”，并书面告知危险岗位操作规程和违章操作危害；劳动保障用品、逃生用品、施工工具均非法定表述。"},{"type":"判断","stem":"施工单位应当向作业人员提供安全防护用具和安全防护服装,并口告知危险岗位的操作规程和违章操作的危害。 （　）","options":[],"answer":"错","why":"法定要求是“书面告知”危险岗位操作规程和违章操作的危害，书面告知可留痕存档、便于检查追责；题干改为口头告知，降低了法定要求，故错误。"},{"type":"多选","stem":"为确保施工现场安全,施工作业人员在施工中应做到 （　）","options":["遵守安全施工的强制性标准","遵守规章制度和操作规程","听从现场管理人员的一切指挥","正确使用安全防护用具","有危及人身安全的情况时立即停止作业"],"answer":"ABD","why":"作业人员的法定义务是遵守强制性标准、规章制度和操作规程，正确使用安全防护用具；“听从一切指挥”错误，对违章指挥、强令冒险作业有权拒绝；紧急避险属权利而非日常作业义务。"},{"type":"判断","stem":"施工单位采购、租赁的安全防护用具、机械设备、施工机具及配件应当具有生产《制造) 许可证、产品合格证,并在进入施工现场后进行查验。 （　）","options":[],"answer":"错","why":"法定时序是进入施工现场“前”查验生产（制造）许可证、产品合格证，查验不合格的不得投入使用；题干改为进场“后”查验，把事前把关变成事后补查，故错误。"},{"type":"单选","stem":"《建设工程安全生产管理条例》规定,施工现场的安全防护用具、机械设备、施工机具及配件必须（　）,定期进行检查、维修和保养建立相应的资料档案,并按照国家有关规定及时报废。","options":["存放在封闭式库房","由专人管理","多人重点管理","集中统一管理"],"answer":"B","why":"安全防护用具、机械设备、施工机具及配件必须由专人管理，定期检查、维修、保养，建立资料档案并按国家规定及时报废；“专人管理”是法定要求，封闭库房、多人管理非法定表述。"},{"type":"多选","stem":"施工单位在使用承租的机械设备和施工机具及配件的,由同（　）共同进行验收。","options":["建设单位","施工总承包单位","分包单位","出租单位","安装单位"],"answer":"BCDE","why":"使用承租的机械设备和施工机具及配件，应当由施工总承包单位、分包单位、出租单位和安装单位共同验收合格后方可使用；共同验收各方不含建设单位。"},{"type":"单选","stem":"施工单位应当对管理人员和作业人员每年至少（　）进行安全教育培训。","options":["一次","二次","三次","四次"],"answer":"A","why":"依据条例，施工单位应当对管理人员和作业人员每年至少进行一次安全生产教育培训并考核合格，牢记“每年至少一次”的底线频次。"},{"type":"多选","stem":"关于建设工程安全生产教育培训的说法,正确的有 （　）","options":["施工单位的主要负责人、项目负责人、专职安全生产管理当经建设行政主管部门或者其他部门考核合格后方可任职","施工单位应当对管理人员和作业人员每两年至少进行一次安产教育培训","作业人员进入新的岗位前,应当接受安全生产教育培训","作业人员进入新的施工现场前,不需要接受生产教育培训","施工单位在采用新技术、新工艺、新设备、对从业人员进行相应的安全生产教育培训"],"answer":"ACE","why":"A对：三类人员须经考核合格方可任职；C对：进入新岗位前须培训；E对：采用新技术新工艺新设备新材料前须培训；B错在是“每年”而非“每两年”一次；D错在新施工现场前也必须培训。"},{"type":"单选","stem":"关于意外伤害保险的说法,正确的是 （　）","options":["意外伤害保险应给全体施工人员购买","由建设单位支付保险费","实行施工总承包的,由施工总承包单位支付保险费","保险期限自开工后 7 日起至竣工验收合格之日止"],"answer":"C","why":"依据条例，实行施工总承包的，意外伤害保险费由总承包单位支付；保险对象是现场从事危险作业的人员而非全体施工人员，保险期限自开工之日起至竣工验收合格止，“开工后7日起”属杜撰。"},{"type":"判断","stem":"建设行政主管部门或者其他有关部门可以将施工现场的监督检查委托给建设工程安全监督机构具体实施。（　）","options":[],"answer":"对","why":"依据条例，建设行政主管部门或者其他有关部门可以委托建设工程安全监督机构对施工现场安全实施具体监督检查，这是法定授权，说法正确。"},{"type":"单选","stem":"国家对严重危及施工安全的工艺、设备、材料实行 （　） 制度","options":["维修","监管","备案","淘汰"],"answer":"D","why":"国家对严重危及施工安全的工艺、设备、材料实行淘汰制度，公布淘汰目录限期淘汰；淘汰是根治隐患的唯一手段，维修、监管、备案都不能消除其固有危险性。"},{"type":"单选","stem":"根据《建设工程安全生产管理条例》,国家对严重危及施工安全的) 制定并公布。工艺、设备、材料实行淘汰制度,目录由 （　）","options":["国务院安全生产委员会","国务院建设行政主管部门会同国务院其他有关部门","省级以上人民政府建设行政单位","国务院发展与改革委员会同国务院其他有关部门"],"answer":"B","why":"依据条例，淘汰目录由国务院建设行政主管部门会同国务院其他有关部门制定并公布；安委会、发改委、省级部门都不是法定公布主体。"},{"type":"单选","stem":"关于对施工单位生产安全事故应急救援准备的要求,错误的是（　）","options":["施工单位必须建立本单位的应急救援组织","施工单位应当制定本单位的生产安全事故应急救援预案","施工单位应配备必要的应急救援器材、设备","施工单位应定期组织应急救援演练"],"answer":"A","why":"条例要求施工单位制定应急救援预案，建立应急救援组织“或者”配备应急救援人员，配备器材设备并定期演练；“必须建立应急救援组织”表述绝对，允许以配备救援人员替代，故错误。"},{"type":"单选","stem":"实施总承包的工程,涉及分包工程的施工现场应急救援预案应由（　）编制。","options":["建设单位","监理单位","总包单位","分包单位"],"answer":"C","why":"依据条例，实行总承包的，建设工程生产安全事故应急救援预案由总承包单位统一组织编制，总包分包各自建立救援组织、配备器材并定期演练；预案不由分包单位另行编制。"},{"type":"单选","stem":"施工单位在作业过程中特种设备发生事故的,应及时、如实地向负责安全生产监督管理的部门、建设行政主管部门或者其他有关部门报告,同时还应当向（　）报告。","options":["劳动保障部门","特种作业人员监督管理部门","特种设备安全监督管理部门","特种设备行业主管部门"],"answer":"C","why":"特种设备发生事故，除报告安全生产监督管理部门、建设行政主管部门外，还应报告特种设备安全监督管理部门，因其对特种设备实施专业安全监察。"},{"type":"单选","stem":"某施工单位的微控定向钻孔设备发生生产安全事故,该施工单位应向（　）报告。","options":["安全生产监督管理部门、建设行政主管部门","特种设备安全监督管理部门","设备经销商、设备生产厂","工程项目的建设单位、监理单位、设计单位"],"answer":"A","why":"微控定向钻孔设备不属特种设备，事故应报告安全生产监督管理部门和建设行政管理部门；报经销商、厂家无法律意义，设计监理单位不是政府监管渠道。"},{"type":"多选","stem":"某施工单位的微控定向钻孔设备发生生产安全事故,该施工单位应向（　）报告。","options":["安全生产监督管理部门、建设行政主管部门","特种设备安全监督管理部门","设备经销商、设备生产厂","工程项目的建设单位、监理单位、设计单位"],"answer":"AB","why":"一般设备事故的法定报告对象为安全生产监督管理部门和建设行政管理部门；该设备不属特种设备，无需报特种设备安全监督管理部门，经销商和厂家不是法定报告对象。"},{"type":"单选","stem":"实行施工总承包的建设工程,分包单位发生了安全事故,由（　）负责上报。","options":["建设单位","总包单位","监理单位","分包单位"],"answer":"D","why":"事故发生在分包作业范围，分包单位作为直接责任主体应当立即如实上报事故并同时告知总包单位；不能以为上报只是总包的事，任何单位不得迟报瞒报。"},{"type":"单选","stem":"注册执业人员未执行法律、法规和工程建设强制性标准的,情节一般的处罚是（　）","options":["责令停止执业 3 个月以上 1 年以下","吊销执业资格证书,5 年内不予注册","终身不予注册","追究刑事责任"],"answer":"A","why":"注册执业人员未执行法律法规和强制性标准，情节一般的责令停止执业3个月以上1年以下；情节严重的吊销证书并5年内不予注册，特别恶劣的终身不予注册；“一般”档对应停业执业3个月至1年。"},{"type":"单选","stem":"违反《建设工程安全生产管理条例》,施工单位未按照国家有关规定在施工现场设置消防水源的,资令限期改正:逾期未改正的（　）依照《安全生产法》的有关规定处以罚款","options":["暂扣资质证书","吊销营业执照","责令停业整顿","追究行政责"],"answer":"C","why":"未按规定设置消防水源的，责令限期改正；逾期未改正的，责令停业整顿，并依照《安全生产法》有关规定处以罚款；处罚阶梯先限期改正，不是直接吊照或暂扣资质。"},{"type":"单选","stem":"根据《建设工程安全生产管理条例》,在城市市区内的施工现场未实行封闭围挡的,施工单位可能承担的法律责任是（　）","options":["处以 20 万元罚款","责令施工企业限期改正","吊销施工企业营业执照","降低施工企业资质等级"],"answer":"B","why":"市区施工未实行封闭围挡的，先责令限期改正；逾期未改正的责令停业整顿并处5万元以上10万元以下罚款；“20万元罚款”无依据，吊照、降资质是更严重违法的后果。"},{"type":"单选","stem":"违反《建设工程安全生产管理条例》规定,施工单位的安全防护用具、机械设备、施工机具及配件在进入施工现场前未经查验或者查验不合格即投入使用的、情节严重的,降低资质等级,直至（　）","options":["吊销营业执照","吊销资质证书","吊销安全生产许可证","对主要负责人撤职"],"answer":"B","why":"防护用具、机械设备、机具配件未经查验或查验不合格即投入使用，情节严重的责令停业整顿、降低资质等级，直至吊销资质证书；营业执照不属建设主管部门的处理权限。"},{"type":"单选","stem":"违反《建设工程安全生产管理条例》规定,施工单位在施工组织设计中未编制安全技术措施、施工现场临时用电方案或者专项施工方案的造成损失的,依法承担（　）责任。","options":["行政","刑事","索赔","赔偿"],"answer":"D","why":"未编制安全技术措施、临时用电方案或专项施工方案造成损失的，属民事损害后果，依法承担赔偿责任；行政处罚针对违法行为本身，题干落脚在“造成损失”，对应赔偿。"},{"type":"多选","stem":"施工单位的下列行为,符合工程安全不良行为认定标准的有（　）","options":["在施工起重机械和整体提升脚手架,模板等自升式架设设施验收合格后未按照规定登记的","在尚未竣工的建筑物内设置员工集体宿舍的","未对因建设工程施工可能造成损害的毗邻建筑物、构筑物和地下管线等采取专项预防措施","使用未经验收或验收不合格的施工起重机械和整体提升脚手架、模板等自升式架设设施的","去按照节能要求进行施工的"],"answer":"ABCD","why":"ABCD均属工程安全不良行为：自升式架设设施验收合格未登记、未竣工建筑内设集体宿舍、未采取专项防护措施、使用未经验收的起重机械和脚手架模板；节能施工属节能监管范畴，非安全不良行为。"},{"type":"单选","stem":"下列情形中,生产安全事故应急救援预案制定单位应当及时修订相关预案的是（　）","options":["安全生产面临的风险发生了任何变化","应急指挥机构的职责发生了调整","部分应急资源发生了任何变化","在预案演练时发现有些人不认真"],"answer":"B","why":"依据《生产安全事故应急预案管理办法》，应急指挥机构及其职责发生调整的，应当及时修订预案；“任何变化”都要修订的表述绝对化，演练中发现态度问题属组织管理问题，不是法定修订触发情形。"},{"type":"单选","stem":"发生生产安全事故后,下列应急救援措施中,错误的是（　）","options":["迅速远离危险源","及时通知可能受事故影响的单位","组织抢救遇险人员","维护事故现场秩序"],"answer":"A","why":"事故发生后应立即组织抢救、采取有效措施防止事故扩大；“迅速远离危险源”等于放弃救援，违背应急处置原则；通知受影响单位、抢救遇险人员、维护现场秩序均为正确措施。"},{"type":"单选","stem":"按照《生产安全事故报告和调查处理条例》,重大事故,是指造成 10 人以上 30 人以下死亡,或者 50人以上 100 人以下重伤,或者（　）下以上 1 亿元以直接经济损失的事故。","options":["1000 万元","3000 万元","5000 万元","7000 万元"],"answer":"C","why":"重大事故标准：10人以上30人以下死亡，或50人以上100人以下重伤，或5000万元以上1亿元以下直接经济损失，三项满足其一即构成；“5000万元”是必记下限。"},{"type":"单选","stem":"施工现场发生一起生产安全事故,造成 10 人死亡,20 人重伤,直接经济损失 1000 万元。根据生产安全事故报告和调查处理条列,该起事故的等级为（　） 。","options":["一般事故","较大事故","重大事故","特别重大事故"],"answer":"C","why":"事故定级就高不就低：死亡10人已达“10人以上30人以下”区间即构成重大事故；重伤人数、经济损失只作并列条件，不会拉低等级，注意与较大事故标准区分。"},{"type":"单选","stem":"根据《生产安全事故报告和调查处理条例》,死亡 3 人事故属于（　）","options":["一般事故","较大事故","重大事故","特别重大事故"],"answer":"B","why":"较大事故：3人以上10人以下死亡，或10人以上50人以下重伤，或1000万元以上5000万元以下直接经济损失；死亡3人恰入较大档，分级界线“3、10、30、50”要记牢。"},{"type":"单选","stem":"根据《生产安全事故报告和调查处理条例》(中华人民共和国国务院令第 493 号),死 1 人的事故属于（　）","options":["一般事故","较大事故","重大事故","特别重大事故"],"answer":"A","why":"一般事故：死亡3人以下，或10人以下重伤，或1000万元以下直接经济损失；死亡1人属一般事故，勿因涉及死亡就主观拔高等级。"},{"type":"单选","stem":"事故发生后,施工企业应当最迟 （　）上报事故","options":["0 分钟","1 小时内","2 小时内","1 天内"],"answer":"B","why":"依据《生产安全事故报告和调查处理条例》，事故发生后单位负责人应于1小时内向事故发生地县级以上应急管理部门等报告，“1小时”是法定最迟上限，超时即构成迟报。"},{"type":"单选","stem":"关于事故报告和调查处理,下列说法中正确的是 （　）","options":["事故发生后,本单位负责人应当立即报告安全生产监督管理部门每级上报的时间不得超过 2 小时","生产安全事故(含道路交通事故、火灾事故) 造成的伤亡人数发生变化的,应当自事故发生之日起 7 日内及时补报","特别重大事故以下等级事故,事故发生地与事故发生单位不在同一个县级以上行政区域的,由事故发生地人民政府负责调查","任何单位和个人不得破坏事故现场、应妥善保存现场重要痕迹、(因抢救人员、疏通交通等特殊情况除外)"],"answer":"A","why":"A正确：负责人应立即如实报告，监管部门逐级上报每级不得超过2小时。B错：伤亡人数变化补报时限是30日，道路交通、火灾事故才是7日。C遗漏单位所在地政府应派人参加。D易误导：移动现场物件须做标志、绘图并记录，并非任由破坏。"},{"type":"单选","stem":"通信工程施工现场发生安全事故后,现场人员事故报告的内容一般不包括（　）","options":["事故发生的时间、地点","事故的简要经过","事故已造成的伤亡人数","详细的经济损失"],"answer":"D","why":"现场人员初报重在快和关键信息：事故发生的时间地点、简要经过、已造成的伤亡人数；详细经济损失需事后核算认定，不属于第一时间的报告内容。"},{"type":"单选","stem":"县级人民政府可以直接组织调查组进行调查的事故级别是 （　）","options":["特别重大事故","重大事故","较大事故","一般事故"],"answer":"D","why":"调查权限分级：特别重大由国务院或其授权部门组织，重大由省级政府，较大由设区的市级政府，一般事故由县级人民政府组织调查；县级可直接组织调查的只有一般事故。"},{"type":"判断","stem":"事故发生单位应及时全面落实整改措施,负有安全生产监督管理职责的部门应当加强监督检查。（　）","options":[],"answer":"对","why":"依据条例，事故发生单位应当认真吸取事故教训，及时全面落实整改措施；负有安全生产监督管理职责的部门应当加强监督检查，防止同类事故重演，说法正确。"},{"type":"单选","stem":"事故发生单位应及时全面落实整改措施, （　） 应当加强监督检查","options":["负有安全生产监督管理职责的部门","工会组织","人民检察院","地方人民政府行政执法部门"],"answer":"A","why":"督促落实整改并加强监督检查的是负有安全生产监督管理职责的部门；工会是群众监督，检察院是法律监督，一般行政执法部门无安全生产监管职责。"},{"type":"多选","stem":"下列情况中应由有关部门按有关规定追究有关领导和直接责任者的责任并给予必要行政、经济处罚的有（　）。","options":["对事故隐瞒不报、谎报","对事故故意延迟不报","故意破坏事故现场","无正当理由拒绝接受调查","因抢救人员需要清理事故现场,但事前作好标记"],"answer":"ABCD","why":"隐瞒不报、谎报、故意迟延不报、故意破坏现场、无正当理由拒绝接受调查，都妨碍事故调查处理，依法追责并给予行政、经济处罚；因抢救人员清理现场且事前做好标记记录的属合法处置，不追责。"}]},{"file":"03第三章","title":"第三章","count":84,"questions":[{"type":"单选","stem":"下列对通信工程建设、勘察、设计、施工、监理等安全生产责任主体的要求,错误的是（　）","options":["必须遵守安全生产法律、法规","执行保障生产安全的国家标准、行业标准","必须进行安全生产科技创新","确保通信工程建设安全生产,依法承担安全生产责任"],"answer":"C","why":"各责任主体必须遵守安全生产法律法规、执行保障生产安全的国家标准和行业标准，并依法承担安全生产责任；“必须进行安全生产科技创新”属倡导性要求而非法定义务，表述绝对故错误。"},{"type":"多选","stem":"下列安全生产责任中,属于建设单位的是 （　）","options":["建设工程安全生产费不得打折","严格按照工程建设强制性标准和安全生产操作规范进行施工作业","工程合同中应明确安全生产费支付方式、数额及时限","对有可能引发通信工程安全隐患的灾害提出防治措施","审查施工组织设计中的安全技术措施和安全专项施工方案"],"answer":"AC","why":"建设单位责任核心是保障费用：安全生产费不得打折、合同中明确支付方式数额时限；B“组织施工作业”是施工单位职责，D灾害防治是勘察设计职责，E审查专项方案是监理职责，均非建设单位。"},{"type":"单选","stem":"通信工程开工前,（　） 应当明确参与工程相关单位的安全生产责任","options":["建设单位","设计单位","施工单位","监理单位"],"answer":"A","why":"依据《通信建设工程安全管理规定》，建设单位是工程组织者，开工前应当明确参与工程建设各相关单位的安全生产责任，落实各方安全义务；设计、施工、监理单位是被明确对象而非明确主体。"},{"type":"单选","stem":"下列安全生产责任中,属于建设单位的是 （　）","options":["不得压缩合同工期","勘察文件应当真实、准确,满足通信建设工程安全生产的需要","明确安全费用提取和使用的程序、职责及权限","对施工单位安全管理人员安全生产知识和管理能力进行考核"],"answer":"A","why":"不得压缩合同工期是建设单位的安全责任，压缩工期易导致抢工冒险、埋下事故隐患；勘察文件真实准确是勘察单位责任，考核施工安全管理人员是建设单位权利，明确安全费用程序属施工单位内部管理。"},{"type":"单选","stem":"应当严格执行操作规程,采取措施保证各类管线、设施和周边建筑物、构筑物的安全。对有可能引发通信工程安全隐患的灾害提出防治措施。这是（　）的安全生产责任。","options":["监理单位","施工单位","勘察设计单位","建设单位"],"answer":"C","why":"保证管线设施和周边建筑物安全、对可能引发隐患的灾害提出防治措施，属勘察设计单位责任，因其掌握地质环境等基础资料，最有条件在设计源头提出防治；施工、监理、建设单位无此设计职能。"},{"type":"单选","stem":"设计单位必须在设计文件中（　）计列安全生产费。","options":["全额","部分","按建设单位要求","按工程建设需求"],"answer":"A","why":"设计单位必须在设计文件中全额计列安全生产费用，保证安全投入在源头足额列支；部分计列、按建设单位要求或按需求计列都会造成安全费“打折”，违反全额计列原则。"},{"type":"多选","stem":"下列安全生产责任中,属于设计单位的是 （　）。","options":["建设工程安全生产费不得打折","工程概预算必须按照相关规定全额列出安全生产费用","工程合同中应明确支付方式、数额及时限","对有可能引发通信工程安全隐患的灾害提出防治措施","审查施工组织设计中的安全技术措施和安全专项施工方案"],"answer":"BD","why":"设计单位责任对应BD：概预算按规定全额列出安全生产费用、对可能引发隐患的灾害提出防治措施；A不得打折是对建设单位的要求，C明确支付时限属建设单位合同义务，E审查方案是监理职责。"},{"type":"多选","stem":"企业的安全生产管理人员不包括 （　）","options":["企业主要负责人","企业项目负责人","专职安全生产管理人员","项目兼职安全巡视人员"],"answer":"ABC","why":"企业安全生产管理人员指专职从事安全管理的人员；主要负责人、项目负责人虽属“安管三类人”，但不属于“安全生产管理人员”这一岗位序列，兼职巡视员更不是，故不包括的是ABC。"},{"type":"单选","stem":"不属于企业安全生产“三类人”或企业“安管人员”的是 （　）","options":["企业主要负责人","项目负责人","安全生产管理人员","施工现场操作人员"],"answer":"D","why":"“安管三类人”＝企业主要负责人、项目负责人、专职安全生产管理人员，须考核持证；施工现场操作人员不属三类人，无考核取证要求，答题时抓住“三类人”口诀即可。"},{"type":"多选","stem":"企业必须通过由通信主管部门对其安全生产知识和管理能力考核的人员有（　）。","options":["单位主要负责人","单位工程管理部门主要负责人","项目负责人","专职安全生产管理人员","班组安全生产管理人员"],"answer":"ACD","why":"须经通信主管部门安全生产知识和管理能力考核的是三类人：单位主要负责人、项目负责人、专职安全生产管理人员；工程部门负责人、班组成员不在法定考核序列内。"},{"type":"单选","stem":"根据《通信建设工程安全管理规定》,施工单位应对本单位所有管理人员和作业人员每年至少进行 （　） 次安全生产教育培训。","options":["一","二","三","四"],"answer":"A","why":"依据《通信建设工程安全管理规定》，施工单位对管理人员和作业人员每年至少进行一次安全生产教育培训并考核合格，“每年至少一次”是底线频次，不能按季度类推多记。"},{"type":"单选","stem":"根据《通信建设工程安全管理规定》规定,工程分包单位对管理人员和作业人员每年应至少进行_（　）次安全生产教育培训。","options":["一","二","三","四"],"answer":"A","why":"分包单位的安全教育义务与总包相同：对管理人员和作业人员每年至少进行一次安全生产教育培训；分包不因隶属关系降低培训频次要求。"},{"type":"判断","stem":"施工现场应由具有一定施工经验的人员对安全生产进行监督。（　）","options":[],"answer":"错","why":"施工现场安全生产监督必须由专职安全生产管理人员实施，专职安全员须经考核持证；“有一定施工经验的普通人员”不具备法定资格，无监督资质，故说法错误。"},{"type":"单选","stem":"工程施工前,组织施工安全技术交底的人员是（　）","options":["企业技术负责人","施工项目负责人","项目安全负责人","作业现场负责人"],"answer":"C","why":"工程施工前，项目安全负责人（专职安全员）负责组织施工安全技术交底，向作业班组详细说明安全要求并签字确认；企业技术负责人负责审批方案，现场负责人是接受交底方。"},{"type":"判断","stem":"井下、高空、用电作业时,必须配备地下管线探测仪、防护绳、防触电等用具。（　）","options":[],"answer":"错","why":"安全用具须与作业风险匹配：井下配气体检测和通风用具，高空配防护绳、安全带，用电配绝缘防触电用具；把三类用具混为一谈笼统配备，无法对症防护，故说法错误。"},{"type":"多选","stem":"下列关于施工单位安全生产责任的说法,正确的是 （　）","options":["建立健全安全生产教育培训制度","严格按照工程建设强制性标准和安全生产操作规范施工","保证施工项目的安全生产费全部用于本项目的安全生产","在有限空间安全作业,必须严格执行作业审批制度","建立健全生产安全事故隐患排查治理制度"],"answer":"ABDE","why":"ABDE均为施工单位法定义务：建立教育培训制度、按强制性标准规范施工、有限空间严格作业审批、建立隐患排查治理制度；C错在安全生产费须按规定范围使用，并非归本项目随意全额支配。"},{"type":"多选","stem":"监理单位对通信工程项目的安全责任包括 （　）","options":["参加安全技术交底","组织安全生产检查","进行现场安全的巡视检查","审查工程安全专项施工方案","审查施工组织设计中安全技术措施"],"answer":"CDE","why":"监理单位安全责任是审查安全专项施工方案、审查施工组织设计中安全技术措施、现场巡视检查，对应CDE；参加交底、组织安全生产检查属施工方或建设方组织行为，不属监理法定责任。"},{"type":"单选","stem":"通信工程建设项目进行招标时,应明确不得作为竞争性报价的是（　）","options":["调造费","普工费","预备费","安全生产费"],"answer":"D","why":"安全生产费是保障施工安全的法定专项费用，属于不可竞争性费用，招标时必须足额计列、不得作为竞争性报价下浮；调遣费、普工费、预备费均可正常参与报价竞争。"},{"type":"单选","stem":"以下 （　）不属于安全费的使用范围","options":["气体检测仪购买","用于应急救援的安全绳的购买","为作业人员购买意外伤害保险的费用","对施工人员的安全教育培训的开支"],"answer":"C","why":"安全生产费用于完善和改善安全防护、检测、应急等支出：气体检测仪、应急救援安全绳、安全培训开支均属之；意外伤害保险费按规定另行列支，不属安全费使用范围。"},{"type":"单选","stem":"施工单位年度提取的安全生产费有结余时,正确的做法是 （　）","options":["发放员工奖金","作为公司下一年度市场开发费","转至下一年度做安全生产开支","作为公司的年度利润"],"answer":"C","why":"依据安全生产费用管理规定，年度结余的安全费应结转下一年度继续用于安全生产开支，专款专用；挪作奖金、市场开发费或利润都改变资金用途，属违规行为。"},{"type":"多选","stem":"关于通信施工单位安全生产事故的报告要求,说法正确的是（　）","options":["事故现场有关人员应立即向本单位负责人报告","事故现场有关人员应立即向当地政府应急管理部门报告","单位负责人接到事故报告后 1 小时内向企业所在地应急管理部门报告","单位负责人接到事故报告后 2 小时内向事故所在地县级以上政府应急管理部门报告","单位负责人接到事故报告后 1 小时内向所在地省级通信管理局报告"],"answer":"AE","why":"A对：现场人员立即报本单位负责人；E对：负责人接报后1小时内报省级通信管理局。B错：现场人员先报本单位而非政府；C、D混淆时限——通信行业是1小时内报通信管理局和应急管理部门。"},{"type":"单选","stem":"通信建设工程中发生生产事故,（　）接到报告后,应当立即启动事故处理应急预案。","options":["专职安全员","项目负责人告","单位负责人","通信管理局"],"answer":"C","why":"单位负责人接到事故报告后，应当立即启动事故处理应急预案，组织抢救、防止事故扩大；专职安全员、项目负责人无权调动全单位应急资源，通信管理局属外部监管方。"},{"type":"单选","stem":"某年某省 H 公司在肥东县进行肥东移动的基站迁移工程施工。在 H 公司吊车驾驶员进行基站信号塔迁移操作的过程中吊绳断裂,信号塔倒落后砸中两辆在此路口等候红灯的车辆,造成 2 人死亡,5 人受伤。H 公司的法定代表人接到现场人员报告后采取了下列行动,正确的是 （　）","options":["立即启动应急预案抢救受伤人员","在现场处理完毕后(约 1 个半小时) 向肥东县安全生产监督管理部门报告","在组织抢救时强调,除因抢救人员、疏通交通等特殊情况外,任何人不得破坏事故现场,应妥善保存现场重要痕迹、物证","对事故现场人员统一事故上报及对外口径,尽量减轻公司责任"],"answer":"A","why":"正确的是A：负责人接报后立即启动应急预案组织抢救。B错：事故须立即报告，不得等现场处理完毕（约1小时内核实报告）；C属现场人员配合义务；D统一口径减轻责任涉嫌瞒报谎报，违法。"},{"type":"单选","stem":"对本行政区域内通信建设工程相关企业的安管人员的安全生产工作督管理的部门不包括 （　）","options":["工业和信息化部","通信管理局","应急管理部","公安机关"],"answer":"D","why":"对安管人员安全生产工作实施监督管理的部门包括工业和信息化部、各省通信管理局及应急管理部门；公安机关负责治安刑事案件，不属安全生产监督管理部门序列。"},{"type":"判断","stem":"通信管理局负责本行政区域内通信建设工程安全生产的监督管理工作。（　）","options":[],"answer":"对","why":"依据《通信建设工程安全管理规定》，省、自治区、直辖市通信管理局负责本行政区域内通信建设工程安全生产的监督管理，属地监管职责明确，说法正确。"},{"type":"单选","stem":"行政监督部门进行安全生产检查时,施工单位有权予以拒绝的行为是（　）","options":["要求被检查单位停工接受检查","要求检查单位提供有关安全生产的文件和资料","进入检查单位施工现场进行检查、拍照、录像","对检查中发现的安全生产违法行为,要求限期改正"],"answer":"A","why":"行政监督部门有权调阅文件资料、进入现场检查拍照录像、对违法行为责令限期改正，但无权要求企业停工接受检查，滥用检查干扰正常生产属越权，施工单位有权拒绝。"},{"type":"多选","stem":"通信行政监督部门责令施工单位限期改正或予以通报的行为有（　）。","options":["不配合安全生产监督检查及安全生产事故调查处理的","发生生产安全事故,未及时上报或对事故调查处理不力的","制订的生产安全事故应急救援预案不满足要求的","两年未对从业人员进行一次安全生产教育和培训的","未保证安全生产所必需的资金投入,致使不具备安全生产条件的"],"answer":"ABD","why":"ABD属责令限期改正或通报情形：不配合监督检查和事故调查、事故未及时上报或调查处理不力、应急预案不满足要求且两年未培训从业人员；C预案不满足要求属责令修订；E资金投入不足的责令停产整顿并处罚款，非限期改正。"},{"type":"单选","stem":"根据《通信建设工程企业主要负责人、项目负责人和专职安全生产管理人员安全生产考核管理暂行规定》,下列人员中不属于企业主要负责人的是（　）。","options":["企业法定代表人","企业高级注册安全工程师","分管生产经营的副总经理","企业技术负责人"],"answer":"B","why":"企业主要负责人包括法定代表人、分管生产经营的副总经理、技术负责人等实际掌权决策者；高级注册安全工程师是专业技术职称岗位，不属主要负责人序列。"},{"type":"多选","stem":"根据《通信工程施工企业主要负责人项目负责人和专职安全生产管理人员安全生产考核管理规定》,应该申请参加通信工程","options":["类“安管人员考核的人员有 (ABCE)A 企业总经理","企业法定代表人","分管生产经营的副总经理","企业项目负责人","企业技术负责人"],"answer":"ABCE","why":"A类考核对象是企业主要负责人：总经理、法定代表人、分管生产经营的副总经理、企业技术负责人均属之；项目负责人报考B类，专职安全员报考C类，勿混淆三类证书。"},{"type":"判断","stem":"项目负责人是指由企业法定代表人授权,负责具体通信建设工程项目管理的人员。（　）","options":[],"answer":"对","why":"依据安管人员考核管理规定，项目负责人是指由企业法定代表人授权，负责具体通信建设工程项目管理的人员，强调“法定代表人授权”这一核心要件，说法正确。"},{"type":"单选","stem":"根据《通信建设工程企业主要负责人、项目负责人和专职安全生产管理人员安全生产考核管理暂行规定》,下列有关三类安管人员的表述中正确的是 （　）","options":["由企业领导分配负责通信建设工程项目安全管理任务的人员就是项目负责人","只有在项目施工现场专职从事安全生产管理工作的人员才是专职安全员","企业主要负责人不包括企业技术负责人","企业安全生产管理机构的人员也可通过考试成为专职安全生产管理人员"],"answer":"D","why":"企业安全生产管理机构的人员经考核合格也可担任专职安全生产管理人员，D正确；A项目负责人须法定代表人授权而非随意分配；B专职安全员不限于施工现场；C企业主要负责人包括技术负责人。"},{"type":"多选","stem":"企业的专职安全生产管理人员包括（　）","options":["企业工程项目管理部门的负责人","企业安全生产管理机构的专职人员","企业所承包通信工程项目的负责人","工程项目专职从事安全生产管理工作的人员","工程项目施工班组巡查的人员"],"answer":"BD","why":"专职安全生产管理人员包括：企业安全生产管理机构的专职人员、工程项目专职从事安全管理工作的人员，对应BD；部门负责人、项目负责人、班组巡查兼职人员均不属专职安全员序列。"},{"type":"单选","stem":"某通信施工企业的技术负责人于 2021 年 10 月 15 日申请安管人员证书考核,其基本条件不符合要求的是（　）","options":["年龄 59 岁,身体健康","大学本科学历","在 2020 年 7 月 10 日发生的一起较大安全生产事故中负有领导责任被罚款 30 万元","从事通信工程建设管理工作 2 年 10 个月"],"answer":"D","why":"安管人员考核基本条件：年龄不超过60岁 一风险，现场处置方案针对具体岗位设施，层级不匹配。"},{"type":"单选","stem":"施工企业风险种类多、可能发生多种类型事故的,生产经营单位应当编制（　）","options":["综合应急预案","专项应急预案","现场处置方案","应急处置卡"],"answer":"A","why":"依据《生产安全事故应急预案管理办法》，风险种类多、可能发生多种类型事故的，应当编制综合应急预案，统筹应急组织指挥与职责、预案体系等总体安排。"},{"type":"单选","stem":"综合应急预案应当规定的内容不包括（　）","options":["应急指挥机构与职责","事故等级描述","事故风险描述","应急预案体系"],"answer":"B","why":"综合应急预案内容包括应急指挥机构与职责、事故风险描述、应急预案体系等总体要素；对具体事故等级的详细描述属专项预案或现场处置方案内容，不在综合预案必列范围。"},{"type":"单选","stem":"对于某一种类型的事故风险,生产经营单位可以编制相应的 （　）","options":["专项应急预案","人员伤亡应急预案","现场处置方案","综合应急预案"],"answer":"A","why":"针对某一种类型的事故风险（如坍塌、触电、中毒），应当编制专项应急预案，明确应对该类事故的具体指挥程序和处置措施；综合预案覆盖面广，现场处置方案则落到具体岗位。"},{"type":"单选","stem":"对于危险性较大的场所、装置和设施,应当编制（　）","options":["综合应急预案","专项应急预案","现场处置方案","专项施工方案"],"answer":"C","why":"对危险性较大的场所、装置或设施，应当编制现场处置方案，将处置措施具体到岗位和装置层面，便于第一时间就近应急处置；综合、专项预案层级过高，专项施工方案属施工技术文件。"},{"type":"单选","stem":"对于危险性较大的场所、装置和设施,生产经营单位应当编制 （　）","options":["专项应急预案","部门应急预案","现场处置方案","综合应急预案"],"answer":"C","why":"危险性较大的场所、装置和设施对应现场处置方案，突出“具体到点、即时可用”；部门应急预案是政府及其部门层面的分类，不适用生产经营单位。"},{"type":"单选","stem":"事故风险单一、危险性小的施工单位,可以只编制 （　）","options":["综合应急预案","专项应急预案","现场处置方案","专项施工方案"],"answer":"C","why":"事故风险单一、危险性小的生产经营单位，可以只编制现场处置方案，简化预案体系；仍必须编综合或专项预案的要求只针对风险复杂单位，体现分级分类管理。"},{"type":"单选","stem":"应急预案应该由 （　）负责签发实施","options":["企业主要负责人","企业技术负责人","项目负责人","企业安全生产管理机构"],"answer":"A","why":"应急预案应由本单位主要负责人签发实施，体现主要负责人对应急工作负总责；技术负责人审核把关，项目负责人和安全机构无签发权限。"},{"type":"单选","stem":"根据《生产安全事故应急预案管理办法》要求,建筑施工单位应当至少（　） 组织一次生产安全事故应急预案演练。","options":["每月","每季","每半年","每年"],"answer":"C","why":"依据《生产安全事故应急预案管理办法》，建筑施工单位属于高危单位，应当至少每半年组织一次生产安全事故应急预案演练，比一般单位每年一次的要求更严格。"},{"type":"单选","stem":"通信工程中人井作业时容易引发安全事故,对此施工单位应当制订针对性现场应急救援预案配备应急救援用品,并且每隔 （　）组织作业人员进行演练","options":["一个月","二个月","三个月","半年"],"answer":"D","why":"人井（有限空间）作业风险高，施工单位应制订针对性现场应急救援预案、配备应急救援用品，并每隔半年组织作业人员进行演练；“半年一次”与高危单位演练频次一致。"},{"type":"单选","stem":"某地建设行政主管部门检查某施工企业的施工工地,发现该施工企业没有按照施工现场管理规定设置围挡,依法责令停止施工。该建设行政主管部门对该施工企业采取的行政行为属于（　）","options":["行政处罚","行政裁决","行政处分","行政强制"],"answer":"A","why":"责令停止施工是行政机关对违反安全管理规定的行为给予的制裁，属行政处罚；行政处分针对内部公务人员，行政裁决处理民事纠纷，行政强制是强制执行手段，均不符。"},{"type":"单选","stem":"生产经营单位及其有关人员在生产经营活动中违反有关安全生产法律法规被给予行政处罚时,生产当事人应当在收到行政处罚告知书之日起（　）日内进行陈述、申辩,或者依法提出听证要求,逾期视为放弃上述权力。","options":["5","7","10"],"answer":"A","why":"当事人应当在收到行政处罚告知书之日起5日内进行陈述、申辩或提出听证要求，逾期视为放弃权利；“5日”是行使陈述申辩听证权的法定时限。"},{"type":"单选","stem":"关于行政处罚决定书的送达,下列说法正确的是 （　）","options":["送达必须有送达回执","决定书必须当场交付当事人","当事人拒收送达书的,送达失败","直接送达确有困难的,可以电话传达"],"answer":"A","why":"行政处罚决定书送达必须有送达回执，由当事人签收证明送达完成，回执是程序合法的证据；可当场交付也可其他法定方式送达，拒收不影响送达效力，电话传达不具法律效力。"},{"type":"单选","stem":"某单位发生生产安全事故后,其主要负责人迅速赶到事故现场,组织救援并于 90 分钟后向所在地省级通信管理局报告,该负责人涉嫌的违法行为有（　）","options":["迟报行为","漏报行为","谎报行为","瞒报行为"],"answer":"A","why":"事故报告应在规定时限内（通信行业1小时内上报省级通信管理局），90分钟才报告已超过时限，构成迟报；漏报是遗漏内容，谎报是不如实报告，瞒报是不报告，均与超时报送不符。"},{"type":"单选","stem":"因过失对应当上报的事故或者事故发生的时间、地点、类别、伤亡人数、直接经济损失等内容遗漏未报的,属于 （　）","options":["迟报行为","漏报行为","谎报行为","瞒报行为"],"answer":"B","why":"因过失遗漏应当上报的事故或时间、地点、类别、伤亡人数、直接经济损失等内容未报，属漏报；关键区分主观状态——“过失”遗漏是漏报，“故意”不如实报告才是谎报瞒报。"},{"type":"单选","stem":"在报告事故时故意不如实报告事故发生的时间、地点、初步原因、性质、伤亡人数和涉险人数、直接经济损失等有关内容的,属于 （　）","options":["迟报行为","漏报行为","谎报行为","瞒报行为"],"answer":"C","why":"报告事故时故意不如实报告时间、地点、原因、伤亡人数等内容，属谎报；主观上“故意”且内容失真，与过失漏报、超时限迟报、完全不报的瞒报相区分。"},{"type":"单选","stem":"对发生重大事故的单位及其有关责任人罚款的行政处罚,当事故发生地与事故发生单位不在同省级行政区域的,由 （　） 决定","options":["事故发生地省级人民政府安全生产监督管理部门","单位所在地省级人民政府安全生产监督管理部门","事故发生地县级人民政府安全生产监督管理部门","由国家应急管理部"],"answer":"A","why":"事故罚款处罚原则上由事故发生地安监部门决定；重大事故罚款由事故发生地省级人民政府安全生产监督管理部门决定，跨省的仍以事故发生地为主，体现属地管辖。"},{"type":"单选","stem":"《安全生产事故罚款处罚规定(试行)》规定,事故发生单位主要负责人在事故调查处理期间擅离职守的,处上一年年收入（　）的罚款。","options":["0%至 80%","80%至 100%","80%至 90%","100%"],"answer":"B","why":"依据《安全生产事故罚款处罚规定（试行）》，主要负责人在事故调查处理期间擅离职守的，处上一年年收入80%至100%的罚款；“80%至100%”是擅离职守对应的罚款比例档。"},{"type":"单选","stem":"某日上午 9 点某地安全生产监管部门在一网络直播平台发现正在直播-企业的生产安全事故抢救现场,经向值班室核实尚未接到该企业的报告遂派 3 名工作人员赶赴事故现场。到达现场时抢救工作已经结束,2 名伤员已送医院救治。监管部门工作人员经多方查证,事故属实,伤 2 人,暂无人员死亡,11:10 向值班室汇报,值班室反馈说仍未接到该企业任何报告根据上述情况,可以对该事故发生单位主要负责人处上一年收入的（　）罚款。","options":["0%","90%","100%","150%"],"answer":"C","why":"该单位发生事故后未按规定及时报告，构成迟报、瞒报情形之一——主要负责人未及时组织事故报告的，对迟报、瞒报的处上一年年收入100%的罚款，属罚款比例中的最高档。"}]},{"file":"04第四章","title":"第四章","count":28,"questions":[{"type":"判断","stem":"安全与危险之间是绝对的关系,不会相互转化。 （　）","options":[],"answer":"错","why":"错。安全与危险是相对的、动态的关系，二者可相互转化：措施到位则转危为安，管理松懈则安变危。“绝对关系、不会转化”违背安全辩证原理，故该说法错误。"},{"type":"单选","stem":"下列关于安全与危险的说法,错误的是 （　）","options":["危险必须指明具体对象","危险事可以转化成安全的事","安全的事不会变成危险的事","采取有效措施可以减少安全事故发生"],"answer":"C","why":"依据安全与危险的辩证关系，两者可双向转化，安全措施失守时安全的事也会变成危险的事，故C错误。A危险须指明具体对象、B危险可转化为安全、D措施可减少事故，均为正确表述。"},{"type":"单选","stem":"下面对安全生产概念的理解,说法错误的是 （　）","options":["安全生产要求社会生产活动中的人、机、物料、环境、方法等方面和谐运作","安全生产的方针是对生产过程中的各种事故风险和伤害因素进行有效规划","安全生产的目的是切实保护劳动者的生命安全和身体健康","安全生产是使劳动过程在符合安全要求的物质条件和工作秩序下进行"],"answer":"B","why":"安全生产要求对生产过程中的各种事故风险和伤害因素进行有效“控制”而非“规划”，B偷换概念。其余三项从要素和谐运作、保护生命健康、物质条件与秩序三个角度阐述安全生产，均正确。"},{"type":"单选","stem":"下面关于安全与生产的统一关系,描述错误的是 （　）","options":["搞好安全工作,改善劳动条件,可以调动职工的生产积极性","减少职工伤亡,可以减少劳动力的损失","搞好安全工作,会增加企业开支,从而会影响生产的发展","安全是生产的前提条件,不能保证安全就不得进行生产"],"answer":"C","why":"安全与生产是统一关系：搞好安全能调动积极性、减少伤亡与劳动力损失、促进生产发展。C把安全投入说成增加开支、影响生产的负担，违背“安全是生产的前提”，故错误。"},{"type":"多选","stem":"安全生产管理的目的是 （　）","options":["保证生产安全 、","降低安全费开支,提高企业利润","保证人与机器设备、物料、环境的和谐","实现人身安全、财产安全","消除隐患,保证验收指标满足要求"],"answer":"ACD","why":"安全生产管理的目的是保证生产安全、人与机器设备物料环境和谐、实现人身和财产安全并消除隐患；B把降低开支提高利润当目的、E为满足验收指标除患，均偏离保护人这一根本目的。"},{"type":"单选","stem":"下面关于安全检查法的内容,说法错误的是（　）","options":["检查数据必须来源于企业组成的检查组","形式主要有定期检查、不定期检查和特殊检查","安全检查应预先做好思想上、业务上的准备","检查过程应防止走形式、走过场"],"answer":"A","why":"安全检查数据来源广泛，可来自自查、上级检查、行业督查等，并非必须由企业检查组产生，A过于绝对。B检查形式、C事前思想业务准备、D防止走过场均是安全检查法的正确要求。"},{"type":"单选","stem":"下面关于安全目标管理法的内容,说法不正确的是 （　）","options":["安全目标管理是安全管理的集中要求和目的所在","安全目标管理是将企业一定时期的安全工作任务转化为明确的安全工作目标","安全目标管理要求企业将安全工作目标分解到本企业的各个部门和个人","安全目标管理要求企业各部门和个人参考所确定的安全工作目标进行工作"],"answer":"D","why":"目标管理要求各部门和个人严格按确定的安全目标开展工作并对结果负责，“参考”意味着可执行可不执行，弱化了目标的约束力，故D错误；A、B、C是目标管理的正确内涵。"},{"type":"单选","stem":"下面关于安全目标管理法的内容,说法不正确的是 （　）","options":["安全目标管理是一种信任性、指导性的管理","安全目标管理应制定方针、目标,并安排管理日程","安全目标管理依靠企业各部门及员工自觉行动和严格检查实现","安全目标管理是一种重视人、激励人的客观规律性的管理"],"answer":"D","why":"安全目标管理是信任性、指导性、重视人激励人的管理，但说它是一种“客观规律性的管理”表述不当，故D错误；A性质、B做法、C实现方式的说法均正确，易在A与D间纠结，注意D与教材表述不符。"},{"type":"单选","stem":"“执行计划”,属于戴明循环管理法（　） 阶段的工作任务。","options":["计划","实施","检查","处理"],"answer":"B","why":"戴明循环即PDCA：P计划、D实施、C检查、A处理。“执行计划”属实施阶段任务。易误选A，计划阶段只是制定目标和方案，把计划付诸行动的才是实施。"},{"type":"单选","stem":"“总结经验,纳入标准”,属于戴明循环管理法（　） 阶段的工作任务。","options":["计划","实施","检查","处理"],"answer":"D","why":"处理阶段的任务是对检查结果总结定论：成功经验纳入标准固化，失败教训防止重犯。易误选C，检查阶段只对照计划查找问题，不负责把经验升为标准。"},{"type":"单选","stem":"“重大遗漏问题转入下期考虑”,属于戴明循环管理法 （　） 阶段的工作任务。","options":["计划","实施","检查","处理"],"answer":"D","why":"PDCA是滚动上升的闭环，本期未解决的重大遗漏问题转入下一循环继续解决，这正是处理阶段的职责。易误选B，实施阶段只按计划执行，不管遗留问题的去向。"},{"type":"判断","stem":"风险预控是在危险源辨识和风险评估的基础上,预先采取措施消除或控制风险的过程。（　）","options":[],"answer":"对","why":"对。风险预控的核心流程是先辨识危险源、评估风险，再预先采取措施消除或控制风险，体现关口前移、预防为主的安全原理，该说法准确。"},{"type":"判断","stem":"风险预控是在生产安全事故分析的基础上,预先采取措施消除或控制风险的过程。 （　）","options":[],"answer":"错","why":"错。风险预控的基础是危险源辨识和风险评估，题干偷换成“生产安全事故分析”。事故分析属事后管理，风险预控强调事前预防，两者性质不同，故说法错误。"},{"type":"多选","stem":"常用的安全管理方法有 （　）","options":["戴明循环管理法","安全检查法","风险预控法","强制比例法","安全目部管理法"],"answer":"ABCE","why":"常用安全管理方法可记“戴、检、险、目”四法：戴明循环管理法、安全检查法、风险预控法、安全目标管理法；D“强制比例法”是凑数干扰项，不属于安全管理方法体系。"},{"type":"多选","stem":"下面关于当前通信建设工程领域安全生产形势的描述,正确的是 （　）。","options":["近年来安全生产事故总量逐年增加","安全生产意识比较淡薄","从业人员安全生产知识和技能不足","安全生产投入仍然不足","安全生产责任制度落实不到位"],"answer":"BCDE","why":"当前通信建设领域存在安全意识淡薄、人员知识技能不足、投入不足、责任制落实不到位等问题，较大事故时有发生；但事故总量并未逐年增加，A错误。易受“事故很多”的印象误导而误选A。"},{"type":"判断","stem":"当前,通信建设工程领域的安全生产事故总量很多,较大安全生产事故时有发生。 （　）","options":[],"answer":"对","why":"对。当前通信建设工程领域安全生产事故总量仍然很多，较大事故时有发生，安全生产形势依然严峻。注意与“逐年增加”区分：总量多是事实，不代表逐年上升。"},{"type":"单选","stem":"安全生产管理方针的基石、安全生产工作的重心是（　）","options":["安全第一,预防为主,综合治理","安全第一","预防为主","综合治理"],"answer":"A","why":"“安全第一、预防为主、综合治理”十二字方针是安全生产管理方针的基石和安全生产工作的重心，三者是有机整体；B、C、D各自只取其中一项，表述片面不完整。"},{"type":"单选","stem":"职工在劳动过程中的安全、健康应由（　） 负责。","options":["政府","行业","社会","生产经营单位"],"answer":"D","why":"依据《安全生产法》，生产经营单位是安全生产的责任主体，职工劳动过程中的安全健康由本单位直接负责；政府是监管方、行业和社会是监督方。易误选A，政府监管不能代替企业担责。"},{"type":"多选","stem":"对于安全生产工作机制中的“职工参与”,要求企业职工应 （　）","options":["参与制定或者修改企业的各项规童制度","参与工会组织的“查隐患、保安全”工作","批评、检举、控告影响工程质量的行为","无条件执行企业管理人员下达的各项指令","按照企业制度、规程的规定进行生产作业"],"answer":"BE","why":"职工参与要求参加工会组织的“查隐患、保安全”活动并按制度规程作业；C错在应检举控告的是影响安全生产行为而非工程质量；D“无条件执行各项指令”错，对违章指挥应拒绝；A范围过宽。"},{"type":"单选","stem":"在安全生产工作机制中,做好安全生产工作的基础是 （　）","options":["生产经营单位负责","职工参与","政府监管","社会监督"],"answer":"A","why":"安全生产工作机制中，生产经营单位负责是做好安全生产工作的基础——企业是责任主体，职工参与、政府监管、社会监督都在这一基础上协同发力。口诀：单位负责打基础。"},{"type":"单选","stem":"在实际管理工作中,领导班子分工对所分管单位或部门同样负有安全管理主体责任。这体现了（　） 的安全生产管理原则。","options":["企业主要负责人对本单位安全生产工作全面负责","谁主管谁负责","管生产必须管安全","全员参与"],"answer":"B","why":"领导班子按分工对分管单位或部门负安全管理主体责任，正体现“谁主管谁负责”原则。易误选C，“管生产必须管安全”针对生产组织者，本题强调分管领导对分管范围的责任归属。"},{"type":"单选","stem":"安全生产,人人有责体现了 （　） 的安全生产管理原则,","options":["谁主管谁负责","管生产必须管安全","全员参与","安全第一"],"answer":"C","why":"“安全生产，人人有责”直指全员参与原则——安全不只是领导和安全员的事，每个岗位每个人都要参与。谁主管谁负责、管生产必须管安全均只针对管理者，与“人人”不符。"},{"type":"单选","stem":"安全管理是在生产经营活动中进行的不断变化、不断完善的一种动态管理过程,因此,必须坚持 （　） 的安全生产管理原则。","options":["谁主管谁负责","管生产必须管安全","全员参与","持续改进"],"answer":"D","why":"题干“不断变化、不断完善、动态管理”是持续改进原则的关键词，安全管理如PDCA循环般螺旋上升、永无止境，故选D；其余三项与动态完善的描述无关。"},{"type":"多选","stem":"下列活动中,属于企业安全生产主要任务的是 （　）","options":["执行国家的有关法律、法规、方针、政策","分析研究生产、经营中存在的阻碍企业发展的因素","从组织、技术、管理上采取措施,消除或控制影响安全的因素","防止生产安全事故的发生","保证职工的安全和健康,保障国家财产安全"],"answer":"ACDE","why":"企业安全生产主要任务是执行国家法律法规方针政策，从组织、技术、管理上消除控制不安全因素，防止事故，保障职工安全健康和国家财产安全；B分析阻碍企业发展的因素属经营管理，不是安全任务。"},{"type":"单选","stem":"下面关于企业安全生产主要任务的描述,不准确的是 （　）","options":["企业应经常对各级领导、特种作业人员和所有职工进行安全教育、培训","企业应做好安全生产费用管理,保证安全生产投入,完善安全生产条件","企业应依据分包合同的约定,检查工程项目的进度及质量是否满足要求","企业应加强现场的安全管理,严格遵守安全生产操作规范"],"answer":"C","why":"企业安全生产主要任务围绕“安全”展开：教育培训、费用投入、现场安全管理均是；C检查工程项目的进度及质量属工程质量管理职责，不属于安全生产任务，故描述不准确。"},{"type":"单选","stem":"下面关于安全生产目标管理的描述,不正确的是 （　）","options":["安全生产目标管理就是围绕着安全生产目标而进行的一系列安全生产管理工作","施工企业应依据国家的总体发展目标,制订企业安全生产年度及中长期安全目标","安全管理目标应包括生产安全事故控制指标、安全生产及文明施工管理目标","安全生产管理目标一旦确定,应采取一系列措施去努力实现这些目标"],"answer":"B","why":"企业应依据自身安全生产状况和企业发展目标制定安全目标，而非依据“国家总体发展目标”，B偷换依据主体；A、C、D分别说明目标管理内涵、目标内容与执行要求，均正确。"},{"type":"单选","stem":"下面关于安全生产目标管理的任务描述,错误的是 （　）","options":["确定目标、合并目标","明确责任","落实措施","严格考核、实施奖惩"],"answer":"A","why":"安全生产目标管理的任务是确定目标、分解目标、明确责任、落实措施、严格考核与奖惩；A“合并目标”方向相反——目标要自上而下层层分解到部门和个人，不是合并。"},{"type":"多选","stem":"做好安全目标管理,应确定实现目标的措施和手段。其中措施应包括（　）","options":["组织措施、技术措施","目标完成的时间","目标完成应遵循的程序 E 目标的实现方法","目标的实现方法 D 落实目标的入员及负责人"],"answer":"ABCD","why":"实现目标的措施应包括组织措施、技术措施、目标完成时间、遵循的程序和实现方法；“落实目标的人员及负责人”属于明确责任的范畴，不属于措施本身，故E不选。"}]},{"file":"05第五章","title":"第五章","count":61,"questions":[{"type":"单选","stem":"下面关于安全生产决策机构的说法,不正确的是 （　）","options":["安全生产决策机构可以是安全生产委员会或安全生产决策岗位","安全生产决策机构的负责人是企业主要负责人","安全生产决策机构的负责人是企业的实际控制人","安全生产决策机构的负责人应为安全生产管理机构的负责人"],"answer":"D","why":"安全生产决策机构（安委会）的负责人应是企业主要负责人或实际控制人，安全生产管理机构负责人属执行层，不能反过来领导决策层，故D错误；A、B、C关于机构与负责人的说法正确。"},{"type":"单选","stem":"施工单位应当在（　）的领导下开展安全生产管理。","options":["企业主要负责人","项目负责人","企业技术负责人","企业专职安全管理人员"],"answer":"A","why":"依据《建设工程安全生产管理条例》，施工单位安全生产管理应在企业主要负责人领导下开展，他是本单位安全生产第一责任人。易误选B，项目负责人只对工程项目现场安全负责。"},{"type":"单选","stem":"关于中央施工企业安全生产委员会的有关规定,说法正确的是（　）","options":["各类企业均应成立安全生产委员会","董事长、党组书记、总经理对本企业安全生产工作共同承担领导责任","董事长承担领导责任","总经理承担领导责任"],"answer":"B","why":"中央施工企业的董事长、党组书记、总经理对本企业安全生产工作共同承担领导责任，C、D由单人承担领导责任的表述片面错误；A错，并非各类企业均强制成立安委会。"},{"type":"单选","stem":"关于安全生产委员会的组成,正确的是 （　）","options":["应由企业管理层人员及其直接领导下的各职能部门负责人组成","必须由企业管理层人员组成","必须由企业各部门负责人组成","应由安全生产管理机构的成员组成"],"answer":"A","why":"安全生产委员会应由企业管理层人员及其直接领导下的各职能部门负责人组成，兼顾决策权威与执行力度；B、C表述绝对化，D把安委会降格为安全管理部门的内设机构，均错误。"},{"type":"单选","stem":"通信施工企业的安全生产委员会每年度应有 （　）次以上安委会会议,并有安排、部署和记录","options":["3","4","5"],"answer":"A","why":"通信施工企业安委会每年度应召开3次以上会议，并有安排、部署和记录。数字考点：每年不少于3次。易凭感觉选4或5，记准“3次以上”即可。"},{"type":"单选","stem":"施工企业设置的负责安全生产管理工作的独立职能部门是 （　）","options":["企业安全生产决策机构","企业安全生产管理机构","企业安全生产参与机构","企业安全生产委员会"],"answer":"B","why":"企业安全生产管理机构是施工企业设置的负责安全生产管理工作的独立职能部门；安委会是议事决策机构，不是常设职能部门。易混淆决策机构与管理机构的定位差别。"},{"type":"单选","stem":"关于安全生产管理机构的设置,正确的是（　）","options":["各类企业均应设置","各种规模的企业均应设置","施工企业均应设置","中央施工企业必须设置"],"answer":"D","why":"安全管理机构并非任何企业都无条件设置，达到规定条件才需设置；中央施工企业必须设置，D正确；A、B、C“均应设置”过于绝对，不符合依据《安全生产法》的条件性设置要求。"},{"type":"单选","stem":"安全生产管理机构必须依法配齐配强 （　）等专业安全管理人员","options":["注册建筑师","注册项目管理师","注册安全工程师","高级工程师"],"answer":"C","why":"依据《安全生产法》规定，安全生产管理机构应依法配齐配强注册安全工程师等专业安全管理人员；注册建筑师、注册项目管理师、高级工程师均不是安全管理的法定专业资格。"},{"type":"单选","stem":"下面关于工程项目安全管理领导小组的说法,错误的是 （　）","options":["工程项目需要分包的,应成立项目安全管理领导小组","项目安全管理小组应配备考核合格的项目专职安全生产管理人员","总承包、专业承包和劳务分包单位的管理人员应为安全管理领导小组成员","劳务分包单位的技术员应为安全管理领导小组的成员"],"answer":"D","why":"项目安全管理领导小组应由总承包、专业承包和劳务分包单位的管理人员组成，劳务分包单位的技术员不是法定成员，故D错误；A成立条件、B专职安全员配备、C成员构成的说法均正确。"},{"type":"单选","stem":"企业最基本、最核心的安全生产管理制度是 （　）","options":["安全生产管理制度","安全生产检查制度","安全生产责任制度","安全隐患排查制度"],"answer":"C","why":"安全生产责任制度是企业最基本、最核心的安全生产管理制度，它把安全责任落实到岗到人，其他制度都围绕责任落实展开。口诀“责任制是核心”；A是各类制度的总称，易误选。"},{"type":"单选","stem":"企业建立健全安全生产管理制度,应以企业的 （　）为核心。","options":["职业健康","经济责任制","安全生产责任制","质量管理体系"],"answer":"C","why":"企业建立健全安全生产管理制度应以安全生产责任制为核心，与上题呼应：责任制既是核心也是基础。职业健康、经济责任制、质量管理体系都不是安全制度体系的核心。"},{"type":"单选","stem":"下面关于企业安全生产隐患排查与治理的要求,错误的是 （　）","options":["企业应建立健全生产安全事故隐患排查治理制度","发现一般事故隐患时,排查人员应立即上报,等待处理","企业应采取技术、管理措施,及时发现并消除事故隐患","企业记录的安全生产隐患应向从业人员通报"],"answer":"B","why":"发现一般事故隐患应立即整改处理，“立即上报等待处理”会延误除险时机，故B错误；重大隐患才需按规定上报并制定治理方案。A建制度、C采取措施、D向从业人员通报均正确。"},{"type":"多选","stem":"施工单位应当将施工现场的 （　）与作业区分开设置,并保持安全距离。","options":["绿化区","试验区","办公区","动火区","生活区"],"answer":"CE","why":"依据《建设工程安全生产管理条例》，施工现场的办公区、生活区应与作业区分开设置并保持安全距离。口诀“办公生活分开”；绿化区、试验区、动火区不属于该条款列举区域，误选D多是受危险联想。"},{"type":"单选","stem":"下面的安全生产责任制编制原则中,正确的是（　）","options":["应与工程项目的现场情况相适应","应突出重点、兼顾一般、抓住关键","在一定时期内应保持内容、要求不变","应满足建设单位、监理单位的要求"],"answer":"B","why":"企业安全生产责任制的编制原则是突出重点、兼顾一般、抓住关键；A“与工程现场相适应”针对项目层面责任制，C内容应动态修订而非一成不变，D编制依据是法规和企业实际而非建设单位要求。"},{"type":"多选","stem":"企业安全生产责任制涉及的内容,一般应包括 （　）","options":["企业的安全生产岗位","企业的安全生产责任人员","安全生产责任范围","安全生产检查制度","安全生产考核标准"],"answer":"BCE","why":"安全生产责任制一般应明确三要素：安全生产责任人员、责任范围、考核标准，即“谁负责、管什么、怎么考”；A岗位设置、D检查制度不属于责任制的组成要素。口诀“人员+范围+考核”。"},{"type":"单选","stem":"下述职责中,属于企业安全生产决策机构的是（　）。","options":["制定企业安全生产检查计划","研究解决企业安全生产工作中的重大问题","监督在建工程项目安全生产费用的使用情况","参加生产安全事故的调查和处理工作"],"answer":"B","why":"决策机构（安委会）管宏观决策，研究解决企业安全生产工作中的重大问题；制定检查计划、监督费用使用、参加事故调查属管理部门或执行层职责。抓“重大问题”对应“决策”二字。"},{"type":"单选","stem":"下述职责中,属于企业安全生产决策机构的是 （　）。","options":["研究决定企业安全生产方面的奖惩事项","制定企业安全生产检查计划","监督在建项目安全生产费用的使用","参加生产安全事故的调查和处理工作"],"answer":"A","why":"研究决定企业安全生产方面的奖惩事项属重大决策，应由安委会研究决定；制定检查计划、监督费用使用、参加事故调查是管理部门的日常性工作。规律：安委会管大事，部门管具体事。"},{"type":"单选","stem":"下述职责中,属于企业安全生产管理部门的是（　）","options":["研究决定企业安全生产方面的奖惩事项","监督在建工程项目安全生产费用的使用","研究解决企业安全生产工作中的重大问题","确定企业的安全生产管理方针"],"answer":"B","why":"监督在建工程项目安全生产费用使用属安全生产管理部门的日常监管职责；研究决定奖惩、研究解决重大问题、确定管理方针均属决策机构职权。区分口诀：决策定方针，部门抓监督。"},{"type":"单选","stem":"下述职责中,属于企业安全生产管理部门的是 （　）","options":["研究决定企业安全生产方面的奖惩事项","制订企业安全生产考核计划","研究解决企业安全生产工作中的重大问题","确定企业的安全生产管理方针"],"answer":"B","why":"制订企业安全生产考核计划是安全生产管理部门的职责；研究决定奖惩、研究解决重大问题属决策机构，确定安全管理方针属决策层。注意“制订计划”与“研究决定”的层级差别。"},{"type":"单选","stem":"按照《施工企业安全生产管理规范》GB50656-2011) 的条文说明的规定,下列职责中,属于技术管理部门的是（　）","options":["协调配置安全生产所需的各项资源","监督检查机械设备和仪表的合规性","参与设备、仪表施工组织设计的会审","组织编制、审查专项安全施工方案"],"answer":"D","why":"依据GB50656-2011条文说明，组织编制、审查专项安全施工方案专业性强，属技术管理部门职责；协调配置资源、监督检查设备仪表、参与会审分属其他部门。口诀：技术方案技术部门管。"},{"type":"单选","stem":"按照《施工企业安全生产管理规范》GB50656-2011) 的条文说明的规定,下列职责中,属于设备仪表管理部门的是 （　）","options":["协调配置安全生产所需的各项资源","制订安全技术措施和安全操作规程","参与机械设备施工组织设计的会审","组织编制、审查专项安全施工方案"],"answer":"C","why":"设备仪表管理部门参与机械设备施工组织设计的会审，体现“谁主管谁参与”；制订安全技术措施和安全操作规程、审查专项方案属技术管理部门，协调资源属综合管理职责。"},{"type":"单选","stem":"按照《施工企业安全生产管理规范》GB50656-2011) 的条文说明的规定,下列职责中,属于物资管理部门的是 （　）。","options":["协调配置安全生产所需的各项资源","监督检查机械设备和仪表的合规性","负责劳动防护用品的安全管理工作","组织编制、审查专项安全施工方案"],"answer":"C","why":"劳动防护用品属物资范畴，其安全管理工作由物资管理部门负责；协调资源、检查设备仪表、审查专项方案分属其他部门。记忆口诀：劳保用品就是物资，归物资部门管。"},{"type":"单选","stem":"按照《施工企业安全生产管理规范》(GB50656-2011) 的条文说明的规定,其他职能部门的安生产职责,人力资源部门的是 （　）","options":["审查安全管理人员资格","负责劳动防护用品的安全管理","审查劳务分包人员资格","协助办理安全奖、罚手续"],"answer":"A","why":"人员资格审查属人事管理范畴，审查安全管理人员资格由人力资源部门负责；劳动防护用品归物资部门，劳务分包人员资格、协助办理安全奖罚手续分属其他相关部门。规律：管人的部门审人的资格。"},{"type":"多选","stem":"下列安全生产职责中,属于建筑施工企业安全生产领导小组的主要职责的是（　）","options":["编制并适时更新安全生产管理制度并监督实施","编制项目生产安全事故应急救援预案并组织实施","参加生产安全事故的调查和处理工作","协调配备项目专职安全生产管理人员","组织编制危险性较大工程安全专项施工方案"],"answer":"BE","why":"依据建质〔2008〕91号文，安全生产领导小组职责聚焦项目层面：编制项目生产安全事故应急救援预案并组织实施、组织编制危险性较大工程安全专项施工方案；A编制更新安全管理制度、C参加事故调查处理、D协调配备专职安全员属企业安全生产管理机构职责，故选BE。"},{"type":"判断","stem":"安全生产责任制涉及的人员范围为企业主要负责人到基层管理岗位人员。（　）","options":[],"answer":"错","why":"错。安全生产责任制的人员范围应覆盖从企业主要负责人到一线作业人员的全体人员，并非只到基层管理岗位为止；现场作业人员同样要纳入，做到全员覆盖、人人有责。"},{"type":"单选","stem":"不属于施工企业主要负责人安全生产主要管理工作的是 （　）","options":["领导企业安全生产管理工作","组织制定企业中长期安全管理目标和制度","做好施工现场的安全生产检查工作","审议、决策重大安全事项"],"answer":"C","why":"企业主要负责人的职责是宏观领导：领导企业安全管理工作、组织制定中长期安全管理目标和制度、审议决策重大安全事项；做好施工现场安全检查是项目和专职安全员的职责，不属于其范围。"},{"type":"单选","stem":"下列安全生产管理职责中,属于企业主要负责人安全生产管理职责的是 （　）","options":["实施企业安全生产规章制度","实施企业制定安全生产操作规程","参加企业组织的安全生产教育培训","与现场施工人员签订安全生产责任书"],"answer":"A","why":"主要负责人负责组织实施企业安全生产规章制度；B操作规程由现场作业人员执行，C参加教育培训是全员义务，D主要负责人应与项目负责人签订责任书而非与现场施工人员签订。"},{"type":"多选","stem":"主要负责人与项目负责人签订的安全生产责任书的内容必须包括（　）。","options":["项目安全生产考核目标","项目安全生产奖惩措施","项目部应采购的劳动保护用品","项目承包额","企业为项目提供的安全管理和技术保障措施"],"answer":"ABE","why":"责任书必须包括项目安全生产考核目标、项目安全生产奖惩措施、企业为项目提供的安全管理和技术保障措施；项目部采购劳动保护用品和项目承包额属物资与商务范畴。口诀“目标+奖惩+保障”。"},{"type":"多选","stem":"企业与项目负责人签订的安全生产责任书的内容必须包括 （　）","options":["项目安全生产考核目标","项目安全生产奖惩措施","项目部应采购的劳动保护用品","项目的施工费承包额","企业为项目提供的安全管理和技术保障措施"],"answer":"ABE","why":"同一考点：安全生产责任书必备内容为考核目标、奖惩措施、企业为项目提供的安全管理和技术保障措施三项；施工费承包额与防护用品采购属商务物资事项，不属于责任书必备内容。"},{"type":"单选","stem":"关于通信施工企业主要负责人的安全职责,下面表述中错误的是（　）","options":["主要负责人对本企业安全生产工作全面负责","主要负责人应督促检查本企业安全生产工作","消除安全事故隐患由专职安全生产管理人员和项目负责人,企主要负责人分别负责","主要负责人应当与项目负责人签订安全生产责任书"],"answer":"C","why":"依据《安全生产法》，督促检查本企业安全生产工作、及时消除事故隐患是主要负责人的法定职责，不能推给专职安全员和项目负责人“分别负责”，C推卸了主要负责人的隐患治理责任，故错误。"},{"type":"单选","stem":"关于通信施工企业主要负责人的安全职责,下面表述中错误的是（　）","options":["主要负责人应当按规定检查企业所承担的工程项目","主要负责人应当考核项目负责人安全生产管理能力","必要时,主要负责人可以调整项目负责人","主要负责人应当明确项目管理人员的安全职责"],"answer":"D","why":"主要负责人应当按规定检查企业所承担的工程项目、考核项目负责人安全生产管理能力、必要时调整项目负责人；“明确项目管理人员的安全职责”是项目负责人的职责，不属于企业主要负责人，故D错误。"},{"type":"单选","stem":"下列职责中,属于企业主管安全生产负责人的安全生产职责的是（　）","options":["审批施工组织设计和专项施工方案","监督、检查安全生产费用使用情况","组织实施安全工作规划及实施计划","组织审查新工艺实施过程的安全性"],"answer":"C","why":"主管安全生产负责人协助主要负责人抓落实，负责组织实施安全工作规划及实施计划；审批施工组织设计和专项方案、审查新工艺安全性是技术负责人的技术把关职责，监督安全费用使用是管理部门职责。"},{"type":"单选","stem":"下列职责中,属于企业技术负责人的安全生产职责的是 （　）。","options":["审批施工组织设计和专项施工方案","监督、检查安全生产费用使用情况","组织实施安全工作规划及实施计划","监督企业安全生产教育工作开展情况"],"answer":"A","why":"技术负责人负责安全技术把关，审批施工组织设计和专项施工方案是其标志性职责；组织实施安全工作规划属主管安全负责人，监督安全费用、监督安全教育开展分属管理部门与主管领导。口诀“方案技术负责人审”。"},{"type":"单选","stem":"企业的安全生产管理人员不包括（　）","options":["企业安全生产管理机构的人员","分支机构专职从事安全生产管理工作的人员","工程项目专职从事安全生产管理工作的人员","工程项目的兼职安全巡查人员"],"answer":"D","why":"企业安全生产管理人员指专职从事安全管理工作的人员：企业安全机构人员、分支机构及工程项目专职安全管理人员；兼职安全巡查人员不在专职序列。抓“专职”二字即可锁定D。"},{"type":"单选","stem":"下列关于企业专职安全生产管理人员的安全生产管理职责,说法错误的是 （　）。","options":["检查在建项目安全生产管理情况","发现安全事故隐患,应及时向政府有关机构报告","对达到一定规模的危险性较大的分部分项工程进行现场监督","对工程施工的重点部位和关键环节进行现场监督"],"answer":"B","why":"专职安全管理人员发现事故隐患应向企业安全生产管理机构报告，而非直接向政府有关机构报告，B流程错误；向政府上报事故由单位按规定进行。A、C、D的现场检查监督职责均正确。"},{"type":"单选","stem":"下列安全生产要求中,不属于企业对项目负责人的安全生产要求是（　）","options":["项目负责人应取得相应的执业资格","项目负责人应经安全生产考核合格","企业应与项目负责人签订安全生产责任书","企业应与项目负责人签订承包合同"],"answer":"D","why":"企业对项目负责人的安全生产要求包括取得相应执业资格、经安全生产考核合格、签订安全生产责任书；签订承包合同属经营管理行为，与安全生产要求无关，故D不属于。"},{"type":"多选","stem":"企业与项目负责人签订的安全生产责任书的内容必须包括 （　）","options":["项目安全生产考核目标","项目安全生产奖惩措施","项目部应采购的劳动防护用品","项目部的施工费承包额","企业为项目提供的安全管理和技术保障措施"],"answer":"ABE","why":"安全生产责任书必须包括项目安全生产考核目标、奖惩措施、企业为项目提供的安全管理和技术保障措施；劳动防护用品采购与施工费承包额属商务物资事项，不是责任书法定内容。口诀“目标+奖惩+保障”。"},{"type":"单选","stem":"工程项目施工现场安全生产第一责任人是 （　）","options":["企业法人","企业主管安全生产的负责人","项目负责人","项目专职安全生产管理人员"],"answer":"C","why":"项目负责人（项目经理）是工程项目施工现场安全生产第一责任人，对施工现场安全全面负责；企业法人是企业层面的第一责任人，专职安全员是监督检查者，均不能充当现场第一责任人。"},{"type":"单选","stem":"下列工程项目负责人的安全生产职责中,描述错误的是 （　）","options":["应当建立项目安全生产管理体系","负责编制工程项目施工组织设计","负责组织落实企业的安全生产责任制","负责组织落实企业安全生产规章制度"],"answer":"B","why":"施工组织设计由项目技术负责人组织编制，项目负责人负责审批把关，“编制”不是项目负责人的职责，B错误；建立项目安全管理体系、组织落实责任制和规章制度均是其职责。"},{"type":"单选","stem":"下列工程项目负责人的安全生产职责中,描述错误的是（　）","options":["负责编制项目的施工组织设计","监控危险性较大分部分项工程","及时排查处理现场安全事故隐患","与分包企业签订安全生产协议书"],"answer":"A","why":"同上考点：项目施工组织设计的编制主体是项目技术负责人，A错误；项目负责人应监控危险性较大分部分项工程、及时排查处理隐患、与分包企业签订安全生产协议书，均正确。"},{"type":"多选","stem":"项目负责人应当按照规定实施项目安全生产管理,（　） 隐患排查处理情况应当记入项目安全管理档案。","options":["监控危险性较大分部分项工程","定期考核分包企业安全生产管理情况","每天在施工现场开展安全生产检查","及时排查处理施工现场安全事故隐患","建立健全企业安全生产管理体系"],"answer":"ABD","why":"项目负责人应将监控危险性较大分部分项工程、定期考核分包企业安全生产管理情况、及时排查处理隐患的情况记入项目安全管理档案；“每天检查”频次说法错误，建立健全企业安全管理体系是企业层面职责。"},{"type":"多选","stem":"施工安全技术交底应向施工作业班组、作业人员进行详细说明的内容有（　）","options":["施工安全重点部位","施工安全重点环节","安全施工所需费用","安全施工技术要求","安全施工技术措施"],"answer":"ABDE","why":"安全技术交底应向作业班组、作业人员详细说明施工安全重点部位、重点环节、安全施工技术要求和措施；安全施工所需费用属成本管理范畴，与交底内容无关。口诀“交底谈安全、不谈钱”。"},{"type":"单选","stem":"必须在安全技术交底记录上签字的人员是 （　）","options":["项目负责人","项目设计人员","项目技术人员","项目监理人员"],"answer":"A","why":"项目负责人作为施工现场安全生产第一责任人，必须在安全技术交底记录上签字，以督促交底落实到班组和个人；项目设计人员、监理人员不参与施工单位内部交底的签字环节。"},{"type":"单选","stem":"下列施工现场班组长的安全生产职责中,描述错误的是 （　）","options":["负责进行项目施工组织设计交底工作","贯彻执行企业的安全生产的规定和要求","督促本班组的工人遵守安全生产规章","督促本班组的工人遵守安全操作规程"],"answer":"A","why":"施工组织设计交底由项目技术负责人向有关人员实施，属项目技术管理层职责，不是班组长的活，A错误；班组长负责贯彻执行企业安全规定，督促本班组工人遵守规章和操作规程。"},{"type":"多选","stem":"施工企业不参加安全生产考核的人员是 （　）","options":["各管理层的主要负责人","安全生产相关职能部门及岗位的管理人员","工程项目的管理人员","施工现场的作业人员"],"answer":"ABC","why":"须参加安全生产考核的是“三类人员”（企业主要负责人、项目负责人、专职安全生产管理人员）及经教育培训考核合格的作业人员；各管理层主要负责人、职能部门及岗位管理人员、一般项目管理人员不属于强制考核对象。易把“项目管理人员”与持B证的项目负责人混淆。"},{"type":"单选","stem":"下列行为中,不属于安全生产处罚范围的是 （　）","options":["偶尔出现安全生产考核成绩不达标的问题","没有及时对提出的问题进行整改","在生产安全事故中不积极抢救,而导致事故扩大化","在抢险活动中,项目负责人冒险作业导致身体残疾"],"answer":"D","why":"在抢险救灾活动中冒险作业致伤属保护国家和人民利益的行为，应给予抚恤和优待而非处罚，故D不属于处罚范围；考核成绩不达标不整改、不积极抢救致事故扩大均应处罚。易误选C，失职扩大事故是典型处罚情形。"},{"type":"多选","stem":"应受到安全生产处罚的行为是 （　）","options":["强令职工冒险作业","冒险抢修损毁设施","重复发生安全事故","破坏或伪造事故现场","瞒报、谎报或不及时上报安全事故"],"answer":"ACDE","why":"强令职工冒险作业、重复发生安全事故、破坏或伪造事故现场、瞒报谎报迟报事故均属严重违法违规行为，应受处罚；“冒险抢修损毁设施”属抢险应急行为，不在处罚之列。规律：抢险免责，强令必罚。"},{"type":"单选","stem":"通信建设工程安全生产涉及工程的规划设计、建设安装、生产调试、生产运行、技术改造等系列活动。因此,企业建立安全生产管理制度应遵循 （　）","options":["安全第一,预防为主,综合治理原则","主要负责人的原则","系统性原则","规范化和标准化原则"],"answer":"C","why":"通信建设安全贯穿规划设计、建设安装、生产调试、运行、技改等系列活动全过程，建立制度须统筹覆盖各环节，故遵循系统性原则；十二字方针是总方针，不是针对题干情境的编制原则。"},{"type":"单选","stem":"企业建立安全生产管理制度应坚持规范化和标准化原则,这是因为（　）","options":["要保证有效调动和使用企业的所有资源","要保证制度的目的明确,流程清晰,标准准确","制度涉及企业经的每个环节、岗位"],"answer":"B","why":"坚持规范化和标准化原则是为了保证制度目的明确、流程清晰、标准准确，便于执行和考核；“调动使用所有资源”是系统性原则的作用，“涉及每个环节岗位”说的是全面性，均非其直接原因。"},{"type":"多选","stem":"按照标准化工作体系建立的安全生产管理制度,一般把安全生产管理制度分为（　）等几类体系。","options":["规范标准 C 工作标准","工作标准 B 技术标准","管理标准","系统标准"],"answer":"BCD","why":"按标准化工作体系，安全生产管理制度分为技术标准、管理标准、工作标准三大类，分别覆盖技术操作、管理流程和岗位职责；“规范标准”“系统标准”不是标准化体系的分类名称。口诀“技、管、工”。"},{"type":"单选","stem":"下列安全生产管理制度中,属于综合管理类管理制度的是 （　）","options":["安全教育培训制度","定期巡视检查制度","安全技术管理制度","职业卫生管理制度"],"answer":"C","why":"按教材对制度的划分，安全技术管理制度属于综合管理类制度；安全教育培训、定期巡视检查、职业卫生管理属于专项业务管理制度，综合覆盖面不同。易把教育培训误当成综合管理类。"},{"type":"单选","stem":"下列综合管理类安全管理制度中,属于安全技术管理制度的是（　）","options":["施工组织设计编制、审核和审批制度","隐患排查和治理制度","劳动防护用品发放、使用和管理制度","安全生产监督检查制度"],"answer":"A","why":"施工组织设计的编制、审核和审批是对安全技术方案的层层把关，属安全技术管理制度；隐患排查治理、防护用品管理、监督检查制度属综合管理类中的安全管理类制度，不属于安全技术类。"},{"type":"单选","stem":"安全管理定期例行工作不包括（　）","options":["定期安全分析会议","定期安全学习制度","定期进度报表制度","定期安全生产检查"],"answer":"C","why":"定期安全分析会议、定期安全学习、定期安全生产检查均属安全管理定期例行工作；定期进度报表属工程进度管理，与安全管理无关，故C不包括。抓“安全”关键词即可排除干扰项。"},{"type":"单选","stem":"不属于承包、分包与发包工程安全管理制度内容的是（　）","options":["参与各方的安全责任","安全生产管理协议 D 施工安全的组织措施","施工安全的组织措施 C 费用变更索赔条款"],"answer":"C","why":"承包、分包与发包工程安全管理制度内容包括参与各方的安全责任、安全生产管理协议、施工安全的组织措施；费用变更索赔条款属商务合同内容，不属安全管理制度。规律：安全制度不谈钱。"},{"type":"单选","stem":"不属于安全生产监督检查制度内容的是（　）","options":["安全检查的人员","安全检查执行的标准","安全检查的费用标准","安全检查的内容、方式"],"answer":"C","why":"安全生产监督检查制度应明确检查人员、执行标准、检查内容与方式；安全检查的费用标准属财务成本范畴，不属监督检查制度内容。与上题同规律：钱的问题不进安全制度。"},{"type":"多选","stem":"安全防护用品发放、使用和管理制度应明确（　）","options":["用品的种类","用品的使用范围","用品合格标准","用品领用程序","用品寿命周期"],"answer":"ABDE","why":"安全防护用品制度应明确用品种类、使用范围、领用程序和寿命周期；用品合格与否以国家标准、行业标准为准，企业制度无需自行规定“合格标准”，故C不选。"},{"type":"多选","stem":"安全生产管理持证上岗制度应明确（　）","options":["安全生产管理岗位、证件名称","持证人员资格条件","持证上岗考核内容","持证上岗考核费用","所持证书的有效期"],"answer":"AE","why":"安全生产管理持证上岗制度应明确安全生产管理岗位及证件名称、所持证书的有效期，便于对证上岗、按期复审换证；资格条件、考核内容与费用由考核管理规定另行明确，不属该制度必备事项。"},{"type":"单选","stem":"企业设备设施安全管理定期检测、检验制度不明确 （　）","options":["企业必须进行定期检测的设备种类、名称、数量","有权进行检测的部门或人员","检测、检验费用的执行标准","监测的标准及检测结果管理"],"answer":"C","why":"设备设施定期检测检验制度应明确检测设备的种类名称数量、有权检测的部门人员、检测标准及结果管理；检测检验费用的执行标准由财务规定，不属该制度内容。规律：费用问题不进安全制度。"},{"type":"单选","stem":"企业安全生产管理制度的制定步骤应为 （　）","options":["起草一征求意见一签发一审核一发布一培训一反馈一持续改进","反锁一起草一征求意见一签发一审核一发布一培训一持续改进","起草一征求意见-审核一签发一发布一培训一反馈一持续改进","反馈一起草一征求意见一审核一签发一发布一持续改进一培训"],"answer":"C","why":"制度制定流程为：起草、征求意见、审核、签发、发布、培训、反馈、持续改进。A把签发排在审核之前，未审先签不合逻辑；B、D把反馈放最前，颠倒了闭环顺序。口诀“草征审签发，训馈改”。"},{"type":"单选","stem":"企业制定安全生产管理制度的准备过程中,审核工作的正确做法是（　）","options":["制度在征求意见时,不能达成一致,则应由分管领导组织讨论","涉及规范标准的制度,应由企业负责法务的部门进行合规性审查","涉及全员性的制度,应经过职工代表大会或职工代表进行审核","专业技术性较强的管理制度,应由企业安全主管部门负责审核"],"answer":"C","why":"涉及全员性的制度应经职工代表大会或职工代表审核，体现职工参与和民主管理，C正确；征求意见不一致应由牵头部门协调讨论，涉及规范标准的应做标准化合规审查，专业技术性强的应由技术部门审核。"},{"type":"单选","stem":"涉及全局性综合管理的安全生产管理制度,应由企业 （　）签发","options":["主要负责人","主管生产的领导或总工程师","安全主管部门","技术管理部门"],"answer":"A","why":"涉及全局性、综合管理的安全生产制度须由企业主要负责人签发，体现其对安全生产全面负责；主管生产领导或总工程师签发的是技术类制度，部门无权签发全局性制度。签发权限对应责任层级。"}]},{"file":"06第六章","title":"第六章","count":61,"questions":[{"type":"判断","stem":"企业应按规定取得行业学会颁发的安全生产许可证,按时办理延期手续。（　）","options":[],"answer":"错","why":"错。依据《安全生产许可证条例》，建筑施工企业安全生产许可证由政府住房城乡建设主管部门颁发；行业学会是社会团体，无行政许可权。企业应依法取得许可证并按时办理延期手续。"},{"type":"单选","stem":"以下那项作业不是通信行业中的常见的特种作业 （　）","options":["电工作业","高处作业","电焊作业","手持电钻作业"],"answer":"D","why":"电工作业、高处作业、电焊作业均属特种作业目录内的常见作业；手持电钻作业属一般工种作业，风险相对可控，不列入特种作业，故D不是。易误选B，焊割恰是典型特种作业。"},{"type":"单选","stem":"以下哪项作业不需要人员持《特种作业人员操作证》（　）","options":["制冷与空调设备安装修理作业","金属热切割作业","站在 2 米高处架设线缆","机房地面钻孔作业"],"answer":"D","why":"制冷与空调设备安装修理、金属热切割属特种作业，站在2米及以上高处架设线缆属高处作业，均须持《特种作业人员操作证》；机房地面钻孔属一般作业，无需持证。数字考点：2米即高处作业门槛。"},{"type":"多选","stem":"下列工种中,属于特种作业的是 （　）","options":["电工作业","金属焊接与切割作业","机动车辆驾驶","制冷与空调作业","登高架设作业"],"answer":"ABDE","why":"依据特种作业目录，电工作业、金属焊接与切割作业、制冷与空调作业、登高架设作业均属特种作业；机动车辆驾驶属特种设备作业人员管理范畴，不在特种作业目录内。易混淆“特种作业”与“特种设备作业”两套持证体系。"},{"type":"判断","stem":"特种作业操作证有效期为 6 年,在考试所在省范围内有效。（　）","options":[],"answer":"错","why":"错。特种作业操作证有效期为6年，在全国范围内有效，并非只在考试所在省范围内有效；每3年复审一次。错误点在证书的地域效力范围。"},{"type":"单选","stem":"登高证有效期为（　） 年,在全国范围内有效","options":["1 年","3 年","5 年","6 年"],"answer":"D","why":"登高架设作业操作证即特种作业操作证，有效期6年且在全国范围内有效。数字考点：有效期6年、每3年复审；选项中的3年、5年均为干扰数字。"},{"type":"单选","stem":"离开特种作业岗位达（　） 以上的特种作业人员,应当重新进行实际操作考核,经确认合格后方可上岗作业。","options":["个月","6 个月","一年","两年"],"answer":"B","why":"依据特种作业人员管理规定，离开特种作业岗位6个月以上的人员，重新上岗前应当重新进行实际操作考核，合格后方可作业。口诀“离岗半年、重考实操”；一年、两年均为干扰数字。"},{"type":"单选","stem":"关于特种作业操作证的管理时限,说法正确的是 （　）","options":["证书的有效期为 5 年,在全国范围内有效","作业人员离开特种作业岗位 6 个月以上应重新取证","证书每 3 年复审 1 次","连续 10 年以上的证书,可每 6 年复审 1 次"],"answer":"C","why":"特种作业操作证有效期6年、全国有效，每3年复审1次，C正确；A有效期应为6年；B应为重新进行实际操作考核而非重新取证；D中连续从业10年以上复审可延长至6年，但须经发证机关同意，表述过于绝对。"},{"type":"单选","stem":"通信工程必须在施工前向建设单位报批后才可以开始施工的作业是（　）","options":["机房内使用电动砂轮机","直埋线路跨越河流施工","架空线路与电力线交越作业","架空线路与铁路交越作业"],"answer":"A","why":"机房内在用设备运行环境受控，使用电动砂轮机会产生金属粉尘和火花，危及设备安全，施工前须向建设单位报批；架空线路与电力线、铁路交越作业按相应主管部门规定办理跨越手续，不属向建设单位报批事项。"},{"type":"单选","stem":"下面关于动火作业的管理要求,错误的是 （　）","options":["多个动火点办理一张动火证","不得随意涂改和转让动火证","不得扩大动火证的使用范围","动火证超过期限应重新办理"],"answer":"A","why":"动火管理要求“一点一证”，每个动火点须单独办理动火证，多个动火点共用一张动火证是典型违章，A错误；不得涂改转让、不得扩大使用范围、超期重新办理均为正确要求。"},{"type":"多选","stem":"通信工程应办理动土作业审批的工作有 （　）","options":["挖电缆沟","挖电杆坑、拉线坑","直埋线路工程敷设排流线","线路工程埋设防雷接地线","设备工程埋设地网"],"answer":"AE","why":"局站场地内动土易损坏地下光电缆、接地网等隐蔽设施，故挖电缆沟、设备工程埋设地网应事前办理动土作业审批；野外直埋线路的杆坑拉线坑、排流线、防雷接地施工属线路常规土方作业，不在此列。"},{"type":"单选","stem":"通信工程必须在施工前向建设单位报批后才可以开始施工作业是（　）","options":["架空线路与电力线交越作业","直埋线路与铁路交越作业","机房内交换设备割接作业","机房内用电热吹风机作业"],"answer":"C","why":"机房内交换设备割接直接影响现网运行安全，必须在施工前向建设单位报批并经同意后方可实施；与电力线交越作业办理的是电力等主管部门的跨越手续。规律：涉及现网安全的作业报建设单位审批。"},{"type":"单选","stem":"下面关于施工企业安全技术措施的说法,错误的是（　）","options":["安全技术措施用于防止人身伤害、改善劳动条件","安全技术措施用于消除生产过程中的不安全因素","安全技术措施必须按照国家的经济发展规划编制","工程项目的安全技术措施必须在开工前针对工程中的危险因素编制"],"answer":"C","why":"安全技术措施针对工程中的危险因素编制，用于防止人身伤害、消除不安全因素、改善劳动条件，与国家经济发展规划无关，C错误；开工前针对危险因素编制是强制性要求。"}
