<script>
const SEGS = [{"tag": "第1题 · 单选", "text": "第一题。考点：安全生产法的立法时间。我国最早的一部安全生产法，是哪一年制定的？"}, {"tag": null, "text": "答案是二零零二年。二零一四年、二零一六年都是后来修改的年份，不是制定。口诀：零二制定，一四、二一两次大修。"}, {"tag": "第2题 · 单选", "text": "第二题。考点：现行安全生产法的施行时间。现行的安全生产法，从哪一天开始施行？"}, {"tag": null, "text": "答案是二零二一年九月一日。注意区分：六月十日是人大常委会通过修改的日子，九月一日才是施行日。口诀：六一通过，九一施行。"}, {"tag": "第3题 · 单选", "text": "第三题。考点：安全生产法管谁。适用范围，哪个说法最准确？"}, {"tag": null, "text": "答案：在我国领域内，从事生产经营活动的单位。关键词是从事生产经营活动，跟是不是独立法人、有没有工商注册没关系。只要在咱们国家搞生产经营，安全生产法就管。"}, {"tag": "第4题 · 判断", "text": "第四题，判断题。先讲知识点。安全生产工作的十二字方针：安全第一、预防为主、综合治理。"}, {"tag": null, "text": "对照题目：题目说，安全第一、预防为主、科技创新。它把综合治理偷换成了科技创新，所以这题是错的。看到方针里出现科技创新，就是坑。"}, {"tag": "第5题 · 多选", "text": "第五题，多选。考点：安全生产工作的机制。正确的是四条。"}, {"tag": null, "text": "生产经营单位负责；职工参与；政府监管；行业自律。"}, {"tag": null, "text": "错的是社会共享。原文是社会监督，不是社会共享，又是改一个词的老套路。口诀：单位负责、职工参与、政府监管、行业自律、社会监督。"}, {"tag": "第6题 · 多选", "text": "第六题，多选。考点：生产经营单位在生产经营过程中必须做到什么。正确的是四条。"}, {"tag": null, "text": "遵守安全生产法律法规；加强安全生产管理，确保安全生产；建立健全安全生产责任制和规章制度；改善安全生产条件，加强标准化、信息化建设。"}, {"tag": null, "text": "错的是第一条，它说管安全必须管生产，方向反了。正确理念是：管生产必须管安全。谁管生产，谁就要管安全。"}, {"tag": "第7题 · 单选", "text": "第七题。考点：谁是本单位的安全生产第一责任人。答案是：主要负责人，也就是一把手。"}, {"tag": null, "text": "分管安全的副总、安全总监、注册安全工程师，都不是第一责任人。口诀：第一责任人，永远是主要负责人。"}, {"tag": "第8题 · 多选", "text": "第八题，多选。考点：工会在安全生产里的职责。记住关键词：工会是监督和维护，不是管理。"}, {"tag": null, "text": "正确的是三条：依法组织职工参加安全生产工作的民主管理；依法组织职工参加民主监督；维护职工在安全生产方面的合法权益。"}, {"tag": null, "text": "错的两条，都是把工会说成对安全生产工作负责、进行管理。工会没有这个权。记法：工会只监督、只维护，不管理、不负责。"}, {"tag": "第9题 · 判断", "text": "第九题，判断题。先讲知识点：乡镇人民政府，是一级政府；街道办事处，才是政府的派出机关。这两个身份不一样。"}, {"tag": null, "text": "对照题目：题目把乡镇政府也说成派出机关，身份说错了，所以这题是错的。乡镇和街道对安全生产有监督检查职责，这个没错，错在派出机关这个说法。"}, {"tag": "第10题 · 多选", "text": "第十题，多选。考点：乡镇政府和街道办在安全生产上该干什么。正确的是三条。"}, {"tag": null, "text": "一，按照职责，对区域内的生产经营单位安全生产状况进行监督检查；二，按照授权，依法履行安全生产监督管理职责；三，协助人民政府有关部门。"}, {"tag": null, "text": "错的两条：实施综合监督管理，那是应急管理部门的活；说乡镇街道有执法权，也不对，它们只能监督检查。记法：能检查、能协助，没综合、没执法。"}, {"tag": "第11题 · 判断", "text": "第十一题，判断题。先讲知识点：安全生产监管分两条线。应急管理部门，对安全生产实施综合监督管理；住建、交通这些行业主管部门，在各自职责范围内管本行业。"}, {"tag": null, "text": "对照题目：题目说安全生产监管部门去做专业监管、行业管理和指导，把综合监管和行业监管搞混了，所以错。记法：应急管综合，行业部门管行业。"}, {"tag": "第12题 · 判断", "text": "第十二题，判断题。知识点：负有安全生产监督管理职责的部门，是一个统称，包括两拨：应急管理部门，加上对有关行业、领域实施监督管理的部门。"}, {"tag": null, "text": "对照题目，说法完全一致，所以是对的。这个统称后面会反复出现，记住它包含应急管理部门和行业主管部门。"}, {"tag": "第13题 · 多选", "text": "第十三题，多选。考点：安全生产所必需的资金投入，由谁来保证？正确的是三个。"}, {"tag": null, "text": "生产经营单位的决策机构；主要负责人；个人经营的投资人。一句话：拍板的和掏钱的来保证。"}, {"tag": null, "text": "错的两条：安全生产管理机构，它是干活的部门，不掌钱；项目负责人，他是花钱的，不负责保证钱。口诀：决策机构、一把手、投资人。"}, {"tag": "第14题 · 判断", "text": "第十四题，判断题。知识点：安全生产费用，法律原文是专门用于改善安全生产条件。注意是专门，一分钱都不能挪用。"}, {"tag": null, "text": "对照题目：题目说的是主要用于。主要和专门一字之差，主要就意味着还能挪一部分干别的，所以这题错。看到安全生产费用主要用于，就选错。"}, {"tag": "第15题 · 多选", "text": "第十五题，多选。考点：哪些单位必须配备专职安全生产管理人员。正确的是四个。"}, {"tag": null, "text": "建筑施工企业；通信施工企业；客运公司；烟花销售公司。这四类都是高危行业。"}, {"tag": null, "text": "错的是餐饮企业，它风险低，不强制配专职。判断技巧：越是容易出人命的行业，越要专职。"}, {"tag": "第16题 · 判断", "text": "第十六题，判断题。知识点：一般单位，超过一百人才强制设安全生产管理机构或配专职安全员；一百人以下，专职或兼职都行。但建筑施工是高危行业，要求更严。"}, {"tag": null, "text": "对照题目：建筑施工企业，哪怕从业人员不到一百人，也应当设安全生产管理机构，或者配专职安全员。所以这题是对的。记住：建筑行业，人再少也要专职。"}, {"tag": "第17题 · 单选", "text": "第十七题。考点：非高危单位配安全员的门槛。矿山、金属冶炼、建筑施工、运输、危险物品这些高危行业以外的其他单位，多少人以下应当配专职或者兼职安全员？"}, {"tag": null, "text": "答案：一百人以下。对比记：高危行业，不管多少人都要专职；一般单位一百人以下，专职兼职都可以；一旦超过一百人，就必须设机构或配专职。"}, {"tag": "第18题 · 判断", "text": "第十八题，判断题。知识点：生产经营单位作出涉及安全生产的经营决策，应当听取安全生产管理机构以及安全生产管理人员的意见。"}, {"tag": null, "text": "对照题目，一字不差，所以是对的。记法：动安全的决策，先问安全员。"}, {"tag": "第19题 · 单选", "text": "第十九题。考点：主要负责人和安全生产管理人员必须具备的两样东西。除了安全生产知识，还得有什么？"}, {"tag": null, "text": "答案：管理能力。干扰项是管理经历、相关学历、救援能力。法条要的是知识和能力，不看学历，不要求救援。口诀：一知识，一能力。"}, {"tag": "第20题 · 多选", "text": "第二十题，多选。还是这个知识点，换个问法再考一遍：主要负责人和安全生产管理人员必须具备什么？正确就两条。"}, {"tag": null, "text": "安全生产知识，加管理能力。跟上一题连起来记：知识加能力，别的选项都是陪跑。"}, {"tag": "第21题 · 单选（选错误项）", "text": "第二十一题，选错误的说法。考点：安管人员的任免。错误的说法是：高危单位安管人员的任免，应当经应急管理部门批准。"}, {"tag": null, "text": "为什么错？法律要求的是告知，也就是备案、打声招呼，不是批准、让人审批。任免是单位的内部人事权，政府部门不能批。记法：任免告知，不是审批。"}, {"tag": "第22题 · 单选", "text": "第二十二题。考点：上岗的前置条件。生产经营单位必须保证上岗的从业人员都经过什么？"}, {"tag": null, "text": "答案：安全生产教育和培训。不培训就上岗，单位要承担法律责任。口诀：先培训，后上岗。"}, {"tag": "第23题 · 多选", "text": "第二十三题，多选。考点：安全培训要保证从业人员做到的四个方面。"}, {"tag": null, "text": "一，具备必要的安全生产知识；二，熟悉安全规章制度和安全操作规程；三，掌握本岗位安全操作技能，了解事故应急处理措施；四，知悉自身在安全生产方面的权利和义务。"}, {"tag": null, "text": "错的是最后一条，具备应急管理部门的考核合格证。只有高危单位的主要负责人和安全员才要考核合格，普通工人不要求。记法：懂知识、会规程、能操作、知权利。"}, {"tag": "第24题 · 判断", "text": "第二十四题，判断题。知识点：被派遣劳动者，也就是劳务派遣工，用工单位必须把他们纳入本单位从业人员统一管理，一样要进行安全教育培训。"}, {"tag": null, "text": "对照题目，说法正确。记住反面：要说派遣工和企业员工分别管理，那就是错的。口诀：派遣工，统一管，一样训。"}, {"tag": "第25题 · 判断", "text": "第二十五题，判断题。知识点：被派遣劳动者要用工单位统一管理。题目说，施工企业的被派遣劳动者应当和本企业从业人员分别管理。"}, {"tag": null, "text": "对照：分别管理是错的，必须纳入统一管理。跟前面第二十四题正好一对：统一管、一样训是对的；分别管理是错的。"}, {"tag": "第26题 · 多选", "text": "第二十六题，多选。考点：谁对被派遣劳动者的教育培训负责。正确的是两个。"}, {"tag": null, "text": "使用被派遣劳动者的单位，加上劳务派遣单位，两边都有培训义务。"}, {"tag": null, "text": "安监部门、培训机构、就业指导中心都不沾边。记法：谁用工谁管，谁派遣谁也管，两头都有责。"}, {"tag": "第27题 · 单选", "text": "第二十七题。考点：隐患排查治理情况要向谁通报。答案：从业人员。"}, {"tag": null, "text": "隐患排查治理情况要如实记录，并向从业人员通报。为什么告诉工人？因为隐患直接威胁干活的人。记住：隐患情况，告诉员工。"}, {"tag": "第28题 · 单选", "text": "第二十八题。考点：重大事故隐患排查治理情况，要向谁报告。答案：负有安全生产监督管理职责的部门，加职工大会。"}, {"tag": null, "text": "一般隐患，向从业人员通报就行；重大隐患，级别高，要向职工大会或者职工代表大会报告。记法：一般告诉员工，重大上大会。"}, {"tag": "第29题 · 判断", "text": "第二十九题，判断题。知识点：生产、经营、储存、使用危险品的车间、商店、仓库，安全防护要符合国家规定，不得与员工宿舍在同一座建筑物内，并且要与员工宿舍保持安全距离。"}, {"tag": null, "text": "对照题目，说法完全正确。这是血泪教训换来的条款：危险品和宿舍必须分开。口诀：危险不进楼，宿舍要隔开。"}, {"tag": "第30题 · 单选", "text": "第三十题。考点：哪些作业要安排专门人员进行现场安全管理。答案：临时用电。"}, {"tag": null, "text": "法律列举的危险作业是：爆破、吊装、动火、临时用电这一类，要专人盯现场。土方开挖、设备安装、消防设施安装不在列举里。记法：爆破吊装动火电，专人盯梢。"}, {"tag": "第31题 · 判断", "text": "第三十一题，判断题。知识点：生产经营单位应依法为从业人员提供劳动防护用品，并监督、教育其正确佩戴和使用。"}, {"tag": null, "text": "对照题目，说法正确。注意两个动作都要有：给了不够，还要监督、教育工人正确戴。光发不管，也算没做到位。"}, {"tag": "第32题 · 判断", "text": "第三十二题，判断题。知识点：项目发包出租不是普通民事行为，法律有安全底线。题目说，发包出租是民事行为，可以随意发包或出租。"}, {"tag": null, "text": "对照：随意发包是错的。底线是：不得发包给不具备安全生产条件或者相应资质的单位和个人。口诀：发包先看资质，没有条件不给。"}, {"tag": "第33题 · 单选", "text": "第三十三题。考点：项目发包安全管理的正确说法。正确的是：不得将生产经营项目发包给不具备安全生产条件或者相应资质的单位或者个人。"}, {"tag": null, "text": "其他三个说法都是绕着这个底线打转：什么发包了再统一管理、把安全责任整体发包、让某个分包方兜底，统统不行。安全责任不能发包出去。"}, {"tag": "第34题 · 单选", "text": "第三十四题。考点：发生事故时，主要负责人第一动作是什么。答案：立即组织抢救，并且不得在事故调查期间擅离职守。"}, {"tag": null, "text": "不是先组织调查，不是封锁消息，更不是先查处责任人。口诀：出了事，一把手先救人、后守候，不许跑。"}, {"tag": "第35题 · 单选", "text": "第三十五题。考点：单位必须依法参加、并为从业人员缴费的保险。答案：工伤保险。"}, {"tag": null, "text": "重大疾病险、意外伤害险是自愿商业险，安责险也不是强制人人缴。法定的只有工伤保险。下一题还会再考一遍。"}, {"tag": "第36题 · 单选", "text": "第三十六题。考点：施工企业必须依法为从业人员投保的险种。答案：工伤社会保险。"}, {"tag": null, "text": "和上一题同一个知识点，换汤不换药：必须买的只有工伤保险。意外伤害险、安责险、工程一切险，都不是法定必买。"}, {"tag": "第37题 · 单选", "text": "第三十七题。考点：国家对安全生产责任保险的态度。答案：鼓励。"}, {"tag": null, "text": "注意分寸：对一般行业，国家是鼓励投保安责险；但矿山、危化、建筑施工这些高危行业，是国家规定强制投保。一般鼓励，高危强制。"}, {"tag": "第38题 · 多选", "text": "第三十八题，多选。考点：劳动合同里应当载明哪些安全相关事项。正确的是四条。"}, {"tag": null, "text": "劳动安全；工伤保险；工作地点；职业病防护。"}, {"tag": null, "text": "错的是晋升时限，那是人事条款，不是法定必须写的安全条款。记法：合同要写：安全、工伤、地点、职业病。"}, {"tag": "第39题 · 单选", "text": "第三十九题。考点：免责协议，俗称生死条款。企业能不能和从业人员订协议，免除或减轻事故伤亡责任？"}, {"tag": null, "text": "答案：不得，一个字都不行。签了也无效。这是强制性规定，不因双方自愿而有效。口诀：生死条款，签了白签。"}, {"tag": "第40题 · 单选", "text": "第四十题。考点：单位不得因从业人员的什么行为而降低待遇或解除合同。答案：行使安全生产权力。"}, {"tag": null, "text": "工人因为拒绝违章指挥、提了整改意见被降工资、被开除，法律不允许。干扰项里的选择性履行义务、法外特权都是编的。记住：行使安全权利，受法律撑腰。"}, {"tag": "第41题 · 单选", "text": "第四十一题，有陷阱。问：从业人员不享有的权力是哪个。答案是：发现直接危及人身安全的紧急情况时，立即撤离作业现场。"}, {"tag": null, "text": "奇怪吧？撤离权明明有。但法律原文是：有权停止作业，或者在采取可能的应急措施后撤离。不是无条件立即走人。题目在立即两个字上挖坑：先停作业、先采取措施，再撤。"}, {"tag": "第42题 · 多选", "text": "第四十二题，多选。考点：从业人员依法享有的安全生产权力。正确的是三条。"}, {"tag": null, "text": "了解工作岗位危险因素和应急措施；获得安全保障、工伤保险和民事赔偿；紧急情况下停止作业和撤离现场。"}, {"tag": null, "text": "错的是拒绝超级指挥和垂直管理，这个词是编的；还有拒绝佩戴劳动防护用品，防护用品是义务，无权拒绝。"}, {"tag": "第43题 · 多选", "text": "第四十三题，多选。考点：施工作业人员享有的安全生产权力。正确的是四条。"}, {"tag": null, "text": "获得防护用品；获得工伤保险赔偿；拒绝违章指挥；紧急避险。"}, {"tag": null, "text": "错的是拒绝教育培训。培训只能接受，不能拒绝，它是法定义务。记法：四权——用品、保险、拒违章、能避险。"}, {"tag": "第四十四题 · 多选", "text": "第四十四题，多选。考点：从业人员的安全生产基本义务。正确的是三条。"}, {"tag": null, "text": "落实岗位安全责任；接受安全生产教育和培训；遵守安全生产规章制度。"}, {"tag": null, "text": "错的两条：保证安全生产投入的有效实施，那是单位的责任，不是工人的；遵从管理人员的一切指挥，一切两个字太绝对，违章违法的指挥不但不用听，还要拒绝。"}, {"tag": "第45题 · 多选", "text": "第四十五题，多选。考点：从业人员有义务做到的。正确的是四条。"}, {"tag": null, "text": "正确佩戴和使用劳动防护用品；严格遵守本单位安全生产规章制度；严格遵守安全操作规程；接受安全生产教育和培训。"}, {"tag": null, "text": "错的是拒绝违章作业和强令冒险作业。注意：这件事本身是对的，但它是权利，不是义务。权利和义务要分清单，题目问义务就不能选权利。"}, {"tag": "第46题 · 判断", "text": "第四十六题，判断题。知识点：工会依法有权对建设项目安全设施的三同时情况进行监督。三同时：同时设计、同时施工、同时投入生产和使用。"}, {"tag": null, "text": "对照题目：题目说工会无权干涉和监督三同时，错了，工会恰恰有这个监督权。看到说工会无权的，多半是错的。"}, {"tag": "第47题 · 多选", "text": "第四十七题，多选。考点：工会的安全权力。正确的是三条。"}, {"tag": null, "text": "监督安全设施与主体工程三同时；要求追究事故中有关人员的责任；依法参加事故调查，向有关部门提出处理意见。"}, {"tag": null, "text": "错的两条都是越权：决定人员撤离危险场所、对事故隐患作出解决决定。工会能监督、能建议、能追责，但不能拍板决定。记法：工会三权：监督、追责、查案。"}, {"tag": "第48题 · 单选", "text": "第四十八题。考点：应急管理部门检查中发现事故隐患，怎么处理。答案：责令立即排除。"}, {"tag": null, "text": "不是先撤人员，不是马上停产，更不是上来就罚款。标准动作：责令立即排除隐患。严重了才升级到停产停业。"}, {"tag": "第49题 · 判断", "text": "第四十九题，判断题。知识点：负有安全生产监督管理职责的部门对生产经营单位进行监督检查时，不得影响被检查单位的正常生产经营活动。"}, {"tag": null, "text": "对照题目，说法正确。执法要规范：检查就是检查，不能借机让人家停工停产。口诀：监督检查，不添乱。"}, {"tag": "第50题 · 单选", "text": "第五十题。考点：监督检查人员执行任务时必须出示什么。答案：有效的行政执法证件。"}, {"tag": null, "text": "不是身份证件，不是工作文件，是专门的执法证件。亮证执法，是硬性要求。"}, {"tag": "第51题 · 单选", "text": "第五十一题，情景题。执法人员孙某去企业检查，正确的做法是什么。答案：检查前，向企业负责人出示执法证件。"}, {"tag": null, "text": "错的三项都典型：忘带执法证用身份证代替，不行，身份证不是执法证；指定买某大牌安全帽，不行，执法不能指定品牌；抽查可以不让负责人签字，也不行，检查记录必须签字确认。"}, {"tag": "第52题 · 单选", "text": "第五十二题。考点：检查的书面记录，由谁签字。答案：检查人员，加被检查单位的负责人。"}, {"tag": null, "text": "检查的人和被检查的人，双方签字确认，记录才算数。单方面记的不行，找路人签字也不行。口诀：谁查、谁被查，谁签字。"}, {"tag": "第53题 · 多选", "text": "第五十三题，多选。考点：违法行为情节严重的，要向社会公告并通报哪些单位。正确的是四条。"}, {"tag": null, "text": "行业主管部门；投资主管部门；自然资源主管部门；证券监督管理机构以及有关金融机构。"}, {"tag": null, "text": "错的是交通主管部门。不是交通不重要，而是它已经包含在行业主管部门里面了，法条列举里没有单列交通。这类题考的就是原文列举，按原文记。"}, {"tag": "第54题 · 单选（选错误项）", "text": "第五十四题，选错误的说法。考点：应急救援预案。错误的是：人数较少的小型建筑施工单位可以不制定应急救援预案。"}, {"tag": null, "text": "为什么错？预案是每个生产经营单位都必须制定的，单位再小也得有。规模小可以灵活的是应急救援组织，不是预案。记住：预案人人要订，组织小的可兼职。"}, {"tag": "第55题 · 多选", "text": "第五十五题，多选。考点：生产经营规模较小的建筑施工单位，应急方面怎么要求。正确的是三条。"}, {"tag": null, "text": "不必建立应急救援组织；应当配备必要的应急救援器材；可以不建立应急救援组织，但应当指定兼职的应急救援人员。"}, {"tag": null, "text": "错的是：必须建立应急救援组织，和必须指定专职应急救援人员。关键词是兼职，不是专职。规模小，队伍可免，器材和兼职人员不能少。"}, {"tag": "第56题 · 单选", "text": "第五十六题。考点：事故发生后，现场有关人员应当立即报告谁。答案：本单位负责人。"}, {"tag": null, "text": "第一步永远是报告本单位负责人，不是直接打给应急管理部门。流程：现场人员报负责人，负责人再上报政府部门。一级报一级。"}, {"tag": "第57题 · 单选", "text": "第五十七题。考点：谁负责向安全生产监督管理部门上报事故。答案：法定代表人。"}, {"tag": null, "text": "内部是现场人员报单位负责人；对外上报，是法定代表人出面。跟前面案例题里的一致：对外上报事故是法定代表人的职责。"}, {"tag": "第58题 · 单选", "text": "第五十八题。考点：主要负责人未履行安全职责导致事故，尚不构成刑事处罚的，给撤职处分，几年内不得担任任何生产经营单位的主要负责人。"}, {"tag": null, "text": "答案：五年。记住这个基准线：五年禁任。后面几题都是围着这个五年转。"}, {"tag": "第59题 · 判断", "text": "第五十九题，判断题，有陷阱。知识点：主要负责人受刑事处罚或撤职处分的，自刑罚执行完毕或受处分之日起，五年内不得担任任何生产经营单位的主要负责人；对重大、特别重大事故负有责任的，终身不得担任本行业生产经营单位的主要负责人。"}, {"tag": null, "text": "对照题目：题目说重大、特别重大事故责任者是终身不得担任任何行业。错就错在任意两个字上。法律原文是终身不得担任本行业。跨行可以，本行业终身禁入。"}, {"tag": "第60题 · 单选", "text": "第六十题。考点：主要负责人因未履职被判有期徒刑，自刑期执行完毕之日起怎么处理。答案：五年内不得担任任何生产经营单位的主要负责人。"}, {"tag": null, "text": "又回到那条基准线：五年。出狱或处分期满，五年内全行业禁任一把手。这题和第五十八题是同一考点，正反着考。"}, {"tag": "第61题 · 单选", "text": "第六十一题。考点：因一般事故被判刑的，刑满后多久不得任职。答案还是：五年内不得担任任何生产经营单位的主要负责人。"}, {"tag": null, "text": "不管一般还是较大事故，只要判了刑，统一五年。只有重大、特别重大才升级到终身本行业禁入。这题第三次考五年，肯定记住了。"}, {"tag": "第62题 · 单选", "text": "第六十二题。考点：罚款档位。发生了较大事故，单位主要负责人要被处上一年年收入百分之多少的罚款。答案：百分之六十。"}, {"tag": null, "text": "个人罚款四档：一般事故百分之四十；较大百分之六十；重大百分之八十；特别重大百分之百。规律：每升一级加二十，封顶年收入全罚。"}, {"tag": "第63题 · 单选", "text": "第六十三题。考点：其他负责人和安全管理人员未履职，尚不构成犯罪的，怎么处理。答案：责令限期改正，并处罚款。"}, {"tag": null, "text": "注意层级：不构成犯罪，先限期改正加罚款；构成犯罪的，下一题再说。轻罪轻罚，先改后罚。"}, {"tag": "第64题 · 多选", "text": "第六十四题，多选。考点：其他负责人和安全管理人员未履职构成犯罪的，可能受的处罚。正确的是三条。"}, {"tag": null, "text": "罚款；追究刑事责任；暂停或者撤销其与安全生产有关的资格。"}, {"tag": null, "text": "错的是限期改正和批评教育。都到犯罪了，就没有批评教育这种温柔选项了。层级记法：不犯罪，改正加罚款；犯罪了，罚款加刑责加撤资格。"}, {"tag": "第65题 · 单选", "text": "第六十五题。考点：签了免责协议，协议无效，对生产经营单位怎么罚。答案：对主要负责人予以罚款。"}, {"tag": null, "text": "罚款额度是二万到十万，罚的是主要负责人个人，不是罚单位。协议无效加罚老板，双重教训。"}, {"tag": "第66题 · 单选（选错误项）", "text": "第六十六题，情景题。公司和农民工签协议，说违章出了伤亡事故责任自负。选错误的说法。答案：该协议是双方意愿的体现，双方都应严格遵守。"}, {"tag": null, "text": "为什么错？生死条款签了也无效，谈不上严格遵守。应急管理部门可以对主要负责人处二万到十万罚款，这个说法本身是对的。自愿不等于合法。"}, {"tag": "第67题 · 单选", "text": "第六十七题。考点：高危行业没按国家规定投保安全生产责任保险，法律责任是什么。答案：责令限期改正，并处以罚款。"}, {"tag": null, "text": "高危行业安责险是强制的，不买先责令改正加罚款，不至于停产。口诀：该保不保，限期改，加罚款。"}, {"tag": "第68题 · 多选", "text": "第六十八题，多选。考点：什么情形可以对生产经营单位予以关闭。正确的是三条。"}, {"tag": null, "text": "经停产停业整顿，仍不具备安全生产条件的；拒不执行停产停业整顿决定的；不具备安全条件，导致发生重大、特别重大事故的。"}, {"tag": null, "text": "错的两条都在时限和次数上挖坑：正确的触发线是，一百八十日内三次受到行政处罚，就够关闭。题目写一年内三次、一百八十日内二次，都不对。记法：一百八十天，挨三次罚，关门。"}, {"tag": "第69题 · 单选", "text": "第六十九题。考点：单位罚款档位。事故导致一人死亡，属于一般事故，对事故发生单位处多少罚款。答案：三十万元以上，一百万元以下。"}, {"tag": null, "text": "单位罚款四档要背：一般事故，三十万到一百万；较大事故，一百万到二百万；重大事故，二百万到一千万；特别重大，一千万到二千万。"}, {"tag": "第70题 · 单选", "text": "第七十题。考点：事故导致三人死亡，是较大事故，施工企业罚款区间。答案：一百万元到二百万元。"}, {"tag": null, "text": "三级三人算较大事故，按第二档罚一百万到二百万。跟上一题连着记：死一人一般档，三人较大档。事故分级和罚款档位是联动的。"}, {"tag": "第71题 · 单选", "text": "第七十一题。考点：应急管理部门对事故单位罚款的最高限额。答案：一亿元。"}, {"tag": null, "text": "怎么来的？特别重大事故罚一千万到二千万；情节特别严重、影响特别恶劣的，可以罚二倍以上五倍以下，二千万乘五，封顶一亿。这就是那顶格的一亿。"}, {"tag": "第72题 · 单选", "text": "第七十二题。考点：单位该赔不赔、负责人跑路，谁来强制执行。答案：人民法院。"}, {"tag": null, "text": "应急部门管罚款，赔偿要靠法院强制执行。行政归行政，司法归司法。口诀：赔偿不赔，法院见。"}, {"tag": "附2 · 单选", "text": "附录第二题。考点：施工组织设计。建筑施工企业编制施工组织设计，正确的说法是什么。答案：对专业性较强的工程项目，应当编制专项安全施工组织设计，并采取安全技术措施。"}, {"tag": null, "text": "错的三项：用公司的安全计划来代替，不行；规模较小就只写施工方案，不行；所有工程不分专业强弱都编专项，也不对。关键词：专业性较强的工程，才编专项。"}, {"tag": "附3 · 单选", "text": "附录第三题。还是这个知识点，依据建筑法，专业性较强的工程项目应当编制什么。答案：专项安全施工组织设计。跟上一题连着记。"}, {"tag": "附4 · 多选", "text": "附录第四题，多选。考点：施工现场应当采取哪些措施。正确的是三条。"}, {"tag": null, "text": "维护安全；防范危险；预防火灾。有条件的，还对施工现场实行封闭管理。"}, {"tag": null, "text": "错的是警民联动和以包代管。以包代管尤其要记住，是安全管理里的反面典型：包出去就不管，绝对不行。"}, {"tag": "附5 · 单选", "text": "附录第五题。考点：实行施工总承包的建筑工程，施工现场安全由谁负责。答案：总承包单位。"}, {"tag": null, "text": "记住方向：总包对现场安全负总责。分包出事，先找总包。"}, {"tag": "附6 · 单选（选错误项）", "text": "附录第六题，选错误的说法。答案是：分包单位向建设单位负责。"}, {"tag": null, "text": "为什么错？责任链条是：分包单位向总承包单位负责，服从总包的安全生产管理，不直接向建设单位负责。口诀：分包向总包，总包向业主。"}, {"tag": "附7 · 单选", "text": "附录第七题。考点：施工单位发现工程设计不合理，需要修改的，由谁负责修改。答案：原设计单位。"}, {"tag": null, "text": "施工单位不能自己改图，建设单位也不能改，必须原设计单位出修改。谁设计的谁改。"}, {"tag": "附8 · 单选", "text": "附录第八题。考点：违反建筑法，对安全事故隐患不采取措施消除，情节一般的怎么处理。答案：责令改正，可以处以罚款。"}, {"tag": null, "text": "注意层级：情节一般，先责令改正加罚款；严重的才停业整顿、降资质、追刑责。先纠正，后升级。"}, {"tag": "附9 · 单选", "text": "附录第九题。考点：施工中发现设计图纸不符合技术标准，施工单位技术负责人正确的做法。答案：及时提出意见和建议。"}, {"tag": null, "text": "不能继续照图施工，也不能自己按标准改图，更不能去追究设计单位。正确动作只有：提出来，报上去。"}, {"tag": "附10 · 单选", "text": "附录第十题。考点：消防法，建筑消防设施多久全面检测一次。答案：每年至少一次。口诀：消防设施，年检起步。"}, {"tag": "附11 · 单选", "text": "附录第十一题。考点：施工现场的消防安全管理制度不包括哪个。答案：社区联防制度。"}, {"tag": null, "text": "用火用电和易燃易爆品管理制度、消防设施维护保养制度、消防安全检查制度，这些都是工地该有的。社区联防是社区的事，不沾边。"}, {"tag": "附12 · 单选", "text": "附录第十二题。考点：哪些人必须持证上岗并遵守消防安全操作规程。答案：电焊工，加上自动消防系统的操作人员。"}, {"tag": null, "text": "木工、油漆、防水都不用消防持证。动火作业里电焊最危险，一把焊枪能烧一栋楼，所以必须持证。"}, {"tag": "附13 · 单选", "text": "附录第十三题。考点：消防产品必须符合什么。答案：国家标准。"}, {"tag": null, "text": "不是地方标准、不是社团标准。消防产品人命关天，只认国标。"}, {"tag": "附14 · 多选", "text": "附录第十四题，多选。考点：实行强制性产品认证的消防产品，认证合格后方可做什么。正确的是三条：生产、销售、使用。"}, {"tag": null, "text": "错的是设计和销毁，认证管的是流通使用环节。记法：认证合格，才能生产、销售、使用。"}, {"tag": "附15 · 单选", "text": "附录第十五题。考点：建筑构件和建筑材料的什么性能必须符合国家标准或行业标准。答案：防火性能。"}, {"tag": null, "text": "不是保温、不是力学、不是防水，消防法只管防火这一项。"}, {"tag": "附16 · 判断", "text": "附录第十六题，判断题。知识点：没有国家防火性能标准的建筑构件、建筑材料和室内装修装饰材料，防火性能必须符合行业标准。对照题目，说法正确。"}, {"tag": null, "text": "规则是：有国标按国标，没国标按行标。兜底逻辑，判断为对。"}, {"tag": "附17 · 单选", "text": "附录第十七题。考点：施工企业拒不执行消防机构作出的停止施工处罚决定，由谁负责强制执行。答案：作出决定的部门或者机构。"}, {"tag": null, "text": "谁作出的处罚，谁负责强制执行，消防处罚消防自己推。"}, {"tag": "附18 · 单选", "text": "附录第十八题。考点：道路上施工作业，安全警示标志设置在哪里。答案：来车方向的安全距离处。"}, {"tag": null, "text": "不是四周、不是背离方向。标志要提前让开车的看见，所以是来车方向。口诀：警示牌，对着车流来。"}, {"tag": "附19 · 多选", "text": "附录第十九题，多选。考点：未经批准擅自挖掘道路、占用道路施工影响交通安全的，可以由谁责令停止违法行为。正确的是两个。"}, {"tag": null, "text": "公安机关交通管理部门，和道路主管部门。应急管理部门、市政、城管都不在这条管。记法：占道施工归交警和道路部门管。"}, {"tag": "附20 · 单选", "text": "附录第二十题。考点：责令停止违法行为、恢复原状之外，还可以依法给予什么处罚。答案：罚款。"}, {"tag": null, "text": "不是警告记过，也不是停业整顿。占道施工违法的标准三连：停止违法、恢复原状、罚款。"}, {"tag": "附21 · 多选", "text": "附录第二十一题，多选。考点：用人单位由于生产经营需要延长工作时间，要与谁协商。正确的是两个。"}, {"tag": null, "text": "工会，和劳动者本人。部门领导、人力资源部、现场管理员都说了不算。记法：加班要过两道关——工会和本人。"}, {"tag": "附22 · 单选", "text": "附录第二十二题。考点：特殊原因需要加班，在保障劳动者身体健康的条件下，每日延长不得超过几小时。答案：三小时。"}, {"tag": null, "text": "法定数字：每日一般不超过一小时；特殊原因，在保障健康条件下每日不超过三小时；每月总计不超过三十六小时。记：一、三、三十六。"}, {"tag": "附23 · 单选", "text": "附录第二十三题。考点：休息日安排加班又不能补休的，支付不低于工资百分之多少的报酬。答案：百分之二百。"}, {"tag": null, "text": "加班费三档要背：平时加班百分之一百五十；休息日不能补休，百分之二百；法定节假日，百分之三百。记法：一点五、二、三，越往后越贵。"}, {"tag": "附24 · 单选", "text": "附录第二十四题。考点：劳动法要求建立劳动安全卫生制度、进行安全卫生教育，防止劳动过程中的事故，减少什么。答案：职业危害。"}, {"tag": null, "text": "不是减少人身伤害、财产损失、经济损失，劳动安全卫生条款盯着的是职业危害这个词。"}, {"tag": "附25 · 单选", "text": "附录第二十五题。考点：用人单位必须对从事有职业危害作业的劳动者定期进行什么。答案：健康检查。"}, {"tag": null, "text": "不是专门培训、不是资格复审，是有毒有害岗位的定期体检。记法：危害岗位，定期体检。"}, {"tag": "附26 · 单选（选错误项）", "text": "附录第二十六题，选用人单位做法错误的。答案是：对从事有职业危害作业的劳动者，应当在结束劳动合同时进行健康检查，合同期间再进行一次。"}, {"tag": null, "text": "为什么错？法律要求的是定期健康检查，不是只查两次完事。离岗时必须查，在岗期间要按周期反复查。一次性的体检安排，不合规。"}, {"tag": "附27 · 多选", "text": "附录第二十七题，多选。考点：劳动法规定用人单位必须对劳动者履行的义务。正确的是两条。"}, {"tag": null, "text": "提供劳动安全卫生条件；提供必要的劳动防护用品。"}, {"tag": null, "text": "错的是提供晋升机会、提供意外伤害保险、不得延长劳动时间。注意：加班不是绝对禁止的，是限制性的，所以不得延长劳动时间这个说法太绝对，不选。"}, {"tag": "附28 · 多选", "text": "附录第二十八题，多选。考点：国家实行特殊劳动保护的对象。答案：女职工，和未成年工。"}, {"tag": null, "text": "未成年工是指年满十六周岁未满十八周岁的劳动者。学生、老人、儿童都不是劳动法上的保护对象。记法：女职工加未成年工。"}, {"tag": "附29 · 单选", "text": "附录第二十九题。考点：对女职工和未成年工的特殊保护，哪个做法合法。答案：安排未成年工定期进行健康检查。"}, {"tag": null, "text": "错的三项全是踩红线：安排女职工从事矿山井下劳动，禁止；安排女职工经期从事高处作业，禁止；安排怀孕八个月的女职工加班，禁止。"}, {"tag": "附30 · 多选", "text": "附录第三十题，多选。考点：用人单位应当对哪些人员定期进行健康检查。答案：未成年工，和从事有职业危害作业的劳动者。"}, {"tag": null, "text": "专职安全员、女职工、业务骨干都不在法定体检范围。跟附25、附29连起来记：体检只盯着两类人。"}, {"tag": "附33 · 单选", "text": "附录第三十三题。考点：劳动合同与劳动关系。正确的说法是：建立劳动关系，就应当订立书面劳动合同。"}, {"tag": null, "text": "配套数字：已建立劳动关系未签合同的，应当自用工之日起一个月内订立书面合同。劳动关系自用工之日起算，不是从签合同那天算。"}, {"tag": "附34 · 单选", "text": "附录第三十四题。考点：刑法罪名。在生产作业中违反有关安全管理规定，因而发生重大伤亡事故，属于什么罪。答案：重大责任事故罪。"}, {"tag": null, "text": "这是安全事故里最基础、最常用的罪名。关键词：违反安全管理规定。记法：违章出大事，就是重大责任事故罪。"}, {"tag": "附35 · 单选", "text": "附录第三十五题。考点：重大责任事故罪的量刑。施工单位现场负责人违反安全管理规定发生事故，可能遭受的刑事处罚。答案：三年以下有期徒刑或者拘役。"}, {"tag": null, "text": "两档刑：基本档，三年以下或拘役；情节特别恶劣的，三年以上七年以下。题目问的是基本情形，选三年以下。"}, {"tag": "附36 · 单选", "text": "附录第三十六题。考点：强令他人违章冒险作业，因而发生重大伤亡事故的，处几年以下有期徒刑或拘役。答案：五年。"}, {"tag": null, "text": "对比记：自己违章干活是三年以下；强令别人违章冒险，罪重一档，五年以下；情节特别恶劣的五年以上。谁下的命令谁罪重。"}, {"tag": "附37 · 多选", "text": "附录第三十七题，多选。考点：刑法修正案十一新增的危险作业罪，哪些行为可能构成。正确的是四条。"}, {"tag": null, "text": "篡改、隐瞒、销毁监控等安全数据信息的；未经批准擅自从事建筑施工等危险生产经营活动的；未经批准擅自从事危险物品生产储存等高度危险作业的；存在重大事故隐患被责令整改而拒不执行的。"}, {"tag": null, "text": "错的是擅自从事交通运输，不在危险作业罪的列举里。危险作业罪的特点：还没出事也可能构罪，把安全的防线往前挪了一大步。"}, {"tag": "附38 · 单选", "text": "附录第三十八题。考点：安全生产条件不符合国家规定，致使多人重伤死亡，责任人构成什么罪。答案：重大劳动安全事故罪。"}, {"tag": null, "text": "区分：人违章操作出事，是重大责任事故罪；设施条件本身不达标出事，是重大劳动安全事故罪。一个管人祸，一个管硬件。"}, {"tag": "附39 · 单选", "text": "附录第三十九题。考点：为降低造价偷工减料、使用不合格建材，降低工程质量导致建筑坍塌，构成什么罪。答案：工程重大安全事故罪。"}, {"tag": null, "text": "关键词：偷工减料、降低工程质量。这是建设、设计、施工、监理单位的罪。口诀：盖楼偷工减料塌了，工程重大安全事故罪。"}, {"tag": "附40 · 单选", "text": "附录第四十题。考点：工程重大安全事故罪的量刑。造成后果但尚未达到特别严重程度的，除罚金外处几年有期徒刑。答案：五年以下。"}, {"tag": null, "text": "两档刑：基本档五年以下加罚金；后果特别严重的，五年以上十年以下。跟附39连着记：偷工减料塌了楼，轻则五年下，重则五到十。"}];
const synth = window.speechSynthesis;
let cur = -1, playing = false, pass = 1, voice = null;
const starts = SEGS.map((s, i) => s.tag ? i : -1).filter(i => i >= 0);
const list = document.getElementById('list');

SEGS.forEach((s, i) => {
  if (s.tag) { const t = document.createElement('div'); t.className = 'tag'; t.textContent = s.tag; list.appendChild(t); }
  const d = document.createElement('div'); d.className = 'line'; d.textContent = s.text;
  d.onclick = () => { pass = 1; start(i); }; list.appendChild(d); s.el = d;
});

function pickVoice() {
  const vs = synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('zh'));
  voice = vs.find(v => /婷婷|Tingting|晓晓|Xiaoxiao|辉辉|Huihui|Yaoyao/.test(v.name)) || vs[0] || null;
}
pickVoice();
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = pickVoice;

function qStart(i) { let r = 0; for (const s of starts) { if (s <= i) r = s; else break; } return r; }
function qEnd(i) { for (const s of starts) { if (s > i) return s - 1; } return SEGS.length - 1; }

function start(i) {
  synth.cancel();
  if (i >= SEGS.length) { done(); return; }
  if (i < 0) i = 0;
  cur = i;
  document.querySelectorAll('.line').forEach((el, k) => {
    el.classList.toggle('now', k === cur);
    el.classList.toggle('done', k < cur);
  });
  SEGS[cur].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  document.getElementById('status').textContent = (pass === 2 ? '第2遍 · ' : '') + `第 ${cur + 1}/${SEGS.length} 句`;
  const u = new SpeechSynthesisUtterance(SEGS[cur].text);
  u.lang = 'zh-CN';
  if (voice) u.voice = voice;
  u.rate = parseFloat(document.getElementById('rate').value);
  u.onend = () => {
    if (!playing) return;
    if (cur < qEnd(cur)) { pass = pass; start(cur + 1); }
    else if (document.getElementById('mem').checked && pass === 1) { pass = 2; start(qStart(cur)); }
    else { pass = 1; const n = qEnd(cur) + 1; if (n < SEGS.length) start(n); else done(); }
  };
  synth.speak(u);
  playing = true; setBtn();
}
function done() { playing = false; setBtn(); document.getElementById('status').textContent = '✅ 讲完啦'; }
function setBtn() { document.getElementById('toggle').textContent = playing ? '⏸ 暂停' : '▶ 播放'; }
document.getElementById('toggle').onclick = () => {
  if (cur === -1) { start(0); return; }
  if (playing) { synth.pause(); playing = false; setBtn(); }
  else if (synth.paused && synth.speaking) { synth.resume(); playing = true; setBtn(); }
  else { playing = true; start(cur); }
};
document.getElementById('prev').onclick = () => { pass = 1; const p = qStart(Math.max(cur - 1, 0)); start(p === cur ? 0 : p); };
document.getElementById('next').onclick = () => { pass = 1; const n = starts.find(s => s > cur); start(n === undefined ? SEGS.length : n); };
document.getElementById('rate').onchange = () => { if (cur >= 0) { const c = cur; start(c); } };
</script>
</body>
</html>
