<script>
const QUIZ = {"title":"第一章","questions":[{"type":"单选","key":"第1题","stem":"我国最早的一部《安全生产法》是 （　） 年制定的。","options":["1999 年","2002 年","2014 年","2016 年"],"answer":"B","why":"依据2016年《中共中央、国务院关于推进安全生产领域改革发展的意见》，基本原则是坚持安全发展、改革创新、依法监管、源头防范、系统治理。C“过程防范”应为“源头防范”，E“重点治理”应为“系统治理”，均系偷换关键词。","expl":"零二制定，一四、二一两次大修。\n考点：安全生产法的立法时间。我国最早的一部安全生产法，是哪一年制定的？\n答案是二零零二年。二零一四年、二零一六年都是后来修改的年份，不是制定。口诀：零二制定，一四、二一两次大修。"},{"type":"单选","key":"第2题","stem":"现行的《安全生产法》自（　）起施行。","options":["2020 年 12 月 1 日","2021 年 6 月 10 日","2021 年 9 月 1 日","2021 年 12 月 1 日"],"answer":"C","why":"2021年6月10日全国人大常委会通过修正决定，新《安全生产法》自2021年9月1日起施行；6月10日是通过日期，别和施行日期混淆。","expl":"六一通过，九一施行。6月10日是通过日，陷阱。\n考点：现行安全生产法的施行时间。现行的安全生产法，从哪一天开始施行？\n答案是二零二一年九月一日。注意区分：六月十日是人大常委会通过修改的日子，九月一日才是施行日。口诀：六一通过，九一施行。"},{"type":"单选","key":"第3题","stem":"有关《安全生产法》的适用范围,下面表述最准确的是 （　）。","options":["具有独立法人资格的单位","在工商部门注册的单位","在我国领域内从事生产经营活动的单位","对具有危险作业的单位"],"answer":"C","why":"安全生产举报投诉专线为12350，五位数务必记牢。12306是铁路客服，12315是市场监管消费投诉，12335是商务举报专线，均与安全生产无关，属号码混搭干扰。","expl":"只要在我国境内搞生产经营就管，跟法人、注册无关。\n考点：安全生产法管谁。适用范围，哪个说法最准确？\n答案：在我国领域内，从事生产经营活动的单位。关键词是从事生产经营活动，跟是不是独立法人、有没有工商注册没关系。只要在咱们国家搞生产经营，安全生产法就管。"},{"type":"判断","key":"第4题","stem":"安全生产工作应当以人为本,坚持安全发展,坚持安全第一预防为主、科技创新的方针,强化和落实生产经营单位的主体责任。（　）","options":[],"answer":"错","why":"错误。方针的法定表述是“安全第一、预防为主、综合治理”，题干用“科技创新”替换了“综合治理”；强化生产经营单位主体责任虽对，但方针表述错误，整句判错。","expl":"十二字方针是安全第一、预防为主、综合治理。科技创新是偷换。\n判断题。先讲知识点。安全生产工作的十二字方针：安全第一、预防为主、综合治理。\n对照题目：题目说，安全第一、预防为主、科技创新。它把综合治理偷换成了科技创新，所以这题是错的。看到方针里出现科技创新，就是坑。"},{"type":"多选","key":"第5题","stem":"下面关于安全生产工作机制的内容,说法正确的是 （　）。","options":["生产经营单位负责","职工参与","政府监管","行业自律","社会共享"],"answer":"ABCD","why":"安全生产工作机制为：生产经营单位负责、职工参与、政府监管、行业自律、社会支持。E“社会共享”应为“社会支持”，属关键词偷换；前四项均与法条一致。","expl":"原文是社会监督，不是社会共享。\n多选。考点：安全生产工作的机制。正确的是四条。\n生产经营单位负责；职工参与；政府监管；行业自律。\n错的是社会共享。原文是社会监督，不是社会共享，又是改一个词的老套路。口诀：单位负责、职工参与、政府监管、行业自律、社会监督。"},{"type":"多选","key":"第6题","stem":"根据《安全生产法》要求,生产经营单位在生产经营过程中必须（　）","options":["贯彻“管安全必须管生产”理念","遵守有关安全生产的法律、法规","加强安全生产管理,提高安全生产水平,确保安全生产","建立、健全安全生产责任制和安全生产规章制度","改善安全生产条件,加强安全生产标准化、信息化建设"],"answer":"BCDE","why":"依据《安全生产法》，生产经营单位必须遵守安全生产法律法规，加强管理确保安全，建立健全责任制和规章制度，改善条件并推进标准化、信息化建设。A理念颠倒，正确表述是“管生产必须管安全”。","expl":"正确理念是管生产必须管安全，A 方向反了。\n多选。考点：生产经营单位在生产经营过程中必须做到什么。正确的是四条。\n遵守安全生产法律法规；加强安全生产管理，确保安全生产；建立健全安全生产责任制和规章制度；改善安全生产条件，加强标准化、信息化建设。\n错的是第一条，它说管安全必须管生产，方向反了。正确理念是：管生产必须管安全。谁管生产，谁就要管安全。"},{"type":"单选","key":"第7题","stem":"生产经营单位的（　）是本单位的安全生产第一责任人。","options":["专职安全生产分管负责人","安全总监","主要负责人","注册安全工程师"],"answer":"C","why":"依据《安全生产法》，主要负责人是本单位安全生产第一责任人，对安全生产工作全面负责。专职分管负责人、安全总监只承担分管责任，注册安全工程师是专业管理人员，均非第一责任人。","expl":"第一责任人永远是主要负责人（一把手）。\n考点：谁是本单位的安全生产第一责任人。答案是：主要负责人，也就是一把手。\n分管安全的副总、安全总监、注册安全工程师，都不是第一责任人。口诀：第一责任人，永远是主要负责人。"},{"type":"多选","key":"第8题","stem":"依据《安全生产法》,生产经营单位的工会组织在安全生产方面的职责包括（　）","options":["依法组织职工参加本单位安全生产工作的民主管理","对本单位落实职工的安全防护情况负责","依法组织职工参加本单位安全生产工作的民主监督","对本单位的安全生产工作进行管理","维护职工在安全生产方面的合法权益"],"answer":"ACE","why":"工会职责是依法组织职工参加安全生产的民主管理和民主监督，维护职工在安全生产方面的合法权益。B、D把落实防护、直接管理安全的行政责任安到工会头上，工会是参与和监督而非管理部门。","expl":"工会只监督、只维护，不管理、不负责。\n多选。考点：工会在安全生产里的职责。记住关键词：工会是监督和维护，不是管理。\n正确的是三条：依法组织职工参加安全生产工作的民主管理；依法组织职工参加民主监督；维护职工在安全生产方面的合法权益。\n错的两条，都是把工会说成对安全生产工作负责、进行管理。工会没有这个权。记法：工会只监督、只维护，不管理、不负责。"},{"type":"判断","key":"第9题","stem":"乡、镇人民政府以及街道办事处等地方人民政府的派出机关有权对本行政区域内生产经营单位安全生产状况进行监督检查。 （　）","options":[],"answer":"错","why":"错误。依据《安全生产法》，乡镇政府和街道办等派出机关是协助上级人民政府有关部门依法履行安全生产监督管理职责，自身不享有独立的监督检查权，“有权监督检查”表述不准确。","expl":"乡镇政府是一级政府，不是派出机关；街道办才是。\n判断题。先讲知识点：乡镇人民政府，是一级政府；街道办事处，才是政府的派出机关。这两个身份不一样。\n对照题目：题目把乡镇政府也说成派出机关，身份说错了，所以这题是错的。乡镇和街道对安全生产有监督检查职责，这个没错，错在派出机关这个说法。"},{"type":"多选","key":"第10题","stem":"乡镇人民政府和街道办事处等应当（　）","options":["按照职责对本行政区域或者管理区域内生产经营单位安全生产状况进行监督检查","按照授权依法履行安全生产监督管理职责","协助人民政府有关部门","实施综合监督管理","地方人民政府具有安全生产执法权"],"answer":"ABC","why":"乡镇街道应按职责对本行政区域生产经营单位安全生产状况进行监督检查，按照授权依法履行监管职责，并协助政府有关部门工作。D综合监督管理属应急管理部门，E乡镇街道无执法权，均错误。","expl":"能检查、能协助，没综合、没执法。综合监管是应急管理部门的活。\n多选。考点：乡镇政府和街道办在安全生产上该干什么。正确的是三条。\n一，按照职责，对区域内的生产经营单位安全生产状况进行监督检查；二，按照授权，依法履行安全生产监督管理职责；三，协助人民政府有关部门。\n错的两条：实施综合监督管理，那是应急管理部门的活；说乡镇街道有执法权，也不对，它们只能监督检查。记法：能检查、能协助，没综合、没执法。"},{"type":"判断","key":"第11题","stem":"安全生产监管部门对安全生产进行专业监管、行业管理和指导。（　）","options":[],"answer":"错","why":"错误。应急管理部门对安全生产工作实施综合监督管理；专业监管、行业管理和指导是有关行业主管部门的职责，题干把两类监管主体的分工张冠李戴。","expl":"应急管综合，行业部门管行业，别搞混。\n判断题。先讲知识点：安全生产监管分两条线。应急管理部门，对安全生产实施综合监督管理；住建、交通这些行业主管部门，在各自职责范围内管本行业。\n对照题目：题目说安全生产监管部门去做专业监管、行业管理和指导，把综合监管和行业监管搞混了，所以错。记法：应急管综合，行业部门管行业。"},{"type":"判断","key":"第12题","stem":"应急管理部门和对有关行业、领域的安全生产工作实施监督管理的部门,统称负有安全生产监督管理职责的部门。（　）","options":[],"answer":"对","why":"正确。依据《安全生产法》，应急管理部门和对有关行业、领域安全生产工作实施监督管理的部门，统称负有安全生产监督管理职责的部门，与法条原文一致。","expl":"统称包含应急管理部门和行业主管部门。\n判断题。知识点：负有安全生产监督管理职责的部门，是一个统称，包括两拨：应急管理部门，加上对有关行业、领域实施监督管理的部门。\n对照题目，说法完全一致，所以是对的。这个统称后面会反复出现，记住它包含应急管理部门和行业主管部门。"},{"type":"多选","key":"第13题","stem":"生产经营单位应当具备的安全生产条件所必须的资金投入,应有（　）予以保证。","options":["生产经营单位的安全生产管理机构","生产经营单位的决策机构","生产经营单位的主要负责人","个人经营的投资人","生产经营单位的项目负责人"],"answer":"BCD","why":"安全生产条件所必需的资金投入，由生产经营单位的决策机构、主要负责人或者个人经营的投资人予以保证，投入不足并导致后果的要承担责任。安全机构和项目负责人无资金决策权。","expl":"拍板的和掏钱的保证：决策机构、一把手、投资人。\n多选。考点：安全生产所必需的资金投入，由谁来保证？正确的是三个。\n生产经营单位的决策机构；主要负责人；个人经营的投资人。一句话：拍板的和掏钱的来保证。\n错的两条：安全生产管理机构，它是干活的部门，不掌钱；项目负责人，他是花钱的，不负责保证钱。口诀：决策机构、一把手、投资人。"},{"type":"判断","key":"第14题","stem":"生产经营单位应当按照规定提取和使用安全生产费用,主要用于改善安全生产条件。 （　）","options":[],"answer":"错","why":"错误。安全生产费用应按规定提取并“专门用于”改善安全生产条件，属专款专用；题干“主要用于”弱化了专款属性，易致费用挪用，与法条表述不符。","expl":"是「专门用于」不是「主要用于」，一字之差就是坑。\n判断题。知识点：安全生产费用，法律原文是专门用于改善安全生产条件。注意是专门，一分钱都不能挪用。\n对照题目：题目说的是主要用于。主要和专门一字之差，主要就意味着还能挪一部分干别的，所以这题错。看到安全生产费用主要用于，就选错。"},{"type":"多选","key":"第15题","stem":"根据相关法律法规,下列单位中需要配备专职安全生产管理人员的有（　）","options":["建筑施工企业","餐饮企业","通信施工企业","客运公司","烟花销售公司"],"answer":"ACDE","why":"矿山、建筑、运输、危险物品等高危行业须配备专职安全员：建筑施工（含通信施工）、道路客运、烟花爆竹销售均在列；普通餐饮企业风险较低，不属于强制配备专职安全员的范围，故选ACDE。","expl":"越容易出人命越要专职，餐饮风险低不强制。\n多选。考点：哪些单位必须配备专职安全生产管理人员。正确的是四个。\n建筑施工企业；通信施工企业；客运公司；烟花销售公司。这四类都是高危行业。\n错的是餐饮企业，它风险低，不强制配专职。判断技巧：越是容易出人命的行业，越要专职。"},{"type":"判断","key":"第16题","stem":"从业人员少于一百人的建筑施工企业,应当设置安全生产管理机构或者配备专职安全生产管理人员。（　）","options":[],"answer":"对","why":"正确。依据《安全生产法》和《建设工程安全生产管理条例》，建筑施工企业应当设置安全生产管理机构或者配备专职安全生产管理人员，该要求不以人数为前提，与其他行业以一百人划界不同。","expl":"建筑是高危行业，人再少也要专职。\n判断题。知识点：一般单位，超过一百人才强制设安全生产管理机构或配专职安全员；一百人以下，专职或兼职都行。但建筑施工是高危行业，要求更严。\n对照题目：建筑施工企业，哪怕从业人员不到一百人，也应当设安全生产管理机构，或者配专职安全员。所以这题是对的。记住：建筑行业，人再少也要专职。"},{"type":"单选","key":"第17题","stem":"“矿山、金属冶炼、建筑施工、运输单位和危险物品的生产、经营、储存、装卸单位”以外的其他生产经营单位规模在 （　）的生产经营单位应当配备专职或者兼职安全生产管理人员。","options":["100 人以下","150 人以下","200 人以下","300 人以下"],"answer":"A","why":"除矿山、金属冶炼、建筑施工、运输和危险物品单位外，其他单位从业人员超过一百人的应设机构或配专职安全员，一百人以下配专职或兼职。法定分界就是一百人，150、200、300均为干扰数字。","expl":"一般单位一百人以下专职兼职都行；超一百必须设机构或专职。\n考点：非高危单位配安全员的门槛。矿山、金属冶炼、建筑施工、运输、危险物品这些高危行业以外的其他单位，多少人以下应当配专职或者兼职安全员？\n答案：一百人以下。对比记：高危行业，不管多少人都要专职；一般单位一百人以下，专职兼职都可以；一旦超过一百人，就必须设机构或配专职。"},{"type":"判断","key":"第18题","stem":"生产经营单位作出涉及安全生产的经营决策,应当听取安全生产管理机构以及安全生产管理人员的意见。（　）","options":[],"answer":"对","why":"正确。依据《安全生产法》，生产经营单位作出涉及安全生产的经营决策，应当听取安全生产管理机构以及安全生产管理人员的意见，保障安全管理人员的参与权。","expl":"动安全的决策，先问安全员。\n判断题。知识点：生产经营单位作出涉及安全生产的经营决策，应当听取安全生产管理机构以及安全生产管理人员的意见。\n对照题目，一字不差，所以是对的。记法：动安全的决策，先问安全员。"},{"type":"单选","key":"第19题","stem":"生产经营单位的主要负责人和安全生产管理人员必须具备与本单位所从事的生产经营活动相应的安全生产知识和（　）。","options":["管理经历","相关学历","救援能力","管理能力"],"answer":"D","why":"主要负责人和安全生产管理人员必须具备与本单位经营活动相应的安全生产知识和管理能力。学历、经历、救援能力都不是法定必备条件，固定搭配是“安全生产知识＋管理能力”。","expl":"一知识，一能力，不看学历不要求救援。\n考点：主要负责人和安全生产管理人员必须具备的两样东西。除了安全生产知识，还得有什么？\n答案：管理能力。干扰项是管理经历、相关学历、救援能力。法条要的是知识和能力，不看学历，不要求救援。口诀：一知识，一能力。"},{"type":"多选","key":"第20题","stem":"生产经营单位的主要负责人和安全生产管理人员必须具备与本单位所从事的生产经营活动相应的 （　）。","options":["管理经历","管理能力","救援能力","相关学历","安全生产知识"],"answer":"BE","why":"与上题同源，法定要求为两项：相应的安全生产知识和相应的管理能力。A管理经历、C救援能力、D相关学历均为编造搭配，只有BE组合与法条一致。","expl":"同上：知识加能力，别的都是陪跑。\n多选。还是这个知识点，换个问法再考一遍：主要负责人和安全生产管理人员必须具备什么？正确就两条。\n安全生产知识，加管理能力。跟上一题连起来记：知识加能力，别的选项都是陪跑。"},{"type":"单选","key":"第21题","stem":"关于生产经营单位的安全生产管理机构以及安全生产管理人员的表述,错误的是（　）。","options":["生产经营单位做出涉及安全生产的经营决策,应当听取安全生产管理人员的意见","生产经营单位不得因安全生产管理人员依法履行职责而降低其工资、福利等待通","建筑设施单位的安全生产管理人员的任免,应当经应急管理部门批准","安全生产管理人员必须具备与本单位所从事的生产经营活动相应的安全生产知识和管理能力"],"answer":"C","why":"本题选错误项C：危险物品、矿山、金属冶炼等单位安全管理人员的任免只需告知主管的负有安监职责的部门，是告知备案而非“经批准”。A、B、D均为法条正确表述。","expl":"任免是告知备案，不是批准，政府不批人事。\n选错误的说法。考点：安管人员的任免。错误的说法是：高危单位安管人员的任免，应当经应急管理部门批准。\n为什么错？法律要求的是告知，也就是备案、打声招呼，不是批准、让人审批。任免是单位的内部人事权，政府部门不能批。记法：任免告知，不是审批。"},{"type":"单选","key":"第22题","stem":"依照《安全生产法》规定,生产经营单位必须保证上岗的从业人员都经过（　）,否则,生产经营单位要承担法律责任。","options":["安全生产教育和培训","安全审查","安全生产高等教育","安全和保密培训"],"answer":"A","why":"依据《安全生产法》，从业人员必须经安全生产教育和培训合格后方可上岗作业，未经教育培训上岗的，生产经营单位要承担法律责任。安全审查、高等教育、保密培训均非法定上岗前提。","expl":"先培训后上岗，不培训单位担责。\n考点：上岗的前置条件。生产经营单位必须保证上岗的从业人员都经过什么？\n答案：安全生产教育和培训。不培训就上岗，单位要承担法律责任。口诀：先培训，后上岗。"},{"type":"多选","key":"第23题","stem":"生产经营单位应当对从业人员进行安全生产教育和培训,保证从业人员（　）","options":["具备必要的安全生产知识","熟悉有关的安全生产规章制度和安全操作规程","掌握本岗位的安全操作技能,了解事故应急处理措施","知悉自身在安全生产方面的权利和义务","具备应急管理部门的考核合格证"],"answer":"ABCD","why":"培训应保证从业人员：具备必要安全知识，熟悉规章制度和操作规程，掌握本岗位操作技能并了解事故应急处理措施，知悉自身权利义务。E考核合格证仅针对负责人、安管人员和特种作业人员，非全体从业人员。","expl":"懂知识、会规程、能操作、知权利。考核合格证只有高危单位负责人和安全员要。\n多选。考点：安全培训要保证从业人员做到的四个方面。\n一，具备必要的安全生产知识；二，熟悉安全规章制度和安全操作规程；三，掌握本岗位安全操作技能，了解事故应急处理措施；四，知悉自身在安全生产方面的权利和义务。\n错的是最后一条，具备应急管理部门的考核合格证。只有高危单位的主要负责人和安全员才要考核合格，普通工人不要求。记法：懂知识、会规程、能操作、知权利。"},{"type":"判断","key":"第24题","stem":"企业应对被派遣劳动者纳入本单位从业人员统一管理,进行岗位安全操作规程和安全操作技能的教育和培训。 （　）","options":[],"answer":"对","why":"正确。依据《安全生产法》，被派遣劳动者纳入本单位从业人员统一管理，由用工单位对其进行岗位安全操作规程和安全操作技能的教育培训，题干与法条一致。","expl":"派遣工，统一管，一样训。\n判断题。知识点：被派遣劳动者，也就是劳务派遣工，用工单位必须把他们纳入本单位从业人员统一管理，一样要进行安全教育培训。\n对照题目，说法正确。记住反面：要说派遣工和企业员工分别管理，那就是错的。口诀：派遣工，统一管，一样训。"},{"type":"判断","key":"第25题","stem":"施工企业的被派遣劳动者应当和本企业从业人员分别管理。（　）","options":[],"answer":"错","why":"错误。被派遣劳动者应当与本企业从业人员统一管理，而不是分别管理；统一管理才能确保安全培训、防护配备和应急管理落实到每个人。","expl":"判断题。知识点：被派遣劳动者要用工单位统一管理。题目说，施工企业的被派遣劳动者应当和本企业从业人员分别管理。\n对照：分别管理是错的，必须纳入统一管理。跟前面第二十四题正好一对：统一管、一样训是对的；分别管理是错的。"},{"type":"多选","key":"第26题","stem":"对被派遣劳动者具有教育和培训义务的单位有 （　）负责","options":["安全生产监督管理部门","使用被派遣劳动者的单位","特种作业培训机构","劳务派遣单位","劳动就业指导中心"],"answer":"BD","why":"依据《安全生产法》，劳务派遣单位和使用被派遣劳动者的单位（用工单位）都负有教育培训义务。监管部门、培训机构、就业指导中心均不承担该法定义务，故选BD。","expl":"多选。考点：谁对被派遣劳动者的教育培训负责。正确的是两个。\n使用被派遣劳动者的单位，加上劳务派遣单位，两边都有培训义务。\n安监部门、培训机构、就业指导中心都不沾边。记法：谁用工谁管，谁派遣谁也管，两头都有责。"},{"type":"单选","key":"第27题","stem":"《中华人民共和国安全生产法》规定生产经营单位应当建立健全生产安全事故隐患排查治理制度,采取技术、管理措施,及时发现并消除事故隐患。事故隐患排查治理情况应当如实记录,并向 （　）通报。","options":["安管机构","监督机构","从业人员","管理人员"],"answer":"C","why":"事故隐患排查治理情况应当如实记录，并向从业人员通报，保障职工知情权。向监管部门报告仅限重大事故隐患，安管机构、管理人员均非法定通报对象。","expl":"考点：隐患排查治理情况要向谁通报。答案：从业人员。\n隐患排查治理情况要如实记录，并向从业人员通报。为什么告诉工人？因为隐患直接威胁干活的人。记住：隐患情况，告诉员工。"},{"type":"单选","key":"第28题","stem":"《安全生产法》规定,重大事故隐患排查治理情况应当及时向负有安全生产监督管理职责的部门和（　）报告。","options":["职工大会","党员大会股东大会","股东大会","全体员工"],"answer":"A","why":"重大事故隐患排查治理情况应及时向负有安全生产监督管理职责的部门和职工大会（职工代表大会）报告。股东大会是公司治理机构，党员大会与安全无关，全体员工表述不规范。","expl":"考点：重大事故隐患排查治理情况，要向谁报告。答案：负有安全生产监督管理职责的部门，加职工大会。\n一般隐患，向从业人员通报就行；重大隐患，级别高，要向职工大会或者职工代表大会报告。记法：一般告诉员工，重大上大会。"},{"type":"判断","key":"第29题","stem":"生产、经营、储存、使用危险品的车间、商店、仓库周边的安全防护应当符合国家有关规定,不得与员工宿舍在同一座建筑物内,并与员工宿舍保持安全距离。（　）","options":[],"answer":"对","why":"正确。依据《安全生产法》，生产、经营、储存、使用危险物品的车间、商店、仓库不得与员工宿舍在同一座建筑物内，并应当与员工宿舍保持安全距离，这是防范群死群伤事故的刚性规定。","expl":"判断题。知识点：生产、经营、储存、使用危险品的车间、商店、仓库，安全防护要符合国家规定，不得与员工宿舍在同一座建筑物内，并且要与员工宿舍保持安全距离。\n对照题目，说法完全正确。这是血泪教训换来的条款：危险品和宿舍必须分开。口诀：危险不进楼，宿舍要隔开。"},{"type":"单选","key":"第30题","stem":"依据《安全生产法》要求,下列作业中需要安排专门人员进行现场安全管理的是 （　）。","options":["土方开挖","设备安装","临时用电","消防设施安装"],"answer":"C","why":"依据《安全生产法》，爆破、吊装、动火、临时用电等危险作业应当安排专门人员进行现场安全管理。临时用电在法定列举之内；土方开挖、设备安装、消防安装不在列举中。","expl":"考点：哪些作业要安排专门人员进行现场安全管理。答案：临时用电。\n法律列举的危险作业是：爆破、吊装、动火、临时用电这一类，要专人盯现场。土方开挖、设备安装、消防设施安装不在列举里。记法：爆破吊装动火电，专人盯梢。"},{"type":"判断","key":"第31题","stem":"生产经营单位应依法为从业人员提供劳动防护用品,并监督教育其正确佩戴和使用。（　）","options":[],"answer":"对","why":"正确。生产经营单位必须为从业人员提供符合国家或行业标准的劳动防护用品，并监督、教育从业人员按照使用规则正确佩戴和使用，免费提供与监督教育缺一不可。","expl":"判断题。知识点：生产经营单位应依法为从业人员提供劳动防护用品，并监督、教育其正确佩戴和使用。\n对照题目，说法正确。注意两个动作都要有：给了不够，还要监督、教育工人正确戴。光发不管，也算没做到位。"},{"type":"判断","key":"第32题","stem":"生产经营单位将生产经营项目、场所、设备发包或者出租是一种民事行为,生产经营单位可以随意发包或出租。（　）","options":[],"answer":"错","why":"错误。发包出租并非可随意处分的民事行为：不得发包给不具备安全生产条件或相应资质的单位、个人，且应签订安全生产管理协议或约定各自安全职责，否则要承担相应法律责任。","expl":"判断题。知识点：项目发包出租不是普通民事行为，法律有安全底线。题目说，发包出租是民事行为，可以随意发包或出租。\n对照：随意发包是错的。底线是：不得发包给不具备安全生产条件或者相应资质的单位和个人。口诀：发包先看资质，没有条件不给。"},{"type":"单选","key":"第33题","stem":"关于项目发包安全管理的说法,正确的是（　）","options":["不得将生产经营项目发包给不具备安全生产条件或者相应资质的单位或者个人","将项目发包给不具备相应资质的个人时,发包单位必须对该项目进行统一管理,确保安全","招标时可以约定将项目的安全生产管理责任整体发包","项目发包给多个单位时,可以约定由其中某个分包方统一进行安全管理并承担全部责任"],"answer":"A","why":"正确表述A：不得将生产经营项目、场所、设备发包给不具备安全生产条件或者相应资质的单位、个人，资质与条件是硬门槛。B试图用“统一管理”规避资质要求，C、D用合同约定整体转嫁安全责任，均违法。","expl":"考点：项目发包安全管理的正确说法。正确的是：不得将生产经营项目发包给不具备安全生产条件或者相应资质的单位或者个人。\n其他三个说法都是绕着这个底线打转：什么发包了再统一管理、把安全责任整体发包、让某个分包方兜底，统统不行。安全责任不能发包出去。"},{"type":"单选","key":"第34题","stem":"生产经营单位发生生产安全事故时,单位的主要负责人应当（　）井不得在事故调查期间擅离职守。","options":["立即组织调查","立即封锁事故消息","立即查处责任人","立即组织抢救"],"answer":"D","why":"依据《安全生产法》，事故发生后单位主要负责人应立即组织抢救，并在事故调查处理期间不得擅离职守。先救人后问责，封锁消息违法，组织事故调查是政府部门的职权。","expl":"考点：发生事故时，主要负责人第一动作是什么。答案：立即组织抢救，并且不得在事故调查期间擅离职守。\n不是先组织调查，不是封锁消息，更不是先查处责任人。口诀：出了事，一把手先救人、后守候，不许跑。"},{"type":"单选","key":"第35题","stem":"下列保险中,生产经营单位必须依法参加并为从业人员缴纳保险费的是（　）.","options":["重大疾病险","意外伤害保险","工伤保险","安全生产责任保险"],"answer":"C","why":"工伤保险是法定强制社会保险，生产经营单位必须依法为从业人员缴纳保险费。安责险国家仅鼓励投保（高危行业要求投保），意外险、重疾险均属商业保险，不具有强制性。","expl":"考点：单位必须依法参加、并为从业人员缴费的保险。答案：工伤保险。\n重大疾病险、意外伤害险是自愿商业险，安责险也不是强制人人缴。法定的只有工伤保险。下一题还会再考一遍。"},{"type":"单选","key":"第36题","stem":"施工企业必须依法为从业人员投保的险种是（　）","options":["工伤社会保险","意外伤害保险","安全生产责任保险","工程一切险"],"answer":"A","why":"施工企业必须依法为从业人员缴纳工伤社会保险。意外伤害保险、安全生产责任险均为鼓励或按约定投保，工程一切险是商业工程保险，都不具有法定强制性。","expl":"考点：施工企业必须依法为从业人员投保的险种。答案：工伤社会保险。\n和上一题同一个知识点，换汤不换药：必须买的只有工伤保险。意外伤害险、安责险、工程一切险，都不是法定必买。"},{"type":"单选","key":"第37题","stem":"依据《安全生产法》,国家 （　） 生产经营单位投保安全生产责任保险,","options":["强制","反对","不要求","鼓励"],"answer":"D","why":"依据《安全生产法》，国家鼓励生产经营单位投保安全生产责任保险，以市场机制分散事故风险；只有高危行业、领域才要求强制投保，本题问一般性表述，故选鼓励。","expl":"考点：国家对安全生产责任保险的态度。答案：鼓励。\n注意分寸：对一般行业，国家是鼓励投保安责险；但矿山、危化、建筑施工这些高危行业，是国家规定强制投保。一般鼓励，高危强制。"},{"type":"多选","key":"第38题","stem":"生产经营单位与从业人员订立的劳动合同,应载明的事项有 （　）","options":["劳动安全","晋升时限","工伤保险","工作地点","职业病防护"],"answer":"ACDE","why":"劳动合同应当载明劳动安全、防止职业危害（职业病防护）、工伤保险以及工作地点等事项。B晋升时限与劳动安全无关，不属于法定载明事项，属凑数干扰。","expl":"多选。考点：劳动合同里应当载明哪些安全相关事项。正确的是四条。\n劳动安全；工伤保险；工作地点；职业病防护。\n错的是晋升时限，那是人事条款，不是法定必须写的安全条款。记法：合同要写：安全、工伤、地点、职业病。"},{"type":"单选","key":"第39题","stem":"依照《生产安全法》的规定,企业（　） 与从业人员订立协议,免除或者减轻其对从业人员因生产安全事故伤亡依法应承担的责任。","options":["在民法的范围内可以","经有关部门批准可以","不得","一般不得"],"answer":"C","why":"依据《安全生产法》，生产经营单位不得以任何形式与从业人员订立协议，免除或者减轻其对从业人员因事故伤亡依法应承担的责任，即“生死合同”一律无效，没有任何例外或批准渠道。","expl":"考点：免责协议，俗称生死条款。企业能不能和从业人员订协议，免除或减轻事故伤亡责任？\n答案：不得，一个字都不行。签了也无效。这是强制性规定，不因双方自愿而有效。口诀：生死条款，签了白签。"},{"type":"单选","key":"第40题","stem":"生产经营单位不得因从业人员（　）而降低其工资、福利等待遇或者解除与其订立的劳动合同。","options":["选择性地履行安全生产义务","拒绝安全生产义务","行使安全生产权力","行使安全生产法外特权"],"answer":"C","why":"从业人员依法行使安全生产权利（如拒绝违章指挥、紧急避险）时，单位不得降低其工资福利或解除劳动合同。A、B、D所述“选择性履行”“拒绝义务”“法外特权”本身即不合法，谈不上受保护。","expl":"考点：单位不得因从业人员的什么行为而降低待遇或解除合同。答案：行使安全生产权力。\n工人因为拒绝违章指挥、提了整改意见被降工资、被开除，法律不允许。干扰项里的选择性履行义务、法外特权都是编的。记住：行使安全权利，受法律撑腰。"},{"type":"单选","key":"第41题","stem":"安全生产从业人员不享有的权力是 （　）","options":["了解其作业场所和工作岗位存在的危险因素","对本单位的安全生产工作提出建议","本单位生产管理工作中存在的问题提出批评、检举、控告","发现直接危及人身安全的紧急情况时立即撤离作业现场"],"answer":"D","why":"知情权、建议权、批评检举控告权均为法定权利；紧急避险权的法定表述是“停止作业或者在采取可能的应急措施后撤离作业场所”，D称可“立即撤离”缺少法定前提，表述不成立，故为本题所选的不享有项。","expl":"有陷阱。问：从业人员不享有的权力是哪个。答案是：发现直接危及人身安全的紧急情况时，立即撤离作业现场。\n奇怪吧？撤离权明明有。但法律原文是：有权停止作业，或者在采取可能的应急措施后撤离。不是无条件立即走人。题目在立即两个字上挖坑：先停作业、先采取措施，再撤。"},{"type":"多选","key":"第42题","stem":"在生产经营活动中,从业人员必须履行一定的义务,同时也依法享有定的权力,下列属于从业人员依法享有的安全生产权力的是 （　）。","options":["了解工作岗位危险因素和应急措施的权力","拒绝超级指挥和垂直管理的权力","获得安全保障、工伤保险和民事赔偿的权力","紧急情况下停止作业和撤离现场的权力","拒绝佩戴劳动防护用品的权力"],"answer":"ACD","why":"A知情权、C获得安全保障及工伤保险和民事赔偿权、D紧急情况下停止作业和撤离现场权均为法定权利。B的表述并非法定权利（法定为拒绝违章指挥和强令冒险作业权），E错在把佩戴劳保用品的义务当成可拒绝的权利。","expl":"多选。考点：从业人员依法享有的安全生产权力。正确的是三条。\n了解工作岗位危险因素和应急措施；获得安全保障、工伤保险和民事赔偿；紧急情况下停止作业和撤离现场。\n错的是拒绝超级指挥和垂直管理，这个词是编的；还有拒绝佩戴劳动防护用品，防护用品是义务，无权拒绝。"},{"type":"多选","key":"第43题","stem":"施工作业人员应当享有的安全生产权力有 （　）。","options":["获得防护用品的权力","获得工伤保险赔偿的权力","拒绝违章指挥的权力","拒绝教育培训的权力","紧急避险的权力"],"answer":"ABCE","why":"获得防护用品、工伤保险赔偿、拒绝违章指挥、紧急避险均为施工作业人员法定权利，ABCE正确。D接受安全教育培训是从业人员的义务，“拒绝教育培训”不是权利，注意权利义务不能混淆。","expl":"多选。考点：施工作业人员享有的安全生产权力。正确的是四条。\n获得防护用品；获得工伤保险赔偿；拒绝违章指挥；紧急避险。\n错的是拒绝教育培训。培训只能接受，不能拒绝，它是法定义务。记法：四权——用品、保险、拒违章、能避险。"},{"type":"多选","key":"第44题","stem":"依据《安全生产法》,下列属于从业人员安全生产基本义务的有（　）","options":["落实岗位安全责任","接受安全生产教育和培训","保证安全生产投入的有效实施","遵守规章制度","遵从管理人员的一切指挥"],"answer":"ABD","why":"从业人员义务包括落实岗位安全责任、接受教育培训、遵守规章制度并服从管理。C保证安全生产投入是单位的资金保障义务，与从业人员无关；E“一切指挥”绝对化，对违章指挥从业人员有权拒绝。","expl":""},{"type":"多选","key":"第45题","stem":"按照安全生产从业人员享有义务的规定,从业人员有义务（　）。","options":["正确佩戴和使用劳动防护用品","严格遵守本单位的安全生产规章制度","严格遵守本单位的安全生产操作规程","拒绝违章作业和强令冒险作业","接受安全生产教育和培训"],"answer":"ABCE","why":"正确佩戴劳保用品、遵守规章制度和操作规程、接受教育培训均为从业人员义务，ABCE正确。D拒绝违章作业和强令冒险作业是权利而非义务，混入义务清单故不选，做题时分清权利义务两栏。","expl":"多选。考点：从业人员有义务做到的。正确的是四条。\n正确佩戴和使用劳动防护用品；严格遵守本单位安全生产规章制度；严格遵守安全操作规程；接受安全生产教育和培训。\n错的是拒绝违章作业和强令冒险作业。注意：这件事本身是对的，但它是权利，不是义务。权利和义务要分清单，题目问义务就不能选权利。"},{"type":"判断","key":"第46题","stem":"工会是维护职工权益的组织,无权干涉和监督建设项目安全设施的“三同时”情况。 （　）","options":[],"answer":"错","why":"错误。依据《安全生产法》，工会有权对建设项目的安全设施与主体工程同时设计、同时施工、同时投入生产和使用的情况进行监督并提出意见，题干“无权监督”与法条相悖。","expl":"判断题。知识点：工会依法有权对建设项目安全设施的三同时情况进行监督。三同时：同时设计、同时施工、同时投入生产和使用。\n对照题目：题目说工会无权干涉和监督三同时，错了，工会恰恰有这个监督权。看到说工会无权的，多半是错的。"},{"type":"多选","key":"第47题","stem":"依据《安全生产法》,下列属于工会安全权力的有 （　）。","options":["监督建设项目的安全设施与主体工程同时设计、同时施工、同时投入生产和使用情况","要求追究安全生产事故中有关人员的责任","发现危及从业人员生命安全的情况时,决定保证人员安全撤离危险场所","发现事故隐患时,作解决的决定","依法参加事故调查,向有关部门提出处理意见"],"answer":"ABE","why":"工会安全权力包括：监督“三同时”落实情况、发现问题时提出意见并要求追究有关人员责任、依法参加事故调查处理并向有关部门提出处理意见。C、D错在工会只能建议、提请，无权直接决定撤离或处置隐患。","expl":"多选。考点：工会的安全权力。正确的是三条。\n监督安全设施与主体工程三同时；要求追究事故中有关人员的责任；依法参加事故调查，向有关部门提出处理意见。\n错的两条都是越权：决定人员撤离危险场所、对事故隐患作出解决决定。工会能监督、能建议、能追责，但不能拍板决定。记法：工会三权：监督、追责、查案。"},{"type":"单选","key":"第48题","stem":"应急管理部门在开展安全生产行政执法时,对检查中发现的事故隐患,下列处理方式合适的是 （　）。","options":["应当责令撤出作业人员","应当责令立即排除","应当责令立即停产停业","应当立即该单位进行罚款"],"answer":"B","why":"检查发现事故隐患应当责令立即排除；重大隐患排除前或排除过程中无法保证安全的，才责令从危险区域撤出作业人员、责令暂时停产停业。A是重大隐患时的升级措施，C、D处罚有违比例原则。","expl":"考点：应急管理部门检查中发现事故隐患，怎么处理。答案：责令立即排除。\n不是先撤人员，不是马上停产，更不是上来就罚款。标准动作：责令立即排除隐患。严重了才升级到停产停业。"},{"type":"判断","key":"第49题","stem":"应急管理部门和其他负有安全生产监督管理职责的部门在对生产经营单位进行监督检查时不得影响被检查单位的正常生产经营活动。 （　）","options":[],"answer":"对","why":"正确。依据《安全生产法》，监督检查不得影响被检查单位的正常生产经营活动，这是依法行政、规范执法的基本要求，题干表述与法条一致。","expl":"判断题。知识点：负有安全生产监督管理职责的部门对生产经营单位进行监督检查时，不得影响被检查单位的正常生产经营活动。\n对照题目，说法正确。执法要规范：检查就是检查，不能借机让人家停工停产。口诀：监督检查，不添乱。"},{"type":"单选","key":"第50题","stem":"安全生产监督检查人员执行监督检查任务时,必须出示 （　）","options":["有效的行政执法文件","有效的个人身份证件","全国统一的监察证件","有效的行政执法证件"],"answer":"D","why":"安全生产监督检查人员执行监督检查任务时，必须出示有效的行政执法证件以表明执法身份。身份证不能代替执法证，A、C的表述也不是法定的证件名称，考点锁定“行政执法证件”。","expl":"考点：监督检查人员执行任务时必须出示什么。答案：有效的行政执法证件。\n不是身份证件，不是工作文件，是专门的执法证件。亮证执法，是硬性要求。"},{"type":"单选","key":"第51题","stem":"某地级市应急管理部门负责监管的执法人员孙某,深入该市某企业检查,孙某在检查过程中的正确的做法是 （　）","options":["检查前,向企业负责人出示执法证件","忘带执法证件时,可以出示有效身份证件代替","指定使用某大品牌的安全帽替换不合格的安全帽","以抽查方式查验时可以不要求被检查单位负责人签字"],"answer":"A","why":"A正确：检查前必须向被检查单位出示执法证件。B身份证不能代替执法证件；C指定品牌安全帽属于滥用职权干预企业自主经营；D检查情况应由被检查单位负责人签字确认，抽查也不例外。","expl":"情景题。执法人员孙某去企业检查，正确的做法是什么。答案：检查前，向企业负责人出示执法证件。\n错的三项都典型：忘带执法证用身份证代替，不行，身份证不是执法证；指定买某大牌安全帽，不行，执法不能指定品牌；抽查可以不让负责人签字，也不行，检查记录必须签字确认。"},{"type":"单选","key":"第52题","stem":"安全生产监督检查人员应当将检查的时间、地点、内容、发现的问题及其处理情况,作出书面记录,并由检查人员和（　）签字。","options":["被检查单位的负责人","检查单位的负责人","被检查现场的作业人员","检查现场的见证人员"],"answer":"A","why":"检查的时间、地点、内容、发现的问题及处理情况应当作出书面记录，由检查人员和被检查单位的负责人签字；负责人拒绝签字的，检查人员应当将情况记录在案。其余人员均非法定签字人。","expl":"考点：检查的书面记录，由谁签字。答案：检查人员，加被检查单位的负责人。\n检查的人和被检查的人，双方签字确认，记录才算数。单方面记的不行，找路人签字也不行。口诀：谁查、谁被查，谁签字。"},{"type":"多选","key":"第53题","stem":"负有安全生产监督管理职贵的部门应当建立安全生产违法行为信息库,如实记录生产经营单位及其从业人员的安全生产违法行为信息;对违法行为情节严重的生产经营单位及其有关从业人员,应当及时向社会并通报 （　）等单位。","options":["交通主管部门","行业主管部门","投资主管部门","自然资源主管部门","证券监督管理机构以及有关金融机构"],"answer":"BCDE","why":"依据《安全生产法》，对违法行为情节严重的单位及从业人员应向社会公示，并通报行业主管部门、投资主管部门、自然资源主管部门、证券监督管理机构以及有关金融机构，实施联合惩戒。A交通主管部门不在法定通报之列。","expl":"多选。考点：违法行为情节严重的，要向社会公告并通报哪些单位。正确的是四条。\n行业主管部门；投资主管部门；自然资源主管部门；证券监督管理机构以及有关金融机构。\n错的是交通主管部门。不是交通不重要，而是它已经包含在行业主管部门里面了，法条列举里没有单列交通。这类题考的就是原文列举，按原文记。"},{"type":"单选","key":"第54题","stem":"根据《安全生产法》的相关规定,关于生产安全事故应急救援预案,以下表述错误的是（　）。","options":["县级以上地方各级人民政府应当组织有关部门制定本行政区域内生产安全事故应急救援预案","人数较少的小型建筑施工单位可以不制定生产安全事故应急救援预案","生产经营单位的生产安全事故应急救援预案,应当与所在地县级以上地方人民政府组织制定的生产安全事故应急救援预案衔接","生产经营单位应当定期组织应急预案演练"],"answer":"B","why":"本题选错误项B：任何生产经营单位都应当制定本单位生产安全事故应急救援预案，小型单位也不例外，只是可简化并与所在地县级以上政府预案相衔接。“人数较少可不制定”于法无据。","expl":"选错误的说法。考点：应急救援预案。错误的是：人数较少的小型建筑施工单位可以不制定应急救援预案。\n为什么错？预案是每个生产经营单位都必须制定的，单位再小也得有。规模小可以灵活的是应急救援组织，不是预案。记住：预案人人要订，组织小的可兼职。"},{"type":"多选","key":"第55题","stem":"生产经营规模较小的建筑施工单位（　）","options":["必须建立应急救援组织","不必建立应急救援组织","必须指定专职的应急救援人员","应当配备必要的应急救援器材","可以不建立应急救援组织,但应当指定兼职的应急救援人品"],"answer":"BDE","why":"规模较小的建筑施工单位可以不建立应急救援组织，但应当指定兼职的应急救援人员，并配备必要的应急救援器材、设备。B、D、E正确；C错在“专职”，A错在“必须建立组织”。","expl":"多选。考点：生产经营规模较小的建筑施工单位，应急方面怎么要求。正确的是三条。\n不必建立应急救援组织；应当配备必要的应急救援器材；可以不建立应急救援组织，但应当指定兼职的应急救援人员。\n错的是：必须建立应急救援组织，和必须指定专职应急救援人员。关键词是兼职，不是专职。规模小，队伍可免，器材和兼职人员不能少。"},{"type":"单选","key":"第56题","stem":"依据《安全生产法》,生产经营单位发生生产安全事故后,事故现场有关人员应当立即报告 （　）。","options":["应急管理部门","行业主管部门","本单位负责人","本单位工会负责人"],"answer":"C","why":"事故现场有关人员应当立即报告本单位负责人，再由单位负责人按规定向政府部门报告。报告链条是“现场人员→单位负责人→监管部门”，应急、行业部门都是后续环节，不能跳过本单位。","expl":"考点：事故发生后，现场有关人员应当立即报告谁。答案：本单位负责人。\n第一步永远是报告本单位负责人，不是直接打给应急管理部门。流程：现场人员报负责人，负责人再上报政府部门。一级报一级。"},{"type":"单选","key":"第57题","stem":"事故发生后,应由（　）负贵向安全生产监督管理部门上报事故情。","options":["法定代表人","技术负责人","项目负责人","吊车司机况"],"answer":"A","why":"单位负责人（法定代表人）接到事故报告后，应当立即如实向负有安全生产监督管理职责的部门报告，不得迟报、漏报、谎报、瞒报。项目负责人、技术负责人只是单位内部接报环节，对外上报责任人是单位负责人。","expl":"考点：谁负责向安全生产监督管理部门上报事故。答案：法定代表人。\n内部是现场人员报单位负责人；对外上报，是法定代表人出面。跟前面案例题里的一致：对外上报事故是法定代表人的职责。"},{"type":"单选","key":"第58题","stem":"生产经营单位主要负责人未履行《安全生产法》规定的安全生产管理职责,导致发生生产安全事故,尚不构成刑事处罚的,给予撤职处分,并在（　）年内不得担任任何生产经营单位的主要负责人。","options":["5","7","终身"],"answer":"A","why":"依据《安全生产法》，主要负责人未履行安全管理职责导致事故、尚不构成犯罪的，给予撤职处分，并在五年内不得担任任何生产经营单位的主要负责人；原题库答案“7年”无法律依据，正确为5年。顺带记：受刑事处罚或撤职处分期满后同样5年禁任，重大/特别重大事故责任人终身禁任本行业。","expl":"考点：主要负责人未履行安全职责导致事故，尚不构成刑事处罚的，给撤职处分，几年内不得担任任何生产经营单位的主要负责人。\n答案：五年。记住这个基准线：五年禁任。后面几题都是围着这个五年转。"},{"type":"判断","key":"第59题","stem":"生产经营单位的主要负责人违反《安全生产法》规定受刑事处罚或者撤职处分的,自刑罚执行完毕或者受处分之日起,五年内不得担任何生产经营单位的主要负责人;对重大、特别重大生产安全事故负有责任的,终身不得担任任何生产经营单位的主要负责人。（　）","options":[],"answer":"错","why":"错在「终身不得担任任何生产经营单位」——法律规定对重大、特别重大事故负有责任的，终身不得担任本行业生产经营单位的主要负责人，前半句「五年内不得担任任何单位主要负责人」是对的。「本行业」与「任何」一字之差就是命题点。","expl":"判断题，有陷阱。知识点：主要负责人受刑事处罚或撤职处分的，自刑罚执行完毕或受处分之日起，五年内不得担任任何生产经营单位的主要负责人；对重大、特别重大事故负有责任的，终身不得担任本行业生产经营单位的主要负责人。\n对照题目：题目说重大、特别重大事故责任者是终身不得担任任何行业。错就错在任意两个字上。法律原文是终身不得担任本行业。跨行可以，本行业终身禁入。"},{"type":"单选","key":"第60题","stem":"根据《生产安全法》,生产经营单位的主要负责人因未履行安全生产管理职责,生产安全事故被判处有期徒刑的,自刑期执行完毕之日起（　）","options":["2 年内不得担任本施工企业的中层管理人员","3 年内不得担任监理单位的主要负责人","5 年内不得担任任何生产经营单位的主要负责人","专业技术性较强的管理制度,应由企业安全主管部门负责审核"],"answer":"C","why":"主要负责人未履行安全生产管理职责受刑事处罚的，自刑罚执行完毕之日起，五年内不得担任任何生产经营单位的主要负责人。A、B的年限和岗位范围均与法定表述不符，只有C完整对应法条。","expl":"考点：主要负责人因未履职被判有期徒刑，自刑期执行完毕之日起怎么处理。答案：五年内不得担任任何生产经营单位的主要负责人。\n又回到那条基准线：五年。出狱或处分期满，五年内全行业禁任一把手。这题和第五十八题是同一考点，正反着考。"},{"type":"单选","key":"第61题","stem":"根据《生产安全法》,生产经营单位的主要负责人因未履行安全生产管理职责,导致发生一般安全生产事故被判处有期徒刑的,自刑期执行完毕之日起 （　）。","options":["2 年内不得担任本施工企业的中层管理人员","3 年内不得担任监理单位的主要负责人","5 年内不得担任任何生产经营单位的主要负责人","终身不得担任本行业生产经营单位的主要负责人"],"answer":"C","why":"即使因一般事故被判刑，也是自刑罚执行完毕之日起五年内不得担任任何生产经营单位的主要负责人，从业禁止不因事故等级减轻；“终身”仅适用于对重大、特别重大事故负有责任的情形，且限于本行业。","expl":"考点：因一般事故被判刑的，刑满后多久不得任职。答案还是：五年内不得担任任何生产经营单位的主要负责人。\n不管一般还是较大事故，只要判了刑，统一五年。只有重大、特别重大才升级到终身本行业禁入。这题第三次考五年，肯定记住了。"},{"type":"单选","key":"第62题","stem":"某生产经营单位发生了较大生产安全事故,该单位主要负责人可能受到的处罚有 （　）。","options":["处上一年年收入百分之三十的罚款","处上一年年收入百分之六十的罚款","处上一年年收入百分之九十的罚款","处上一年年收入百分之一百的罚款"],"answer":"B","why":"主要负责人未履行职责导致较大事故的，处上一年年收入百分之六十的罚款。比例口诀：一般事故40%、较大60%、重大80%、特别重大100%，本题较大事故对应60%，选B。","expl":"考点：罚款档位。发生了较大事故，单位主要负责人要被处上一年年收入百分之多少的罚款。答案：百分之六十。\n个人罚款四档：一般事故百分之四十；较大百分之六十；重大百分之八十；特别重大百分之百。规律：每升一级加二十，封顶年收入全罚。"},{"type":"单选","key":"第63题","stem":"生产经营单位的其他负责人和安全生产管理人员未履行《安全生产法》规定的安全生产管理职责,尚未构成犯罪的,可能受到的处罚是（　）","options":["批评教育","贵令限期改正并处罚款","暂停或者吊销其安全生产有关的资格","处上一年年收入百分之二十以上百分之五十以下的罚款"],"answer":"B","why":"其他负责人和安管人员未履职的，责令限期改正并处一万元以上三万元以下罚款。暂停或吊销资格、处年收入20%～50%罚款是“导致发生生产安全事故”后的加重责任，本题未构成犯罪，适用基础处罚。","expl":"考点：其他负责人和安全管理人员未履职，尚不构成犯罪的，怎么处理。答案：责令限期改正，并处罚款。\n注意层级：不构成犯罪，先限期改正加罚款；构成犯罪的，下一题再说。轻罪轻罚，先改后罚。"},{"type":"多选","key":"第64题","stem":"生产经营单位的其他负责人和安全生产管理人员未履行《安全生产法》规定的安全生产管理职贵,构成犯罪的,可能受到的处罚有 （　）","options":["罚款","限期改正","批评教育","追究刑事责任","暂停或撤销其与安全生产有关的资格"],"answer":"ADE","why":"未履职构成犯罪的，依照刑法追究刑事责任，同时可处罚款，并暂停或者撤销其与安全生产有关的资格。B限期改正、C批评教育是行政层面的轻措施，与“构成犯罪”情形不匹配，故选ADE。","expl":"多选。考点：其他负责人和安全管理人员未履职构成犯罪的，可能受的处罚。正确的是三条。\n罚款；追究刑事责任；暂停或者撤销其与安全生产有关的资格。\n错的是限期改正和批评教育。都到犯罪了，就没有批评教育这种温柔选项了。层级记法：不犯罪，改正加罚款；犯罪了，罚款加刑责加撤资格。"},{"type":"单选","key":"第65题","stem":"依据《安全生产法》,生产经营单位与从业人员订立协议,免除或者减轻其对从业人员因生产安全事故伤亡依法应承担的责任的,该协议无效对生产经营单位（　）","options":["责令停止生产","责令停产整顿","降低资质等级","主要负责人予以罚款"],"answer":"D","why":"与从业人员订立免责减责“生死协议”的，协议无效，并对生产经营单位的主要负责人、个人经营的投资人处二万元以上十万元以下罚款。A、B、C均不是该违法行为的法定责任形式。","expl":"考点：签了免责协议，协议无效，对生产经营单位怎么罚。答案：对主要负责人予以罚款。\n罚款额度是二万到十万，罚的是主要负责人个人，不是罚单位。协议无效加罚老板，双重教训。"},{"type":"单选","key":"第66题","stem":"某公司与临时招聘的农民工订立书面协议,施工过程中如出现个人违章而导致生产安全伤亡事故,一切责任后果均由个人自负,与公司无关。对于该协议说法错误的 （　）。","options":["该协议是双方意愿的体现,双方都应严格遵守","该协议违反了《安全生产法》,该约定无效","应急管理部门可以对该公司的主要负责人处二万元以上十万元以下的罚款","生产经营单位不得以任何形式与从业人员订立协议,免除或者减轻其对从业人员因生产安全事故伤亡依法应承担的责任的"],"answer":"A","why":"本题选错误项A：“伤亡自负”条款违反《安全生产法》强制性规定，属无效协议，不受法律保护，谈不上双方严格遵守。依据法条，应急管理部门可对主要负责人处2万～10万元罚款，C、D表述正确。","expl":"情景题。公司和农民工签协议，说违章出了伤亡事故责任自负。选错误的说法。答案：该协议是双方意愿的体现，双方都应严格遵守。\n为什么错？生死条款签了也无效，谈不上严格遵守。应急管理部门可以对主要负责人处二万到十万罚款，这个说法本身是对的。自愿不等于合法。"},{"type":"单选","key":"第67题","stem":"依据《安全生产法》,高危行业、领域的生产经营单位未按照国家规定投保安全生产责任保险的,可能承担的法律责任是（　）。","options":["责令停止生产","责令停产整顿","责令限期改正并处以罚款","追究刑事责任"],"answer":"C","why":"高危行业、领域单位未按国家规定投保安责险的，责令限期改正，处五万元以上十万元以下罚款；逾期未改正的，责令停产停业整顿，并处十万元以上二十万元以下罚款。基础责任是限期改正并罚款。","expl":"考点：高危行业没按国家规定投保安全生产责任保险，法律责任是什么。答案：责令限期改正，并处以罚款。\n高危行业安责险是强制的，不买先责令改正加罚款，不至于停产。口诀：该保不保，限期改，加罚款。"},{"type":"多选","key":"第68题","stem":"下列情形中可以对生产经营单位予以关闭处罚的有（　）","options":["经停产停业整顿,仍不具备法律、行政法规和国家标准或者行业标准规定的安全生产条件的","存在重大事故隐患,一年内三次受到《安全生产法》规定的行政处罚","存在重大事故隐患,一百八十日内二次受到《安全生产法》规定的行政处罚","拒不执行负有安全生产监督管理职责的部门作出的停产停业整顿决定的","不具备法律、行政法规和国家标准或者行业标准规定的安全生产条件,导致发生重大、特别重大生产安全事故的"],"answer":"ADE","why":"可予关闭的情形：经停产停业整顿仍不具备安全生产条件；不具备安全条件导致重大、特别重大事故；拒不执行停产停业整顿决定。B、C数字错误，法定门槛是一百八十日内三次、一年内四次受到行政处罚。","expl":"多选。考点：什么情形可以对生产经营单位予以关闭。正确的是三条。\n经停产停业整顿，仍不具备安全生产条件的；拒不执行停产停业整顿决定的；不具备安全条件，导致发生重大、特别重大事故的。\n错的两条都在时限和次数上挖坑：正确的触发线是，一百八十日内三次受到行政处罚，就够关闭。题目写一年内三次、一百八十日内二次，都不对。记法：一百八十天，挨三次罚，关门。"},{"type":"单选","key":"第69题","stem":"某事故导致一人死亡,依据事故等级情况,安监部门可以对事故发生单位处以 （　）罚款。","options":["200 万元以上、1000 万元以下","10 万元以上、20 万元以下","30 万元以上、100 万元以下","100 万元以上、200 万元以下"],"answer":"C","why":"死亡一人属一般事故，依据现行《安全生产法》对负有责任的事故发生单位处三十万元以上一百万元以下罚款（选C）。罚款档次联动记忆：一般30万～100万、较大100万～200万、重大200万～1000万、特别重大1000万～2000万；B的10万～20万是2007年旧条例口径，别混用。","expl":"考点：单位罚款档位。事故导致一人死亡，属于一般事故，对事故发生单位处多少罚款。答案：三十万元以上，一百万元以下。\n单位罚款四档要背：一般事故，三十万到一百万；较大事故，一百万到二百万；重大事故，二百万到一千万；特别重大，一千万到二千万。"},{"type":"单选","key":"第70题","stem":"某事故导致三人死亡,该起事故中施工企业可能被处于 （　）罚款","options":["10-20 万元","30-100 万元","100-200 万元","200-1000 万元"],"answer":"C","why":"死亡三人达到较大事故标准（三至十人死亡），对负有责任的施工企业处一百万元以上二百万元以下罚款。A对应一般事故、D对应重大事故档次，事故等级判断错则罚款档次必错。","expl":"考点：事故导致三人死亡，是较大事故，施工企业罚款区间。答案：一百万元到二百万元。\n三级三人算较大事故，按第二档罚一百万到二百万。跟上一题连着记：死一人一般档，三人较大档。事故分级和罚款档位是联动的。"},{"type":"单选","key":"第71题","stem":"依据《安全生产法》,应急管理部门对发生生产安全事故且负有责任的生产经营单位处以罚款的最高限额是 （　）。","options":["一千万元","二千万元","四千万元","一亿元"],"answer":"D","why":"特别重大事故对责任单位处一千万元以上二千万元以下罚款；情节特别严重、影响特别恶劣的，可按罚款数额的二倍以上五倍以下处以罚款，故最高限额为二千万元的五倍，即一亿元。","expl":"考点：应急管理部门对事故单位罚款的最高限额。答案：一亿元。\n怎么来的？特别重大事故罚一千万到二千万；情节特别严重、影响特别恶劣的，可以罚二倍以上五倍以下，二千万乘五，封顶一亿。这就是那顶格的一亿。"},{"type":"单选","key":"第72题","stem":"生产经营单位发生生产安全事故造成人员伤亡、他人财产损失的,应当依法承担赔偿责任,拒不承担或者其负责人逃匿的,由 （　）依法强制执行。","options":["应急管理部门","公安机关","劳动行政主管部门","人民法院"],"answer":"D","why":"事故赔偿责任属民事责任，单位拒不承担或其负责人逃匿的，由人民法院依法强制执行。强制执行权专属于审判机关，应急、公安、劳动部门均无权直接强制划拨单位财产。","expl":"考点：单位该赔不赔、负责人跑路，谁来强制执行。答案：人民法院。\n应急部门管罚款，赔偿要靠法院强制执行。行政归行政，司法归司法。口诀：赔偿不赔，法院见。"},{"type":"单选","key":"附2","stem":"关于建筑施工企业编制施工组织设计的要求,下列说法正确的是（　）","options":["可以用公司的安全计划来代替项目施工组织设计中的安全计划","对专业性较强的工程项目,如果规模较小,可以只编写施工方案","对专业性较强的工程项目,应当编制专项安全施工组织设计,并采取安全技术措施","所有的工程项目,都必须编制专项安全施工组织设计,并采取安全技术措施"],"answer":"C","why":"依据《建设工程安全生产管理条例》，对专业性较强的工程项目应当编制专项安全施工组织设计，并采取安全技术措施。A以公司计划代替、B以规模小为由免编均错误，D“所有工程”扩大了适用范围。","expl":"考点：施工组织设计。建筑施工企业编制施工组织设计，正确的说法是什么。答案：对专业性较强的工程项目，应当编制专项安全施工组织设计，并采取安全技术措施。\n错的三项：用公司的安全计划来代替，不行；规模较小就只写施工方案，不行；所有工程不分专业强弱都编专项，也不对。关键词：专业性较强的工程，才编专项。"},{"type":"单选","key":"附3","stem":"依据《建筑法》规定,对专业性较强的工程项目,应当编制（　）,并采取安全技术措施。","options":["专项安全施工组织设计","专项应急预案","适宜的安全管理制度","专项安全资金预算"],"answer":"A","why":"《建筑法》规定，对专业性较强的工程项目，应当编制专项安全施工组织设计并采取安全技术措施。应急预案、管理制度、资金预算均不是该条款要求的编制对象。","expl":"还是这个知识点，依据建筑法，专业性较强的工程项目应当编制什么。答案：专项安全施工组织设计。跟上一题连着记。"},{"type":"多选","key":"附4","stem":"建筑施工企业应当在施工现场采取 （　）等措施,有条件的,应当对施工现场实行封闭管理。","options":["维护安全","防范危险","预防火灾","警民联动","以包代管"],"answer":"ABC","why":"依据《建筑法》，建筑施工企业应当在施工现场采取维护安全、防范危险、预防火灾等措施；有条件的，应当对施工现场实行封闭管理。D、E均非法定措施，“以包代管”更是安全管理的大忌。","expl":"多选。考点：施工现场应当采取哪些措施。正确的是三条。\n维护安全；防范危险；预防火灾。有条件的，还对施工现场实行封闭管理。\n错的是警民联动和以包代管。以包代管尤其要记住，是安全管理里的反面典型：包出去就不管，绝对不行。"},{"type":"单选","key":"附5","stem":"建筑施工企业必须依法加强对建筑安全生产的管理,执行安全生产责任制。实行施工总承包的建筑工程,施工现场安全由 （　）负责。","options":["建设单位","总承包单位","监理单位","相应的分包单位"],"answer":"B","why":"实行施工总承包的，施工现场安全由总承包单位负责，总包对现场安全负总责。分包单位只对分包范围内的安全负责并服从总包管理，建设单位、监理单位均不承担现场安全的总责。","expl":"考点：实行施工总承包的建筑工程，施工现场安全由谁负责。答案：总承包单位。\n记住方向：总包对现场安全负总责。分包出事，先找总包。"},{"type":"单选","key":"附6","stem":"关于施工现场的安全管理,下列说法错误的是 （　）","options":["实行施工总承包的,由总承包单位负责","分包单位向总承包单位负责","分包单位向建设单位负责","分包单位应服从总承包单位的安全生产管理"],"answer":"C","why":"本题选错误项C：分包单位只向总承包单位负责，不直接向建设单位负责。A、B、D均为正确表述：总包对施工现场安全总负责，分包对其分包工程的安全负责并服从总包的安全生产管理。","expl":"选错误的说法。答案是：分包单位向建设单位负责。\n为什么错？责任链条是：分包单位向总承包单位负责，服从总包的安全生产管理，不直接向建设单位负责。口诀：分包向总包，总包向业主。"},{"type":"单选","key":"附7","stem":"建筑法规定,施工企业必须按照工程设计图纸和施工技术标准施工,不得偷工减料。如施工单位发现工程设计不合理需要修改的,应由（　）负责修改。","options":["施工单位","原设计单位","建设单位","总包单位"],"answer":"B","why":"施工单位必须按照工程设计图纸和施工技术标准施工，不得擅自修改设计。发现设计不合理应通过建设单位提出，由原设计单位负责修改设计，施工单位、建设单位、总包单位均无设计修改权。","expl":"考点：施工单位发现工程设计不合理，需要修改的，由谁负责修改。答案：原设计单位。\n施工单位不能自己改图，建设单位也不能改，必须原设计单位出修改。谁设计的谁改。"},{"type":"单选","key":"附8","stem":"建筑施工企业违反《建筑法》规定,对建筑安全事故隐患不采取措施予以消除,情节一般的,可对其（　）","options":["责令停业整顿","降低资质等级或者吊销资质证书","追究刑事责任","责令改正,可以处以罚款"],"answer":"D","why":"违反《建筑法》，对建筑安全事故隐患不采取措施消除且情节一般的，责令改正，可以处以罚款；情节严重的才责令停业整顿、降低资质等级或吊销资质证书。注意“情节一般”对应最轻的处罚档次。","expl":"考点：违反建筑法，对安全事故隐患不采取措施消除，情节一般的怎么处理。答案：责令改正，可以处以罚款。\n注意层级：情节一般，先责令改正加罚款；严重的才停业整顿、降资质、追刑责。先纠正，后升级。"},{"type":"单选","key":"附9","stem":"在施工过程中,施工人员发现设计图纸不符合技术标准,施工单位技术负责人采取的正确做法（　）","options":["继续按照工程设计图纸施工","按照技术标准修改工程设计","追究设计单位违法责任","及时提出意见和建议"],"answer":"D","why":"发现图纸不符合技术标准，施工单位应当及时提出意见和建议，通过建设单位交原设计单位处理；无权自行修改设计，也不能明知违规仍照图施工，更无权直接追究设计单位责任。","expl":"考点：施工中发现设计图纸不符合技术标准，施工单位技术负责人正确的做法。答案：及时提出意见和建议。\n不能继续照图施工，也不能自己按标准改图，更不能去追究设计单位。正确动作只有：提出来，报上去。"},{"type":"单选","key":"附10","stem":"《中华人民共和国消防法》规定,对建筑消防设施每年至少进行（　）次全面检测,确保完好有效。","options":["一","二","三","四"],"answer":"A","why":"《消防法》规定，对建筑消防设施每年至少进行一次全面检测，确保完好有效，检测记录应当完整准确并存档备查。“至少一次”是底线数字，二、三、四次均为干扰。","expl":"考点：消防法，建筑消防设施多久全面检测一次。答案：每年至少一次。口诀：消防设施，年检起步。"},{"type":"单选","key":"附11","stem":"施工现场应当制定的消防安全管理制度不包括（　）等。","options":["社区联防制度","用火用电作业及使用易燃易爆危险物品的管理制度","消防设施维护保养制度","消防安全检查制度"],"answer":"A","why":"施工现场消防安全制度包括用火用电作业及易燃易爆危险品管理制度、消防设施器材维护保养制度、消防安全检查制度等。社区联防属于社区治安范畴，与施工现场内部消防管理无关。","expl":"考点：施工现场的消防安全管理制度不包括哪个。答案：社区联防制度。\n用火用电和易燃易爆品管理制度、消防设施维护保养制度、消防安全检查制度，这些都是工地该有的。社区联防是社区的事，不沾边。"},{"type":"单选","key":"附12","stem":"《消防法》规定,进行（　）等具有火灾危险的作业人员和自动消系统的操作人员,必须持证上岗,并严格遵守消防安全操作规程。","options":["木工","电焊","油漆","防水"],"answer":"B","why":"进行电焊等具有火灾危险的作业人员和自动消防系统的操作人员，必须持证上岗并严格遵守消防安全操作规程。木工、油漆、防水工种不在该强制持证的列举之内。","expl":"考点：哪些人必须持证上岗并遵守消防安全操作规程。答案：电焊工，加上自动消防系统的操作人员。\n木工、油漆、防水都不用消防持证。动火作业里电焊最危险，一把焊枪能烧一栋楼，所以必须持证。"},{"type":"单选","key":"附13","stem":"《中华人民共和国消防法》规定,消防产品必须符合（　）","options":["地方标准","国际标准","国家标准","社团标准"],"answer":"C","why":"消防产品必须符合国家标准；没有国家标准的，必须符合行业标准。题干问一般性要求，故选国家标准；地方标准、社团标准、国际标准均不能作为消防产品的合格判定依据。","expl":"考点：消防产品必须符合什么。答案：国家标准。\n不是地方标准、不是社团标准。消防产品人命关天，只认国标。"},{"type":"多选","key":"附14","stem":"依法实行强制性产品认证的消防产品,由具有法定资质的认证机构按照国家标准、行业标准的强制性要求认证合格后,方可 （　）。","options":["设计","生产","销售","使用","销毁"],"answer":"BCD","why":"依法实行强制性产品认证的消防产品，由具有法定资质的认证机构按国家标准、行业标准的强制性要求认证合格后，方可生产、销售、使用。设计、销毁不属于认证后的市场准入环节，故选BCD。","expl":"多选。考点：实行强制性产品认证的消防产品，认证合格后方可做什么。正确的是三条：生产、销售、使用。\n错的是设计和销毁，认证管的是流通使用环节。记法：认证合格，才能生产、销售、使用。"},{"type":"单选","key":"附15","stem":"《消防法》规定了建筑构件和建筑材料的（　）必须符合国家标或行业标准。","options":["保湿性能","力学性能","防火性能","防水性能"],"answer":"C","why":"《消防法》规定，建筑构件、建筑材料和室内装修、装饰材料的防火性能必须符合国家标准或行业标准。保湿、力学、防水性能均非该条款规定的性能指标，考点锁定“防火性能”。","expl":"考点：建筑构件和建筑材料的什么性能必须符合国家标准或行业标准。答案：防火性能。\n不是保温、不是力学、不是防水，消防法只管防火这一项。"},{"type":"判断","key":"附16","stem":"没有国家防火性能标准的建筑构件、建筑材料和室内装修、装饰术料,防火性能必须符合行业标准。 （　）","options":[],"answer":"对","why":"正确。防火性能实行“国标优先、行标递补”规则：没有国家标准的，建筑构件、建筑材料和室内装修装饰材料的防火性能必须符合行业标准，题干表述与法条一致。","expl":"判断题。知识点：没有国家防火性能标准的建筑构件、建筑材料和室内装修装饰材料，防火性能必须符合行业标准。对照题目，说法正确。\n规则是：有国标按国标，没国标按行标。兜底逻辑，判断为对。"},{"type":"单选","key":"附17","stem":"施工企业拒不执行公安机关消防机构作出的停止施工处罚决定由（　）负责强制执行。","options":["公安机关","作出决定的部门或者机构","人民法院","安监部门"],"answer":"B","why":"依据《消防法》，当事人逾期不执行停止施工等处罚决定的，由作出决定的部门或者机构强制执行。人民法院的强制执行主要针对金钱给付义务，本题是对行为的处罚执行，主体是作出决定的机构。","expl":"考点：施工企业拒不执行消防机构作出的停止施工处罚决定，由谁负责强制执行。答案：作出决定的部门或者机构。\n谁作出的处罚，谁负责强制执行，消防处罚消防自己推。"},{"type":"单选","key":"附18","stem":"在道路上施工作作业时,施工单位应当在经批准的路段和时间内施工作业,并在距离施工地点（　）方向安全更离处设置安全警示标志","options":["四周","会车","背离","来车"],"answer":"D","why":"依据《道路交通安全法》，占道施工应在批准的路段和时间内进行，并在距离施工地点来车方向安全距离处设置明显的安全警示标志，提前警示来车避让。四周、会车、背离均不符合“来车方向”的法定要求。","expl":"考点：道路上施工作业，安全警示标志设置在哪里。答案：来车方向的安全距离处。\n不是四周、不是背离方向。标志要提前让开车的看见，所以是来车方向。口诀：警示牌，对着车流来。"},{"type":"多选","key":"附19","stem":"未经批准,擅自挖据道路、占用道路施工影响道路下通安全活动的,停止违法行为。可以由（　）责令停止违法行为。","options":["应急管理部门","公安机关交通管理部门","市政监管部门","城市综合管理部门","道路主管部门"],"answer":"BE","why":"依据《道路交通安全法》，擅自挖掘、占用道路施工影响交通安全的，由道路主管部门责令停止违法行为并恢复原状；公安机关交通管理部门也可责令停止违法行为、迅速消除隐患，故选BE，其余部门非法定主体。","expl":"多选。考点：未经批准擅自挖掘道路、占用道路施工影响交通安全的，可以由谁责令停止违法行为。正确的是两个。\n公安机关交通管理部门，和道路主管部门。应急管理部门、市政、城管都不在这条管。记法：占道施工归交警和道路部门管。"},{"type":"单选","key":"附20","stem":"未经批准,擅自挖掘道路、占用道路施工影响交通安全活动的,由道路主管部门责令停止违法行为,并恢复原状,并可以依法给予责任单位或人员（　）处罚。","options":["罚款","警告","记过","停业整顿"],"answer":"A","why":"道路主管部门对擅自挖掘、占用道路施工的，可责令停止违法行为、恢复原状，并依法给予罚款处罚。记过属内部行政处分，警告太轻，停业整顿不属于该条款规定的处罚种类。","expl":"考点：责令停止违法行为、恢复原状之外，还可以依法给予什么处罚。答案：罚款。\n不是警告记过，也不是停业整顿。占道施工违法的标准三连：停止违法、恢复原状、罚款。"},{"type":"多选","key":"附21","stem":"用人单位由于生产经营需要,经与（　）协商后可适长工作时间。","options":["所在部门领导","人力资源部","工会","现场管理人","劳动者本人"],"answer":"CE","why":"《劳动法》规定，用人单位由于生产经营需要，经与工会和劳动者协商后可以延长工作时间，一般每日不得超过一小时。部门领导、人力资源部、现场管理员均非法定协商对象，必须与工会和劳动者本人协商。","expl":"多选。考点：用人单位由于生产经营需要延长工作时间，要与谁协商。正确的是两个。\n工会，和劳动者本人。部门领导、人力资源部、现场管理员都说了不算。记法：加班要过两道关——工会和本人。"},{"type":"单选","key":"附22","stem":"正常情况下,用人单位因特珠原因需要加班的,在保障劳动者身体健康的条件下超长工作时间每日不得超过（　）小时","options":["1","2","3","4"],"answer":"C","why":"依据《劳动法》，加班时长三档记法：一般每日不超过1小时；特殊原因在保障劳动者身体健康的条件下每日不超过3小时；每月总计不超过36小时。口诀「一、三、三十六」。B的2小时是凑数干扰项；原题库只给了2/3/4且答案标成4小时，已订正为3小时。","expl":"考点：特殊原因需要加班，在保障劳动者身体健康的条件下，每日延长不得超过几小时。答案：三小时。\n法定数字：每日一般不超过一小时；特殊原因，在保障健康条件下每日不超过三小时；每月总计不超过三十六小时。记：一、三、三十六。"},{"type":"单选","key":"附23","stem":"某企业因赶工安排职工周末加班且无法安全补休,依据《劳动法》规定该企业应支付加斑职工不低于工资的（　） 的工资报酬。","options":["100%","150%","200%","300%"],"answer":"C","why":"休息日安排工作又不能安排补休的，支付不低于工资200%的工资报酬。150%对应工作日延时加班，300%对应法定休假日加班，三档比例务必对应清楚，本题周末加班不能补休对应200%。","expl":"考点：休息日安排加班又不能补休的，支付不低于工资百分之多少的报酬。答案：百分之二百。\n加班费三档要背：平时加班百分之一百五十；休息日不能补休，百分之二百；法定节假日，百分之三百。记法：一点五、二、三，越往后越贵。"},{"type":"单选","key":"附24","stem":"《劳动法》规定,用人单位必须建立健全劳动安全卫生制度,产格力安全卫生教育卫生规程和标准,对劳动者进行安全卫生教育,防止劳动过程中的事故,减少（　）","options":["人身伤害","职业危售","财产损失","经济损失"],"answer":"B","why":"《劳动法》规定，用人单位必须建立健全部劳动安全卫生制度，严格执行劳动安全卫生规程和标准，对劳动者进行安全卫生教育，防止劳动过程中的事故，减少职业危害，“职业危害”是法定表述。","expl":"考点：劳动法要求建立劳动安全卫生制度、进行安全卫生教育，防止劳动过程中的事故，减少什么。答案：职业危害。\n不是减少人身伤害、财产损失、经济损失，劳动安全卫生条款盯着的是职业危害这个词。"},{"type":"单选","key":"附25","stem":"《劳动法》规定,用人单位必须对从事有职业危遇作业的劳动者定期进行（　）","options":["专门培训","健康检查","安全教育","资格复审"],"answer":"B","why":"《劳动法》规定，用人单位必须对从事有职业危害作业的劳动者定期进行健康检查，并建立职业健康监护档案。专门培训、安全教育、资格复审都不是该条款的法定要求，考点锁定“健康检查”。","expl":"考点：用人单位必须对从事有职业危害作业的劳动者定期进行什么。答案：健康检查。\n不是专门培训、不是资格复审，是有毒有害岗位的定期体检。记法：危害岗位，定期体检。"},{"type":"单选","key":"附26","stem":"在劳动安全卫生方面,下列用人单位的做法中错误的是 （　）","options":["用人单位补习建立、健全劳动安全卫生制度","对劳动者进行劳动安全卫生教育,防止劳动过程中的事故,减少职业危害","用人单位必须为劳动者提供符合国家规定的劳动安全卫生条件和必要的劳动防护用品。","对从事有职业危害作业的劳动者应当在结束劳动合同时进行健康检查,合同期间再进行一次健康检查。"],"answer":"D","why":"本题选错误项D：对从事有职业危害作业的劳动者应当定期进行健康检查，而非只在劳动合同结束时检查一次，离职体检只是职业健康检查的一环。A、B、C均为用人单位的法定义务。","expl":"选用人单位做法错误的。答案是：对从事有职业危害作业的劳动者，应当在结束劳动合同时进行健康检查，合同期间再进行一次。\n为什么错？法律要求的是定期健康检查，不是只查两次完事。离岗时必须查，在岗期间要按周期反复查。一次性的体检安排，不合规。"},{"type":"多选","key":"附27","stem":"依据《劳动法》规定,用人单位必须对劳动者履行的义务包括（　）","options":["提供晋升机会","提供劳动安全卫生条件","提供意外伤害保险","不得延长劳动时间","提供必要的劳动防护用品。"],"answer":"BE","why":"用人单位的法定义务包括提供符合国家规定的劳动安全卫生条件和必要的劳动防护用品。晋升机会、意外伤害保险、“不得延长劳动时间”（可依法延长）均不是其法定义务，故选BE。","expl":"多选。考点：劳动法规定用人单位必须对劳动者履行的义务。正确的是两条。\n提供劳动安全卫生条件；提供必要的劳动防护用品。\n错的是提供晋升机会、提供意外伤害保险、不得延长劳动时间。注意：加班不是绝对禁止的，是限制性的，所以不得延长劳动时间这个说法太绝对，不选。"},{"type":"多选","key":"附28","stem":"《劳动法》规定,国家对其实行特殊劳动保护的有（　）","options":["学生","女职工","老人","未成年工","儿童"],"answer":"BD","why":"《劳动法》对女职工和未成年工实行特殊劳动保护。未成年工指年满十六周岁未满十八周岁的劳动者；学生、老人、儿童不是劳动法意义上的特殊劳动保护对象，故选BD。","expl":"多选。考点：国家实行特殊劳动保护的对象。答案：女职工，和未成年工。\n未成年工是指年满十六周岁未满十八周岁的劳动者。学生、老人、儿童都不是劳动法上的保护对象。记法：女职工加未成年工。"},{"type":"单选","key":"附29","stem":"根据《劳动法》规定,国家对女职工和未成年工实行特殊劳动保护,下列做法合法的是（　）","options":["安排女职工从事矿山井下劳动","安排女职工在经期从事高处作业","安排怀孕 8 个月的女职工加班","安排未成年工定期进行健康检查"],"answer":"D","why":"合法做法是D：安排未成年工定期进行健康检查。禁止安排女职工从事矿山井下等禁忌劳动，禁止安排经期女职工从事高处、低温、冷水作业，怀孕七个月以上的女职工不得安排加班和夜班。","expl":"考点：对女职工和未成年工的特殊保护，哪个做法合法。答案：安排未成年工定期进行健康检查。\n错的三项全是踩红线：安排女职工从事矿山井下劳动，禁止；安排女职工经期从事高处作业，禁止；安排怀孕八个月的女职工加班，禁止。"},{"type":"多选","key":"附30","stem":"根据《劳动法》规定,用人单位应当对其定期进行健康检查的人员（　）","options":["未成年工","专职安全员","从事有职业危害作业的劳动者","女职工","业务骨干"],"answer":"AC","why":"法定应定期健康检查的仅两类人：未成年工和从事有职业危害作业的劳动者。专职安全员、女职工、业务骨干均不属于强制定期体检范围，记住“未成年工＋职业危害作业”两类即可。","expl":"多选。考点：用人单位应当对哪些人员定期进行健康检查。答案：未成年工，和从事有职业危害作业的劳动者。\n专职安全员、女职工、业务骨干都不在法定体检范围。跟附25、附29连起来记：体检只盯着两类人。"},{"type":"单选","key":"附33","stem":"关于劳动合同与劳动关系说法以下正确的是（　）","options":["建立劳动关系就应当订立书面劳动合同","提交工伤申请时应当提供劳动合同","双方劳动关系在劳动合同签订时确立","先工作后签合同的最迟不超过 1 个月"],"answer":"A","why":"依据《劳动合同法》，建立劳动关系应当订立书面劳动合同，A正确。劳动关系自用工之日起建立而非合同签订时，C错；申请工伤可凭工资支付记录、考勤等证明劳动关系，不以劳动合同为前提。","expl":"考点：劳动合同与劳动关系。正确的说法是：建立劳动关系，就应当订立书面劳动合同。\n配套数字：已建立劳动关系未签合同的，应当自用工之日起一个月内订立书面合同。劳动关系自用工之日起算，不是从签合同那天算。"},{"type":"单选","key":"附34","stem":"在生产、作业中违反有关安全管理的规定,因而发生重大伤亡事故者造成其他严重后果的,属 （　）。","options":["重大责任事故罪","重大劳动安全事故罪","强今违章冒险罪","工程重大安全事犯罪"],"answer":"A","why":"在生产、作业中违反有关安全管理的规定，因而发生重大伤亡事故或者造成其他严重后果的，构成重大责任事故罪。B的主体是安全设施、条件不符合规定的责任人员，C须有强令行为，D针对降低工程质量的建设各方。","expl":"考点：刑法罪名。在生产作业中违反有关安全管理规定，因而发生重大伤亡事故，属于什么罪。答案：重大责任事故罪。\n这是安全事故里最基础、最常用的罪名。关键词：违反安全管理规定。记法：违章出大事，就是重大责任事故罪。"},{"type":"单选","key":"附35","stem":"施工单位的现场负责人违反有关安全管理的规定,发生了事故,现场责人可能遭受（　）的刑事处罚。","options":["3 年以下","5 年以下","3-7 年","5 年以上"],"answer":"A","why":"依据《刑法》重大责任事故罪：在生产作业中违反安全管理规定，因而发生重大伤亡事故的，处三年以下有期徒刑或者拘役；情节特别恶劣的，处三年以上七年以下有期徒刑。题目问基本情形，选「3 年以下」。记忆：基本档3年以下，恶劣档3-7年。","expl":"考点：重大责任事故罪的量刑。施工单位现场负责人违反安全管理规定发生事故，可能遭受的刑事处罚。答案：三年以下有期徒刑或者拘役。\n两档刑：基本档，三年以下或拘役；情节特别恶劣的，三年以上七年以下。题目问的是基本情形，选三年以下。"},{"type":"单选","key":"附36","stem":"在生产、作业中强令他人违章冒险作业,因而发生重大伤亡事故或者造成其他严重后果的,处（　） 年以下有期徒刑或者拘役","options":["一","三","五","七"],"answer":"C","why":"强令、组织他人违章冒险作业，因而发生重大伤亡事故或者造成其他严重后果的，处五年以下有期徒刑或者拘役；情节特别恶劣的，处五年以上有期徒刑。基础刑档是五年以下，而非一年、三年、七年。","expl":"考点：强令他人违章冒险作业，因而发生重大伤亡事故的，处几年以下有期徒刑或拘役。答案：五年。\n对比记：自己违章干活是三年以下；强令别人违章冒险，罪重一档，五年以下；情节特别恶劣的五年以上。谁下的命令谁罪重。"},{"type":"多选","key":"附37","stem":"依据《中华人民共和国刑法修正案(十一)》,下列行为中可能构成“危险作业罪”的有 （　）","options":["篡改、隐瞒、销毁直接关系生产安全的监控相关数据、信息的","未经依法批准或者许可,擅自从事交通运输的","涉及安全生产的事项未经依法批准,擅自从事建筑施工的","未经依法批准或者许可,擅自从事危险物品生产、经营、储存等高度危险的生产作业活动的","因存在重大事故隐患被依法责令立即采取排除危险的整改措施拒不执行的"],"answer":"ACDE","why":"依据《刑法修正案（十一）》，危险作业罪包括：篡改、隐瞒、销毁直接关系生产安全的监控等相关数据信息；存在重大事故隐患被责令整改而拒不执行；未经批准擅自从事建筑施工以及危险物品生产、经营、储存等高度危险作业。B交通运输不在列举范围。","expl":"多选。考点：刑法修正案十一新增的危险作业罪，哪些行为可能构成。正确的是四条。\n篡改、隐瞒、销毁监控等安全数据信息的；未经批准擅自从事建筑施工等危险生产经营活动的；未经批准擅自从事危险物品生产储存等高度危险作业的；存在重大事故隐患被责令整改而拒不执行的。\n错的是擅自从事交通运输，不在危险作业罪的列举里。危险作业罪的特点：还没出事也可能构罪，把安全的防线往前挪了一大步。"},{"type":"单选","key":"附38","stem":"在施工过程中,某施工企业的安全生产条件不符合国家规定,致使多人重伤、死亡,那么该事故责任人可能构成（　）","options":["重大责任事故罪","重大劳动安全事故罪","强令、组织他人违章冒险作业罪","工程重大安全事故罪"],"answer":"B","why":"安全生产设施或者安全生产条件不符合国家规定，因而发生重大伤亡事故的，构成重大劳动安全事故罪，追究直接负责的主管人员和其他直接责任人员。A针对作业中违章行为，C须有强令行为，D针对降低工程质量。","expl":"考点：安全生产条件不符合国家规定，致使多人重伤死亡，责任人构成什么罪。答案：重大劳动安全事故罪。\n区分：人违章操作出事，是重大责任事故罪；设施条件本身不达标出事，是重大劳动安全事故罪。一个管人祸，一个管硬件。"},{"type":"单选","key":"附39","stem":"某施工单位为降低造价,在施工中偷工减料,故意使用不合格建筑材料、构配件和设备,降低工程质量,导致建筑工程坍塌,致多人重伤、死亡该施工单位的行为构成（　）","options":["重大劳动安全事故罪","强令冒险作业罪","重大责任事故罪","工程重大安全事故罪"],"answer":"D","why":"建设单位、设计单位、施工单位、工程监理单位违反国家规定，降低工程质量标准，造成重大安全事故的，构成工程重大安全事故罪。偷工减料、故意使用不合格建材、降低工程质量是其典型行为特征，故选D。","expl":"考点：为降低造价偷工减料、使用不合格建材，降低工程质量导致建筑坍塌，构成什么罪。答案：工程重大安全事故罪。\n关键词：偷工减料、降低工程质量。这是建设、设计、施工、监理单位的罪。口诀：盖楼偷工减料塌了，工程重大安全事故罪。"},{"type":"单选","key":"附40","stem":"某施工企业施工中偷工减料,降低工程质标准,造成但尚未达到后果特别严重的程度。事故处理应追究直除了罚金还应该处（　）有期徒刑。","options":["1 年以上 3 年以下","5 年以下","3 年以上 5 年以下","5 年以上"],"answer":"B","why":"工程重大安全事故罪对直接责任人员处五年以下有期徒刑或者拘役，并处罚金；后果特别严重的，处五年以上十年以下有期徒刑。本题后果尚未达到特别严重，对应五年以下档，除罚金外处五年以下有期徒刑。","expl":"考点：工程重大安全事故罪的量刑。造成后果但尚未达到特别严重程度的，除罚金外处几年有期徒刑。答案：五年以下。\n两档刑：基本档五年以下加罚金；后果特别严重的，五年以上十年以下。跟附39连着记：偷工减料塌了楼，轻则五年下，重则五到十。"}]};
const KEY = 'jingjiang_' + QUIZ.title;
let answers = [], sel = [], locked = [];

function save() { try { localStorage.setItem(KEY, JSON.stringify({ answers, sel, locked })); } catch(e) {} }
function loadSaved() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.answers) { answers = s.answers; sel = s.sel; locked = s.locked; } } catch(e) {} }
function clearAll() { if (confirm('确定清空本章答题记录，从头再做吗？')) { localStorage.removeItem(KEY); location.reload(); } }

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
const L = 'ABCDE';
function optsHtml(i) {
  const q = QUIZ.questions[i];
  if (q.type === '判断') {
    return '<div class="tf">' + ['对','错'].map(t => {
      let cls = 'opt';
      if (locked[i]) cls += t === q.answer ? ' right' : (answers[i].mine === t ? ' wrong' : '');
      return `<button class="${cls}" ${locked[i]?'disabled':''} onclick="pick(${i},'${t}')">${t}</button>`;
    }).join('') + '</div>';
  }
  return q.options.map((o, k) => {
    const lt = L[k];
    let cls = 'opt';
    if (locked[i]) cls += q.answer.includes(lt) ? ' right' : (answers[i].mine.includes(lt) ? ' wrong' : '');
    else cls += (sel[i]||[]).includes(lt) ? ' sel' : '';
    return `<button class="${cls}" ${locked[i]?'disabled':''} onclick="pick(${i},'${lt}')"><b>${lt}</b>　${esc(o)}</button>`;
  }).join('') + (q.type === '多选' && !locked[i] ? `<button class="confirm" ${(sel[i]&&sel[i].length)?'':'disabled'} onclick="confirmMulti(${i})">确　认</button>` : '');
}
function verdictHtml(i) {
  const q = QUIZ.questions[i];
  if (!locked[i]) return '';
  const a = answers[i];
  let h = a.ok
    ? `<div class="vline">✅ 答对了</div>`
    : `<div class="vline">❌ 答错了 · 你选 ${esc(a.mine)} · 正确答案 <u>${q.answer}</u></div>`;
  if (q.why) h += esc(q.why) + '<br>';
  if (q.expl) h += `<b class="h">📖 详细讲解：</b><br>` + esc(q.expl);
  return `<div class="verdict ${a.ok?'ok':'no'}">${h}</div><button class="re" onclick="redo(${i})">↺ 重新做这题</button>`;
}
function renderQ(i) {
  const q = QUIZ.questions[i];
  document.getElementById('q' + i).innerHTML =
    `<div class="qno"><span class="badge">${q.type}</span>第 ${i+1} 题${q.key && q.key.startsWith('附') ? '（附录）' : ''} · ${q.key || ''}</div>` +
    `<div class="stem">${esc(q.stem)}</div>` + optsHtml(i) + verdictHtml(i);
  updateBar();
}
function renderAll() {
  document.getElementById('list').innerHTML = QUIZ.questions.map((q,i)=>`<div class="q" id="q${i}"></div>`).join('');
  QUIZ.questions.forEach((_,i)=>renderQ(i));
}
function updateBar() {
  document.getElementById('pdone').textContent = answers.filter(a=>a).length;
  document.getElementById('pok').textContent = answers.filter(a=>a&&a.ok).length;
}
function pick(i, v) {
  if (locked[i]) return;
  const q = QUIZ.questions[i];
  if (q.type !== '多选') submit(i, [v]);
  else { sel[i] = sel[i] || []; const k = sel[i].indexOf(v); k>=0 ? sel[i].splice(k,1) : sel[i].push(v); save(); renderQ(i); }
}
function confirmMulti(i) { if (sel[i] && sel[i].length) submit(i, [...sel[i]].sort()); }
function submit(i, vals) {
  const q = QUIZ.questions[i];
  const std = q.type === '判断' ? q.answer : q.answer.split('').sort().join('');
  const mine = q.type === '判断' ? vals[0] : vals.join('');
  answers[i] = { mine, ok: mine === std };
  locked[i] = true;
  save(); renderQ(i);
}
function redo(i) {
  answers[i] = null; locked[i] = false; sel[i] = sel[i] ? sel[i].splice(0, sel[i].length) && null : null;
  save(); renderQ(i);
}
function copyAns() {
  const text = answers.map((a,i)=>a?`${i+1}${a.mine}`:null).filter(Boolean).join(' ') || '（还没答题）';
  const done = () => { const b = document.getElementById('copybtn'); b.textContent = '✅ 已复制，去聊天粘贴'; setTimeout(()=>b.textContent='📋 复制已答成绩', 2000); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(done); else done();
}
answers = new Array(QUIZ.questions.length).fill(null);
sel = new Array(QUIZ.questions.length).fill(null);
locked = new Array(QUIZ.questions.length).fill(false);
loadSaved();
renderAll();
</script>
</body>
</html>
