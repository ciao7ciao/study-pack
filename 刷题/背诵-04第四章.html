<style>

#bar { position: fixed; top: 0; left: 0; right: 0; z-index: 9; background: #ffffffee; backdrop-filter: blur(8px); border-bottom: 1px solid #e0e6ec; padding: 10px 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

.expl { margin-top: 10px; padding: 12px 15px; border-radius: 10px; background: #fff8e6; border: 1px solid #eee0ae; color: #4a3f28; font-size: 14.5px; line-height: 1.8; white-space: pre-wrap; }

<script>
const QUIZ = {"title":"第四章","questions":[{"type":"判断","key":"第1题","stem":"安全与危险之间是绝对的关系,不会相互转化。 （　）","options":[],"answer":"错","why":"错。安全与危险是相对的、动态的关系，二者可相互转化：措施到位则转危为安，管理松懈则安变危。“绝对关系、不会转化”违背安全辩证原理，故该说法错误。","expl":""},{"type":"单选","key":"第2题","stem":"下列关于安全与危险的说法,错误的是 （　）","options":["危险必须指明具体对象","危险事可以转化成安全的事","安全的事不会变成危险的事","采取有效措施可以减少安全事故发生"],"answer":"C","why":"依据安全与危险的辩证关系，两者可双向转化，安全措施失守时安全的事也会变成危险的事，故C错误。A危险须指明具体对象、B危险可转化为安全、D措施可减少事故，均为正确表述。","expl":""},{"type":"单选","key":"第3题","stem":"下面对安全生产概念的理解,说法错误的是 （　）","options":["安全生产要求社会生产活动中的人、机、物料、环境、方法等方面和谐运作","安全生产的方针是对生产过程中的各种事故风险和伤害因素进行有效规划","安全生产的目的是切实保护劳动者的生命安全和身体健康","安全生产是使劳动过程在符合安全要求的物质条件和工作秩序下进行"],"answer":"B","why":"安全生产要求对生产过程中的各种事故风险和伤害因素进行有效“控制”而非“规划”，B偷换概念。其余三项从要素和谐运作、保护生命健康、物质条件与秩序三个角度阐述安全生产，均正确。","expl":""},{"type":"单选","key":"第4题","stem":"下面关于安全与生产的统一关系,描述错误的是 （　）","options":["搞好安全工作,改善劳动条件,可以调动职工的生产积极性","减少职工伤亡,可以减少劳动力的损失","搞好安全工作,会增加企业开支,从而会影响生产的发展","安全是生产的前提条件,不能保证安全就不得进行生产"],"answer":"C","why":"安全与生产是统一关系：搞好安全能调动积极性、减少伤亡与劳动力损失、促进生产发展。C把安全投入说成增加开支、影响生产的负担，违背“安全是生产的前提”，故错误。","expl":""},{"type":"多选","key":"第5题","stem":"安全生产管理的目的是 （　）","options":["保证生产安全 、","降低安全费开支,提高企业利润","保证人与机器设备、物料、环境的和谐","实现人身安全、财产安全","消除隐患,保证验收指标满足要求"],"answer":"ACD","why":"安全生产管理的目的是保证生产安全、人与机器设备物料环境和谐、实现人身和财产安全并消除隐患；B把降低开支提高利润当目的、E为满足验收指标除患，均偏离保护人这一根本目的。","expl":""},{"type":"单选","key":"第6题","stem":"下面关于安全检查法的内容,说法错误的是（　）","options":["检查数据必须来源于企业组成的检查组","形式主要有定期检查、不定期检查和特殊检查","安全检查应预先做好思想上、业务上的准备","检查过程应防止走形式、走过场"],"answer":"A","why":"安全检查数据来源广泛，可来自自查、上级检查、行业督查等，并非必须由企业检查组产生，A过于绝对。B检查形式、C事前思想业务准备、D防止走过场均是安全检查法的正确要求。","expl":""},{"type":"单选","key":"第7题","stem":"下面关于安全目标管理法的内容,说法不正确的是 （　）","options":["安全目标管理是安全管理的集中要求和目的所在","安全目标管理是将企业一定时期的安全工作任务转化为明确的安全工作目标","安全目标管理要求企业将安全工作目标分解到本企业的各个部门和个人","安全目标管理要求企业各部门和个人参考所确定的安全工作目标进行工作"],"answer":"D","why":"目标管理要求各部门和个人严格按确定的安全目标开展工作并对结果负责，“参考”意味着可执行可不执行，弱化了目标的约束力，故D错误；A、B、C是目标管理的正确内涵。","expl":""},{"type":"单选","key":"第8题","stem":"下面关于安全目标管理法的内容,说法不正确的是 （　）","options":["安全目标管理是一种信任性、指导性的管理","安全目标管理应制定方针、目标,并安排管理日程","安全目标管理依靠企业各部门及员工自觉行动和严格检查实现","安全目标管理是一种重视人、激励人的客观规律性的管理"],"answer":"D","why":"安全目标管理是信任性、指导性、重视人激励人的管理，但说它是一种“客观规律性的管理”表述不当，故D错误；A性质、B做法、C实现方式的说法均正确，易在A与D间纠结，注意D与教材表述不符。","expl":""},{"type":"单选","key":"第9题","stem":"“执行计划”,属于戴明循环管理法（　） 阶段的工作任务。","options":["计划","实施","检查","处理"],"answer":"B","why":"戴明循环即PDCA：P计划、D实施、C检查、A处理。“执行计划”属实施阶段任务。易误选A，计划阶段只是制定目标和方案，把计划付诸行动的才是实施。","expl":""},{"type":"单选","key":"第10题","stem":"“总结经验,纳入标准”,属于戴明循环管理法（　） 阶段的工作任务。","options":["计划","实施","检查","处理"],"answer":"D","why":"处理阶段的任务是对检查结果总结定论：成功经验纳入标准固化，失败教训防止重犯。易误选C，检查阶段只对照计划查找问题，不负责把经验升为标准。","expl":""},{"type":"单选","key":"第11题","stem":"“重大遗漏问题转入下期考虑”,属于戴明循环管理法 （　） 阶段的工作任务。","options":["计划","实施","检查","处理"],"answer":"D","why":"PDCA是滚动上升的闭环，本期未解决的重大遗漏问题转入下一循环继续解决，这正是处理阶段的职责。易误选B，实施阶段只按计划执行，不管遗留问题的去向。","expl":""},{"type":"判断","key":"第12题","stem":"风险预控是在危险源辨识和风险评估的基础上,预先采取措施消除或控制风险的过程。（　）","options":[],"answer":"对","why":"对。风险预控的核心流程是先辨识危险源、评估风险，再预先采取措施消除或控制风险，体现关口前移、预防为主的安全原理，该说法准确。","expl":""},{"type":"判断","key":"第13题","stem":"风险预控是在生产安全事故分析的基础上,预先采取措施消除或控制风险的过程。 （　）","options":[],"answer":"错","why":"错。风险预控的基础是危险源辨识和风险评估，题干偷换成“生产安全事故分析”。事故分析属事后管理，风险预控强调事前预防，两者性质不同，故说法错误。","expl":""},{"type":"多选","key":"第14题","stem":"常用的安全管理方法有 （　）","options":["戴明循环管理法","安全检查法","风险预控法","强制比例法","安全目部管理法"],"answer":"ABCE","why":"常用安全管理方法可记“戴、检、险、目”四法：戴明循环管理法、安全检查法、风险预控法、安全目标管理法；D“强制比例法”是凑数干扰项，不属于安全管理方法体系。","expl":""},{"type":"多选","key":"第15题","stem":"下面关于当前通信建设工程领域安全生产形势的描述,正确的是 （　）。","options":["近年来安全生产事故总量逐年增加","安全生产意识比较淡薄","从业人员安全生产知识和技能不足","安全生产投入仍然不足","安全生产责任制度落实不到位"],"answer":"BCDE","why":"当前通信建设领域存在安全意识淡薄、人员知识技能不足、投入不足、责任制落实不到位等问题，较大事故时有发生；但事故总量并未逐年增加，A错误。易受“事故很多”的印象误导而误选A。","expl":""},{"type":"判断","key":"第16题","stem":"当前,通信建设工程领域的安全生产事故总量很多,较大安全生产事故时有发生。 （　）","options":[],"answer":"对","why":"对。当前通信建设工程领域安全生产事故总量仍然很多，较大事故时有发生，安全生产形势依然严峻。注意与“逐年增加”区分：总量多是事实，不代表逐年上升。","expl":""},{"type":"单选","key":"第17题","stem":"安全生产管理方针的基石、安全生产工作的重心是（　）","options":["安全第一,预防为主,综合治理","安全第一","预防为主","综合治理"],"answer":"A","why":"“安全第一、预防为主、综合治理”十二字方针是安全生产管理方针的基石和安全生产工作的重心，三者是有机整体；B、C、D各自只取其中一项，表述片面不完整。","expl":""},{"type":"单选","key":"第18题","stem":"职工在劳动过程中的安全、健康应由（　） 负责。","options":["政府","行业","社会","生产经营单位"],"answer":"D","why":"依据《安全生产法》，生产经营单位是安全生产的责任主体，职工劳动过程中的安全健康由本单位直接负责；政府是监管方、行业和社会是监督方。易误选A，政府监管不能代替企业担责。","expl":""},{"type":"多选","key":"第19题","stem":"对于安全生产工作机制中的“职工参与”,要求企业职工应 （　）","options":["参与制定或者修改企业的各项规童制度","参与工会组织的“查隐患、保安全”工作","批评、检举、控告影响工程质量的行为","无条件执行企业管理人员下达的各项指令","按照企业制度、规程的规定进行生产作业"],"answer":"BE","why":"职工参与要求参加工会组织的“查隐患、保安全”活动并按制度规程作业；C错在应检举控告的是影响安全生产行为而非工程质量；D“无条件执行各项指令”错，对违章指挥应拒绝；A范围过宽。","expl":""},{"type":"单选","key":"第20题","stem":"在安全生产工作机制中,做好安全生产工作的基础是 （　）","options":["生产经营单位负责","职工参与","政府监管","社会监督"],"answer":"A","why":"安全生产工作机制中，生产经营单位负责是做好安全生产工作的基础——企业是责任主体，职工参与、政府监管、社会监督都在这一基础上协同发力。口诀：单位负责打基础。","expl":""},{"type":"单选","key":"第21题","stem":"在实际管理工作中,领导班子分工对所分管单位或部门同样负有安全管理主体责任。这体现了（　） 的安全生产管理原则。","options":["企业主要负责人对本单位安全生产工作全面负责","谁主管谁负责","管生产必须管安全","全员参与"],"answer":"B","why":"领导班子按分工对分管单位或部门负安全管理主体责任，正体现“谁主管谁负责”原则。易误选C，“管生产必须管安全”针对生产组织者，本题强调分管领导对分管范围的责任归属。","expl":""},{"type":"单选","key":"第22题","stem":"安全生产,人人有责体现了 （　） 的安全生产管理原则,","options":["谁主管谁负责","管生产必须管安全","全员参与","安全第一"],"answer":"C","why":"“安全生产，人人有责”直指全员参与原则——安全不只是领导和安全员的事，每个岗位每个人都要参与。谁主管谁负责、管生产必须管安全均只针对管理者，与“人人”不符。","expl":""},{"type":"单选","key":"第23题","stem":"安全管理是在生产经营活动中进行的不断变化、不断完善的一种动态管理过程,因此,必须坚持 （　） 的安全生产管理原则。","options":["谁主管谁负责","管生产必须管安全","全员参与","持续改进"],"answer":"D","why":"题干“不断变化、不断完善、动态管理”是持续改进原则的关键词，安全管理如PDCA循环般螺旋上升、永无止境，故选D；其余三项与动态完善的描述无关。","expl":""},{"type":"多选","key":"第24题","stem":"下列活动中,属于企业安全生产主要任务的是 （　）","options":["执行国家的有关法律、法规、方针、政策","分析研究生产、经营中存在的阻碍企业发展的因素","从组织、技术、管理上采取措施,消除或控制影响安全的因素","防止生产安全事故的发生","保证职工的安全和健康,保障国家财产安全"],"answer":"ACDE","why":"企业安全生产主要任务是执行国家法律法规方针政策，从组织、技术、管理上消除控制不安全因素，防止事故，保障职工安全健康和国家财产安全；B分析阻碍企业发展的因素属经营管理，不是安全任务。","expl":""},{"type":"单选","key":"第25题","stem":"下面关于企业安全生产主要任务的描述,不准确的是 （　）","options":["企业应经常对各级领导、特种作业人员和所有职工进行安全教育、培训","企业应做好安全生产费用管理,保证安全生产投入,完善安全生产条件","企业应依据分包合同的约定,检查工程项目的进度及质量是否满足要求","企业应加强现场的安全管理,严格遵守安全生产操作规范"],"answer":"C","why":"企业安全生产主要任务围绕“安全”展开：教育培训、费用投入、现场安全管理均是；C检查工程项目的进度及质量属工程质量管理职责，不属于安全生产任务，故描述不准确。","expl":""},{"type":"单选","key":"第26题","stem":"下面关于安全生产目标管理的描述,不正确的是 （　）","options":["安全生产目标管理就是围绕着安全生产目标而进行的一系列安全生产管理工作","施工企业应依据国家的总体发展目标,制订企业安全生产年度及中长期安全目标","安全管理目标应包括生产安全事故控制指标、安全生产及文明施工管理目标","安全生产管理目标一旦确定,应采取一系列措施去努力实现这些目标"],"answer":"B","why":"企业应依据自身安全生产状况和企业发展目标制定安全目标，而非依据“国家总体发展目标”，B偷换依据主体；A、C、D分别说明目标管理内涵、目标内容与执行要求，均正确。","expl":""},{"type":"单选","key":"第27题","stem":"下面关于安全生产目标管理的任务描述,错误的是 （　）","options":["确定目标、合并目标","明确责任","落实措施","严格考核、实施奖惩"],"answer":"A","why":"安全生产目标管理的任务是确定目标、分解目标、明确责任、落实措施、严格考核与奖惩；A“合并目标”方向相反——目标要自上而下层层分解到部门和个人，不是合并。","expl":""},{"type":"多选","key":"第28题","stem":"做好安全目标管理,应确定实现目标的措施和手段。其中措施应包括（　）","options":["组织措施、技术措施","目标完成的时间","目标完成应遵循的程序","目标的实现方法"],"answer":"ABCD","why":"实现目标的措施应包括组织措施、技术措施、目标完成时间、遵循的程序和实现方法；“落实目标的人员及负责人”属于明确责任的范畴，不属于措施本身，故E不选。","expl":""}]};
const L = 'ABCDE';
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
document.getElementById('list').innerHTML = QUIZ.questions.map((q, i) => {
  let opts;
  if (q.type === '判断') {
    opts = ['对','错'].map(t => `<div class="opt ${t===q.answer?'right':''}">${t}</div>`).join('');
  } else {
    opts = q.options.map((o,k) => `<div class="opt ${q.answer.includes(L[k])?'right':''}"><b>${L[k]}</b>　${esc(o)}</div>`).join('');
  }
  const expl = (q.why ? esc(q.why) + '<br>' : '') + (q.expl ? '<b class="h">📖 详细讲解：</b><br>' + esc(q.expl) : (q.why || q.expl ? '' : '（讲解待补，先记答案）'));
  return `<div class="q">
    <div class="qno"><span class="badge">${q.type}</span>第 ${i+1} 题${q.key && q.key.startsWith('附') ? '（附录）' : ''}</div>
    <div class="stem">${esc(q.stem)}</div>
    ${opts}
    <div class="ansline">✔ 答案：${q.answer}</div>
    <div class="expl">${expl}</div>
  </div>`;
}).join('');
</script>
</body>
</html>
