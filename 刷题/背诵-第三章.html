<script>
const QUIZ = {"title": "第三章", "questions": [{"type": "单选", "key": "第1题", "stem": "下列对通信工程建设、勘察、设计、施工、监理等安全生产责任主体的要求,错误的是（　）", "options": ["必须遵守安全生产法律、法规", "执行保障生产安全的国家标准、行业标准", "必须进行安全生产科技创新", "确保通信工程建设安全生产,依法承担安全生产责任"], "answer": "C", "why": "", "expl": "第三章第一题。考点：通信工程各责任主体的共同要求。错误的说法是：必须进行安全生产科技创新。\n对通信建设、勘察、设计、施工、监理各方的要求是：遵守安全生产法律法规，执行保障安全的国家标准、行业标准，确保安全生产、依法承担责任。科技创新是鼓励，不是必须，说必须就是错的。"}, {"type": "多选", "key": "第2题", "stem": "下列安全生产责任中,属于建设单位的是 （　）", "options": ["建设工程安全生产费不得打折", "严格按照工程建设强制性标准和安全生产操作规范进行施工作业", "工程合同中应明确安全生产费支付方式、数额及时限", "对有可能引发通信工程安全隐患的灾害提出防治措施", "审查施工组织设计中的安全技术措施和安全专项施工方案"], "answer": "AC", "why": "", "expl": "多选。考点：哪些属于建设单位的安全生产责任。正确的是两条。\n建设工程安全生产费不得打折；工程合同中应明确安全生产费的支付方式、数额及时限。\n错的三条：按强制标准施工作业是施工单位的；对灾害提出防治措施是勘察设计单位的；审查施工组织设计是监理单位的。口诀：建设单位管给钱、管合同。"}, {"type": "单选", "key": "第3题", "stem": "通信工程开工前,（　） 应当明确参与工程相关单位的安全生产责任", "options": ["建设单位", "设计单位", "施工单位", "监理单位"], "answer": "A", "why": "", "expl": "考点：通信工程开工前，谁应当明确参与工程相关单位的安全生产责任。答案：建设单位。\n工程是建设单位发包的，开工前由它把各家的安全责任划清楚。谁发包，谁立规矩。"}, {"type": "单选", "key": "第4题", "stem": "下列安全生产责任中,属于建设单位的是 （　）", "options": ["不得压缩合同工期", "勘察文件应当真实、准确,满足通信建设工程安全生产的需要", "明确安全费用提取和使用的程序、职责及权限", "对施工单位安全管理人员安全生产知识和管理能力进行考核"], "answer": "A", "why": "", "expl": "考点：又一条建设单位责任。答案：不得压缩合同工期。\n抢工期就是抢事故，所以法律明文禁止建设单位压缩合同工期。其他三条：勘察文件真实准确是勘察单位的；安全费用提取程序是企业内部管理；考核施工安全管理人员不归建设单位管。"}, {"type": "单选", "key": "第5题", "stem": "应当严格执行操作规程,采取措施保证各类管线、设施和周边建筑物、构筑物的安全。对有可能引发通信工程安全隐患的灾害提出防治措施。这是（　）的安全生产责任。", "options": ["监理单位", "施工单位", "勘察设计单位", "建设单位"], "answer": "C", "why": "", "expl": "考点：保证管线设施和周边建筑物安全、对可能引发隐患的灾害提出防治措施，这是谁的责任。答案：勘察设计单位。\n地下有什么管线、旁边有什么建筑，是勘察设计单位最清楚的，所以保护措施和灾害防治由它们提出。记法：谁勘探谁清楚，谁设计谁提醒。"}, {"type": "单选", "key": "第6题", "stem": "设计单位必须在设计文件中（　）计列安全生产费。", "options": ["全额", "部分", "按建设单位要求", "按工程建设需求"], "answer": "A", "why": "", "expl": "考点：设计单位必须在设计文件中怎样计列安全生产费。答案：全额。\n安全费必须全额列入概预算，不能打折、不能按建设单位要求打折。安全钱，一分不能少。"}, {"type": "多选", "key": "第7题", "stem": "下列安全生产责任中,属于设计单位的是 （　）。", "options": ["建设工程安全生产费不得打折", "工程概预算必须按照相关规定全额列出安全生产费用", "工程合同中应明确支付方式、数额及时限", "对有可能引发通信工程安全隐患的灾害提出防治措施", "审查施工组织设计中的安全技术措施和安全专项施工方案"], "answer": "BD", "why": "", "expl": "多选。考点：属于设计单位的安全生产责任。正确的是两条。\n工程概预算必须按照相关规定全额列出安全生产费用；对有可能引发通信工程安全隐患的灾害提出防治措施。\n错的三条又碰到老熟人了：安全费不得打折、合同明确支付方式，是建设单位；审查施工组织设计，是监理单位。"}, {"type": "多选", "key": "第8题", "stem": "企业的安全生产管理人员不包括 （　）", "options": ["企业主要负责人", "企业项目负责人", "专职安全生产管理人员", "项目兼职安全巡视人员"], "answer": "ABC", "why": "", "expl": "考点比较绕，直接给你干货：企业安全生产的'三类人'，也叫安管人员，指的是：企业主要负责人、项目负责人、专职安全生产管理人员。\n题目问'不包括'，按题库答案，项目兼职安全巡视人员不算安管人员。记住三类的框架，这类题的选项不管怎么排，都在这个框里挑。"}, {"type": "单选", "key": "第9题", "stem": "不属于企业安全生产“三类人”或企业“安管人员”的是 （　）", "options": ["企业主要负责人", "项目负责人", "安全生产管理人员", "施工现场操作人员"], "answer": "D", "why": "", "expl": "考点：谁不属于企业安全生产三类人。答案：施工现场操作人员。\n主要负责人、项目负责人、安全生产管理人员是管理层的三类人；一线操作工人干活再重要，也不属于安管人员。"}, {"type": "多选", "key": "第10题", "stem": "企业必须通过由通信主管部门对其安全生产知识和管理能力考核的人员有（　）。", "options": ["单位主要负责人", "单位工程管理部门主要负责人", "项目负责人", "专职安全生产管理人员", "班组安全生产管理人员"], "answer": "ACD", "why": "", "expl": "多选。考点：哪些人必须通过通信主管部门的安全生产知识和管理能力考核。答案：单位主要负责人、项目负责人、专职安全生产管理人员，正好就是三类人。\n错的是工程管理部门负责人、班组安全员。通信行业只考核三类人，考核发证，这叫A类、B类、C类证，后面几题细讲。"}, {"type": "单选", "key": "第11题", "stem": "根据《通信建设工程安全管理规定》,施工单位应对本单位所有管理人员和作业人员每年至少进行 （　） 次安全生产教育培训。", "options": ["一", "二", "三", "四"], "answer": "A", "why": "", "expl": "考点：施工单位对本单位所有管理人员和作业人员，每年至少进行几次安全生产教育培训。答案：一次。\n老规矩：安全教育，年检一次起步。跟第二章的数字对上了。"}, {"type": "单选", "key": "第12题", "stem": "根据《通信建设工程安全管理规定》规定,工程分包单位对管理人员和作业人员每年应至少进行_（　）次安全生产教育培训。", "options": ["一", "二", "三", "四"], "answer": "A", "why": "", "expl": "考点：分包单位的管理人员和作业人员每年至少培训几次。答案：也是一次。\n总包分包一个标准，谁的人谁培训，一年一遍不能少。"}, {"type": "判断", "key": "第13题", "stem": "施工现场应由具有一定施工经验的人员对安全生产进行监督。（　）", "options": [], "answer": "错", "why": "", "expl": "判断题。题目说：施工现场应由具有一定施工经验的人员对安全生产进行监督。\n错。安全监督是专职安全生产管理人员的活，不是随便找个有经验的人就能盯安全。专职两个字就是门槛。"}, {"type": "单选", "key": "第14题", "stem": "工程施工前,组织施工安全技术交底的人员是（　）", "options": ["企业技术负责人", "施工项目负责人", "项目安全负责人", "作业现场负责人"], "answer": "C", "why": "", "expl": "考点：通信工程施工前，组织施工安全技术交底的是谁。答案：项目安全负责人。\n注意：这道题依据的是通信行业的规定，答案是项目安全负责人；第二章那道依据建设工程安全生产管理条例，答案是项目技术负责人。两个法规两个答案，看题目引用哪部规定。"}, {"type": "判断", "key": "第15题", "stem": "井下、高空、用电作业时,必须配备地下管线探测仪、防护绳、防触电等用具。（　）", "options": [], "answer": "错", "why": "", "expl": "判断题。题目说：井下、高空、用电作业时，必须配备地下管线探测仪、防护绳、防触电等用具。\n错在张冠李戴。井下作业要配的是气体检测仪和通风设备；地下管线探测仪是开挖前探地下管线用的，不是下井用具。用具要跟作业类型对得上。"}, {"type": "多选", "key": "第17题", "stem": "下列关于施工单位安全生产责任的说法,正确的是 （　）", "options": ["建立健全安全生产教育培训制度", "严格按照工程建设强制性标准和安全生产操作规范施工", "保证施工项目的安全生产费全部用于本项目的安全生产", "在有限空间安全作业,必须严格执行作业审批制度", "建立健全生产安全事故隐患排查治理制度"], "answer": "ABDE", "why": "", "expl": "多选。考点：施工单位安全生产责任的说法，正确的是四条。\n建立健全安全生产教育培训制度；严格按照工程建设强制性标准和安全生产操作规范施工；有限空间作业严格执行审批制度；建立健全生产安全事故隐患排查治理制度。\n错的是保证安全生产费全部用于本项目这条，说法跟规定原文不一致。四大制度记法：培训、标准、审批、排查。"}, {"type": "多选", "key": "第18题", "stem": "监理单位对通信工程项目的安全责任包括 （　）", "options": ["参加安全技术交底", "组织安全生产检查", "进行现场安全的巡视检查", "审查工程安全专项施工方案", "审查施工组织设计中安全技术措施"], "answer": "CDE", "why": "", "expl": "多选。考点：监理单位对通信工程项目的安全责任。正确的是三条。\n进行现场安全的巡视检查；审查工程安全专项施工方案；审查施工组织设计中安全技术措施。\n错的是参加安全技术交底和组织安全生产检查——交底归施工单位，检查组织也是施工方的日常管理动作。监理三件事：巡视、审方案、审措施。"}, {"type": "单选", "key": "第19题", "stem": "通信工程建设项目进行招标时,应明确不得作为竞争性报价的是（　）", "options": ["调造费", "普工费", "预备费", "安全生产费"], "answer": "D", "why": "", "expl": "考点：通信工程招标时，应明确不得作为竞争性报价的是什么。答案：安全生产费。\n安全费不参与竞价，报多报少都不许拿来让利。这就是第二章案例里说的不参与竞争原则。"}, {"type": "单选", "key": "第20题", "stem": "以下 （　）不属于安全费的使用范围", "options": ["气体检测仪购买", "用于应急救援的安全绳的购买", "为作业人员购买意外伤害保险的费用", "对施工人员的安全教育培训的开支"], "answer": "C", "why": "", "expl": "考点：哪项不属于安全生产费的使用范围。答案：为作业人员购买意外伤害保险的费用。\n气体检测仪、应急救援的安全绳、安全教育培训，都是安全费该花的；意外伤害保险是另外的渠道，不走安全费。"}, {"type": "单选", "key": "第21题", "stem": "施工单位年度提取的安全生产费有结余时,正确的做法是 （　）", "options": ["发放员工奖金", "作为公司下一年度市场开发费", "转至下一年度做安全生产开支", "作为公司的年度利润"], "answer": "C", "why": "", "expl": "考点：年度提取的安全生产费有结余怎么办。答案：转至下一年度，继续用于安全生产。\n结余的钱只能接着干安全的事，发奖金、搞市场开发、算利润，统统不行。安全钱，永远姓安。"}, {"type": "多选", "key": "第22题", "stem": "关于通信施工单位安全生产事故的报告要求,说法正确的是（　）", "options": ["事故现场有关人员应立即向本单位负责人报告", "事故现场有关人员应立即向当地政府应急管理部门报告", "单位负责人接到事故报告后 1 小时内向企业所在地应急管理部门报告", "单位负责人接到事故报告后 2 小时内
