<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>绪论 · 精讲刷题</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #eef2f6; color: #22303e; padding: 70px 14px 40px; }
#bar { position: fixed; top: 0; left: 0; right: 0; z-index: 9; background: #ffffffee; backdrop-filter: blur(8px); border-bottom: 1px solid #e0e6ec; padding: 10px 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
#bar b { color: #1a66d6; }
#bar .stat { font-size: 14px; color: #5a6572; }
.mini { font-size: 13px; padding: 6px 14px; border: 1px solid #d3dce4; border-radius: 8px; background: #fff; cursor: pointer; font-family: inherit; color: #4a5560; }
.mini:hover { background: #eef2f6; }
.wrap { max-width: 760px; margin: 0 auto; }
.q { background: #fff; border-radius: 14px; box-shadow: 0 1px 8px #0000000e; padding: 20px 22px; margin: 14px 0; }
.qno { font-size: 13px; color: #8a95a1; margin-bottom: 6px; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 20px; background: #e3edfb; color: #1a66d6; margin-right: 8px; }
.stem { font-size: 17px; line-height: 1.65; font-weight: 600; margin-bottom: 14px; }
.opt { display: block; width: 100%; text-align: left; font-size: 15px; line-height: 1.55; padding: 11px 14px; margin: 7px 0; border: 1.5px solid #dbe3ea; border-radius: 10px; background: #fbfcfe; cursor: pointer; font-family: inherit; color: #22303e; }
.opt:hover { border-color: #9ec2ee; }
.opt.sel { border-color: #1a66d6; background: #e8f1fd; }
.opt.right { border-color: #2e9e5b; background: #e9f7ef; font-weight: 600; }
.opt.wrong { border-color: #d64545; background: #fdecec; }
.opt:disabled { cursor: default; }
.tf { display: flex; gap: 12px; } .tf .opt { text-align: center; font-weight: 600; }
.confirm { margin-top: 10px; width: 100%; padding: 11px; font-size: 15px; font-weight: 700; border: none; border-radius: 10px; background: #1a66d6; color: #fff; cursor: pointer; font-family: inherit; }
.confirm:disabled { background: #b9c6d4; }
.verdict { border-radius: 11px; padding: 13px 15px; margin-top: 13px; font-size: 14.5px; line-height: 1.75; }
.verdict.ok { background: #e9f7ef; border: 1.5px solid #2e9e5b; }
.verdict.no { background: #fdecec; border: 1.5px solid #d64545; }
.verdict .vline { font-weight: 800; font-size: 15px; margin-bottom: 6px; }
.verdict.ok .vline { color: #217a45; } .verdict.no .vline { color: #b93535; }
.verdict .expl { color: #4a3f28; white-space: pre-wrap; }
.verdict .expl b.h { color: #8a6d1a; }
.re { margin-top: 10px; font-size: 12.5px; color: #8a95a1; background: none; border: none; cursor: pointer; text-decoration: underline; font-family: inherit; padding: 0; }
</style>
</head>
<body>
<div id="bar">
  <span class="stat">进度 <b id="pdone">0</b>/3</span>
  <span class="stat">答对 <b id="pok">0</b></span>
  <button class="mini" id="copybtn" onclick="copyAns()">📋 复制已答成绩</button>
  <button class="mini" onclick="clearAll()">🗑 清空重做</button>
  <span class="stat">做完多少算多少，随时复制发我</span>
</div>
<div class="wrap" id="list"></div>
<script>
const QUIZ = {"title":"绪论","questions":[{"type":"多选","key":"第1题","stem":"《中共中央、国务院关于推进安全生产领域改革发展的意见》 (2016)中指出,推进安全生产领域改革的基本原则有 （　）。","options":["坚持安全发展","坚持改革创新","坚持过程防范","坚持依法监管","坚持重点治理"],"answer":"ABD","why":"依据2016年《中共中央、国务院关于推进安全生产领域改革发展的意见》，基本原则为：坚持安全发展、坚持改革创新、坚持依法监管、坚持源头防范、坚持系统治理。C错在“过程防范”应为“源头防范”，E错在“重点治理”应为“系统治理”，均系偷换表述。","expl":"多选题。考点：2016年中央文件给安全生产领域改革定的基本原则。\n正确的是三条：坚持安全发展；坚持改革创新；坚持依法监管。\n错的两条，对照着记。它说，坚持过程防范，错，正确说法是源头防范，从源头上防住风险，不是等过程中再防。它又说，坚持重点治理，也错，正确说法是系统治理，要系统地全面治理，不是只抓重点。\n记法：源头防范，系统治理。选项改一个词，就是坑。"},{"type":"单选","key":"第3题","stem":"各级党委和政府要坚决落实安全生产责任制,切实做的党政同责)、失职追责。（　）","options":["巡查考核","分工负责","一岗双责","党政分开"],"answer":"C","why":"依据该《意见》，各级党委和政府要坚决落实安全生产责任制，切实做到党政同责、一岗双责、齐抓共管、失职追责。“一岗双责”指领导干部既管业务又必须管安全；“党政分开”与“党政同责”相悖，是最易误选的干扰项。","expl":"单选题。考点：安全生产举报投诉专线电话。\n答案：一二三五零。\n四个号码一起记：一二三零六，买火车票；一二三一五，投诉商家；一二三五零，举报安全隐患。这是送分题，记住就拿分。"},{"type":"单选","key":"第4题","stem":"安全生产举报投诉专线电话是 （　）","options":["2350","12306","12315","12335"],"answer":"A","why":"安全生产举报投诉专线是12350，务必记准五位数。12306是铁路客服热线，12315是消费者（市场监管）投诉热线，12335是商务领域举报投诉专线，均与安全生产举报无关，属号码混搭干扰。","expl":""}]};
const KEY = 'jingjiang_' + QUIZ.title;
let answers = [], sel = [], locked = [];

function save() { try { localStorage.setItem(KEY, JSON.stringify({ answers, sel, locked })); } catch(e) {} }
function loadSaved() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.answers) { answers = s.answers; sel = s.sel; locked = s.locked; } } catch(e) {} }
function clearAll() { if (confirm('确定清空本章答题记录，从头再做吗？')) { localStorage.removeItem(KEY); location.reload(); } }

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
const L = 'ABCDE';
function optsHtml(i) {
  const q = QUIZ.questions[i];
  if (q.type === '判断') {
    return '<div class="tf">' + ['对','错'].map(t => {
      let cls = 'opt';
      if (locked[i]) cls += t === q.answer ? ' right' : (answers[i].mine === t ? ' wrong' : '');
      return `<button class="${cls}" ${locked[i]?'disabled':''} onclick="pick(${i},'${t}')">${t}</button>`;
    }).join('') + '</div>';
  }
  return q.options.map((o, k) => {
    const lt = L[k];
    let cls = 'opt';
    if (locked[i]) cls += q.answer.includes(lt) ? ' right' : (answers[i].mine.includes(lt) ? ' wrong' : '');
    else cls += (sel[i]||[]).includes(lt) ? ' sel' : '';
    return `<button class="${cls}" ${locked[i]?'disabled':''} onclick="pick(${i},'${lt}')"><b>${lt}</b>　${esc(o)}</button>`;
  }).join('') + (q.type === '多选' && !locked[i] ? `<button class="confirm" ${(sel[i]&&sel[i].length)?'':'disabled'} onclick="confirmMulti(${i})">确　认</button>` : '');
}
function verdictHtml(i) {
  const q = QUIZ.questions[i];
  if (!locked[i]) return '';
  const a = answers[i];
  let h = a.ok
    ? `<div class="vline">✅ 答对了</div>`
    : `<div class="vline">❌ 答错了 · 你选 ${esc(a.mine)} · 正确答案 <u>${q.answer}</u></div>`;
  if (q.why) h += esc(q.why) + '<br>';
  if (q.expl) h += `<b class="h">📖 详细讲解：</b><br>` + esc(q.expl);
  return `<div class="verdict ${a.ok?'ok':'no'}">${h}</div><button class="re" onclick="redo(${i})">↺ 重新做这题</button>`;
}
function renderQ(i) {
  const q = QUIZ.questions[i];
  document.getElementById('q' + i).innerHTML =
    `<div class="qno"><span class="badge">${q.type}</span>第 ${i+1} 题${q.key && q.key.startsWith('附') ? '（附录）' : ''} · ${q.key || ''}</div>` +
    `<div class="stem">${esc(q.stem)}</div>` + optsHtml(i) + verdictHtml(i);
  updateBar();
}
function renderAll() {
  document.getElementById('list').innerHTML = QUIZ.questions.map((q,i)=>`<div class="q" id="q${i}"></div>`).join('');
  QUIZ.questions.forEach((_,i)=>renderQ(i));
}
function updateBar() {
  document.getElementById('pdone').textContent = answers.filter(a=>a).length;
  document.getElementById('pok').textContent = answers.filter(a=>a&&a.ok).length;
}
function pick(i, v) {
  if (locked[i]) return;
  const q = QUIZ.questions[i];
  if (q.type !== '多选') submit(i, [v]);
  else { sel[i] = sel[i] || []; const k = sel[i].indexOf(v); k>=0 ? sel[i].splice(k,1) : sel[i].push(v); save(); renderQ(i); }
}
function confirmMulti(i) { if (sel[i] && sel[i].length) submit(i, [...sel[i]].sort()); }
function submit(i, vals) {
  const q = QUIZ.questions[i];
  const std = q.type === '判断' ? q.answer : q.answer.split('').sort().join('');
  const mine = q.type === '判断' ? vals[0] : vals.join('');
  answers[i] = { mine, ok: mine === std };
  locked[i] = true;
  save(); renderQ(i);
}
function redo(i) {
  answers[i] = null; locked[i] = false; sel[i] = sel[i] ? sel[i].splice(0, sel[i].length) && null : null;
  save(); renderQ(i);
}
function copyAns() {
  const text = answers.map((a,i)=>a?`${i+1}${a.mine}`:null).filter(Boolean).join(' ') || '（还没答题）';
  const done = () => { const b = document.getElementById('copybtn'); b.textContent = '✅ 已复制，去聊天粘贴'; setTimeout(()=>b.textContent='📋 复制已答成绩', 2000); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(done); else done();
}
answers = new Array(QUIZ.questions.length).fill(null);
sel = new Array(QUIZ.questions.length).fill(null);
locked = new Array(QUIZ.questions.length).fill(false);
loadSaved();
renderAll();
</script>
</body>
</html>
