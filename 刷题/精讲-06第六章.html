<script>
const QUIZ = {"title":"第六章","questions":[{"type":"判断","key":"第1题","stem":"企业应按规定取得行业学会颁发的安全生产许可证,按时办理延期手续。（　）","options":[],"answer":"错","why":"错。依据《安全生产许可证条例》，建筑施工企业安全生产许可证由政府住房城乡建设主管部门颁发；行业学会是社会团体，无行政许可权。企业应依法取得许可证并按时办理延期手续。","expl":""},{"type":"单选","key":"第2题","stem":"以下那项作业不是通信行业中的常见的特种作业 （　）","options":["电工作业","高处作业","电焊作业","手持电钻作业"],"answer":"D","why":"电工作业、高处作业、电焊作业均属特种作业目录内的常见作业；手持电钻作业属一般工种作业，风险相对可控，不列入特种作业，故D不是。易误选B，焊割恰是典型特种作业。","expl":""},{"type":"单选","key":"第3题","stem":"以下哪项作业不需要人员持《特种作业人员操作证》（　）","options":["制冷与空调设备安装修理作业","金属热切割作业","站在 2 米高处架设线缆","机房地面钻孔作业"],"answer":"D","why":"制冷与空调设备安装修理、金属热切割属特种作业，站在2米及以上高处架设线缆属高处作业，均须持《特种作业人员操作证》；机房地面钻孔属一般作业，无需持证。数字考点：2米即高处作业门槛。","expl":""},{"type":"多选","key":"第4题","stem":"下列工种中,属于特种作业的是 （　）","options":["电工作业","金属焊接与切割作业","机动车辆驾驶","制冷与空调作业","登高架设作业"],"answer":"ABDE","why":"依据特种作业目录，电工作业、金属焊接与切割作业、制冷与空调作业、登高架设作业均属特种作业；机动车辆驾驶属特种设备作业人员管理范畴，不在特种作业目录内。易混淆“特种作业”与“特种设备作业”两套持证体系。","expl":""},{"type":"判断","key":"第5题","stem":"特种作业操作证有效期为 6 年,在考试所在省范围内有效。（　）","options":[],"answer":"错","why":"错。特种作业操作证有效期为6年，在全国范围内有效，并非只在考试所在省范围内有效；每3年复审一次。错误点在证书的地域效力范围。","expl":""},{"type":"单选","key":"第6题","stem":"登高证有效期为（　） 年,在全国范围内有效","options":["1 年","3 年","5 年","6 年"],"answer":"D","why":"登高架设作业操作证即特种作业操作证，有效期6年且在全国范围内有效。数字考点：有效期6年、每3年复审；选项中的3年、5年均为干扰数字。","expl":""},{"type":"单选","key":"第7题","stem":"离开特种作业岗位达（　） 以上的特种作业人员,应当重新进行实际操作考核,经确认合格后方可上岗作业。","options":["个月","6 个月","一年","两年"],"answer":"B","why":"依据特种作业人员管理规定，离开特种作业岗位6个月以上的人员，重新上岗前应当重新进行实际操作考核，合格后方可作业。口诀“离岗半年、重考实操”；一年、两年均为干扰数字。","expl":""},{"type":"单选","key":"第8题","stem":"关于特种作业操作证的管理时限,说法正确的是 （　）","options":["证书的有效期为 5 年,在全国范围内有效","作业人员离开特种作业岗位 6 个月以上应重新取证","证书每 3 年复审 1 次","连续 10 年以上的证书,可每 6 年复审 1 次"],"answer":"C","why":"特种作业操作证有效期6年、全国有效，每3年复审1次，C正确；A有效期应为6年；B应为重新进行实际操作考核而非重新取证；D中连续从业10年以上复审可延长至6年，但须经发证机关同意，表述过于绝对。","expl":""},{"type":"单选","key":"第9题","stem":"通信工程必须在施工前向建设单位报批后才可以开始施工的作业是（　）","options":["机房内使用电动砂轮机","直埋线路跨越河流施工","架空线路与电力线交越作业","架空线路与铁路交越作业"],"answer":"A","why":"机房内在用设备运行环境受控，使用电动砂轮机会产生金属粉尘和火花，危及设备安全，施工前须向建设单位报批；架空线路与电力线、铁路交越作业按相应主管部门规定办理跨越手续，不属向建设单位报批事项。","expl":""},{"type":"单选","key":"第10题","stem":"下面关于动火作业的管理要求,错误的是 （　）","options":["多个动火点办理一张动火证","不得随意涂改和转让动火证","不得扩大动火证的使用范围","动火证超过期限应重新办理"],"answer":"A","why":"动火管理要求“一点一证”，每个动火点须单独办理动火证，多个动火点共用一张动火证是典型违章，A错误；不得涂改转让、不得扩大使用范围、超期重新办理均为正确要求。","expl":""},{"type":"多选","key":"第11题","stem":"通信工程应办理动土作业审批的工作有 （　）","options":["挖电缆沟","挖电杆坑、拉线坑","直埋线路工程敷设排流线","线路工程埋设防雷接地线","设备工程埋设地网"],"answer":"AE","why":"局站场地内动土易损坏地下光电缆、接地网等隐蔽设施，故挖电缆沟、设备工程埋设地网应事前办理动土作业审批；野外直埋线路的杆坑拉线坑、排流线、防雷接地施工属线路常规土方作业，不在此列。","expl":""},{"type":"单选","key":"第12题","stem":"通信工程必须在施工前向建设单位报批后才可以开始施工作业是（　）","options":["架空线路与电力线交越作业","直埋线路与铁路交越作业","机房内交换设备割接作业","机房内用电热吹风机作业"],"answer":"C","why":"机房内交换设备割接直接影响现网运行安全，必须在施工前向建设单位报批并经同意后方可实施；与电力线交越作业办理的是电力等主管部门的跨越手续。规律：涉及现网安全的作业报建设单位审批。","expl":""},{"type":"单选","key":"第13题","stem":"下面关于施工企业安全技术措施的说法,错误的是（　）","options":["安全技术措施用于防止人身伤害、改善劳动条件","安全技术措施用于消除生产过程中的不安全因素","安全技术措施必须按照国家的经济发展规划编制","工程项目的安全技术措施必须在开工前针对工程中的危险因素编制"],"answer":"C","why":"安全技术措施针对工程中的危险因素编制，用于防止人身伤害、消除不安全因素、改善劳动条件，与国家经济发展规划无关，C错误；开工前针对危险因素编制是强制性要求。","expl":""},{"type":"多选","key":"第14题","stem":"常用的防止事故发生的安全技术措施有 （　）","options":["设置薄弱环节","消除危险源","限制能量或危险物质","个体防护、避难与救援","减少故障和失误"],"answer":"BCE","why":"防止事故发生的安全技术措施包括消除危险源、限制能量或危险物质、隔离、减少故障和失误；设置薄弱环节、个体防护与避难救援属于减少事故损失类，不能混入本组，故选BCE。","expl":""},{"type":"多选","key":"第15题","stem":"工程中常用的减少事故发生的安全减少措施有（　）","options":["隔离","使用专用工具","个体防护","避难与救援","配备专职安全员"],"answer":"ACD","why":"减少事故损失的安全技术措施包括隔离、个体防护、避难与救援；使用专用工具属工器具管理，配备专职安全员属人员配备手段，均不属于安全技术措施分类，故选ACD。","expl":""},{"type":"多选","key":"第16题","stem":"常用的减少事故损失的安全技术措施有 （　）","options":["设置薄弱环节","消除危险源","限制能量或危险物质","个体防护、避难与救援","减少故障和失误"],"answer":"AD","why":"减少事故损失的措施包括设置薄弱环节（如易熔塞、爆破片）、个体防护、避难与救援；消除危险源、限制能量、减少故障失误属防止事故发生类。口诀：防发生靠消除限制，减损失靠薄弱防护救援。","expl":""},{"type":"单选","key":"第17题","stem":"即可以防止事故发生,也可以防止事故扩大,减少事故损失的安全技术措施是 （　）","options":["限制能量或危险物质","设置薄弱环节","隔离","安全设计"],"answer":"C","why":"隔离既可把人员与危险源分开、防止事故发生，又可在事故发生后阻止波及、减少损失（如防爆墙、防护罩），攻防兼备；限制能量、设置薄弱环节只侧重单一方面，故选C。","expl":""},{"type":"单选","key":"第18题","stem":"下列作业活动中,应编制专项施工方案的是 （　）","options":["在室外环境进行的光缆接续作业","在机房内进行机架安装作业","直埋线路挖 3m 深降水坑作业","连接新装机房设备的电源线作业"],"answer":"C","why":"依据危大工程管理规定，开挖深度3米及以上的基坑（槽）土方开挖属危险性较大的分部分项工程，须编制专项施工方案；光缆接续、机架安装、接电源线属常规作业。数字考点：3米编方案。","expl":""},{"type":"单选","key":"第19题","stem":"下列作业活动中,应编制专项施工方案的是 （　）","options":["在室外进行的光缆接续作业","在机房内进行机架安装作业","在郊外开挖 4m 深人孔坑作业","连接新装机房的电源线作业"],"answer":"C","why":"郊外开挖4米深人孔坑超过3米临界值，属危险性较大的分部分项工程，须编制专项施工方案；光缆接续、机架安装、接电源线为常规作业。记忆口诀“3米编方案、5米加论证”。","expl":""},{"type":"单选","key":"第20题","stem":"下列作业活动中,应编制专项施工方案的是（　）","options":["在野外地形复杂的地段接续光缆","在新机架内敷放电缆","在与多条管线交越处开挖管道沟","机房电源线割接作业"],"answer":"C","why":"与多条管线交越处开挖管道沟，交叉作业风险高、易损伤既有管线引发次生事故，属危险性较大作业，须编制专项施工方案；野外接续、机架内布放电缆、电源线割接属常规作业，故选C。","expl":""},{"type":"多选","key":"第21题","stem":"下列作业活动中,应编制专项施工方案的是（　）","options":["在复杂环境光缆接续作业","在走线架上布放电缆作业","使用起重机吊装铁塔作业","新机房电源系统割接作业","直埋线路的水下冲槽作业"],"answer":"CDE","why":"使用起重机吊装铁塔属起重吊装作业、新机房电源系统割接涉现网安全、直埋线路水下冲槽风险大，均应编制专项施工方案；复杂环境光缆接续、走线架布放电缆为常规作业。口诀：吊装、割接、水下要专项。","expl":""},{"type":"单选","key":"第22题","stem":"开挖深度（　）的基坑(槽)的土方开挖工程不仅需要编制专项施工方案,还需要专家论证。","options":["2.5m","3m","5m","6m"],"answer":"C","why":"依据《危险性较大的分部分项工程安全管理规定》，开挖深度5米及以上的基坑（槽）属超过一定规模的危大工程，专项方案须组织专家论证；3米以上5米以下只编方案不论证。口诀“3编5论”。","expl":""},{"type":"单选","key":"第23题","stem":"企业编制安全技术措施计划的牵头部门应该是 （　）,其他部门参与。","options":["财务部","人力资源部","安全生产管理部门","工会"],"answer":"C","why":"安全技术措施计划专业性和政策性强，应由安全生产管理部门牵头编制，财务、人力资源、工会等部门参与配合；财务管资金、人力管人员、工会监督，都不是牵头主体，故选C。","expl":""},{"type":"单选","key":"第24题","stem":"企业安全技术措施计划的项目范围中,配备防尘、防毒、降温、防寒等装置或设施,属于（　）","options":["安全技术措施","卫生技术措施","保障技术措施","安全宣传教育措施"],"answer":"B","why":"防尘、防毒、降温、防寒等装置设施着眼于改善劳动卫生条件、保护职工身体健康，属卫生技术措施；安全技术措施针对触电、机械伤害等人身伤害，宣传教育措施指培训教育类项目，故选B。","expl":""},{"type":"单选","key":"第25题","stem":"安全生产教育培训应针对不同的培训对象,在合适的时间,进行)特点。相应内容的培训。这体现了安全生产教育培训的（　）","options":["长期性","全员性","针对性","多样性"],"answer":"D","why":"教材将“针对不同对象、合适时间、相应内容”归纳为教育培训的多样性特点，即培训形式与内容因人因时而异、多种多样；长期性指贯穿职业生涯，全员性指覆盖所有人员。针对性是最易误选项。","expl":""},{"type":"单选","key":"第26题","stem":"下面关于安全生产教育培训时长的说法,正确的是 （　）","options":["所有管理人员和作业人员每两年至少进行一次","对新职工进行至少 30 小时培训,每年至少 20 学时的再培训","企业主要负责人和安全生产管理人员初次培训不得少于 30 学时每年再培训时间不得少于 12 学时","新上岗从业人员,岗前培训时间不得少于 24 学时"],"answer":"D","why":"依据《生产经营单位安全培训规定》，新上岗从业人员岗前安全培训不得少于24学时，D正确；主要负责人和安管人员初次培训应为32学时而非30，高危行业新职工为72学时；A“每两年一次”错误，培训应每年开展。","expl":""},{"type":"单选","key":"第27题","stem":"通信施工企业应当对新招的施工人员进行岗前三级安全教育,培训时长不少于 （　）学时。","options":["2","20","24","32"],"answer":"D","why":"依据通信施工企业安全培训要求，新招施工人员岗前三级安全教育（公司、项目、班组）培训时长不少于32学时；24学时是一般生产经营单位的标准，施工企业从严执行32学时。数字考点：32。","expl":""},{"type":"单选","key":"第28题","stem":"通信施工企业对新员工的岗前安全培训时间通常不应少于 （　）","options":["2 学时","24 学时","32 学时","40 学时"],"answer":"C","why":"通信施工企业对新员工的岗前安全培训通常不应少于32学时，与三级安全教育总时长要求一致；24学时为一般单位标准，40学时为干扰数字。记忆：通信施工岗前32学时。","expl":""},{"type":"判断","key":"第29题","stem":"建筑企业要对新职工进行至少 30 学时的安全培训,每年进行至少 20 学时的再培训（　）","options":[],"answer":"错","why":"错。数字与规定不符：新职工岗前安全培训一般不少于24学时，主要负责人和安管人员初次培训为32学时、每年再培训不少于12学时；“至少30学时、每年20学时再培训”不是规定数字，易与高危行业72学时、再培训20学时混淆。","expl":""},{"type":"判断","key":"第30题","stem":"安全生产教育培训考核不合格的人员,上岗后应及时补考。（　）","options":[],"answer":"错","why":"错。依据“先培训、后上岗”原则，安全生产教育培训考核不合格的人员不得上岗作业，必须经重新培训并补考合格后方可上岗；“先上岗后补考”颠倒了顺序，属违章安排上岗。","expl":""},{"type":"单选","key":"第31题","stem":"某工程公司对新招收来的农民工进行线路专业的安全操作培训,随后进行了考试,王某因文化水平不高怕考试分数低面子不好看,由同乡李某代答后取得了上岗证,公司随即安排王某与李某参与线路工程施工作业。下面说法正确的是（　）","options":["王某可以参与施工作业","王某可以在李某的带领下上岗作业","王某不能参加施工作业","王某补考后就能上岗作业"],"answer":"C","why":"依据先培训后上岗原则，教育培训考核合格方可上岗；王某找人代考属考核不合格，不得参加施工作业，也不存在“带班上岗”或“先上岗等补考”的例外，故C正确；代考行为本身即违规。","expl":""},{"type":"多选","key":"第32题","stem":"必须经安全生产教育培训考核合格后方可能上岗的人员有 （　）。","options":["休假结束后返岗的人员","进入新的工作岗位的人员","进入新的施工现场的人员","采用新技术、新工艺、新设备、新材料作业的人员","特种作业人员"],"answer":"BCD","why":"依据《建设工程安全生产管理条例》，进入新岗位、新施工现场前及采用新技术、新工艺、新设备、新材料作业前，须经安全生产教育培训考核合格方可上岗；休假返岗不涉及新风险，特种作业人员按持证管理，均不属本条情形。","expl":""},{"type":"多选","key":"第33题","stem":"施工企业作人员应（　）,接受相应的安全生产教育培训","options":["在进入新的工资岗位之前","在进入新的施工现场之前","在采用新工艺、新材料、新设备时","在企业内整工作岗位时","在离岗两年以上重新上岗时"],"answer":"ABC","why":"依据《建设工程安全生产管理条例》，作业人员进入新岗位前、进入新施工现场前、采用新工艺新材料新设备时应接受相应安全教育培训；离岗复岗重新培训的门槛为离岗一年以上，“两年”表述错误，一般调岗不属该条列举情形。","expl":""},{"type":"单选","key":"第34题","stem":"下列安全生产教育培训内容中,属于新上岗操作工人培训内容的是（　）。","options":["安全生产新技术、新知识、新方法","季节施工要求","紧急情况下应急救援的基本知识","作业场所和工作岗位存在的危险因素"],"answer":"C","why":"新上岗操作工人的培训内容侧重岗位安全基础与应急技能，如紧急情况下应急救援的基本知识，故选C；季节施工要求属经常性季节教育，新技术新知识属继续教育，危险因素告知属安全技术交底内容。","expl":""},{"type":"多选","key":"第35题","stem":"安全生产教育培训内容中,属于安全生产继续教育内容的是（　）","options":["新工艺、新技术、新知识、新方法","新颁布的安全生产法律法规","安全技术标准、规范和规范性文件","先进的安全生产技术和管理经验","预防和减少事故风险的基本知识"],"answer":"BCD","why":"安全生产继续教育定位是“更新提高”：新颁布的安全生产法律法规、安全技术标准规范和规范性文件、先进的安全生产技术和管理经验属之；新工艺新技术属“四新”教育，预防事故基本知识属新上岗基础培训，故选BCD。","expl":""},{"type":"判断","key":"第36题","stem":"企业的职工安全教育培训档案应涉及企业所使用的被派遣劳动者。（　）","options":[],"answer":"对","why":"对。依据《安全生产法》，生产经营单位使用被派遣劳动者的，应将其纳入本单位从业人员统一管理，保障其同等接受教育培训的权利，故安全教育培训档案应涵盖被派遣劳动者。","expl":""},{"type":"单选","key":"第37题","stem":"企业施工人员的安全教育培训记录应（　） 保存、管理。","options":["企业的安全生产主管部门","企业的档案管理部门","企业的人力资源部门","施工人员所在的管理组织"],"answer":"D","why":"施工人员流动性强，其安全教育培训记录应由施工人员所在的管理组织建立、保存和管理，便于现场查验；与机关人员记录归安全生产主管部门保管形成对照。口诀“谁的人员谁建档”。","expl":""},{"type":"单选","key":"第38题","stem":"企业机关人员的职工安全教育培训记录应（　） 管理和保存","options":["企业的安全生产主管部门","企业的档案管理部门","企业的人力资源部门","施工人员所在的管理组织"],"answer":"A","why":"企业机关人员相对固定，其职工安全教育培训记录应由企业安全生产主管部门统一管理和保存；施工人员记录则由所在管理组织保管，两类人员的归档口径不同，勿混淆。","expl":""},{"type":"多选","key":"第39题","stem":"企业员工的日常安全教育活动应由 （　）组织实施。","options":["企业人力资源管理部","企业工程项目管理部","企业安全生产管理部","企业的工程项目部","企业的工会组织"],"answer":"CD","why":"日常安全教育活动贴近生产一线，由企业安全生产管理部和工程项目部组织实施；人力资源部门负责人事类培训，工程项目管理部是企业机关职能部门，不直接组织现场日常教育。注意区分“工程项目部”与“工程项目管理部”。","expl":""},{"type":"单选","key":"第40题","stem":"企业新入职员工的职工安全教育培训记录应由 （　） 建立。","options":["企业人力资源管理部","企业工程项目管理部","企业安全生产管理部","新员工所在的项目部"],"answer":"C","why":"新入职员工由企业统一接收，其安全教育培训记录由企业安全生产管理部建立；所在项目部后续开展项目级、班组级教育，人力资源管理部负责人事档案而非安全培训档案，故选C。","expl":""},{"type":"多选","key":"第41题","stem":"对于施工总承包工程项目,施工单位保证施工安全的安全生产投入主要包括 （　）。","options":["掌握安全施工要求的管理人员和作业人员","满足工程要求的机械设备","满足工程要求的劳动保护用品","满足工程要求的工程材料","工程需要的资金"],"answer":"ABCE","why":"安全生产投入主要包括掌握安全要求的管理和作业人员、机械设备、劳动防护用品及资金；工程材料服务于工程质量与进度，不属于安全生产投入范围。口诀“人机护金算投入，工程材料不算数”。","expl":""},{"type":"单选","key":"第42题","stem":"通信建设工程安全费的提取标准应为 （　）","options":["建安费的 1.5%","施工费的 1.5%","建安费的 1%","施工费的 1%"],"answer":"A","why":"依据安全生产费用提取使用的有关规定，通信建设工程安全费按建筑安装工程造价（建安费）的1.5%提取；计提基数是建安费而非施工费，比例是1.5%而非1%。数字考点：1.5%。","expl":""},{"type":"多选","key":"第43题","stem":"施工企业内部安全生产费用管理制度应明确安全费用的 （　）","options":["提取程序","使用程序","项目概算程序","使用范围","挪用程序"],"answer":"ABD","why":"企业内部安全费用管理制度应明确提取程序、使用程序和使用范围，实现全流程管控；项目概算程序属造价管理范畴，“挪用程序”是明显陷阱——安全费用专款专用，严禁挪用，故选ABD。","expl":""},{"type":"多选","key":"第44题","stem":"关于安全生产费的管理要求,下列说法正确的是（　）","options":["企业应按照项目承包合同额的 1.5%收取安全生产费","安全生产费可采用由其他单位代管的方式集中管理和使用","企业应确保安全生产所需资金的投入并有效使用","企业应立安全生产费用分类使用台账,并定期统计","企业应编制安全生产费用使用计划"],"answer":"CDE","why":"A错在计提基数应为建安费的1.5%而非项目承包合同额；B错在安全费用必须专项核算、专款专用，不得由其他单位代管使用；确保资金投入并有效使用、建立分类使用台账并定期统计、编制使用计划均正确，故选CDE。","expl":""},{"type":"单选","key":"第45题","stem":"施工单位必须依法参加工伤保险,为 （　） 缴纳保险费","options":["农民工","固定工","合同工","以上均包括"],"answer":"D","why":"依据《社会保险法》和《工伤保险条例》，工伤保险属强制性保险，施工单位必须为农民工、固定工、合同工等全部从业人员缴纳工伤保险费，不得选择性参保。口诀“全员参保，一个不能少”。","expl":""},{"type":"单选","key":"第46题","stem":"张某在人井中确认资料,爬出人井时,被过往的汽车正巧撞上死亡。本次事故中张某家属可以获得的赔偿,说法正确的是 （　）","options":["交通事故的赔偿和工伤赔偿都能获得","只能获得交通事故的赔偿不能获得工伤赔偿","只能获得工伤赔偿不能获得交通事故赔偿","交通事故的赔偿和工伤赔偿都不能获得,只能获得意外伤害赔偿"],"answer":"C","why":"张某在作业过程中因工作原因死亡，依据《工伤保险条例》属“工作时间、工作场所内因工作原因受到事故伤害”的典型工伤情形，家属依法获得工伤保险赔偿；本题不适用上下班途中交通事故竞合赔偿规则，易误选A。","expl":""},{"type":"单选","key":"第47题","stem":"施工单位带领劳务公司作业人员施工发生了事故,事故发生后,应由（　）负责向统筹地区社会保险行政部门提出工伤认定申请。","options":["建设单位","监理单位","施工单位","劳务公司"],"answer":"D","why":"依据《工伤保险条例》，工伤认定申请由职工所在单位即用人单位提出；劳务公司作业人员的劳动关系在劳务公司，故应由劳务公司在事故伤害发生之日起30日内提出申请。口诀“谁用工、谁申请”。","expl":""},{"type":"单选","key":"第48题","stem":"员工受伤后,应在应当自事故伤害发生之日起（　） 内提出工作认定申请。","options":["5 日","30 日","一个月","一年"],"answer":"B","why":"依据《工伤保险条例》，所在单位应当自事故伤害发生之日起30日内提出工伤认定申请，特殊情况可适当延长；对比记忆：单位30日、工伤职工或近亲属1年，故选B。","expl":""},{"type":"单选","key":"第49题","stem":"受伤人员在停工留薪期内,原工资福利待遇不变,停工留薪期最上不超过 （　）。","options":["个月","12","24 个月","36 个月"],"answer":"B","why":"依据《工伤保险条例》，受伤人员在停工留薪期内原工资福利待遇不变，停工留薪期一般不超过12个月；伤情严重经劳动能力鉴定委员会确认可延长，延长不得超过12个月。数字考点：12个月、待遇不变。","expl":""},{"type":"单选","key":"第50题","stem":"事故中死亡员工的一次性工亡补助金的标准为 （　）","options":["上一年全国城镇居民人均收入的 20 倍","上一年全国城镇居民人均可支配收入的 20 倍","上一年统筹地区居民人均收入的 20 倍","上一年统筹地区城镇居民人均收入的 20 倍"],"answer":"B","why":"依据《工伤保险条例》，一次性工亡补助金标准为上一年度全国城镇居民人均可支配收入的20倍；干扰项把“可支配收入”偷换成“收入”、把“全国”偷换成“统筹地区”。数字口诀：全国、可支配收入、20倍。","expl":""},{"type":"单选","key":"第51题","stem":"按照《安全生产责任保险实施办法》规定,下列说法正确的是（　）。","options":["企业主要负责人在工程中伤亡,其获取的保险金应高于普通员工","企业派遣制用工在工程中伤亡,其获取的保险金应与合同制员工相同","投保单位每伤亡一人,其获取的保险金赔偿额不得低于 20 万元","对未造成人员死亡事故的赔偿保险金额度,按实际治疗费赔偿"],"answer":"B","why":"依据《安全生产责任保险实施办法》，安责险覆盖全体从业人员且赔付同等待遇，派遣制用工与合同制员工赔付相同，B正确；每人死亡赔付限额不得低于30万元而非20万元，未死亡事故按合同约定赔付而非仅赔治疗费。","expl":""},{"type":"单选","key":"第52题","stem":"劳动防护用品不同于一般的商品,直接关系到劳动者的生命安全和身体健康,生产经营单位为从业人提供的劳动防护用品必须符合（　）或行业标准。","options":["地方标准","国家标准","消防标准","劳安认证"],"answer":"B","why":"依据《安全生产法》，生产经营单位必须为从业人员提供符合国家标准或者行业标准的劳动防护用品；地方标准、消防标准、“劳安认证”均不是法定依据表述。口诀“国标或行标”，故选B。","expl":""},{"type":"单选","key":"第53题","stem":"对于工程现场分包单位的作业人员,其安全防护用品由 （　） 提供。","options":["建设单位","总包单位","分包单位","其他单位"],"answer":"C","why":"分包单位是分包作业人员的用人单位，应自行为其提供合格的安全防护用品，总包单位负统一协调和监督管理责任；“谁用工、谁配备”，建设单位无配发义务。易误选B，总包是监督方不是配发主体。","expl":""},{"type":"单选","key":"第54题","stem":"下面关于劳动防护用品的管理要求,说法正确的是 （　）","options":["从业人员可以自行报销采购劳动防护用品的发票","从业人员可以使用不低于国标要求的进口劳动防护用品","当气温过高时,施工人员可以不穿工作服","新员工在施工现场不操作时,可以不佩戴劳动防护用品"],"answer":"B","why":"使用性能不低于国标要求的进口劳动防护用品是允许的；防护用品应由单位统一采购发放，自行报销采购违规；高温天气、不操作时也不得免除佩戴义务，进入施工现场即须佩戴，故选B。","expl":""},{"type":"单选","key":"第55题","stem":"下面关于劳动防护用品的选用要求,说法错误的是 （　）","options":["用人单位在选择劳动防护用品时,应考虑劳动者的作业方式和工作条件","用人单位在选择劳动防护用品时,应考虑其佩戴的合适性和基本舒适性","用人单位为劳动者配备劳动防护用品时需考虑作业现场的某些有害因素","用人单位应为流动性作业的劳动者,配备随身携带的个人应急防护用品"],"answer":"A","why":"选用劳动防护用品应针对作业现场的有害因素选型，考虑佩戴的合适性和基本舒适性，并为流动性作业人员配备随身携带的个人应急防护用品；A“考虑作业方式和工作条件”不符合规范选型依据的表述，故错误。","expl":""},{"type":"单选","key":"第56题","stem":"下列特种设备的管理,错误的是 （　）","options":["特种设备使用单位应制定操作规程","特种设备使用单位应建立设备档案","特种设备使用单位应在检验合格证有效期届满前一个周提出检验要求","特种设备使用单位应对使用的特种设备经常性维护保养和定期检查"],"answer":"C","why":"依据《特种设备安全法》，特种设备应在检验合格有效期届满前1个月向检验机构提出定期检验要求，“提前一个周”错误；制定操作规程、建立设备档案、经常性维护保养和定期自行检查均为法定义务。数字考点：提前1个月。","expl":""},{"type":"多选","key":"第57题","stem":"《特种设备安全法》规定,特种设备使用单位应配备的人员有（　）","options":["特种设备安全管理人员","特种设备检测人员","特种设备业务营销人员","特种设备作业人员","特种设备采购人员"],"answer":"ABD","why":"依据《特种设备安全法》，特种设备使用单位应配备安全管理人员、检测人员和作业人员，并进行必要的安全教育培训；业务营销人员、采购人员不属法定配备人员。口诀“管、检、作”三类，故选ABD。","expl":""},{"type":"单选","key":"第58题","stem":"从事起重机械的 （　）不需要持《特种设备作业人员证》。","options":["安全管理人员","司机","指挥人员","项目负责人"],"answer":"D","why":"依据特种设备作业人员管理规定，起重机械的安全管理人员、司机、指挥（司索）人员均须持《特种设备作业人员证》上岗；项目负责人是项目管理岗位，不属特种设备作业人员，故选D。易误选C，起重指挥恰须持证。","expl":""},{"type":"单选","key":"第59题","stem":"特种设备使用单位的特种设备安全管理负责人应持有证书是（　）","options":["一建","特种作业操作证","特种设备安全管理人员资格证","施工企业安全生产考核合格证"],"answer":"C","why":"特种设备安全管理负责人应持有特种设备安全管理人员资格证；一建是建造师执业资格，特种作业操作证由应急管理部门颁发，安全生产考核合格证是施工企业“三类人员”证书，均与特种设备管理岗不对口，故选C。","expl":""},{"type":"单选","key":"第60题","stem":"特种设备使用单位特种设备安全管理负责人的责任不包括 （　）","options":["全面负责本单位特种设备安全管理的领导职责","组织制定特种设备安全管理制度","组织制定本单位特种设备事故的应急专项预案","落实特种设备安全管理机构设置"],"answer":"A","why":"“全面负责本单位特种设备安全管理”是使用单位主要负责人（第一责任人）的职责；安全管理负责人是协助层级，负责组织制定安全管理制度、编制事故应急专项预案、落实机构设置与人员配备。注意区分两个层级，故选A。","expl":""},{"type":"单选","key":"第61题","stem":"特种设备使用单位特种设备安全管理员的责任不包括 （　）","options":["组织建立特种设备安全技术档案","办理特种设备使用登记","组织制定特种设备事故应急专项预案","组织开展特种设备安全教育和技能培训"],"answer":"C","why":"特种设备安全管理员负责具体事务：建立安全技术档案、办理使用登记、组织开展教育培训等；组织制定特种设备事故应急专项预案是安全管理负责人的职责，不属于安全管理员。口诀“员管具体事、负责人管预案”，故选C。","expl":""}]};
const KEY = 'jingjiang_' + QUIZ.title;
let answers = [], sel = [], locked = [];

function save() { try { localStorage.setItem(KEY, JSON.stringify({ answers, sel, locked })); } catch(e) {} }
function loadSaved() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.answers) { answers = s.answers; sel = s.sel; locked = s.locked; } } catch(e) {} }
function clearAll() { if (confirm('确定清空本章答题记录，从头再做吗？')) { localStorage.removeItem(KEY); location.reload(); } }

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
const L = 'ABCDE';
function optsHtml(i) {
  const q = QUIZ.questions[i];
  if (q.type === '判断') {
    return '<div class="tf">' + ['对','错'].map(t => {
      let cls = 'opt';
      if (locked[i]) cls += t === q.answer ? ' right' : (answers[i].mine === t ? ' wrong' : '');
      return `<button class="${cls}" ${locked[i]?'disabled':''} onclick="pick(${i},'${t}')">${t}</button>`;
    }).join('') + '</div>';
  }
  return q.options.map((o, k) => {
    const lt = L[k];
    let cls = 'opt';
    if (locked[i]) cls += q.answer.includes(lt) ? ' right' : (answers[i].mine.includes(lt) ? ' wrong' : '');
    else cls += (sel[i]||[]).includes(lt) ? ' sel' : '';
    return `<button class="${cls}" ${locked[i]?'disabled':''} onclick="pick(${i},'${lt}')"><b>${lt}</b>　${esc(o)}</button>`;
  }).join('') + (q.type === '多选' && !locked[i] ? `<button class="confirm" ${(sel[i]&&sel[i].length)?'':'disabled'} onclick="confirmMulti(${i})">确　认</button>` : '');
}
function verdictHtml(i) {
  const q = QUIZ.questions[i];
  if (!locked[i]) return '';
  const a = answers[i];
  let h = a.ok
    ? `<div class="vline">✅ 答对了</div>`
    : `<div class="vline">❌ 答错了 · 你选 ${esc(a.mine)} · 正确答案 <u>${q.answer}</u></div>`;
  if (q.why) h += esc(q.why) + '<br>';
  if (q.expl) h += `<b class="h">📖 详细讲解：</b><br>` + esc(q.expl);
  return `<div class="verdict ${a.ok?'ok':'no'}">${h}</div><button class="re" onclick="redo(${i})">↺ 重新做这题</button>`;
}
function renderQ(i) {
  const q = QUIZ.questions[i];
  document.getElementById('q' + i).innerHTML =
    `<div class="qno"><span class="badge">${q.type}</span>第 ${i+1} 题${q.key && q.key.startsWith('附') ? '（附录）' : ''} · ${q.key || ''}</div>` +
    `<div class="stem">${esc(q.stem)}</div>` + optsHtml(i) + verdictHtml(i);
  updateBar();
}
function renderAll() {
  document.getElementById('list').innerHTML = QUIZ.questions.map((q,i)=>`<div class="q" id="q${i}"></div>`).join('');
  QUIZ.questions.forEach((_,i)=>renderQ(i));
}
function updateBar() {
  document.getElementById('pdone').textContent = answers.filter(a=>a).length;
  document.getElementById('pok').textContent = answers.filter(a=>a&&a.ok).length;
}
function pick(i, v) {
  if (locked[i]) return;
  const q = QUIZ.questions[i];
  if (q.type !== '多选') submit(i, [v]);
  else { sel[i] = sel[i] || []; const k = sel[i].indexOf(v); k>=0 ? sel[i].splice(k,1) : sel[i].push(v); save(); renderQ(i); }
}
function confirmMulti(i) { if (sel[i] && sel[i].length) submit(i, [...sel[i]].sort()); }
function submit(i, vals) {
  const q = QUIZ.questions[i];
  const std = q.type === '判断' ? q.answer : q.answer.split('').sort().join('');
  const mine = q.type === '判断' ? vals[0] : vals.join('');
  answers[i] = { mine, ok: mine === std };
  locked[i] = true;
  save(); renderQ(i);
}
function redo(i) {
  answers[i] = null; locked[i] = false; sel[i] = sel[i] ? sel[i].splice(0, sel[i].length) && null : null;
  save(); renderQ(i);
}
function copyAns() {
  const text = answers.map((a,i)=>a?`${i+1}${a.mine}`:null).filter(Boolean).join(' ') || '（还没答题）';
  const done = () => { const b = document.getElementById('copybtn'); b.textContent = '✅ 已复制，去聊天粘贴'; setTimeout(()=>b.textContent='📋 复制已答成绩', 2000); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(done); else done();
}
answers = new Array(QUIZ.questions.length).fill(null);
sel = new Array(QUIZ.questions.length).fill(null);
locked = new Array(QUIZ.questions.length).fill(false);
loadSaved();
renderAll();
</script>
