ype":"单选","stem":"关于电焊机的使用,以下说法错误的是 （　）","options":["交流电焊机应配装防二次侧触电保护器","交流电焊机一次侧电源线长度不应大于 30 米","二次侧电源线应采用防水型橡皮护套铜芯软电缆","在潮湿处操作电焊机,操作人员应站在绝缘板上。"],"answer":"B","why":""},{"type":"单选","stem":"通信工程路面切割机的使用,做法错误的是 （　）。","options":["金属外壳应做好保护接地","手柄上应有电源控制开关并做绝终保护","使用时应一边操作、一边随机整理电源线","操作人员应戴绝缘手套、穿绝缘鞋"],"answer":"C","why":""},{"type":"判断","stem":"砂轮切割机的电源线应采用耐气温变化的橡胶皮护套铜芯软电缆（　）","options":[],"answer":"对","why":""},{"type":"单选","stem":"砂轮切割机应安装防护罩,切割机前面应设立（　）M 高的耐火档砂板。","options":["1.2","1.5","1.7","2"],"answer":"C","why":""},{"type":"单选","stem":"推土机横坡行驶的坡度最大为（　）","options":["0°","15°","20°","25°"],"answer":"A","why":""},{"type":"单选","stem":"推土机停车时刀铲距地面要保持 （　） m 左右。","options":["0.2","0.5","1.0"],"answer":"A","why":""},{"type":"单选","stem":"使用吊车在架空电力线附近工作时,应与其保持安全距离,当输电线路电压为 10KV 时,允许与输电线路的最近距离为（　）米。","options":["1.5","2.0","4.0","6.0"],"answer":"B","why":""},{"type":"单选","stem":"使用吊车在架空电力线附近工作时,应与其保持安全距离,当输电线路电压为 35KV 时,允许与输电线路的最近距离为（　）米","options":["1.5","2.0","4.0","6.0"],"answer":"C","why":""}]};
const KEY = 'quiz_' + QUIZ.title;
const GROUP = 5;
let idx = 0, answers = [], sel = [], locked = [];
const app = document.getElementById('app');

function copyGroup(gstart) {
  let text = [];
  for (let i = gstart; i < Math.min(gstart + GROUP, QUIZ.questions.length); i++) {
    if (answers[i]) text.push(`${i+1}${answers[i].mine}`);
  }
  text = text.join(' ') || '（本组还没答题）';
  const done = () => { const b = document.getElementById('gbtn' + gstart); if (b) { b.textContent = '✅ 已复制，去聊天粘贴'; } };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(done);
  else done();
}

function save() { try { localStorage.setItem(KEY, JSON.stringify({ answers, sel, locked })); } catch(e) {} }
function loadSaved() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.answers) { answers = s.answers; sel = s.sel; locked = s.locked; }
  } catch(e) {}
}

function answeredText() {
  return answers.map((a,i)=>a?`${i+1}${a.mine}`:null).filter(Boolean).join(' ');
}
function copyResult() {
  const text = answeredText() || '（还没答任何题）';
  const done = () => { const b = document.getElementById('copybtn'); if (b) { b.textContent = '✅ 已复制，去聊天粘贴'; setTimeout(()=>{ const x=document.getElementById('copybtn'); if(x) x.textContent='📋 复制已答成绩'; }, 2000); } };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(() => { const t=document.getElementById('ta'); if(t){t.select();document.execCommand('copy');} done(); });
  else { const t=document.getElementById('ta'); if(t){t.select();document.execCommand('copy');} done(); }
}
function clearProgress() {
  if (confirm('确定清空本章答题记录，从头再做吗？')) { localStorage.removeItem(KEY); location.reload(); }
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function letters(n){ return 'ABCDE'.slice(0, n).split(''); }

function render() {
  if (idx >= QUIZ.questions.length) { renderResult(); return; }
  const q = QUIZ.questions[idx];
  let html = `<div class="progress">第 <b>${idx+1}</b> / ${QUIZ.questions.length} 题 · 已做对 ${answers.filter((a,i)=>a && a.ok).length}
    <span style="float:right"><button class="mini" id="copybtn" onclick="copyResult()">📋 复制已答成绩</button> <button class="mini" onclick="clearProgress()">清空重做</button></span></div>`;
  html += `<span class="badge">${q.type}</span><div class="stem">${esc(q.stem)}</div>`;
  if (q.type === '判断') {
    html += `<div class="tf">` + ['对','错'].map(t =>
      `<button class="opt ${locked[idx] ? (t===q.answer?'right':(sel[idx]===t?'wrong':'')) : ''}" ${locked[idx]?'disabled':''} onclick="pick('${t}')">${t}</button>`).join('') + `</div>`;
  } else {
    html += letters(q.options.length).map((L,i) =>
      `<button class="opt ${locked[idx] ? (q.answer.includes(L)?'right':((sel[idx]||[]).includes(L)?'wrong':'')) : ((sel[idx]||[]).includes(L)?'sel':'')}" ${locked[idx]?'disabled':''} onclick="pick('${L}')"><b>${L}</b>　${esc(q.options[i])}</button>`).join('');
    if (q.type === '多选' && !locked[idx]) html += `<button class="confirm" ${sel[idx] && sel[idx].length ? '' : 'disabled'} onclick="confirmMulti()">确　认</button>`;
  }
  if (locked[idx]) {
    const ok = answers[idx].ok;
    html += `<div class="why"><div class="verdict ${ok?'ok':'no'}">${ok ? '✅ 答对了' : '❌ 答错了，正确答案 ' + q.answer}</div>${q.why ? esc(q.why) : ''}</div>`;
  }
  // 每完成一组（GROUP 题）弹出复制提示
  if (locked[idx] && (idx + 1) % GROUP === 0 && idx + 1 < QUIZ.questions.length) {
    const gs = idx + 1 - GROUP;
    html += `<div class="groupbar">✅ 第 ${gs+1}~${idx+1} 题完成（对 ${answers.slice(gs, idx+1).filter(a=>a&&a.ok).length} / ${GROUP}）<br>
      <button class="mini gbtn" id="gbtn${gs}" onclick="copyGroup(${gs})">📋 复制这 ${GROUP} 题成绩发给我</button>
      <span class="ghint">粘贴到聊天后，点「下一题 →」继续</span></div>`;
  }
  html += `<div class="nav"><button onclick="prev()" ${idx===0?'disabled':''}>← 上一题</button><button onclick="next()" ${locked[idx]?'':'disabled'}>${idx===QUIZ.questions.length-1?'看成绩 →':'下一题 →'}</button></div>`;
  app.innerHTML = html;
}

function pick(v) {
  if (locked[idx]) return;
  const q = QUIZ.questions[idx];
  if (q.type === '判断' || q.type === '单选') { submit([v]); }
  else { // 多选 toggle
    sel[idx] = sel[idx] || [];
    const i = sel[idx].indexOf(v);
    i >= 0 ? sel[idx].splice(i,1) : sel[idx].push(v);
    render();
  }
}
function confirmMulti() { if (sel[idx] && sel[idx].length) submit([...sel[idx]].sort()); }

function submit(vals) {
  const q = QUIZ.questions[idx];
  const std = q.type === '判断' ? q.answer : q.answer.split('').sort().join('');
  const mine = q.type === '判断' ? vals[0] : vals.join('');
  const ok = mine === std;
  answers[idx] = { mine, ok };
  locked[idx] = true;
  save();
  render();
}

function prev() { if (idx > 0) { idx--; render(); } }
function next() { if (locked[idx]) { idx++; render(); } }

function renderResult() {
  const total = QUIZ.questions.length;
  const right = answers.filter(a => a && a.ok).length;
  const wrongs = QUIZ.questions.map((q,i) => ({q,i,a:answers[i]})).filter(x => x.a && !x.a.ok);
  let html = `<div class="result"><div class="progress">${QUIZ.title}</div><div class="score">${right}<small> / ${total}</small></div>`;
  if (wrongs.length) {
    html += `<div class="wronglist"><b>❌ 错题（已记入待重测）：</b><br>` + wrongs.map(x =>
      `第${x.i+1}题 你答 ${x.a.mine} · 正确 ${x.q.answer}<br>　${esc(x.q.why)}`).join('<br>') + `</div>`;
  } else {
    html += `<div class="wronglist">🎉 全对！没有错题。</div>`;
  }
  html += `<button class="copy" onclick="copyResult()">📋 复制成绩（发给 ZCode 记错题本）</button>`;
  html += `<textarea id="ta" readonly>${answeredText()}</textarea>`;
  html += `<button class="redo" onclick="clearProgress()">🗑 清空本章记录，从头再做</button></div>`;
  app.innerHTML = html;
}

function copyResult() {
  copyResultBtn();  // 顶栏按钮复用同一函数
}
function copyResultBtn() {}  // 占位（顶栏直接用 copyResult）

answers = new Array(QUIZ.questions.length).fill(null);
sel = new Array(QUIZ.questions.length).fill(null);
locked = new Array(QUIZ.questions.length).fill(false);
loadSaved();
// 续做：跳到第一个未答的题；全答完则直接看成绩
idx = locked.findIndex(l => !l);
if (idx === -1) idx = QUIZ.questions.length;
render();
</script>
