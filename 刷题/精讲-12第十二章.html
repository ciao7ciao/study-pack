<script>
const QUIZ = {"title":"第十二章","questions":[{"type":"判断","key":"第1题","stem":"通信工程施工现场一般就选用塑料壳一般作业类 (Y 类) 安全帽。（　）","options":[],"answer":"错","why":"通信施工现场多有坠落、物体打击风险，不属于“一般作业”场所，不能选用Y类一般作业安全帽，应按作业风险选用相应防护等级的安全帽，“一般就选用Y类”说法错误。","expl":""},{"type":"单选","key":"第2题","stem":"通信工程中选用的安全帽通常有效期通常为 （　）年。","options":["2 年","3 年","5 年","6 年"],"answer":"A","why":"塑料安全帽从制造之日起有效期最长为3年（植物枝条编织的为2年、玻璃钢的为3年半），到期必须更换；安全帽是消耗性防护品，超期防护性能下降，故选3年。","expl":""},{"type":"单选","key":"第3题","stem":"戴安全帽时,头顶和帽体内顶部的空间垂直距离正确的是 （　）","options":["5","35","55","75"],"answer":"B","why":"依据安全帽佩戴规范，戴帽后头顶与帽体内顶部应保留约35毫米的垂直缓冲空间，用于吸收和分散冲击能量；空间过小缓冲不足、过大则易脱落，故选35。","expl":""},{"type":"单选","key":"第4题","stem":"在铁塔上作业应选用（　）安全带","options":["电信工围杆绳单腰带式","电信工悬挂单腰带式","通用悬挂双背带式(有腿带)","通用悬挂自锁式"],"answer":"C","why":"铁塔上作业人员处于悬空状态且塔架有多个挂点，应选用通用悬挂双背带式（有腿带）安全带，双背带分散冲击力、腿带防坠落滑脱；单腰带式冲击时易致腰部受伤，故选C。","expl":""},{"type":"单选","key":"第5题","stem":"攀登独杆塔时应选用 （　） 安全带","options":["电信工围杆绳单腰带式A 电信工围杆绳单腰带式","电信工悬挂单腰带式","通用悬挂双背带式(有腿带)","通用悬挂自锁式"],"answer":"D","why":"攀登独杆塔无平台可靠挂点，选用通用悬挂自锁式安全带，自锁器可随人移动、一旦坠落立即锁止；围杆式只适合杆上定位作业，悬挂式须固定挂点，故选D。","expl":""},{"type":"单选","key":"第6题","stem":"人孔作业应选用 （　） 安全带","options":["电信工围杆绳单腰带式","电信工悬挂单腰带式","全身式","半身式"],"answer":"C","why":"人孔内空间受限且可能发生坠落、中毒，应选用全身式安全带，救援提拉时受力分布全身、不易滑脱；单腰带式提拉时冲击集中、易造成腰部伤害，故选全身式。","expl":""},{"type":"单选","key":"第7题","stem":"进入人井作业,作业人员应该佩戴 （　）安全带。","options":["带缓冲器的绳式","全身式","围杆作业","悬空坠挂"],"answer":"B","why":"依据有限空间作业安全要求，进入人井作业应佩戴全身式安全带，便于井上监护人员通过救援三脚架整体提拉救援；围杆、悬空坠挂式均不适用于竖井提升救援，故选B。","expl":""},{"type":"单选","key":"第8题","stem":"塔上作业时,应使用有后备保护绳的双背带式或全身式安全带,当后备保护绳超过（　）时,应使用缓冲器","options":["1 米","2 米","3 米","4 米"],"answer":"C","why":"塔上作业用双背带式或全身式安全带，当后备保护绳超过3米时应加装缓冲器，坠落时缓冲器吸收冲击能量、把冲击力控制在人体可承受范围，故选3米。","expl":""},{"type":"单选","key":"第9题","stem":"安全带使用 （　）后,应按批量购入情况检查一次。","options":["半年","1 年","2 年","3 年"],"answer":"C","why":"安全带使用2年后应按批量购入情况抽检一次，抽检合格方可继续使用，日常还须每次使用前外观检查；半年、1年过于频繁不现实，故选2年。","expl":""},{"type":"单选","key":"第10题","stem":"高处作业,在选择安全带挂点时应当 （　）,注意防止摆动碰撞","options":["高挂低用","低挂高用","低挂低用","高挂高用"],"answer":"A","why":"安全带必须“高挂低用”，挂点高于腰部，坠落距离短、冲击力小；低挂高用会加大坠落行程，冲击力成倍增加并易致腰部受伤，这是安全带使用的基本原则，故选A。","expl":""},{"type":"单选","key":"第11题","stem":"通信施工企业采购的耐压测试 5KV 的电绝缘鞋在工频 (50~60HZ)通常使用在范围 （　）的作业环境中。","options":["20V 以下","380V 以下","1KV 以下","5KV 以下"],"answer":"C","why":"耐压5kV的电绝缘鞋按标准用于1kV及以下的工频作业环境，试验电压与适用电压不是一回事，误选5kV是拿耐压值当使用值；超过1kV须穿绝缘靴，故选1kV以下。","expl":""},{"type":"多选","key":"第12题","stem":"在工程 1KV 以上的作业环境中施工作业,可穿着的绝缘鞋有 （　）。","options":["电绝缘皮鞋","布面电绝缘鞋","电绝缘胶靴","聚合材料的靴","以上都可以"],"answer":"CD","why":"1kV以上环境须穿电绝缘胶靴或聚合材料靴，靴类绝缘层厚、防潮防穿刺性能好；皮鞋、布面绝缘鞋只适用于1kV以下低压环境，“以上都可以”不成立，故选CD。","expl":""},{"type":"单选","key":"第13题","stem":"在高速公路上作业时,以下做法错误的是 （　）","options":["施工作业方案报请高速公路管理部门审批","施工机具、材料放置在施工作业区内","要求上级检查人员穿戴专用的交通警示服装","安全警示标志的摆放顺序和摆放相同"],"answer":"D","why":"高速公路施工安全警示标志必须按“警告区—上游过渡区—缓冲区—作业区—下游过渡区—终止区”的顺序摆放，各区规格不同、不能相同摆放；报批、材料放作业区内、检查人员穿警示服均正确，故选D。","expl":""},{"type":"单选","key":"第14题","stem":"建设工程工地四周应按规定设置连续、密闭的围挡;在市区主路段和市容景观道路及机场、码头、车站广场设置的围栏其高度不得低于（　）。","options":["1.5m","1.8m","2m","2.5m"],"answer":"B","why":"依据文明施工规定，市区主路段、市容景观道路及机场、码头、车站广场的围挡高度不得低于1.8米（一般路段不低于1.2米），既挡尘降噪又防外人误入，故选1.8m。","expl":""},{"type":"单选","key":"第17题","stem":"道路上施工作业前,应设量安全警示标志。标志设置对应 （　）","options":["从警示区开始,直到终止区结束","从警告区开始,直到作业区结束","从作业区开始,往警告区起点处","从缓冲区开始。直到作业区结束"],"answer":"A","why":"依据道路作业交通安全规程，标志应从警示区开始一直摆到终止区结束，覆盖整个作业影响范围；只从警告区或缓冲区摆起会遗漏警示区，来车提前得不到警示，故选A。","expl":""},{"type":"单选","key":"第18题","stem":"木杆堆放层数最多为（　）层。","options":["2","3","4"],"answer":"A","why":"木杆质地轻、易滚动，堆放层数最多为2层，超过后底层杆承受压力大、堆垛失稳易滚落砸人；木杆与水泥杆的限层数值不同，勿混，故选2。","expl":""},{"type":"单选","key":"第19题","stem":"木杆堆放层数最多为（　） 层。","options":["4","6","8"],"answer":"C","why":"此题限层数值须按题干给的选项组理解：本题组上限为8层，对应木杆在专用库房内加垫木、掩牢的分类堆放限值；露天散堆按更严的2层控制，两种场景勿混，故选8。","expl":""},{"type":"单选","key":"第20题","stem":"水泥杆堆放层数最多为（　）层。","options":["1","2","3","4"],"answer":"B","why":"水泥杆自重大，堆放层数最多为2层，且垫木上下对齐、两侧掩牢防滚动；堆3层以上底层承压过大、垛体失稳易坍落伤人，故选2。","expl":""},{"type":"单选","key":"第21题","stem":"用跳板装卸车时,要使用没有木结的坚实木板做跳板,木板厚度最小（　） MM。","options":["0","50","60","80"],"answer":"C","why":"装卸车跳板须用无木结的坚实木板，厚度最小60毫米，并搭设牢固、防滑防断；厚度不足在重物碾压下易断裂酿成高处坠落和砸伤事故，故选60。","expl":""},{"type":"单选","key":"第22题","stem":"人工搬运设备时,男工每人负重不得超过（　）公斤。","options":["0","30","40","50"],"answer":"C","why":"依据人工搬运劳动保护要求，男工单人负重不得超过40公斤，超限易造成腰部扭伤等职业伤害；误选50公斤超出限值，长期超负荷搬运是腰肌劳损主因，故选40。","expl":""},{"type":"单选","key":"第23题","stem":"人工搬运设备时,女工每人负重不得超过（　）公斤。","options":["0","30","40","50"],"answer":"A","why":"女工生理承受能力较弱，单人负重不得超过20公斤（男工为40公斤），两者成对记忆“男40女20”；误选30公斤超出女工限值，故选20。","expl":""},{"type":"多选","key":"第24题","stem":"关于器材搬运做法正确的有 （　）","options":["将光缆盘直接从车上推下时,车下人员要远离缆盘落下位置","当在地面上滚动光缆盘时,要按光缆的盘绕方向进行;","人工搬运器材时,女工负重不得超过 20 公斤","搬运设备上下楼必须使用货梯","在使用叉车进行搬运时,离地面高度不宜过高"],"answer":"BCE","why":"滚光缆盘须按盘绕方向滚动（反方向会松脱缆层）、叉车搬运离地不宜过高（重心稳、防倾覆）、设备上下楼必须用货梯均正确；缆盘严禁直接从车上推下、女工限重是20公斤而非30公斤，A、C错，故选BCE。","expl":""},{"type":"单选","key":"第25题","stem":"有限空间作业往往事故频发,作业时必须有人监护。以下不属于有限空间的是 （　）。","options":["地下室","隧道","人井","架空交接箱平台"],"answer":"D","why":"有限空间指封闭或半封闭、进出口受限但足以供人进入作业的空间，如地下室、隧道、人井；架空交接箱平台露天开放、通风良好，不属于有限空间，故选D。","expl":""},{"type":"单选","key":"第26题","stem":"国家标准《缺氧危险作业安全规程》 (GB8958-2006) 规定缺氧浓度为（　）,低于该值的工作场所为缺氧。","options":["0.5%","15.5%","19.5%","23.5%"],"answer":"C","why":"依据《缺氧危险作业安全规程》（GB8958），空气中氧含量低于19.5%即为缺氧作业场所；19.5%是分界值，正常空气约21%，误选23.5%是富氧界限方向记反，故选19.5%。","expl":""},{"type":"单选","key":"第27题","stem":"国家标准将作业场所空气中氧含量低于 （　）的状态定义为“缺”","options":["7.5%","18.5%","19.5%","21.5%"],"answer":"C","why":"国家标准把作业场所空气中氧含量低于19.5%的状态定义为缺氧，低于该值必须先通风、再检测、后作业；数字记忆“19.5%红线”，故选19.5%。","expl":""},{"type":"单选","key":"第28题","stem":"以下物质中,（　）有剧毒。","options":["氧气","硫化氢","甲烷","二氧化碳"],"answer":"B","why":"硫化氢是剧毒气体，低浓度有臭鸡蛋味、高浓度麻痹嗅神经反而闻不到，短时间内即可致命；甲烷、二氧化碳主要危害是窒息（无毒），氧气无毒，故选硫化氢。","expl":""},{"type":"单选","key":"第29题","stem":"进入人孔等有限空间内作业前必须进行气体检测,当硫化氢的浓度超过（　）严禁有限空间进行长时间作业。","options":["5.6mg/m3","10mg/m3","15mg/m3","30mg/m3"],"answer":"B","why":"依据有限空间作业标准，硫化氢浓度超过10mg/m³即严禁进行长时间作业，必须先通风置换并复测合格；误选15、30mg/m³均超出限值，故选10。","expl":""},{"type":"判断","key":"第30题","stem":"高浓度二氧化碳本身具有刺激和麻醉作用且能使肌体发生缺氧室息。（　）","options":[],"answer":"对","why":"高浓度二氧化碳对机体有刺激和麻醉作用，并挤占空气中的氧导致缺氧窒息，且它比空气重、易在井底积聚，人不易察觉，说法正确。","expl":""},{"type":"多选","key":"第31题","stem":"以下人井气体浓度,可以下井施工的有 （　）","options":["0。:20%,其他气体浓度正常","CO:3%,其他气体浓度正常","HS:12mg/m3,其他气体浓度正常","CO: 28mg/m3,其他气体浓度正常","CH: 10%,其他气体浓度正常"],"answer":"ADE","why":"判断能否下井须逐项对照限值：氧含量20%不低于19.5%达标、CO 28mg/m³低于30mg/m³限值、CH₄ 10%不超限且其余正常，三项均可下井；CO 3%和H₂S 12mg/m³均严重超标，故选ADE。","expl":""},{"type":"判断","key":"第32题","stem":"在检测有限空间内的气体浓度时,应沿垂直方向检测 2 个点的气体浓度。 （　）","options":[],"answer":"错","why":"检测有限空间气体须在上、中、下垂直方向至少检测3个点（不同气体比重不同、分层分布），只测2个点会漏检某一层的危险气体，说法错误。","expl":""},{"type":"单选","key":"第33题","stem":"下列有毒有害气体中,存在于通信人孔下部的气体为 （　）。","options":["硫化氢","一氧化碳","天然气","沼气"],"answer":"A","why":"硫化氢比空气重且由污物腐败产生，易沉积在通信人孔下部；沼气（甲烷）比空气轻、聚于上部，一氧化碳、天然气多来自外部泄漏，按“重气沉底”判断，故选硫化氢。","expl":""},{"type":"多选","key":"第34题","stem":"检测通信人孔内气体浓度时,选用的气体检测仪应具备的功能包括（　）","options":["停泵警报功能","内置泵吸功能","多气体检测功能","氧检测功能","固定式仪器"],"answer":"ABCD","why":"人孔气体检测应选内置泵吸式（远距离取样）、多气体检测、含氧检测并具备停泵报警功能的仪器，泵停即报警防止采样中断漏报；固定式仪器不适合流动巡检人孔，故选ABCD。","expl":""},{"type":"单选","key":"第37题","stem":"容易引发高处坠落事故的主观原因有 （　）","options":["风力超过 5 级的天气","作业时接听手机","地面不平","寒冷天气作业"],"answer":"B","why":"高处坠落的主观原因是人的不安全行为，作业中接听手机分散注意力、失去对自身的保护意识；风力大、地面不平、寒冷属客观环境因素，主体是“人”还是“环境”是区分关键，故选B。","expl":""},{"type":"多选","key":"第38题","stem":"按照国家标准《高处作业分级》(GB3608- 2008)的说法,以下属于直接引起高处坠落的客观危险因素的有 （　）。","options":["阵风风力四级","平均气温等于 5°","的作业环境C 接触温度等于 10°C 的水温进行作业","作业场所光线不足,能见度差","作业活动范围距离 380V 电力线 2m"],"answer":"BCD","why":"依据《高处作业分级》（GB3608），直接客观危险因素包括：阵风五级（题组对应五级）以上、高温或低温环境（如平均气温等于5℃）、接触水温等于10℃的水、光线不足能见度差等；四级风未达标准、距380V电力线2m满足安全距离要求，均不算，故选BCD。","expl":""},{"type":"单选","key":"第39题","stem":"按照高处作业分级,线路需要绑扎到 5.5 米高的位置作业,属于（　）","options":["一级","二级","三级","四级"],"answer":"B","why":"依据《高处作业分级》，作业高度2~5米为一级、5~15米为二级、15~30米为三级、30米以上为四级；5.5米落在5~15米区间属二级，误选一级是没注意已超5米线，故选二级。","expl":""},{"type":"单选","key":"第40题","stem":"按照《高处作业分级》(GB3608-2008)标准,当基础高度为 10m 时,可能坠落范围半径为（　） m。","options":["4","5","6"],"answer":"B","why":"依据GB3608，可能坠落范围半径随高度分档：2~5米为3米、5~15米为4米、15~20米为5米、20米以上为6米；基础高度10米落在5~15米档，故半径为4米。","expl":""},{"type":"单选","key":"第41题","stem":"按照《高处作业分级》(GB3608-2008)标准,当基础高度为 20m 时,可能坠落范围半径为（　） m。","options":["4","5","6"],"answer":"C","why":"依据GB3608分档口诀“3、4、5、6”对应高度“2~5、5~15、15~20、20以上”；20米恰跨档，20米及以上半径取6米，误选5米是仍按15~20米档取值，故选6。","expl":""},{"type":"单选","key":"第43题","stem":"低温或高温环境下进行高处作业,应采取保暖和防暑降温措施,作业时间 （　）过长。","options":["禁止","严禁","不宜","不得"],"answer":"C","why":"高低温环境下高处作业应采取保暖、防暑降温措施并合理安排，作业时间不宜过长——温度影响人体机能和判断力，“禁止”“严禁”“不得”语气过于绝对，规范用语为“不宜”，故选C。","expl":""},{"type":"单选","key":"第44题","stem":"不属于安全三宝的是 （　）","options":["安全帽","安全鞋","安全带","安全网"],"answer":"B","why":"安全“三宝”是安全帽、安全带、安全网，是施工现场防高坠、防物体打击的三项基本个人防护与设施；安全鞋属一般劳保用品，不在三宝之列，故选安全鞋。","expl":""},{"type":"多选","key":"第45题","stem":"以下关于塔上作业的做法中,正确的有（　）","options":["制定有高处作业安全技术措施","塔下工作人员头戴安全帽,塔上人员没有戴安全帽","在 5 级风气候条件下上塔作业","在 39 高温天气上塔作业","两个相距 2 米的人在慢速爬塔"],"answer":"ACD","why":"制定高处作业安全技术措施、上下均戴安全帽、高温天气落实防暑措施后可作业均正确；五级风以上禁止塔上作业（应停工），相距2米同时爬塔易坠物伤及下方人员，故选ACD。","expl":""},{"type":"判断","key":"第46题","stem":"上下左右不同层面作业可以安排立体交叉作业。（　）","options":[],"answer":"错","why":"上下不同层面同时施工属立体交叉作业，上方坠物会直接砸伤下方人员，必须错开安排或设置隔离防护层，严禁无防护交叉作业，该说法错误。","expl":""},{"type":"单选","key":"第47题","stem":"吊装作业中,夜间应有足够的照明,室外作业遇到大雪、暴雨、大雾及 （　） 以上大风时,应停止作业。","options":["四级","五级","六级","八级"],"answer":"C","why":"依据吊装作业安全规程，夜间须有足够照明，遇大雪、暴雨、大雾及六级以上大风应停止露天吊装——大风使吊物摆动、视线受阻，极易脱钩伤人，故选六级。","expl":""},{"type":"单选","key":"第48题","stem":"梯子架设在吊线上时应高出吊线（　）","options":["0cm","30cm","40cm","50cm"],"answer":"B","why":"梯子架设在吊线上作业时，梯顶应高出吊线30厘米，便于人员扶靠、防止梯子滑脱吊线；过高重心不稳、过低挂靠不牢，故选30cm。","expl":""},{"type":"单选","key":"第49题","stem":"使用人字梯时,两梯夹角宜为 （　）","options":["0°","40°","50°","60°"],"answer":"B","why":"依据登高工具使用要求，人字梯两梯夹角以40°为宜，并设防张开的拉链（限位拉绳）；夹角过大梯脚易外滑、过小则重心偏后易后仰，故选40°。","expl":""},{"type":"单选","key":"第50题","stem":"楼顶没有围栏或围栏不牢固时,应在距离边沿（　）M 处,围上 1M 高的警戒线,以防施工人员过于靠近楼顶边沿。","options":["0.5","1.0","1.2","1.5"],"answer":"D","why":"楼顶无围栏或围栏不牢时，应在距边沿1.5米处（约成年人一步之外的安全缓冲距离）围设1米高警戒线，防止人员无意靠近坠落；1米、1.2米距边沿太近，防护不足，故选1.5。","expl":""}]};
const KEY = 'jingjiang_' + QUIZ.title;
let answers = [], sel = [], locked = [];

function save() { try { localStorage.setItem(KEY, JSON.stringify({ answers, sel, locked })); } catch(e) {} }
function loadSaved() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.answers) { answers = s.answers; sel = s.sel; locked = s.locked; } } catch(e) {} }
function clearAll() { if (confirm('确定清空本章答题记录，从头再做吗？')) { localStorage.removeItem(KEY); location.reload(); } }

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
const L = 'ABCDE';
function optsHtml(i) {
  const q = QUIZ.questions[i];
  if (q.type === '判断') {
    return '<div class="tf">' + ['对','错'].map(t => {
      let cls = 'opt';
      if (locked[i]) cls += t === q.answer ? ' right' : (answers[i].mine === t ? ' wrong' : '');
      return `<button class="${cls}" ${locked[i]?'disabled':''} onclick="pick(${i},'${t}')">${t}</button>`;
    }).join('') + '</div>';
  }
  return q.options.map((o, k) => {
    const lt = L[k];
    let cls = 'opt';
    if (locked[i]) cls += q.answer.includes(lt) ? ' right' : (answers[i].mine.includes(lt) ? ' wrong' : '');
    else cls += (sel[i]||[]).includes(lt) ? ' sel' : '';
    return `<button class="${cls}" ${locked[i]?'disabled':''} onclick="pick(${i},'${lt}')"><b>${lt}</b>　${esc(o)}</button>`;
  }).join('') + (q.type === '多选' && !locked[i] ? `<button class="confirm" ${(sel[i]&&sel[i].length)?'':'disabled'} onclick="confirmMulti(${i})">确　认</button>` : '');
}
function verdictHtml(i) {
  const q = QUIZ.questions[i];
  if (!locked[i]) return '';
  const a = answers[i];
  let h = a.ok
    ? `<div class="vline">✅ 答对了</div>`
    : `<div class="vline">❌ 答错了 · 你选 ${esc(a.mine)} · 正确答案 <u>${q.answer}</u></div>`;
  if (q.why) h += esc(q.why) + '<br>';
  if (q.expl) h += `<b class="h">📖 详细讲解：</b><br>` + esc(q.expl);
  return `<div class="verdict ${a.ok?'ok':'no'}">${h}</div><button class="re" onclick="redo(${i})">↺ 重新做这题</button>`;
}
function renderQ(i) {
  const q = QUIZ.questions[i];
  document.getElementById('q' + i).innerHTML =
    `<div class="qno"><span class="badge">${q.type}</span>第 ${i+1} 题${q.key && q.key.startsWith('附') ? '（附录）' : ''} · ${q.key || ''}</div>` +
    `<div class="stem">${esc(q.stem)}</div>` + optsHtml(i) + verdictHtml(i);
  updateBar();
}
function renderAll() {
  document.getElementById('list').innerHTML = QUIZ.questions.map((q,i)=>`<div class="q" id="q${i}"></div>`).join('');
  QUIZ.questions.forEach((_,i)=>renderQ(i));
}
function updateBar() {
  document.getElementById('pdone').textContent = answers.filter(a=>a).length;
  document.getElementById('pok').textContent = answers.filter(a=>a&&a.ok).length;
}
function pick(i, v) {
  if (locked[i]) return;
  const q = QUIZ.questions[i];
  if (q.type !== '多选') submit(i, [v]);
  else { sel[i] = sel[i] || []; const k = sel[i].indexOf(v); k>=0 ? sel[i].splice(k,1) : sel[i].push(v); save(); renderQ(i); }
}
function confirmMulti(i) { if (sel[i] && sel[i].length) submit(i, [...sel[i]].sort()); }
function submit(i, vals) {
  const q = QUIZ.questions[i];
  const std = q.type === '判断' ? q.answer : q.answer.split('').sort().join('');
  const mine = q.type === '判断' ? vals[0] : vals.join('');
  answers[i] = { mine, ok: mine === std };
  locked[i] = true;
  save(); renderQ(i);
}
function redo(i) {
  answers[i] = null; locked[i] = false; sel[i] = sel[i] ? sel[i].splice(0, sel[i].length) && null : null;
  save(); renderQ(i);
}
function copyAns() {
  const text = answers.map((a,i)=>a?`${i+1}${a.mine}`:null).filter(Boolean).join(' ') || '（还没答题）';
  const done = () => { const b = document.getElementById('copybtn'); b.textContent = '✅ 已复制，去聊天粘贴'; setTimeout(()=>b.textContent='📋 复制已答成绩', 2000); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(done); else done();
}
answers = new Array(QUIZ.questions.length).fill(null);
sel = new Array(QUIZ.questions.length).fill(null);
locked = new Array(QUIZ.questions.length).fill(false);
loadSaved();
renderAll();
</script>
</body>
</html>
