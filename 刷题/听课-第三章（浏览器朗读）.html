<script>
const SEGS = [{"tag": "第1题 · 单选（选错误项）", "text": "第三章第一题。考点：通信工程各责任主体的共同要求。错误的说法是：必须进行安全生产科技创新。"}, {"tag": null, "text": "对通信建设、勘察、设计、施工、监理各方的要求是：遵守安全生产法律法规，执行保障安全的国家标准、行业标准，确保安全生产、依法承担责任。科技创新是鼓励，不是必须，说必须就是错的。"}, {"tag": "第2题 · 多选", "text": "第二题，多选。考点：哪些属于建设单位的安全生产责任。正确的是两条。"}, {"tag": null, "text": "建设工程安全生产费不得打折；工程合同中应明确安全生产费的支付方式、数额及时限。"}, {"tag": null, "text": "错的三条：按强制标准施工作业是施工单位的；对灾害提出防治措施是勘察设计单位的；审查施工组织设计是监理单位的。口诀：建设单位管给钱、管合同。"}, {"tag": "第3题 · 单选", "text": "第三题。考点：通信工程开工前，谁应当明确参与工程相关单位的安全生产责任。答案：建设单位。"}, {"tag": null, "text": "工程是建设单位发包的，开工前由它把各家的安全责任划清楚。谁发包，谁立规矩。"}, {"tag": "第4题 · 单选", "text": "第四题。考点：又一条建设单位责任。答案：不得压缩合同工期。"}, {"tag": null, "text": "抢工期就是抢事故，所以法律明文禁止建设单位压缩合同工期。其他三条：勘察文件真实准确是勘察单位的；安全费用提取程序是企业内部管理；考核施工安全管理人员不归建设单位管。"}, {"tag": "第5题 · 单选", "text": "第五题。考点：保证管线设施和周边建筑物安全、对可能引发隐患的灾害提出防治措施，这是谁的责任。答案：勘察设计单位。"}, {"tag": null, "text": "地下有什么管线、旁边有什么建筑，是勘察设计单位最清楚的，所以保护措施和灾害防治由它们提出。记法：谁勘探谁清楚，谁设计谁提醒。"}, {"tag": "第6题 · 单选", "text": "第六题。考点：设计单位必须在设计文件中怎样计列安全生产费。答案：全额。"}, {"tag": null, "text": "安全费必须全额列入概预算，不能打折、不能按建设单位要求打折。安全钱，一分不能少。"}, {"tag": "第7题 · 多选", "text": "第七题，多选。考点：属于设计单位的安全生产责任。正确的是两条。"}, {"tag": null, "text": "工程概预算必须按照相关规定全额列出安全生产费用；对有可能引发通信工程安全隐患的灾害提出防治措施。"}, {"tag": null, "text": "错的三条又碰到老熟人了：安全费不得打折、合同明确支付方式，是建设单位；审查施工组织设计，是监理单位。"}, {"tag": "第8题", "text": "第八题，考点比较绕，直接给你干货：企业安全生产的'三类人'，也叫安管人员，指的是：企业主要负责人、项目负责人、专职安全生产管理人员。"}, {"tag": null, "text": "题目问'不包括'，按题库答案，项目兼职安全巡视人员不算安管人员。记住三类的框架，这类题的选项不管怎么排，都在这个框里挑。"}, {"tag": "第9题 · 单选", "text": "第九题。考点：谁不属于企业安全生产三类人。答案：施工现场操作人员。"}, {"tag": null, "text": "主要负责人、项目负责人、安全生产管理人员是管理层的三类人；一线操作工人干活再重要，也不属于安管人员。"}, {"tag": "第10题 · 多选", "text": "第十题，多选。考点：哪些人必须通过通信主管部门的安全生产知识和管理能力考核。答案：单位主要负责人、项目负责人、专职安全生产管理人员，正好就是三类人。"}, {"tag": null, "text": "错的是工程管理部门负责人、班组安全员。通信行业只考核三类人，考核发证，这叫A类、B类、C类证，后面几题细讲。"}, {"tag": "第11题 · 单选", "text": "第十一题。考点：施工单位对本单位所有管理人员和作业人员，每年至少进行几次安全生产教育培训。答案：一次。"}, {"tag": null, "text": "老规矩：安全教育，年检一次起步。跟第二章的数字对上了。"}, {"tag": "第12题 · 单选", "text": "第十二题。考点：分包单位的管理人员和作业人员每年至少培训几次。答案：也是一次。"}, {"tag": null, "text": "总包分包一个标准，谁的人谁培训，一年一遍不能少。"}, {"tag": "第13题 · 判断", "text": "第十三题，判断题。题目说：施工现场应由具有一定施工经验的人员对安全生产进行监督。"}, {"tag": null, "text": "错。安全监督是专职安全生产管理人员的活，不是随便找个有经验的人就能盯安全。专职两个字就是门槛。"}, {"tag": "第14题 · 单选", "text": "第十四题。考点：通信工程施工前，组织施工安全技术交底的是谁。答案：项目安全负责人。"}, {"tag": null, "text": "注意：这道题依据的是通信行业的规定，答案是项目安全负责人；第二章那道依据建设工程安全生产管理条例，答案是项目技术负责人。两个法规两个答案，看题目引用哪部规定。"}, {"tag": "第15题 · 判断", "text": "第十五题，判断题。题目说：井下、高空、用电作业时，必须配备地下管线探测仪、防护绳、防触电等用具。"}, {"tag": null, "text": "错在张冠李戴。井下作业要配的是气体检测仪和通风设备；地下管线探测仪是开挖前探地下管线用的，不是下井用具。用具要跟作业类型对得上。"}, {"tag": "第16题 · 单选（选错误项）", "text": "第十六题。考点：有限空间作业要求。错误的说法是：必须先检测、再通风、后作业。"}, {"tag": null, "text": "正确顺序是：先通风、再检测、后作业！先把有毒气体排出去，再检测达标，人才能下去。顺序反了就会出人命。这题原卷答案标注缺失，但按规程答案就是它。口诀：风、检、作。"}, {"tag": "第17题 · 多选", "text": "第十七题，多选。考点：施工单位安全生产责任的说法，正确的是四条。"}, {"tag": null, "text": "建立健全安全生产教育培训制度；严格按照工程建设强制性标准和安全生产操作规范施工；有限空间作业严格执行审批制度；建立健全生产安全事故隐患排查治理制度。"}, {"tag": null, "text": "错的是保证安全生产费全部用于本项目这条，说法跟规定原文不一致。四大制度记法：培训、标准、审批、排查。"}, {"tag": "第18题 · 多选", "text": "第十八题，多选。考点：监理单位对通信工程项目的安全责任。正确的是三条。"}, {"tag": null, "text": "进行现场安全的巡视检查；审查工程安全专项施工方案；审查施工组织设计中安全技术措施。"}, {"tag": null, "text": "错的是参加安全技术交底和组织安全生产检查——交底归施工单位，检查组织也是施工方的日常管理动作。监理三件事：巡视、审方案、审措施。"}, {"tag": "第19题 · 单选", "text": "第十九题。考点：通信工程招标时，应明确不得作为竞争性报价的是什么。答案：安全生产费。"}, {"tag": null, "text": "安全费不参与竞价，报多报少都不许拿来让利。这就是第二章案例里说的不参与竞争原则。"}, {"tag": "第20题 · 单选", "text": "第二十题。考点：哪项不属于安全生产费的使用范围。答案：为作业人员购买意外伤害保险的费用。"}, {"tag": null, "text": "气体检测仪、应急救援的安全绳、安全教育培训，都是安全费该花的；意外伤害保险是另外的渠道，不走安全费。"}, {"tag": "第21题 · 单选", "text": "第二十一题。考点：年度提取的安全生产费有结余怎么办。答案：转至下一年度，继续用于安全生产。"}, {"tag": null, "text": "结余的钱只能接着干安全的事，发奖金、搞市场开发、算利润，统统不行。安全钱，永远姓安。"}, {"tag": "第22题 · 多选", "text": "第二十二题，多选。考点：通信施工单位安全生产事故的报告要求。正确的是两条。"}, {"tag": null, "text": "事故现场有关人员应立即向本单位负责人报告；单位负责人接到报告后一小时内，向事故发生地应急管理部门和所在地省级通信管理局报告。"}, {"tag": null, "text": "错的三条：现场人员直接报政府部门，不对，先报单位；报企业所在地应急管理部门，不对，是事故发生地；两小时内报，不对，是一小时。通信行业多一条线：还要报省通信管理局。"}, {"tag": "第24题 · 单选", "text": "第三章第二十四题。考点：通信工程发生生产安全事故，谁接到报告后应当立即启动事故处理应急预案。答案：单位负责人。"}, {"tag": null, "text": "报告链条是现场人员报单位负责人，所以拿到报告的第一人——单位负责人，立刻启动应急预案。口诀：谁接报，谁启动。"}, {"tag": "第25题 · 单选", "text": "第二十五题，情景题。吊绳断裂信号塔倒塌，两死五伤，法定代表人接到报告后，正确的行动是什么。答案：立即启动应急预案，抢救受伤人员。"}, {"tag": null, "text": "错的三项都是反面教材：拖一个半小时才报告是迟报；统一口径减轻公司责任是往谎报上走；只有先救人是唯一正解。第一动作永远是救人。"}, {"tag": "第26题 · 单选", "text": "第二十六题。考点：对通信建设相关企业安管人员实施安全监督管理的部门，不包括哪个。答案：公安机关。"}, {"tag": null, "text": "工业和信息化部、通信管理局、应急管理部都管得着；公安机关管治安和交通，不管通信工程安管人员。"}, {"tag": "第27题 · 判断", "text": "第二十七题，判断题。知识点：通信管理局负责本行政区域内通信建设工程安全生产的监督管理工作。对照题目，说法正确。"}, {"tag": null, "text": "记住这条线：通信工程的安全监管，归通信管理局。送分题。"}, {"tag": "第28题 · 单选", "text": "第二十八题。考点：行政监督部门检查时，施工单位有权拒绝的行为是什么。答案：要求被检查单位停工接受检查。"}, {"tag": null, "text": "监督检查不得影响正常生产经营，这是老规矩了。提供资料、进现场拍照录像、责令限期改正，这些都必须配合；只有借检查让人停工的，可以拒绝。"}, {"tag": "第29题 · 多选", "text": "第二十九题，多选。考点：通信行政监督部门责令限期改正或予以通报的行为。正确的是三条。"}, {"tag": null, "text": "不配合监督检查和事故调查处理的；发生事故未及时上报或调查处理不力的；两年未对从业人员进行一次安全生产教育培训的。"}, {"tag": null, "text": "错的两条：预案不满足要求是责令修订；资金投入不足是责令整改保证投入，都不到通报的级别。"}, {"tag": "第30题 · 单选", "text": "第三十题。考点：三类人里的企业主要负责人包括谁、不包括谁。不包括的是：企业高级注册安全工程师。"}, {"tag": null, "text": "企业主要负责人包括：法定代表人、分管生产经营的副总经理、企业技术负责人。高级注册安全工程师是专业技术人员，不是主要负责人。"}, {"tag": "第31题 · 多选", "text": "第三十一题，多选。考点：应参加通信工程 A 类安管人员考核的有谁。正确的是四条。"}, {"tag": null, "text": "企业总经理、法定代表人、分管生产经营的副总经理、企业技术负责人。"}, {"tag": null, "text": "A 类就是企业主要负责人证，跟第三十题连着记。错的是项目负责人——那是 B 类证。口诀：A 类管企业，B 类管项目，C 类专职安全员。"}, {"tag": "第32题 · 判断", "text": "第三十二题，判断题。知识点：项目负责人，是指由企业法定代表人授权，负责具体通信建设工程项目管理的人员。对照题目，说法正确。"}, {"tag": null, "text": "项目负责人的两个要素：法代授权，管具体项目。判断为对。"}, {"tag": "第33题 · 单选", "text": "第三十三题。考点：三类安管人员的表述，正确的说法是什么。答案：企业安全生产管理机构的人员，也可通过考试成为专职安全生产管理人员。"}, {"tag": null, "text": "错的三项：负责人分配任务就是项目负责人，错，要法代授权加执业资格；只有现场专职才算专职安全员，太绝对；企业主要负责人不包括技术负责人，错，包括。"}, {"tag": "第34题 · 多选", "text": "第三十四题，多选。考点：企业的专职安全生产管理人员包括哪些。正确的是两条。"}, {"tag": null, "text": "企业安全生产管理机构的专职人员；工程项目专职从事安全生产管理工作的人员。"}, {"tag": null, "text": "错的三条：工程项目管理部门负责人、项目负责人、班组巡查人员，都不属于专职安全管理人员。记法：机构里的和工地上的，两个来源。"}, {"tag": "第35题 · 单选", "text": "第三十五题，情景题。技术负责人申请 A 证考核，哪个基本条件不符合要求。答案：从事通信工程建设管理工作 2 年 10 个月。"}, {"tag": null, "text": "申请考核要求相关工作经历满三年，两年零十个月差两个月，不够。年龄五十九、本科学历、曾被罚款都不影响申请资格。记住：三年门槛。"}, {"tag": "第36题 · 单选", "text": "第三十六题。考点：通信施工企业安全生产管理人员的考核内容包括安全生产知识和什么。答案：安全生产管理能力。"}, {"tag": null, "text": "又是老朋友：一知识，一能力。跟第一章主要负责人那条一模一样。"}, {"tag": "第37题 · 单选", "text": "第三十七题。考点：安全生产考核合格证书，正确的表述是什么。答案：有效期为三年，不办理证书延续的，证书自动失效。"}, {"tag": null, "text": "证书三件事一起记：有效期三年；全国范围内有效；到期要办延续，不办就自动失效。"}, {"tag": "第38题 · 单选（选错误项）", "text": "第三十八题，选错误的表述。答案：到期后参加继续教育学习、测试合格后自动延期。"}, {"tag": null, "text": "为什么错？延续不是自动的，要本人申请、通信管理局批准。继续教育是条件，不是免办金牌。"}, {"tag": "第39题 · 单选", "text": "第三十九题。考点：证书延续的正确说法。答案：符合延续条件的，经通信管理局批准后，有效期延续三年。"}, {"tag": null, "text": "配套细节：应当在有效期届满前，通过信息系统向发证的通信管理局申请。批准一次延三年，没有长期有效这种事。"}, {"tag": "第40题 · 单选", "text": "第四十题。考点：安管人员职位变动需要变更证书类别的，重新考核取得新证后，原类别证书怎么处理。答案：注销。"}, {"tag": null, "text": "一人一证一类别，换了类别，旧证注销。不是暂停，不是作废留着。"}, {"tag": "第41题 · 单选", "text": "第四十一题。考点：通信主管部门实施监督检查，应当至少有几名以上监督检查人员参加。答案：两名。"}, {"tag": null, "text": "执法检查至少两人，一个人不能查。而且不得妨碍企业正常经营、不得索取收受财物。"}, {"tag": "第42题 · 单选（选错误项）", "text": "第四十二题，选错误的表述。答案：应当有两个单位以上的监督检查人员参加。"}, {"tag": null, "text": "偷换概念：是两名人员，不是两个单位。别的三项都对：有权考核监督检查安管人员、不得妨碍经营、出事故有权暂扣撤销证书。"}, {"tag": "第43题 · 单选", "text": "第四十三题。考点：企业安全生产管理机构专职安全员的职责，不包括什么。答案：查封不符合安全生产条件的设施、设备、器材。"}, {"tag": null, "text": "查阅资料、检查方案落实、监督防护用品使用，都是安全员的活；查封是行政执法手段，企业内部安全员没有这个权。"}, {"tag": "第44题 · 单选（选错误项）", "text": "第四十四题，选错误的说法。答案：监督检查企业专职安全生产管理人员的履责情况。"}, {"tag": null, "text": "专职安全员是执行层，监督检查别的安全员履责，那是企业安全管理部门或者上级的事。自己不查自己人。"}, {"tag": "第45题 · 单选", "text": "第四十五题。考点：建筑施工企业应当实行建设工程项目专职安全生产管理人员的什么制度。答案：委派制度。"}, {"tag": null, "text": "项目专职安全员由企业委派到项目上，定期向企业安全机构报告。委派两个字，保证安全员说话有底气。"}, {"tag": "第46题 · 判断", "text": "第四十六题，判断题。题目说：工程项目专职安全生产管理人员应由项目负责人现场指定。"}, {"tag": null, "text": "错。专职安全员是企业委派的，不是项目负责人现场随手指定的。要是项目经理自己指派安全员，安全员还怎么监督项目经理？"}, {"tag": "第47题 · 单选", "text": "第四十七题。考点：建筑施工企业应当在建设工程项目组建什么。答案：安全生产领导小组。"}, {"tag": null, "text": "项目上建的是小组，不是委员会。口诀：企业设机构，项目建小组。"}, {"tag": "第48题 · 单选", "text": "第四十八题。考点：总承包、专业承包和劳务分包企业里，谁不应参加通信工程项目安全生产领导小组。答案：现场兼职安全巡视员。"}, {"tag": null, "text": "进领导小组的是：项目经理、技术负责人、专职安全生产管理人员。兼职巡视员级别不够。"}, {"tag": "第49题 · 单选", "text": "第四十九题，换角度再考一遍：不应参加项目安全生产领导小组的应该是哪一方的人员。答案：建设单位。"}, {"tag": null, "text": "领导小组是施工侧的：总包、专业承包、劳务分包三家都有份；建设单位是业主，不进施工安全小组。"}, {"tag": "第50题 · 多选", "text": "第五十题，多选。考点：实行总承包的工程，安全管理领导小组的成员包括总包、专业承包和分包单位的哪些人。正确的是三条。"}, {"tag": null, "text": "项目经理、技术负责人、安全员。"}, {"tag": null, "text": "错的是施工员和质量员。口诀：经理、技术、安全员，三人进组。"}, {"tag": "第51题 · 单选", "text": "第五十一题。考点：对施工现场安全生产负有日常检查并做好记录职责的是谁。答案：项目专职安全生产管理人员。"}, {"tag": null, "text": "天天在工地巡检、做记录的，就是项目专职安全员。日常检查四个字对应专职安全员。"}, {"tag": "第52题 · 单选", "text": "第五十二题，情景题。你是项目安全员，发现工人违规切割作业，首先应该做什么。答案：立即制止。"}, {"tag": null, "text": "危险正在发生，第一动作是叫停，不是先报告、不是先监督、不是先清理可燃物。制止在先，其他在后。"}, {"tag": "第53题 · 单选", "text": "第五十三题。考点：建筑工程项目配备专职安全生产管理人员的数量线。答案：一名。"}, {"tag": null, "text": "建筑工程按合同额配安全员：五千万元以下的工程，至少一名。下面几题把各档金额一次讲全。"}, {"tag": "第54题 · 单选", "text": "第五十四题。考点：四千万元的设备安装工程项目，专职安全生产管理人员不应少于几人。答案：一人。"}, {"tag": null, "text": "安装工程一千万到五千万的档次，配一人。"}, {"tag": "第55题 · 单选", "text": "第五十五题。考点：线路、管道、设备安装工程安全员配备，正确的是哪条。答案：合同额四千五百万元的工程，应配置不少于一人。"}, {"tag": null, "text": "线路安装类的配员线：五千万元以下一人；五千万到一亿两人；一亿以上三人。所以四千五百万配一人是对的；六千万配一人就不够了。"}, {"tag": "第56题 · 单选", "text": "第三章第五十六题。考点：合同价六千万元的线路工程，专职安全员不少于几人。答案：两人。"}, {"tag": null, "text": "线路安装类的配员线：五千万元以下一人；五千万到一亿两人；一亿以上三人。六千万落在第二档，配两人。"}, {"tag": "第57题 · 单选", "text": "第五十七题。考点：设备安装合同六千万，总承包单位至少配几名专职安全员。答案：两人。"}, {"tag": null, "text": "跟上一题同一条线：五千万到一亿的安装工程配两人。这几题连起来就是把金额表背熟：五千、一亿，两个坎。"}, {"tag": "第58题 · 单选", "text": "第五十八题。考点：劳务分包单位现场作业人员三十人，应当配备几名专职安全生产管理人员。答案：一人。"}, {"tag": null, "text": "劳务分包的线是按人数：五十人以下配一人；五十到二百人配两人；二百人以上三人，并且配备比例还得随人数增加。三十人，一人。"}, {"tag": "第59题 · 单选", "text": "第五十九题。考点：取得建筑施工企业安全生产许可证的条件，正确的是哪条。答案：制定完备的安全生产规章制度和操作规程。"}, {"tag": null, "text": "错的三项：配兼职安全员，错，要专职；各分部分项工程有应急预案，不是许可条件；管理人员每年至少两次培训，错，是一次。"}, {"tag": "第六十题 · 多选", "text": "第六十题，多选。考点：取得安全生产许可证应当具备的条件。正确的是四条。"}, {"tag": null, "text": "制定完备的安全生产规章制度和操作规程；保证本单位安全生产条件所需资金的投入；管理人员和作业人员每年至少进行一次安全生产教育培训并考核合格；按照国家有关规定配备专职安全生产管理人员。"}, {"tag": null, "text": "错的是为所有作业人员办理意外伤害保险，许可证条件里没有这条。口诀：制度、资金、培训、专职。"}, {"tag": "第61题 · 单选", "text": "第六十一题。考点：建筑施工企业安全生产许可证有效期是几年。答案：三年。"}, {"tag": null, "text": "又是三年：安管证书三年，安全生产许可证也是三年。三年一换，行业惯例。"}, {"tag": "第62题 · 单选", "text": "第六十二题。考点：企业变更法定代表人，多少日内到发证机关办理安全生产许可证变更手续。答案：十日内。"}, {"tag": null, "text": "换老板，十天之内要办变更。十个数字记牢。"}, {"tag": "第63题 · 多选", "text": "第六十三题，多选。考点：哪些情形可以撤销已经颁发的安全生产许可证。正确的是四条。"}, {"tag": null, "text": "发证机关工作人员滥用职权颁发的；超越法定职权颁发的；违反法定程序颁发的；对不具备安全生产条件的建筑企业颁发许可证的。"}, {"tag": null, "text": "共同点：证发得不合法，就要撤回。错的第一项规范标准，是个凑数的词，不是情形。"}, {"tag": "第64题 · 单选", "text": "第六十四题。考点：哪种违法行为应当吊销安全生产许可证。答案：不再具备安全生产条件，情节严重的。"}, {"tag": null, "text": "区分三个层级：未取证就施工，是取缔加罚款；到期没办延期继续干，责令停工补办；拿到证之后条件恶化还情节严重，才到吊销这一步。吊销是最重的。"}, {"tag": "第65题 · 多选", "text": "第六十五题，多选，选错误的做法。某单位不具备安全生产条件，错误的做法有哪些。正确答案是四条错误做法。"}, {"tag": null, "text": "错的四条：借别的有资质单位的资质生产；认为有许可证就继续干；经主管部门批准后继续干；这些都不行。唯一正确的做法是：在具备安全生产条件之前，不从事生产经营活动。"}, {"tag": null, "text": "核心原则一句话：条件不具备，就别开工。借资质、找批准、硬着头皮干，全是违法。"}, {"tag": "第66题 · 判断", "text": "第六十六题，判断题。题目说：生产经营单位技术负责人负责组织编制和实施本单位的应急预案。"}, {"tag": null, "text": "错。组织编制和实施应急预案的是主要负责人，并对预案的真实性、实用性负责。技术负责人不背这个锅。"}, {"tag": "第67题 · 单选", "text": "第六十七题。同一知识点换填空：谁负责组织编制和实施本单位的应急预案。答案：主要负责人。"}, {"tag": null, "text": "一把手管预案，跟一把手管安全一个逻辑。跟上一题正反着记。"}, {"tag": "第68题 · 多选", "text": "第六十八题，多选。考点：生产经营单位的应急预案分为哪几类。正确的是三条。"}, {"tag": null, "text": "综合应急预案；专项应急预案；现场处置方案。"}, {"tag": null, "text": "错的是临时处置方案和部门应急预案，都是编的。三级体系记法：综合管全局、专项管某类事故、现场处置管具体岗位。"}, {"tag": "第69题 · 多选", "text": "第六十九题，多选。考点：编制应急预案前，应当做什么。正确的是三条。"}, {"tag": null, "text": "事故风险辨识；事故风险评估；应急资源调查。"}, {"tag": null, "text": "错的是预案评审和预案演练，那是编制之后的事。编制前先摸家底：有什么风险、有什么资源。"}, {"tag": "第70题 · 单选", "text": "第七十题。考点：风险种类多、可能发生多种类型事故的，应当组织编制什么预案。答案：综合应急预案。"}, {"tag": null, "text": "风险又多又杂，就写一本总账，综合预案。口诀：种类多，上综合。"}, {"tag": "第71题 · 单选", "text": "第七十一题。同一考点换序再考：风险种类多、可能发生多种类型事故的，应当编制什么。答案还是综合应急预案。第二遍了，肯定记住了。"}, {"tag": "第72题 · 单选", "text": "第七十二题。考点：综合应急预案应当规定的内容，不包括哪个。答案：事故等级描述。"}, {"tag": null, "text": "综合预案规定的是应急指挥机构与职责、事故风险描述、应急预案体系这些全局内容；具体事故等级怎么定，不是预案里写的事。"}, {"tag": "第73题 · 单选", "text": "第七十三题。考点：对于某一种类型的事故风险，可以编制什么。答案：专项应急预案。"}, {"tag": null, "text": "盯住某一类事故的，写专项。比如专门针对人井中毒写一份，就是专项预案。"}, {"tag": "第74题 · 单选", "text": "第七十四题。考点：对危险性较大的场所、装置和设施，应当编制什么。答案：现场处置方案。"}, {"tag": null, "text": "具体的点上的风险，写现场处置方案，一页纸讲清楚谁干什么。口诀：综合管面，专项管线，现场处置管点。"}, {"tag": "第75题 · 单选", "text": "第七十五题。同一考点换个说法：对危险性较大的场所、装置和设施，应当编制什么。答案还是现场处置方案。"}, {"tag": "第76题 · 单选", "text": "第七十六题。考点：事故风险单一、危险性小的施工单位，可以只编制什么。答案：现场处置方案。"}, {"tag": null, "text": "小单位风险单一，综合和专项都可以不写，只写现场处置方案。这是给小微企业减负的条款。"}, {"tag": "第77题 · 单选", "text": "第七十七题。考点：应急预案应该由谁负责签发实施。答案：企业主要负责人。"}, {"tag": null, "text": "又是主要负责人。编是他、签是他、实施还是他，预案从头到尾都是一把手的事。"}, {"tag": "第78题 · 单选", "text": "第七十八题。考点：建筑施工单位应当至少多久组织一次应急预案演练。答案：每半年一次。"}, {"tag": null, "text": "高危单位半年练一次，这个数字第二章考过，这里是第三遍出现了。"}, {"tag": "第79题 · 单选", "text": "第七十九题。考点：通信工程人井作业，施工单位制订针对性现场应急救援预案、配备救援用品后，每隔多久组织作业人员演练一次。答案：半年。"}, {"tag": null, "text": "人井作业是通信行业的头号杀手，预案加装备加半年一演练，三件套。"}, {"tag": "第80题 · 单选", "text": "第八十题。考点：行政行为性质的区分。建设行政主管部门责令停止施工，这属于什么。答案：行政处罚。"}, {"tag": null, "text": "区分四个词：行政机关罚企业，是行政处罚；行政机关内部罚工作人员，是行政处分；法院裁纠纷，是行政裁决之前的事；强制执行是另一环节。对企业罚的，就是行政处罚。"}, {"tag": "第八十一题 · 单选", "text": "第八十一题。考点：收到行政处罚告知书之日起几日内，可以进行陈述申辩或要求听证。答案：三日。"}, {"tag": null, "text": "被罚不是只能认：三天内可以申辩、可以要求听证，逾期视为放弃。记住三天。"}, {"tag": "第82题 · 单选", "text": "第八十二题。考点：行政处罚决定书的送达，正确的说法是什么。答案：送达必须有送达回执。"}, {"tag": null, "text": "错的三项：必须当场交付，不对，可以其他方式；拒收就送达失败，不对，拒收也可以留置送达；电话传达，更不行。回执才是送达的凭证。"}, {"tag": "第83题 · 单选", "text": "第八十三题，情景题。事故发生后负责人赶到现场组织救援，但过了九十分钟才向省级通信管理局报告，涉嫌什么违法行为。答案：迟报行为。"}, {"tag": null, "text": "报告了，但超过一小时的规定时限，属于迟报。注意他没有谎报瞒报，就是慢了。"}, {"tag": "第84题 · 单选", "text": "第八十四题。考点：因过失对应当上报的事故内容遗漏未报的，属于什么。答案：漏报行为。"}, {"tag": null, "text": "关键词是过失：不是故意的，是漏了。口诀区分：慢了是迟报，漏了是漏报。"}, {"tag": "第85题 · 单选", "text": "第八十五题。考点：报告事故时故意不如实报告时间、地点、伤亡人数等内容的，属于什么。答案：谎报行为。"}, {"tag": null, "text": "关键词是故意不如实：明明知道却说了假话，是谎报。四个词排排队：慢了迟报、漏了漏报、编假话谎报、藏着不报瞒报。"}, {"tag": "第86题 · 单选", "text": "第八十六题。考点：对重大事故的单位和个人罚款，事故发生地与单位不在同一省的，由谁决定处罚。答案：事故发生地省级人民政府安全生产监督管理部门。"}, {"tag": null, "text": "原则：事故发生在哪，就由哪里的省级安监部门决定罚款。属地管辖。"}, {"tag": "第87题 · 单选", "text": "第八十七题。考点：主要负责人在事故调查处理期间擅离职守的，处上一年年收入百分之多少的罚款。答案：百分之八十至百分之一百。"}, {"tag": null, "text": "事故调查期间跑路，性质恶劣，罚年收入八成到全部。配合你第一章记的档位：那是未履职导致事故的罚款，这里是调查期间脱岗，单独一档。"}, {"tag": "第88题 · 单选", "text": "第八十八题，情景压轴题。监管部门在网络直播里看到事故抢救现场，核实该企业还没报告，对该事故发生单位主要负责人处上一年年收入百分之多少的罚款。答案：百分之一百。"}, {"tag": null, "text": "事故都上直播了还只字未报，顶格罚：年收入全部罚掉。第三章到这里全部讲完，这一章的三大考点：各方责任、三类人考核、预案三级体系，加上那堆数字，你听完这遍就去刷精讲页。"}];
const synth = window.speechSynthesis;
let cur = -1, playing = false, pass = 1, voice = null;
const starts = SEGS.map((s, i) => s.tag ? i : -1).filter(i => i >= 0);
const list = document.getElementById('list');

SEGS.forEach((s, i) => {
  if (s.tag) { const t = document.createElement('div'); t.className = 'tag'; t.textContent = s.tag; list.appendChild(t); }
  const d = document.createElement('div'); d.className = 'line'; d.textContent = s.text;
  d.onclick = () => { pass = 1; start(i); }; list.appendChild(d); s.el = d;
});

function pickVoice() {
  const vs = synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('zh'));
  voice = vs.find(v => /婷婷|Tingting|晓晓|Xiaoxiao|辉辉|Huihui|Yaoyao/.test(v.name)) || vs[0] || null;
}
pickVoice();
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = pickVoice;

function qStart(i) { let r = 0; for (const s of starts) { if (s <= i) r = s; else break; } return r; }
function qEnd(i) { for (const s of starts) { if (s > i) return s - 1; } return SEGS.length - 1; }

function start(i) {
  synth.cancel();
  if (i >= SEGS.length) { done(); return; }
  if (i < 0) i = 0;
  cur = i;
  document.querySelectorAll('.line').forEach((el, k) => {
    el.classList.toggle('now', k === cur);
    el.classList.toggle('done', k < cur);
  });
  SEGS[cur].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  document.getElementById('status').textContent = (pass === 2 ? '第2遍 · ' : '') + `第 ${cur + 1}/${SEGS.length} 句`;
  const u = new SpeechSynthesisUtterance(SEGS[cur].text);
  u.lang = 'zh-CN';
  if (voice) u.voice = voice;
  u.rate = parseFloat(document.getElementById('rate').value);
  u.onend = () => {
    if (!playing) return;
    if (cur < qEnd(cur)) { pass = pass; start(cur + 1); }
    else if (document.getElementById('mem').checked && pass === 1) { pass = 2; start(qStart(cur)); }
    else { pass = 1; const n = qEnd(cur) + 1; if (n < SEGS.length) start(n); else done(); }
  };
  synth.speak(u);
  playing = true; setBtn();
}
function done() { playing = false; setBtn(); document.getElementById('status').textContent = '✅ 讲完啦'; }
function setBtn() { document.getElementById('toggle').textContent = playing ? '⏸ 暂停' : '▶ 播放'; }
document.getElementById('toggle').onclick = () => {
  if (cur === -1) { start(0); return; }
  if (playing) { synth.pause(); playing = false; setBtn(); }
  else if (synth.paused && synth.speaking) { synth.resume(); playing = true; setBtn(); }
  else { playing = true; start(cur); }
};
document.getElementById('prev').onclick = () => { pass = 1; const p = qStart(Math.max(cur - 1, 0)); start(p === cur ? 0 : p); };
document.getElementById('next').onclick = () => { pass = 1; const n = starts.find(s => s > cur); start(n === undefined ? SEGS.length : n); };
document.getElementById('rate').onchange = () => { if (cur >= 0) { const c = cur; start(c); } };
</script>
