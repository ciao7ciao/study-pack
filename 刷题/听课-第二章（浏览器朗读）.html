<script>
const SEGS = [{"tag": "第1题 · 单选", "text": "第二章第一题。考点：建设工程安全生产管理条例里，建设工程指什么、不包括什么。答案：不包括园林绿化工程。"}, {"tag": null, "text": "条例管的是土木建筑、线路管道、设备安装这些工程。园林绿化不在内，口诀：种树的不归条例管。"}, {"tag": "第2题 · 多选", "text": "第二章第二题，多选。建设工程是指哪些。正确的是四条：土木工程；线路管道工程；设备安装工程；装修工程。"}, {"tag": null, "text": "错的是软件开发工程，凑数的。跟上一题连着记：条例管建楼的、铺管的、装设备的、搞装修的。"}, {"tag": "第3题 · 多选", "text": "第三题，多选。考点：建设单位要向施工单位提供施工现场及毗邻区域的哪些资料。正确的是四条。"}, {"tag": null, "text": "地下管线资料；气象和水文资料；相邻建筑物资料；地下工程资料。"}, {"tag": null, "text": "错的是运输保障资料。记法：地上地下、天气水情、左邻右舍，都要交代清楚。挖断电缆的事故，根子常在这。"}, {"tag": "第4题 · 单选", "text": "第四题。考点：安全作业环境及安全施工措施费用，在编制什么时确定。答案：概算。"}, {"tag": null, "text": "概算、预算、结算、决算四个词里选概算。钱在项目最开头就要定下来，越往后越不是做加法的时候。"}, {"tag": "第5题 · 单选（选错误项）", "text": "第五题，选建设单位安全责任的错误说法。答案：建设单位应当进行安全施工技术交底。"}, {"tag": null, "text": "为什么错？技术交底是施工单位的事：项目技术负责人向作业人员交底。建设单位的活是：提供真实完整的地下管线资料、不压缩合同工期、拆除工程备案。分工别乱。"}, {"tag": "第6题 · 单选", "text": "第六题。考点：设计单位要对涉及施工安全的什么在设计文件中注明。答案：重点部位和环节。"}, {"tag": null, "text": "不是所有危险有害因素，也不是关键特殊过程。设计院点的是重点部位，防范事故给指导意见。"}, {"tag": "第7题 · 多选", "text": "第七题，多选。考点：设计单位的安全责任。正确的是两条：按照法律法规和工程建设强制性标准进行设计；提出防范安全生产事故的指导意见和措施建议。"}, {"tag": null, "text": "错的三条都是别人的活：审查专项施工方案、处理事故隐患是监理和施工单位的，设计单位不下场施工。"}, {"tag": "第8题 · 多选", "text": "第八题，多选。还是设计单位的安全责任。正确的是三条。"}, {"tag": null, "text": "一，对涉及施工安全的重点部位和环节在设计文件中注明，并提防范事故的指导意见；二，采用新结构、新材料、新工艺时，提出保障施工人员安全和预防事故的措施建议。"}, {"tag": null, "text": "错的是：要求施工单位整改、审查专项施工方案，这些是监理单位的活。记法：设计管图纸，监理管现场。"}, {"tag": "第9题 · 多选", "text": "第九题，多选。考点：为防止因设计不合理导致事故，设计单位应做到什么。正确的是三条。"}, {"tag": null, "text": "注明涉及施工安全的重点部位和环节；提出保障施工作业人员安全的措施建议；提出预防生产安全事故的措施建议。"}, {"tag": null, "text": "错的是全额列出警示标志费用，那是造价的事。口诀：标重点、保人员、防事故。"}, {"tag": "第10题 · 单选", "text": "第十题。考点：谁应当审查施工组织设计中的安全技术措施或专项施工方案是否符合工程建设强制性标准。答案：监理单位。"}, {"tag": null, "text": "应急管理部门不审图纸，勘察设计不审方案。审方案是监理的看家活，下一题连着考。"}, {"tag": "第11题 · 单选", "text": "第十一题。考点：监理审查方案，符合什么标准。答案：工程建设强制性标准。"}, {"tag": null, "text": "不是概算要求、不是监理规划。强制性标准四个字，是安全的底线，连接两题：监理按强制标准审方案。"}, {"tag": "第12题 · 单选", "text": "第十二题。考点：监理发现一般安全事故隐患怎么办。答案：要求进行现场整改。"}, {"tag": null, "text": "一般隐患不用停工，现场改掉就行。停工、上报是隐患严重时的动作，下一题接着分级。"}, {"tag": "第13题 · 单选", "text": "第十三题。考点：监理发现隐患情况严重的怎么办。答案：要求施工单位暂停施工，并及时报告建设单位；施工单位拒不整改或不停止施工的，及时向有关主管部门报告。"}, {"tag": null, "text": "三步走：严重隐患，先叫停；同时报建设单位；对方不听，捅到主管部门。口诀：叫停、报告、越级捅。"}, {"tag": "第14题 · 单选", "text": "第十四题。考点：出租机械设备，签租赁合同时应出具什么。答案：检测合格证明。"}, {"tag": null, "text": "不是购货发票、不是说明书。设备出租先证明它是检测合格的，安全账不看出身看出体检报告。"}, {"tag": "第15题 · 单选", "text": "第十五题。考点：施工单位承接新建、扩建、改建、拆除工程，要在什么许可范围内承揽。答案：资质等级。"}, {"tag": null, "text": "不是营业执照范围，是资质等级范围。有资质才能干对应等级的活，超等级承揽违规。"}, {"tag": "第16题 · 单选", "text": "第十六题。考点：施工单位的项目负责人应当由什么人员担任。答案：取得相应执业资格的人员。"}, {"tag": null, "text": "就是建造师这类执业资格。建设单位认可、安全员证、注册安全工程师都不是项目负责人法定门槛。"}, {"tag": "第17题 · 单选", "text": "第十七题，情景题。通信施工公司从总包那里分包了任务，出了事故，事故发生单位填谁。答案：总包单位。"}, {"tag": null, "text": "记法：对外口径，总包背名。虽然实际干活的是分包，但事故发生单位写总包，责任上总包分包连带，下一题细讲。"}, {"tag": "第18题 · 单选（选错误项）", "text": "第十八题，选总包分包说法错误的。答案：总承包单位可以将全部工程量分包给分包单位。"}, {"tag": null, "text": "错得离谱，这叫转包，法律禁止。正确关系是：分包合同明确各自安全权责；总包分包对分包工程安全负连带责任；分包不服从管理出事，分包担主责。"}, {"tag": "第19题 · 单选", "text": "第十九题。考点：基坑支护等危险性工程，专项施工方案经谁签字后实施。答案：施工单位技术负责人，加总监理工程师。"}, {"tag": null, "text": "两边签字：施工方技术负责人、监理方总监。现场监理、建设单位负责人都不够格。记法：方案双人签，技术加总监。"}, {"tag": "第20题 · 多选", "text": "第二十题，多选。专项施工方案应由谁签字后实施，并由谁现场监督。答案：施工单位技术负责人，加总监理工程师；现场监督由专职安全生产管理人员负责。"}, {"tag": null, "text": "跟上一题同源：签字是技术负责人加总监，盯现场的是专职安全员。三个角色别搞混。"}, {"tag": "第21题 · 单选", "text": "第二十一题。考点：哪些分部分项工程需要专项施工方案。不需要的是哪个。答案：砌筑工程。"}, {"tag": null, "text": "起重吊装、模板、拆除爆破这些危险活都要专项方案；砌墙风险低，不用。口诀：吊装模板拆爆要方案，砌墙不用。"}, {"tag": "第22题 · 单选", "text": "第二十二题。考点：施工前，谁应当对安全施工技术要求向作业班组、作业人员作出详细说明。答案：项目技术负责人。"}, {"tag": null, "text": "这就是安全技术交底，交底人是项目技术负责人，不是项目经理也不是安全员。记法：技术活，技术负责人讲。"}, {"tag": "第23题 · 单选", "text": "第二十三题，情景题。建设单位采购的主设备没到货，现场停工，防护费用谁承担。答案：建设单位，或者按合同约定。"}, {"tag": null, "text": "谁的原因停工，谁掏钱。设备是建设单位买的没到，停工防护费自然归建设单位出。"}, {"tag": "第24题 · 单选", "text": "第二十四题。考点：施工现场使用的装配式活动房屋应当具有什么。答案：产品合格证。"}, {"tag": null, "text": "工地住的活动板房，要有产品合格证。临时用房也有安全底线。"}, {"tag": "第25题 · 单选", "text": "第二十五题。考点：施工可能损害到的毗邻建筑物、构筑物和地下管线，应当采取什么措施。答案：专项保护措施。"}, {"tag": null, "text": "不是通用防护，是专项保护。邻着别人的楼、地下的管子施工，得量身定制保护方案。"}, {"tag": "第26题 · 判断", "text": "第二十六题，判断题。知识点：在城市市区内的建设工程，施工单位应当对施工现场实行封闭围挡。对照题目，说法正确。"}, {"tag": null, "text": "市区工地必须围起来，防止外人闯入。口诀：市区工地，围挡伺候。"}, {"tag": "第27题 · 多选", "text": "第二十七题，多选。考点：施工现场消防安全责任制度，可采取的措施。正确的是四条。"}, {"tag": null, "text": "确定消防安全责任人；制定用火用电、易燃易爆材料的管理制度和操作规程；设置消防通道、消防水源；配备消防设施和灭火器材。"}, {"tag": null, "text": "错的是在施工现场设置明显标志，太泛了，不在条例列举里。四件套记法：定责任人、定制度、通道路、配器材。"}, {"tag": "第28题 · 单选", "text": "第二十八题。考点：施工单位应当向作业人员提供什么，并书面告知危险岗位操作规程和违章操作危害。答案：安全防护用具和安全防护服装。"}, {"tag": null, "text": "发的是防护用具加防护服，不是劳保杂货也不是施工工具。注意后半句的关键词是书面告知，下一题考这个。"}, {"tag": "第29题 · 判断", "text": "第二十九题，判断题。题目说：施工单位应当提供防护用具和防护服装，并口头告知危险岗位操作规程和违章操作的危害。"}, {"tag": null, "text": "陷阱在口头两个字。法律要求书面告知。口头说了不算，出了事没法举证。所以这题错。前一道书面、这一道口头，一对照就清楚了。"}, {"tag": "第30题 · 多选", "text": "第三十题，多选。考点：施工作业人员在施工中应做到什么。正确的是三条。"}, {"tag": null, "text": "遵守安全施工的强制性标准；遵守规章制度和操作规程；正确使用安全防护用具。"}, {"tag": null, "text": "错的是听从现场管理人员的一切指挥，一切两个字太绝对，违章指挥不用听；有危及人身安全情况立即停止作业也不在本题列举。记住老规矩：凡说一切、必须，多半是坑。"}, {"tag": "第31题 · 判断", "text": "第三十一题，判断题。知识点：施工单位采购租赁的安全防护用具、机械设备、施工机具及配件，应当具有生产许可证、产品合格证，并在进入施工现场前进行查验。"}, {"tag": null, "text": "对照题目：题目说的是进入施工现场后进行查验。错了，一字之差：是进场之前查验，不合格的根本不让进门。"}, {"tag": "第32题 · 单选", "text": "第三十二题。考点：现场的安全防护用具、机械设备、施工机具及配件必须怎样管理，定期检查维修保养，建立资料档案，及时报废。答案：由专人管理。"}, {"tag": null, "text": "不是多人重点管理，也不是统一锁库房。专人管、定期养、有档案、到期换，四步。"}, {"tag": "第33题 · 多选", "text": "第三十三题，多选。考点：使用承租的机械设备和施工机具及配件，由谁共同进行验收。正确的是四条。"}, {"tag": null, "text": "施工总承包单位；分包单位；出租单位；安装单位。"}, {"tag": null, "text": "错的是建设单位。验收是使用方和供给方的事，业主不参与。记法：租的设备四方验，总包分包出租加安装。"}, {"tag": "第34题 · 单选", "text": "第二章第三十四题。考点：施工单位对管理人员和作业人员，每年至少进行几次安全教育培训。答案：一次。口诀：安全教育，年检一次起步。"}, {"tag": "第35题 · 多选", "text": "第三十五题，多选。考点：安全教育培训的正确说法。正确的是三条。"}, {"tag": null, "text": "施工单位主要负责人、项目负责人、专职安全生产管理人员，应当经建设行政主管部门或其他部门考核合格后方可任职；作业人员进入新的岗位前，应当接受安全生产教育培训；采用新技术、新工艺、新设备的，要对从业人员进行相应培训。"}, {"tag": null, "text": "错的两条：每两年至少一次，错，是每年至少一次；进入新施工现场前不需要培训，也错，新工地同样要先培训。记法：三类人考核上岗，换岗新岗新工都要训。"}, {"tag": "第36题 · 单选", "text": "第三十六题。考点：意外伤害保险。正确的是：实行施工总承包的，由施工总承包单位支付保险费。"}, {"tag": null, "text": "错的三项：不是给全体施工人员买，是从事危险作业的人员；不是建设单位付钱，是施工单位；保险期限是自开工之日起至竣工验收合格之日止，没有开工后七日才生效的说法。"}, {"tag": "第37题 · 判断", "text": "第三十七题，判断题。知识点：建设行政主管部门或者其他有关部门，可以将施工现场的监督检查委托给建设工程安全监督机构具体实施。对照题目，说法正确。"}, {"tag": null, "text": "主管部门可以委托安全监督机构干活，这是允许的。判断为对。"}, {"tag": "第38题 · 单选", "text": "第三十八题。考点：国家对严重危及施工安全的工艺、设备、材料实行什么制度。答案：淘汰制度。"}, {"tag": null, "text": "不是维修、监管、备案。危及安全的工艺设备材料，国家直接淘汰出局，下一题考谁公布目录。"}, {"tag": "第39题 · 单选", "text": "第三十九题。考点：淘汰目录由谁制定并公布。答案：国务院建设行政主管部门，会同国务院其他有关部门。"}, {"tag": null, "text": "牵头的是建设行政主管部门，不是安委会、不是发改委。记法：管建设的牵头定淘汰名单。"}, {"tag": "第40题 · 单选（选错误项）", "text": "第四十题，选对施工单位应急救援准备的错误要求。答案：施工单位必须建立本单位的应急救援组织。"}, {"tag": null, "text": "为什么错？回想第一章的知识点：规模较小的施工单位可以不建立应急救援组织，但应当指定兼职的应急救援人员。必须二字太绝对。预案、器材、定期演练，这三样才是必须的。"}, {"tag": "第41题 · 单选", "text": "第四十一题。考点：实行总承包的工程，涉及分包工程的施工现场应急救援预案由谁编制。答案：总包单位。"}, {"tag": null, "text": "预案也归总包统一编制，分包不出预案出人配合。记法：总包一盘棋，预案也是。"}, {"tag": "第42题 · 单选", "text": "第四十二题。考点：作业中特种设备发生事故，除了报安监、建设行政部门，还应当向谁报告。答案：特种设备安全监督管理部门。"}, {"tag": null, "text": "特种设备出事，多报一家：管特种设备的部门。三头报告：安监、建设行政、特种设备监管。"}, {"tag": "第43题 · 单选", "text": "第四十三题，情景题。微控定向钻孔设备发生事故，向谁报告。答案：安全生产监督管理部门、建设行政管理部门。"}, {"tag": null, "text": "注意区别：钻孔设备不是特种设备，所以不用报特种设备监管部门。是不是特种设备，决定了要不要多报一家。"}, {"tag": "第44题 · 多选", "text": "第四十四题，多选。同一情景换多选：应向谁报告。答案：安全生产监督管理部门，加建设行政管理部门。"}, {"tag": null, "text": "跟上一题同一个知识点：普通设备事故报这两家，不含特种设备监管部门。连做三题，这个考点稳了。"}, {"tag": "第45题 · 单选", "text": "第四十五题。考点：总承包工程里，分包单位发生安全事故，由谁负责上报。答案：分包单位。"}, {"tag": null, "text": "有点意外吧？事故报告是分包单位自己报，不必等总包替它报。记法：谁出事谁上报，总包负连带责任是另一回事。"}, {"tag": "第46题 · 单选", "text": "第四十六题。考点：注册执业人员未执行法律法规和强制性标准，情节一般的处罚。答案：责令停止执业三个月以上一年以下。"}, {"tag": null, "text": "处罚阶梯：情节一般，停业三个月到一年；情节严重的，吊销证书五年内不予注册；造成重大事故的才终身不予注册。记法：停三个月到一年，吊证五年，重大终身。"}, {"tag": "第47题 · 单选", "text": "第四十七题。考点：施工现场未按规定设置消防水源，责令限期改正，逾期未改的怎么处理。答案：责令停业整顿，再依照安全生产法罚款。"}, {"tag": null, "text": "先给机会改正，不改就停业整顿加罚款。处罚也是讲先礼后兵的。"}, {"tag": "第48题 · 单选", "text": "第四十八题。考点：市区施工现场未实行封闭围挡，施工单位可能承担什么法律责任。答案：责令施工企业限期改正。"}, {"tag": null, "text": "围挡没围起来，第一步是限期改正，不直接罚款、不吊照。又是先礼后兵的套路。"}, {"tag": "第49题 · 单选", "text": "第四十九题。考点：防护用具机械设备未经查验或不合格就投入使用，情节严重的，降低资质等级直至什么。答案：吊销资质证书。"}, {"tag": null, "text": "不是吊销营业执照。施工领域的顶格行政罚是吊资质，不是吊执照。"}, {"tag": "第50题 · 单选", "text": "第五十题。考点：施工组织设计未编制安全技术措施、临时用电方案或专项施工方案，造成损失的，依法承担什么责任。答案：赔偿责任。"}, {"tag": null, "text": "造成损失，先赔钱。行政、刑事是另案处理的事，本题问的是民事上的赔偿。"}, {"tag": "第51题 · 多选", "text": "第五十一题，多选。考点：符合工程安全不良行为认定标准的有哪些。正确的是四条。"}, {"tag": null, "text": "起重机械、整体提升脚手架、模板等自升式架设设施验收合格后未按规定登记的；在尚未竣工的建筑物内设置员工集体宿舍的；未对毗邻建筑物地下管线采取专项预防措施的；使用未经验收或验收不合格的上述设施的。"}, {"tag": null, "text": "错的是未按节能要求施工，那是节能问题不是安全不良行为。特别记一条：未竣工的楼里不能设员工集体宿舍，火灾大忌。"}, {"tag": "第52题 · 单选", "text": "第五十二题。考点：什么情况应当及时修订应急预案。答案：应急指挥机构的职责发生了调整。"}, {"tag": null, "text": "错的三项都有任何、有些人这种模糊词：风险发生任何变化、资源发生任何变化、演练时有人不认真，都不是法定修订情形。组织架构变了，预案必须跟着改。"}, {"tag": "第53题 · 单选", "text": "第五十三题。考点：建筑施工单位应当至少多久组织一次应急救援预案演练，并报送县级以上安监部门。答案：每半年一次。"}, {"tag": null, "text": "易出事单位半年练一回。对比记：一般单位一年一次，建筑这种高危单位每半年一次。"}, {"tag": "第54题 · 单选（选错误项）", "text": "第五十四题，选事故后应急救援措施错误的。答案：迅速远离危险源。"}, {"tag": null, "text": "为什么错？事故发生后单位的义务是主动处置：组织抢救遇险人员、通知可能受影响的单位、维护现场秩序。自己先跑不算应急救援。"}, {"tag": "第55题 · 单选", "text": "第五十五题。考点：事故分级。重大事故是指：十人以上三十人以下死亡，或者五十人以上一百人以下重伤，或者多少以上一亿元以下直接经济损失。答案：五千万元。"}, {"tag": null, "text": "把重大事故的第三条线记住：五千万到一亿。四条线一起记：一般，三人以下死亡、一千万元以下；较大，三到十人、一千万到五千万；重大，十到三十人、五千万到一亿；特别重大，三十人以上、一亿元以上。"}, {"tag": "第56题 · 单选", "text": "第五十六题，情景题。十人死亡、二十人重伤、直接损失一千万，事故等级是。答案：重大事故。"}, {"tag": null, "text": "十人死亡正好踩在重大事故的线上：十人以上三十人以下死亡就是重大。重伤和经济损失不用再看，死亡人数一锤定音。"}, {"tag": "第57题 · 单选", "text": "第五十七题。死亡三人的事故属于哪一级。答案：较大事故。三人以上十人以下死亡是较大事故。三人踩线进较大，十人踩线进重大。"}, {"tag": "第58题 · 单选", "text": "第五十八题。死亡一人的事故属于。答案：一般事故。一人是事故的起点，三人跳较大，十人跳重大，三十人封顶特别重大。分级口诀：一、三、十、三十。"}, {"tag": "第59题 · 多选", "text": "第五十九题，多选。考点：事故等级分为哪几级。答案：一般事故、较大事故、重大事故、特别重大事故，四级。"}, {"tag": null, "text": "错的是轻微事故，法定分级里没有这一级。口诀：四级四档，没有轻微。"}, {"tag": "第60题 · 单选", "text": "第六十题。考点：事故发生后，施工企业最迟多久上报。答案：一小时内。"}, {"tag": null, "text": "单位负责人接报后一小时内必须上报政府部门。记法：事故上报，一小时生死线。"}, {"tag": "第六十一题 · 单选", "text": "第六十一题。考点：事故报告和调查处理的正确说法。答案：事故发生后，本单位负责人应当立即报告安监部门，每级上报的时间不得超过二小时。"}, {"tag": null, "text": "两级数字：单位报政府一小时，政府逐级上报每级不超过两小时。伤亡人数变化的补报，一般事故三十日内，道路交通和火灾七日内。把这两个数字记牢。"}, {"tag": "第62题 · 单选", "text": "第六十二题。考点：事故报告的内容一般不包括什么。答案：详细的经济损失。"}, {"tag": null, "text": "初报报的是：时间地点、简要经过、伤亡人数、已采取措施。损失详细数字要后续统计，赶时间的事故初报不抠钱数。"}, {"tag": "第63题 · 单选", "text": "第六十三题。考点：哪一级事故县级人民政府可以直接组织调查组调查。答案：一般事故。"}, {"tag": null, "text": "调查分级：一般事故县级查；较大事故市级查；重大事故省级查；特别重大国务院查。口诀：县一般、市较大、省重大、国家特大。"}, {"tag": "第64题 · 判断", "text": "第六十四题，判断题。知识点：事故发生单位应当及时全面落实整改措施，负有安全生产监督管理职责的部门应当加强监督检查。对照题目，说法正确。"}, {"tag": null, "text": "出了事故，单位改、部门盯，一改一盯，闭环。判断为对。"}, {"tag": "第65题 · 单选", "text": "第六十五题。同一知识点换成填空：谁应当加强监督检查。答案：负有安全生产监督管理职责的部门。"}, {"tag": null, "text": "不是工会、不是检察院、不是行政执法部门，盯整改的是安监部门。"}, {"tag": "第66题 · 多选", "text": "第六十六题，多选。考点：哪些情况要追究有关领导和直接责任者的责任。正确的是四条。"}, {"tag": null, "text": "对事故隐瞒不报、谎报的；故意延迟不报的；故意破坏事故现场的；无正当理由拒绝接受调查的。"}, {"tag": null, "text": "错的是因抢救人员需要清理事故现场、但事前做好标记的，这不违规，抢救人命优先，留好标记即可。第二章到此全部讲完。"}];
const synth = window.speechSynthesis;
let cur = -1, playing = false, pass = 1, voice = null;
const starts = SEGS.map((s, i) => s.tag ? i : -1).filter(i => i >= 0);
const list = document.getElementById('list');

SEGS.forEach((s, i) => {
  if (s.tag) { const t = document.createElement('div'); t.className = 'tag'; t.textContent = s.tag; list.appendChild(t); }
  const d = document.createElement('div'); d.className = 'line'; d.textContent = s.text;
  d.onclick = () => { pass = 1; start(i); }; list.appendChild(d); s.el = d;
});

function pickVoice() {
  const vs = synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('zh'));
  voice = vs.find(v => /婷婷|Tingting|晓晓|Xiaoxiao|辉辉|Huihui|Yaoyao/.test(v.name)) || vs[0] || null;
}
pickVoice();
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = pickVoice;

function qStart(i) { let r = 0; for (const s of starts) { if (s <= i) r = s; else break; } return r; }
function qEnd(i) { for (const s of starts) { if (s > i) return s - 1; } return SEGS.length - 1; }

function start(i) {
  synth.cancel();
  if (i >= SEGS.length) { done(); return; }
  if (i < 0) i = 0;
  cur = i;
  document.querySelectorAll('.line').forEach((el, k) => {
    el.classList.toggle('now', k === cur);
    el.classList.toggle('done', k < cur);
  });
  SEGS[cur].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  document.getElementById('status').textContent = (pass === 2 ? '第2遍 · ' : '') + `第 ${cur + 1}/${SEGS.length} 句`;
  const u = new SpeechSynthesisUtterance(SEGS[cur].text);
  u.lang = 'zh-CN';
  if (voice) u.voice = voice;
  u.rate = parseFloat(document.getElementById('rate').value);
  u.onend = () => {
    if (!playing) return;
    if (cur < qEnd(cur)) { pass = pass; start(cur + 1); }
    else if (document.getElementById('mem').checked && pass === 1) { pass = 2; start(qStart(cur)); }
    else { pass = 1; const n = qEnd(cur) + 1; if (n < SEGS.length) start(n); else done(); }
  };
  synth.speak(u);
  playing = true; setBtn();
}
function done() { playing = false; setBtn(); document.getElementById('status').textContent = '✅ 讲完啦'; }
function setBtn() { document.getElementById('toggle').textContent = playing ? '⏸ 暂停' : '▶ 播放'; }
document.getElementById('toggle').onclick = () => {
  if (cur === -1) { start(0); return; }
  if (playing) { synth.pause(); playing = false; setBtn(); }
  else if (synth.paused && synth.speaking) { synth.resume(); playing = true; setBtn(); }
  else { playing = true; start(cur); }
};
document.getElementById('prev').onclick = () => { pass = 1; const p = qStart(Math.max(cur - 1, 0)); start(p === cur ? 0 : p); };
document.getElementById('next').onclick = () => { pass = 1; const n = starts.find(s => s > cur); start(n === undefined ? SEGS.length : n); };
document.getElementById('rate').onchange = () => { if (cur >= 0) { const c = cur; start(c); } };
</script>
</body>
</html>
