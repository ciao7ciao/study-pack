<script>
const SEGS = [{"tag": "第1题", "text": "第1题，判断题。企业应按规定取得行业学会颁发的安全生产许可证,按时办理延期手续。（　）"}, {"tag": null, "text": "答案：这个说法是错的。"}, {"tag": "第2题", "text": "第2题，单选题。以下那项作业不是通信行业中的常见的特种作业 （　） 选项：A，电工作业；B，高处作业；C，电焊作业；D，手持电钻作业。"}, {"tag": null, "text": "正确答案：D，手持电钻作业。"}, {"tag": "第3题", "text": "第3题，单选题。以下哪项作业不需要人员持《特种作业人员操作证》（　） 选项：A，制冷与空调设备安装修理作业；B，金属热切割作业；C，站在 2 米高处架设线缆；D，机房地面钻孔作业。"}, {"tag": null, "text": "正确答案：D，机房地面钻孔作业。"}, {"tag": "第4题", "text": "第4题，多选题。下列工种中,属于特种作业的是 （　） 选项：A，电工作业；B，金属焊接与切割作业；C，机动车辆驾驶；D，制冷与空调作业；E，登高架设作业。"}, {"tag": null, "text": "正确答案：A、B、D、E。"}, {"tag": "第5题", "text": "第5题，判断题。特种作业操作证有效期为 6 年,在考试所在省范围内有效。（　）"}, {"tag": null, "text": "答案：这个说法是错的。"}, {"tag": "第6题", "text": "第6题，单选题。登高证有效期为（　） 年,在全国范围内有效 选项：A，年；B，3 年；C，5 年；D，6 年。"}, {"tag": null, "text": "正确答案：D，6 年。"}, {"tag": "第7题", "text": "第7题，单选题。离开特种作业岗位达（　） 以上的特种作业人员,应当重新进行实际操作考核,经确认合格后方可上岗作业。 选项：A，个月；B，6 个月；C，一年；D，两年。"}, {"tag": null, "text": "正确答案：B，6 个月。"}, {"tag": "第8题", "text": "第8题，单选题。关于特种作业操作证的管理时限,说法正确的是 （　） 选项：A，证书的有效期为 5 年,在全国范围内有效；B，作业人员离开特种作业岗位 6 个月以上应重新取证；C，证书每 3 年复审 1 次；D，连续 10 年以上的证书,可每 6 年复审 1 次。"}, {"tag": null, "text": "正确答案：C，证书每 3 年复审 1 次。"}, {"tag": "第9题", "text": "第9题，单选题。通信工程必须在施工前向建设单位报批后才可以开始施工的作业是（　） 选项：A，机房内使用电动砂轮机；B，直埋线路跨越河流施工；C，架空线路与电力线交越作业；D，架空线路与铁路交越作业。"}, {"tag": null, "text": "正确答案：A，机房内使用电动砂轮机。"}, {"tag": "第10题", "text": "第10题，单选题。下面关于动火作业的管理要求,错误的是 （　） 选项：A，多个动火点办理一张动火证；B，不得随意涂改和转让动火证；C，不得扩大动火证的使用范围；D，动火证超过期限应重新办理。"}, {"tag": null, "text": "正确答案：A，多个动火点办理一张动火证。"}, {"tag": "第11题", "text": "第11题，多选题。通信工程应办理动土作业审批的工作有 （　） 选项：A，挖电缆沟；B，挖电杆坑、拉线坑；C，直埋线路工程敷设排流线；D，线路工程埋设防雷接地线；E，设备工程埋设地网。"}, {"tag": null, "text": "正确答案：A、E。"}, {"tag": "第12题", "text": "第12题，单选题。通信工程必须在施工前向建设单位报批后才可以开始施工作业是（　） 选项：A，架空线路与电力线交越作业；B，直埋线路与铁路交越作业；C，机房内交换设备割接作业；D，机房内用电热吹风机作业。"}, {"tag": null, "text": "正确答案：C，机房内交换设备割接作业。"}, {"tag": "第13题", "text": "第13题，单选题。下面关于施工企业安全技术措施的说法,错误的是（　） 选项：A，安全技术措施用于防止人身伤害、改善劳动条件；B，安全技术措施用于消除生产过程中的不安全因素；C，安全技术措施必须按照国家的经济发展规划编制；D，工程项目的安全技术措施必须在开工前针对工程中的危险因素编制。"}, {"tag": null, "text": "正确答案：C，安全技术措施必须按照国家的经济发展规划编制。"}, {"tag": "第14题", "text": "第14题，多选题。常用的防止事故发生的安全技术措施有 （　） 选项：A，设置薄弱环节；B，消除危险源；C，限制能量或危险物质；D，个体防护、避难与救援；E，减少故障和失误。"}, {"tag": null, "text": "正确答案：B、C、E。"}, {"tag": "第15题", "text": "第15题，多选题。工程中常用的减少事故发生的安全减少措施有（　） 选项：A，隔离；B，使用专用工具；C，个体防护；D，避难与救援；E，配备专职安全员。"}, {"tag": null, "text": "正确答案：A、C、D。"}, {"tag": "第16题", "text": "第16题，多选题。常用的减少事故损失的安全技术措施有 （　） 选项：A，设置薄弱环节；B，消除危险源；C，限制能量或危险物质；D，个体防护、避难与救援；E，减少故障和失误。"}, {"tag": null, "text": "正确答案：A、D。"}, {"tag": "第17题", "text": "第17题，单选题。即可以防止事故发生,也可以防止事故扩大,减少事故损失的安全技术措施是 （　） 选项：A，限制能量或危险物质；B，设置薄弱环节；C，隔离；D，安全设计。"}, {"tag": null, "text": "正确答案：C，隔离。"}, {"tag": "第18题", "text": "第18题，单选题。下列作业活动中,应编制专项施工方案的是 （　） 选项：A，在室外环境进行的光缆接续作业；B，在机房内进行机架安装作业；C，直埋线路挖 3m 深降水坑作业；D，连接新装机房设备的电源线作业。"}, {"tag": null, "text": "正确答案：C，直埋线路挖 3m 深降水坑作业。"}, {"tag": "第19题", "text": "第19题，单选题。下列作业活动中,应编制专项施工方案的是 （　） 选项：A，在室外进行的光缆接续作业；B，在机房内进行机架安装作业；C，在郊外开挖 4m 深人孔坑作业；D，连接新装机房的电源线作业。"}, {"tag": null, "text": "正确答案：C，在郊外开挖 4m 深人孔坑作业。"}, {"tag": "第20题", "text": "第20题，单选题。下列作业活动中,应编制专项施工方案的是（　） 选项：A，在野外地形复杂的地段接续光缆；B，在新机架内敷放电缆；C，在与多条管线交越处开挖管道沟；D，机房电源线割接作业。"}, {"tag": null, "text": "正确答案：C，在与多条管线交越处开挖管道沟。"}, {"tag": "第21题", "text": "第21题，多选题。下列作业活动中,应编制专项施工方案的是（　） 选项：A，在复杂环境光缆接续作业；B，在走线架上布放电缆作业；C，使用起重机吊装铁塔作业；D，新机房电源系统割接作业；E，直埋线路的水下冲槽作业。"}, {"tag": null, "text": "正确答案：C、D、E。"}, {"tag": "第22题", "text": "第22题，单选题。开挖深度（　）的基坑(槽)的土方开挖工程不仅需要编制专项施工方案,还需要专家论证。 选项：A，.5m；B，3m；C，5m；D，6m。"}, {"tag": null, "text": "正确答案：C，5m。"}, {"tag": "第23题", "text": "第23题，单选题。企业编制安全技术措施计划的牵头部门应该是 （　）,其他部门参与。 选项：A，财务部；B，人力资源部；C，安全生产管理部门；D，工会。"}, {"tag": null, "text": "正确答案：C，安全生产管理部门。"}, {"tag": "第24题", "text": "第24题，单选题。企业安全技术措施计划的项目范围中,配备防尘、防毒、降温、防寒等装置或设施,属于（　） 选项：A，安全技术措施；B，卫生技术措施；C，保障技术措施；D，安全宣传教育措施。"}, {"tag": null, "text": "正确答案：B，卫生技术措施。"}, {"tag": "第25题", "text": "第25题，单选题。安全生产教育培训应针对不同的培训对象,在合适的时间,进行)特点。相应内容的培训。这体现了安全生产教育培训的（　） 选项：A，长期性；B，全员性；C，针对性；D，多样性。"}, {"tag": null, "text": "正确答案：D，多样性。"}, {"tag": "第26题", "text": "第26题，单选题。下面关于安全生产教育培训时长的说法,正确的是 （　） 选项：A，所有管理人员和作业人员每两年至少进行一次；B，对新职工进行至少 30 小时培训,每年至少 20 学时的再培训；C，企业主要负责人和安全生产管理人员初次培训不得少于 30 学时每年再培训时间不得少于 12 学时；D，新上岗从业人员,岗前培训时间不得少于 24 学时。"}, {"tag": null, "text": "正确答案：D，新上岗从业人员,岗前培训时间不得少于 24 学时。"}, {"tag": "第27题", "text": "第27题，单选题。通信施工企业应当对新招的施工人员进行岗前三级安全教育,培训时长不少于 （　）学时。 选项：A，2；B，20；C，24；D，32。"}, {"tag": null, "text": "正确答案：D，32。"}, {"tag": "第28题", "text": "第28题，单选题。通信施工企业对新员工的岗前安全培训时间通常不应少于 （　） 选项：A，2 学时；B，24 学时；C，32 学时；D，40 学时。"}, {"tag": null, "text": "正确答案：C，32 学时。"}, {"tag": "第29题", "text": "第29题，判断题。建筑企业要对新职工进行至少 30 学时的安全培训,每年进行至少 20 学时的再培训（　）"}, {"tag": null, "text": "答案：这个说法是错的。"}, {"tag": "第30题", "text": "第30题，判断题。安全生产教育培训考核不合格的人员,上岗后应及时补考。（　）"}, {"tag": null, "text": "答案：这个说法是错的。"}, {"tag": "第31题", "text": "第31题，单选题。某工程公司对新招收来的农民工进行线路专业的安全操作培训,随后进行了考试,王某因文化水平不高怕考试分数低面子不好看,由同乡李某代答后取得了上岗证,公司随即安排王某与李某参与线路工程施工作业。下面说法正确的是（　） 选项：A，王某可以参与施工作业；B，王某可以在李某的带领下上岗作业；C，王某不能参加施工作业；D，王某补考后就能上岗作业。"}, {"tag": null, "text": "正确答案：C，王某不能参加施工作业。"}, {"tag": "第32题", "text": "第32题，多选题。必须经安全生产教育培训考核合格后方可能上岗的人员有 （　）。 选项：A，休假结束后返岗的人员；B，进入新的工作岗位的人员；C，进入新的施工现场的人员；D，采用新技术、新工艺、新设备、新材料作业的人员；E，特种作业人员。"}, {"tag": null, "text": "正确答案：B、C、D。"}, {"tag": "第33题", "text": "第33题，多选题。施工企业作人员应（　）,接受相应的安全生产教育培训 选项：A，在进入新的工资岗位之前；B，在进入新的施工现场之前；C，在采用新工艺、新材料、新设备时；D，在企业内整工作岗位时；E，在离岗两年以上重新上岗时。"}, {"tag": null, "text": "正确答案：A、B、C。"}, {"tag": "第34题", "text": "第34题，单选题。下列安全生产教育培训内容中,属于新上岗操作工人培训内容的是（　）。 选项：A，安全生产新技术、新知识、新方法；B，季节施工要求；C，紧急情况下应急救援的基本知识；D，作业场所和工作岗位存在的危险因素。"}, {"tag": null, "text": "正确答案：C，紧急情况下应急救援的基本知识。"}, {"tag": "第35题", "text": "第35题，多选题。安全生产教育培训内容中,属于安全生产继续教育内容的是（　） 选项：A，新工艺、新技术、新知识、新方法；B，新颁布的安全生产法律法规；C，安全技术标准、规范和规范性文件；D，先进的安全生产技术和管理经验；E，预防和减少事故风险的基本知识。"}, {"tag": null, "text": "正确答案：B、C、D。"}, {"tag": "第36题", "text": "第36题，判断题。企业的职工安全教育培训档案应涉及企业所使用的被派遣劳动者。（　）"}, {"tag": null, "text": "答案：这个说法是对的。"}, {"tag": "第37题", "text": "第37题，单选题。企业施工人员的安全教育培训记录应（　） 保存、管理。 选项：A，企业的安全生产主管部门；B，企业的档案管理部门；C，企业的人力资源部门；D，施工人员所在的管理组织。"}, {"tag": null, "text": "正确答案：D，施工人员所在的管理组织。"}, {"tag": "第38题", "text": "第38题，单选题。企业机关人员的职工安全教育培训记录应（　） 管理和保存 选项：A，企业的安全生产主管部门；B，企业的档案管理部门；C，企业的人力资源部门；D，施工人员所在的管理组织。"}, {"tag": null, "text": "正确答案：A，企业的安全生产主管部门。"}, {"tag": "第39题", "text": "第39题，多选题。企业员工的日常安全教育活动应由 （　）组织实施。 选项：A，企业人力资源管理部；B，企业工程项目管理部；C，企业安全生产管理部；D，企业的工程项目部；E，企业的工会组织。"}, {"tag": null, "text": "正确答案：C、D。"}, {"tag": "第40题", "text": "第40题，单选题。企业新入职员工的职工安全教育培训记录应由 （　） 建立。 选项：A，企业人力资源管理部；B，企业工程项目管理部；C，企业安全生产管理部；D，新员工所在的项目部。"}, {"tag": null, "text": "正确答案：C，企业安全生产管理部。"}, {"tag": "第41题", "text": "第41题，多选题。对于施工总承包工程项目,施工单位保证施工安全的安全生产投入主要包括 （　）。 选项：A，掌握安全施工要求的管理人员和作业人员；B，满足工程要求的机械设备；C，满足工程要求的劳动保护用品；D，满足工程要求的工程材料；E，工程需要的资金。"}, {"tag": null, "text": "正确答案：A、B、C、E。"}, {"tag": "第42题", "text": "第42题，单选题。通信建设工程安全费的提取标准应为 （　） 选项：A，建安费的 1.5%；B，施工费的 1.5%；C，建安费的 1%；D，施工费的 1%。"}, {"tag": null, "text": "正确答案：A，建安费的 1.5%。"}, {"tag": "第43题", "text": "第43题，多选题。施工企业内部安全生产费用管理制度应明确安全费用的 （　） 选项：A，提取程序；B，使用程序；C，项目概算程序；D，使用范围；E，挪用程序。"}, {"tag": null, "text": "正确答案：A、B、D。"}, {"tag": "第44题", "text": "第44题，多选题。关于安全生产费的管理要求,下列说法正确的是（　） 选项：A，企业应按照项目承包合同额的 1.5%收取安全生产费；B，安全生产费可采用由其他单位代管的方式集中管理和使用；C，企业应确保安全生产所需资金的投入并有效使用；D，企业应立安全生产费用分类使用台账,并定期统计；E，企业应编制安全生产费用使用计划。"}, {"tag": null, "text": "正确答案：C、D、E。"}, {"tag": "第45题", "text": "第45题，单选题。施工单位必须依法参加工伤保险,为 （　） 缴纳保险费 选项：A，农民工；B，固定工；C，合同工；D，以上均包括。"}, {"tag": null, "text": "正确答案：D，以上均包括。"}, {"tag": "第46题", "text": "第46题，单选题。张某在人井中确认资料,爬出人井时,被过往的汽车正巧撞上死亡。本次事故中张某家属可以获得的赔偿,说法正确的是 （　） 选项：A，交通事故的赔偿和工伤赔偿都能获得；B，只能获得交通事故的赔偿不能获得工伤赔偿；C，只能获得工伤赔偿不能获得交通事故赔偿；D，交通事故的赔偿和工伤赔偿都不能获得,只能获得意外伤害赔偿。"}, {"tag": null, "text": "正确答案：C，只能获得工伤赔偿不能获得交通事故赔偿。"}, {"tag": "第47题", "text": "第47题，单选题。施工单位带领劳务公司作业人员施工发生了事故,事故发生后,应由（　）负责向统筹地区社会保险行政部门提出工伤认定申请。 选项：A，建设单位；B，监理单位；C，施工单位；D，劳务公司。"}, {"tag": null, "text": "正确答案：D，劳务公司。"}, {"tag": "第48题", "text": "第48题，单选题。员工受伤后,应在应当自事故伤害发生之日起（　） 内提出工作认定申请。 选项：A，5 日；B，30 日；C，一个月；D，一年。"}, {"tag": null, "text": "正确答案：B，30 日。"}, {"tag": "第49题", "text": "第49题，单选题。受伤人员在停工留薪期内,原工资福利待遇不变,停工留薪期最上不超过 （　）。 选项：A，个月；B，12；C，24 个月；D，36 个月。"}, {"tag": null, "text": "正确答案：B，12。"}, {"tag": "第50题", "text": "第50题，单选题。事故中死亡员工的一次性工亡补助金的标准为 （　） 选项：A，上一年全国城镇居民人均收入的 20 倍；B，上一年全国城镇居民人均可支配收入的 20 倍；C，上一年统筹地区居民人均收入的 20 倍；D，上一年统筹地区城镇居民人均收入的 20 倍。"}, {"tag": null, "text": "正确答案：B，上一年全国城镇居民人均可支配收入的 20 倍。"}, {"tag": "第51题", "text": "第51题，单选题。按照《安全生产责任保险实施办法》规定,下列说法正确的是（　）。 选项：A，企业主要负责人在工程中伤亡,其获取的保险金应高于普通员工；B，企业派遣制用工在工程中伤亡,其获取的保险金应与合同制员工相同；C，投保单位每伤亡一人,其获取的保险金赔偿额不得低于 20 万元；D，对未造成人员死亡事故的赔偿保险金额度,按实际治疗费赔偿。"}, {"tag": null, "text": "正确答案：B，企业派遣制用工在工程中伤亡,其获取的保险金应与合同制员工相同。"}, {"tag": "第52题", "text": "第52题，单选题。劳动防护用品不同于一般的商品,直接关系到劳动者的生命安全和身体健康,生产经营单位为从业人提供的劳动防护用品必须符合（　）或行业标准。 选项：A，地方标准；B，国家标准；C，消防标准；D，劳安认证。"}, {"tag": null, "text": "正确答案：B，国家标准。"}, {"tag": "第53题", "text": "第53题，单选题。对于工程现场分包单位的作业人员,其安全防护用品由 （　） 提供。 选项：A，建设单位；B，总包单位；C，分包单位；D，其他单位。"}, {"tag": null, "text": "正确答案：C，分包单位。"}, {"tag": "第54题", "text": "第54题，单选题。下面关于劳动防护用品的管理要求,说法正确的是 （　） 选项：A，从业人员可以自行报销采购劳动防护用品的发票；B，从业人员可以使用不低于国标要求的进口劳动防护用品；C，当气温过高时,施工人员可以不穿工作服；D，新员工在施工现场不操作时,可以不佩戴劳动防护用品。"}, {"tag": null, "text": "正确答案：B，从业人员可以使用不低于国标要求的进口劳动防护用品。"}, {"tag": "第55题", "text": "第55题，单选题。下面关于劳动防护用品的选用要求,说法错误的是 （　） 选项：A，用人单位在选择劳动防护用品时,应考虑劳动者的作业方式和工作条件；B，用人单位在选择劳动防护用品时,应考虑其佩戴的合适性和基本舒适性；C，用人单位为劳动者配备劳动防护用品时需考虑作业现场的某些有害因素；D，用人单位应为流动性作业的劳动者,配备随身携带的个人应急防护用品。"}, {"tag": null, "text": "正确答案：A，用人单位在选择劳动防护用品时,应考虑劳动者的作业方式和工作条件。"}, {"tag": "第56题", "text": "第56题，单选题。下列特种设备的管理,错误的是 （　） 选项：A，特种设备使用单位应制定操作规程；B，特种设备使用单位应建立设备档案；C，特种设备使用单位应在检验合格证有效期届满前一个周提出检验要求；D，特种设备使用单位应对使用的特种设备经常性维护保养和定期检查。"}, {"tag": null, "text": "正确答案：C，特种设备使用单位应在检验合格证有效期届满前一个周提出检验要求。"}, {"tag": "第57题", "text": "第57题，多选题。《特种设备安全法》规定,特种设备使用单位应配备的人员有（　） 选项：A，特种设备安全管理人员；B，特种设备检测人员；C，特种设备业务营销人员；D，特种设备作业人员；E，特种设备采购人员。"}, {"tag": null, "text": "正确答案：A、B、D。"}, {"tag": "第58题", "text": "第58题，单选题。从事起重机械的 （　）不需要持《特种设备作业人员证》。 选项：A，安全管理人员；B，司机；C，指挥人员；D，项目负责人。"}, {"tag": null, "text": "正确答案：D，项目负责人。"}, {"tag": "第59题", "text": "第59题，单选题。特种设备使用单位的特种设备安全管理负责人应持有证书是（　） 选项：A，一建；B，特种作业操作证；C，特种设备安全管理人员资格证；D，施工企业安全生产考核合格证。"}, {"tag": null, "text": "正确答案：C，特种设备安全管理人员资格证。"}, {"tag": "第60题", "text": "第60题，单选题。特种设备使用单位特种设备安全管理负责人的责任不包括 （　） 选项：A，全面负责本单位特种设备安全管理的领导职责；B，组织制定特种设备安全管理制度；C，组织制定本单位特种设备事故的应急专项预案；D，落实特种设备安全管理机构设置。"}, {"tag": null, "text": "正确答案：A，全面负责本单位特种设备安全管理的领导职责。"}, {"tag": "第61题", "text": "第61题，单选题。特种设备使用单位特种设备安全管理员的责任不包括 （　） 选项：A，组织建立特种设备安全技术档案；B，办理特种设备使用登记；C，组织制定特种设备事故应急专项预案；D，组织开展特种设备安全教育和技能培训。"}, {"tag": null, "text": "正确答案：C，组织制定特种设备事故应急专项预案。"}];
const synth = window.speechSynthesis;
let cur = -1, playing = false, pass = 1, voice = null;
const starts = SEGS.map((s, i) => s.tag ? i : -1).filter(i => i >= 0);
const list = document.getElementById('list');

SEGS.forEach((s, i) => {
  if (s.tag) { const t = document.createElement('div'); t.className = 'tag'; t.textContent = s.tag; list.appendChild(t); }
  const d = document.createElement('div'); d.className = 'line'; d.textContent = s.text;
  d.onclick = () => { pass = 1; start(i); }; list.appendChild(d); s.el = d;
});

function pickVoice() {
  const vs = synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('zh'));
  voice = vs.find(v => /婷婷|Tingting|晓晓|Xiaoxiao|辉辉|Huihui|Yaoyao/.test(v.name)) || vs[0] || null;
}
pickVoice();
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = pickVoice;

function qStart(i) { let r = 0; for (const s of starts) { if (s <= i) r = s; else break; } return r; }
function qEnd(i) { for (const s of starts) { if (s > i) return s - 1; } return SEGS.length - 1; }

function start(i) {
  synth.cancel();
  if (i >= SEGS.length) { done(); return; }
  if (i < 0) i = 0;
  cur = i;
  document.querySelectorAll('.line').forEach((el, k) => {
    el.classList.toggle('now', k === cur);
    el.classList.toggle('done', k < cur);
  });
  SEGS[cur].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  document.getElementById('status').textContent = (pass === 2 ? '第2遍 · ' : '') + `第 ${cur + 1}/${SEGS.length} 句`;
  const u = new SpeechSynthesisUtterance(SEGS[cur].text);
  u.lang = 'zh-CN';
  if (voice) u.voice = voice;
  u.rate = parseFloat(document.getElementById('rate').value);
  u.onend = () => {
    if (!playing) return;
    if (cur < qEnd(cur)) { pass = pass; start(cur + 1); }
    else if (document.getElementById('mem').checked && pass === 1) { pass = 2; start(qStart(cur)); }
    else { pass = 1; const n = qEnd(cur) + 1; if (n < SEGS.length) start(n); else done(); }
  };
  synth.speak(u);
  playing = true; setBtn();
}
function done() { playing = false; setBtn(); document.getElementById('status').textContent = '✅ 讲完啦'; }
function setBtn() { document.getElementById('toggle').textContent = playing ? '⏸ 暂停' : '▶ 播放'; }
document.getElementById('toggle').onclick = () => {
  if (cur === -1) { start(0); return; }
  if (playing) { synth.pause(); playing = false; setBtn(); }
  else if (synth.paused && synth.speaking) { synth.resume(); playing = true; setBtn(); }
  else { playing = true; start(cur); }
};
document.getElementById('prev').onclick = () => { pass = 1; const p = qStart(Math.max(cur - 1, 0)); start(p === cur ? 0 : p); };
document.getElementById('next').onclick = () => { pass = 1; const n = starts.find(s => s > cur); start(n === undefined ? SEGS.length : n); };
document.getElementById('rate').onchange = () => { if (cur >= 0) { const c = cur; start(c); } };
</script>
