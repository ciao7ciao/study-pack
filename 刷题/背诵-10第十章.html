<!DOCTYPE html>
<html lang="zh">
<head>

<title>第十章 · 背诵版（答案+解析）</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #eef2f6; color: #22303e; padding: 64px 14px 40px; }
#bar { position: fixed; top: 0; left: 0; right: 0; z-index: 9; background: #ffffffee; backdrop-filter: blur(8px); border-bottom: 1px solid #e0e6ec; padding: 10px 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
#bar .stat { font-size: 14px; color: #5a6572; }
#bar label { font-size: 14px; color: #4a5560; cursor: pointer; }
.wrap { max-width: 760px; margin: 0 auto; }
.q { background: #fff; border-radius: 14px; box-shadow: 0 1px 8px #0000000e; padding: 20px 22px; margin: 14px 0; }
.qno { font-size: 13px; color: #8a95a1; margin-bottom: 6px; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 20px; background: #e3edfb; color: #1a66d6; margin-right: 8px; }
.stem { font-size: 17px; line-height: 1.65; font-weight: 600; margin-bottom: 12px; }
.opt { font-size: 15px; line-height: 1.55; padding: 9px 13px; margin: 6px 0; border: 1.5px solid #e3e9ef; border-radius: 10px; background: #fbfcfe; }
.opt.right { border-color: #2e9e5b; background: #e9f7ef; font-weight: 600; }
.ansline { margin-top: 12px; font-size: 16px; font-weight: 800; color: #217a45; background: #e9f7ef; border: 1.5px solid #2e9e5b; border-radius: 10px; padding: 10px 14px; }
.expl { margin-top: 10px; padding: 12px 15px; border-radius: 10px; background: #fff8e6; border: 1px solid #eee0ae; color: #4a3f28; font-size: 14.5px; line-height: 1.8; white-space: pre-wrap; }
.expl b.h { color: #8a6d1a; }
body.hideans .ansline, body.hideans .opt.right, body.hideans .expl { display: none; }

</head>
<body>
<div id="bar">
  <span class="stat">第十章 · 共 34 题</span>
  <label><input type="checkbox" onchange="document.body.classList.toggle('hideans', this.checked)"> 遮住答案自测</label>
</div>
<div class="wrap" id="list"></div>
<script>
const QUIZ = {"title":"第十章","questions":[{"type":"单选","key":"第2题","stem":"凡是禁止、停止和有危险的器件设备或环境,应涂以 （　） 色的。","options":["红","蓝","绿","黄"],"answer":"A","why":"安全色规定：红色=禁止、停止、危险，蓝色=指令必须遵守，黄色=警告注意，绿色=提示安全状态。禁止停止和危险器件环境涂红色，口诀「红停蓝必黄警绿行」。","expl":""},{"type":"单选","key":"第3题","stem":"安全色中（　） 常用于表示紧急停止、禁止和危险的信号。","options":["红色","黄色","蓝色","绿色"],"answer":"A","why":"红色光波最长、视认性最强，用于紧急停止、禁止、危险信号；黄色是警告，蓝色是指令，绿色是安全提示，层次分明。","expl":""},{"type":"单选","key":"第4题","stem":"消防设备应涂以（　）色","options":["红","蓝","绿","黄"],"answer":"A","why":"消防设备、灭火器材均涂红色——红色代表消防和禁止，火情紧急属性与红色的高注目性匹配，全国统一。","expl":""},{"type":"单选","key":"第5题","stem":"需要使用红色标记的有 （　）","options":["消防设备","机械的启动按钮","危险机器的警戒线","道路边指引车辆行驶方向的交通指示标志"],"answer":"A","why":"红色标记：消防设备、禁止标志、紧急停止按钮；机械启动按钮用绿色（启动=安全通行色），交通指示标志用蓝色，警戒线用黄色。","expl":""},{"type":"单选","key":"第6题","stem":"机器的停止按钮应使用（　）色。","options":["红","蓝","绿","黄"],"answer":"A","why":"机器停止按钮用红色——停止即「禁停类」动作，与紧急停止一致；启动按钮用绿色，一红一绿成对记忆。","expl":""},{"type":"多选","key":"第7题","stem":"红色注目性高,视认性很好,可用于表示 （　）","options":["交通禁令标志","消防设备标志","警告信号旗","必须佩戴防护用具","仪表刻度盘上极限位置的刻度"],"answer":"ABE","why":"红色高注目高视认，用于交通禁令标志、消防设备标志、仪表刻度盘极限位置刻度；警告信号旗用黄色，「必须佩戴防护用具」是指令标志用蓝色。","expl":""},{"type":"单选","key":"第8题","stem":"必须配戴安全帽标志,应使用（　）色标记","options":["红","蓝","绿","黄"],"answer":"B","why":"「必须配戴安全帽」属指令标志——强制必须做的事，指令标志用蓝色圆形白图形；红色是禁止，黄色是警告，绿色是提示。","expl":""},{"type":"多选","key":"第9题","stem":"黄色对人眼睛能产生比红色更高的明度,可用于表示 （　）","options":["危险机器的警戒线","消防设备标志","交通禁令标志","道路交通标志和标线中警告标志","楼梯的第一级和最后一级的踏步前沿"],"answer":"ADE","why":"黄色明度高，用于警告：危险机器警戒线、道路交通警告标志、楼梯首末级踏步前沿（防踏空）；消防设备用红色，交通禁令用红色。","expl":""},{"type":"单选","key":"第10题","stem":"车间内的安全通道、太平门指示标志使用（　）色","options":["红","蓝","绿","黄"],"answer":"C","why":"安全通道、太平门（安全出口）指示用绿色——绿色表示通行、安全状态，逃生方向一路绿灯，遇火灾跟随绿色标志撤离。","expl":""},{"type":"单选","key":"第11题","stem":"机器的启动按钮应使用 （　）色。","options":["红","蓝","绿","黄"],"answer":"C","why":"启动按钮用绿色：绿色代表正常、安全、可以通行，按下启动是允许性动作；与红色停止按钮成对记忆，别答反。","expl":""},{"type":"单选","key":"第12题","stem":"《安全色》 (GB2893-2008) 中规定绿色的对比色为 （　）色。","options":["红","黑","白","黄"],"answer":"C","why":"《安全色》规定绿色的对比色是白色——绿底白字对比清晰（如安全出口标志）；红/蓝/黄的对比色是黑色（黄色对比色为黑色），规律：明色配黑，深色配白。","expl":""},{"type":"单选","key":"第13题","stem":"《安全色》 (GB2893-2008) 中规定黄色的对比色为（　）色。","options":["白","黑","绿","黄"],"answer":"B","why":"黄色的对比色是黑色——黄黑相间是警戒线经典配色，明度差最大最醒目；绿色对比色是白色，红色、蓝色对比色为白色系图形。","expl":""},{"type":"单选","key":"第14题","stem":"道路边指引车和行人行驶方向的交通指示标志使用 （　）色标","options":["红","蓝","绿","黄"],"answer":"B","why":"道路指引行驶方向的交通指示标志用蓝色——蓝=指令/指示，「指路找蓝牌」；红色禁令、黄色警告、绿色高速指路牌为特例。","expl":""},{"type":"单选","key":"第15题","stem":"指令标志由圆形边框、（　）色背景图形和白色的指令图形符号组成。","options":["红","蓝","黄","绿"],"answer":"B","why":"指令标志：圆形边框+蓝色背景+白色图形符号（如必须戴安全帽）；禁止标志是红圈红斜杠，警告是黄底黑边黑图形，提示是绿底方框。","expl":""},{"type":"单选","key":"第16题","stem":"提示标志由正方形边框的（　）色背景图形和被提示的白色图形符号及文字组成。","options":["红","蓝","黄","绿"],"answer":"D","why":"提示标志：正方形边框+绿色背景+白色图形符号文字（如紧急出口、应急避难所）；绿=安全、通行、可求助。","expl":""},{"type":"单选","key":"第17题","stem":"应急避难场所标志使用（　）色。","options":["红","蓝","绿","黄"],"answer":"C","why":"应急避难场所标志用绿色——逃向安全处的提示类标志统一用绿底白图形，与安全出口标志同族。","expl":""},{"type":"多选","key":"第18题","stem":"安全标志分为（　）","options":["禁止标志","警告标志","指令标志","提示标志","操作标志"],"answer":"ABCD","why":"安全标志四大类：禁止（红）、警告（黄）、指令（蓝）、提示（绿）；「操作标志」不存在，是凑数项。","expl":""},{"type":"单选","key":"第19题","stem":"文字辅助标志横写时,禁止标志的文字辅助标志为（　）色字。","options":["红","蓝","白","黑"],"answer":"C","why":"文字辅助标志横写时，禁止标志的文字为白色（红底白字）——红底上白字最清晰；警告是黑字黄底，指令是白字蓝底。","expl":""},{"type":"单选","key":"第20题","stem":"文字辅助标志横写时,指令标志的文字辅助标志为（　）色字。","options":["红","蓝","白","黑"],"answer":"C","why":"横写的文字辅助标志中，指令标志文字为白色（蓝底白字），与指令标志图形的白图形一致；红色禁止同样是白字。","expl":""},{"type":"单选","key":"第21题","stem":"文字辅助标志横写时,警告标志的文字辅助标志为（　）色字。","options":["红","蓝","白","黑 A)"],"answer":"D","why":"警告标志的文字辅助标志为黑色字——黄底黑字是警告的标准配色，黑字在黄色上明度反差大，远距离可辨。","expl":""},{"type":"单选","key":"第22题","stem":"文字辅助标志横写时,警告标志的文字辅助衬底色是 （　）。","options":["黄色","白色","标志的颜色","绿色"],"answer":"B","why":"警告标志文字辅助横写时衬底为白色——图形部分黄底黑图形，文字部分白底黑字，形成「图形醒目、文字易读」的分工。","expl":""},{"type":"单选","key":"第23题","stem":"生命四大特征包括呼吸、体温、血压和 （　）","options":["血糖","脉搏","瞳孔","血氧"],"answer":"B","why":"生命四大体征：呼吸、体温、脉搏、血压；急救评估先看这四项，血糖、瞳孔、血氧是辅助观察指标，不列入四大体征。","expl":""},{"type":"单选","key":"第24题","stem":"正常人的呼吸频率为（　） 次/分。","options":["-12","14-18","28-32","60-80"],"answer":"B","why":"正常成人呼吸频率14~18次/分，安静状态下的参考区间；60~80次/分接近脉搏正常值（60~100次/分），两个数字别互换。","expl":""},{"type":"多选","key":"第25题","stem":"以下生命体征参数正常的有 （　）","options":["呼吸 18 次/分","体温 36.8°","脉搏 62 次/分","脉搏 90 次/分","血压舒张压为 120"],"answer":"ABCD","why":"正常值判断：呼吸18次/分（14-18内）、体温36.8℃（36-37内）、脉搏62次/分（60-100内）、脉搏90次/分也在正常区间；「舒张压120」错——120是收缩压上限值，舒张压正常约60~90mmHg。","expl":""},{"type":"单选","key":"第26题","stem":"火警电话为 （　）。","options":["10","119","120","122"],"answer":"B","why":"火警119、急救120、交通事故122、报警110；记忆：119谐音「要要救」，120是医疗急救专线。","expl":""},{"type":"单选","key":"第27题","stem":"创伤急救原则是:（　）","options":["先固定,后搬运,再抢救","先搬运,后固定,再抢救","先抢救,后搬运,再固定","先抢救,后固定,再搬运"],"answer":"D","why":"创伤急救原则：先抢救、后固定、再搬运——保命优先于固定，固定优先于搬动，顺序颠倒会加重损伤甚至致命。","expl":""},{"type":"单选","key":"第28题","stem":"一旦发现有人触电倒地,首先应该 （　）","options":["使伤者脱离电源","实施心肺复苏","打 112 急救","负责人报告"],"answer":"A","why":"发现触电倒地第一动作是使伤者脱离电源（拉闸、用绝缘物挑开电线）——不脱离电源就接触伤者会导致施救者连环触电，顺序绝对不能乱。","expl":""},{"type":"多选","key":"第29题","stem":"人员发生触电事故急救时,以下处理方法正确的有。（　）","options":["使伤员就地平卧,松解衣扣","如果触电的人神志清醒,呼吸心跳均正常,让伤员站立并走动进一步观察","如果触电的人呼吸停止而脉搏存在,进行口对口人工呼吸","如果触电的人心博停止而呼吸存在,进行人工胸外心脏按压","如果触电的人呼吸、心跳均停止者,等待医务人员救助"],"answer":"ACD","why":"触电急救：就地平卧松解衣扣正确；神志清醒呼吸心跳正常者应就地休息观察而非站立走动（B错）；呼吸停脉搏在做人工呼吸，心跳停呼吸在做胸外按压（C、D对）；呼吸心跳均停要立即同时心肺复苏而非干等医生（E错）。","expl":""},{"type":"单选","key":"第30题","stem":"人员发生触电事故,若呼吸、心脏均停止,现场急救应采用 （　）方法。","options":["人工呼吸","胸外心脏按压","人工呼吸和胸外按压应同时进行","等待专业人员救助"],"answer":"C","why":"呼吸心跳全停必须人工呼吸+胸外按压同时进行——单做一项都无法维持循环供氧，这就是心肺复苏（CPR）的组合操作。","expl":""},{"type":"单选","key":"第31题","stem":"触电者神志清醒、有意识,心脏跳动,但呼吸急促、面色苍白,此时（　）用心肺复苏法抢救。","options":["不能","应立即","可以","将其移到安全处后"],"answer":"A","why":"触电者神志清醒、有心跳，仅呼吸急促面色苍白，说明循环存在，不能用心肺复苏——CPR只用于呼吸心跳骤停者，对清醒者按压反而造成伤害。","expl":""},{"type":"单选","key":"第32题","stem":"触电伤员呼吸微弱或停止时,应立即通畅触电者的气道。（　）用枕头等物垫在伤员头下。","options":["应当","宜","严禁","不宜"],"answer":"C","why":"触电伤员呼吸微弱或停止时，通畅气道的过程中严禁用枕头等物垫在头下——垫高头部会阻塞气道甚至压迫颈椎，应解开衣领、仰头抬颏。","expl":""},{"type":"判断","key":"第33题","stem":"发生中毒事故后,应当查明中毒原因并采取有效安全防护措施后将中毒人员移至通风良好、空气新鲜的地方,确保患者呼吸道通畅,对神志不清者应将头部偏向一侧。 （　）","options":[],"answer":"对","why":"中毒急救：先查明原因做好自身防护，再移至通风空气新鲜处，保持呼吸道通畅；神志不清者头部偏向一侧防呕吐物误吸窒息，题干做法正确。","expl":""},{"type":"判断","key":"第34题","stem":"发生中毒事故后,应当查明中毒原因并采取有效安全防护措施后将中毒人员移至通风良好、空气新鲜的地方,确保患者呼吸道通畅,对神志不清者应脸向上平躺。 （　）","options":[],"answer":"错","why":"神志不清的中毒者必须「头偏向一侧」防止呕吐物堵塞气道；脸向上平躺一旦呕吐极易窒息死亡，与上一题只差四个字，命题就在这设坑。","expl":""},{"type":"单选","key":"第35题","stem":"实施心肺复苏术时,按压的频次每分钟应为 （　）","options":["0-80 次","80-100 次","100-120 次","120-140 次"],"answer":"C","why":"心肺复苏按压频率100~120次/分（2015年后国际指南标准），按压深度5~6cm；80~100次是旧标准，按最新口径记忆。","expl":""}]};
const L = 'ABCDE';
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
document.getElementById('list').innerHTML = QUIZ.questions.map((q, i) => {
  let opts;
  if (q.type === '判断') {
    opts = ['对','错'].map(t => `<div class="opt ${t===q.answer?'right':''}">${t}</div>`).join('');
  } else {
    opts = q.options.map((o,k) => `<div class="opt ${q.answer.includes(L[k])?'right':''}"><b>${L[k]}</b>　${esc(o)}</div>`).join('');
  }
  const expl = (q.why ? esc(q.why) + '<br>' : '') + (q.expl ? '<b class="h">📖 详细讲解：</b><br>' + esc(q.expl) : (q.why || q.expl ? '' : '（讲解待补，先记答案）'));
  return `<div class="q">
    <div class="qno"><span class="badge">${q.type}</span>第 ${i+1} 题${q.key && q.key.startsWith('附') ? '（附录）' : ''}</div>
    <div class="stem">${esc(q.stem)}</div>
    ${opts}
    <div class="ansline">✔ 答案：${q.answer}</div>
    <div class="expl">${expl}</div>
  </div>`;
}).join('');
</script>
</body>
</html>
