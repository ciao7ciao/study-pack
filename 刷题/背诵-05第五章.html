<script>
const QUIZ = {"title":"第五章","questions":[{"type":"单选","key":"第1题","stem":"下面关于安全生产决策机构的说法,不正确的是 （　）","options":["安全生产决策机构可以是安全生产委员会或安全生产决策岗位","安全生产决策机构的负责人是企业主要负责人","安全生产决策机构的负责人是企业的实际控制人","安全生产决策机构的负责人应为安全生产管理机构的负责人"],"answer":"D","why":"安全生产决策机构（安委会）的负责人应是企业主要负责人或实际控制人，安全生产管理机构负责人属执行层，不能反过来领导决策层，故D错误；A、B、C关于机构与负责人的说法正确。","expl":""},{"type":"单选","key":"第2题","stem":"施工单位应当在（　）的领导下开展安全生产管理。","options":["企业主要负责人","项目负责人","企业技术负责人","企业专职安全管理人员"],"answer":"A","why":"依据《建设工程安全生产管理条例》，施工单位安全生产管理应在企业主要负责人领导下开展，他是本单位安全生产第一责任人。易误选B，项目负责人只对工程项目现场安全负责。","expl":""},{"type":"单选","key":"第3题","stem":"关于中央施工企业安全生产委员会的有关规定,说法正确的是（　）","options":["各类企业均应成立安全生产委员会","董事长、党组书记、总经理对本企业安全生产工作共同承担领导责任","董事长承担领导责任","总经理承担领导责任"],"answer":"B","why":"中央施工企业的董事长、党组书记、总经理对本企业安全生产工作共同承担领导责任，C、D由单人承担领导责任的表述片面错误；A错，并非各类企业均强制成立安委会。","expl":""},{"type":"单选","key":"第4题","stem":"关于安全生产委员会的组成,正确的是 （　）","options":["应由企业管理层人员及其直接领导下的各职能部门负责人组成","必须由企业管理层人员组成","必须由企业各部门负责人组成","应由安全生产管理机构的成员组成"],"answer":"A","why":"安全生产委员会应由企业管理层人员及其直接领导下的各职能部门负责人组成，兼顾决策权威与执行力度；B、C表述绝对化，D把安委会降格为安全管理部门的内设机构，均错误。","expl":""},{"type":"单选","key":"第5题","stem":"通信施工企业的安全生产委员会每年度应有 （　）次以上安委会会议,并有安排、部署和记录","options":["3","4","5"],"answer":"A","why":"通信施工企业安委会每年度应召开3次以上会议，并有安排、部署和记录。数字考点：每年不少于3次。易凭感觉选4或5，记准“3次以上”即可。","expl":""},{"type":"单选","key":"第6题","stem":"施工企业设置的负责安全生产管理工作的独立职能部门是 （　）","options":["企业安全生产决策机构","企业安全生产管理机构","企业安全生产参与机构","企业安全生产委员会"],"answer":"B","why":"企业安全生产管理机构是施工企业设置的负责安全生产管理工作的独立职能部门；安委会是议事决策机构，不是常设职能部门。易混淆决策机构与管理机构的定位差别。","expl":""},{"type":"单选","key":"第7题","stem":"关于安全生产管理机构的设置,正确的是（　）","options":["各类企业均应设置","各种规模的企业均应设置","施工企业均应设置","中央施工企业必须设置"],"answer":"D","why":"安全管理机构并非任何企业都无条件设置，达到规定条件才需设置；中央施工企业必须设置，D正确；A、B、C“均应设置”过于绝对，不符合依据《安全生产法》的条件性设置要求。","expl":""},{"type":"单选","key":"第8题","stem":"安全生产管理机构必须依法配齐配强 （　）等专业安全管理人员","options":["注册建筑师","注册项目管理师","注册安全工程师","高级工程师"],"answer":"C","why":"依据《安全生产法》规定，安全生产管理机构应依法配齐配强注册安全工程师等专业安全管理人员；注册建筑师、注册项目管理师、高级工程师均不是安全管理的法定专业资格。","expl":""},{"type":"单选","key":"第9题","stem":"下面关于工程项目安全管理领导小组的说法,错误的是 （　）","options":["工程项目需要分包的,应成立项目安全管理领导小组","项目安全管理小组应配备考核合格的项目专职安全生产管理人员","总承包、专业承包和劳务分包单位的管理人员应为安全管理领导小组成员","劳务分包单位的技术员应为安全管理领导小组的成员"],"answer":"D","why":"项目安全管理领导小组应由总承包、专业承包和劳务分包单位的管理人员组成，劳务分包单位的技术员不是法定成员，故D错误；A成立条件、B专职安全员配备、C成员构成的说法均正确。","expl":""},{"type":"单选","key":"第10题","stem":"企业最基本、最核心的安全生产管理制度是 （　）","options":["安全生产管理制度","安全生产检查制度","安全生产责任制度","安全隐患排查制度"],"answer":"C","why":"安全生产责任制度是企业最基本、最核心的安全生产管理制度，它把安全责任落实到岗到人，其他制度都围绕责任落实展开。口诀“责任制是核心”；A是各类制度的总称，易误选。","expl":""},{"type":"单选","key":"第11题","stem":"企业建立健全安全生产管理制度,应以企业的 （　）为核心。","options":["职业健康","经济责任制","安全生产责任制","质量管理体系"],"answer":"C","why":"企业建立健全安全生产管理制度应以安全生产责任制为核心，与上题呼应：责任制既是核心也是基础。职业健康、经济责任制、质量管理体系都不是安全制度体系的核心。","expl":""},{"type":"单选","key":"第12题","stem":"下面关于企业安全生产隐患排查与治理的要求,错误的是 （　）","options":["企业应建立健全生产安全事故隐患排查治理制度","发现一般事故隐患时,排查人员应立即上报,等待处理","企业应采取技术、管理措施,及时发现并消除事故隐患","企业记录的安全生产隐患应向从业人员通报"],"answer":"B","why":"发现一般事故隐患应立即整改处理，“立即上报等待处理”会延误除险时机，故B错误；重大隐患才需按规定上报并制定治理方案。A建制度、C采取措施、D向从业人员通报均正确。","expl":""},{"type":"多选","key":"第13题","stem":"施工单位应当将施工现场的 （　）与作业区分开设置,并保持安全距离。","options":["绿化区","试验区","办公区","动火区","生活区"],"answer":"CE","why":"依据《建设工程安全生产管理条例》，施工现场的办公区、生活区应与作业区分开设置并保持安全距离。口诀“办公生活分开”；绿化区、试验区、动火区不属于该条款列举区域，误选D多是受危险联想。","expl":""},{"type":"单选","key":"第14题","stem":"下面的安全生产责任制编制原则中,正确的是（　）","options":["应与工程项目的现场情况相适应","应突出重点、兼顾一般、抓住关键","在一定时期内应保持内容、要求不变","应满足建设单位、监理单位的要求"],"answer":"B","why":"企业安全生产责任制的编制原则是突出重点、兼顾一般、抓住关键；A“与工程现场相适应”针对项目层面责任制，C内容应动态修订而非一成不变，D编制依据是法规和企业实际而非建设单位要求。","expl":""},{"type":"多选","key":"第15题","stem":"企业安全生产责任制涉及的内容,一般应包括 （　）","options":["企业的安全生产岗位","企业的安全生产责任人员","安全生产责任范围","安全生产检查制度","安全生产考核标准"],"answer":"BCE","why":"安全生产责任制一般应明确三要素：安全生产责任人员、责任范围、考核标准，即“谁负责、管什么、怎么考”；A岗位设置、D检查制度不属于责任制的组成要素。口诀“人员+范围+考核”。","expl":""},{"type":"单选","key":"第16题","stem":"下述职责中,属于企业安全生产决策机构的是（　）。","options":["制定企业安全生产检查计划","研究解决企业安全生产工作中的重大问题","监督在建工程项目安全生产费用的使用情况","参加生产安全事故的调查和处理工作"],"answer":"B","why":"决策机构（安委会）管宏观决策，研究解决企业安全生产工作中的重大问题；制定检查计划、监督费用使用、参加事故调查属管理部门或执行层职责。抓“重大问题”对应“决策”二字。","expl":""},{"type":"单选","key":"第17题","stem":"下述职责中,属于企业安全生产决策机构的是 （　）。","options":["研究决定企业安全生产方面的奖惩事项","制定企业安全生产检查计划","监督在建项目安全生产费用的使用","参加生产安全事故的调查和处理工作"],"answer":"A","why":"研究决定企业安全生产方面的奖惩事项属重大决策，应由安委会研究决定；制定检查计划、监督费用使用、参加事故调查是管理部门的日常性工作。规律：安委会管大事，部门管具体事。","expl":""},{"type":"单选","key":"第18题","stem":"下述职责中,属于企业安全生产管理部门的是（　）","options":["研究决定企业安全生产方面的奖惩事项","监督在建工程项目安全生产费用的使用","研究解决企业安全生产工作中的重大问题","确定企业的安全生产管理方针"],"answer":"B","why":"监督在建工程项目安全生产费用使用属安全生产管理部门的日常监管职责；研究决定奖惩、研究解决重大问题、确定管理方针均属决策机构职权。区分口诀：决策定方针，部门抓监督。","expl":""},{"type":"单选","key":"第19题","stem":"下述职责中,属于企业安全生产管理部门的是 （　）","options":["研究决定企业安全生产方面的奖惩事项","制订企业安全生产考核计划","研究解决企业安全生产工作中的重大问题","确定企业的安全生产管理方针"],"answer":"B","why":"制订企业安全生产考核计划是安全生产管理部门的职责；研究决定奖惩、研究解决重大问题属决策机构，确定安全管理方针属决策层。注意“制订计划”与“研究决定”的层级差别。","expl":""},{"type":"单选","key":"第20题","stem":"按照《施工企业安全生产管理规范》GB50656-2011) 的条文说明的规定,下列职责中,属于技术管理部门的是（　）","options":["协调配置安全生产所需的各项资源","监督检查机械设备和仪表的合规性","参与设备、仪表施工组织设计的会审","组织编制、审查专项安全施工方案"],"answer":"D","why":"依据GB50656-2011条文说明，组织编制、审查专项安全施工方案专业性强，属技术管理部门职责；协调配置资源、监督检查设备仪表、参与会审分属其他部门。口诀：技术方案技术部门管。","expl":""},{"type":"单选","key":"第21题","stem":"按照《施工企业安全生产管理规范》GB50656-2011) 的条文说明的规定,下列职责中,属于设备仪表管理部门的是 （　）","options":["协调配置安全生产所需的各项资源","制订安全技术措施和安全操作规程","参与机械设备施工组织设计的会审","组织编制、审查专项安全施工方案"],"answer":"C","why":"设备仪表管理部门参与机械设备施工组织设计的会审，体现“谁主管谁参与”；制订安全技术措施和安全操作规程、审查专项方案属技术管理部门，协调资源属综合管理职责。","expl":""},{"type":"单选","key":"第22题","stem":"按照《施工企业安全生产管理规范》GB50656-2011) 的条文说明的规定,下列职责中,属于物资管理部门的是 （　）。","options":["协调配置安全生产所需的各项资源","监督检查机械设备和仪表的合规性","负责劳动防护用品的安全管理工作","组织编制、审查专项安全施工方案"],"answer":"C","why":"劳动防护用品属物资范畴，其安全管理工作由物资管理部门负责；协调资源、检查设备仪表、审查专项方案分属其他部门。记忆口诀：劳保用品就是物资，归物资部门管。","expl":""},{"type":"单选","key":"第23题","stem":"按照《施工企业安全生产管理规范》(GB50656-2011) 的条文说明的规定,其他职能部门的安生产职责,人力资源部门的是 （　）","options":["审查安全管理人员资格","负责劳动防护用品的安全管理","审查劳务分包人员资格","协助办理安全奖、罚手续"],"answer":"A","why":"人员资格审查属人事管理范畴，审查安全管理人员资格由人力资源部门负责；劳动防护用品归物资部门，劳务分包人员资格、协助办理安全奖罚手续分属其他相关部门。规律：管人的部门审人的资格。","expl":""},{"type":"多选","key":"第24题","stem":"下列安全生产职责中,属于建筑施工企业安全生产领导小组的主要职责的是（　）","options":["编制并适时更新安全生产管理制度并监督实施","编制项目生产安全事故应急救援预案并组织实施","参加生产安全事故的调查和处理工作","协调配备项目专职安全生产管理人员","组织编制危险性较大工程安全专项施工方案"],"answer":"BE","why":"依据建质〔2008〕91号文，安全生产领导小组职责聚焦项目层面：编制项目生产安全事故应急救援预案并组织实施、组织编制危险性较大工程安全专项施工方案；A编制更新安全管理制度、C参加事故调查处理、D协调配备专职安全员属企业安全生产管理机构职责，故选BE。","expl":""},{"type":"判断","key":"第25题","stem":"安全生产责任制涉及的人员范围为企业主要负责人到基层管理岗位人员。（　）","options":[],"answer":"错","why":"错。安全生产责任制的人员范围应覆盖从企业主要负责人到一线作业人员的全体人员，并非只到基层管理岗位为止；现场作业人员同样要纳入，做到全员覆盖、人人有责。","expl":""},{"type":"单选","key":"第26题","stem":"不属于施工企业主要负责人安全生产主要管理工作的是 （　）","options":["领导企业安全生产管理工作","组织制定企业中长期安全管理目标和制度","做好施工现场的安全生产检查工作","审议、决策重大安全事项"],"answer":"C","why":"企业主要负责人的职责是宏观领导：领导企业安全管理工作、组织制定中长期安全管理目标和制度、审议决策重大安全事项；做好施工现场安全检查是项目和专职安全员的职责，不属于其范围。","expl":""},{"type":"单选","key":"第27题","stem":"下列安全生产管理职责中,属于企业主要负责人安全生产管理职责的是 （　）","options":["实施企业安全生产规章制度","实施企业制定安全生产操作规程","参加企业组织的安全生产教育培训","与现场施工人员签订安全生产责任书"],"answer":"A","why":"主要负责人负责组织实施企业安全生产规章制度；B操作规程由现场作业人员执行，C参加教育培训是全员义务，D主要负责人应与项目负责人签订责任书而非与现场施工人员签订。","expl":""},{"type":"多选","key":"第28题","stem":"主要负责人与项目负责人签订的安全生产责任书的内容必须包括（　）。","options":["项目安全生产考核目标","项目安全生产奖惩措施","项目部应采购的劳动保护用品","项目承包额","企业为项目提供的安全管理和技术保障措施"],"answer":"ABE","why":"责任书必须包括项目安全生产考核目标、项目安全生产奖惩措施、企业为项目提供的安全管理和技术保障措施；项目部采购劳动保护用品和项目承包额属物资与商务范畴。口诀“目标+奖惩+保障”。","expl":""},{"type":"多选","key":"第29题","stem":"企业与项目负责人签订的安全生产责任书的内容必须包括 （　）","options":["项目安全生产考核目标","项目安全生产奖惩措施","项目部应采购的劳动保护用品","项目的施工费承包额","企业为项目提供的安全管理和技术保障措施"],"answer":"ABE","why":"同一考点：安全生产责任书必备内容为考核目标、奖惩措施、企业为项目提供的安全管理和技术保障措施三项；施工费承包额与防护用品采购属商务物资事项，不属于责任书必备内容。","expl":""},{"type":"单选","key":"第30题","stem":"关于通信施工企业主要负责人的安全职责,下面表述中错误的是（　）","options":["主要负责人对本企业安全生产工作全面负责","主要负责人应督促检查本企业安全生产工作","消除安全事故隐患由专职安全生产管理人员和项目负责人,企主要负责人分别负责","主要负责人应当与项目负责人签订安全生产责任书"],"answer":"C","why":"依据《安全生产法》，督促检查本企业安全生产工作、及时消除事故隐患是主要负责人的法定职责，不能推给专职安全员和项目负责人“分别负责”，C推卸了主要负责人的隐患治理责任，故错误。","expl":""},{"type":"单选","key":"第31题","stem":"关于通信施工企业主要负责人的安全职责,下面表述中错误的是（　）","options":["主要负责人应当按规定检查企业所承担的工程项目","主要负责人应当考核项目负责人安全生产管理能力","必要时,主要负责人可以调整项目负责人","主要负责人应当明确项目管理人员的安全职责"],"answer":"D","why":"主要负责人应当按规定检查企业所承担的工程项目、考核项目负责人安全生产管理能力、必要时调整项目负责人；“明确项目管理人员的安全职责”是项目负责人的职责，不属于企业主要负责人，故D错误。","expl":""},{"type":"单选","key":"第32题","stem":"下列职责中,属于企业主管安全生产负责人的安全生产职责的是（　）","options":["审批施工组织设计和专项施工方案","监督、检查安全生产费用使用情况","组织实施安全工作规划及实施计划","组织审查新工艺实施过程的安全性"],"answer":"C","why":"主管安全生产负责人协助主要负责人抓落实，负责组织实施安全工作规划及实施计划；审批施工组织设计和专项方案、审查新工艺安全性是技术负责人的技术把关职责，监督安全费用使用是管理部门职责。","expl":""},{"type":"单选","key":"第33题","stem":"下列职责中,属于企业技术负责人的安全生产职责的是 （　）。","options":["审批施工组织设计和专项施工方案","监督、检查安全生产费用使用情况","组织实施安全工作规划及实施计划","监督企业安全生产教育工作开展情况"],"answer":"A","why":"技术负责人负责安全技术把关，审批施工组织设计和专项施工方案是其标志性职责；组织实施安全工作规划属主管安全负责人，监督安全费用、监督安全教育开展分属管理部门与主管领导。口诀“方案技术负责人审”。","expl":""},{"type":"单选","key":"第34题","stem":"企业的安全生产管理人员不包括（　）","options":["企业安全生产管理机构的人员","分支机构专职从事安全生产管理工作的人员","工程项目专职从事安全生产管理工作的人员","工程项目的兼职安全巡查人员"],"answer":"D","why":"企业安全生产管理人员指专职从事安全管理工作的人员：企业安全机构人员、分支机构及工程项目专职安全管理人员；兼职安全巡查人员不在专职序列。抓“专职”二字即可锁定D。","expl":""},{"type":"单选","key":"第35题","stem":"下列关于企业专职安全生产管理人员的安全生产管理职责,说法错误的是 （　）。","options":["检查在建项目安全生产管理情况","发现安全事故隐患,应及时向政府有关机构报告","对达到一定规模的危险性较大的分部分项工程进行现场监督","对工程施工的重点部位和关键环节进行现场监督"],"answer":"B","why":"专职安全管理人员发现事故隐患应向企业安全生产管理机构报告，而非直接向政府有关机构报告，B流程错误；向政府上报事故由单位按规定进行。A、C、D的现场检查监督职责均正确。","expl":""},{"type":"单选","key":"第36题","stem":"下列安全生产要求中,不属于企业对项目负责人的安全生产要求是（　）","options":["项目负责人应取得相应的执业资格","项目负责人应经安全生产考核合格","企业应与项目负责人签订安全生产责任书","企业应与项目负责人签订承包合同"],"answer":"D","why":"企业对项目负责人的安全生产要求包括取得相应执业资格、经安全生产考核合格、签订安全生产责任书；签订承包合同属经营管理行为，与安全生产要求无关，故D不属于。","expl":""},{"type":"多选","key":"第37题","stem":"企业与项目负责人签订的安全生产责任书的内容必须包括 （　）","options":["项目安全生产考核目标","项目安全生产奖惩措施","项目部应采购的劳动防护用品","项目部的施工费承包额","企业为项目提供的安全管理和技术保障措施"],"answer":"ABE","why":"安全生产责任书必须包括项目安全生产考核目标、奖惩措施、企业为项目提供的安全管理和技术保障措施；劳动防护用品采购与施工费承包额属商务物资事项，不是责任书法定内容。口诀“目标+奖惩+保障”。","expl":""},{"type":"单选","key":"第38题","stem":"工程项目施工现场安全生产第一责任人是 （　）","options":["企业法人","企业主管安全生产的负责人","项目负责人","项目专职安全生产管理人员"],"answer":"C","why":"项目负责人（项目经理）是工程项目施工现场安全生产第一责任人，对施工现场安全全面负责；企业法人是企业层面的第一责任人，专职安全员是监督检查者，均不能充当现场第一责任人。","expl":""},{"type":"单选","key":"第39题","stem":"下列工程项目负责人的安全生产职责中,描述错误的是 （　）","options":["应当建立项目安全生产管理体系","负责编制工程项目施工组织设计","负责组织落实企业的安全生产责任制","负责组织落实企业安全生产规章制度"],"answer":"B","why":"施工组织设计由项目技术负责人组织编制，项目负责人负责审批把关，“编制”不是项目负责人的职责，B错误；建立项目安全管理体系、组织落实责任制和规章制度均是其职责。","expl":""},{"type":"单选","key":"第40题","stem":"下列工程项目负责人的安全生产职责中,描述错误的是（　）","options":["负责编制项目的施工组织设计","监控危险性较大分部分项工程","及时排查处理现场安全事故隐患","与分包企业签订安全生产协议书"],"answer":"A","why":"同上考点：项目施工组织设计的编制主体是项目技术负责人，A错误；项目负责人应监控危险性较大分部分项工程、及时排查处理隐患、与分包企业签订安全生产协议书，均正确。","expl":""},{"type":"多选","key":"第41题","stem":"项目负责人应当按照规定实施项目安全生产管理,（　） 隐患排查处理情况应当记入项目安全管理档案。","options":["监控危险性较大分部分项工程","定期考核分包企业安全生产管理情况","每天在施工现场开展安全生产检查","及时排查处理施工现场安全事故隐患","建立健全企业安全生产管理体系"],"answer":"ABD","why":"项目负责人应将监控危险性较大分部分项工程、定期考核分包企业安全生产管理情况、及时排查处理隐患的情况记入项目安全管理档案；“每天检查”频次说法错误，建立健全企业安全管理体系是企业层面职责。","expl":""},{"type":"多选","key":"第42题","stem":"施工安全技术交底应向施工作业班组、作业人员进行详细说明的内容有（　）","options":["施工安全重点部位","施工安全重点环节","安全施工所需费用","安全施工技术要求","安全施工技术措施"],"answer":"ABDE","why":"安全技术交底应向作业班组、作业人员详细说明施工安全重点部位、重点环节、安全施工技术要求和措施；安全施工所需费用属成本管理范畴，与交底内容无关。口诀“交底谈安全、不谈钱”。","expl":""},{"type":"单选","key":"第43题","stem":"必须在安全技术交底记录上签字的人员是 （　）","options":["项目负责人","项目设计人员","项目技术人员","项目监理人员"],"answer":"A","why":"项目负责人作为施工现场安全生产第一责任人，必须在安全技术交底记录上签字，以督促交底落实到班组和个人；项目设计人员、监理人员不参与施工单位内部交底的签字环节。","expl":""},{"type":"单选","key":"第44题","stem":"下列施工现场班组长的安全生产职责中,描述错误的是 （　）","options":["负责进行项目施工组织设计交底工作","贯彻执行企业的安全生产的规定和要求","督促本班组的工人遵守安全生产规章","督促本班组的工人遵守安全操作规程"],"answer":"A","why":"施工组织设计交底由项目技术负责人向有关人员实施，属项目技术管理层职责，不是班组长的活，A错误；班组长负责贯彻执行企业安全规定，督促本班组工人遵守规章和操作规程。","expl":""},{"type":"多选","key":"第45题","stem":"施工企业不参加安全生产考核的人员是 （　）","options":["各管理层的主要负责人","安全生产相关职能部门及岗位的管理人员","工程项目的管理人员","施工现场的作业人员"],"answer":"ABC","why":"须参加安全生产考核的是“三类人员”（企业主要负责人、项目负责人、专职安全生产管理人员）及经教育培训考核合格的作业人员；各管理层主要负责人、职能部门及岗位管理人员、一般项目管理人员不属于强制考核对象。易把“项目管理人员”与持B证的项目负责人混淆。","expl":""},{"type":"单选","key":"第46题","stem":"下列行为中,不属于安全生产处罚范围的是 （　）","options":["偶尔出现安全生产考核成绩不达标的问题","没有及时对提出的问题进行整改","在生产安全事故中不积极抢救,而导致事故扩大化","在抢险活动中,项目负责人冒险作业导致身体残疾"],"answer":"D","why":"在抢险救灾活动中冒险作业致伤属保护国家和人民利益的行为，应给予抚恤和优待而非处罚，故D不属于处罚范围；考核成绩不达标不整改、不积极抢救致事故扩大均应处罚。易误选C，失职扩大事故是典型处罚情形。","expl":""},{"type":"多选","key":"第47题","stem":"应受到安全生产处罚的行为是 （　）","options":["强令职工冒险作业","冒险抢修损毁设施","重复发生安全事故","破坏或伪造事故现场","瞒报、谎报或不及时上报安全事故"],"answer":"ACDE","why":"强令职工冒险作业、重复发生安全事故、破坏或伪造事故现场、瞒报谎报迟报事故均属严重违法违规行为，应受处罚；“冒险抢修损毁设施”属抢险应急行为，不在处罚之列。规律：抢险免责，强令必罚。","expl":""},{"type":"单选","key":"第49题","stem":"通信建设工程安全生产涉及工程的规划设计、建设安装、生产调试、生产运行、技术改造等系列活动。因此,企业建立安全生产管理制度应遵循 （　）","options":["安全第一,预防为主,综合治理原则","主要负责人的原则","系统性原则","规范化和标准化原则"],"answer":"C","why":"通信建设安全贯穿规划设计、建设安装、生产调试、运行、技改等系列活动全过程，建立制度须统筹覆盖各环节，故遵循系统性原则；十二字方针是总方针，不是针对题干情境的编制原则。","expl":""},{"type":"单选","key":"第50题","stem":"企业建立安全生产管理制度应坚持规范化和标准化原则,这是因为（　）","options":["要保证有效调动和使用企业的所有资源","要保证制度的目的明确,流程清晰,标准准确","制度涉及企业经的每个环节、岗位"],"answer":"B","why":"坚持规范化和标准化原则是为了保证制度目的明确、流程清晰、标准准确，便于执行和考核；“调动使用所有资源”是系统性原则的作用，“涉及每个环节岗位”说的是全面性，均非其直接原因。","expl":""},{"type":"多选","key":"第51题","stem":"按照标准化工作体系建立的安全生产管理制度,一般把安全生产管理制度分为（　）等几类体系。","options":["规范标准 C 工作标准","工作标准 B 技术标准","管理标准","系统标准"],"answer":"BCD","why":"按标准化工作体系，安全生产管理制度分为技术标准、管理标准、工作标准三大类，分别覆盖技术操作、管理流程和岗位职责；“规范标准”“系统标准”不是标准化体系的分类名称。口诀“技、管、工”。","expl":""},{"type":"单选","key":"第52题","stem":"下列安全生产管理制度中,属于综合管理类管理制度的是 （　）","options":["安全教育培训制度","定期巡视检查制度","安全技术管理制度","职业卫生管理制度"],"answer":"C","why":"按教材对制度的划分，安全技术管理制度属于综合管理类制度；安全教育培训、定期巡视检查、职业卫生管理属于专项业务管理制度，综合覆盖面不同。易把教育培训误当成综合管理类。","expl":""},{"type":"单选","key":"第53题","stem":"下列综合管理类安全管理制度中,属于安全技术管理制度的是（　）","options":["施工组织设计编制、审核和审批制度","隐患排查和治理制度","劳动防护用品发放、使用和管理制度","安全生产监督检查制度"],"answer":"A","why":"施工组织设计的编制、审核和审批是对安全技术方案的层层把关，属安全技术管理制度；隐患排查治理、防护用品管理、监督检查制度属综合管理类中的安全管理类制度，不属于安全技术类。","expl":""},{"type":"单选","key":"第54题","stem":"安全管理定期例行工作不包括（　）","options":["定期安全分析会议","定期安全学习制度","定期进度报表制度","定期安全生产检查"],"answer":"C","why":"定期安全分析会议、定期安全学习、定期安全生产检查均属安全管理定期例行工作；定期进度报表属工程进度管理，与安全管理无关，故C不包括。抓“安全”关键词即可排除干扰项。","expl":""},{"type":"单选","key":"第55题","stem":"不属于承包、分包与发包工程安全管理制度内容的是（　）","options":["参与各方的安全责任","安全生产管理协议 D 施工安全的组织措施","施工安全的组织措施 C 费用变更索赔条款"],"answer":"C","why":"承包、分包与发包工程安全管理制度内容包括参与各方的安全责任、安全生产管理协议、施工安全的组织措施；费用变更索赔条款属商务合同内容，不属安全管理制度。规律：安全制度不谈钱。","expl":""},{"type":"单选","key":"第56题","stem":"不属于安全生产监督检查制度内容的是（　）","options":["安全检查的人员","安全检查执行的标准","安全检查的费用标准","安全检查的内容、方式"],"answer":"C","why":"安全生产监督检查制度应明确检查人员、执行标准、检查内容与方式；安全检查的费用标准属财务成本范畴，不属监督检查制度内容。与上题同规律：钱的问题不进安全制度。","expl":""},{"type":"多选","key":"第57题","stem":"安全防护用品发放、使用和管理制度应明确（　）","options":["用品的种类","用品的使用范围","用品合格标准","用品领用程序","用品寿命周期"],"answer":"ABDE","why":"安全防护用品制度应明确用品种类、使用范围、领用程序和寿命周期；用品合格与否以国家标准、行业标准为准，企业制度无需自行规定“合格标准”，故C不选。","expl":""},{"type":"多选","key":"第58题","stem":"安全生产管理持证上岗制度应明确（　）","options":["安全生产管理岗位、证件名称","持证人员资格条件","持证上岗考核内容","持证上岗考核费用","所持证书的有效期"],"answer":"AE","why":"安全生产管理持证上岗制度应明确安全生产管理岗位及证件名称、所持证书的有效期，便于对证上岗、按期复审换证；资格条件、考核内容与费用由考核管理规定另行明确，不属该制度必备事项。","expl":""},{"type":"单选","key":"第59题","stem":"企业设备设施安全管理定期检测、检验制度不明确 （　）","options":["企业必须进行定期检测的设备种类、名称、数量","有权进行检测的部门或人员","检测、检验费用的执行标准","监测的标准及检测结果管理"],"answer":"C","why":"设备设施定期检测检验制度应明确检测设备的种类名称数量、有权检测的部门人员、检测标准及结果管理；检测检验费用的执行标准由财务规定，不属该制度内容。规律：费用问题不进安全制度。","expl":""},{"type":"单选","key":"第60题","stem":"企业安全生产管理制度的制定步骤应为 （　）","options":["起草一征求意见一签发一审核一发布一培训一反馈一持续改进","反锁一起草一征求意见一签发一审核一发布一培训一持续改进","起草一征求意见-审核一签发一发布一培训一反馈一持续改进","反馈一起草一征求意见一审核一签发一发布一持续改进一培训"],"answer":"C","why":"制度制定流程为：起草、征求意见、审核、签发、发布、培训、反馈、持续改进。A把签发排在审核之前，未审先签不合逻辑；B、D把反馈放最前，颠倒了闭环顺序。口诀“草征审签发，训馈改”。","expl":""},{"type":"单选","key":"第61题","stem":"企业制定安全生产管理制度的准备过程中,审核工作的正确做法是（　）","options":["制度在征求意见时,不能达成一致,则应由分管领导组织讨论","涉及规范标准的制度,应由企业负责法务的部门进行合规性审查","涉及全员性的制度,应经过职工代表大会或职工代表进行审核","专业技术性较强的管理制度,应由企业安全主管部门负责审核"],"answer":"C","why":"涉及全员性的制度应经职工代表大会或职工代表审核，体现职工参与和民主管理，C正确；征求意见不一致应由牵头部门协调讨论，涉及规范标准的应做标准化合规审查，专业技术性强的应由技术部门审核。","expl":""},{"type":"单选","key":"第62题","stem":"涉及全局性综合管理的安全生产管理制度,应由企业 （　）签发","options":["主要负责人","主管生产的领导或总工程师","安全主管部门","技术管理部门"],"answer":"A","why":"涉及全局性、综合管理的安全生产制度须由企业主要负责人签发，体现其对安全生产全面负责；主管生产领导或总工程师签发的是技术类制度，部门无权签发全局性制度。签发权限对应责任层级。","expl":""}]};
const L = 'ABCDE';
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
document.getElementById('list').innerHTML = QUIZ.questions.map((q, i) => {
  let opts;
  if (q.type === '判断') {
    opts = ['对','错'].map(t => `<div class="opt ${t===q.answer?'right':''}">${t}</div>`).join('');
  } else {
    opts = q.options.map((o,k) => `<div class="opt ${q.answer.includes(L[k])?'right':''}"><b>${L[k]}</b>　${esc(o)}</div>`).join('');
  }
  const expl = (q.why ? esc(q.why) + '<br>' : '') + (q.expl ? '<b class="h">📖 详细讲解：</b><br>' + esc(q.expl) : (q.why || q.expl ? '' : '（讲解待补，先记答案）'));
  return `<div class="q">
    <div class="qno"><span class="badge">${q.type}</span>第 ${i+1} 题${q.key && q.key.startsWith('附') ? '（附录）' : ''}</div>
    <div class="stem">${esc(q.stem)}</div>
    ${opts}
    <div class="ansline">✔ 答案：${q.answer}</div>
    <div class="expl">${expl}</div>
  </div>`;
}).join('');
</script>
