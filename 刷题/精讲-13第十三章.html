<script>
const QUIZ = {"title":"第十三章","questions":[{"type":"判断","key":"第1题","stem":"通信管道施工前,项目部需要对沿线地理、环境等情况进行综合调查,将管道路由走向所遇到的河流、铁路、公路、电力线及其他情况进行详细记录。（　）","options":[],"answer":"对","why":"依据通信管道施工安全规程，施工前须沿管道路由综合调查，详细记录沿线河流、铁路、公路、电力线等障碍情况，为制定施工方案和安全措施提供依据，说法正确。","expl":""},{"type":"单选","key":"第2题","stem":"通信管道工程施工阶段堆放机具、材料需要选择不妨碍交通、行人少、地面平整的地方;堆积高度一般不超过 （　）米。","options":["1.0","1.2","1.5","2.0"],"answer":"C","why":"依据管道施工安全规程，机具材料应堆放在不妨碍交通、地面平整处，堆积高度一般不超过1.5米，防倒塌伤人。数字记忆：堆高1.5米封顶；2.0米过高易塌堆，属干扰项。","expl":""},{"type":"多选","key":"第4题","stem":"施工中,如遇有毒、有害气体或液体管道泄漏,施工人员应（　）","options":["立即撤至安全地点","及时报有关单位修复","立即进行抢修","设置围栏警示标志","向建设单位打停工报告"],"answer":"ABD","why":"依据先撤人、设警戒、再报告的应急处置原则，应立即撤至安全地点、报有关单位修复并设置围栏警示。干扰项C立即抢修错误：施工人员无专业防护，盲目抢修会中毒并扩大事故。","expl":""},{"type":"单选","key":"第5题","stem":"在管道路由测量移动大标旗或指挥旗时,遇到（　）应将大标旗或指挥旗平放倒或收起。","options":["行驶的汽车","行驶的火车","结婚车队","放学的学生"],"answer":"B","why":"依据测量作业安全要求，遇行驶的火车应将大标旗、指挥旗平放倒或收起，防止火车司机误认行车信号。干扰项汽车、学生不涉及铁路信号辨识，只有火车对旗帜信号最敏感。","expl":""},{"type":"单选","key":"第6题","stem":"开挖土石方作业时,挖出的土、石,不得堆在 （　）上。","options":["在用光缆路由","消防栓井","绿化草坪","盲道"],"answer":"B","why":"依据城市道路施工安全规定，挖出土石严禁压在消防栓井上，否则火灾时妨碍开启取水，危及应急安全。草坪、盲道虽也不宜堆土，但消防栓井是规程明令禁止项，为本题考点。","expl":""},{"type":"单选","key":"第8题","stem":"土方开挖时,挖出的土、石应堆放在距离沟、坑边沿（　）以外,使土、石不致回落于沟内。","options":["0cm","40cm","50cm","60cm"],"answer":"D","why":"依据土方开挖安全规程，挖出的土石应堆放在距沟坑边沿60厘米以外，防止土石回落沟内砸伤人员。数字记忆：60厘米；40、50厘米距离不足，属干扰数字。","expl":""},{"type":"单选","key":"第9题","stem":"开挖土石方如遇有地下不明物品或古墓、文物,应立即 （　）","options":["回填复原","取出文物上交","掩埋文物","报告上级处理"],"answer":"D","why":"依据《文物保护法》规定，境内地下遗存的文物属国家所有。遇地下不明物品或古墓文物应立即停工并报告上级处理；擅自取出上交、掩埋或回填复原均属违法，还可能损毁文物。","expl":""},{"type":"单选","key":"第10题","stem":"管道沟开挖时,当流沙、疏松土质的沟深超过（　） 时,应当安装挡土板。","options":["1 米","1.2 米","1.5 米","1.8 米"],"answer":"A","why":"依据管道施工安全规程，流沙、疏松土质沟深超过1米即应安装挡土板支撑沟壁。数字记忆：流沙松土1米设板；1.2、1.5、1.8米均比规程限值深，照此施工会塌方伤人。","expl":""},{"type":"多选","key":"第11题","stem":"不得使用机械开挖沟、槽、洞、坑的地段包括 （　）","options":["稻田地","地下有电力线缆","地下有自来水管","地下有污水管","大树旁"],"answer":"BCD","why":"依据地下管线保护要求，地下有电力线缆、自来水管、污水管的地段不得机械开挖，防挖断管线造成触电、停水、污染。稻田地、大树旁不属管线禁挖地段，可机械配合开挖。","expl":""},{"type":"单选","key":"第12题","stem":"不得使用机械挖沟,并应指定有经验的工人人工轻挖开挖的地段是（　）","options":["施工图上标有地下物的高程","施工图上未标地下物的高程","高压电力输电线路正下方","长途输气管道交叉点"],"answer":"B","why":"依据管线保护规程，施工图未标明地下物高程时不得机械挖沟，应指定有经验工人人工轻挖探明。干扰项A图上已标高程可机械避让开挖；高压线下、输气管道交叉点另有专门协调措施。","expl":""},{"type":"单选","key":"第13题","stem":"使用电动打夯机夯实回填土时,手柄上应装按钮开关,并做绝缘处理;操作人员应（　）。","options":["戴绝缘手套","穿防滑鞋","背向打夯机牵引","戴护目镜"],"answer":"A","why":"依据电动工具安全使用要求，打夯机手柄按钮须绝缘处理，操作人员应戴绝缘手套防止漏电触电。干扰项防滑鞋、护目镜不针对电击这一主要危害，绝缘防护才是关键。","expl":""},{"type":"单选","key":"第14题","stem":"在隧道内回填土时,正确的操作是 （　）","options":["一次拆除所有的护土板和撑木架","回填后一次性夯实","无法夯实时用砖、石填实","全部采用混凝土浇筑"],"answer":"C","why":"依据隧道回填安全要求，无法夯实的部位应用砖、石填实。干扰项A一次拆除全部护土板撑木架会立即塌方；B应边回填边分层夯实；D混凝土浇筑不符合回填工艺要求。","expl":""},{"type":"单选","key":"第15题","stem":"钢筋冷拉作业时,拉筋速度宜慢不宜快,操作人员要位于安全地带在钢筋两侧（　）米以内及拉筋两端不得有人。","options":["1.5","2.0","2.5","3.0"],"answer":"D","why":"依据钢筋冷拉作业安全要求，冷拉速度宜慢不宜快，钢筋两侧3米以内及拉筋两端不得站人，防钢筋崩断弹射伤人。数字记忆：冷拉危险区3米；1.5、2.0、2.5米范围不足。","expl":""},{"type":"单选","key":"第16题","stem":"拆除挡土板时,如有塌方危险,应（　）","options":["先部分回填夯实再拆","先完成回填作业再拆","更换危险处的挡土板","等塌方后再处理再拆"],"answer":"A","why":"依据挡土板边回填、边拆除的原则，发现有塌方危险应先部分回填夯实再拆，让回填土支撑沟壁。干扰项B全部回填后再拆违背配合顺序，C更换挡土板反而扰动沟壁更危险。","expl":""},{"type":"单选","key":"第17题","stem":"在沟内捣实混凝土时,拍浆人员要穿(戴) （　）","options":["绝缘手套","防护背心","防护鞋","安全带"],"answer":"C","why":"依据沟内混凝土捣实作业防护要求，拍浆人员应穿防护鞋，防水泥浆腐蚀皮肤和落物砸脚。干扰项绝缘手套是电工防护，安全带用于高处作业，均与本工序危害不对应。","expl":""},{"type":"多选","key":"第18题","stem":"定向钻钻孔过程中,操作人员应仔细观察钻机的（　）的读数,发现钻机出现异常等情况时,应立即停机检查。","options":["回转油压表","泥浆压力表","蓄水箱水位","发动机水温表","给进油压表"],"answer":"ABE","why":"依据定向钻操作规程，钻孔中应监视回转油压表、泥浆压力表、给进油压表读数，异常立即停机。干扰项蓄水箱水位、发动机水温属常规设备参数，反映不了孔内钻进与孔壁安全状态。","expl":""},{"type":"单选","key":"第19题","stem":"定向钻作业完成后,拆除作业在断开任何管路之前,应先 （　）","options":["保持额定压力","关闭阀门","检查泄露点","释放压力"],"answer":"D","why":"依据管路设备拆装安全规程，断开任何管路前必须先释放压力，带压拆卸会使管路甩动、浆液喷射伤人。干扰项关闭阀门只能切断来路，管内余压仍在，隐患并未消除。","expl":""},{"type":"单选","key":"第20题","stem":"砌筑作业中,脚手架上堆砖高度不得超过 （　）","options":["层平砖","3 层平砖","2 层侧砖","3 层侧砖"],"answer":"D","why":"依据砌筑作业安全规程，脚手架上堆砖高度不得超过3层侧砖。记忆口诀：侧砖三层为限。干扰项平砖堆放不稳且层数说法混淆，2层侧砖偏低、3层平砖过高，均不符规程。","expl":""},{"type":"多选","key":"第21题","stem":"关于人井砌筑作业的说法,正确的有 （　）。","options":["不得在新砌的人孔墙壁顶部行走","在进行人孔底部抹灰作业时,人孔上方不得有人","起吊和安装人孔上覆时,人孔内不得有人","抬运人孔回圈至少要有两人","砌筑作业面下方不得有人"],"answer":"ACE","why":"依据人井作业安全规程：新砌墙壁顶部不得行走、起吊上覆时孔内不得有人、作业面下方不得有人均正确。B的表述与规程上方防落物情形不符；D口圈沉重，须专人指挥多人配合，仅两人难以保证安全。","expl":""},{"type":"单选","key":"第22题","stem":"管道试通作业时,大孔管道试通,应 （　） 试通。","options":["用穿管器带试通棒","使用试通线","使用试通管","使用穿管器支架"],"answer":"C","why":"依据管道试通规程，大孔管道应使用试通管试通，检验管孔顺直与净空。干扰项穿管器带试通棒、试通线适用于小孔径管道，用于大孔无法全面反映管孔状况。","expl":""},{"type":"单选","key":"第23题","stem":"线路测试或检修时,应先断开外揽与设备的连接,以免（　）","options":["损害设备","损害仪表","伤及人眼","影响测试精度"],"answer":"A","why":"依据线路测试检修安全要求，应先断开外缆与设备的连接再测试，防止感应电压、浪涌窜入损害在线运行设备。干扰项损害仪表、伤及人眼均非主要原因，保护设备才是规程本意。","expl":""},{"type":"单选","key":"第24题","stem":"在（　） 测量时,严禁使用金属标杆、塔尺","options":["地下输电线路的地面","城市繁华地段","高速公路红线内","一级光缆干线旁"],"answer":"A","why":"依据防触电安全要求，在地下输电线路的地面测量时严禁使用金属标杆、塔尺，金属杆触及地下电缆会导电伤人。干扰项繁华地段、高速红线是交通风险场景，与金属工具禁令无关。","expl":""},{"type":"单选","key":"第25题","stem":"人工立杆时,在杆梢下方的适当位置应当系好牵引绳,拉动牵引绳的人员应（　）,拉绳时用力均匀,控制好电杆的立起方向。","options":["面对电杆","背对电杆","侧对电杆","面对电立起方向"],"answer":"A","why":"依据人工立杆安全要求，拉牵引绳人员应面对电杆，便于观察杆身动向、及时避让倒杆。干扰项背对电杆无法监控险情，遇倒杆躲避不及；侧对或面向起立方向均不利于全程观察。","expl":""},{"type":"单选","key":"第26题","stem":"使用吊车立杆时,钢丝吊绳应牢固地拴在（　） 的适当位置","options":["偏向杆根","偏向杆梢","杆身中间","杆重心点"],"answer":"B","why":"依据吊车立杆操作规程，吊绳应拴在偏向杆梢的适当位置，起吊后杆根先着地，便于控制方向、对孔就位。干扰项拴在杆根或杆身中间会使电杆起吊失衡摆动，易砸伤人员。","expl":""},{"type":"单选","key":"第27题","stem":"终端拉线用的钢绞线应比吊线（　） 级,并保证拉距。","options":["小一","同一","大一","大两"],"answer":"C","why":"依据拉线受力设计要求，终端拉线承受整档吊线张力，钢绞线规格应比吊线大一级并保证拉距。干扰项选同一级或小一级强度不足，紧线受力时可能拉断拉线酿成倒杆事故。","expl":""},{"type":"单选","key":"第28题","stem":"架设吊线选择紧线器时,要求（　）","options":["不得以大代小","可以以小代大","可以以大代小","不得没有余量"],"answer":"A","why":"依据紧线器选用要求，紧线器规格应与吊线匹配，不得以大代小。干扰项以大代小看似更结实，实际钳口与线径不匹配会咬伤吊线、滑脱伤人；以小代大强度不够更危险。","expl":""},{"type":"单选","key":"第29题","stem":"关于吊线架设的说法正确的是（　）","options":["在已有旧吊线的杆路上新增吊线,跨越公路时可用临时辅助吊线挂高吊线","在新建杆路上架设吊线,跨越铁路时可用吊线滑轮的办法升高吊线","若吊线在低压电力线下方交叉通过,布放时必须设专人用绝终棒托住钢绞线","在树枝间穿越时,不得使树枝挡压或撑托钢绞线"],"answer":"D","why":"依据架空线路架设规程，吊线在树枝间穿越时不得让树枝挡压或撑托钢绞线，防磨损断股和风摆碰线。干扰项A、B的升高吊线做法不符合跨越公路、铁路的合规要求；C在电力线下方托举钢绞线极易失控碰线触电。","expl":""},{"type":"单选","key":"第30题","stem":"收紧拉线或吊线时,扳动紧线器以两人为限,操作时作业人员应在紧线器的 （　）B 左后侧或右后侧","options":["左前侧或右前侧","左后侧或右前侧","左前侧或右后侧"],"answer":"B","why":"依据紧线作业安全要求，扳动紧线器以两人为限，人员应站在紧线器左后侧或右前侧，避开受力线断裂回弹的弹射面。干扰项组合中处于正前侧的站位首当其冲，最为危险。","expl":""},{"type":"单选","key":"第31题","stem":"如紧线时遇到导、地线有卡、挂现象,处理时操作人员应站在卡线处的 （　） 侧。","options":["内","外","后","前"],"answer":"C","why":"依据紧线作业安全要求，导地线卡挂时处理人员应站在卡线处后侧，线绳突然解脱回弹时后方是安全躲避位。干扰项内侧正处受力反弹路径上，站在内、外、前侧均易被弹伤。","expl":""},{"type":"单选","key":"第32题","stem":"使用手扳葫芦收紧电缆布线时,应（　）","options":["将手扳葫芦放置平稳","将安全带固定牢固","指挥杆上人作业","让杆上人独立作业"],"answer":"A","why":"依据手扳葫芦使用安全要求，使用前应放置平稳、固定牢靠，受力时才不会滑脱坠落伤人。干扰项安全带固定、杆上人员配合虽有必要，但不是手扳葫芦本体操作的前提要求。","expl":""},{"type":"单选","key":"第33题","stem":"在旧杆位更换电杆的做法正确的是 （　）","options":["旧电杆拔出腾位立新杆","紧靠旧电杆先立新杆","立新杆不得利用旧杆","拆旧杆不得利用新杆"],"answer":"B","why":"依据换杆作业规程，应紧靠旧电杆先立新杆，再借助新杆拆除旧杆，新旧杆互相支撑更安全。干扰项先拔旧杆腾位会使杆坑扰动、倒杆风险大；不得利用旧杆、新杆的说法与规程相反。","expl":""},{"type":"单选","key":"第36题","stem":"使用吊板挂放光缆,坐吊板过吊线接头时,应使用 （　）","options":["另一吊板","安全绳","梯子","脚扣"],"answer":"C","why":"依据吊板作业安全要求，坐吊板过吊线接头时应改用梯子跨越，因接头处卡板不平，吊板无法平稳通过。干扰项安全绳是全程防坠保护用品，不能替代跨越接头的登高工具。","expl":""},{"type":"单选","key":"第37题","stem":"架空光缆布放不得使用吊板作业的情况是 （　）","options":["在电力线 1M 处的吊线上","在 7/2.7 规格的吊线上","在电杆与墙壁之间的吊线上","在跨越水田的杆档"],"answer":"C","why":"依据吊板使用规定，电杆与墙壁之间的吊线跨度短、净空小，吊板摆动易碰撞坠落，不得用吊板挂放光缆。其余情形在满足与电力线安全距离、吊线规格达标等条件下可以使用吊板。","expl":""},{"type":"判断","key":"第40题","stem":"吹缆作业中,闻到汽油异味较浓时,可先用手直接触摸检查燃料是否溢出和泄漏,必要时应停机。（　）","options":[],"answer":"错","why":"该说法错误。依据易燃物品安全操作要求，闻到汽油异味较浓应立即停机检查，严禁用手直接触摸检查燃油是否泄漏，手摸既定位不准又可能引发静电起火，应停机后目视检查。","expl":""},{"type":"单选","key":"第41题","stem":"防止排流线端头脱落反弹伤人,布放排流线应（　）进行作业。","options":["使用放线车","盘 8 字方式","边放边埋方式","预应力拉直方式"],"answer":"A","why":"依据排流线布放安全要求，应使用放线车展放，线盘受控转动，防止线端头脱落反弹伤人。干扰项盘8字、边放边埋、预应力拉直都难以控制线盘回弹张力，存在崩伤风险。","expl":""},{"type":"单选","key":"第42题","stem":"在供电线路或电力设施附近作业时,作业人员必须 （　）、戴绝缘手套,穿绝终鞋和使用绝缘工具。","options":["戴安全帽","穿防护服装","使用绝缘棒","系安全"],"answer":"A","why":"依据电力线路附近作业防护规定，作业人员必须戴安全帽、戴绝缘手套、穿绝缘鞋并使用绝缘工具。干扰项防护服、绝缘棒、安全带虽是常用防护用品，但不是规程此处明列的组合要求。","expl":""},{"type":"单选","key":"第43题","stem":"在供电线路或电力设施附近作业时,上杆作业可以不用佩戴的物品包括 （　）。","options":["安全帽","绝终手套","防护眼镜","安全带"],"answer":"C","why":"依据杆上作业防护规定，必须佩戴安全帽、绝缘手套、安全带等；防护眼镜不属上杆作业必配项。干扰项安全帽、绝缘手套、安全带均为规程明确要求，防护眼镜针对的是钻孔打磨类工序。","expl":""},{"type":"单选","key":"第44题","stem":"规范要求,在 10KV 的高压线附近架空作业时,作业人员离开高压线最小距离必须保证 （　） M。","options":["1.0","2.5","3.0","4.0"],"answer":"B","why":"依据通信线路与电力线安全距离规定，在10kV高压线附近架空作业，人员离开高压线最小距离必须保证2.5米。数字记忆：10kV保2.5米；3.0、4.0米非本题规程限值。","expl":""},{"type":"单选","key":"第46题","stem":"当施工人员在 10KV 的高压线附近进行作业时其身体 (含超出身体以外的金属工具或物件) 离开高压线最小间距应保证 （　）","options":["1.5 米","2.5 米","4 米","8 米"],"answer":"B","why":"依据安全距离规定，在10kV高压线附近作业，身体连同超出身体的金属工具物件与高压线最小间距应保证2.5米。记忆要点：金属延伸物一并计入距离，其余选项数值不符规程。","expl":""},{"type":"单选","key":"第48题","stem":"当电信电缆与电力线合杆时,电力线与电信电缆间净距不应小于（　）,且电信电缆应架设在电力线路的下部。","options":["0.5m","1.5m","2.5m","3m"],"answer":"C","why":"依据通信线路合杆建设规定，电信电缆与电力线合杆时净距不应小于2.5米，且电信电缆架设在电力线下部，防电力线坠落到通信线上。数字记忆：合杆净距2.5米；1.5、2米净距不足。","expl":""},{"type":"单选","key":"第49题","stem":"光缆与低压电力线垂直或交叉跨越时必须做绝缘光缆保护,绝缘长度应超过电力线交叉跨越两端跨度（　）以上。","options":["1 米","1.5 米","2 米","2.5 米"],"answer":"B","why":"依据交越防护要求，光缆与低压电力线垂直或交叉跨越时须做绝缘保护，绝缘长度应超出交叉跨越两端跨度各1.5米以上。数字记忆：绝缘延伸1.5米；其余数值与规程不符。","expl":""},{"type":"多选","key":"第50题","stem":"通信线路施工中,当发现通信线与电力线接触或电力线落在地面上时,施工人员正确的做法有 （　）。","options":["停止一切作业","保护现场.","立即报告项目负责人","换到别处施工","用手背验证是否有电"],"answer":"ABC","why":"依据触电事故预防要求，发现通信线与电力线接触或电力线落地，应停止一切作业、保护现场并立即报告项目负责人。干扰项换到别处施工是放任隐患；用手背验证是否带电是严重违章，徒手必触电。","expl":""},{"type":"多选","key":"第52题","stem":"在运行的电源分支柜中操作时,应采取的必要措施包括 （　）","options":["由专业人员操作","金属工具绝终保护","操作人员穿戴静电防护服","操作人员佩戴触电报警安全帽","采取防止螺丝材料掉落措施"],"answer":"ABE","why":"依据机房电源柜作业安全要求，应由专业人员操作、金属工具做绝缘保护、采取措施防止螺丝材料掉入柜内引发短路。静电防护服针对静电敏感检修，触电报警安全帽非常规配置，均非必要措施。","expl":""},{"type":"多选","key":"第54题","stem":"对铁件钻孔时,符合规范的操作有 （　）","options":["应用力均匀","铁件应夹紧","铁件不得摆动","及时加注机油","若卡住钻头应摆动钻头"],"answer":"ABCD","why":"依据铁件钻孔安全操作规程，用力均匀、铁件夹紧、不得摆动、及时加注机油均正确。干扰项E钻头卡住时摆动钻头会使铁件甩脱或钻头折断伤人，正确做法是停机断电处理。","expl":""},{"type":"多选","key":"第55题","stem":"铁件去锈和喷刷漆时,作业人员应戴（　）的防护工序。","options":["口罩","手套","安全帽","安全带","绝缘鞋"],"answer":"AB","why":"依据去锈喷漆职业健康防护要求，本工序主要危害是粉尘和漆液刺激，作业人员应戴口罩、手套。干扰项安全帽、安全带、绝缘鞋针对高处和用电作业，与本工序危害因素不对应。","expl":""},{"type":"单选","key":"第57题","stem":"交流配电屏的中性线应与机架 （　）","options":["连通","绝缘","通过电缆复接","通过开关隔断"],"answer":"B","why":"依据通信电源安装规范，交流配电屏的中性线应与机架绝缘，防止零线电流窜入机架造成设备干扰和漏电。干扰项连通、电缆复接会造成零地混接，通过开关隔断也无必要。","expl":""},{"type":"多选","key":"第58题","stem":"设备安装工程中,关于线缆布放的说法符合规范的有 （　）","options":["交流线、直流线、信号线应分开布放","电源线中间严禁有接头,","非同一级电力电缆不得穿放在同一管孔内","开口式线鼻子制作端头应用专用压接工具压接","6mm2 的单股铜芯电源线终端应加装线鼻子"],"answer":"ABC","why":"依据机房布线及电源安装规范：交直流线、信号线应分开布放防干扰，电源线中间严禁接头防发热，非同级电力电缆不得同管孔。D开口式线鼻子端头应焊接处理，E单股铜芯线可直接制作接头，均说法错误。","expl":""},{"type":"单选","key":"第59题","stem":"铜汇流排在过墙体或楼层孔洞时,应采用 （　） 连接","options":["软铜母线","硬铜母线","铜芯电缆","铝芯电缆"],"answer":"A","why":"依据汇流排安装规范，铜汇流排穿越墙体或楼层孔洞时应采用软铜母线连接，适应建筑物沉降伸缩，防止硬母线被拉断。干扰项硬铜母线无缓冲，铜芯电缆连接不符合母线安装工艺。","expl":""},{"type":"单选","key":"第60题","stem":"汇流排在过墙体或楼层孔洞时,洞口处两端接头应处于墙体或松板洞孔外,并在墙体外的两侧用 （　）与墙体固定。","options":["镀锡接头排","镀锌钢支撑","不锈钢支撑","绝缘子支撑"],"answer":"D","why":"依据母线安装规范，接头应处于墙体或洞孔之外，并在墙外两侧用绝缘子支撑与墙体固定，既固定母线又保证对地绝缘。干扰项镀锡接头排及各类金属支撑会使母线与建筑电气连通，破坏绝缘。","expl":""},{"type":"单选","key":"第61题","stem":"多片汇流排在同一路由安装时,接头点应 （　）","options":["上下对齐","前后错开","左右对齐","前后对齐"],"answer":"B","why":"依据母线安装规范，多片汇流排同一路由安装时接头点应前后错开，避免接头薄弱处集中在同一断面发热叠加。干扰项上下、左右、前后对齐布置均使隐患集中，检修时还易误碰相邻接头。","expl":""},{"type":"单选","key":"第62题","stem":"汇流排制作完毕,应喷刷绝缘漆,正极喷 （　） 色。","options":["黄","绿","红","蓝"],"answer":"C","why":"依据通信电源色标规定，汇流排制作完毕喷刷绝缘漆，正极喷红色、负极喷蓝色。记忆口诀：正红负蓝。干扰项黄、绿常用作相线色标，蓝是负极色，只有红色对应正极。","expl":""},{"type":"单选","key":"第65题","stem":"为防止静电损伤通信设备,在机房测试设备需要插拔机盘时,应佩戴（　）","options":["专用钥匙","防静电手环","绝缘手套","防静电服"],"answer":"B","why":"依据机房防静电要求，插拔机盘应佩戴防静电手环并良好接地，及时泄放人体静电，防止击穿电路板芯片。干扰项绝缘手套反而阻碍静电泄放，防静电服是整体着装要求，插拔操作关键靠手环。","expl":""},{"type":"单选","key":"第67题","stem":"铁塔安装工程施工,在塔上有作业人员工作期间,（　）不得离开现场,应密切观察塔上作业人员的作业情况,发现违章行为,应及时制止。","options":["指挥人员","安全负责人","技术负责人","项目经理"],"answer":"A","why":"依据铁塔高处作业安全规定，塔上有作业人员工作期间，指挥人员不得离开现场，须密切监视并制止违章。干扰项安全员、项目经理负有管理职责，但全程盯守塔上作业的直接责任在现场指挥人员。","expl":""},{"type":"单选","key":"第68题","stem":"塔上作业时,应以塔基为圆心, （　）为半径,设置施工区,非作业人员不得入内。","options":["塔高的 20%","塔高的 50%","塔高","塔高的 1.05 倍"],"answer":"D","why":"依据铁塔施工警戒区设置要求，应以塔基为圆心、塔高的1.05倍为半径设置施工区。数字记忆：1.05倍塔高，比塔高多5%余量，可覆盖构件坠落范围；20%、50%半径防护不足。","expl":""},{"type":"单选","key":"第71题","stem":"上下塔作业时,两人同时上塔,两人之间距离应保持在 （　）以上。","options":["2 米","2.5 米","3 米","4 米"],"answer":"C","why":"依据上下塔安全规定，两人同时上塔间距应保持3米以上，防止上方人员失手落物砸伤下方人员。数字记忆：塔上间距3米；1.5、2.5米间距不足，4米虽更安全但非规程数值。","expl":""},{"type":"单选","key":"第72题","stem":"在塔上安装天馈线作业中,下列做法正确的是 （　）","options":["四方塔应从塔角攀登","上塔时人间距保持 1.5 米D 上塔累了坐在护栏上休息会","上塔累了坐在护栏上休息会 C 行动速度宜慢不宜快"],"answer":"C","why":"依据铁塔攀登安全要求，上塔行动速度宜慢不宜快。干扰项A四方塔应从有爬梯的塔面攀登而非塔角；B人间距应保持3米以上；D坐在护栏上休息属违章行为，均错误。","expl":""},{"type":"单选","key":"第73题","stem":"需要向塔上吊运物体时,在物体稍离地面时对 （　） 再作一次详细的安全生产检查,若有问题及时处理。","options":["钢丝绳","物体","卷扬机","尾绳"],"answer":"A","why":"依据吊装作业规范，物体稍离地面时应暂停，对钢丝绳吊索再做一次详细安全检查，此时吊索刚完全受力，是断丝断股暴露的时机。干扰项物体、卷扬机、尾绳检查不能替代主受力钢丝绳复查。","expl":""},{"type":"单选","key":"第74题","stem":"铁塔上天线支架若需另加镀锌角钢固定时,不得在（　） 上钻孔或电焊。","options":["角钢","扁钢","抱杆","护栏"],"answer":"A","why":"依据铁塔结构保护要求，天线支架另加镀锌角钢固定时，不得在抱杆上钻孔或电焊，以免削弱塔身主构件强度、破坏镀锌防腐层引发锈蚀。干扰项角钢、扁钢属支架辅材，可按设计加工连接。","expl":""},{"type":"单选","key":"第82题","stem":"根据电信设施接地要求,下列不得连通的设备或构件是 （　）","options":["金属坚井之间","金属槽道之间","走线架与列走线架之间","室内走线架与室外走线架间"],"answer":"D","why":"依据通信局站防雷接地要求，室内走线架与室外走线架之间不得连通，防止雷击时室外浪涌经走线架引入机房损坏设备。干扰项金属竖井、槽道、走线架等机房内构件均要求连通后统一接地。","expl":""},{"type":"多选","key":"第83题","stem":"通信铁塔上安装的天馈线,其金属外护层应按设计要求在（　）分别就近接地。","options":["塔顶","离塔处","机房内侧","转弯处","机房外侧"],"answer":"ABE","why":"依据天馈线防雷接地要求，馈线金属外护层应在塔顶、离塔处、机房外侧三处分别就近接地，分段泄放感应雷电流。干扰项转弯处不是规定接地点，机房内侧不符合就近、外侧接地要求。","expl":""},{"type":"单选","key":"第84题","stem":"移动通信铁塔天馈线安装时,其室外馈线防雷接地一般要求进行（　）接地方。","options":["单点","二点","三点","四点"],"answer":"C","why":"依据馈线防雷接地一般要求，室外馈线应进行三点接地。记忆口诀：塔上一点、离塔一点、机房外一点。单点、二点无法分段泄放感应雷电流，四点无必要，三点是规范做法。","expl":""},{"type":"单选","key":"第85题","stem":"规范规定当铁塔高于 （　） 米时,天馈线的金属外护层应在塔身中部需增加接地点。","options":["0 米","50 米","60 米","70 米"],"answer":"C","why":"依据天馈线接地规定，铁塔高于60米时，天馈线金属外护层应在塔身中部增加一处接地点。数字记忆：塔高60米加接地点；50米、70米与规程数值不符。","expl":""},{"type":"单选","key":"第89题","stem":"在建设单位委托有监理的通信设施拆除工程中,（　）负责全面监督各项安全技术措施的实施。","options":["项目经理","监理工程师","安全员","技术负责人"],"answer":"B","why":"依据《建设工程安全生产管理条例》，实行监理的拆除工程，监理工程师负责全面监督各项安全技术措施的实施。干扰项安全员负责日常检查、项目经理负责组织实施，全面监督是监理的法定职责。","expl":""},{"type":"单选","key":"第92题","stem":"局站通信设施拆除施工顺序应遵循下列原则,正确的是 （　）","options":["先拆除主用电路,后拆除备用电路","先拆除群路,后拆除支路","先拆除线缆,后拆除设备","先拆除走线架,后拆除设备"],"answer":"C","why":"依据拆除作业先易后难、先附件后主体的原则，局站拆除应先拆线缆、后拆设备。干扰项A应先拆备用后拆主用电路防业务中断；B先群路后支路会引发业务全阻；D先拆走线架则线缆设备失去承托。","expl":""},{"type":"判断","key":"第95题","stem":"拆除接地线时,应先拆除接地端,再拆除导体端。 （　）","options":[],"answer":"错","why":"该说法错误。依据接地线装拆倒序原则：装设时先接接地端后接导体端，拆除时先拆导体端后拆接地端，使接地保护始终在位；先拆接地端会让导体端失去接地保护，一旦带电后果严重。","expl":""},{"type":"单选","key":"第98题","stem":"在通信设施拆除施工安全用电中,下面做法正确的是 （　）","options":["施工现场中的配电线路采用铝芯阻燃电力电缆","施工现场中的配电线路室外电缆在专用电线杆上架空敷设","拆除使用的手持式电动工具,绝缘性能达标时,其金属外壳可不接地保护","负荷线采用耐气候型的橡皮护套铜芯软电缆,中间接头不得超过 2 处"],"answer":"B","why":"依据施工现场临时用电安全规范，室外配电电缆应在专用电线杆上架空敷设。干扰项A现场配电线路应用铜芯电缆不得用铝芯；C手持电动工具金属外壳必须做接地保护；D负荷线中间严禁接头，不超2处错误。","expl":""}]};
const KEY = 'jingjiang_' + QUIZ.title;
let answers = [], sel = [], locked = [];

function save() { try { localStorage.setItem(KEY, JSON.stringify({ answers, sel, locked })); } catch(e) {} }
function loadSaved() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.answers) { answers = s.answers; sel = s.sel; locked = s.locked; } } catch(e) {} }
function clearAll() { if (confirm('确定清空本章答题记录，从头再做吗？')) { localStorage.removeItem(KEY); location.reload(); } }

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
const L = 'ABCDE';
function optsHtml(i) {
  const q = QUIZ.questions[i];
  if (q.type === '判断') {
    return '<div class="tf">' + ['对','错'].map(t => {
      let cls = 'opt';
      if (locked[i]) cls += t === q.answer ? ' right' : (answers[i].mine === t ? ' wrong' : '');
      return `<button class="${cls}" ${locked[i]?'disabled':''} onclick="pick(${i},'${t}')">${t}</button>`;
    }).join('') + '</div>';
  }
  return q.options.map((o, k) => {
    const lt = L[k];
    let cls = 'opt';
    if (locked[i]) cls += q.answer.includes(lt) ? ' right' : (answers[i].mine.includes(lt) ? ' wrong' : '');
    else cls += (sel[i]||[]).includes(lt) ? ' sel' : '';
    return `<button class="${cls}" ${locked[i]?'disabled':''} onclick="pick(${i},'${lt}')"><b>${lt}</b>　${esc(o)}</button>`;
  }).join('') + (q.type === '多选' && !locked[i] ? `<button class="confirm" ${(sel[i]&&sel[i].length)?'':'disabled'} onclick="confirmMulti(${i})">确　认</button>` : '');
}
function verdictHtml(i) {
  const q = QUIZ.questions[i];
  if (!locked[i]) return '';
  const a = answers[i];
  let h = a.ok
    ? `<div class="vline">✅ 答对了</div>`
    : `<div class="vline">❌ 答错了 · 你选 ${esc(a.mine)} · 正确答案 <u>${q.answer}</u></div>`;
  if (q.why) h += esc(q.why) + '<br>';
  if (q.expl) h += `<b class="h">📖 详细讲解：</b><br>` + esc(q.expl);
  return `<div class="verdict ${a.ok?'ok':'no'}">${h}</div><button class="re" onclick="redo(${i})">↺ 重新做这题</button>`;
}
function renderQ(i) {
  const q = QUIZ.questions[i];
  document.getElementById('q' + i).innerHTML =
    `<div class="qno"><span class="badge">${q.type}</span>第 ${i+1} 题${q.key && q.key.startsWith('附') ? '（附录）' : ''} · ${q.key || ''}</div>` +
    `<div class="stem">${esc(q.stem)}</div>` + optsHtml(i) + verdictHtml(i);
  updateBar();
}
function renderAll() {
  document.getElementById('list').innerHTML = QUIZ.questions.map((q,i)=>`<div class="q" id="q${i}"></div>`).join('');
  QUIZ.questions.forEach((_,i)=>renderQ(i));
}
function updateBar() {
  document.getElementById('pdone').textContent = answers.filter(a=>a).length;
  document.getElementById('pok').textContent = answers.filter(a=>a&&a.ok).length;
}
function pick(i, v) {
  if (locked[i]) return;
  const q = QUIZ.questions[i];
  if (q.type !== '多选') submit(i, [v]);
  else { sel[i] = sel[i] || []; const k = sel[i].indexOf(v); k>=0 ? sel[i].splice(k,1) : sel[i].push(v); save(); renderQ(i); }
}
function confirmMulti(i) { if (sel[i] && sel[i].length) submit(i, [...sel[i]].sort()); }
function submit(i, vals) {
  const q = QUIZ.questions[i];
  const std = q.type === '判断' ? q.answer : q.answer.split('').sort().join('');
  const mine = q.type === '判断' ? vals[0] : vals.join('');
  answers[i] = { mine, ok: mine === std };
  locked[i] = true;
  save(); renderQ(i);
}
function redo(i) {
  answers[i] = null; locked[i] = false; sel[i] = sel[i] ? sel[i].splice(0, sel[i].length) && null : null;
  save(); renderQ(i);
}
function copyAns() {
  const text = answers.map((a,i)=>a?`${i+1}${a.mine}`:null).filter(Boolean).join(' ') || '（还没答题）';
  const done = () => { const b = document.getElementById('copybtn'); b.textContent = '✅ 已复制，去聊天粘贴'; setTimeout(()=>b.textContent='📋 复制已答成绩', 2000); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(done); else done();
}
answers = new Array(QUIZ.questions.length).fill(null);
sel = new Array(QUIZ.questions.length).fill(null);
locked = new Array(QUIZ.questions.length).fill(false);
loadSaved();
renderAll();
</script>
</body>
</html>
