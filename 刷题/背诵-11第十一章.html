<script>
const QUIZ = {"title":"第十一章","questions":[{"type":"单选","key":"第1题","stem":"作业人员对于施工现场的火灾事故防范应做到三懂三会,其中三懂不包括 （　）。","options":["懂本岗位的火灾危险性","懂预防火灾的措施","懂火灾扑救的方法","懂消防器材的设置要求"],"answer":"D","why":"“三懂”指懂本岗位火灾危险性、懂预防火灾的措施、懂火灾扑救的方法；“懂消防器材的设置要求”不在其列，会用器材属于“三会”范畴，勿把“懂”与“会”混淆。","expl":""},{"type":"多选","key":"第2题","stem":"燃烧的特征包括（　）,这也是区分燃烧和非燃烧的依据","options":["发光","发热","生成新物质","可燃物","助燃物"],"answer":"ABC","why":"燃烧是可燃物与氧化剂之间发生的发光、发热、生成新物质的剧烈氧化反应，这三大特征也是区分燃烧与非燃烧的依据；“可燃物、助燃物”是燃烧条件而非特征，属概念混淆。","expl":""},{"type":"多选","key":"第3题","stem":"燃烧过程的发生和发展须具备的必要条件包括 （　）","options":["引火源","还原剂","发光","可燃物","氧化剂"],"answer":"ADE","why":"燃烧三要素为可燃物、氧化剂（助燃物）和引火源，三者同时具备并相互作用才能起火；“还原剂”与燃烧的氧化机理相悖，“发光”是燃烧特征不是条件，故选ADE。","expl":""},{"type":"多选","key":"第4题","stem":"下列物质属于助燃物的有 （　）。","options":["氢气","乙快","氨气","氧气","甲烷"],"answer":"CD","why":"助燃物是帮助可燃物燃烧的氧化剂，典型如氧气、氨气等；氢气、乙炔、甲烷本身可以燃烧，属于可燃气体，把可燃物误当助燃物是最常见错误，故选CD。","expl":""},{"type":"单选","key":"第5题","stem":"属于分解燃烧形式的是 （　）的燃烧。","options":["酒精","木炭","铁","木材"],"answer":"D","why":"木材受热分解出可燃气体后再燃烧，属分解燃烧；酒精先熔化蒸发属蒸发燃烧，木炭、铁在表面直接氧化属表面燃烧，按受热后“先分解还是先蒸发”区分。","expl":""},{"type":"多选","key":"第6题","stem":"下列物质的燃烧属于分解燃烧形式的有 （　）","options":["纸","木碳","油脂","木材","酒精"],"answer":"AD","why":"纸、木材受热分解产生可燃挥发分而燃烧，属分解燃烧；木炭为表面燃烧，油脂、酒精靠蒸发气化燃烧属蒸发燃烧，判断关键是受热后先分解还是先气化，故选AD。","expl":""},{"type":"多选","key":"第7题","stem":"下列物质的燃烧属于表面燃烧形式的有 （　）","options":["纸","木炭","焦炭","木材","铜"],"answer":"BCE","why":"木炭、焦炭、铜等受热不分解出可燃气体，直接在表面与氧反应，属表面燃烧；纸、木材受热先分解放出可燃气体，属分解燃烧，两者机理不同，故选BCE。","expl":""},{"type":"单选","key":"第8题","stem":"根据我国现行标准规定 （　）火灾属于","options":["类火灾A 木材","石蜡","氢气","铝镁合金"],"answer":"A","why":"依据火灾分类标准，A类是固体火灾，木材、纸张、棉布等是典型代表；石蜡属可熔化固体为B类，氢气为C类，铝镁合金为D类，故选木材。","expl":""},{"type":"单选","key":"第9题","stem":"根据我国现行标准规定 （　） 火灾属于 B 类火灾","options":["木材","石蜡","氢气","铝镁合金"],"answer":"B","why":"依据火灾分类标准，B类是液体或可熔化固体火灾，石蜡受热熔化燃烧属B类；木材是A类固体，氢气是C类气体，铝镁合金是D类金属，故选石蜡。","expl":""},{"type":"单选","key":"第10题","stem":"根据我国现行标准规定,（　） 火灾属于 C 类火灾","options":["木材","石蜡","氢气","铝镁合金"],"answer":"C","why":"依据火灾分类标准，C类是气体火灾，氢气、甲烷、天然气等可燃气体着火属C类；石蜡属B类可熔化固体，铝镁合金属D类金属火灾，故选氢气。","expl":""},{"type":"单选","key":"第11题","stem":"根据我国现行标准规定 （　） 火灾属于 D 类火灾。","options":["木材","石蜡","氢气","铝镁合金"],"answer":"D","why":"依据火灾分类标准，D类是金属火灾，钾、钠、镁、铝镁合金等轻金属燃烧属D类，须用专用灭火剂扑救；木材、石蜡、氢气分属A、B、C类，故选铝镁合金。","expl":""},{"type":"判断","key":"第12题","stem":"根据我国现行标准规定,动物油脂火灾属于 F 类（　）。","options":[],"answer":"对","why":"依据火灾分类标准，F类是烹饪器具内的烹饪物火灾，动物油脂、植物油脂是典型代表，说法正确；记忆“厨房油脂=F类”，勿与B类液体火灾混淆。","expl":""},{"type":"单选","key":"第13题","stem":"死亡 30 人的火灾,属于 （　） 火灾。","options":["一般","较大","重大","特别重大"],"answer":"D","why":"依据火灾等级划分标准，死亡30人及以上为特别重大火灾，分级口诀“3、10、30”；30人恰好达到最高档，最易误选“重大”，记住30含在本档内，故选特别重大。","expl":""},{"type":"单选","key":"第14题","stem":"重伤 50 人的火灾,属于（　） 火灾。","options":["一般","较大","重大","特别重大"],"answer":"C","why":"依据火灾等级划分标准，重伤10人以上50人以下为重大火灾，重伤100人以上才为特别重大；50人恰在上限档内，勿按“50往上”多跳一档，故选重大。","expl":""},{"type":"单选","key":"第15题","stem":"死亡 5 人的火灾,属于（　） 火灾。","options":["一般","较大","重大","特别重大"],"answer":"B","why":"依据火灾等级划分标准，死亡3人以上10人以下为较大火灾；5人落在3~10区间属较大，误选“一般”是忘了3人是第一道分界线，故选较大。","expl":""},{"type":"单选","key":"第16题","stem":"死亡 1 人的火灾,属于（　）火灾。","options":["一般","较大","重大","特别重大"],"answer":"A","why":"依据火灾等级划分标准，死亡3人以下为一般火灾，1人在一般档内；记住“3、10、30”三道线，1小于3，勿因有人员死亡就人为拔高等级，故选一般。","expl":""},{"type":"判断","key":"第17题","stem":"一般情况下,闪点越低,火灾危险性越大。 （　）","options":[],"answer":"对","why":"闪点是液体表面蒸气遇火源发生闪燃的最低温度，闪点越低越易被点燃，火灾危险性越大，这也是划分易燃、可燃液体类别的依据，说法正确。","expl":""},{"type":"单选","key":"第18题","stem":"扑救火灾的最佳阶段是（　）","options":["初起期","发展期 D 减弱期","减弱期 C 最盛期"],"answer":"A","why":"初起期燃烧面积小、火焰温度低、火势弱，用少量灭火器材即可扑灭，是扑救火灾的最佳时机；进入发展期、最盛期后火势猛烈，人员已难以靠近扑救。","expl":""},{"type":"单选","key":"第20题","stem":"下列关于爆炸的说法,正确的是 （　）","options":["化学爆炸一般威力较小,而物理性爆炸往往威力非常大","物理爆炸只有极少数是氧化反应引起的爆炸","液化气钢瓶的爆炸属于化学爆炸","水蒸气爆炸属于物理爆炸"],"answer":"D","why":"水蒸气爆炸是水遇高温骤然汽化、压力剧增胀破容器所致，全程无化学反应，属典型物理爆炸；A把威力大小说反（化学爆炸威力通常更大），液化气钢瓶爆炸属化学爆炸，故选D。","expl":""},{"type":"单选","key":"第21题","stem":"属于化学过程的灭火方法是 （　）","options":["冷却灭火","隔离灭火","室息灭火","抑蚱错灭火"],"answer":"D","why":"灭火四法中冷却、窒息、隔离均为物理作用，只有抑制（中断燃烧链式反应）属化学过程，如干粉、卤代烷灭火剂；误选窒息是把隔绝空气误当化学作用，故选D。","expl":""},{"type":"单选","key":"第22题","stem":"不能使用泡沫灭火器扑救的火灾是（　）火灾。","options":["木材","汽油","石蜡","氢气"],"answer":"D","why":"泡沫灭火剂适用于A类固体和石油制品等B类液体火灾；氢气属C类气体火灾，泡沫无法覆盖熄灭气体火焰，须用干粉等灭火剂，故选氢气。","expl":""},{"type":"多选","key":"第23题","stem":"泡沫灭火剂不适用于扑救 （　）火灾。","options":["类","类","类","类","类"],"answer":"CDE","why":"泡沫灭火剂含水、导电，只适用于A类固体和B类液体火灾；C类气体、D类金属及带电设备火灾都不能用，否则灭不了火还会触电，故选CDE。","expl":""},{"type":"单选","key":"第25题","stem":"能用于扑救 1KV 以上高压带电设备的灭火剂是 （　）","options":["泡沫灭火剂","二氧化碳灭火剂","干粉灭火剂","烟雾灭火剂"],"answer":"C","why":"干粉不导电、绝缘性好，可扑救1kV以上高压带电设备火灾；泡沫及含水灭火剂导电、严禁用于带电火灾，二氧化碳一般限用于1kV以下，故选干粉。","expl":""},{"type":"单选","key":"第26题","stem":"不能使用干粉灭火器扑救的火灾是（　）火灾。","options":["可燃液体","可燃固体","可燃气体","轻金属"],"answer":"D","why":"干粉灭火器适用于可燃液体、固体、气体及带电设备火灾；轻金属燃烧剧烈且会与普通干粉反应，须用专用D类灭火剂或干砂扑救，故选轻金属。","expl":""},{"type":"单选","key":"第27题","stem":"二氧化碳灭火器主要灭火原理是 （　）","options":["冷却","室息","隔离","抑制"],"answer":"B","why":"二氧化碳喷出后笼罩燃烧物，把氧浓度稀释到燃烧无法维持的程度，主要靠窒息灭火，冷却只是附带作用；误选冷却是以次充主，故选窒息。","expl":""},{"type":"多选","key":"第28题","stem":"混合气体灭火剂是由（　） 按一定比例混合而成的气体","options":["氮气","气","氧气","二氧化碳气体","一氧化碳"],"answer":"ABD","why":"混合气体灭火剂（IG-541）由氮气、氩气、二氧化碳按约5:4:1比例混合而成，靠稀释氧浓度灭火；不含氧气和一氧化碳，含氧反而助燃，故选ABD。","expl":""},{"type":"单选","key":"第29题","stem":"混合气体灭火剂中不包含 （　）","options":["氮气","二氧化碳","氧气","气"],"answer":"C","why":"混合气体灭火剂成分是氮气、氩气、二氧化碳，不含氧气；它正是靠把防护区氧浓度稀释至燃烧极限以下灭火，若含氧则失去灭火意义，故选氧气。","expl":""},{"type":"单选","key":"第30题","stem":"混合气体灭火剂不能扑救的火灾是 （　） 火灾。","options":["类","类","类 D","类"],"answer":"C","why":"混合气体灭火剂适用于A类固体、B类液体、C类气体及带电设备火灾；D类金属火灾燃烧剧烈、窒息法无效，须专用灭火剂，故不能扑救的是D类金属火灾。","expl":""},{"type":"单选","key":"第31题","stem":"火灾自动报警系统一般由触发器件、火灾报警装置、（　）和电源四部分组成。","options":["火灾警报装置","自动灭火装置","防烟排烟装置","安全疏散设施"],"answer":"A","why":"依据消防技术规范，火灾自动报警系统由触发器件、火灾报警装置、火灾警报装置和电源四部分组成；“自动灭火装置”属消防联动控制系统，不属于报警系统，故选A。","expl":""},{"type":"多选","key":"第32题","stem":"火灾自动报警系统一般由 （　） 和电源四部分组成。","options":["触发器件","火灾报警装置","火灾警报装置","自动灭火装置","防烟排烟装置"],"answer":"ABC","why":"火灾自动报警系统四件套：触发器件（感烟感温探测器、手动报警按钮）、火灾报警装置、火灾警报装置、电源；自动灭火、防排烟装置属联动系统，故选ABC。","expl":""},{"type":"单选","key":"第33题","stem":"火灾自动报警系统中的核心组成部分是（　）","options":["触发器件","火灾警报器","火灾报警控制器","消防控制器"],"answer":"C","why":"火灾报警控制器是火灾自动报警系统的核心，负责接收探测信号、判断火情并发出警报和联动指令；触发器件只是前端感知元件，故选火灾报警控制器。","expl":""},{"type":"判断","key":"第34题","stem":"灭火器由筒体、器头、喷嘴等部件组成,借助驱动压力将所充装的灭火剂喷出,达到灭火的目的,是扑救初起火灾的重要消防器材。（　）","options":[],"answer":"对","why":"这是灭火器的规范定义：由筒体、器头、喷嘴等部件组成，借驱动压力喷出灭火剂，轻便灵活、即取即用，正是扑救初起火灾的重要消防器材，说法正确。","expl":""},{"type":"多选","key":"第35题","stem":"通常通信机房中常用 （　） 和阻火模块等封堵电缆井和各种缆线通过的孔洞。","options":["泡沫封堵材料","柔性有机材料","阻火包","防火封堵板材","防火蜜封胶"],"answer":"BCD","why":"通信机房常用柔性有机堵料、阻火包、防火封堵板材封堵电缆井和缆线孔洞，兼顾防火性能与日后拆装检修；泡沫类材料不阻燃不耐久，不能作正式封堵，故选BCD。","expl":""},{"type":"单选","key":"第36题","stem":"气焊或气割时,操作人员应保证气瓶距火源之间的距离在 （　）米以上。","options":["10","15","18"],"answer":"B","why":"依据焊接切割安全要求，气焊气割时气瓶距火源应在15米以上，防止瓶体受热内压升高发生爆炸；误选10米安全裕度不足，故选15。","expl":""},{"type":"判断","key":"第37题","stem":"焊接带电的设备时可不断电,但需采取措施,避免触电。 （　）","options":[],"answer":"错","why":"焊接带电设备必须先切断电源，经验电、挂牌后再作业，严禁带电焊接；带电焊接既有触电危险，又会烧损设备，“可不断电”的说法错误。","expl":""},{"type":"单选","key":"第38题","stem":"氧气瓶是储存和运输氧气的专用高压容器,它是由瓶体、瓶箍、瓶阀和瓶帽 4 部分组成。其瓶体为 （　）色,并用黑漆标明氧气两字,用以区别其它气瓶。","options":["白","黑","天蓝","灰"],"answer":"C","why":"依据气瓶颜色标志规定，氧气瓶瓶体为天蓝色，配套口诀“氧瓶天蓝黑字、乙炔白瓶红字”，天蓝即氧气瓶，故选天蓝。","expl":""},{"type":"单选","key":"第39题","stem":"氧气瓶是储存和运输氧气的专用高压容器,它是由瓶体、瓶箍、瓶阀和瓶帽 4 部分组成。其瓶体为天蓝色,并用（　） 漆标明氧气两字,用以区别其它气瓶。","options":["白","黑","红","黄"],"answer":"B","why":"氧气瓶天蓝瓶体上用黑漆标明“氧气”二字；与乙炔瓶“白瓶红字”成对记忆，瓶色与字色都不能弄反，故选黑。","expl":""},{"type":"单选","key":"第40题","stem":"氧气瓶与明火之间的最小距离为（　）M。","options":["5","10","15"],"answer":"C","why":"氧气是强助燃剂，瓶阀泄漏遇明火会猛烈燃烧甚至爆燃，规程要求氧气瓶与明火距离不小于15米；误选10米距离偏小、隐患大，故选15。","expl":""},{"type":"单选","key":"第41题","stem":"乙炔瓶是一种储存和运输乙炔的容器,其瓶体外表漆成白色,并漆有 （　）色\"乙炔”字样。","options":["天蓝","黑","红","黄"],"answer":"C","why":"依据气瓶颜色标志规定，乙炔瓶瓶体白色，“乙炔”字样为红色；与氧气瓶“天蓝黑字”对照，口诀“氧蓝黑、炔白红”，故选红。","expl":""},{"type":"单选","key":"第43题","stem":"乙炔瓶与易燃、易爆物质之间的存放距离不得近于 （　） M。","options":["5","10","15"],"answer":"B","why":"乙炔化学性质活泼、极易燃爆，与易燃易爆物质的存放距离不得小于10米，防止相互引燃酿成连环事故；误选5米距离过近，故选10。","expl":""},{"type":"判断","key":"第44题","stem":"必须将氧气瓶或乙炔瓶内的气体全部用完后方可再罐装气体。（　）","options":[],"answer":"错","why":"气瓶内气体不得全部用尽，必须留有剩余压力，防止空气倒灌混入瓶内，否则再充装时会形成爆炸性混合气体，极易发生危险，“全部用完”说法错误。","expl":""},{"type":"单选","key":"第45题","stem":"如果发现电器设备着火,首先应该 （　）","options":["找就近灭火器灭火","关掉电源","打 119 报警","立即通知消防控制室人员"],"answer":"B","why":"电气设备着火的第一步是关掉电源，断电后再灭火才能避免触电、防止事故扩大；直接找灭火器或报警都可能延误断电时机导致触电，故选关掉电源。","expl":""},{"type":"多选","key":"第46题","stem":"电气事故按发生灾害的形式,可以分为人身事故（　） 等","options":["接地事故","漏电事故","爆炸事故","设备事故","电气火灾"],"answer":"CDE","why":"按发生灾害的形式，电气事故分为人身事故、设备事故、电气火灾、爆炸事故等；接地事故、漏电事故是按故障原因的划分，不属于按灾害形式分类，故选CDE。","expl":""},{"type":"判断","key":"第47题","stem":"无论哪种电气事故,都是由于各种类型的电流、电荷、电磁场的能量不适当释放或转移造成的。 （　）","options":[],"answer":"对","why":"电气事故的本质是电能失控，即电流、电荷、电磁场的能量不适当释放或转移，对人体、设备、环境造成损害，该表述符合电气事故机理，说法正确。","expl":""},{"type":"多选","key":"第48题","stem":"电流对人体的伤害的严重程度与 （　）有关","options":["通过人体的电流大小","通过人体的电流频率","通过人体的电流持续时间","流经途径","人体的体型"],"answer":"ABCD","why":"电流对人体的伤害程度取决于电流大小、频率、持续时间、流经途径及个体健康状况等因素；“体型”并非影响因素，属于干扰项，故选ABCD。","expl":""},{"type":"单选","key":"第49题","stem":"引起电击事故最危险的电流频率是 （　）","options":["直流","50Hz","50KHz","50MHz"],"answer":"B","why":"50Hz工频电流最容易诱发心室颤动，引起室颤所需的电流最小，对人体最危险；高频电流的生理危害反而相对较小，故选50Hz。","expl":""},{"type":"单选","key":"第50题","stem":"对于工频电流,一般成年男性的感知电流为（　）mA 左右","options":["0.5","0.7","1.1","1.6"],"answer":"C","why":"工频条件下成年男性感知电流约1.1mA，女性约0.7mA、约为男性的三分之二；1.1对应男性档，误选其他数值是把交、直流阈值混淆，故选1.1。","expl":""},{"type":"单选","key":"第52题","stem":"对于工频电流,一般成年女性在摆脱概率为 50%时的摆脱电流约为（　） mA.","options":["9","10.5","16"],"answer":"C","why":"摆脱电流随概率要求递减：50%摆脱概率对应约16mA，10.5mA、9mA分别对应更高的概率档，99.5%时数值最小；误选10.5、9是概率档位记混，故选16。","expl":""},{"type":"单选","key":"第53题","stem":"对于工频电流,一般成年男性在摆脱概率为 99.5%时的摆脱电流约为（　） mA。","options":["9","10.5","16"],"answer":"B","why":"工频电流下，男性在99.5%摆脱概率时摆脱电流约10.5mA；三档数值16＞10.5＞9，保证绝大多数人能摆脱时取较小值，误选16是50%档的数值，故选10.5。","expl":""},{"type":"单选","key":"第54题","stem":"对于工频电流,一般成年女性在摆脱概率为 99.5%时的摆脱电流约为（　） mA。","options":["9","10.5","16"],"answer":"A","why":"女性在99.5%摆脱概率时摆脱电流约9mA，低于男性的10.5mA，说明女性摆脱能力较弱、安全限值应更严；误选10.5是男性对应档，故选9。","expl":""},{"type":"单选","key":"第55题","stem":"对于工频电流,当电流持续时间超过心脏跳动周期时,人的室额电流约为 （　） mA。","options":["0","50","100","500"],"answer":"B","why":"当通电时间超过心脏搏动周期时，约50mA的工频电流即可引发心室颤动，是致命阈值；500mA是通电时间极短时的室颤值，条件不同勿混，故选50。","expl":""},{"type":"单选","key":"第56题","stem":"正常人在正常条件下对直流电流的感觉闽值约为 （　） mA。","options":["2","5","10"],"answer":"B","why":"正常人在正常条件下对直流的感觉阈值约2mA，且只在电流接通和断开的瞬间有感觉、电流稳定期间无感觉；误选5、10mA是与其他阈值混淆，故选2。","expl":""},{"type":"单选","key":"第57题","stem":"对于直流电来说,以下说法错误的是 （　）","options":["与交流相比,摆脱较难","正常人在正常条件下的感觉闯值约为 2mA,且只有在接通和断开时才会引起感觉","300mA 及以下时,没有可确定的摆脱闽值","电流持续时间小于 200ms 时,直流室颤闯值大致与交流相同"],"answer":"A","why":"直流在300mA及以下没有确定的摆脱阈值，摆脱障碍反而比交流小，“与交流相比摆脱较难”错误；B、C、D三项（2mA感觉阈值仅通断时有感觉、300mA以下无确定摆脱阈值、小于200ms时室颤阈值与交流大致相同）均为正确描述，故选A。","expl":""},{"type":"多选","key":"第58题","stem":"关于人体对流经人体的电流的反应,说法错误的是 （　）","options":["儿童较大人敏感","女性较男性敏感","体重大的较体重轻的敏感","患有心脏病者触电死亡率较大"],"answer":"ABD","why":"本题考查人体触电敏感性规律：儿童较成人敏感、女性较男性敏感、患心脏病者触电死亡率更大，均为明确结论；C项把规律说反，应为体重轻者更敏感，符合规律的选项为ABD。","expl":""},{"type":"单选","key":"第60题","stem":"绝大部分触电死亡事故是 （　） 造成的。","options":["电击","电伤","雷击","电磁辐射"],"answer":"A","why":"电击是电流通过人体内部，损害心脏、肺和中枢神经系统，绝大部分触电死亡由电击造成；电伤是电弧烧伤等体表伤害，一般不直接致命，故选电击。","expl":""},{"type":"多选","key":"第61题","stem":"电伤包括 （　）等。","options":["间接接触电击","间接接触电伤","电烧伤","电烙印","电光眼"],"answer":"CDE","why":"电伤是电流热效应、化学效应等造成的体表伤害，包括电烧伤、电烙印、电光眼三种典型形式；间接接触电击属触电方式分类，不是电伤的具体形式，故选CDE。","expl":""},{"type":"多选","key":"第62题","stem":"人体触电的方式有很多,常见的触电方式有 （　） 等","options":["单项触电","两相触电","三相触电","跨步触电","接触电压触电"],"answer":"ABDE","why":"常见触电方式有单相触电、两相触电、跨步电压触电、接触电压触电；规范分类中没有“三相触电”这一提法，人体同时触及两相即属两相触电，故选ABDE。","expl":""},{"type":"单选","key":"第63题","stem":"安全工作规程要求人们在户内不要走近电线落地点 （　） M 以内地段,否则会发生触电事故。","options":["6","8","10"],"answer":"C","why":"导线落地后周围地面形成电位分布，越靠近落地点跨步电压越大；规程要求户内不得走近电线落地点10米以内，6米、8米均在危险区内，故选10。","expl":""},{"type":"判断","key":"第64题","stem":"我国习惯上以 1kv 为界线,额定电压在 1 千伏及以上的称为高压,1 千伏以下的称为低压。（　）","options":[],"answer":"对","why":"我国习惯以1kV为界划分电压等级：额定电压1千伏及以上为高压，1千伏以下为低压，这是电气安全的基本口径，说法正确。","expl":""},{"type":"多选","key":"第65题","stem":"防止直接接触电击事故中最基本、最重要的安全技术措施 （　）","options":["绝缘","屏护","间距","保护接地","保护接零"],"answer":"ABC","why":"绝缘、屏护、间距是防止直接接触电击最基本、最重要的三项技术措施；保护接地、保护接零主要用于漏电使外壳带电等间接接触防护，勿混，故选ABC。","expl":""},{"type":"判断","key":"第66题","stem":"气体和液体绝缘击穿后,可以恢复其功能。（　）","options":[],"answer":"对","why":"气体、液体绝缘击穿后撤去电压能自行恢复绝缘性能，如空气间隙、变压器油；固体绝缘一旦击穿则永久损坏、必须更换，两者正相反，说法正确。","expl":""},{"type":"单选","key":"第67题","stem":"变配电装置的户内临时栅栏高度不应低于 （　） m。","options":["1.0","1.2","1.5","1.7"],"answer":"B","why":"依据变配电装置安全要求，户内临时栅栏高度不应低于1.2米，防止人员误入或翻越带电间隔；户外要求更高为1.5米，成对记忆“内1.2外1.5”，故选1.2。","expl":""},{"type":"单选","key":"第68题","stem":"变配电装置的户外临时栅栏高度不应低于 （　） m。","options":["1.0","1.2","1.5","1.7"],"answer":"C","why":"户外临时栅栏受风雨、视线等环境影响应更高，不应低于1.5米；误选1.2米是把户内标准套用到户外，记住“内低外高”，故选1.5。","expl":""},{"type":"单选","key":"第69题","stem":"在 TN 系统中,以下做法错误的是（　）","options":["将电器外壳保护接地","将 PEN 线重复接地","安装电流型漏电保护器","单相负荷线路保护零线可借用工作零线"],"answer":"D","why":"TN系统中保护零线与工作零线必须严格分开，单相负荷的保护零线严禁借用工作零线，否则零线断开时设备外壳带电；重复接地、装漏电保护器均正确，故选D。","expl":""},{"type":"单选","key":"第71题","stem":"金属容器内、隧道内、水井内以及周围有大面积接地导体等工作地点狭窄、行动不便的环境或特别潮湿的环境应采用 （　）V 安全电压。","options":["12","24","42"],"answer":"B","why":"依据安全电压等级规定，金属容器内、隧道、水井及周围有大面积接地导体等狭窄潮湿、行动不便环境应采用24V安全电压；42V只适用于一般环境，故选24。","expl":""},{"type":"判断","key":"第72题","stem":"电流型漏电保护装置只能防止间接接触电击,不能防止直接接触电击。 （　）","options":[],"answer":"错","why":"高灵敏度（30mA以下）电流型漏电保护装置在人体直接触电时也能在0.1秒内切断电源，既能防间接接触也能防直接接触电击，“只能防间接”过于绝对，说法错误。","expl":""},{"type":"多选","key":"第73题","stem":"我国标准规定的高灵敏度电流型漏电保护装置的额定动作电流有（　） mA。","options":["0","15","30","50","75"],"answer":"ABC","why":"我国标准高灵敏度电流型漏电保护装置的额定动作电流为6、15、30mA三档（首项为6mA），专用于人身触电保护；50、75mA属中灵敏度档，故选ABC。","expl":""},{"type":"单选","key":"第74题","stem":"用于防止人身触电事故,应选用的电流型漏电保护装置应该是（　）。","options":["高灵敏度","中灵敏度","低灵敏度","特低灵敏度"],"answer":"A","why":"防人身触电必须在达到心室颤动电流前断电，应选高灵敏度（30mA及以下）漏电保护装置；中、低灵敏度动作慢、电流大，只用于防火等场合，故选高灵敏度。","expl":""},{"type":"单选","key":"第75题","stem":"用于监视一相接地事故,应选用的电流型漏电保护装置应该是（　）","options":["特高灵敏度","高灵敏度","中灵敏度","低灵敏度"],"answer":"D","why":"监视一相接地故障只需检测较大的接地电流，选低灵敏度漏电保护装置即可，还能避免正常不平衡电流引起误动作；高灵敏度反而频繁跳闸，故选低灵敏度。","expl":""},{"type":"单选","key":"第76题","stem":"用于防止漏电火灾事故,可以选用的电流型漏电保护装置应该是（　）","options":["特高灵敏度","高灵敏度","中灵敏度","低灵敏度","都可以"],"answer":"D","why":"漏电火灾源于泄漏电流长期发热，用低灵敏度漏电保护装置监视即可及时切除隐患，兼顾供电连续性；防人身触电才必须用高灵敏度，故选低灵敏度。","expl":""},{"type":"判断","key":"第77题","stem":"电流型漏电保护装电流不得低于额定动作电流的 1/2.。（　）","options":[],"answer":"对","why":"为防止误动作，标准规定漏电保护装置的不动作电流不得低于额定动作电流的1/2，使动作区间留有足够裕度，该说法正确。","expl":""},{"type":"多选","key":"第78题","stem":"以下关于电源线颜色标识正确的有 （　）","options":["相-为红色","相-为绿色","相-为黑色","工作零线-为黄色","专用保护零线-为黄绿双色"],"answer":"BE","why":"相色标准：A相黄、B相绿、C相红，工作零线淡蓝，专用保护零线黄绿双色；B、E正确，A项A相应为黄色，C项C相应为红色，D项工作零线不是黄色，故选BE。","expl":""},{"type":"单选","key":"第79题","stem":"电源线路可分为工作相线 (火线),工作零线和专用保护零线。工作零线用 （　）色芯线。","options":["黄","绿","黑","蓝"],"answer":"D","why":"工作零线（N线）用淡蓝色芯线；黄绿双色线专用于保护零线、严禁他用，相线按A黄、B绿、C红区分，故选蓝。","expl":""},{"type":"判断","key":"第80题","stem":"建筑施工现场临时用电工程必须采用三级配电系统,必须采用 TN-S 接零保护系统,必须采用二级漏电保护系统。 （　）","options":[],"answer":"对","why":"依据《施工现场临时用电安全技术规范》，临时用电必须采用三级配电、TN-S接零保护、二级漏电保护三大系统，属强制性要求，说法完整正确。","expl":""},{"type":"单选","key":"第81题","stem":"按照《施工现场临时用电安全技术规范》规定,有关建筑施工现场临时用电说法错误的是（　）。","options":["必须采用三级配电系统","必须采用 TN-","接零保护系统C 必须采用二级漏电保护系统","每台用电设备必须有各自专用的开关箱"],"answer":"B","why":"规范强制要求采用TN-S接零保护系统（三相五线、专用保护零线），B项要求TN-C错误；三级配电、二级漏电保护、每台设备专用开关箱均正确，故选B。","expl":""},{"type":"单选","key":"第82题","stem":"施工现场临时用电应采用 （　）保护系统。","options":["TN-C","TN-S C IT","TT83 施工现场配电系统的漏电保护开关应按( C)配置。A 四级 B 三级 C 二级 D 一级"],"answer":"C","why":"施工现场配电系统的漏电保护开关应按二级配置：总配电箱一级、开关箱末级，两级参数配合实现分级保护；配电分三级、漏电保护只两级，勿混为一谈。","expl":""},{"type":"单选","key":"第84题","stem":"施工现场开关箱与用电设备的水平距离不宜超过（　）M。","options":["3","4","5"],"answer":"B","why":"开关箱应尽量靠近所控用电设备，水平距离不宜超过4米，以缩短拖地线路、便于异常时立即断电；距离过远会延误断电、增大触电风险，故选4。","expl":""},{"type":"单选","key":"第85题","stem":"施工现场的配电箱、开关箱应设置在安全稳固、便于操作、不易被碰撞的地点,周围不得有易燃物或杂物。其底部距地面最小距离为（　）m。","options":["1.0","1.2","1.3","1.5"],"answer":"C","why":"配电箱、开关箱应设在安全稳固、便于操作、不易被碰撞处，底部距地面最小1.3米，既防雨水溅入、杂物侵入，又便于日常操作检查；误选1.2米低于下限，故选1.3。","expl":""},{"type":"单选","key":"第86题","stem":"在人孔内、天花板及坚井内等有电击危险环境中作业时,应使用电源电压不超过（　）的行灯照明。","options":["2Y","24V","36V","42V"],"answer":"C","why":"人孔、天花板、竖井等有电击危险环境中作业，行灯照明电压不得超过36V；更潮湿狭窄的密闭场所要求更低，行灯还须带防护网罩，故选36V。","expl":""},{"type":"单选","key":"第87题","stem":"施工现场的照明线路（　）必须经过开关才能进入照明灯具。","options":["相线","零线","相线和零线","都不是"],"answer":"A","why":"照明开关必须串接在相线上，开关断开后灯具不带电，换灯泡、检修才安全；若开关接在零线上，关灯后灯头仍带电，极易触电，故选相线。","expl":""},{"type":"单选","key":"第88题","stem":"低压带电作业断开导线时,应（　）","options":["先断开相线,后断开零线","先断开零线,后断开相线","先断开相线或零线均可","两者同时断开"],"answer":"A","why":"低压带电作业断线应先断相线、后断零线，让线路先脱离高电位再操作；顺序颠倒时导线仍带电、风险大，恢复接线时顺序相反，故选先相后零。","expl":""},{"type":"判断","key":"第89题","stem":"运输或存放有锋刃的工具要平放,锋刃口应朝上或向外,放入工具袋时纫口应向下。 （　）","options":[],"answer":"错","why":"锋刃工具运输、存放时应平放且刃口朝下、向内，装入工具袋时刃口向下，防止伤人毁物；“朝上或向外”极易造成划割伤害，说法错误。","expl":""},{"type":"单选","key":"第90题","stem":"千斤顶不得超负荷使用,旋升最大行程不得超过丝杠总长的（　）","options":["三分之二","四分之三","五分之三","二分之一"],"answer":"C","why":"千斤顶严禁超负荷使用，旋升最大行程不得超过丝杠总长的五分之三（3/5），超行程会使丝杠脱扣、顶头失稳坠落；误选三分之二超出限值，故选五分之三。","expl":""},{"type":"多选","key":"第91题","stem":"通信工程中用电工具的使用,做法正确的是 （　）","options":["使用前应进行安全检查","应使用独立的的插座","传递用电工具时应先切断电源","易燃场所作业时必须使用防爆式工具","带电设备上作业时应使用隔离变压器"],"answer":"ACDE","why":"电动工具使用前检查、传递时先断电、易燃场所用防爆型、带电设备上经隔离变压器供电均正确；B项错误，工具不得随意共用插座，应防止过载和漏电扩散，故选ACDE。","expl":""},{"type":"单选","key":"第92题","stem":"关于用电工具,以下说法错误的是 （　）。","options":["在带电设备上可以使用用电工具","使用手电钻或电锤时,必须戴帆布手套","使用手持式砂轮机打磨作业时,工作前,应进行空载试验","不得在易燃、用熔接机的场所用熔接机"],"answer":"B","why":"B错误——手电钻、电锤作业必须戴绝缘手套，帆布手套不绝缘且易被旋转部件缠绕伤手；砂轮机工作前空载试验、易燃易爆场所禁用熔接机等说法均正确，故选B。","expl":""},{"type":"多选","key":"第93题","stem":"关于仪表的车使用,以下说法正确的有 （　）","options":["使用交流供电的仪表,金属外壳应接地保护","使用带激光源的仪器时,不得将光源正对着眼睛","测试电缆的耐压或绝缘时,应把电缆与相应设备连接可靠","做过耐压和绝缘测试的电缆,必须放电后才能再进行其它项目的测试","长期不使用时应及时从仪表中取出电池"],"answer":"ABDE","why":"仪表金属外壳接地、激光源不得对眼、耐压绝缘测试后先放电、长期不用取出电池均正确；C项错误——测耐压绝缘前必须把电缆与设备断开，防止高压串入损坏设备，故选ABDE。","expl":""},{"type":"单选","key":"第94题","stem":"关于电焊机的使用,以下说法错误的是 （　）","options":["交流电焊机应配装防二次侧触电保护器","交流电焊机一次侧电源线长度不应大于 30 米","二次侧电源线应采用防水型橡皮护套铜芯软电缆","在潮湿处操作电焊机,操作人员应站在绝缘板上。"],"answer":"B","why":"交流电焊机一次侧电源线长度不应大于5米，30米是二次侧焊把软电缆的限值，B项张冠李戴；防二次侧触电保护器、防水橡套电缆、潮湿处站绝缘板均正确，故选B。","expl":""},{"type":"单选","key":"第95题","stem":"通信工程路面切割机的使用,做法错误的是 （　）。","options":["金属外壳应做好保护接地","手柄上应有电源控制开关并做绝终保护","使用时应一边操作、一边随机整理电源线","操作人员应戴绝缘手套、穿绝缘鞋"],"answer":"C","why":"路面切割机运转时严禁边操作边整理电源线，高速锯片旁拉扯电线极易触电或被卷入伤人，应停机断电后整理；保护接地、绝缘手柄开关、绝缘防护均正确，故选C。","expl":""},{"type":"判断","key":"第96题","stem":"砂轮切割机的电源线应采用耐气温变化的橡胶皮护套铜芯软电缆（　）","options":[],"answer":"对","why":"砂轮切割机多在露天、风尘环境使用，电源线应采用耐气温变化的橡胶皮护套铜芯软电缆，防水、防老化、防破损漏电，说法正确。","expl":""},{"type":"单选","key":"第97题","stem":"砂轮切割机应安装防护罩,切割机前面应设立（　）M 高的耐火档砂板。","options":["1.2","1.5","1.7","2"],"answer":"C","why":"砂轮切割机的砂轮碎片和火花会飞溅伤人，切割机前方应设1.7米高（约成人身高）的耐火挡砂板阻挡；数字记忆“1.7米挡板”，故选1.7。","expl":""},{"type":"单选","key":"第98题","stem":"推土机横坡行驶的坡度最大为（　）","options":["0°","15°","20°","25°"],"answer":"A","why":"推土机重心高、横坡行驶极易侧翻，规程规定横坡行驶最大坡度为0°，即只能纵向顺坡行驶作业；15°~25°是纵向爬坡能力数值，勿混，故选0°。","expl":""},{"type":"单选","key":"第99题","stem":"推土机停车时刀铲距地面要保持 （　） m 左右。","options":["0.2","0.5","1.0"],"answer":"A","why":"推土机停车时应把刀铲落地或保持距地面约0.2米并落下锁定，防止刀铲因自重突然下落伤人；留空0.5米、1米过高，坠落打击风险大，故选0.2。","expl":""},{"type":"单选","key":"第100题","stem":"使用吊车在架空电力线附近工作时,应与其保持安全距离,当输电线路电压为 10KV 时,允许与输电线路的最近距离为（　）米。","options":["1.5","2.0","4.0","6.0"],"answer":"B","why":"依据起重机械安全规程，吊车任何部位与10kV架空线路的最近距离为2米，电压越高距离越大；1.5米是1kV以下线路的标准，勿混，故选2.0。","expl":""},{"type":"单选","key":"第101题","stem":"使用吊车在架空电力线附近工作时,应与其保持安全距离,当输电线路电压为 35KV 时,允许与输电线路的最近距离为（　）米","options":["1.5","2.0","4.0","6.0"],"answer":"C","why":"吊车与35kV架空线路最近距离为4米，安全距离随电压递增：1kV以下1.5米、10kV2米、35kV4米；误选2.0米是10kV档数值，故选4.0。","expl":""}]};
const L = 'ABCDE';
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
document.getElementById('list').innerHTML = QUIZ.questions.map((q, i) => {
  let opts;
  if (q.type === '判断') {
    opts = ['对','错'].map(t => `<div class="opt ${t===q.answer?'right':''}">${t}</div>`).join('');
  } else {
    opts = q.options.map((o,k) => `<div class="opt ${q.answer.includes(L[k])?'right':''}"><b>${L[k]}</b>　${esc(o)}</div>`).join('');
  }
  const expl = (q.why ? esc(q.why) + '<br>' : '') + (q.expl ? '<b class="h">📖 详细讲解：</b><br>' + esc(q.expl) : (q.why || q.expl ? '' : '（讲解待补，先记答案）'));
  return `<div class="q">
    <div class="qno"><span class="badge">${q.type}</span>第 ${i+1} 题${q.key && q.key.startsWith('附') ? '（附录）' : ''}</div>
    <div class="stem">${esc(q.stem)}</div>
    ${opts}
    <div class="ansline">✔ 答案：${q.answer}</div>
    <div class="expl">${expl}</div>
  </div>`;
}).join('');
</script>
