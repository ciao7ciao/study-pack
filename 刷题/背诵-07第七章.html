const QUIZ = {"title":"第七章","questions":[{"type":"判断","key":"第1题","stem":"从国际上的职业健康安全体系的角度来看,危险源一般不包括仅涉及对“物\"“财产”的损害（　）","options":[],"answer":"对","why":"职业健康安全体系关注的核心是人的安全与健康，危险源一般指可能导致人员伤害、职业病的根源或状态；仅涉及「物」「财产」损害的不属于该体系语境下的危险源。题干说法正确。","expl":""},{"type":"单选","key":"第2题","stem":"识别危险源时不要发生遗漏,以免留下隐患,这是危险源辨识的（　） 原则。","options":["预测性","全面性","系统性","科学性"],"answer":"B","why":"辨识时不留死角、不发生遗漏，对应「全面性」原则；预测性对应分析潜在危险，系统性强调全流程方法，别混。口诀：全面不漏、预测在先。","expl":""},{"type":"单选","key":"第3题","stem":"对于危险源,要分析其潜在的危险性、存在的条件及触发事件,这是危险源辨识的（　） 原则。","options":["预测性","全面性","系统性","科学性"],"answer":"A","why":"对危险源分析潜在危险性、存在条件和触发事件，是在事故发生前预判其演化路径，属于「预测性」原则。干扰项「系统性」强调的是辨识的组织与方法体系，不是预判。","expl":""},{"type":"单选","key":"第4题","stem":"安全生产检查表形式简单,针对性和操作性强,是施工企业常用的危险源辨识方法中（　）的具体运用。","options":["直观经验法","对照分析法","专家评议法","事故树分析法"],"answer":"B","why":"安全检查表依据法规标准逐条对照排查，是「对照分析法」的具体运用；事故树分析是自顶向下推理事故逻辑的定量方法，与检查表完全不同。","expl":""},{"type":"单选","key":"第5题","stem":"LEC 法评价某种危险风险等级的计算公式为: DL*E*C,其中 D 表示（　）","options":["危险的等级程度","发生事故可能性","人体暴露的频繁程度","损失后果的严重程度"],"answer":"A","why":"LEC法公式 D=L×E×C：L为事故发生的可能性，E为人体暴露于危险环境的频繁程度，C为事故后果严重程度，D为风险等级评价结果（危险的等级程度）。记法：D是总分，LEC是三个因子。","expl":""},{"type":"单选","key":"第6题","stem":"LEC 法评价某种危险风险等级的计算公式为: D=L*E*C,其中 E 表示（　）","options":["危险的等级程度","发生事故可能性","人体暴露的频繁程度","损失后果的严重程度"],"answer":"C","why":"D=L×E×C 中，E（Exposure）表示人体暴露于危险环境的频繁程度；L是可能性、C是后果严重程度，三者相乘得风险值D。","expl":""},{"type":"单选","key":"第7题","stem":"LEC 法评价某种危险风险等级的计算公式为: D=L*E*C,其中 C 表示（　）","options":["危险的等级程度","发生事故可能性","人体暴露的频繁程度","损失后果的严重程度"],"answer":"D","why":"D=L×E×C 中，C（Consequence）表示事故造成损失后果的严重程度；E是暴露频次、L是可能性，注意字母与含义一一对应，别记混。","expl":""},{"type":"多选","key":"第8题","stem":"常见的风险防范措施主要包括 （　）几个方面","options":["组织措施","管理措施","技术措施","处罚措施","合同措施"],"answer":"ABC","why":"风险防范措施主要包括组织、管理、技术三类措施；「处罚措施」「合同措施」不属于安全生产风险防范的标准分类。","expl":""},{"type":"单选","key":"第9题","stem":"在企业内部实行一岗双责制定属于（　）类别的风险防范措施","options":["组织措施","管理措施","技术措施","其它措施"],"answer":"A","why":"一岗双责是在岗位责任体系中落实「谁主管谁负责」，属于建立责任组织架构的范畴，归入组织措施；管理措施偏制度运行，技术措施偏物防技防。","expl":""},{"type":"多选","key":"第10题","stem":"以下属于安全生产管理措施范畴的有 （　）","options":["配备安全管理人员","组织安全生产检查","建立健全安全生产责任","进行安全生产教育培训","配备安全防护用品"],"answer":"BCD","why":"组织安全检查、建立责任制、教育培训属于管理措施；A配备安全管理人员属组织措施，E配备防护用品属技术措施，分类题要盯住「管理」二字。","expl":""},{"type":"单选","key":"第11题","stem":"下面属于通信工程危险源的是 （　）","options":["裸露的铜鼻子","作业人员未佩戴安全帽","作业面与高压线间距过近","安全技术交底缺失"],"answer":"C","why":"危险源是可能意外释放能量或危险的载体与状态：作业面与高压线间距过近是典型触电类危险源；未戴安全帽、交底缺失属于人的不安全行为和管理缺陷（隐患），裸露铜鼻子单独不构成作业危险状态。","expl":""},{"type":"单选","key":"第12题","stem":"割接时未作绝缘处理的工具是 （　）工程中常见的危险源","options":["架空线路","直埋线路","管道线路","设备线路"],"answer":"D","why":"设备（机房）割接涉及带电运行设备，未作绝缘处理的工具易造成短路、触电，是设备线路工程割接中的常见危险源；架空、直埋、管道工程不涉及机房带电设备操作。","expl":""},{"type":"判断","key":"第13题","stem":"因外部因素影响致使生产经营单位自身难以排除的隐患,通常属于-般事故隐患。（　）","options":[],"answer":"错","why":"因外部因素致使生产经营单位自身难以排除的隐患，其危害和整改难度大，按重大事故隐患管理，不属于一般事故隐患。判断题遇「自身难以排除」直接联想重大隐患。","expl":""},{"type":"单选","key":"第14题","stem":"通信工程施工单位的事故隐患中,危害和整改难度较大,应当局部停产停业,并经过一定时间整改治理方能排除的隐患,由 （　） 组织制定安全隐患治理方案并组织实施。","options":["专职安全员","现场负责人","项目负责人","企业主要负责人"],"answer":"D","why":"危害和整改难度较大、需局部停产停业并经一定时间治理方能排除的是重大事故隐患，依据《安全生产事故隐患排查治理暂行规定》，应由企业主要负责人组织制定治理方案并组织实施。","expl":""},{"type":"单选","key":"第15题","stem":"通信工程施工单位的事故隐患中,危害和整改难度较小,需要整改的隐患,称为（　）。","options":["关注隐患","轻微隐患","一般监控隐患","重点监控隐患"],"answer":"B","why":"危害和整改难度较小、发现后需要整改才能消除的隐患称为一般（轻微）隐患；「重点监控隐患」多对应重大隐患，层级别搞反。","expl":""},{"type":"单选","key":"第16题","stem":"通信工程施工单位的事故隐患中,危害较小,发现后需引起注意的隐患,由 （　）予以关注。","options":["专职安全员","现场负责人","项目负责人","企业负责人"],"answer":"B","why":"危害较小、发现后只需引起注意的隐患，由现场负责人予以关注即可；需要停产治理的重大隐患才上升到企业主要负责人层面，处置层级要与隐患等级匹配。","expl":""},{"type":"多选","key":"第17题","stem":"对于排查出来的安全生产隐患,应确定定整改责任人（　）","options":["整改措施","整改完成时间","整改完成单位及具体人员","整改验收人","整改监理方"],"answer":"ABCD","why":"隐患整改落实「五定」：定整改责任人、定整改措施、定整改完成时间、定整改完成单位及具体人员、定整改验收人；「整改监理方」不在其列。","expl":""},{"type":"多选","key":"第18题","stem":"安全生产检查中属于软件系统检查内容的有 （　）","options":["查思想和意识","查制度和管理","查事故处理","查隐患及整改","查安全设备设施"],"answer":"ABCD","why":"软件系统检查查思想意识、制度管理、事故处理、隐患整改等管理面内容；E安全设备设施属于硬件系统检查内容，软硬件要分开记。","expl":""},{"type":"多选","key":"第19题","stem":"通常以时间为维度的安全生产检查包括 （　）","options":["经常性安全生产检查","季节性安全生产检查","定期安全生产检查","特殊时期的安全生产检查","远程安全生产检查"],"answer":"BCD","why":"以时间为维度划分的是定期检查、季节性检查、特殊时期（节假日）检查；经常性检查强调日常不间断属组织方式，远程检查按实施手段划分。","expl":""},{"type":"多选","key":"第20题","stem":"安全检查的类型很多,不属于时间维度检查的是 （　）","options":["现场安全生产检查","定期安全生产检查","季节性安全生产检查","远程安全生产检查","特殊时期安全生产检查"],"answer":"AD","why":"定期、季节性、特殊时期检查都属于时间维度；现场检查按实施地点划分、远程检查按实施手段划分，均与时间维度无关。","expl":""},{"type":"多选","key":"第21题","stem":"季节性安全生产检查具有很强的针对性,检查的重点一般包括（　）","options":["防冻保暖","防煤气中毒","防暑降温 防雷防电","防通信中断"],"answer":"ABCD","why":"季节性检查针对季节特点：冬春季防冻保暖、防煤气中毒，夏季防暑降温、防雷防电，通信行业还要防通信中断，四个选项都是其重点，全选。","expl":""},{"type":"单选","key":"第22题","stem":"施工单位自行组织的安全生产检查,在整改措施计划完成后,由（　）组织有关人员进行验收。","options":["检查组","项目部","安全管理部门","专职安全员"],"answer":"C","why":"施工单位自行组织的检查，整改措施计划完成后应由安全管理部门组织验收，实现闭环管理；检查组只负责查，验收归口安全管理部门。","expl":""},{"type":"多选","key":"第23题","stem":"对通信工程企业的安全检查,主要从（　）安全教育培训、安全生产管控及隐患排查治理、事故管理、持续改进等方面进行。","options":["安全管理目标职责","安全管理制度","现场安全管理","安全应急管理","施工质量控制"],"answer":"ABCD","why":"对通信工程企业的安全检查围绕管理目标职责、管理制度、现场安全管理、安全应急管理及教育培训、隐患排查、事故管理、持续改进等展开；施工质量控制不属于安全检查范畴。","expl":""},{"type":"单选","key":"第24题","stem":"对通信施工企业的安全检查,通常以打分的方式进行,若得 85 分,一般应评定为（　）","options":["优秀","良好","合格","不合格"],"answer":"B","why":"通信施工企业安全检查按百分制打分评定：一般90分及以上为优秀，80～89分为良好，70～79分为合格，70分以下不合格。85分落在良好档。","expl":""},{"type":"单选","key":"第25题","stem":"对通信施工企业进行项目达标计划时,应抽查 （　）个以上项目的达标合格率达到 100%。","options":["3","4","5"],"answer":"B","why":"项目达标考核要求抽查4个以上项目，且达标合格率达到100%，数量与双百要求都是数字考点，直接记忆。","expl":""},{"type":"单选","key":"第26题","stem":"施工单位应严格按照《通信建设工程安全操作规范》的规定进行（　）","options":["现场管理","制度建设","目标制定","质量检查"],"answer":"A","why":"《通信建设工程安全操作规范》是通信施工操作的强制性依据，施工单位应严格按其进行现场管理和作业；制度建设、目标制定、质量检查各有各自依据，不靠操作规范。","expl":""},{"type":"多选","key":"第27题","stem":"对通信工程项目的安全检查,主要内容包括项目的 （　）等情况。","options":["安全生产责任制落实","安全技术交底","消防安全管理","现场文明施","施工质量控制"],"answer":"ABCD","why":"项目安全检查内容包括责任制落实、安全技术交底、消防安全管理、现场文明施工等；施工质量控制属于质量管理体系，不属于安全检查内容。","expl":""},{"type":"多选","key":"第28题","stem":"对通信工程项目的安全检查,主要内容包括项目的（　）等情况。","options":["专项施工方案","人员管理","应急管理","安全检查","质量控制"],"answer":"ABCD","why":"项目安全检查还包括专项施工方案、人员管理、应急管理、安全检查开展情况等；质量控制计划始终是干扰项，见到「质量控制」基本可排除。","expl":""},{"type":"单选","key":"第29题","stem":"对通信工程项目的安全检查,主要内容不包括项目的（　） 情况。","options":["安全生产责任制","安全技术交底","现场文明施工","施工质量控制"],"answer":"D","why":"安全生产责任制、安全技术交底、现场文明施工都是项目安全检查的必查项；本题问「不包括」，选施工质量控制——质量与安全是两个独立管理体系。","expl":""},{"type":"单选","key":"第30题","stem":"对通信工程项目的安全检查,主要内容不包括项目的（　） 等情况","options":["专项施工方案","人员管理","应急管理","质量控制"],"answer":"D","why":"专项施工方案、人员管理、应急管理、安全检查情况属于安全检查主要内容；质量控制不属于，与管理条例的安全管理边界一致。","expl":""},{"type":"单选","key":"第31题","stem":"项目部组织的全面安全生产检查,一般情况下,检查频次时 （　）。","options":["每天一次","每周一次","每周两次","每月两次"],"answer":"B","why":"项目部组织的全面安全生产检查一般为每周一次；日常巡查由专职安全员每天进行，频次层级：班组日检、项目周检、公司月检。","expl":""},{"type":"多选","key":"第32题","stem":"对通信工程施工现场的安全检查,描述正确的是 （　）","options":["检查安全技术措施的落实情况","检查《通信建设工程安全生产操作规范》的执行情况","检查的内容应根据检查类型和项目特点确定","检查本着突出重点的原则","检查是上级的要求,没有必要也要进行"],"answer":"ABCD","why":"现场安全检查应突出重点、按检查类型和项目特点确定内容，检查安全技术措施落实和操作规范执行情况；「没有必要也要进行」明显违背检查目的，E必错。","expl":""},{"type":"单选","key":"第33题","stem":"对施工现场的安全检查,（　） 的评分权重最大","options":["项目经理","技术负责人","现场监理人员","专职安全员"],"answer":"D","why":"对施工现场的安全检查评分中，专职安全员掌握日常一手资料，其评分权重最大；项目经理、技术负责人、监理人员的权重均低于专职安全员。","expl":""},{"type":"单选","key":"第34题","stem":"职业健康安全管理体系的有效建立和运行,能为企业带来的受益般不包括 （　）。","options":["提高安全管理绩效","提升工程业绩","有助于相关法规的贯彻执行","树立企业良好的社会形象"],"answer":"B","why":"职业健康安全管理体系带来的是安全管理绩效提升、法规贯彻、社会形象等管理收益；「提升工程业绩」属于经营市场层面收益，不是体系建立的直接目的。","expl":""},{"type":"单选","key":"第35题","stem":"实施职业健康安全管理体系是组织的战略和（　）","options":["管理决策","经营理念","经营决策","管理理念"],"answer":"C","why":"实施职业健康安全管理体系是组织的战略和经营决策，体现最高管理者的承诺，不是一般的管理理念或口号；教材原文表述要记准。","expl":""},{"type":"多选","key":"第36题","stem":"职业健康安全管理体系运行成功的关键因数包括（　）","options":["领导作用","承诺","管理","制度","所有各职能和层次的参与"],"answer":"ABE","why":"体系运行成功的关键：领导作用、最高管理者的承诺、所有职能和层次的参与；「管理」「制度」是泛化词汇，不属关键因素的标准表述。","expl":""},{"type":"单选","key":"第37题","stem":"职业健康安全管理体系认证证书最终要通过（　）才能获得","options":["试运行","内部审核","管理评审","外部审核"],"answer":"D","why":"认证证书最终要通过外部审核（第三方认证机构审核）才能获得；试运行、内审、管理评审都是企业内部环节，是外审前的准备条件。","expl":""},{"type":"多选","key":"第38题","stem":"企业的管理体系文件一般应包括 （　）","options":["管理手册","质量手册","作业指导书及操作规范","现场处置方案及运行记录","相关的管理制度"],"answer":"ACDE","why":"管理体系文件一般包括管理手册、作业指导书及操作规范、现场处置方案及运行记录、相关管理制度；质量手册属于质量管理体系文件，与职业健康安全体系分属两套体系。","expl":""},{"type":"单选","key":"第39题","stem":"下列情况中,不属于职业健康安全管理体系要求增加内部审核次数的是 （　）","options":["企业内部组织机构等有重大变动","发生了重大的安全事故等","体系管理部门负责人认为需要","顾客(包括相关方)有重大投诉"],"answer":"C","why":"企业内部组织机构重大变动、发生重大安全事故、相关方重大投诉时都应增加内审频次；「体系管理部门负责人认为需要」不是标准规定的情形，属于随意性表述。","expl":""},{"type":"判断","key":"第40题","stem":"企业安全生产标准化是有效防范事故发生的唯一手段（　）。","options":[],"answer":"错","why":"安全生产标准化是防范事故的有效手段，但不是「唯一」手段。判断题中「唯一」「必须」「都」等绝对化表述九成是错的，需要与培训、检查、应急等手段并用。","expl":""},{"type":"单选","key":"第41题","stem":"企业开展安全生产标准化工作,应遵循方针不包括 （　）","options":["安全第一","预防为主","管控为主","综合治理"],"answer":"C","why":"安全生产标准化工作方针是「安全第一、预防为主、综合治理」十二字方针；「管控为主」是编造的干扰项，见绝对化新词要警惕。","expl":""},{"type":"单选","key":"第42题","stem":"企业安全生产标准化包括（　） 个一级要素。","options":["16","22","28"],"answer":"A","why":"企业安全生产标准化系统包含16个一级要素，数字考点直接记忆：16个一级要素，其下再分二级要素。","expl":""},{"type":"单选","key":"第43题","stem":"企业 （　） 至少应对安全生产标准化管理体系的运行情况进行一次自评。","options":["每季度","每半年","每年","两年"],"answer":"C","why":"企业每年至少对安全生产标准化管理体系的运行情况进行一次自评，形成自评报告；「每季度」「每半年」频率都高于标准要求。","expl":""},{"type":"单选","key":"第44题","stem":"关于安全生产标准化证书的分级,正确的是 （　）","options":["分为甲、乙级","分为一、二、三级","分为一、二、三、四级","不分级"],"answer":"B","why":"安全生产标准化证书分为一级、二级、三级，一级最高；不是甲乙级（那是资质分类），也没有四级。","expl":""},{"type":"判断","key":"第45题","stem":"企业管理层应代表全体员工在关注安全和追求安全绩效方面做出公开的安全承诺。（　）","options":[],"answer":"错","why":"公开的安全承诺应由企业主要负责人（最高管理者）代表企业作出，而非「管理层代表全体员工」；承诺主体和代表对象表述均不准确，故说法错误。","expl":""},{"type":"单选","key":"第46题","stem":"企业内部（　）是企业安全承诺的具体体现和安全文化建设的基础要求。","options":["安全制度","管理制度","操作规范","行为规范"],"answer":"D","why":"企业内部行为规范是安全承诺的具体体现和安全文化建设的基础要求；制度、操作规范是管理和技术文件，承载承诺落地的是对行为的规范。","expl":""},{"type":"单选","key":"第47题","stem":"关于企业安全文化建设程序的建立和执行的说法,正确的是（　）","options":["识别并说明主要的风险","使用者不参与程序的制定和改进过程","一般不形成正式文件","要求员工对程序的执行持信任的态度"],"answer":"A","why":"安全文化程序建立的首要环节是识别并说明主要的风险，让员工清楚风险来源；程序制定应有使用者参与、形成正式文件发布，B、C、D表述均违背这些要求。","expl":""},{"type":"多选","key":"第48题","stem":"关于企业安全文化建设程序的建立和执行的说法,不正确的是（　）","options":["识别并说明主要的风险","使用者不参与程序的制定和改进过程,","由正式文件予以发布","向员工闻明给出特殊要求的原因","要求员工对程序的执行持信任的态度"],"answer":"BE","why":"程序建立应识别风险、正式发布、说明特殊要求的原因，并让使用者参与建立信任；B「使用者不参与」与E「要求员工持信任态度」都不正确——信任来自参与而非强求。","expl":""},{"type":"单选","key":"第49题","stem":"对于员工所识别的安全缺陷,企业正确的做法是 （　）","options":["给予经济奖励","记录备案","给予及时处理和反馈","上级主管领导"],"answer":"C","why":"员工识别出的安全缺陷，企业应及时处理和反馈，形成闭环，才能激励持续参与；只记录备案或层层上报都会挫伤积极性。","expl":""},{"type":"单选","key":"第50题","stem":"企业应建立有效的安全学习模式,实现动态发展的安全学习过程关于安全自主学习过程的顺序,正确的是（　）","options":["既有知识和能力-概念与方案-预知与反思-实践与实施-评估与总结-新的知识和能力","既有知识和能力-预知与反思-概念与方案-实践与实施-评估与总结-新的知识和能力","预知与反思既有知识和能力-概念与方案-实践与实施-评估与总结-新的知识和能力","既有知识和能力-预知与反思-实践与实施-概念与方案-评估与新的知识和能力"],"answer":"B","why":"安全自主学习过程顺序：既有知识和能力→预知与反思→概念与方案→实践与实施→评估与总结→新的知识和能力，起点是既有能力，先反思再出方案。","expl":""},{"type":"多选","key":"第51题","stem":"员工参与企业安全事务的方式有 （　）","options":["微小差错员工报告机制","成立员工安全改进小组","不定期召开员工代表参加的安全会议","进行岗位风险评审","不安全行为或不安全状态的自查自评活动"],"answer":"ABE","why":"员工参与安全事务的规范方式：微小差错报告机制、员工安全改进小组、不安全行为/状态自查自评；「不定期开安全会」「岗位风险评审」不属列明的参与方式。","expl":""},{"type":"多选","key":"第52题","stem":"培养骨干是推动企业安全文化建设非做不可的事情,训练内容包括（　）","options":["理论","经验","制度的制定","实施的方法","事例"],"answer":"ABDE","why":"安全文化骨干训练内容包括理论、经验、实施的方法、事例（案例教学）；「制度的制定」属于制度建设范畴，不在骨干训练内容之列。","expl":""},{"type":"单选","key":"第53题","stem":"传播安全文化,促进精神文明的重要手段是 （　）","options":["弘扬、教育、激励、同化","宣传、培训、鼓励、感化","宣传、教育、鼓励、同化","宣传、教育、激励、感化"],"answer":"D","why":"传播安全文化、促进精神文明的重要手段是宣传、教育、激励、感化四手段，教材原文，注意与「弘扬、同化」类干扰词区分。","expl":""},{"type":"单选","key":"第54题","stem":"企业安全文化是 （　） 企业整体行为以及员工行为的价值理念同时也指导着安全管理制度的()","options":["指导和约束,制定和执行","指导和保持,签定和执行","指导和保持,制定和执行","指导和约束,签定和执行"],"answer":"A","why":"安全文化指导和约束企业整体行为及员工行为的价值理念，同时指导安全管理制度的制定和执行；「保持」「签定」均为干扰用词，记「指导约束+制定执行」。","expl":""},{"type":"判断","key":"第55题","stem":"安全文化和安全管理制度是激励员工的两种有力工具,是各自独立的。 （　）","options":[],"answer":"错","why":"安全文化与安全管理制度相互支撑、相辅相成：文化引导制度制定，制度固化文化要求，两者是激励员工的两种有力工具但绝不各自独立。判断题见「各自独立」即错。","expl":""}]};
const L = 'ABCDE';
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
document.getElementById('list').innerHTML = QUIZ.questions.map((q, i) => {
  let opts;
  if (q.type === '判断') {
    opts = ['对','错'].map(t => `<div class="opt ${t===q.answer?'right':''}">${t}</div>`).join('');
  } else {
    opts = q.options.map((o,k) => `<div class="opt ${q.answer.includes(L[k])?'right':''}"><b>${L[k]}</b>　${esc(o)}</div>`).join('');
  }
  const expl = (q.why ? esc(q.why) + '<br>' : '') + (q.expl ? '<b class="h">📖 详细讲解：</b><br>' + esc(q.expl) : (q.why || q.expl ? '' : '（讲解待补，先记答案）'));
  return `<div class="q">
    <div class="qno"><span class="badge">${q.type}</span>第 ${i+1} 题${q.key && q.key.startsWith('附') ? '（附录）' : ''}</div>
    <div class="stem">${esc(q.stem)}</div>
    ${opts}
    <div class="ansline">✔ 答案：${q.answer}</div>
    <div class="expl">${expl}</div>
  </div>`;
}).join('');
</script>
