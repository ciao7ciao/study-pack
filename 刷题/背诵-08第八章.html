<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第八章 · 背诵版（答案+解析）</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #eef2f6; color: #22303e; padding: 64px 14px 40px; }
#bar { position: fixed; top: 0; left: 0; right: 0; z-index: 9; background: #ffffffee; backdrop-filter: blur(8px); border-bottom: 1px solid #e0e6ec; padding: 10px 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
#bar .stat { font-size: 14px; color: #5a6572; }
#bar label { font-size: 14px; color: #4a5560; cursor: pointer; }
.wrap { max-width: 760px; margin: 0 auto; }
.q { background: #fff; border-radius: 14px; box-shadow: 0 1px 8px #0000000e; padding: 20px 22px; margin: 14px 0; }
.qno { font-size: 13px; color: #8a95a1; margin-bottom: 6px; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 20px; background: #e3edfb; color: #1a66d6; margin-right: 8px; }
.stem { font-size: 17px; line-height: 1.65; font-weight: 600; margin-bottom: 12px; }
.opt { font-size: 15px; line-height: 1.55; padding: 9px 13px; margin: 6px 0; border: 1.5px solid #e3e9ef; border-radius: 10px; background: #fbfcfe; }
.opt.right { border-color: #2e9e5b; background: #e9f7ef; font-weight: 600; }
.ansline { margin-top: 12px; font-size: 16px; font-weight: 800; color: #217a45; background: #e9f7ef; border: 1.5px solid #2e9e5b; border-radius: 10px; padding: 10px 14px; }
.expl { margin-top: 10px; padding: 12px 15px; border-radius: 10px; background: #fff8e6; border: 1px solid #eee0ae; color: #4a3f28; font-size: 14.5px; line-height: 1.8; white-space: pre-wrap; }
.expl b.h { color: #8a6d1a; }
body.hideans .ansline, body.hideans .opt.right, body.hideans .expl { display: none; }
</style>
</head>
<body>
<div id="bar">
  <span class="stat">第八章 · 共 28 题</span>
  <label><input type="checkbox" onchange="document.body.classList.toggle('hideans', this.checked)"> 遮住答案自测</label>
</div>
<div class="wrap" id="list"></div>
<script>
const QUIZ = {"title":"第八章","questions":[{"type":"多选","key":"第1题","stem":"应急管理是一个动态过程,包括（　）四个阶段。","options":["立项","预防","准备","响应","恢复"],"answer":"BCDE","why":"应急管理是动态过程，包括预防、准备、响应、恢复四个阶段；「立项」是工程词汇，混进来凑数的，四阶段口诀：防、备、响、恢。","expl":""},{"type":"单选","key":"第2题","stem":"为迅速有效地开展应急行动,需要预先所做的各种准备不包括（　）。","options":["应急队伍建设","应急机构设立","应急预案演练","开展安全研究"],"answer":"D","why":"应急准备包括队伍、机构、预案演练、物资等；「开展安全研究」属于预防阶段的风险管理工作，不属于为应急行动做的准备。","expl":""},{"type":"单选","key":"第3题","stem":"应急响应是在事故发生后应立即采取的（　） 行动。","options":["应急与事故处理","救援和事故处理","救援与上报","应急与救援"],"answer":"D","why":"应急响应是事故发生后立即采取的应急与救援行动，含报警、疏散、抢险等；「事故处理」属事后环节，响应阶段的核心是救人控险。","expl":""},{"type":"判断","key":"第4题","stem":"事故应急救援的总目标是通过有效的应急救援行动,尽可能降低事故的后果,包括人员伤亡、财产损失和环境破坏等。 （　）","options":[],"answer":"对","why":"应急救援总目标就是通过有效的应急行动尽可能降低事故后果——人员伤亡、财产损失、环境破坏，题干是教材原文表述，正确。","expl":""},{"type":"单选","key":"第5题","stem":"整个应急救援系统的重心 （　）","options":["应急救援中心","应急救援专家组","公众疏散组织","后勤保障组织"],"answer":"A","why":"整个应急救援系统的重心是应急救援中心，负责统一指挥协调；专家组、疏散组织、后勤保障都是其下的支撑节点，重心与分支别搞混。","expl":""},{"type":"单选","key":"第6题","stem":"为保障重大事故应急救援工作的有效开展,应建立重大事故应急救援体系的 （　）系统。","options":["检查分析","问题比对","支持保障","纠偏"],"answer":"C","why":"重大事故应急救援体系应建立支持保障系统，含通信、物资、装备、资金等保障；记忆「支持保障」四字对应体系底部支撑层。","expl":""},{"type":"判断","key":"第7题","stem":"应急救援体系可以有可靠的通信保障系统,保证整个应急救援过程中救援组织内部,以及内部与外部之间通畅的通信网络,并设立备用通信系统。 （　）","options":[],"answer":"错","why":"题干说「可以有可靠的通信保障系统」，实际要求是「必须」设立备用通信系统保障全程通信畅通，把强制性要求说成可有可无，故错误。","expl":""},{"type":"单选","key":"第8题","stem":"临时应急恢复阶段不包括 （　）","options":["恢复现场","人员清点和撤离","警戒解除","事故处理和事故调查"],"answer":"A","why":"临时应急恢复阶段包括人员清点撤离、警戒解除、事故处理调查等；「恢复现场」是长期恢复内容，且恢复原状通常是破坏现场，应急期不允许。","expl":""},{"type":"单选","key":"第9题","stem":"应急预案体系的构成不包含 （　）","options":["综合应急预案","专项应急预案","施工组织预案","现场处置预案"],"answer":"C","why":"应急预案体系由综合应急预案、专项应急预案、现场处置方案三层构成；「施工组织预案」属施工组织设计范畴，不是应急体系组成部分。","expl":""},{"type":"多选","key":"第10题","stem":"生产经营单位应急预案编制程序包括 （　）、应急预案编制、桌面推演等步骤。","options":["成立编制工作组","收集资料","评估风险和应急资源调查","应急预案评审和批准","发布和执行预案"],"answer":"ABCD","why":"预案编制程序：成立编制工作组→收集资料→风险评估和应急资源调查→应急预案编制→桌面推演/评审→批准发布；A~D都是编制前中期的正规步骤。","expl":""},{"type":"单选","key":"第11题","stem":"施工单位应急预案编制完成后,应由 （　） 组织评审。","options":["建设单位","设计单位","施工单位","监理单位"],"answer":"C","why":"施工单位编制的应急预案应由施工单位自行组织评审（外部可邀请专家），评审通过后由本单位主要负责人签署发布；监理、建设方无组织评审义务。","expl":""},{"type":"单选","key":"第12题","stem":"下列表述中不属于生产安全事故应急救援预案制定要求的是（　）","options":["系统性","科学性","针对性","可操作性"],"answer":"A","why":"应急预案制定要求：科学性、针对性、可操作性（还有合规性、衔接性）；「系统性」常被当干扰项——它是对体系结构的要求而非预案制定的专项要求，按教材为准选A。","expl":""},{"type":"多选","key":"第13题","stem":"综合应急预案的应急响应部分的内容,一般应包括 （　）","options":["信息报告","响应分级","应急处置","应急支援","响应终止"],"answer":"ACDE","why":"综合应急预案的应急响应部分包括信息报告、应急处置、应急支援、响应终止等；「响应分级」属于总则/响应机制部分的内容编排，不在应急响应正文里。","expl":""},{"type":"单选","key":"第14题","stem":"综合应急预案的应急响应部分的内容,一般不包括（　）","options":["信息报告","响应分级","应急处置","应急支援"],"answer":"B","why":"综合预案应急响应部分不含「响应分级」——分级标准写在预案其他章节；信息报告、应急处置、应急支援都在响应部分内。注意与上一题对照记。","expl":""},{"type":"多选","key":"第15题","stem":"综合应急预案中,应急响应终止应明确终止的 （　）","options":["基本条件","要求","责任人","信息公开","后勤保障"],"answer":"ABC","why":"应急响应终止应明确终止的基本条件、要求和责任人，保证响应结束有据可依、有人负责；「信息公开」「后勤保障」不是终止章节的必列内容。","expl":""},{"type":"单选","key":"第16题","stem":"用于事故应急响应的保障队伍,一般不包括 （　）","options":["专职应急队伍","兼职应急队伍","应急队伍","业余应急队伍"],"answer":"D","why":"应急保障队伍包括专职应急队伍、兼职应急队伍等；「业余应急队伍」是无组织的临时拼凑，不符合应急队伍建设要求。","expl":""},{"type":"多选","key":"第17题","stem":"现场处置方案主要由（　）、注意事项等内容组成。","options":["事故风险分析","应急工作职责","应急预案管理","应急处置","安全制度"],"answer":"ABD","why":"现场处置方案由事故风险分析、应急工作职责、应急处置、注意事项构成（简明扼要、针对具体岗位现场）；「应急预案管理」属综合预案的管理章节。","expl":""},{"type":"单选","key":"第18题","stem":"现场处置方案中应明确的注意事项,描述不准确的是 （　）","options":["使用施工机具方面的注意事项","使用救援装备方面的注意事项","现场自救互救方面的注意事项","现场人员安全防护的注意事项"],"answer":"A","why":"现场处置方案的注意事项针对救援装备使用、自救互救、人员安全防护等现场动作；「施工机具使用注意事项」属安全操作规程内容，不属于处置方案的注意事项。","expl":""},{"type":"单选","key":"第19题","stem":"综合应急预案、专项应急预案和现场处置方案最后都要列出一个附件,其主要内容不包括的是（　）","options":["有关应急部门、机构或人员的联系方式","应急物质装备的名称或清单","关键的路线、标识和图纸","公司相关的安全管理制度"],"answer":"D","why":"三类预案附件都包括联系方式、物资装备清单、关键路线标识图纸等；「公司安全管理制度」是管理体系文件，不作为预案附件。","expl":""},{"type":"单选","key":"第20题","stem":"应急演练是针对事故情景,依据应急预案而 （　） 开展的应急救援活动。","options":["提前","实际","模拟","准备"],"answer":"C","why":"应急演练是针对事故情景、依据应急预案而「模拟」开展的救援活动——模拟是演练的本质属性，区别于实战；「实际」开展的那叫事故响应本身。","expl":""},{"type":"判断","key":"第21题","stem":"通过开展应急演练,可以实现评估应急准备状态,发现并及时修改应急预案、执行程序等相关工作的缺陷和不足。（　）","options":[],"answer":"对","why":"演练的作用正是评估应急准备状态、检验并修改预案和执行程序的缺陷不足，题干是演练目的的标准表述，正确。","expl":""},{"type":"单选","key":"第22题","stem":"作为应急演练的原则,不适合的是（　）","options":["注重知识水平提升","符合相关规定","切合企业实际","确保安全有序"],"answer":"A","why":"演练原则包括符合规定、结合实际、安全有序等；演练练的是「响应能力」不是「知识水平提升」，知识靠培训获得，A不合演练定位。","expl":""},{"type":"判断","key":"第23题","stem":"桌面演练是选择(或模拟) 生产经营活动中的设备设施、装置或场所,设定事故情景,依据应急预案而模拟的应急演练活动。 （　）","options":[],"answer":"错","why":"桌面演练是在会议室以图面、沙盘推演的方式模拟，不占用真实设备设施场所；用实物场景模拟的是现场（实战）演练，题干张冠李戴，错误。","expl":""},{"type":"单选","key":"第24题","stem":"选择生产经营活动中的设备设施、场所,设定事故情景,依据应急预案而模拟开展的演练活动是 （　）","options":["桌面演练","现场演练","单项演练","综合演练"],"answer":"B","why":"选择生产经营中的设备设施、场所，设定事故情景，按预案模拟开展的演练是现场演练；桌面演练不动用实物现场，单项/综合演练按内容范围划分。","expl":""},{"type":"多选","key":"第25题","stem":"应急演练按照内容可分为 （　）","options":["桌面演练","现场演练","单项演练","综合演练","专项演练"],"answer":"CD","why":"演练按内容分为单项演练和综合演练；按组织形式（地点方式）才分桌面演练和现场演练，两个维度别交叉。","expl":""},{"type":"单选","key":"第26题","stem":"不属于应急演练计划内容的是 （　）","options":["演练目的及类型(形式)","参加单位和经营预算","演练的时间、地点及主要内容","演练效果评价"],"answer":"D","why":"演练计划内容包括目的类型、时间地点主要内容、参加单位与预算等；「演练效果评价」属于演练结束后评估报告环节的内容，不在计划里。","expl":""},{"type":"单选","key":"第27题","stem":"根据演练评估报告中对应急预案的改进建议,由应急预案的（　）按程序对预案进行修订完善。（　）","options":["编制部门","演练部门","管理部门","上级部门"],"answer":"A","why":"根据演练评估报告的改进建议，由预案的编制部门按程序修订完善预案——谁编制谁修订，演练部门、管理部门均不负责修订。","expl":""},{"type":"多选","key":"第28题","stem":"通信工程有限空间作业中毒或窒息事故的现场处置方案,主要由（　）、注意事项、附件等内容组成。","options":["事故风险分析","应急工作职责","应急预案管理","应急处置","安全制度"],"answer":"ABD","why":"有限空间中毒窒息的现场处置方案同样由事故风险分析、应急工作职责、应急处置、注意事项、附件构成；「应急预案管理」「安全制度」属综合预案内容。","expl":""}]};
const L = 'ABCDE';
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
document.getElementById('list').innerHTML = QUIZ.questions.map((q, i) => {
  let opts;
  if (q.type === '判断') {
    opts = ['对','错'].map(t => `<div class="opt ${t===q.answer?'right':''}">${t}</div>`).join('');
  } else {
    opts = q.options.map((o,k) => `<div class="opt ${q.answer.includes(L[k])?'right':''}"><b>${L[k]}</b>　${esc(o)}</div>`).join('');
  }
  const expl = (q.why ? esc(q.why) + '<br>' : '') + (q.expl ? '<b class="h">📖 详细讲解：</b><br>' + esc(q.expl) : (q.why || q.expl ? '' : '（讲解待补，先记答案）'));
  return `<div class="q">
    <div class="qno"><span class="badge">${q.type}</span>第 ${i+1} 题${q.key && q.key.startsWith('附') ? '（附录）' : ''}</div>
    <div class="stem">${esc(q.stem)}</div>
    ${opts}
    <div class="ansline">✔ 答案：${q.answer}</div>
    <div class="expl">${expl}</div>
  </div>`;
}).join('');
</script>
</body>
</html>
