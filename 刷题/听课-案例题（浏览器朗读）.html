<script>
const SEGS = [{"tag": "案例1 土方开挖", "text": "案例背景：2014 年 8 月某日下午,H 施工单位的现场负责人带领 5 位施工人员对位于某市一交叉路口处进行通信管道开挖作业。 经过几个小时的工作,己开挖好长约 10 米,深约 1.5 米的管道。下午 17: 00 时左右突然上方堆放的泥土石块坍塌,一 名施工人员因躲"}, {"tag": null, "text": "避不及,胸部以下被泥石掩埋,经 120 医生现场抢救无效死亡,而另一名工人受伤。据调查,本工程项 目的建设单位是 Y 公司,监理单位是 J 公司,开挖作业的 5 名施工人员来自于 L 劳务公司。"}, {"tag": "案例1 土方开挖 第1题", "text": "第1小题。本次事故中死亡员工的一次性工亡补助金的标准为（　）。 选项：A，2013 年全国城镇居民人均收入的 20 倍B、2013 年全国城镇居民人均可支配收入的 20 倍C、2013 年统筹地区居民人均收入的 20 倍D、2013 年统筹地区城镇居民人均收入的 20 倍。"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例1 土方开挖 第2题", "text": "第2小题。受伤人员在停工留薪期内,原工资福利待遇不变,停工留薪期最长不超过（　）。 选项：A，6 个月 B、12 个月 C、24 个月D、36 个月。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例1 土方开挖 第3题", "text": "第3小题。土方开挖时,挖出的土、石应堆放在距离沟、坑边沿（　）以外,使土、石不致 回落于沟内。 选项：A，30cm B、40cmC、50cm D、60cm。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例1 土方开挖 第4题", "text": "第4小题。开挖深度（　）的基坑(槽)的土方开挖工程不仅需要编制专项施工方案,还需要专家论证。 选项：A，1.5 m B、3m C、5m D、6m1参考:。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例1 第5题", "text": "第5小题。事故发生后,应由（　）负责向统筹地区社会保险行政部门提出工伤认定申请。 选项：A，Y 公司 B、J 公司 C、H 公司 D、L 公司。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例1 第6题", "text": "第6小题。施工单位的现场负责人可能遭受的( 选项：A，)的刑事处罚。A、3 年以下 B、5 年以下 C、3- 7 年 D、5 年以上。"}, {"tag": null, "text": "答案：A，)的刑事处罚。A、3 年以下 B、5 年以下 C、3- 7 年 D、5 年以上。"}, {"tag": "案例1 第7题", "text": "第7小题。土方开挖时,沟坑深在（　）以上者,应有人在地面清土。 选项：A，1m B、l.2m C、1.5m D、1.8m。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例1 第8题", "text": "第8小题。( 选项：A，)是本起事故的间接原因。A、无专项施工方案 B、堆土高度过高 C、土质松软 D、不设 挡士板。"}, {"tag": null, "text": "答案：A，)是本起事故的间接原因。A、无专项施工方案 B、堆土高度过高 C、土质松软 D、不设 挡士板。"}, {"tag": "案例1 第9题", "text": "第9小题。员工受伤后,用人单位应当自事故伤害发生之日起（　）内提出工伤认定申请。 选项：A，15 日 B、30 日 C、一个月 D、一年。"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例1 第10题", "text": "第10小题。土方开挖时,堆土积高度不宜超过（　）。 选项：A，1m B、l.2m C、l.5m D、1.8m2。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例1:土方开挖 第4题", "text": "第4小题。管道沟开挖时,当流砂、疏松土质的沟深超过( 选项：A，)时,应当安装挡土板。A、1m B、1.2m C、1.5m D、1.8m。"}, {"tag": null, "text": "答案：A，)时,应当安装挡土板。A、1m B、1.2m C、1.5m D、1.8m。"}, {"tag": "案例1:土方开挖 第7题", "text": "第7小题。在土质松软处挖坑,应有防止（　）措施。 选项：A，落物B、塌方C、陷落D、跌落3。"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例2 起重伤害", "text": "案例背景：A 省F 县两路的交叉路口, 因市政道路改迁,由某施工单位( 注册地H省Z市) 负责该路段的通信杆搬迁工作,某日在通信杆 搬迁过程中, 因吊装绳不堪重负突然断裂, 导致通信杆突然掉落, 重重砸在两辆正在等红灯的小轿车上, 造成3 人死亡, 1 人重伤的安全事故"}, {"tag": null, "text": ",现场没有安全生产管理负责人。这次事故造成的损失包括: 医疗费用( 含护理费用) 4 5万元, 丧葬及抚恤等费用60万元,处理事故和现场抢救费用28 万元,设备损失50 万元, 停产损 失150 万元。(施工单位法定代表人为D,技术负责人为E,本项目负责人为M"}, {"tag": null, "text": ",吊车司机L)"}, {"tag": "案例2 起重伤害 第1题", "text": "第1小题。下面（　） 不属于人的不安全行为。 选项：A，驾驶人员忽视安全 B、作业使用吊绳强度不足；B，C 、施工人员未设围档；C，D 、吊车司机注意力分散。"}, {"tag": null, "text": "答案：B，C 、施工人员未设围档。"}, {"tag": "案例2 起重伤害 第2题", "text": "第2小题。根据《企业职工伤亡事故分类》, 该事故的类别应为（　） 选项：A，物体打击B、机械伤害 c 、起重伤害 D、交通事故。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例2 起重伤害 第3题", "text": "第3小题。事故发生后,施工企业应当及时向（　） 上报事故。 选项：A，F 县安监局和A 省管局；B，Z 市安监局和H 省通管局c 、F 县安监局和H 省通管, 局；C，D 、Z市安监局和A 省通管局。"}, {"tag": null, "text": "答案：A，F 县安监局和A 省管局。"}, {"tag": "案例2 起重伤害 第4题", "text": "第4小题。此起事故中施工企业被处于（　） 罚款 选项：A，10-20 万元；B，20 -50 万；C，50 -100万元；D，1 00-500万元。"}, {"tag": null, "text": "答案：D，1 00-500万元。"}, {"tag": "案例2 起重伤害 第5题", "text": "第5小题。根据上述情况描述, 此故的直接经济损失为（　） 。 选项：A，105 万元；B，183 万元；C，283 万元；D，333 万元4。"}, {"tag": null, "text": "答案：B，183 万元。"}, {"tag": "案例2 起重伤害 第6题", "text": "第6小题。事故发生后, 应由（　） 负责向安全生产监督管理部门上报事故情况。 选项：A，法定代表人；B，技术负责人c 、项目负责人；C，D 、吊车司机。"}, {"tag": null, "text": "答案：A，法定代表人。"}, {"tag": "案例2 起重伤害 第7题", "text": "第7小题。建设工程工地四周应按规定设置连续、密闭的围挡; 在市区主要路段和市容景观道路及机场、码头、车站广场设置的围栏其高度不得低于（　） 。 选项：A，1.5；B，1.8m；C，2m；D，2. 5m。"}, {"tag": null, "text": "答案：D，2. 5m。"}, {"tag": "案例2 起重伤害 第8题", "text": "第8小题。事故发生后, 施工企业应当最迟（　） 上报事故。 选项：A，30 分钟内；B，1 小时内；C，2 小时内；D，1 天内。"}, {"tag": null, "text": "答案：B，1 小时内。"}, {"tag": "案例2 起重伤害 第9题", "text": "第9小题。吊装作业中, 夜间应有足够的照明,室外作业遇到大雪、暴雨、大雾及（　）以上大风时,应停止作业。 选项：A，四级；B，五级；C，六级 D、八级。"}, {"tag": null, "text": "答案：C，六级 D、八级。"}, {"tag": "案例2 起重伤害 第10题", "text": "第10小题。从事起重机械的（　）不需要持《特种设备作业人员证》 选项：A，安全管理人员；B，司机；C，指挥人员 D、项目负责人。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例3  有限空间", "text": "案例背景：某通信工程公司通过招投标,5折中标了湖北某地城域网管道光缆线路工程,建设单位委托了监理单位。建设单位项目负责人要 求设计院计列安全生产费按照“不参与竞争原则执行;在施工合同中与施工单位约定,安全生产费和施工费统一按照施工进度支付。 2010年5月29日,出发前"}, {"tag": null, "text": ",施工队长在驻地告诉大家“施工中要注意安全,一定要完成今天的工作量”\"。到达施工现场后,一名施 工人员在下井开始管道光缆穿放时,被人孔内的有毒气体重晕,井上人员发现后,在没有采取任何防护措施的情况下,接二连 三盲日下井施救,造成下井施救的3名工友死亡。 事故调"}, {"tag": null, "text": "查发现:作业人员在进入人井作业前,未进行通风,未使用专用气体检测仪器进行有毒有害气体检测,施救人员未佩戴防护 用品、未携带救援设备等盲目下井施救,最终酿成事故。 相关单位按照政府的意见处理了相关责任人。事故处理整改后,施工单位给现场配备了复合气体检测仪,并配齐"}, {"tag": null, "text": "了劳动防护用 品,施工人员按照规程要求的照明条件进行人井中作业,完成施工任务,最后工程通过验收。"}, {"tag": "案例3  有限空间 第1题", "text": "第1小题。在本工程潮湿的人井中施工时,相关规范规定照明灯具电压应不大于（　）V。 选项：A，3 B.6 C.12 D.24。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例3  有限空间 第2题", "text": "第2小题。按照相关法律法规规定,该事故被处罚的人员不含（　）。 选项：A，施工单位项目负责人 B.施工单位负责人C.现场监理工程师D.建设单位负责人。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例3  有限空间 第3题", "text": "第3小题。《通信建设工程安全生产管理规定》要求,在人井中作业（　） 选项：A，必须“先检测、再通风、后作业”B.必须穿戴绝艳手套和绝缘鞋C.严格实行作业审批制度D.可根据需要制定应急措施。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例3  有限空间 第4题", "text": "第4小题。按照法规规定,设计院应按照（　）计算安全生产费。 选项：A，建设单位文件要求和现行通信概预算定额计算的建安费乘1.5%B.现行通信概预算定额全额计算的建安费乘1.5%C.投标单位报价折扣和现行通信定额计算的建安费乘1.5%D.投标单位报价折扣和现行通信定额计算的建安费乘0.75% 5。"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例3 第5题", "text": "第5小题。造成本工程安全事故的间接原因是（　）。 选项：A，施工人员违章作业B.施救人员盲目施救C.施工队长违章指挥D.施工人员缺乏安全知识。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例3 第6题", "text": "第6小题。在事故处理后,施工单位为人井内作业人员配备的安全防护用品错误的是（　）。 选项：A，自吸式导管防毒面具B.腰带式安全带C.安全绳D.安全帽。"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例3 第7题", "text": "第7小题。该事故的类别是（　）事故。 选项：A，高处坠落B.瓦斯爆炸C.中毒和窒息D.其他伤害。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例3 第8题", "text": "第8小题。事故发生处的施工作业,在《通信建设工程安全生产管理规定》中被称为（　）作业,有些省市按照持证上岗管理。 选项：A，井下空间B.室外架设C.光缆线路D.有限空间。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例3 第9题", "text": "第9小题。在事故处理整改后,施工单位配备的复合气体检测仪至少应能检测的四种气体,( 选项：A，)不是其中之一。A.二氧化碳B.可燃气体C.硫化氢D.氧气。"}, {"tag": null, "text": "答案：A，)不是其中之一。A.二氧化碳B.可燃气体C.硫化氢D.氧气。"}, {"tag": "案例3 第10题", "text": "第10小题。该事故的等级是（　）事故。 选项：A，一般B.较大C.重大D.特别重大6。"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例3 第11题", "text": "第11小题。以下（　）不属于安全费的使用范围。 选项：A，气体检测仪购买 B、用于应急救援的安全绳的购买 C、为作业人员购买意外伤害保险的费用 D、对施工人员的安全教育培训的开支。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例3 第12题", "text": "第12小题。通信施工企业应当对新招收的施工人员开展岗前三级教育,培训时间不少于（　）学时。 选项：A，8 B、12 C、24 D、32。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例3 第13题", "text": "第13小题。有限空间作业每隔（　）组织作业人员进行演练 选项：A，一个月 B、两个月C、三个月 D、半年。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例3 第14题", "text": "第14小题。进入人孔有限空间作业时,必须进行气体检测,当硫化氢浓度高于（　）mg/m3,严禁有限空间长时间作业 选项：A，4.6   B、10 C、15 D、307。"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例4  高处作业", "text": "案例背景：某通信工程公司为甲集团公司的子公司,现有管理、技术及施工人员共80人。董事长赵某是集团公司和该通信工程公司的法定 代表人。赵某长期在外地,不负责该公司日常工作。该工程公司的总经理钱某一直因病在医院接受治疗,钱某生病期间授权由 常务副总经理孙某全面主持日常工作,"}, {"tag": null, "text": "分管安全生产工作的副总经理李某协助其工作。 某天,该工程公司项目经理周某安排新招进的员工王某参与线路工程拆除作业,由吴某担任施工现场专职安全员。王某戴好安 全帽、背上工具袋用脚扣攀登上电杆后,从7米高处直接一次将电杆一侧的吊线全部剪断,使电杆倾斜,王某从杆上掉"}, {"tag": null, "text": "下,头 部着地,安全帽破裂,因伤势过重送医院抢救无效死亡。 题目:"}, {"tag": "案例4  高处作业 第1题", "text": "第1小题。该事故应由( 选项：A，)负责组织调查。A、事故发生地县级人民政府B、事故发生地设区的市级人民政府C、事故发生地县级人民政府委托事故发生单位D、企业注册地市级人民政府。"}, {"tag": null, "text": "答案：A，)负责组织调查。A、事故发生地县级人民政府B、事故发生地设区的市级人民政府C、事故发生地县级人民政府委托事故发生单位D、企业注册地市级人民政府。"}, {"tag": "案例4  高处作业 第2题", "text": "第2小题。王某高处作业的等级是（　）。 选项：A，一级B、二级 C、三级 D、特级。"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例4  高处作业 第3题", "text": "第3小题。根据相关法规,该公司下列哪种做法符合要求（　）。 选项：A，不设立安全生产管理机构,配备专职安全生产管理人员B、配备兼职的安全生产管理人员C、设立安全生产管理机构,配备专职安全生产管理人员D、只配备注册安全工程师。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例4  高处作业 第4题", "text": "第4小题。如果事故发生在2021年9月,则应急管理部门对该公司的罚款金额最可能是（　） 选项：A，二十万元以上三十万元以下B、三十万元以上一百万元以下C、一百万元以上二百万元以下D、二百万元以上三百万元以下8。"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例4 第5题", "text": "第5小题。该案例中王某的违规行为是（　）。D、背工具袋上杆B、戴安全帽作业 C、剪吊线的操作 选项：A，使用脚扣登杆。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例4 第6题", "text": "第6小题。该案例中需要持《特种作业操作证》的人是（　）。 选项：A，吴某B、李某C、周某D、王某。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例4 第7题", "text": "第7小题。该生产安全事故的类别是（　）。 选项：A，物体打击B、触电C、倒塌 D、高处坠落。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例4 第8题", "text": "第8小题。事故发生后,公司的主要负责人应当（　）向县以上应急管理部门和省通信管理局报告。 选项：A，立即B、在1小时内 C、在2小时内 D、在24小时内。"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例4 第9题", "text": "第9小题。此期间对该公司的安全生产工作全面负责的人是（　）。 选项：A，赵某B、钱某 C、孙某D、李某。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例4 第10题", "text": "第10小题。造成该事故的直接原因是（　）。 选项：A，现场没有必要的安全管理制度B、管理松懈,无章可循C、现场作业人员违反操作规范D、缺乏现场安全监督管理和检查预控9。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例6  火灾", "text": "案例背景：某日, x 市通信大楼内的 13 楼内施工人员在切割空调风管过程中,因未采取安全防范措施,将风管保温材 料引燃后起火, 5 名施工人员身处火灾现场,消防队员迅速赶到,当场救出 4 人,但因吸入烟气有毒烟气, 经抢救无效死亡,另一人1 人逃生获救。"}, {"tag": "案例6  火灾 第1题", "text": "第1小题。该事故定性为责任事故,以下属于安全责任事故的是（　）。 选项：A，为达到既定目的故意制造的事故 B、由于不可抗力事件所引发的事故C、由于人的过失造成的事故 D、由于科技条件限制而造成的无法预料的事故。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例6  火灾 第2题", "text": "第2小题。以下哪项作业不需要人员持《特种作业人员操作证》（　）。 选项：A，制冷与空调设备安装修理作业 B、金属热切割作业C、站在 2 米高处架设线缆 D、机房地面钻孔作业。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例6  火灾 第3题", "text": "第3小题。该起事故的直接原因是（　）。 选项：A，开工前未进行安全技术交底 B、作业前未办理审批手续C、切割现场未设火灾防护设施 D、缺乏监督检查。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例6  火灾 第4题", "text": "第4小题。如果发现电器设备着火,首先应该（　）。 选项：A，找就近灭火器灭火 B、关掉电源C、打 119 报警 D、立即通知消防控制室人员。"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例6  火灾 第5题", "text": "第5小题。二氧化碳灭火器主要灭火原理是（　）。 选项：A，冷却 B、窒息 C、隔离 D、抑制 10。"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例6 第6题", "text": "第6小题。如你是该项目的安全员,发现施工人员进行违规切割作业时,首先应（　）。 选项：A，立即制止 B、报告项目经理 C、守在作业现场监督 D、派人清理周围现场中的可燃物。"}, {"tag": null, "text": "答案：A，立即制止 B、报告项目经理 C、守在作业现场监督 D、派人清理周围现场中的可燃物。"}, {"tag": "案例6 第7题", "text": "第7小题。根据《企业职工伤亡事故分类》,本起事故类别是（　）。 选项：A，中毒 B、火灾 C、机械伤害 D、其他伤害。"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例6 第8题", "text": "第8小题。施工现场应当制定的消防安全管理制度不包括( 选项：A，)等。A、社区联防制度B、用火用电作业及使用易燃易爆危险物品的管理制度C、消防设施维护保养制度D、消防安全检查制度。"}, {"tag": null, "text": "答案：A，)等。A、社区联防制度B、用火用电作业及使用易燃易爆危险物品的管理制度C、消防设施维护保养制度D、消防安全检查制度。"}, {"tag": "案例6 第9题", "text": "第9小题。作业人员对于施工现场的火灾事故防范应做到“三懂、三会”,其中“三懂”不包括 （　）。 选项：A，懂本岗位的火灾危险性 B、懂预防火灾的措施C、懂火灾扑救的方法 D、懂消防器材的设置要求。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例6 第10题", "text": "第10小题。燃烧的三要素不包括（　）。 选项：A，可燃物 B、氧化剂 C、引火源 D、灭火剂11。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例7  触电", "text": "案例背景：某年 9 月 18 日上午,天空正刮台风,下大雨,某施工单位两名施工人员在某新建基站挖掘孔桩施工时,因 电线电缆没有穿管保护,配电箱的铁皮割破绝缘皮,造成电线外壳、提升机的钢绞线带电。其中一名施工 人员不慎触及提升机钢绞线,受电击经抢救无效死亡。据调查,该项目"}, {"tag": null, "text": "施工组织设计中没有现场临时用电 方案,也无专项施工方案,出事地点配电箱没有配备漏电保护开关,现场用电采用的是三相四线制,现场 安全管理混乱,施工作业人员没有穿防护服,绝缘鞋,施工作业前未进行安全交底。"}, {"tag": "案例7  触电 第1题", "text": "第1小题。施工现场配电系统的漏电保护开关应按（　）配置 选项：A，四级 B、三级 C、两级 D、一级。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例7  触电 第2题", "text": "第2小题。低压带电作业断开导线时,应( 选项：A，)A、应先断开相线,后断开零线 B、先断开零线后断开相线C、先断开相线或零线均可 D、两者同时断开。"}, {"tag": null, "text": "答案：A，)A、应先断开相线,后断开零线 B、先断开零线后断开相线C、先断开相线或零线均可 D、两者同时断开。"}, {"tag": "案例7  触电 第3题", "text": "第3小题。实施心肺复苏术时的按压频次为（　）次每分钟 选项：A，60~80 B、80~100C、100~120 D、120~140。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例7  触电 第4题", "text": "第4小题。触电伤员呼吸微弱或停止时,应立即通畅触电者气道（　）用枕头等物垫在伤员的头下 选项：A，应当 B、宜 C、严禁 D、不宜12。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例7 第6题", "text": "第6小题。施工组织总设计是以（　）为对象编制的 选项：A，单位工程 B、分部工程C、分项工程 D、整个建设项目或群体工程。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例7 第7题", "text": "第7小题。下列分部分项工程中,不需要编制专项施工方案的是（　） 选项：A，起重吊装工程 B、模板工程C、砌筑工程 D、拆除爆破工程。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例7 第8题", "text": "第8小题。带电作业时,监护人应由（　）担任 选项：A，班组长 B、具有具备带电作业资格、带电作业实践经验的人员C、经过培训的人员 D、技术人员。"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例7 第9题", "text": "第9小题。施工现场临时用电应采用（　）保护系统 选项：A，TN-；B，C B、TN-S C、IT D、TT。"}, {"tag": null, "text": "答案：B，C B、TN-S C、IT D、TT。"}, {"tag": "案例7 第10题", "text": "第10小题。起重机等大功率机械设备的供电开关箱（　）电缆向设备供电 选项：A，只可使用 5 芯C、可使用 3 芯B、只可使用 4 芯D、使用 4 芯 5 芯均可13。"}, {"tag": null, "text": "答案：A，只可使用 5 芯C、可使用 3 芯B、只可使用 4 芯D、使用 4 芯 5 芯均可13。"}, {"tag": "案例8 高处作业", "text": "案例背景：2017 年 2 月某日下午,气温只有 3°C左右,某通讯公司员工沈某某带实习生到 某电信代销店安装宽带,正 好碰到旁边一用户的线路,因为高度不足,被过往的车子绊倒,要求修复为将路两侧线路绑扎到 5.5 米高处, 沈某某使用用户处借来的人字型铝合金梯子展开成一"}, {"tag": null, "text": "字梯后,作为登高工具,在第三次下梯子过程中发生 子连接处折断,人从约 0.75 米高处倒地,不幸头后部碰到水泥路边水泥路面高出辅道 10cm 抢救无效死亡, 根据调查所知,沈某某作业时未安全帽,爬梯也无人扶梯。"}, {"tag": "案例8 高处作业 第1题", "text": "第1小题。梯子放置的斜度要适当,梯子与地面的夹角不符合规范要求的是:（　） 选项：A，60° B、65° C、70° D、80°。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例8 高处作业 第2题", "text": "第2小题。使用直梯时,作业人员应站在距离梯顶不少于（　）梯蹬上 选项：A，0.5m B、0.8m C、1m D、1.2m。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例8 高处作业 第3题", "text": "第3小题。使用人字梯是两梯夹角宜为:（　） 选项：A，30° B、40° C、50° D、60°。"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例8 高处作业 第4题", "text": "第4小题。按照高处作业分级,沈某某本次作业（　） 选项：A，一级 B、二级 C、三级 D、四级14。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例8 高处作业 第5题", "text": "第5小题。以下原因中,属于导致沈某死亡事故的间接原因是（　） 选项：A，沈某某不带安全帽 B、梯子折断 C、水泥路面突出 D、无人扶梯监护。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例8 高处作业 第6题", "text": "第6小题。高处作业,在选择安全带挂点应当（　）,注意防止摆动碰撞。 选项：A，高挂低用 B、低挂高用 C、低挂低用 D、高挂高用。"}, {"tag": null, "text": "答案：A，高挂低用 B、低挂高用 C、低挂低用 D、高挂高用。"}, {"tag": "案例8 高处作业 第7题", "text": "第7小题。低温或高温环境下进行高处作业,应采取保暖和防暑降温措施,作业时间（　） 过长 选项：A，禁止 B、严禁 C、不宜 D、不得。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例8 高处作业 第8题", "text": "第8小题。创伤的急救原则（　） 选项：A，先固定,后搬运,再抢救 B、先搬运,后固定,再抢救 C、先抢救,后搬运,再固定 D、先抢救,后固定,再搬运。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例8 高处作业 第9题", "text": "第9小题。登高证有效期（　）年,全国范围内有效 选项：A，2 B、3 C、5 D、6。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例8 高处作业 第10题", "text": "第10小题。安全帽的帽衬、衬带的顶部与帽壳内顶之间应保持（　）mm 的空间 选项：A，30~60 B、25~50 C、10~20 D、5~2515参考:。"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例8 高处作业", "text": "案例背景：11通信工程中选用的安全帽通常有效期通常为(A)年。 A.2年B.3年C.5年D.6年"}, {"tag": "案例8 高处作业 第12题", "text": "第12小题。易引发高处坠落事故的主观原因有（　） 选项：A，风力超过5级的天气 B.作业时接听手机；B，C  地面不平 D寒冷天气作业13可能造成高处坠落事故的非管理因素有(D)A监督管理不到位 B安全交底不落实C未向作业人员提供安全帽D梯子质量差16参考:。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例9触电", "text": "案例背景：某通信施工公司承接了总包单位分包的某电信运营商移动驻地网工程任务,需要从电力线杆路上附挂 1 条 光缆到某办公大楼。2013 年 9 月 24 日上午 10 时,班组长扬某带领 3 名施工人员来到某宾馆大门西侧供电 变压器边进行引上光缆穿放。班 组长扬某安排作"}, {"tag": null, "text": "业人员冯某某上杆作业。当冯某某登上变压器 H 杆横担进 行操作时, 头部不慎碰到电力线与变压器连接的铜鼻子裸露处,即遭到高压电击,从近 3 米左右的高处坠 落而死亡。 经调查发现:该光缆原是从地下管道穿放的,后因现有通信管道不通,总包单位有关人 员擅自 更改设"}, {"tag": null, "text": "计路由,将光缆管道穿放更改为从电力线杆路上附挂。杨某班组进场前,无人到现场勘察,也无人 进行安全技术交底。死者冯某某,1998 年 5 月出生, 经熟人介绍进公司不到 3 个月,未经过教育培训考核, 登杆时未系戴有近电预警器的安全帽,班组长扬某在一旁未做任何提"}, {"tag": null, "text": "醒。调查还发现:该通信施工公司无 施工资质,未给冯某某办理工伤保险,只办理了 20 万的人身意外伤害保险,项目开工后, 该公司和总包单 位均无人进行过安全检查。事发时,某监理单位监理员张某在场。 本次事故总损失金额为 210 万元。其中:现场抢救费用 5.2 "}, {"tag": null, "text": "万元、处理事故事 务性费用 7.8 万元、丧葬费 和一次性工亡补助金、抚恤金等 95 万元、停产损失 25 万元、机房设备提失 55 万元、安监部门罚款 10 万 元、其他损失 8 万元。 17 参考:"}, {"tag": "案例9触电 第1题", "text": "第1小题。本次事故的事故等级是( 选项：A，)A、一般事故 B、重大事故 C、特别重大事故 D、电击事故。"}, {"tag": null, "text": "答案：A，)A、一般事故 B、重大事故 C、特别重大事故 D、电击事故。"}, {"tag": "案例9触电 第2题", "text": "第2小题。本次事故的直接经济损失为（　） 选项：A，173 万 B、210 万 C、188 万 D、177 万。"}, {"tag": null, "text": "答案：A，173 万 B、210 万 C、188 万 D、177 万。"}, {"tag": "案例9触电 第3题", "text": "第3小题。如果事故发生在今年,则安监部门可以对事故发生单位处罚款为（　） 选项：A，20 万以上 50 万以下 B、30 万以上 50 万以下 C、30 万以上 100 万以下 D、50 万以上 100 万以下。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例9触电 第4题", "text": "第4小题。不属于本起事故直接原因的是（　） 选项：A，擅自更改设计路由 B、作业人员未佩戴安全帽 C、作业人员违章作业 D、总包单位违法分包。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例9触电 第5题", "text": "第5小题。梯子架设在吊线上时,梯子上端应高出吊线（　）cmA、20 B、30 C、40 D、50"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例9触电 第6题", "text": "第6小题。造成本次事故的危险源是( 选项：A，)A、裸露的铜鼻子 B、作业人员未佩戴安全帽 C、作业面距离高压电过近 D、安全技术交底缺失。"}, {"tag": null, "text": "答案：A，)A、裸露的铜鼻子 B、作业人员未佩戴安全帽 C、作业面距离高压电过近 D、安全技术交底缺失。"}, {"tag": "案例9触电 第7题", "text": "第7小题。冯某上杆作业可以不佩戴的物品包括（　） 选项：A，安全帽 B、绝缘手套 C、防护眼镜 D、安全带 18。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例9触电 第8题", "text": "第8小题。事故调查处理工作中坚持（　） 选项：A，优先保护职工权益的原则 B、企业利益至上的原则 C、公正、公开的原则 D、科学严谨、依法依规、实事求是、注重实效。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例9触电 第9题", "text": "第9小题。根据本次事故等级情况,安监部门可以对事故发生单位处（　）罚款 选项：A，2~10 万 B、10~20 万 C、20~50 万 D、50~100 万。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例9触电 第10题", "text": "第10小题。案例中,该起事故的事故发生单位是（　） 选项：A，电信运营商 B、监理公司 C、总包单位 D、某通信施工公司。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例9触电 第11题", "text": "第11小题。当施工人员在 10KV 的高压线附近进行作业时,其身体(含超出身体以外的金 属工具或物件)离开高压线的最小间距应保证（　）米 选项：A，1.5 B、2.5 C、4 D、8。"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例9触电 第12题", "text": "第12小题。建筑法规定,施工企业必须按照工程设计图纸和施工技术标准施工,不得偷工减料,如施工单位发现设计不合理需要修改的,由（　）负责修改 选项：A，施工单位 B、原设计单位 C、建设单位 D、总包单位。"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例9触电 第13题", "text": "第13小题。根据通信线路设计规范要求,架空电缆线路不宜与电力线路合杆架设。在不可 避免时,允许和（　）的电力线路合杆架设。 选项：A，1K 以下 B、10KV 以下 C、22KV 以下 D、35KV 以下19。"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例10  触电", "text": "案例背景：2015 年某日 10 时 30 分许,某市施工队在某农田光纤线路外包施工工地作业过 程中,潘* 争带队的 5 名人员赤脚站在水田 中按先后排列队形一起拉钢绞线,拉动 时钢绞线时与电力电缆发生摩擦,电力电缆破损后引发钢绞线导电,潘*特、潘*武、 79/88 龙"}, {"tag": null, "text": "*新、潘*争共 4 人被电击倒,站在最后的李*琼因站在相对干燥田埂上而没有被电 伤。事发后附近的班组成员立即 展开自救,一人被救醒,另外 3 人死亡,直接经济 损失约 160 万元。 据调查本次事发的光缆工程项目是由某通讯工程公司 承包后,再将施工任务分 包潘"}, {"tag": null, "text": "*争施工队。潘*争施工队不具备通讯工程施工资质,施工前仅向每个施工队员 提供一副棉手 外未配发其他防护用品,也未对施工队员进行过施工和安全教育培 训。施工中的实际施工路由与技术路由也存在很大偏差。"}, {"tag": "案例10  触电 第1题", "text": "第1小题。如紧线时遇到导、地线有卡、挂现象,处理时操作人员应站在卡线处的（　）侧 选项：A，内 B、外 C、后 D、前。"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例10  触电 第2题", "text": "第2小题。一旦发现有人触电倒地,首先应该( 选项：A，)。A、使伤者脱离电源 B、实施心肺复苏 C、打 112 急救电话 D、向企业负责人报告。"}, {"tag": null, "text": "答案：A，)。A、使伤者脱离电源 B、实施心肺复苏 C、打 112 急救电话 D、向企业负责人报告。"}, {"tag": "案例10  触电 第3题", "text": "第3小题。实施总承包的工程,涉及分包工程的施工现场应急救援预案应由（　）编制。 选项：A，建设单位 B、监理单位 C、总包单位 D、分包单位。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例10  触电 第4题", "text": "第4小题。按照《生产安全事故应急条例》规定,建筑施工单位应当至少（　）生产安全事 故应急救援预案演练,并将演练情况报送所在地县级以上地方人民政府负有安全 生产监督管理职责的部门。 选项：A，每 3 个月组织 1 次 B、每半年组织 1 次 C、每年组织 1 次 D、每二年组织 1 次 、20。"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例10 第5题", "text": "第5小题。以下不属于违法分包的是（　）。 选项：A，专业承包企业将其承包工程中的劳务作业发包给劳务分包企业 B、劳务分包企业将其承包工程中的劳务作业发包给另一劳务分包企业 C、专业承包企业将其承包工程中的专业施工作业发包给另一专业承包企业 D、总承包单位将主体结构的施工进行分包。。"}, {"tag": null, "text": "答案：A，专业承包企业将其承包工程中的劳务作业发包给劳务分包企业 B、劳务分包企业将其承包工程中的劳务作业发包给另一劳务分包企业 C、专业承包企业将其承包工程中的专业施工作业发包给另一专业承包企业 D、总承包单位将主体结构的施工进行分包。。"}, {"tag": "案例10 第6题", "text": "第6小题。根据《生产安全事故报告和调查处理条例》,该起事故属于（　）。 选项：A，一般事故 B.较大事故 C、重大事故 D、特别重大事故。"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例10 第7题", "text": "第7小题。在施工过程中,施工人员发现设计图纸不符合设计标准,施工单位技术负责人采取的正确做法是:（　） 选项：A，继续按照工程设计图施工 B、按照技术标准修改设计图纸 C、追究设计单位违法责任 D、及时提出意见和建议。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例10 第8题", "text": "第8小题。在供电线路或电力设施附近作业时,作业人员必须（　）、戴绝缘手套、穿绝缘鞋和使用绝缘工具 选项：A，戴安全帽 B、穿防护服装 C、使用绝缘棒 D、系安全带。"}, {"tag": null, "text": "答案：A，戴安全帽 B、穿防护服装 C、使用绝缘棒 D、系安全带。"}, {"tag": "案例10 第9题", "text": "第9小题。通信施工企业采购的耐压试验 5KV 的电绝缘鞋,在工频(50~60Hz)通常使用在 电压（　）范围的作业环境中 选项：A，220V B、380V C、1KV D、5KV 以下21。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例11有限空间", "text": "案例背景：某日,某通信施工公司 8 名施工人员在队长丁某带领下,进行人井铺缆作业。 8 时 40 分,陈某首先撬开人井盖,顺着电缆 托架下到井内观察,井下污水漫到膝盖,不到 3 分钟,陈某突然瘫倒在人井内。正在整理材料的潘某和李某见状,不由分说, 先后跳下人井救人,也一"}, {"tag": null, "text": "头栽倒在井底。一旁作业的韩某发现后大声呼叫,随后队长丁某摒住气迅速下到井底,把绳子拴到 他们腰上,众人合力先后将 3 人拉出了井口,并随即报警。15 分钟后,110 民警和 120 急救人员赶到现场,检查发现,事 故造成 1 人当场死亡, 2 人经抢救无效于 "}, {"tag": null, "text": "2 天后死亡。经了解,这些施工人员是 2 个月前被队长丁某从老家召雇来干活的, 无劳动合同,无工伤保险:该项目由丁某私人承包,开工己有一月之余,开工前无人进行安全技术交底,期间也无人进行过 安全检查。施工人员韩某说:\"也不知道害井里咋会有毒气!也没有人告诉我们"}, {"tag": null, "text": "这些\"。作业现场除有一个锥形桩,二只工具 包外,未发现有围档、警示标志、安全绳、排风设备,更没有气体检测仪等安全检测装备。"}, {"tag": "案例11有限空间 第1题", "text": "第1小题。根据《生产安全事故报告和调查处理条例》,该起事故属于（　）。 选项：A，一般事故 B.较大事故C、重大事故 D、特别重大事故。"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例11有限空间 第2题", "text": "第2小题。该起事故的原因中,导致陈某发生事故的直接原因的是（　）。 选项：A，未参加安全教育培训 B、作业现场未设警示标志C、未通风就贸然进入有毒气的人井 D、未参加安全交底。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例11有限空间 第3题", "text": "第3小题。以下属于导致潘某死亡的间接原因是（　）。 选项：A，人孔内毒气过量 B、未佩戴防毒面具盲目施救C、人孔内氧浓度低 D、安全知识缺乏22。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例11 第4题", "text": "第4小题。通信建设工程安全费的提取标准应为( 选项：A，)。A、建安费的 1.5% B、施工费的 1.5%C、建安费的 1% D、施工费的 1%。"}, {"tag": null, "text": "答案：A，)。A、建安费的 1.5% B、施工费的 1.5%C、建安费的 1% D、施工费的 1%。"}, {"tag": "案例11 第5题", "text": "第5小题。氧气含量低于（　）的环境称为缺氧环境。 选项：A，16.5%；B，17.5%；C，18.5%；D，19.5%。"}, {"tag": null, "text": "答案：D，19.5%。"}, {"tag": "案例11 第6题", "text": "第6小题。劳动合同与劳动关系的说法以下正确的是( 选项：A，)A、建立劳动关系就应当订立书面劳动合同B、提交工伤申请时应当提供劳动合同C、双方劳动合同在签订合同是确立D、先工作后签合同的最迟不超过 1 个月。"}, {"tag": null, "text": "答案：A，)A、建立劳动关系就应当订立书面劳动合同B、提交工伤申请时应当提供劳动合同C、双方劳动合同在签订合同是确立D、先工作后签合同的最迟不超过 1 个月。"}, {"tag": "案例11 第7题", "text": "第7小题。该起事故中队长丁某涉嫌（　） 选项：A，重大责任事故罪B重大劳动安全事故罪C强令违章冒险罪D工程重大安全事故罪23。"}, {"tag": null, "text": "答案：A，重大责任事故罪B重大劳动安全事故罪C强令违章冒险罪D工程重大安全事故罪23。"}, {"tag": "案例13", "text": "案例背景：4 月 21 日,某电信工程公司接到某运营商下达的童卫路宽带工程施工任务后,安排具有 15 年工龄的职工张某 (男 42 岁,兼职安全员),沿施工路由对管孔进光缆放装现场资料的确认。下午 3 点 40 左右,张某独自一 人来到位于童卫路附近的施工现场,打开人井"}, {"tag": null, "text": "盖,并将井盖放在旁边的路面上,用自己的黄色安全帽放在路面 上当作警示牌,随后就进入了人井。不久,当他爬出人井时,正好一辆的长安面包车从人井上高速驶过。张某 当即被汽车保险杠撞中头部并掉进了人井里。接警的消防队员、医护人员迅速赶来救援,不幸的是张某在被救 上来时"}, {"tag": null, "text": "已经气绝身亡。 1城市道路施工时如需围蔽工作区的,围栏的高度一般应(B),距交叉路口20m内、地面 0.8m 以上采用通透 式围挡。A. ≧1.2m    B≧1.8m     C2.0m      D.≧2.5m 2进入人井作业,作业人员应该佩戴( B )安"}, {"tag": null, "text": "全带。 A.带缓冲器的绳式 B.全身式 C.围杆作业 D.区域限制式 3安全色中(A )常用于表示紧急停止、禁止和危险的信号。 A.红色 B黄色 C.蓝色 D.绿色 4导致事故的发生的直接原因是包括机械、物质或环境的不安全状态和(B)。 A.安全操作规程不健全"}, {"tag": null, "text": " B.人的不安全行为 C.劳动组织不合理 D.现场缺乏检查或指导错误 5根据《生产安全事故报告和调查处理条例》中华人民共和国国务院令第493号),该起事故属于(A ) A.  一般事故 B.较大事故C. 重大事故D.  特别重大事故 24   B A  B"}, {"tag": "案例13", "text": "案例背景：6建设工程工地四周应按规定设置连续、密闭的围栏:在市区主要路段和市容景观道路及机场、码头、车站广 场设置的围栏其高度不得低于(D )。 A.A.1mB.B.1.2mC.C.1.8mD.D.2.5m 7道路上施工作业前,应设置安全警示标志,标志设置时应(A) A"}, {"tag": null, "text": ".从警告区开始,直到终止区结束 B.从警告区开始,直到作业区结束 C.从作业区开始,往警告区起点处 D.从缓冲区开始,直到作业区结 8该起事故的性质应定为(A ) A.责任事故B.B.意外事故C.C.人身伤害事故D.D.突发事件 9在道路进行夜间施工作业时,应"}, {"tag": null, "text": "在路栏或渠化设施顶部设置施工警告灯,警告灯的间距应( C )。 A.A.≦6mB.B.≦10mC.C.≦20mD.D.≦25m 10以下属于该起事故的间接经济损失的有( B )。 A. 现场抢救费用 B.停业造成的损失 C.事故赔偿 D.汽车损坏价值 11张某"}, {"tag": null, "text": "在人井中确认资料,爬出人井时,被过往的汽车正巧撞上死亡 某家属可以获得的赔偿,说法正确的是(A) A交通事故的赔偿和工伤赔偿都能获得 B只能获得交通事故的补偿不能获得工伤赔偿 C只能获得工伤赔偿不能获得交通事故赔偿 D交通事故的赔偿和工伤赔偿都不能获得,只能获"}, {"tag": null, "text": "得意外伤害赔偿25"}, {"tag": "案例14", "text": "案例背景：案例背景:某市通信工程公司在某郊区农田间进行光缆线路工程施工。该光缆路由是在kV 电力线正下方 2 米 多的位置。作业队长带领同村 4 名作业人员到达施工现场,传达了项目经理“施工中要注意安全”的要求,随后 离开。作业人员使用铝合金伸缩梯子挂光缆,在放完一段光"}, {"tag": null, "text": "缆后,两人举着梯子在电力线下方移动,致使铝合 金梯子上方与电力线接触,举梯人触电。另外 2 人直接用手施救,造成 3 人死亡,1 人受伤的事故。事故发生 后,受伤人立即报告了现场情况。事故调查发现:本项目施工准备过程项目负责人没有组织危险源辨识和制定 安全防范"}, {"tag": null, "text": "措施,没有书面安全技术交底,但项目经理在开工前强调“施工中要注意安全”。事后,公司按照“四不 放过”原则对事故进行了处理。事故处理后,施工单位为现场配置了安全防护用品,本工程大部分段落,施工 人员采用吊板方式布放光缆,测试过程中安全使用仪器仪表,最后工程通过验"}, {"tag": null, "text": "收。 26 参考:"}, {"tag": "案例14 第1题", "text": "第1小题。本项目安全技术交底应该由（　）向全部作业人员和管理人员进行详细说明。 选项：A，公司技术总监 B.公司安全总监 C.项目技术负责人 D.项目专职安全员2该事故的类别是(C )事故。A.高处坠落 B.机械伤害 C.触电 D.其他伤害3造成本工程安全事故的直接原因是(C )。A. 项目负责人安全意识缺乏 B.施工单位安全培训不到位 C.施工人员违章作业 D.施工人员安全知识缺乏4按照相关规范要求,公司应为本工程所有参与人员配备的安全防护用品是(A)。A.安全帽 B.安全带 C.绝缘鞋 D.绝缘手套5该事故的等级是(B )事故。A.一般B.较大C.重大D.特别重大6下列事故处理做法,不属于事故处理“四不放过”原则的是(A)。A.公司组织了安全生产标准化培训B.公司对全员就本事故的教训进行专题教育培训C.公司制定了线路施工常见事故预防措施并监督实施D.行政主管部门对项目负责人进行了处罚27。"}, {"tag": null, "text": "答案：A，公司技术总监 B.公司安全总监 C.项目技术负责人 D.项目专职安全员2该事故的类别是(C )事故。A.高处坠落 B.机械伤害 C.触电 D.其他伤害3造成本工程安全事故的直接原因是(C )。A. 项目负责人安全意识缺乏 B.施工单位安全培训不到位 C.施工人员违章作业 D.施工人员安全知识缺乏4按照相关规范要求,公司应为本工程所有参与人员配备的安全防护用品是(A)。A.安全帽 B.安全带 C.绝缘鞋 D.绝缘手套5该事故的等级是(B )事故。A.一般B.较大C.重大D.特别重大6下列事故处理做法,不属于事故处理“四不放过”原则的是(A)。A.公司组织了安全生产标准化培训B.公司对全员就本事故的教训进行专题教育培训C.公司制定了线路施工常见事故预防措施并监督实施D.行政主管部门对项目负责人进行了处罚27。"}, {"tag": "案例14", "text": "案例背景：7本项目实施过程中,不得使用吊板作业的情形是(B)。 A.A.在 7/2.2 规格的吊线上B.B.在跨越公路杆档C.C.在跨越水田杆档D.D.吊板上的挂钩已磨损五分之一时 8本工程实施过程中,人员与电力线的最小安全距离是(A)米。 A.A.2.0B.B.2.5"}, {"tag": null, "text": "C.C.3.5D.D.4.0 9该事故发生后,现场人员应立即向(D )报告。 A.A.项目负责人B.B.项目安全负责人C.C.公司主管安全副总D.D.公司负责人 10\\在测试过程中,(D )的测试接口不得正对着眼睛观察。 A.数字万用表B.PMD 分析仪(分析"}, {"tag": null, "text": "端)C.光功率计D.波长可调光源 28"}, {"tag": "案例15", "text": "案例背景：某施工项目部承接一无线基站工程项目,项目经理施某。在进行某处楼顶铁塔天馈线安装作业由穆某带领的施 工班组负责,穆某为班组兼安全员,穆某安排马某(项目经理施某从另一作业班组的调来)负责楼顶室外走线架焊 接连通工作,派佟某和李某负责上塔安装天馈线,由于人手不够穆某"}, {"tag": null, "text": "又从当地找了农民张某负责在塔下监护, 以防止其他人员进入施工区内。作业前,穆某简单地交待了作业内容及安全事项,三人虽携带了安全带,但为 了方便操作,都未系挂,马某作业时不慎摔下,当场死亡。 据调查,施工队人员的持证情况如下:穆某技工证、佟某持登高证,马某持电焊"}, {"tag": null, "text": "证,其他人员无特种作业证。楼 高10米周边无栏杆,楼顶上的走线架高2米,铁塔高20米。"}, {"tag": "案例15 第1题", "text": "第1小题。以下不属于造成本起事故的直接原因是（　）。 选项：A，穆队长违章指挥 B、马某无证作业 C.马某未使用安全带 D.安全技术交底不规范。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例15 第2题", "text": "第2小题。该事故中事故的直接责任者是（　）。 选项：A，马某 B.穆某 C.马某和穆某D.穆某,、马某、佟某和李某都是29。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例15 第3题", "text": "第3小题。离开特种作业岗位达（　）以上的特种作业人员,应当重新进行实际操作考核,经确认合格后方可上岗作业。 选项：A，3个月 B.6个月；B，C  一年；C，D  两年。"}, {"tag": null, "text": "答案：B，C  一年。"}, {"tag": "案例15 第4题", "text": "第4小题。楼顶临边作业时设置的防护栏杆应能承受的外力大小最小应达到（　）。 选项：A，500   N；B，800N   C.1000N   D.承受外力2000 N。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例15 第5题", "text": "第5小题。佟某和李某塔上作业时,应使用有后备保护绳的双背带式或全身式安全带,当后备保护绳超过（　）时,应使用缓冲器。 选项：A，1米 B.2米 C.3米 D.4米。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例15 第6题", "text": "第6小题。佟某和李某两人向时上塔,两人之间距离应保持在（　）以上 选项：A，2米 B.2.5米 c.3米 D.4米。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例15 第7题", "text": "第7小题。移动通信铁塔天馈线安装时,其室外馈线防雷接地一般要求进行（　）接地方式。 选项：A，,单点 B.二点 C.三点 D.四点。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例15 第8题", "text": "第8小题。在此项作业中,（　）无需持特种作业操作资格证。 选项：A，穆某 B.李某 C.佟某 D.马某30。"}, {"tag": null, "text": "答案：A，穆某 B.李某 C.佟某 D.马某30。"}, {"tag": "案例16 第9题", "text": "第9小题。塔上作业时,应以塔基为圆心,（　）为半径,设置施工区,非作业人员不得入内。 选项：A，塔高的20%  B.塔高的50%   C.塔高 D.塔高的1.05倍。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例16 第10题", "text": "第10小题。下列（　）情况下不属于违章作业。 选项：A，上塔作业时穿防滑鞋 B.电焊作业时不带护目镜C.高处作业时不系安全带 D.监护人员站在在施工禁区内监护。"}, {"tag": null, "text": "答案：A，上塔作业时穿防滑鞋 B.电焊作业时不带护目镜C.高处作业时不系安全带 D.监护人员站在在施工禁区内监护。"}, {"tag": "案例16 第11题", "text": "第11小题。不需要持特种作业人员操作证上岗的是（　） 选项：A，电工B、焊工C、项目经理D、高空作业人员。"}, {"tag": null, "text": "答案：C。"}, {"tag": "案例16 第12题", "text": "第12小题。不属于施工单位从本事故中应当汲取的教训的是（　） 选项：A，施工单位应当建立健全安全生产责任制度和安全生产教育培训l制度,制定安全生产规章制度和操作规程,并贯彻落实B、施工单位应当加强安全生产教育培训,提高现场人员安全意识和安全操作技能。C、加强现场安全生产管理,保证操作人员按规定持证上岗。D、施工单位应做好消息封锁,不能让安监部门知晓事故,以免受罚。31。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例16", "text": "案例背景：某通信工程公司承接了一项30Km城区管道光缆敷设工程。工程公司针对此项目,任命了项目经理,组建了项目经 理部。项目经理部在施工前做了以下工作:安排现场勘查,利用直观经验法辨识了危险源,并采用专家打分评价 法找出了2个较大危险源:人井内可能存在的有毒有害气体、道"}, {"tag": null, "text": "路上的施工场所。针对人井内有毒有害气体编制 了控制措施。组建了施工作业队伍,作业人员均参加过公司和项目部级安全生产教育。"}, {"tag": "案例16 第1题", "text": "第1小题。不属于通信工程常用的危险源辨识方法的是（　） 选项：A，直观经验法B、对照分析法 C、类比推断法 D、盲猜法。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例16 第2题", "text": "第2小题。针对人孔内有可能存在有毒有害气体,下面那个防范措施是错误的（　） 选项：A，严禁将易燃、易爆物品带入管道人孔B、严禁在人孔吸烟、生火取暖、点燃喷灯C、进入人孔前,必须先通风,并使用专用气体检测仪器进行气体检测,确认无易燃、易爆、有毒、有害气体并通风后方可进入D、在人孔内作业期间,上下人孔的梯子不得撤走,人孔上面必须有专人监护,如有人窒息可立刻进入人孔施救 32。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例16 第3题", "text": "第3小题。本项目的安全生产费应按（　）计取。 选项：A，建安费的 2%   B、施工费的1.5% C、建安费的1.0%；B，D  施工费的1.0%。"}, {"tag": null, "text": "答案：A，建安费的 2%   B、施工费的1.5% C、建安费的1.0%。"}, {"tag": "案例16 第4题", "text": "第4小题。不属于施工企业主要负责人安全职责的是（　） 选项：A，对本企业安全生产工作负全面责任。B、建立、健全本单位安全生产责任制;组织制定本单位安全生产规章制度和操作规程C、落实安全生产组织领导机构,成立安全生产委员会,担任主任D、根据工程的特点组织制定安全施工措施,实施项目安全生产管理。"}, {"tag": null, "text": "答案：D。"}, {"tag": "案例16 第5题", "text": "第5小题。不属于施工企业专职安全员职责的是（　） 选项：A，组织或者参与拟订本单位安全生产规章制度、操作规程和生产安全事故应急救援预案B、建立、健全本单位安全生产责任制,组织制定本单位安全生产规章制度和操作规程C、督促落实本单位重大危险源的安全管理措施D、检查本单位的安全生产状况,及时排查生产安全事故隐患,提出改进安全生产管理的建议33补充。"}, {"tag": null, "text": "答案：B。"}, {"tag": "案例16 第1题", "text": "第1小题。根据《安全生产法》要求,应当制定生产安全事故应急救援预案的单位包括（　）。 选项：A，风景区 B、工业园区 C、街道办事处 D、县级以上地方各级人民政府E、军队。"}, {"tag": null, "text": "答案见题库原卷标注。"}, {"tag": "案例16 第2题", "text": "第2小题。施工单位项目责任人的安全生产责任主要包括（　） 选项：A，组织制定安全施工措施B、消除安全事故隐患C、及时、如实上报安全事故 D、编制安全生产规章制度和操作规程E、确保安全生产费用的投入。"}, {"tag": null, "text": "答案见题库原卷标注。"}, {"tag": "案例16 第3题", "text": "第3小题。《安全色》(GB2893-2008)中规定白色的对比色为黑色。(错误 )"}, {"tag": null, "text": "答案见题库原卷标注。"}, {"tag": "案例16 第4题", "text": "第4小题。企业的各项安全生产管理制度应规定工作内容、职责与权限、工作程序和工作标准等内容。（　）"}, {"tag": null, "text": "答案：√。"}, {"tag": "案例16 第5题", "text": "第5小题。综合布线工程中,信息插座安装时外壳应接地,并应有明显的标志。（　）"}, {"tag": null, "text": "答案：√。"}, {"tag": "案例16 第6题", "text": "第6小题。安全生产奖惩的原则是“谁主管,谁负责;谁出问题,谁承担责任”。（　）"}, {"tag": null, "text": "答案：√。"}, {"tag": "案例16 第7题", "text": "第7小题。防雷接地系统的室外钢材料、紧固件应采用热镀锌制品或铝制品(不锈钢制品)。(错)"}, {"tag": null, "text": "答案见题库原卷标注。"}, {"tag": "案例16 第8题", "text": "第8小题。若使用胶木灯具,可用的最大功率灯泡为150W。(错 )"}, {"tag": null, "text": "答案见题库原卷标注。"}, {"tag": "案例16 第9题", "text": "第9小题。特种设备使用单位应当配备取得特种设备安全管理人员资格证书的人员担任特种设备安全管理负责人 （　）34"}, {"tag": null, "text": "答案：√。"}];
const synth = window.speechSynthesis;
let cur = -1, playing = false, pass = 1, voice = null;
const starts = SEGS.map((s, i) => s.tag ? i : -1).filter(i => i >= 0);
const list = document.getElementById('list');

SEGS.forEach((s, i) => {
  if (s.tag) { const t = document.createElement('div'); t.className = 'tag'; t.textContent = s.tag; list.appendChild(t); }
  const d = document.createElement('div'); d.className = 'line'; d.textContent = s.text;
  d.onclick = () => { pass = 1; start(i); }; list.appendChild(d); s.el = d;
});

function pickVoice() {
  const vs = synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('zh'));
  voice = vs.find(v => /婷婷|Tingting|晓晓|Xiaoxiao|辉辉|Huihui|Yaoyao/.test(v.name)) || vs[0] || null;
}
pickVoice();
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = pickVoice;

function qStart(i) { let r = 0; for (const s of starts) { if (s <= i) r = s; else break; } return r; }
function qEnd(i) { for (const s of starts) { if (s > i) return s - 1; } return SEGS.length - 1; }

function start(i) {
  synth.cancel();
  if (i >= SEGS.length) { done(); return; }
  if (i < 0) i = 0;
  cur = i;
  document.querySelectorAll('.line').forEach((el, k) => {
    el.classList.toggle('now', k === cur);
    el.classList.toggle('done', k < cur);
  });
  SEGS[cur].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  document.getElementById('status').textContent = (pass === 2 ? '第2遍 · ' : '') + `第 ${cur + 1}/${SEGS.length} 句`;
  const u = new SpeechSynthesisUtterance(SEGS[cur].text);
  u.lang = 'zh-CN';
  if (voice) u.voice = voice;
  u.rate = parseFloat(document.getElementById('rate').value);
  u.onend = () => {
    if (!playing) return;
    if (cur < qEnd(cur)) { pass = pass; start(cur + 1); }
    else if (document.getElementById('mem').checked && pass === 1) { pass = 2; start(qStart(cur)); }
    else { pass = 1; const n = qEnd(cur) + 1; if (n < SEGS.length) start(n); else done(); }
  };
  synth.speak(u);
  playing = true; setBtn();
}
function done() { playing = false; setBtn(); document.getElementById('status').textContent = '✅ 讲完啦'; }
function setBtn() { document.getElementById('toggle').textContent = playing ? '⏸ 暂停' : '▶ 播放'; }
document.getElementById('toggle').onclick = () => {
  if (cur === -1) { start(0); return; }
  if (playing) { synth.pause(); playing = false; setBtn(); }
  else if (synth.paused && synth.speaking) { synth.resume(); playing = true; setBtn(); }
  else { playing = true; start(cur); }
};
document.getElementById('prev').onclick = () => { pass = 1; const p = qStart(Math.max(cur - 1, 0)); start(p === cur ? 0 : p); };
document.getElementById('next').onclick = () => { pass = 1; const n = starts.find(s => s > cur); start(n === undefined ? SEGS.length : n); };
document.getElementById('rate').onchange = () => { if (cur >= 0) { const c = cur; start(c); } };
</script>
