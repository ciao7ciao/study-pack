<script>
const QUIZ = {"title":"第三章","questions":[{"type":"单选","key":"第1题","stem":"下列对通信工程建设、勘察、设计、施工、监理等安全生产责任主体的要求,错误的是（　）","options":["必须遵守安全生产法律、法规","执行保障生产安全的国家标准、行业标准","必须进行安全生产科技创新","确保通信工程建设安全生产,依法承担安全生产责任"],"answer":"C","why":"各责任主体必须遵守安全生产法律法规、执行保障生产安全的国家标准和行业标准，并依法承担安全生产责任；“必须进行安全生产科技创新”属倡导性要求而非法定义务，表述绝对故错误。","expl":"第三章第一题。考点：通信工程各责任主体的共同要求。错误的说法是：必须进行安全生产科技创新。\n对通信建设、勘察、设计、施工、监理各方的要求是：遵守安全生产法律法规，执行保障安全的国家标准、行业标准，确保安全生产、依法承担责任。科技创新是鼓励，不是必须，说必须就是错的。"},{"type":"多选","key":"第2题","stem":"下列安全生产责任中,属于建设单位的是 （　）","options":["建设工程安全生产费不得打折","严格按照工程建设强制性标准和安全生产操作规范进行施工作业","工程合同中应明确安全生产费支付方式、数额及时限","对有可能引发通信工程安全隐患的灾害提出防治措施","审查施工组织设计中的安全技术措施和安全专项施工方案"],"answer":"AC","why":"建设单位责任核心是保障费用：安全生产费不得打折、合同中明确支付方式数额时限；B“组织施工作业”是施工单位职责，D灾害防治是勘察设计职责，E审查专项方案是监理职责，均非建设单位。","expl":"多选。考点：哪些属于建设单位的安全生产责任。正确的是两条。\n建设工程安全生产费不得打折；工程合同中应明确安全生产费的支付方式、数额及时限。\n错的三条：按强制标准施工作业是施工单位的；对灾害提出防治措施是勘察设计单位的；审查施工组织设计是监理单位的。口诀：建设单位管给钱、管合同。"},{"type":"单选","key":"第3题","stem":"通信工程开工前,（　） 应当明确参与工程相关单位的安全生产责任","options":["建设单位","设计单位","施工单位","监理单位"],"answer":"A","why":"依据《通信建设工程安全管理规定》，建设单位是工程组织者，开工前应当明确参与工程建设各相关单位的安全生产责任，落实各方安全义务；设计、施工、监理单位是被明确对象而非明确主体。","expl":"考点：通信工程开工前，谁应当明确参与工程相关单位的安全生产责任。答案：建设单位。\n工程是建设单位发包的，开工前由它把各家的安全责任划清楚。谁发包，谁立规矩。"},{"type":"单选","key":"第4题","stem":"下列安全生产责任中,属于建设单位的是 （　）","options":["不得压缩合同工期","勘察文件应当真实、准确,满足通信建设工程安全生产的需要","明确安全费用提取和使用的程序、职责及权限","对施工单位安全管理人员安全生产知识和管理能力进行考核"],"answer":"A","why":"不得压缩合同工期是建设单位的安全责任，压缩工期易导致抢工冒险、埋下事故隐患；勘察文件真实准确是勘察单位责任，考核施工安全管理人员是建设单位权利，明确安全费用程序属施工单位内部管理。","expl":"考点：又一条建设单位责任。答案：不得压缩合同工期。\n抢工期就是抢事故，所以法律明文禁止建设单位压缩合同工期。其他三条：勘察文件真实准确是勘察单位的；安全费用提取程序是企业内部管理；考核施工安全管理人员不归建设单位管。"},{"type":"单选","key":"第5题","stem":"应当严格执行操作规程,采取措施保证各类管线、设施和周边建筑物、构筑物的安全。对有可能引发通信工程安全隐患的灾害提出防治措施。这是（　）的安全生产责任。","options":["监理单位","施工单位","勘察设计单位","建设单位"],"answer":"C","why":"保证管线设施和周边建筑物安全、对可能引发隐患的灾害提出防治措施，属勘察设计单位责任，因其掌握地质环境等基础资料，最有条件在设计源头提出防治；施工、监理、建设单位无此设计职能。","expl":"考点：保证管线设施和周边建筑物安全、对可能引发隐患的灾害提出防治措施，这是谁的责任。答案：勘察设计单位。\n地下有什么管线、旁边有什么建筑，是勘察设计单位最清楚的，所以保护措施和灾害防治由它们提出。记法：谁勘探谁清楚，谁设计谁提醒。"},{"type":"单选","key":"第6题","stem":"设计单位必须在设计文件中（　）计列安全生产费。","options":["全额","部分","按建设单位要求","按工程建设需求"],"answer":"A","why":"设计单位必须在设计文件中全额计列安全生产费用，保证安全投入在源头足额列支；部分计列、按建设单位要求或按需求计列都会造成安全费“打折”，违反全额计列原则。","expl":"考点：设计单位必须在设计文件中怎样计列安全生产费。答案：全额。\n安全费必须全额列入概预算，不能打折、不能按建设单位要求打折。安全钱，一分不能少。"},{"type":"多选","key":"第7题","stem":"下列安全生产责任中,属于设计单位的是 （　）。","options":["建设工程安全生产费不得打折","工程概预算必须按照相关规定全额列出安全生产费用","工程合同中应明确支付方式、数额及时限","对有可能引发通信工程安全隐患的灾害提出防治措施","审查施工组织设计中的安全技术措施和安全专项施工方案"],"answer":"BD","why":"设计单位责任对应BD：概预算按规定全额列出安全生产费用、对可能引发隐患的灾害提出防治措施；A不得打折是对建设单位的要求，C明确支付时限属建设单位合同义务，E审查方案是监理职责。","expl":"多选。考点：属于设计单位的安全生产责任。正确的是两条。\n工程概预算必须按照相关规定全额列出安全生产费用；对有可能引发通信工程安全隐患的灾害提出防治措施。\n错的三条又碰到老熟人了：安全费不得打折、合同明确支付方式，是建设单位；审查施工组织设计，是监理单位。"},{"type":"多选","key":"第8题","stem":"企业的安全生产管理人员不包括 （　）","options":["企业主要负责人","企业项目负责人","专职安全生产管理人员","项目兼职安全巡视人员"],"answer":"ABC","why":"企业安全生产管理人员指专职从事安全管理的人员；主要负责人、项目负责人虽属“安管三类人”，但不属于“安全生产管理人员”这一岗位序列，兼职巡视员更不是，故不包括的是ABC。","expl":"考点比较绕，直接给你干货：企业安全生产的'三类人'，也叫安管人员，指的是：企业主要负责人、项目负责人、专职安全生产管理人员。\n题目问'不包括'，按题库答案，项目兼职安全巡视人员不算安管人员。记住三类的框架，这类题的选项不管怎么排，都在这个框里挑。"},{"type":"单选","key":"第9题","stem":"不属于企业安全生产“三类人”或企业“安管人员”的是 （　）","options":["企业主要负责人","项目负责人","安全生产管理人员","施工现场操作人员"],"answer":"D","why":"“安管三类人”＝企业主要负责人、项目负责人、专职安全生产管理人员，须考核持证；施工现场操作人员不属三类人，无考核取证要求，答题时抓住“三类人”口诀即可。","expl":"考点：谁不属于企业安全生产三类人。答案：施工现场操作人员。\n主要负责人、项目负责人、安全生产管理人员是管理层的三类人；一线操作工人干活再重要，也不属于安管人员。"},{"type":"多选","key":"第10题","stem":"企业必须通过由通信主管部门对其安全生产知识和管理能力考核的人员有（　）。","options":["单位主要负责人","单位工程管理部门主要负责人","项目负责人","专职安全生产管理人员","班组安全生产管理人员"],"answer":"ACD","why":"须经通信主管部门安全生产知识和管理能力考核的是三类人：单位主要负责人、项目负责人、专职安全生产管理人员；工程部门负责人、班组成员不在法定考核序列内。","expl":"多选。考点：哪些人必须通过通信主管部门的安全生产知识和管理能力考核。答案：单位主要负责人、项目负责人、专职安全生产管理人员，正好就是三类人。\n错的是工程管理部门负责人、班组安全员。通信行业只考核三类人，考核发证，这叫A类、B类、C类证，后面几题细讲。"},{"type":"单选","key":"第11题","stem":"根据《通信建设工程安全管理规定》,施工单位应对本单位所有管理人员和作业人员每年至少进行 （　） 次安全生产教育培训。","options":["一","二","三","四"],"answer":"A","why":"依据《通信建设工程安全管理规定》，施工单位对管理人员和作业人员每年至少进行一次安全生产教育培训并考核合格，“每年至少一次”是底线频次，不能按季度类推多记。","expl":"考点：施工单位对本单位所有管理人员和作业人员，每年至少进行几次安全生产教育培训。答案：一次。\n老规矩：安全教育，年检一次起步。跟第二章的数字对上了。"},{"type":"单选","key":"第12题","stem":"根据《通信建设工程安全管理规定》规定,工程分包单位对管理人员和作业人员每年应至少进行_（　）次安全生产教育培训。","options":["一","二","三","四"],"answer":"A","why":"分包单位的安全教育义务与总包相同：对管理人员和作业人员每年至少进行一次安全生产教育培训；分包不因隶属关系降低培训频次要求。","expl":"考点：分包单位的管理人员和作业人员每年至少培训几次。答案：也是一次。\n总包分包一个标准，谁的人谁培训，一年一遍不能少。"},{"type":"判断","key":"第13题","stem":"施工现场应由具有一定施工经验的人员对安全生产进行监督。（　）","options":[],"answer":"错","why":"施工现场安全生产监督必须由专职安全生产管理人员实施，专职安全员须经考核持证；“有一定施工经验的普通人员”不具备法定资格，无监督资质，故说法错误。","expl":"判断题。题目说：施工现场应由具有一定施工经验的人员对安全生产进行监督。\n错。安全监督是专职安全生产管理人员的活，不是随便找个有经验的人就能盯安全。专职两个字就是门槛。"},{"type":"单选","key":"第14题","stem":"工程施工前,组织施工安全技术交底的人员是（　）","options":["企业技术负责人","施工项目负责人","项目安全负责人","作业现场负责人"],"answer":"C","why":"工程施工前，项目安全负责人（专职安全员）负责组织施工安全技术交底，向作业班组详细说明安全要求并签字确认；企业技术负责人负责审批方案，现场负责人是接受交底方。","expl":"考点：通信工程施工前，组织施工安全技术交底的是谁。答案：项目安全负责人。\n注意：这道题依据的是通信行业的规定，答案是项目安全负责人；第二章那道依据建设工程安全生产管理条例，答案是项目技术负责人。两个法规两个答案，看题目引用哪部规定。"},{"type":"判断","key":"第15题","stem":"井下、高空、用电作业时,必须配备地下管线探测仪、防护绳、防触电等用具。（　）","options":[],"answer":"错","why":"安全用具须与作业风险匹配：井下配气体检测和通风用具，高空配防护绳、安全带，用电配绝缘防触电用具；把三类用具混为一谈笼统配备，无法对症防护，故说法错误。","expl":"判断题。题目说：井下、高空、用电作业时，必须配备地下管线探测仪、防护绳、防触电等用具。\n错在张冠李戴。井下作业要配的是气体检测仪和通风设备；地下管线探测仪是开挖前探地下管线用的，不是下井用具。用具要跟作业类型对得上。"},{"type":"多选","key":"第17题","stem":"下列关于施工单位安全生产责任的说法,正确的是 （　）","options":["建立健全安全生产教育培训制度","严格按照工程建设强制性标准和安全生产操作规范施工","保证施工项目的安全生产费全部用于本项目的安全生产","在有限空间安全作业,必须严格执行作业审批制度","建立健全生产安全事故隐患排查治理制度"],"answer":"ABDE","why":"ABDE均为施工单位法定义务：建立教育培训制度、按强制性标准规范施工、有限空间严格作业审批、建立隐患排查治理制度；C错在安全生产费须按规定范围使用，并非归本项目随意全额支配。","expl":"多选。考点：施工单位安全生产责任的说法，正确的是四条。\n建立健全安全生产教育培训制度；严格按照工程建设强制性标准和安全生产操作规范施工；有限空间作业严格执行审批制度；建立健全生产安全事故隐患排查治理制度。\n错的是保证安全生产费全部用于本项目这条，说法跟规定原文不一致。四大制度记法：培训、标准、审批、排查。"},{"type":"多选","key":"第18题","stem":"监理单位对通信工程项目的安全责任包括 （　）","options":["参加安全技术交底","组织安全生产检查","进行现场安全的巡视检查","审查工程安全专项施工方案","审查施工组织设计中安全技术措施"],"answer":"CDE","why":"监理单位安全责任是审查安全专项施工方案、审查施工组织设计中安全技术措施、现场巡视检查，对应CDE；参加交底、组织安全生产检查属施工方或建设方组织行为，不属监理法定责任。","expl":"多选。考点：监理单位对通信工程项目的安全责任。正确的是三条。\n进行现场安全的巡视检查；审查工程安全专项施工方案；审查施工组织设计中安全技术措施。\n错的是参加安全技术交底和组织安全生产检查——交底归施工单位，检查组织也是施工方的日常管理动作。监理三件事：巡视、审方案、审措施。"},{"type":"单选","key":"第19题","stem":"通信工程建设项目进行招标时,应明确不得作为竞争性报价的是（　）","options":["调造费","普工费","预备费","安全生产费"],"answer":"D","why":"安全生产费是保障施工安全的法定专项费用，属于不可竞争性费用，招标时必须足额计列、不得作为竞争性报价下浮；调遣费、普工费、预备费均可正常参与报价竞争。","expl":"考点：通信工程招标时，应明确不得作为竞争性报价的是什么。答案：安全生产费。\n安全费不参与竞价，报多报少都不许拿来让利。这就是第二章案例里说的不参与竞争原则。"},{"type":"单选","key":"第20题","stem":"以下 （　）不属于安全费的使用范围","options":["气体检测仪购买","用于应急救援的安全绳的购买","为作业人员购买意外伤害保险的费用","对施工人员的安全教育培训的开支"],"answer":"C","why":"安全生产费用于完善和改善安全防护、检测、应急等支出：气体检测仪、应急救援安全绳、安全培训开支均属之；意外伤害保险费按规定另行列支，不属安全费使用范围。","expl":"考点：哪项不属于安全生产费的使用范围。答案：为作业人员购买意外伤害保险的费用。\n气体检测仪、应急救援的安全绳、安全教育培训，都是安全费该花的；意外伤害保险是另外的渠道，不走安全费。"},{"type":"单选","key":"第21题","stem":"施工单位年度提取的安全生产费有结余时,正确的做法是 （　）","options":["发放员工奖金","作为公司下一年度市场开发费","转至下一年度做安全生产开支","作为公司的年度利润"],"answer":"C","why":"依据安全生产费用管理规定，年度结余的安全费应结转下一年度继续用于安全生产开支，专款专用；挪作奖金、市场开发费或利润都改变资金用途，属违规行为。","expl":"考点：年度提取的安全生产费有结余怎么办。答案：转至下一年度，继续用于安全生产。\n结余的钱只能接着干安全的事，发奖金、搞市场开发、算利润，统统不行。安全钱，永远姓安。"},{"type":"多选","key":"第22题","stem":"关于通信施工单位安全生产事故的报告要求,说法正确的是（　）","options":["事故现场有关人员应立即向本单位负责人报告","事故现场有关人员应立即向当地政府应急管理部门报告","单位负责人接到事故报告后 1 小时内向企业所在地应急管理部门报告","单位负责人接到事故报告后 2 小时内向事故所在地县级以上政府应急管理部门报告","单位负责人接到事故报告后 1 小时内向所在地省级通信管理局报告"],"answer":"AE","why":"A对：现场人员立即报本单位负责人；E对：负责人接报后1小时内报省级通信管理局。B错：现场人员先报本单位而非政府；C、D混淆时限——通信行业是1小时内报通信管理局和应急管理部门。","expl":"多选。考点：通信施工单位安全生产事故的报告要求。正确的是两条。\n事故现场有关人员应立即向本单位负责人报告；单位负责人接到报告后一小时内，向事故发生地应急管理部门和所在地省级通信管理局报告。\n错的三条：现场人员直接报政府部门，不对，先报单位；报企业所在地应急管理部门，不对，是事故发生地；两小时内报，不对，是一小时。通信行业多一条线：还要报省通信管理局。"},{"type":"单选","key":"第24题","stem":"通信建设工程中发生生产事故,（　）接到报告后,应当立即启动事故处理应急预案。","options":["专职安全员","项目负责人告","单位负责人","通信管理局"],"answer":"C","why":"单位负责人接到事故报告后，应当立即启动事故处理应急预案，组织抢救、防止事故扩大；专职安全员、项目负责人无权调动全单位应急资源，通信管理局属外部监管方。","expl":""},{"type":"单选","key":"第25题","stem":"某年某省 H 公司在肥东县进行肥东移动的基站迁移工程施工。在 H 公司吊车驾驶员进行基站信号塔迁移操作的过程中吊绳断裂,信号塔倒落后砸中两辆在此路口等候红灯的车辆,造成 2 人死亡,5 人受伤。H 公司的法定代表人接到现场人员报告后采取了下列行动,正确的是 （　）","options":["立即启动应急预案抢救受伤人员","在现场处理完毕后(约 1 个半小时) 向肥东县安全生产监督管理部门报告","在组织抢救时强调,除因抢救人员、疏通交通等特殊情况外,任何人不得破坏事故现场,应妥善保存现场重要痕迹、物证","对事故现场人员统一事故上报及对外口径,尽量减轻公司责任"],"answer":"A","why":"正确的是A：负责人接报后立即启动应急预案组织抢救。B错：事故须立即报告，不得等现场处理完毕（约1小时内核实报告）；C属现场人员配合义务；D统一口径减轻责任涉嫌瞒报谎报，违法。","expl":""},{"type":"单选","key":"第26题","stem":"对本行政区域内通信建设工程相关企业的安管人员的安全生产工作督管理的部门不包括 （　）","options":["工业和信息化部","通信管理局","应急管理部","公安机关"],"answer":"D","why":"对安管人员安全生产工作实施监督管理的部门包括工业和信息化部、各省通信管理局及应急管理部门；公安机关负责治安刑事案件，不属安全生产监督管理部门序列。","expl":""},{"type":"判断","key":"第27题","stem":"通信管理局负责本行政区域内通信建设工程安全生产的监督管理工作。（　）","options":[],"answer":"对","why":"依据《通信建设工程安全管理规定》，省、自治区、直辖市通信管理局负责本行政区域内通信建设工程安全生产的监督管理，属地监管职责明确，说法正确。","expl":""},{"type":"单选","key":"第28题","stem":"行政监督部门进行安全生产检查时,施工单位有权予以拒绝的行为是（　）","options":["要求被检查单位停工接受检查","要求检查单位提供有关安全生产的文件和资料","进入检查单位施工现场进行检查、拍照、录像","对检查中发现的安全生产违法行为,要求限期改正"],"answer":"A","why":"行政监督部门有权调阅文件资料、进入现场检查拍照录像、对违法行为责令限期改正，但无权要求企业停工接受检查，滥用检查干扰正常生产属越权，施工单位有权拒绝。","expl":""},{"type":"多选","key":"第29题","stem":"通信行政监督部门责令施工单位限期改正或予以通报的行为有（　）。","options":["不配合安全生产监督检查及安全生产事故调查处理的","发生生产安全事故,未及时上报或对事故调查处理不力的","制订的生产安全事故应急救援预案不满足要求的","两年未对从业人员进行一次安全生产教育和培训的","未保证安全生产所必需的资金投入,致使不具备安全生产条件的"],"answer":"ABD","why":"ABD属责令限期改正或通报情形：不配合监督检查和事故调查、事故未及时上报或调查处理不力、应急预案不满足要求且两年未培训从业人员；C预案不满足要求属责令修订；E资金投入不足的责令停产整顿并处罚款，非限期改正。","expl":""},{"type":"单选","key":"第30题","stem":"根据《通信建设工程企业主要负责人、项目负责人和专职安全生产管理人员安全生产考核管理暂行规定》,下列人员中不属于企业主要负责人的是（　）。","options":["企业法定代表人","企业高级注册安全工程师","分管生产经营的副总经理","企业技术负责人"],"answer":"B","why":"企业主要负责人包括法定代表人、分管生产经营的副总经理、技术负责人等实际掌权决策者；高级注册安全工程师是专业技术职称岗位，不属主要负责人序列。","expl":""},{"type":"多选","key":"第31题","stem":"根据《通信工程施工企业主要负责人项目负责人和专职安全生产管理人员安全生产考核管理规定》,应该申请参加通信工程","options":["类“安管人员考核的人员有 (ABCE)A 企业总经理","企业法定代表人","分管生产经营的副总经理","企业项目负责人","企业技术负责人"],"answer":"ABCE","why":"A类考核对象是企业主要负责人：总经理、法定代表人、分管生产经营的副总经理、企业技术负责人均属之；项目负责人报考B类，专职安全员报考C类，勿混淆三类证书。","expl":""},{"type":"判断","key":"第32题","stem":"项目负责人是指由企业法定代表人授权,负责具体通信建设工程项目管理的人员。（　）","options":[],"answer":"对","why":"依据安管人员考核管理规定，项目负责人是指由企业法定代表人授权，负责具体通信建设工程项目管理的人员，强调“法定代表人授权”这一核心要件，说法正确。","expl":""},{"type":"单选","key":"第33题","stem":"根据《通信建设工程企业主要负责人、项目负责人和专职安全生产管理人员安全生产考核管理暂行规定》,下列有关三类安管人员的表述中正确的是 （　）","options":["由企业领导分配负责通信建设工程项目安全管理任务的人员就是项目负责人","只有在项目施工现场专职从事安全生产管理工作的人员才是专职安全员","企业主要负责人不包括企业技术负责人","企业安全生产管理机构的人员也可通过考试成为专职安全生产管理人员"],"answer":"D","why":"企业安全生产管理机构的人员经考核合格也可担任专职安全生产管理人员，D正确；A项目负责人须法定代表人授权而非随意分配；B专职安全员不限于施工现场；C企业主要负责人包括技术负责人。","expl":""},{"type":"多选","key":"第34题","stem":"企业的专职安全生产管理人员包括（　）","options":["企业工程项目管理部门的负责人","企业安全生产管理机构的专职人员","企业所承包通信工程项目的负责人","工程项目专职从事安全生产管理工作的人员","工程项目施工班组巡查的人员"],"answer":"BD","why":"专职安全生产管理人员包括：企业安全生产管理机构的专职人员、工程项目专职从事安全管理工作的人员，对应BD；部门负责人、项目负责人、班组巡查兼职人员均不属专职安全员序列。","expl":""},{"type":"单选","key":"第35题","stem":"某通信施工企业的技术负责人于 2021 年 10 月 15 日申请安管人员证书考核,其基本条件不符合要求的是（　）","options":["年龄 59 岁,身体健康","大学本科学历","在 2020 年 7 月 10 日发生的一起较大安全生产事故中负有领导责任被罚款 30 万元","从事通信工程建设管理工作 2 年 10 个月"],"answer":"D","why":"技术负责人属企业主要负责人序列，申请的是A证。A证条件：大专及以上学历或中级以上职称、通信工程建设经历满3年、申请考核之日前1年内无一般及以上事故责任记录。D 从业仅2年10个月不足3年，不符合；A 59岁且本人为主要负责人不受年龄限制；B 本科学历达标；C 较大事故发生在申请前1年3个月，超出1年禁考窗口不构成障碍。答案D。","expl":""},{"type":"单选","key":"第36题","stem":"通信施工企业安全生产管理人员安全生产考核内容包括安全生产知识和（　）。","options":["安全生产技术水平","安全生产管理能力","安全生产操作能力","以上均不正确"],"answer":"B","why":"安全生产考核内容包括安全生产知识和安全生产管理能力两方面，即“知识＋能力”双维度；技术水平、操作能力不是安管人员考核内容，考核的是管理素质而非操作技能。","expl":""},{"type":"单选","key":"第37题","stem":"关于安全生产考核合格证书,下列表述中正确的是 （　）","options":["安全生产考核合格证书有效期为 3 年,在考核所在地省级范围内有效","安全生产考核合格证书有效期为 3 年,到期后需要重新考核取证","安全生产考核合格证书有效期为 3 年,到期后参加继续教育学习质量测试合格后自动延期","安全生产考核合格证书有效期为 3 年,不办理证书延续的,证书自动失效"],"answer":"D","why":"安全生产考核合格证书有效期3年，有效期满未办理延续手续的自动失效；到期不等于自动延期或重新考核，须按规定申请延续，“自动失效”是正确表述。","expl":""},{"type":"单选","key":"第38题","stem":"关于安全生产考核合格证书,下列表述中错误的是 （　）。","options":["安全生产考核合格证书有效期为 3 年,在全国范围内有效","安全生产考核合格证书有效期为 3 年,符合条件的可以申请延期","安全生产考核合格证书有效期为 3 年,到期后参加继续教育学习质量测试合格后自动延期","安全生产考核合格证书有效期为 3 年,不办理证书延续的,证书自动失效"],"answer":"C","why":"错误的是C：证书延续须按规定申请办理，参加继续教育后并不会“自动延期”；有效期3年全国有效、符合条件可申请延期、不办理延续自动失效均为正确表述。","expl":""},{"type":"单选","key":"第39题","stem":"关于安全生产考核合格证书延续,下列表述中正确的是 （　）","options":["信用档案中若有安全生产不良行为记录,安全生产考核合格证书则只能延期 2 年","符合延续条件的,经通信管理局批准后,安全生产考核合格证书有效期延续 3 年","连续两次延期后,符合条件的,经通信管理局批准后,安全生产考核合格证书长期有效","安全生产考核合格证书有效期届满需要延续的,安管人员应当在有效期届满后 3 个月内通过信息系统向核发证书的通信管理局申请证书延续"],"answer":"B","why":"证书有效期3年，符合延续条件的经通信管理局批准后延续3年；A无“只能延2年”的规定，C无长期有效的情形，D错在应在有效期届满前（而非届满后）申请延续。","expl":""},{"type":"单选","key":"第41题","stem":"通信主管部门在实施监督检查时,应当至少有 （　）以上监督检查人员参加。不得妨碍企业正常的生产经营活动,不得索取或者收受企业的财务,不得谋取其他利益。","options":["一名","两名","三名","四名"],"answer":"B","why":"通信主管部门实施监督检查应当有两名以上监督检查人员共同参加，确保程序合法、相互监督，并不得妨碍企业正常经营、不得索取收受财物；“两名以上”是程序底线。","expl":""},{"type":"单选","key":"第42题","stem":"通信主管部门在实施监督检查时,下列表述中错误的是 （　）","options":["通信主管部门有权对“安管人员”安全生产考核。教育培训和履行职责等情况进行监督检查","通信主管部门在实施监督检查时,应当有两个单位以上的监督检查人员参加","通信主管部门在实施监督检查时,不得妨碍企业正常的生产经营活D“安管人员”未按规定履行安全生产管理职责,导致发生生产安全事故时,通信主管部门有权暂扣或者撤销其安全生产考核合格证书"],"answer":"B","why":"错误的是B：法定要求是“两名以上监督检查人员”参加，不是“两个单位以上”；监督检查有权考核安管人员履职情况，发生事故的可暂扣或撤销其安全生产考核合格证书。","expl":""},{"type":"单选","key":"第43题","stem":"建筑施工企业安全生产管理机构专职安全生产管理人员应对履行的职责不包括 （　）。","options":["查阅在建项目安全生产有关资料、核实有关情况","检查危险性较大工程安全专项施工方案落实情况","监督作业人员安全防护用品的配备及使用情况","现场监督危险性较大工程安全专项施工方案实施情况"],"answer":"D","why":"现场“监督”危险性较大工程专项施工方案的实施由项目专职安全员负责，企业机构专职安全员的职责是查阅资料、检查方案落实、监督防护用品配备，不含现场实施监督。","expl":""},{"type":"单选","key":"第44题","stem":"下列关于企业专职安全生产管理人员的安全生产管理职责,说法错误的是（　）","options":["检查危险性较大工程安全专项施工方案落实情况","监督检查企业专职安全生产管理人员的履责情况","监督作业人员安全防护用品的配备及使用情况","查封不符合安全生产条件的设施、设备、器材"],"answer":"B","why":"监督检查下级专职安全员的履责情况属企业安全生产管理机构和负责人的职责，不是专职安全员本人的职责；检查专项方案落实、监督防护用品配备、查封不符合安全条件的设施均在其职责内。","expl":""},{"type":"单选","key":"第45题","stem":"建筑施工企业应当实行建设工程项目专职安全生产管理人员 （　）制度。建设工程项目的专职安全生产管理人员应当定期将项目安全生产管理情况报告企业安全生产管理机构。","options":["备案","申请","委派","承包"],"answer":"C","why":"建筑施工企业应当实行建设工程项目专职安全生产管理人员委派制度，由企业向项目委派专职安全员并定期向企业安全生产管理机构报告项目安全情况；委派保证监督独立性，防止受项目干预。","expl":""},{"type":"判断","key":"第46题","stem":"工程项目专职安全生产管理人员应由项目负责人现场指定。（　）","options":[],"answer":"错","why":"工程项目专职安全生产管理人员应由企业安全生产管理机构委派，而非项目负责人现场指定；若由被监督的项目负责人指定安全员，监督将失去独立性，故说法错误。","expl":""},{"type":"单选","key":"第47题","stem":"建筑施工企业应当在建设工程项目组建 （　）","options":["安全生产领导小组","安全生产委员会","安全生产党支部","安全生产监督小组"],"answer":"A","why":"依据规定，建筑施工企业应当在建设工程项目组建安全生产领导小组，由项目经理、技术负责人、专职安全员等组成，统筹项目安全生产管理，是法定组织形式。","expl":""},{"type":"单选","key":"第48题","stem":"总承包企业、专业承包企业和劳务分包企业的 （　） 不应参加通信建设工程项目安全生产领导小组。","options":["项目经理","技术负责人","专职安全生产管理人员","现场兼职安全巡视员"],"answer":"D","why":"安全生产领导小组由总承包企业、专业承包企业和劳务分包企业的项目经理、技术负责人、专职安全生产管理人员组成；现场兼职安全巡视员不具备法定任职身份，不参加小组。","expl":""},{"type":"单选","key":"第49题","stem":"不应参加通信建设工程项目安全生产领导小组的应该是 （　）的人员。","options":["总承包单位","专业承包单位","劳务分包单位","建设单位"],"answer":"D","why":"安全生产领导小组由施工方（总承包、专业承包、劳务分包单位）的相关人员组成；建设单位是工程投资方，不属施工安全管理的组成单位，不应参加该小组。","expl":""},{"type":"多选","key":"第50题","stem":"工程项目施工实行总承包的,其安全管理领导小组的成员包括总包单位、专业承包和分包单位的 （　）","options":["项目经理","技术负责人","施工员","质量员","安全员"],"answer":"ABE","why":"实行总承包的，安全管理领导小组由总包、专业承包和分包单位的项目经理、技术负责人、安全员组成，对应ABE；施工员、质量员属岗位管理人员，不是安全领导小组法定成员。","expl":""},{"type":"单选","key":"第51题","stem":"对施工现场安全生产负有日常检查并做好记录的职责是（　）","options":["项目负责人","项目技术负责人","项目专职安全生产管理人员","企业安全管理人员"],"answer":"C","why":"项目专职安全生产管理人员对施工现场安全生产负有日常检查并做好记录的职责，体现“专职＋日常”的特点；项目负责人负全面责任但不承担日常巡查记录职能。","expl":""},{"type":"单选","key":"第52题","stem":"如你是该项目的安全员,发现施工人员进行违规切割作业时,首先应（　）","options":["立即制止","报告项目经理","守在作业现场监督","派人清理周围现场中的可燃物"],"answer":"A","why":"发现违规切割作业，安全员第一动作是立即制止，防止事故发生；先报告、先旁观监督、先清理可燃物都会放任危险状态持续，违背安全员“立即制止违章”的核心职责。","expl":""},{"type":"单选","key":"第54题","stem":"对于合同价为 5000 万元的设备安装工程项目,应配备的项目专职安全生产管理人员不应少于（　）人。","options":["1","2","3","4"],"answer":"A","why":"依据《建筑施工企业安全生产管理机构设置及专职安全生产管理人员配备办法》：设备安装工程造价5000万元及以下的，项目专职安全生产管理人员不少于1人；5000万~1亿元不少于2人；1亿元及以上不少于3人且按专业配备。数字分档记「1-2-3」。","expl":""},{"type":"单选","key":"第55题","stem":"在施工企业实施的线路、管道、设备安装工程项目中,正确配备专职安全生产管理人员数量的是 （　）","options":["合同额为 4500 万元的工程应配置不少于 1 人","合同额为 6000 万元的工程应配置不少于 1 人","合同额为 1 亿元的工程应配置不少于 1 人","合同额为 1 亿元的工程应配置不少于 2 人"],"answer":"A","why":"线路、管道、设备安装工程按合同额分档：1亿元以下的不少于1人，因此4500万元工程配不少于1人正确；6000万元和1亿元均超过5000万元档，应配不少于2人。","expl":""},{"type":"单选","key":"第56题","stem":"对于合同价为 6000 万的线路工程项目,配备的专职安全生产管理人员不应少于（　）人。","options":["1","2","3","4"],"answer":"B","why":"线路工程合同价5000万至1亿元的，专职安全生产管理人员不少于2人，6000万元恰入该档；1人适用5000万元以下，3人、4人是1亿元以上更高档的要求。","expl":""},{"type":"单选","key":"第57题","stem":"某项目设备安装合同造价为 6000 万,则承担该工程的总承包单位应至少配备（　）名专职安全生产管理人员","options":["无需配备","一","二","四"],"answer":"C","why":"设备安装工程合同造价5000万元以上1亿元以下的，应配备不少于2名专职安全生产管理人员，6000万元适用此档；5000万以下才可配1人，故至少2名。","expl":""},{"type":"单选","key":"第58题","stem":"劳务分包单位现场作业的劳务分包单位人员为 30 人,则该单位应当配备（　）名专职安全生产管理人员。","options":["1","2","3","4"],"answer":"A","why":"劳务分包单位作业人员在50人以下的，至少配备1名专职安全生产管理人员；30人属50人以下档，配1名即合规，2名以上是更高人数档的要求。","expl":""},{"type":"单选","key":"第59题","stem":"下列属于取得建筑施工企业安全生产许可证规定条件的是 （　）","options":["制定完备的安全生产规章制度和操作规程","配备兼职安全生产管理人员","各分部分项工程有应急预案","管理人员每年至少进行 2 次安全生产教育培训"],"answer":"A","why":"取得安全生产许可证的条件之一是制定完备的安全生产规章制度和操作规程；须配备“专职”而非兼职安全管理人员，应急预案须覆盖单位整体而非仅分部分项，管理人员培训是每年至少一次而非两次。","expl":""},{"type":"多选","key":"第60题","stem":"根据《建筑施工企业安全生产许可证管理规定》,建筑施工企业取得安全生产许可证应当具备的条件包括 （　）","options":["制定完备的安全生产规章制度和操作规程","保证本单位安全生产条件所需资金的投入","管理人员和作业人员每年至少进行一次安全生产教育培训并考核合格","为施工现场所有作业的人员办理意外伤害保险","按照国家有关规定配备专职安全生产管理人员"],"answer":"ABCE","why":"取得安全生产许可证须具备：安全制度操作规程完备、安全资金投入保障、人员每年至少一次培训考核合格、按规定配备专职安全管理人员，对应ABCE；意外伤害保险按条例已调整为由施工单位自主办理，不再是许可前置条件。","expl":""},{"type":"单选","key":"第61题","stem":"根据《建筑施工企业安全生产许可证管理规定》,建筑施工企业安全生产许可证有效期为（　）","options":["2 年","3 年","4 年","6 年"],"answer":"B","why":"依据《建筑施工企业安全生产许可证管理规定》，安全生产许可证有效期为3年，期满需延续的应提前申请；“3年”与安管人员考核合格证书有效期一致，便于记忆。","expl":""},{"type":"单选","key":"第62题","stem":"建筑施工企业变更法定代表人的,应当在变更后（　）日内到安全生产许可证颁发管理机关办理安全生产许可证变更手续。","options":["10","5","15","20"],"answer":"A","why":"依据《建筑施工企业安全生产许可证管理规定》：企业变更名称、地址、法定代表人等的，应当在变更后10日内到原发证机关办理变更手续。记忆「变更10日内」。","expl":""},{"type":"多选","key":"第63题","stem":"安全生产许可证颁发管理机关或者其上级行政机关可以撤销已经颁发的安全生产许可证的情形有（　）","options":["规范标准","安全生产许可证颁发管理机关工作人员滥用职权颁发安全生产许可证颁发的","超越法定职权颁发安全生产许可证颁发的","违反法定程序颁发安全生产许可证颁发的","对不具备安全生产条件的建筑施工企业颁发安全生产许可证的"],"answer":"BCDE","why":"可以撤销安全生产许可证的情形针对发证环节违法：工作人员滥用职权、超越法定职权、违反法定程序颁发，以及对不具备安全条件的企业颁发；“规范标准”不是撤销情形，属干扰表述。","expl":""},{"type":"单选","key":"第64题","stem":"下列建筑施工企业安全生产许可证违法行为中,（　） 应当吊销安全生产许可证。","options":["取得安全生产许可证后,发生较大安全事故的","不再具备安全生产条件,情节严重的","未取得安全生产许可证擅自进行生产的","安全生产许可证有效期满未办理延期手续,继续从事建筑施工活动的"],"answer":"B","why":"取得许可证后不再具备安全生产条件且情节严重的，应当吊销安全生产许可证；A发生较大事故先暂扣；C未取证擅自生产按无证处理；D期满未延续继续施工的责令停业、限期补办并罚款。","expl":""},{"type":"多选","key":"第65题","stem":"某生产经营单位不具备有关法律、行政法规和国家标准、行业标准规定的安全生产条件,该单位错误的做法有 （　）","options":["可借助于其他具备安全生产条件的单位的资质进行生产,而后及时改进","在具备安全生产条件前不从事生产经营活动","认为有《安全生产许可证》,因此继续从事生产经营活动","在生产过程中积极整改","经主管部门批准后继续从事生产经营活动"],"answer":"ACDE","why":"不具备安全生产条件的单位不得从事生产经营活动，正确做法只有B；借用他人资质属挂靠违法，凭许可证“带病”生产、边生产边整改、经批准继续生产都违反安全生产条件前置原则。","expl":""},{"type":"判断","key":"第66题","stem":"根据应急预案管理办法,生产经营单位技术负责人负责组织编制和实施本单位的应急预案,并对应急预案的真实性和实用性负责;各分管技术负责人应当按照职责分工落实应急预案规定的职责。 （　）","options":[],"answer":"错","why":"依据《生产安全事故应急预案管理办法》，负责组织编制和实施本单位应急预案、对预案真实性和实用性负责的是主要负责人，而非技术负责人；题干主体错位，故说法错误。","expl":""},{"type":"单选","key":"第67题","stem":"生产经营单位（　）负责组织编制和实施本单位的应急预案,并对应急预案的真实性和实用性负责。","options":["主要负责人","技术负责人","项目负责人","专职安全生产管理人员"],"answer":"A","why":"生产经营单位主要负责人负责组织编制和实施本单位应急预案，并对预案的真实性和实用性负责，体现“一把手负总责”原则；技术负责人、项目负责人、专职安全员均非法定责任主体。","expl":""},{"type":"多选","key":"第68题","stem":"根据《生产安全事故应急预案管理办法》,生产经营单位的应急预案可分为（　）","options":["专项应急预案","临时处置方案","现场处置方案","综合应急预案","部门应急预案"],"answer":"ACD","why":"生产经营单位应急预案分为三类：综合应急预案、专项应急预案和现场处置方案，构成“综合—专项—现场”三级体系；临时处置方案、部门应急预案不属生产经营单位预案分类。","expl":""},{"type":"多选","key":"第69题","stem":"编制应急预案前,编制单位应当对该预案进行 （　）","options":["应急预案评审","事故风险辨识","事故风险评估","应急资源调查","应急预案演练"],"answer":"BCD","why":"编制应急预案前应进行事故风险辨识、事故风险评估和应急资源调查，对应BCD，摸清风险家底和应急家底；评审和演练是预案编制完成后的程序，顺序不能颠倒。","expl":""},{"type":"单选","key":"第70题","stem":"生产经营单位风险种类多,可能发生多种类型事故的,应当组织编制（　）","options":["专项应急预案","消防应急预案","现场处置方案","综合应急预案"],"answer":"D","why":"风险种类多、可能发生多种类型事故的，应当组织编制综合应急预案，作为应急工作的总纲；专项预案针对单一风险，现场处置方案针对具体岗位设施，层级不匹配。","expl":""},{"type":"单选","key":"第71题","stem":"施工企业风险种类多、可能发生多种类型事故的,生产经营单位应当编制（　）","options":["综合应急预案","专项应急预案","现场处置方案","应急处置卡"],"answer":"A","why":"依据《生产安全事故应急预案管理办法》，风险种类多、可能发生多种类型事故的，应当编制综合应急预案，统筹应急组织指挥与职责、预案体系等总体安排。","expl":""},{"type":"单选","key":"第72题","stem":"综合应急预案应当规定的内容不包括（　）","options":["应急指挥机构与职责","事故等级描述 D 事故风险描述","事故风险描述 C 应急预案体系"],"answer":"B","why":"综合应急预案内容包括应急指挥机构与职责、事故风险描述、应急预案体系等总体要素；对具体事故等级的详细描述属专项预案或现场处置方案内容，不在综合预案必列范围。","expl":""},{"type":"单选","key":"第73题","stem":"对于某一种类型的事故风险,生产经营单位可以编制相应的 （　）","options":["专项应急预案","人员伤亡应急预案","现场处置方案","综合应急预案"],"answer":"A","why":"针对某一种类型的事故风险（如坍塌、触电、中毒），应当编制专项应急预案，明确应对该类事故的具体指挥程序和处置措施；综合预案覆盖面广，现场处置方案则落到具体岗位。","expl":""},{"type":"单选","key":"第74题","stem":"对于危险性较大的场所、装置和设施,应当编制（　）","options":["综合应急预案","专项应急预案","现场处置方案","专项施工方案"],"answer":"C","why":"对危险性较大的场所、装置或设施，应当编制现场处置方案，将处置措施具体到岗位和装置层面，便于第一时间就近应急处置；综合、专项预案层级过高，专项施工方案属施工技术文件。","expl":""},{"type":"单选","key":"第75题","stem":"对于危险性较大的场所、装置和设施,生产经营单位应当编制 （　）","options":["专项应急预案","部门应急预案","现场处置方案","综合应急预案"],"answer":"C","why":"危险性较大的场所、装置和设施对应现场处置方案，突出“具体到点、即时可用”；部门应急预案是政府及其部门层面的分类，不适用生产经营单位。","expl":""},{"type":"单选","key":"第76题","stem":"事故风险单一、危险性小的施工单位,可以只编制（　）","options":["综合应急预案","专项应急预案","现场处置方案","专项施工方案"],"answer":"C","why":"事故风险单一、危险性小的生产经营单位，可以只编制现场处置方案，简化预案体系；仍必须编综合或专项预案的要求只针对风险复杂单位，体现分级分类管理。","expl":""},{"type":"单选","key":"第77题","stem":"应急预案应该由 （　）负责签发实施","options":["企业主要负责人","企业技术负责人","项目负责人","企业安全生产管理机构"],"answer":"A","why":"应急预案应由本单位主要负责人签发实施，体现主要负责人对应急工作负总责；技术负责人审核把关，项目负责人和安全机构无签发权限。","expl":""},{"type":"单选","key":"第78题","stem":"根据《生产安全事故应急预案管理办法》要求,建筑施工单位应当至少（　） 组织一次生产安全事故应急预案演练。","options":["每月","每季","每半年","每年"],"answer":"C","why":"依据《生产安全事故应急预案管理办法》，建筑施工单位属于高危单位，应当至少每半年组织一次生产安全事故应急预案演练，比一般单位每年一次的要求更严格。","expl":""},{"type":"单选","key":"第79题","stem":"通信工程中人井作业时容易引发安全事故,对此施工单位应当制订针对性现场应急救援预案配备应急救援用品,并且每隔 （　）组织作业人员进行演练","options":["一个月","二个月","三个月","半年"],"answer":"D","why":"人井（有限空间）作业风险高，施工单位应制订针对性现场应急救援预案、配备应急救援用品，并每隔半年组织作业人员进行演练；“半年一次”与高危单位演练频次一致。","expl":""},{"type":"单选","key":"第80题","stem":"某地建设行政主管部门检查某施工企业的施工工地,发现该施工企业没有按照施工现场管理规定设置围挡,依法责令停止施工。该建设行政主管部门对该施工企业采取的行政行为属于（　）","options":["行政处罚","行政裁决","行政处分","行政强制"],"answer":"A","why":"责令停止施工是行政机关对违反安全管理规定的行为给予的制裁，属行政处罚；行政处分针对内部公务人员，行政裁决处理民事纠纷，行政强制是强制执行手段，均不符。","expl":""},{"type":"单选","key":"第81题","stem":"生产经营单位及其有关人员在生产经营活动中违反有关安全生产法律法规被给予行政处罚时,生产当事人应当在收到行政处罚告知书之日起（　）日内进行陈述、申辩,或者依法提出听证要求,逾期视为放弃上述权力。","options":["5","7","10"],"answer":"A","why":"当事人应当在收到行政处罚告知书之日起5日内进行陈述、申辩或提出听证要求，逾期视为放弃权利；“5日”是行使陈述申辩听证权的法定时限。","expl":""},{"type":"单选","key":"第82题","stem":"关于行政处罚决定书的送达,下列说法正确的是 （　）","options":["送达必须有送达回执","决定书必须当场交付当事人","当事人拒收送达书的,送达失败","直接送达确有困难的,可以电话传达"],"answer":"A","why":"行政处罚决定书送达必须有送达回执，由当事人签收证明送达完成，回执是程序合法的证据；可当场交付也可其他法定方式送达，拒收不影响送达效力，电话传达不具法律效力。","expl":""},{"type":"单选","key":"第83题","stem":"某单位发生生产安全事故后,其主要负责人迅速赶到事故现场,组织救援并于 90 分钟后向所在地省级通信管理局报告,该负责人涉嫌的违法行为有（　）","options":["迟报行为","漏报行为","谎报行为","瞒报行为"],"answer":"A","why":"事故报告应在规定时限内（通信行业1小时内上报省级通信管理局），90分钟才报告已超过时限，构成迟报；漏报是遗漏内容，谎报是不如实报告，瞒报是不报告，均与超时报送不符。","expl":""},{"type":"单选","key":"第84题","stem":"因过失对应当上报的事故或者事故发生的时间、地点、类别、伤亡人数、直接经济损失等内容遗漏未报的,属于 （　）","options":["迟报行为","漏报行为","谎报行为","瞒报行为"],"answer":"B","why":"因过失遗漏应当上报的事故或时间、地点、类别、伤亡人数、直接经济损失等内容未报，属漏报；关键区分主观状态——“过失”遗漏是漏报，“故意”不如实报告才是谎报瞒报。","expl":""},{"type":"单选","key":"第85题","stem":"在报告事故时故意不如实报告事故发生的时间、地点、初步原因、性质、伤亡人数和涉险人数、直接经济损失等有关内容的,属于 （　）","options":["迟报行为","漏报行为","谎报行为","瞒报行为"],"answer":"C","why":"报告事故时故意不如实报告时间、地点、原因、伤亡人数等内容，属谎报；主观上“故意”且内容失真，与过失漏报、超时限迟报、完全不报的瞒报相区分。","expl":""},{"type":"单选","key":"第86题","stem":"对发生重大事故的单位及其有关责任人罚款的行政处罚,当事故发生地与事故发生单位不在同省级行政区域的,由 （　） 决定","options":["事故发生地省级人民政府安全生产监督管理部门","单位所在地省级人民政府安全生产监督管理部门","事故发生地县级人民政府安全生产监督管理部门","由国家应急管理部"],"answer":"A","why":"事故罚款处罚原则上由事故发生地安监部门决定；重大事故罚款由事故发生地省级人民政府安全生产监督管理部门决定，跨省的仍以事故发生地为主，体现属地管辖。","expl":""},{"type":"单选","key":"第87题","stem":"《安全生产事故罚款处罚规定(试行)》规定,事故发生单位主要负责人在事故调查处理期间擅离职守的,处上一年年收入（　）的罚款。","options":["0%至 80%","80%至 100%","80%至 90%","100%"],"answer":"B","why":"依据《安全生产事故罚款处罚规定（试行）》，主要负责人在事故调查处理期间擅离职守的，处上一年年收入80%至100%的罚款；“80%至100%”是擅离职守对应的罚款比例档。","expl":""},{"type":"单选","key":"第88题","stem":"某日上午 9 点某地安全生产监管部门在一网络直播平台发现正在直播-企业的生产安全事故抢救现场,经向值班室核实尚未接到该企业的报告遂派 3 名工作人员赶赴事故现场。到达现场时抢救工作已经结束,2 名伤员已送医院救治。监管部门工作人员经多方查证,事故属实,伤 2 人,暂无人员死亡,11:10 向值班室汇报,值班室反馈说仍未接到该企业任何报告根据上述情况,可以对该事故发生单位主要负责人处上一年收入的（　）罚款。","options":["0%","90%","100%","150%"],"answer":"C","why":"该单位发生事故后未按规定及时报告，构成迟报、瞒报情形之一——主要负责人未及时组织事故报告的，对迟报、瞒报的处上一年年收入100%的罚款，属罚款比例中的最高档。","expl":""}]};
const L = 'ABCDE';
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
document.getElementById('list').innerHTML = QUIZ.questions.map((q, i) => {
  let opts;
  if (q.type === '判断') {
    opts = ['对','错'].map(t => `<div class="opt ${t===q.answer?'right':''}">${t}</div>`).join('');
  } else {
    opts = q.options.map((o,k) => `<div class="opt ${q.answer.includes(L[k])?'right':''}"><b>${L[k]}</b>　${esc(o)}</div>`).join('');
  }
  const expl = (q.why ? esc(q.why) + '<br>' : '') + (q.expl ? '<b class="h">📖 详细讲解：</b><br>' + esc(q.expl) : (q.why || q.expl ? '' : '（讲解待补，先记答案）'));
  return `<div class="q">
    <div class="qno"><span class="badge">${q.type}</span>第 ${i+1} 题${q.key && q.key.startsWith('附') ? '（附录）' : ''}</div>
    <div class="stem">${esc(q.stem)}</div>
    ${opts}
    <div class="ansline">✔ 答案：${q.answer}</div>
    <div class="expl">${expl}</div>
  </div>`;
}).join('');
</script>
