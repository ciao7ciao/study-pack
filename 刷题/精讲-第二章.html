<script>
const QUIZ = {"title": "第二章", "questions": [{"type": "单选", "key": "第1题", "stem": "《建设工程安全生产管理条例》所称的建设工程,不包括（　）", "options": ["土木建筑工程", "线路管道工程", "设备安装工程", "园林绿化工程"], "answer": "D", "why": "", "expl": "第二章第一题。考点：建设工程安全生产管理条例里，建设工程指什么、不包括什么。答案：不包括园林绿化工程。\n条例管的是土木建筑、线路管道、设备安装这些工程。园林绿化不在内，口诀：种树的不归条例管。"}, {"type": "多选", "key": "第2题", "stem": "根据《建设工程安全生产管理条例》规定,建设工程,是指（　）", "options": ["土木工程", "软件开发工程", "线路管道工程", "设备安装工程", "装修工程"], "answer": "ACDE", "why": "", "expl": "第二章第二题，多选。建设工程是指哪些。正确的是四条：土木工程；线路管道工程；设备安装工程；装修工程。\n错的是软件开发工程，凑数的。跟上一题连着记：条例管建楼的、铺管的、装设备的、搞装修的。"}, {"type": "多选", "key": "第3题", "stem": "建设单位应当向施工单位提供施工现场及毗邻区域内的有关资料包括（　） 。", "options": ["地下管线资料", "气象水文资料", "相邻建筑物资料", "地下工程资料", "运输保障资料"], "answer": "ABCD", "why": "", "expl": "多选。考点：建设单位要向施工单位提供施工现场及毗邻区域的哪些资料。正确的是四条。\n地下管线资料；气象和水文资料；相邻建筑物资料；地下工程资料。\n错的是运输保障资料。记法：地上地下、天气水情、左邻右舍，都要交代清楚。挖断电缆的事故，根子常在这。"}, {"type": "单选", "key": "第4题", "stem": "建设单位在编制工程（　）时。应当确定建设工程安全作业环境及安全施工措施所需费用。", "options": ["概算", "预算", "结算", "决算"], "answer": "A", "why": "", "expl": "考点：安全作业环境及安全施工措施费用，在编制什么时确定。答案：概算。\n概算、预算、结算、决算四个词里选概算。钱在项目最开头就要定下来，越往后越不是做加法的时候。"}, {"type": "单选", "key": "第5题", "stem": "关于建设单位安全责任的说法,错误的是（　）。", "options": ["建设单位应当向施工单位提供地下管线资料,并对资料的真实性、正确性、完整性负责。", "建设单位应当依法履行合同,不得压缩合同约定的工期。", "建设单位应当进行安全施工技术交底。", "建设单位应当对拆除工程进行备案。"], "answer": "C", "why": "", "expl": "选建设单位安全责任的错误说法。答案：建设单位应当进行安全施工技术交底。\n为什么错？技术交底是施工单位的事：项目技术负责人向作业人员交底。建设单位的活是：提供真实完整的地下管线资料、不压缩合同工期、拆除工程备案。分工别乱。"}, {"type": "单选", "key": "第6题", "stem": "《建设工程安全生产管理条例》规定,设计单位应当考虑施工安全操作和防护的需要,对涉及施工安全的（　）在设计文件中注明,并对防范生产安全事故提出指导意见。", "options": ["重点部位和环节", "所有危险、有害因素", "关键与特殊过程", "项目安全设施的搭建"], "answer": "A", "why": "", "expl": "考点：设计单位要对涉及施工安全的什么在设计文件中注明。答案：重点部位和环节。\n不是所有危险有害因素，也不是关键特殊过程。设计院点的是重点部位，防范事故给指导意见。"}, {"type": "多选", "key": "第7题", "stem": "设计单位的安全责任包括 （　）", "options": ["按照法律、法规和工程建设强制性标准进行设计", "提出防范安全生产事故的指导意见和措施建议", "对安全技术措施或专项施工方案进行审查", "依法对施工安全事故隐患进行处理", "对设计成果"], "answer": "ABE", "why": "", "expl": "多选。考点：设计单位的安全责任。正确的是两条：按照法律法规和工程建设强制性标准进行设计；提出防范安全生产事故的指导意见和措施建议。\n错的三条都是别人的活：审查专项施工方案、处理事故隐患是监理和施工单位的，设计单位不下场施工。"}, {"type": "多选", "key": "第8题", "stem": "下列责任中,属于设计单位安全责任的有（　）。", "options": ["对涉及施工安全的重点部位和环节在设计文件中注明,并对防范生产安全事故提出指导意见", "发现存在安全事故隐患的,应当要求施工单位整改", "审查专项施工方案是否符合工程建设强制性标准", "对涉及施工安全的重点部位和环节在设计文件中注明,并对防范生产安全事故提出指导意见", "采用新结构新材料。新工艺的时,应当在设计中提出保障施工作业人员安全和预防生产安全事故的措施建议。"], "answer": "ADE", "why": "", "expl": "多选。还是设计单位的安全责任。正确的是三条。\n一，对涉及施工安全的重点部位和环节在设计文件中注明，并提防范事故的指导意见；二，采用新结构、新材料、新工艺时，提出保障施工人员安全和预防事故的措施建议。\n错的是：要求施工单位整改、审查专项施工方案，这些是监理单位的活。记法：设计管图纸，监理管现场。"}, {"type": "多选", "key": "第9题", "stem": "为防止因设计合理导致生产安全事故的发生,设计单位应做到以下几点（　）。", "options": ["注明涉及施工安全的重点部位和环节", "安全风险", "提出保障施工作业人员安全的措施建议", "提出预防生产安全事故的措施建议", "全额列出工程警示标志费用"], "answer": "ACD", "why": "", "expl": "多选。考点：为防止因设计不合理导致事故，设计单位应做到什么。正确的是三条。\n注明涉及施工安全的重点部位和环节；提出保障施工作业人员安全的措施建议；提出预防生产安全事故的措施建议。\n错的是全额列出警示标志费用，那是造价的事。口诀：标重点、保人员、防事故。"}, {"type": "单选", "key": "第10题", "stem": "(建设工程安全生产管理条例》规定,（　）应当审查施工组织设计中的安全技术措施或者专项施工方案是否符合工程建设强制标准。", "options": ["应急管理部门", "勘察单位", "设计单位", "监理单位"], "answer": "D", "why": "", "expl": "考点：谁应当审查施工组织设计中的安全技术措施或专项施工方案是否符合工程建设强制性标准。答案：监理单位。\n应急管理部门不审图纸，勘察设计不审方案。审方案是监理的看家活，下一题连着考。"}, {"type": "单选", "key": "第11题", "stem": "工程监理单位应当审查施工组织设计中的安全技术措施或者专项施工方案是否符合（　）,", "options": ["工程概算要求", "工程建设强制性标准", "工艺方案要求", "监理规划要求"], "answer": "B", "why": "", "expl": "考点：监理审查方案，符合什么标准。答案：工程建设强制性标准。\n不是概算要求、不是监理规划。强制性标准四个字，是安全的底线，连接两题：监理按强制标准审方案。"}, {"type": "单选", "key": "第12题", "stem": "监理单位在实施通信工程项目监理过程中,发现存在一般安全事故隐患,应当（　）。", "options": ["要求暂时停止施工", "要求进行现场整改", "及时向建设单位报告", "向有关主管部门报告"], "answer": "B", "why": "", "expl": "考点：监理发现一般安全事故隐患怎么办。答案：要求进行现场整改。\n一般隐患不用停工，现场改掉就行。停工、上报是隐患严重时的动作，下一题接着分级。"}, {"type": "单选", "key": "第13题", "stem": "工程监理单位在实施监理过程中,发现存在安全事故隐患,情况严重的,应当要求施工单位暂时停止施工,并及时报告建设单位,施工单位拒不整改或者不停止施工的,工程监理单位应当及时向（　）报告。", "options": ["设计单位", "总包单位", "当地公安部门", "有关主管部门"], "answer": "D", "why": "", "expl": "考点：监理发现隐患情况严重的怎么办。答案：要求施工单位暂停施工，并及时报告建设单位；施工单位拒不整改或不停止施工的，及时向有关主管部门报告。\n三步走：严重隐患，先叫停；同时报建设单位；对方不听，捅到主管部门。口诀：叫停、报告、越级捅。"}, {"type": "单选", "key": "第14题", "stem": "根据《建设工程安全生产管理条例》,出租单位在签订机械设备租赁合同时,应出具（　）", "options": ["购货发票", "检测合格证明", "产品使用说明书", "相应的图片"], "answer": "B", "why": "", "expl": "考点：出租机械设备，签租赁合同时应出具什么。答案：检测合格证明。\n不是购货发票、不是说明书。设备出租先证明它是检测合格的，安全账不看出身看出体检报告。"}, {"type": "单选", "key": "第15题", "stem": "施工单位从事建设工程的新建、扩建、改建和拆除等活动,应当具备国家规定的注册资本、专业技术人员、技术装备和安全生产等条件,依法取得相应等级的资质证书,并在其（　）许可的范围内承揽工程。", "options": ["营业执照", "技术能力", "资质等级", "注册资本"], "answer": "C", "why": "", "expl": "考点：施工单位承接新建、扩建、改建、拆除工程，要在什么许可范围内承揽。答案：资质等级。\n不是营业执照范围，是资质等级范围。有资质才能干对应等级的活，超等级承揽违规。"}, {"type": "单选", "key": "第16题", "stem": "《建设工程安全生产管理条例》规定,施工单位的项目负责人应当由（　）的人员担任。", "options": ["建设单位认可", "取得相应执业资格", "取得安全员 C 证", "注册安全工程师"], "answer": "B", "why": "", "expl": "考点：施工单位的项目负责人应当由什么人员担任。答案：取得相应执业资格的人员。\n就是建造师这类执业资格。建设单位认可、安全员证、注册安全工程师都不是项目负责人法定门槛。"}, {"type": "单选", "key": "第17题", "stem": "某通信施工公司承接了总包单位分包的施工任务发生了事故,该起事故的“事故发生单位”应当是（　）。", "options": ["电信运营商", "监理公司", "总包单位", "某通信施工公司"], "answer": "C", "why": "", "expl": "情景题。通信施工公司从总包那里分包了任务，出了事故，事故发生单位填谁。答案：总包单位。\n记法：对外口径，总包背名。虽然实际干活的是分包，但事故发生单位写总包，责任上总包分包连带，下一题细讲。"}, {"type": "单选", "key": "第18题", "stem": "关于工程项目的总包与分包,说法错误的是(", "options": [")A 总承包单位可以将全部工程量分包给分包单位,双方应签订分包合同", "分包合同中应当明确各自的安全生产方面的权力、义务", "总包单位和分包单位对分包工程的安全生产承担连带责任", "分包单位不服从总包单位管理而导致生产安全事故的,分包单位承担主要责任"], "answer": "A", "why": "", "expl": "选总包分包说法错误的。答案：总承包单位可以将全部工程量分包给分包单位。\n错得离谱，这叫转包，法律禁止。正确关系是：分包合同明确各自安全权责；总包分包对分包工程安全负连带责任；分包不服从管理出事，分包担主责。"}, {"type": "单选", "key": "第19题", "stem": "基坑支护工程专项施工方案须经（　）签字后实施", "options": ["施工单位项目技术负责人和现场监理工程师", "施工单位负责人和建设单位负责人", "建设单位负责人和总监理工程师", "施工单位技术负责人和总监理工程师"], "answer": "D", "why": "", "expl": "考点：基坑支护等危险性工程，专项施工方案经谁签字后实施。答案：施工单位技术负责人，加总监理工程师。\n两边签字：施工方技术负责人、监理方总监。现场监理、建设单位负责人都不够格。记法：方案双人签，技术加总监。"}, {"type": "多选", "key": "第20题", "stem": "专项施王方案应由（　）签字后实施,由专职安全生产管理人员进行现场监督。", "options": ["施工单位项目现场作业队长", "施工单位技术负责人", "施工单位专职安全管理人员", "总监理工程师", "建设单位项目负责人"], "answer": "BD", "why": "", "expl": "多选。专项施工方案应由谁签字后实施，并由谁现场监督。答案：施工单位技术负责人，加总监理工程师；现场监督由专职安全生产管理人员负责。\n跟上一题同源：签字是技术负责人加总监，盯现场的是专职安全员。三个角色别搞混。"}, {"type": "单选", "key": "第21题", "stem": "下列分部分项工程中,不需要编制专项施工方案的是（　）。", "options": ["起重吊装工程", "模板工程", "砌筑工程", "拆除、爆破工程"], "answer": "C", "why": "", "expl": "考点：哪些分部分项工程需要专项施工方案。不需要的是哪个。答案：砌筑工程。\n起重吊装、模板、拆除爆破这些危险活都要专项方案；砌墙风险低，不用。口诀：吊装模板拆爆要方案，砌墙不用。"}, {"type": "单选", "key": "第22题", "stem": "建设工程施工前,（　）应当对有关安全施工的技术要求向施工作业班组、作业人员作出详细说明。", "options": ["施工单位项目负责人", "项目技术负责人", "施工单位专职安全管理人员", "建设单位项目负责人"], "answer": "B", "why": "", "expl": "考点：施工前，谁应当对安全施工技术要求向作业班组、作业人员作出详细说明。答案：项目技术负责人。\n这就是安全技术交底，交底人是项目技术负责人，不是项目经理也不是安全员。记法：技术活，技术负责人讲。"}, {"type": "单选", "key": "第23题", "stem": "由于建设单位采购的主设备未到货,施工现场暂时停止施工的,施工单位应当做好现场防护,所费用由（　）承担,或者按照合同约定执行。", "options": ["设计单位", "施工单位", "停工令下达单位", "建设单位"], "answer": "D", "why": "", "expl": "情景题。建设单位采购的主设备没到货，现场停工，防护费用谁承担。答案：建设单位，或者按合同约定。\n谁的原因停工，谁掏钱。设备是建设单位买的没到，停工防护费自然归建设单位出。"}, {"type": "单选", "key": "第24题", "stem": "施工现场临时搭建的建筑物应当符合安全使用要求,施工现场使用的装配式活动房屋应当具有（　）", "options": ["生产许可证", "出厂证明", "检测报告", "产品合格证"], "answer": "D", "why": "", "expl": "考点：施工现场使用的装配式活动房屋应当具有什么。答案：产品合格证。\n工地住的活动板房，要有产品合格证。临时用房也有安全底线。"}, {"type": "单选", "key": "第25题", "stem": "《建设工程安全生产管理条例》规定,施工单位因建设工程施工可能造成损害的毗邻建筑物、构筑物和地下管线等,应当采取(", "options": [")A 采取专项保护措施", "公告方式告知产权单位", "选用专业熟练工", "采取通用防护措施"], "answer": "A", "why": "", "expl": "考点：施工可能损害到的毗邻建筑物、构筑物和地下管线，应当采取什么措施。答案：专项保护措施。\n不是通用防护，是专项保护。邻着别人的楼、地下的管子施工，得量身定制保护方案。"}, {"type": "判断", "key": "第26题", "stem": "在城市市区内的建设工程,施工单位应当对施工现场实行封闭围挡。（　）", "options": [], "answer": "对", "why": "", "expl": "判断题。知识点：在城市市区内的建设工程，施工单位应当对施工现场实行封闭围挡。对照题目，说法正确。\n市区工地必须围起来，防止外人闯入。口诀：市区工地，围挡伺候。"}, {"type": "多选", "key": "第27题", "stem": "《建设工程安全生产管理条例》规定,施工单位应当在施工现场建立消防安全责任制度,可采取的措施有（　）。", "options": ["确定消防安全责任人", "制定用火用电、使用易燃易爆材料等各项消防安全管理制度和操作规程", "设置消防通道、消防水源", "配备消防设施和灭火器材", "在施工现场设置明显标志"], "answer": "ABCD", "why": "", "expl": "多选。考点：施工现场消防安全责任制度，可采取的措施。正确的是四条。\n确定消防安全责任人；制定用火用电、易燃易爆材料的管理制度和操作规程；设置消防通道、消防水源；配备消防设施和灭火器材。\n错的是在施工现场设置明显标志，太泛了，不在条例列举里。四件套记法：定责任人、定制度、通道路、配器材。"}, {"type": "单选", "key": "第28题", "stem": "《建设工程安全生产管理条例》规定,施工单位应当向作业人员提供（　）,并书面告知危险岗位的操作规程和违章操作的危害。", "options": ["劳动保障用品", "安全防护用具和安全防护服装", "安全逃生用品", "个人施工工具"], "answer": "B", "why": "", "expl": "考点：施工单位应当向作业人员提供什么，并书面告知危险岗位操作规程和违章操作危害。答案：安全防护用具和安全防护服装。\n发的是防护用具加防护服，不是劳保杂货也不是施工工具。注意后半句的关键词是书面告知，下一题考这个。"}, {"type": "判断", "key": "第29题", "stem": "施工单位应当向作业人员提供安全防护用具和安全防护服装,并口告知危险岗位的操作规程和违章操作的危害。 （　）", "options": [], "answer": "错", "why": "", "expl": "判断题。题目说：施工单位应当提供防护用具和防护服装，并口头告知危险岗位操作规程和违章操作的危害。\n陷阱在口头两个字。法律要求书面告知。口头说了不算，出了事没法举证。所以这题错。前一道书面、这一道口头，一对照就清楚了。"}, {"type": "多选", "key": "第30题", "stem": "为确保施工现场安全,施工作业人员在施工中应做到 （　）", "options": ["遵守安全施工的强制性标准", "遵守规章制度和操作规程", "听从现场管理人员的一切指挥", "正确使用安全防护用具", "有危及人身安全的情况时立即停止作业"], "answer": "ABD", "why": "", "expl": "多选。考点：施工作业人员在施工中应做到什么。正确的是三条。\n遵守安全施工的强制性标准；遵守规章制度和操作规程；正确使用安全防护用具。\n错的是听从现场管理人员的一切指挥，一切两个字太绝对，违章指挥不用听；有危及人身安全情况立即停止作业也不在本题列举。记住老规矩：凡说一切、必须，多半是坑。"}, {"type": "判断", "key": "第31题", "stem": "施工单位采购、租赁的安全防护用具、机械设备、施工机具及配件应当具有生产《制造) 许可证、产品合格证,并在进入施工现场后进行查验。 （　）", "options": [], "answer": "错", "why": "", "expl": "判断题。知识点：施工单位采购租赁的安全防护用具、机械设备、施工机具及配件，应当具有生产许可证、产品合格证，并在进入施工现场前进行查验。\n对照题目：题目说的是进入施工现场后进行查验。错了，一字之差：是进场之前查验，不合格的根本不让进门。"}, {"type": "单选", "key": "第32题", "stem": "《建设工程安全生产管理条例》规定,施工现场的安全防护用具、机械设备、施工机具及配件必须（　）,定期进行检查、维修和保养建立相应的资料档案,并按照国家有关规定及时报废。", "options": ["存放在封闭式库房", "由专人管理", "多人重点管理", "集中统一管理"], "answer": "B", "why": "", "expl": "考点：现场的安全防护用具、机械设备、施工机具及配件必须怎样管理，定期检查维修保养，建立资料档案，及时报废。答案：由专人管理。\n不是多人重点管理，也不是统一锁库房。专人管、定期养、有档案、到期换，四步。"}, {"type": "多选", "key": "第33题", "stem": "施工单位在使用承租的机械设备和施工机具及配件的,由同（　）共同进行验收。", "options": ["建设单位", "施工总承包单位", "分包单位", "出租单位", "安装单位"], "answer": "BCDE", "why": "", "expl": "多选。考点：使用承租的机械设备和施工机具及配件，由谁共同进行验收。正确的是四条。\n施工总承包单位；分包单位；出租单位；安装单位。\n错的是建设单位。验收是使用方和供给方的事，业主不参与。记法：租的设备四方验，总包分包出租加安装。"}, {"type": "单选", "key": "第34题", "stem": "施工单位应当对管理人员和作业人员每年至少（　）进行安全教育培训。", "options": ["一次", "二次", "三次", "四次"], "answer": "A", "why": "", "expl": "第二章第三十四题。考点：施工单位对管理人员和作业人员，每年至少进行几次安全教育培训。答案：一次。口诀：安全教育，年检一次起步。"}, {"type": "多选", "key": "第35题", "stem": "关于建设工程安全生产教育培训的说法,正确的有 （　）", "options": ["施工单位的主要负责人、项目负责人、专职安全生产管理当经建设行政主管部门或者其他部门考核合格后方可任职", "施工单位应当对管理人员和作业人员每两年至少进行一次安产教育培训", "作业人员进入新的岗位前,应当接受安全生产教育培训", "作业人员进入新的施工现场前,不需要接受生产教育培训", "施工单位在采用新技术、新工艺、新设备、对从业人员进行相应的安全生产教育培训"], "answer": "ACE", "why": "", "expl": "多选。考点：安全教育培训的正确说法。正确的是三条。\n施工单位主要负责人、项目负责人、专职安全生产管理人员，应当经建设行政主管部门或其他部门考核合格后方可任职；作业人员进入新的岗位前，应当接受安全生产教育培训；采用新技术、新工艺、新设备的，要对从业人员进行相应培训。\n错的两条：每两年至少一次，错，是每年至少一次；进入新施工现场前不需要培训，也错，新工地同样要先培训。记法：三类人考核上岗，换岗新岗新工都要训。"}, {"type": "单选", "key": "第36题", "stem": "关于意外伤害保险的说法,正确的是 （　）", "options": ["意外伤害保险应给全体施工人员购买", "由建设单位支付保险费", "实行施工总承包的,由施工总承包单位支付保险费", "保险期限自开工后 7 日起至竣工验收合格之日止"], "answer": "C", "why": "", "expl": "考点：意外伤害保险。正确的是：实行施工总承包的，由施工总承包单位支付保险费。\n错的三项：不是给全体施工人员买，是从事危险作业的人员；不是建设单位付钱，是施工单位；保险期限是自开工之日起至竣工验收合格之日止，没有开工后七日才生效的说法。"}, {"type": "判断", "key": "第37题", "stem": "建设行政主管部门或者其他有关部门可以将施工现场的监督检查委托给建设工程安全监督机构具体实施。（　）", "options": [], "answer": "对", "why": "", "expl": "判断题。知识点：建设行政主管部门或者其他有关部门，可以将施工现场的监督检查委托给建设工程安全监督机构具体实施。对照题目，说法正确。\n主管部门可以委托安全监督机构干活，这是允许的。判断为对。"}, {"type": "单选", "key": "第38题", "stem": "国家对严重危及施工安全的工艺、设备、材料实行 （　） 制度", "options": ["维修", "监管", "备案", "淘汰"], "answer": "D", "why": "", "expl": "考点：国家对严重危及施工安全的工艺、设备、材料实行什么制度。答案：淘汰制度。\n不是维修、监管、备案。危及安全的工艺设备材料，国家直接淘汰出局，下一题考谁公布目录。"}, {"type": "单选", "key": "第39题", "stem": "根据《建设工程安全生产管理条例》,国家对严重危及施工安全的) 制定并公布。工艺、设备、材料实行淘汰制度,目录由 （　）", "options": ["国务院安全生产委员会", "国务院建设行政主管部门会同国务院其他有关部门", "省级以上人民政府建设行政单位", "国务院发展与改革委员会同国务院其他有关部门"], "answer": "B", "why": "", "expl": "考点：淘汰目录由谁制定并公布。答案：国务院建设行政主管部门，会同国务院其他有关部门。\n牵头的是建设行政主管部门，不是安委会、不是发改委。记法：管建设的牵头定淘汰名单。"}, {"type": "单选", "key": "第40题", "stem": "关于对施工单位生产安全事故应急救援准备的要求,错误的是（　）", "options": ["施工单位必须建立本单位的应急救援组织", "施工单位应当制定本单位的生产安全事故应急救援预案", "施工单位应配备必要的应急救援器材、设备", "施工单位应定期组织应急救援演练"], "answer": "A", "why": "", "expl": "选对施工单位应急救援准备的错误要求。答案：施工单位必须建立本单位的应急救援组织。\n为什么错？回想第一章的知识点：规模较小的施工单位可以不建立应急救援组织，但应当指定兼职的应急救援人员。必须二字太绝对。预案、器材、定期演练，这三样才是必须的。"}, {"type": "单选", "key": "第41题", "stem": "实施总承包的工程,涉及分包工程的施工现场应急救援预案应由（　）编制。", "options": ["建设单位", "监理单位", "总包单位", "分包单位"], "answer": "C", "why": "", "expl": "考点：实行总承包的工程，涉及分包工程的施工现场应急救援预案由谁编制。答案：总包单位。\n预案也归总包统一编制，分包不出预案出人配合。记法：总包一盘棋，预案也是。"}, {"type": "单选", "key": "第42题", "stem": "施工单位在作业过程中特种设备发生事故的,应及时、如实地向负责安全生产监督管理的部门、建设行政主管部门或者其他有关部门报告,同时还应当向（　）报告。", "options": ["劳动保障部门", "特种作业人员监督管理部门", "特种设备安全监督管理部门", "特种设备行业主管部门"], "answer": "C", "why": "", "expl": "考点：作业中特种设备发生事故，除了报安监、建设行政部门，还应当向谁报告。答案：特种设备安全监督管理部门。\n特种设备出事，多报一家：管特种设备的部门。三头报告：安监、建设行政、特种设备监管。"}, {"type": "单选", "key": "第43题", "stem": "某施工单位的微控定向钻孔设备发生生产安全事故,该施工单位应向(", "options": [")报告。A 安全生产监督管理部门、建设行政管理部门", "特种设备安全监督管理部门", "设备经销商、设备生产厂家", "工程项目的建设单位、监理单位、设计单位"], "answer": "A", "why": "", "expl": "情景题。微控定向钻孔设备发生事故，向谁报告。答案：安全生产监督管理部门、建设行政管理部门。\n注意区别：钻孔设备不是特种设备，所以不用报特种设备监管部门。是不是特种设备，决定了要不要多报一家。"}, {"type": "多选", "key": "第44题", "stem": "某施工单位的微控定向钻孔设备发生生产安全事故,该施工单位应向（　）报告。", "options": ["安全生产监督管理部门", "建设行政管理部门", "特种设备安全监督管理部门", "设备经销商", "设备生产厂家"], "answer": "AB", "why": "", "expl": "多选。同一情景换多选：应向谁报告。答案：安全生产监督管理部门，加建设行政管理部门。\n跟上一题同一个知识点：普通设备事故报这两家，不含特种设备监管部门。连做三题，这个考点稳了。"}, {"type": "单选", "key": "第45题", "stem": "实行施工总承包的建设工程,分包单位发生了安全事故,由（　）负责上报。", "options": ["建设单位", "总包单位", "监理单位", "分包单位"], "answer": "D", "why": "", "expl": "考点：总承包工程里，分包单位发生安全事故，由谁负责上报。答案：分包单位。\n有点意外吧？事故报告是分包单位自己报，不必等总包替它报。记法：谁出事谁上报，总包负连带责任是另一回事。"}, {"type": "单选", "key": "第46题", "stem": "注册执业人员未执行法律、法规和工程建设强制性标准的.情节一般的处罚是(", "options": [")A 责令停止执业 3 个月以上 1 年以下", "吊销执业资格证书且 5 年内不予注册", "终身不予注册", "追究刑事责任"], "answer": "A", "why": "", "expl": "考点：注册执业人员未执行法律法规和强制性标准，情节一般的处罚。答案：责令停止执业三个月以上一年以下。\n处罚阶梯：情节一般，停业三个月到一年；情节严重的，吊销证书五年内不予注册；造成重大事故的才终身不予注册。记法：停三个月到一年，吊证五年，重大终身。"}, {"type": "单选", "key": "第47题", "stem": "违反《建设工程安全生产管理条例》,施工单位未按照国家有关规定在施工现场设置消防水源的,资令限期改正:逾期未改正的（　）依照《安全生产法》的有关规定处以罚款", "options": ["暂扣资质证书", "吊销营业执照", "责令停业整顿", "追究行政责"], "answer": "C", "why": "", "expl": "考点：施工现场未按规定设置消防水源，责令限期改正，逾期未改的怎么处理。答案：责令停业整顿，再依照安全生产法罚款。\n先给机会改正，不改就停业整顿加罚款。处罚也是讲先礼后兵的。"}, {"type": "单选", "key": "第48题", "stem": "根据《建设工程安全生产管理条例》,在城市市区内的施工现场未实行封闭围挡的,施工单位可能承担的法律责任是（　）", "options": ["处以 20 万元罚款", "责令施工企业限期改正", "吊销施工企业营业执照", "降低施工企业资质等级"], "answer": "B", "why": "", "expl": "考点：市区施工现场未实行封闭围挡，施工单位可能承担什么法律责任。答案：责令施工企业限期改正。\n围挡没围起来，第一步是限期改正，不直接罚款、不吊照。又是先礼后兵的套路。"}, {"type": "单选", "key": "第49题", "stem": "违反《建设工程安全生产管理条例》规定,施工单位的安全防护用具、机械设备、施工机具及配件在进入施工现场前未经查验或者查验不合格即投入使用的、情节严重的,降低资质等级,直至（　）", "options": ["吊销营业执照", "吊销资质证书", "吊销安全生产许可证", "对主要负责人撤职"], "answer": "B", "why": "", "expl": "考点：防护用具机械设备未经查验或不合格就投入使用，情节严重的，降低资质等级直至什么。答案：吊销资质证书。\n不是吊销营业执照。施工领域的顶格行政罚是吊资质，不是吊执照。"}, {"type": "单选", "key": "第50题", "stem": "违反《建设工程安全生产管理条例》规定,施工单位在施工组织设计中未编制安全技术措施、施工现场临时用电方案或者专项施工方案的造成损失的,依法承担（　）责任。", "options": ["行政", "刑事", "索赔", "赔偿"], "answer": "D", "why": "", "expl": "考点：施工组织设计未编制安全技术措施、临时用电方案或专项施工方案，造成损失的，依法承担什么责任。答案：赔偿责任。\n造成损失，先赔钱。行政、刑事是另案处理的事，本题问的是民事上的赔偿。"}, {"type": "多选", "key": "第51题", "stem": "施工单位的下列行为,符合工程安全不良行为认定标准的有（　）", "options": ["在施工起重机械和整体提升脚手架,模板等自升式架设设施验收合格后未按照规定登记的", "在尚未竣工的建筑物内设置员工集体宿舍的", "未对因建设工程施工可能造成损害的毗邻建筑物、构筑物和地下管线等采取专项预防措施", "使用未经验收或验收不合格的施工起重机械和整体提升脚手架、模板等自升式架设设施的", "去按照节能要求进行施工的"], "answer": "ABCD", "why": "", "expl": "多选。考点：符合工程安全不良行为认定标准的有哪些。正确的是四条。\n起重机械、整体提升脚手架、模板等自升式架设设施验收合格后未按规定登记的；在尚未竣工的建筑物内设置员工集体宿舍的；未对毗邻建筑物地下管线采取专项预防措施的；使用未经验收或验收不合格的上述设施的。\n错的是未按节能要求施工，那是节能问题不是安全不良行为。特别记一条：未竣工的楼里不能设员工集体宿舍，火灾大忌。"}, {"type": "单选", "key": "第52题", "stem": "下列情形中,生产安全事故应急救援预案制定单位应当及时修订相关预案的是（　）", "options": ["安全生产面临的风险发生了任何变化", "应急指挥机构的职责发生了调整", "部分应急资源发生了任何变化", "在预案演练时发现有些人不认真"], "answer": "B", "why": "", "expl": "考点：什么情况应当及时修订应急预案。答案：应急指挥机构的职责发生了调整。\n错的三项都有任何、有些人这种模糊词：风险发生任何变化、资源发生任何变化、演练时有人不认真，都不是法定修订情形。组织架构变了，预案必须跟着改。"}, {"type": "单选", "key": "第54题", "stem": "发生生产安全事故后,下列应急救援措施中,错误的是(", "options": [").A 迅速远离危险源", "及时通知可能受事故影响的单位", "组织抢救遇险人员", "维护事故现场秩序"], "answer": "A", "why": "", "expl": "选事故后应急救援措施错误的。答案：迅速远离危险源。\n为什么错？事故发生后单位的义务是主动处置：组织抢救遇险人员、通知可能受影响的单位、维护现场秩序。自己先跑不算应急救援。"}, {"type": "单选", "key": "第55题", "stem": "按照《生产安全事故报告和调查处理条例》,重大事故,是指造成 10 人以上 30 人以下死亡,或者 50人以上 100 人以下重伤,或者（　）下以上 1 亿元以直接经济损失的事故。", "options": ["1000 万元", "3000 万元", "5000 万元", "7000 万元"], "answer": "C", "why": "", "expl": "考点：事故分级。重大事故是指：十人以上三十人以下死亡，或者五十人以上一百人以下重伤，或者多少以上一亿元以下直接经济损失。答案：五千万元。\n把重大事故的第三条线记住：五千万到一亿。四条线一起记：一般，三人以下死亡、一千万元以下；较大，三到十人、一千万到五千万；重大，十到三十人、五千万到一亿；特别重大，三十人以上、一亿元以上。"}, {"type": "单选", "key": "第56题", "stem": "施工现场发生一起生产安全事故,造成 10 人死亡,20 人重伤,直接经济损失 1000 万元。根据生产安全事故报告和调查处理条列,该起事故的等级为（　） 。", "options": ["一般事故", "较大事故", "重大事故", "特别重大事故"], "answer": "C", "why": "", "expl": "情景题。十人死亡、二十人重伤、直接损失一千万，事故等级是。答案：重大事故。\n十人死亡正好踩在重大事故的线上：十人以上三十人以下死亡就是重大。重伤和经济损失不用再看，死亡人数一锤定音。"}, {"type": "单选", "key": "第57题", "stem": "根据《生产安全事故报告和调查处理条例》,死亡 3 人事故属于（　）", "options": ["一般事故", "较大事故", "重大事故", "特别重大事故"], "answer": "B", "why": "", "expl": "死亡三人的事故属于哪一级。答案：较大事故。三人以上十人以下死亡是较大事故。三人踩线进较大，十人踩线进重大。"}, {"type": "单选", "key": "第58题", "stem": "根据《生产安全事故报告和调查处理条例》(中华人民共和国国务院令第 493 号),死 1 人的事故属于(", "options": [")A 一般事故", "较大事故", "重大事故", "特别重大事故"], "answer": "A", "why": "", "expl": "死亡一人的事故属于。答案：一般事故。一人是事故的起点，三人跳较大，十人跳重大，三十人封顶特别重大。分级口诀：一、三、十、三十。"}, {"type": "单选", "key": "第60题", "stem": "事故发生后,施工企业应当最迟 （　）上报事故", "options": ["0 分钟", "1 小时内", "2 小时内", "1 天内"], "answer": "B", "why": "", "expl": "考点：事故发生后，施工企业最迟多久上报。答案：一小时内。\n单位负责人接报后一小时内必须上报政府部门。记法：事故上报，一小时生死线。"}, {"type": "单选", "key": "第61题", "stem": "关于事故报告和调查处理,下列说法中正确的是 （　）", "options": ["事故发生后,本单位负责人应当立即报告安全生产监督管理部门每级上报的时间不得超过 2 小时", "生产安全事故(含道路交通事故、火灾事故) 造成的伤亡人数发生变化的,应当自事故发生之日起 7 日内及时补报", "特别重大事故以下等级事故,事故发生地与事故发生单位不在同一个县级以上行政区域的,由事故发生地人民政府负责调查", "任何单位和个人不得破坏事故现场、应妥善保存现场重要痕迹、(因抢救人员、疏通交通等特殊情况除外)"], "answer": "A", "why": "", "expl": ""}, {"type": "单选", "key": "第62题", "stem": "通信工程施工现场发生安全事故后,现场人员事故报告的内容一般不包括（　）", "options": ["事故发生的时间、地点", "事故的简要经过", "事故已造成的伤亡人数", "详细的经济损失"], "answer": "D", "why": "", "expl": "考点：事故报告的内容一般不包括什么。答案：详细的经济损失。\n初报报的是：时间地点、简要经过、伤亡人数、已采取措施。损失详细数字要后续统计，赶时间的事故初报不抠钱数。"}, {"type": "单选", "key": "第63题", "stem": "县级人民政府可以直接组织调查组进行调查的事故级别是 （　）", "options": ["特别重大事故", "重大事故", "较大事故", "一般事故"], "answer": "D", "why": "", "expl": "考点：哪一级事故县级人民政府可以直接组织调查组调查。答案：一般事故。\n调查分级：一般事故县级查；较大事故市级查；重大事故省级查；特别重大国务院查。口诀：县一般、市较大、省重大、国家特大。"}, {"type": "判断", "key": "第64题", "stem": "事故发生单位应及时全面落实整改措施,负有安全生产监督管理职责的部门应当加强监督检查。（　）", "options": [], "answer": "对", "why": "", "expl": "判断题。知识点：事故发生单位应当及时全面落实整改措施，负有安全生产监督管理职责的部门应当加强监督检查。对照题目，说法正确。\n出了事故，单位改、部门盯，一改一盯，闭环。判断为对。"}, {"type": "单选", "key": "第65题", "stem": "事故发生单位应及时全面落实整改措施, （　） 应当加强监督检查", "options": ["负有安全生产监督管理职责的部门", "工会组织", "人民检察院", "地方人民政府行政执法部门"], "answer": "A", "why": "", "expl": "同一知识点换成填空：谁应当加强监督检查。答案：负有安全生产监督管理职责的部门。\n不是工会、不是检察院、不是行政执法部门，盯整改的是安监部门。"}, {"type": "多选", "key": "第66题", "stem": "下列情况中应由有关部门按有关规定追究有关领导和直接责任者的责任并给予必要行政、经济处罚的有（　）。", "options": ["对事故隐瞒不报、谎报", "对事故故意延迟不报", "故意破坏事故现场", "无正当理由拒绝接受调查", "因抢救人员需要清理事故现场,但事前作好标记"], "answer": "ABCD", "why": "", "expl": "多选。考点：哪些情况要追究有关领导和直接责任者的责任。正确的是四条。\n对事故隐瞒不报、谎报的；故意延迟不报的；故意破坏事故现场的；无正当理由拒绝接受调查的。\n错的是因抢救人员需要清理事故现场、但事前做好标记的，这不违规，抢救人命优先，留好标记即可。第二章到此全部讲完。"}]};
const KEY = 'jingjiang_' + QUIZ.title;
let answers = [], sel = [], locked = [];

function save() { try { localStorage.setItem(KEY, JSON.stringify({ answers, sel, locked })); } catch(e) {} }
function loadSaved() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.answers) { answers = s.answers; sel = s.sel; locked = s.locked; } } catch(e) {} }
function clearAll() { if (confirm('确定清空本章答题记录，从头再做吗？')) { localStorage.removeItem(KEY); location.reload(); } }

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
const L = 'ABCDE';
function optsHtml(i) {
  const q = QUIZ.questions[i];
  if (q.type === '判断') {
    return '<div class="tf">' + ['对','错'].map(t => {
      let cls = 'opt';
      if (locked[i]) cls += t === q.answer ? ' right' : (answers[i].mine === t ? ' wrong' : '');
      return `<button class="${cls}" ${locked[i]?'disabled':''} onclick="pick(${i},'${t}')">${t}</button>`;
    }).join('') + '</div>';
  }
  return q.options.map((o, k) => {
    const lt = L[k];
    let cls = 'opt';
    if (locked[i]) cls += q.answer.includes(lt) ? ' right' : (answers[i].mine.includes(lt) ? ' wrong' : '');
    else cls += (sel[i]||[]).includes(lt) ? ' sel' : '';
    return `<button class="${cls}" ${locked[i]?'disabled':''} onclick="pick(${i},'${lt}')"><b>${lt}</b>　${esc(o)}</button>`;
  }).join('') + (q.type === '多选' && !locked[i] ? `<button class="confirm" ${(sel[i]&&sel[i].length)?'':'disabled'} onclick="confirmMulti(${i})">确　认</button>` : '');
}
function verdictHtml(i) {
  const q = QUIZ.questions[i];
  if (!locked[i]) return '';
  const a = answers[i];
  let h = a.ok
    ? `<div class="vline">✅ 答对了</div>`
    : `<div class="vline">❌ 答错了 · 你选 ${esc(a.mine)} · 正确答案 <u>${q.answer}</u></div>`;
  if (q.why) h += esc(q.why) + '<br>';
  if (q.expl) h += `<b class="h">📖 详细讲解：</b><br>` + esc(q.expl);
  return `<div class="verdict ${a.ok?'ok':'no'}">${h}</div><button class="re" onclick="redo(${i})">↺ 重新做这题</button>`;
}
function renderQ(i) {
  const q = QUIZ.questions[i];
  document.getElementById('q' + i).innerHTML =
    `<div class="qno"><span class="badge">${q.type}</span>第 ${i+1} 题${q.key && q.key.startsWith('附') ? '（附录）' : ''} · ${q.key || ''}</div>` +
    `<div class="stem">${esc(q.stem)}</div>` + optsHtml(i) + verdictHtml(i);
  updateBar();
}
function renderAll() {
  document.getElementById('list').innerHTML = QUIZ.questions.map((q,i)=>`<div class="q" id="q${i}"></div>`).join('');
  QUIZ.questions.forEach((_,i)=>renderQ(i));
}
function updateBar() {
  document.getElementById('pdone').textContent = answers.filter(a=>a).length;
  document.getElementById('pok').textContent = answers.filter(a=>a&&a.ok).length;
}
function pick(i, v) {
  if (locked[i]) return;
  const q = QUIZ.questions[i];
  if (q.type !== '多选') submit(i, [v]);
  else { sel[i] = sel[i] || []; const k = sel[i].indexOf(v); k>=0 ? sel[i].splice(k,1) : sel[i].push(v); save(); renderQ(i); }
}
function confirmMulti(i) { if (sel[i] && sel[i].length) submit(i, [...sel[i]].sort()); }
function submit(i, vals) {
  const q = QUIZ.questions[i];
  const std = q.type === '判断' ? q.answer : q.answer.split('').sort().join('');
  const mine = q.type === '判断' ? vals[0] : vals.join('');
  answers[i] = { mine, ok: mine === std };
  locked[i] = true;
  save(); renderQ(i);
}
function redo(i) {
  answers[i] = null; locked[i] = false; sel[i] = sel[i] ? sel[i].splice(0, sel[i].length) && null : null;
  save(); renderQ(i);
}
function copyAns() {
  const text = answers.map((a,i)=>a?`${i+1}${a.mine}`:null).filter(Boolean).join(' ') || '（还没答题）';
  const done = () => { const b = document.getElementById('copybtn'); b.textContent = '✅ 已复制，去聊天粘贴'; setTimeout(()=>b.textContent='📋 复制已答成绩', 2000); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(done); else done();
}
function downloadAns() {
  const text = answers.map((a,i)=>a?`${i+1}${a.mine}`:null).filter(Boolean).join(' ') || '（还没答题）';
  const body = QUIZ.title + '\n' + new Date().toLocaleString() + '\n' + text + '\n';
  const blob = new Blob([body], {type: 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '成绩-' + QUIZ.title + '.txt';
  document.body.appendChild(a); a.click(); a.remove();
  const b = document.getElementById('dnbtn'); if (b) { b.textContent = '✅ 已存到"下载"文件夹'; setTimeout(()=>{const x=document.getElementById('dnbtn'); if(x) x.textContent='💾 下载成绩文件';}, 2500); }
}
answers = new Array(QUIZ.questions.length).fill(null);
sel = new Array(QUIZ.questions.length).fill(null);
locked = new Array(QUIZ.questions.length).fill(false);
loadSaved();
renderAll();
</script>
