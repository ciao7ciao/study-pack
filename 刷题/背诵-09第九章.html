<script>
const QUIZ = {"title":"第九章","questions":[{"type":"单选","key":"第1题","stem":"施工单位施工现场的专职安全生产管理人员,应当由 （　） 委派,并监督其落实安全管理职责。","options":["建设单位","施工单位","设计单位","监理单位"],"answer":"B","why":"施工单位的现场专职安全员由施工单位委派，对本单位负责并接受其监督；建设单位、监理单位都无权直接委派施工方的安全管理人员。","expl":""},{"type":"单选","key":"第2题","stem":"分包单位施工现场的专职安全生产管理人员,应当由 （　）委派,并监督其落实安全管理职责。","options":["建设单位","总包单位","分包单位","监理单位"],"answer":"C","why":"分包现场的专职安全员由分包单位自行委派——谁用工谁负责；总包对分包安全负统一协调管理责任，但不代替分包委派安全员。","expl":""},{"type":"单选","key":"第3题","stem":"施工组织设计是以（　）为对象编制的","options":["单位工程","分部工程","分项工程","整个建设项目或群体工程"],"answer":"A","why":"施工组织设计以单位工程为对象编制，指导该工程的全部施工活动；分部分项工程编的是施工方案（危大工程另编专项方案），对象层级要记清。","expl":""},{"type":"多选","key":"第4题","stem":"下列施工现场周边环境中,（　）环境下作业需要编制相应的安全技术措施。","options":["居民稠密区","重要交通路口","铁路沿线","变电站附近","绿化区内"],"answer":"ABCD","why":"居民稠密区、重要交通路口、铁路沿线、变电站附近都是高风险敏感环境，作业前须编制相应安全技术措施；绿化区无特殊风险，不属于强制情形。","expl":""},{"type":"判断","key":"第5题","stem":"专项安全施工方案是施工单位在编制施工组织设计的基础上,单独编制的安全技术措施文件。 （　）","options":[],"answer":"错","why":"题干把关系说反了：专项安全施工方案是在施工组织设计之外「单独」编制的安全技术措施文件（针对专业性较强、危险性较大的分部分项工程），不是「在编制施组的基础上」衍生，故错误。","expl":""},{"type":"单选","key":"第6题","stem":"通信工程专项施工方案的施工计划中,一般不包括的（　）内容","options":["施工进度计划","材料与设备供应计划","资金配备计划","质量控制计划"],"answer":"C","why":"专项施工方案的施工计划含进度计划、材料设备供应计划等；「资金配备计划」属企业经营管理内容，不写入方案，见「资金」多为干扰项。","expl":""},{"type":"判断","key":"第7题","stem":"专项施工方案的施工安全保证措施应包括组织保障措施、技术措施、监测监控措施等内容。 （　）","options":[],"answer":"对","why":"施工安全保证措施=组织保障措施+技术措施+监测监控措施等，题干是标准表述，正确；记「组织、技术、监测监控」三件套。","expl":""},{"type":"单选","key":"第8题","stem":"通信工程专项施工方案的施工安全保证措施中,一般不包括 （　）","options":["管理保障措施","技术保障措施","应急管理预案","事故处理方法"],"answer":"D","why":"安全保证措施包括管理保障、技术保障、应急预案等；「事故处理方法」属事后环节，安全保证措施是事前预防性安排，不含事故处理。","expl":""},{"type":"多选","key":"第9题","stem":"施工现场多家单位同时作业时,应由（　）协调作业顺序,防止出现安全隐患。","options":["建设单位","设计单位","施工单位","监理单位","分包单位"],"answer":"AD","why":"多家单位同一现场作业，由建设单位协调，并可委托监理单位统一协调（监理受建设单位委托）；设计单位、分包单位无此协调职权。","expl":""},{"type":"单选","key":"第10题","stem":"项目经理应对专项施工作业的安全生产负全面 （　）责任。","options":["领导","监督","监理","协调"],"answer":"A","why":"项目经理对专项施工作业的安全生产负全面领导责任，是项目安全第一责任人，故选「领导」；监督、监理、协调都是他人视角的用词。原题选项D被OCR粘连了另一道拆除题的文本，已清理。","expl":""},{"type":"单选","key":"第12题","stem":"通信工程拆除作业中,下列天线及室外单元拆除的做法,错误的是（　）","options":["施工现场设专人看护,塔下作业人员不得进入安全禁区","遇六级及以上大风时,应快速完成当前作业再停工","吊装用的绳索和滑轮应固定牢靠、位置合理","拆除设备翻越楼顶女儿墙时,应采取有效的防撞措施"],"answer":"B","why":"天线及室外单元拆除遇六级及以上大风应立即停工，严禁「快速完成当前作业再停工」——高空吊装遇强风抢工是大忌，B明显违背安全优先原则。","expl":""},{"type":"多选","key":"第13题","stem":"通信工程土方开挖作业中,以下情况时必须支撑护土板的有 （　）","options":["沟坑距离机动车道较近处","与其他沟交叉处或平行距离较近处","距离建筑物或设施较近处","回填土、砂士、流砂等地带","按规定可以进行放坡处"],"answer":"ABCD","why":"必须支撑护土板的情形：临近机动车道、与其他沟交叉或平行较近、临近建筑物设施、回填土/砂土/流砂等不稳定土质地带；可放坡处按规定放坡即可，不需护土板。","expl":""},{"type":"单选","key":"第14题","stem":"通信工程割接作业中,操作人员的错误做法是 （　）","options":["无监护独立完成带电操作","佩戴防静电手环插拔机盘","使用专用工具插拔电源熔断器","使用进行过绝缘处理后的工具"],"answer":"A","why":"带电操作（割接）严禁无监护独立完成，必须有人监护；B、C、D都是规范做法——防静电手环、专用工具、绝缘处理工具均正确。","expl":""},{"type":"单选","key":"第15题","stem":"带电作业时监护人应由（　） 担任。","options":["班组长","具有具备带电作业资格、带电作业实践经验的人员","经过培训的人员","技术人员"],"answer":"B","why":"带电作业监护人须由具备带电作业资格且有实践经验的人员担任，光「班组长」「培训过」「技术人员」的资历都不够——监护人是最后一道安全防线，必须持证+经验。","expl":""},{"type":"判断","key":"第17题","stem":"电源设备加电,操作人员应穿绝缘鞋,带绝缘手套,并有两人互相配合。（　）","options":[],"answer":"对","why":"电源设备加电应穿绝缘鞋、戴绝缘手套并两人互相配合操作，题干是标准做法，正确；一人操作无人监护是触电主因之一。","expl":""},{"type":"单选","key":"第18题","stem":"通信工程割接作业中,设备加电时,操作人员的错误做法是 （　）","options":["穿绝缘鞋","戴绝终手套","独自完成操作","沿电流方向逐级加电"],"answer":"C","why":"设备加电时穿绝缘鞋、戴绝缘手套、沿电流方向逐级加电都正确；「独自完成操作」违背双人作业监护要求，错误做法选C。","expl":""},{"type":"单选","key":"第19题","stem":"直流电源系统割接工程中,通信设备有“主、备用”电源端子时,应先将 （　） 接入新电源系统中,正常后再全部接入。","options":["主用电源端子","备用电源端子","正极电源端子","负极电源端子"],"answer":"B","why":"直流电源割接时，有主备用电源端子的设备应先接「备用」端子——先接备用的思路是万一出问题不影响主用运行，业务无感知，再逐步割接主用。","expl":""},{"type":"单选","key":"第20题","stem":"直流电源系统割接工程中,通常测量电流的仪表为 （　）","options":["数字万用表","直流安培表","钳形电流表","交流安培表"],"answer":"C","why":"直流（大电流）测量通常用钳形电流表——不断开电路即可卡线测量；数字万用表量程小需串接入路，直流安培表需断开回路，都不便割接现场使用。","expl":""},{"type":"单选","key":"第21题","stem":"施工现场临时用电的供电方式,说法错误的是 （　）","options":["应采用三相五线制","必须符合三级配电结构","多台用电设备合用开关箱","采用两级漏电保护"],"answer":"C","why":"临时用电规范：三相五线制（TN-S）、三级配电、两级漏电保护；「多台用电设备合用开关箱」违背「一机一闸一漏一箱」原则，C错误。","expl":""},{"type":"单选","key":"第23题","stem":"维修施工现场临时用电设备和线路时,做法错误的是 （　）","options":["电工独立完成","穿绝缘鞋","戴绝缘手套","使用绝缘工具"],"answer":"A","why":"维修临时用电设备/线路必须由电工持证作业，穿绝缘鞋、戴绝缘手套、用绝缘工具；「电工独立完成」缺少监护不符合电气作业双人制，A错误。","expl":""},{"type":"单选","key":"第24题","stem":"安全技术交底一般不宜采用 （　） 形式进行。","options":["书面文件","集体会议","样板演示","远程视频"],"answer":"D","why":"安全技术交底宜采用书面、会议、样板演示等能确认到达和留痕的形式；「远程视频」无法有效确认每个作业人员知悉，一般不宜采用。","expl":""},{"type":"单选","key":"第25题","stem":"安全技术交底应覆盖工程项目的（　）","options":["管理人员","作业人员","技术人员","全体人员"],"answer":"D","why":"安全技术交底要覆盖工程项目全体人员——管理与作业人员一个都不能少，交底不留死角；只交底管理人员或作业人员都不完整。","expl":""},{"type":"判断","key":"第26题","stem":"一般情况下,安全技术交底仅在整个项目施工前做一次交底时不够的。（　）","options":[],"answer":"对","why":"安全交底不是一锤子买卖：开工前总交底后，新工序、新人员进场、环境变化时都要再交底，仅项目开工前交一次明显不够，题干正确。","expl":""},{"type":"单选","key":"第27题","stem":"安全技术交底的内容一般不包括 （　）","options":["作业危险因素","具体预防措施","生产操作规程","事故处理报告"],"answer":"D","why":"交底内容包括作业危险因素、针对性预防措施、操作规程等；「事故处理报告」属事后管理内容，事前交底不含它。","expl":""},{"type":"单选","key":"第28题","stem":"正确的安全技术交底的时间点是 （　）。","options":["项目投标前","施工图设计前","项目开工前","竣工交付前"],"answer":"C","why":"安全技术交底的法定时间点是项目开工前——先交底后作业；投标前、设计前还无作业安排，竣工交付前才交底完全本末倒置。","expl":""},{"type":"多选","key":"第29题","stem":"关于安全技术交底的时间点,选择正确的是 （　）","options":["项目投标前","项目开工前","作业班组进场前","关键作业实施前","竣工交付"],"answer":"BC","why":"交底时间点：项目开工前+作业班组进场前（新班组进场必须重新交底）；投标前不需要，竣工交付前交底毫无意义；「关键作业实施前」按教材口径不入选。","expl":""},{"type":"判断","key":"第30题","stem":"施工现场有两个以上施工单位施工时,建设单位应明确各方的安全职责。 （　）","options":[],"answer":"对","why":"两个以上施工单位在同一现场施工，建设单位应明确各方安全职责，题干是《安全生产法》协调管理要求，正确。","expl":""},{"type":"判断","key":"第31题","stem":"施工现场有两个以上施工单位施工时,建设单位应指定其中一个,对施工现场实行统一管理（　）","options":[],"answer":"错","why":"多方施工时由建设单位协调各方职责，「指定其中一个施工单位对现场统一管理」缺乏依据——施工方之间无管理权，故题干错误；协调主体是建设单位而非某家施工方。","expl":""},{"type":"多选","key":"第32题","stem":"通信工程施工现场的安全生产管理,包括 （　）","options":["建立项目安全生产责任体系","编制安全技术措施、方案","组织安全检查、整改安全隐患","确定消防安全责任人","组织安全事故调查处理"],"answer":"ABCD","why":"现场安全生产管理包括：建立项目安全责任体系、编制安全技术措施方案、组织安全检查整改隐患、确定消防安全责任人等；「组织安全事故调查处理」由政府/上级主导，不属现场日常管理内容。","expl":""},{"type":"多选","key":"第33题","stem":"通信工程施工现场的安全生产管理,包括（　）。","options":["配置人员、设施、劳动防护用品","编制安全技术措施、方案","组织安全检查、整改安全隐患","对施工安全生产进行记录","组织安全事故调查处理"],"answer":"ABCD","why":"现场安全管理还包括配置人员设施防护用品、编制安全技术措施、组织检查整改、安全生产记录等；E事故调查处理同上题——不是施工现场的日常管理职责。","expl":""},{"type":"单选","key":"第34题","stem":"施工现场安全管理的“三点控制”中的三点不包括 （　）","options":["危险点","危害点","事故多发点","质量控制点"],"answer":"D","why":"「三点控制」=危险点、危害点、事故多发点的强化控制；「质量控制点」属质量管理体系，与安全三点无关，见「质量」即排除。","expl":""},{"type":"多选","key":"第35题","stem":"施工现场安全管理的“三点控制”是指对现场的（　）进行强化控制管理。","options":["危险点","危害点","事故多发点","质量控制点","里程碑时间点"],"answer":"ABC","why":"三点控制指对危险点、危害点、事故多发点进行强化控制管理，教材原文；质量控制点、里程碑时间点都是其他体系的词汇。","expl":""},{"type":"单选","key":"第36题","stem":"下列做法中,不属于施工现场常见的违规操作行为的是 （　）","options":["不按规定使用劳动防护用品","不执行规定的安全防范措施","对违章指挥盲目服从,不加抵制","强令他人冒险进入危险区域"],"answer":"D","why":"常见违规操作：不按规定用防护用品、不执行防范措施、盲目服从违章指挥；「强令他人冒险进入危险区域」性质严重得多，属违章指挥/强令冒险作业行为，不属「常见违规操作」范畴，故选D。","expl":""},{"type":"多选","key":"第37题","stem":"通信施工现场,施工人员的以下行为,对做到“保证他人不被伤害”有所帮助的包括 （　）。","options":["发现事故隐患主动告知他人","提出安全建议","与他人分享安全经验","关注他人身体情况和精神状况","虚心接受他人对自己行为的纠正"],"answer":"ABCD","why":"「不伤害他人」：主动告知隐患、分享安全经验、关注他人状态、虚心接受纠正都有帮助；「提出安全建议」主要作用于改进管理，按教材口径也计入互保联保范畴，故ABCD全对。","expl":""},{"type":"多选","key":"第38题","stem":"通信工程施工现场,室内作业涉及的作业环境不良的因素包括（　）","options":["恶劣气候与环境","作业场所狭窄","作业场地杂乱","室内梯架缺陷","采光照明不良"],"answer":"BCDE","why":"室内作业环境不良：场所狭窄、场地杂乱、梯架缺陷、采光照明不良等；「恶劣气候与环境」属室外作业因素，室内不存在，故选BCDE。","expl":""},{"type":"多选","key":"第39题","stem":"通信线路建设中,应采取的环保措施包括（　）","options":["尽量减少林木砍伐和对天然植被的破坏","应根据实际情况采取有效的水土保持措施","严禁在崩塌滑坡危险区采石、采砂、取土","倾倒在河滩、沟渠的废沙、石、土等,其裸漏表面应植树种草","应采用喷水、覆盖等有效措施控制扬尘"],"answer":"ABCE","why":"线路建设环保措施：减少林木砍伐植被破坏、水土保持、严禁在崩塌滑坡危险区采石取砂、控制扬尘；D「向河滩沟渠倾倒废沙石」本身就是违法行为，谈不上措施。","expl":""},{"type":"单选","key":"第40题","stem":"通信工程中,废弃的沙、石、土的处理,错误的是 （　）","options":["必须运至规定的专门存放地堆放","不得向江河、湖泊、水库倾倒","可以向废弃的沟渠倾倒并植树种草","临时堆放时应防止被雨水冲走"],"answer":"C","why":"废弃沙石土必须运至规定专门存放地，不得向江河湖泊水库倾倒，临时堆放要防雨水冲刷；「向废弃沟渠倾倒并植树种草」仍是违法倾倒行为，C错误。","expl":""},{"type":"单选","key":"第41题","stem":"通信工程中,同一工程项目有多个分包商施工时,由（　）对各分包商的安全生产工作统一协调、管理。","options":["建设单位","监理单位","总包单位","分包单位"],"answer":"C","why":"同一项目多个分包商施工，由总包单位对分包的安全生产工作统一协调、管理——总包负总责；建设单位只管协调施工现场总体，不直接管分包安全。","expl":""},{"type":"多选","key":"第42题","stem":"总包单位对分包商的安全审核主要内容包括 （　）","options":["取得国家规定的安全资质证书","建立完善的安全管理机构","配备不少于一定比例的专职安全管理人员","通过第三方职业健康安全审核","具有规定数量的工程技术人员"],"answer":"ABC","why":"总包对分包安全审核：安全资质证书、安全管理机构、专职安全员配备比例；「第三方职业健康安全审核」「工程技术人员数量」不是安全审核的法定内容。","expl":""},{"type":"多选","key":"第43题","stem":"总包单位应定期对分包商进行安全考核和评价,内容包括 （　）","options":["分包商安全生产管理机构设置情况","分包商安全生产管理人员配置及资格情况","分包商安全生产违约、违章记录","分包商安全生产绩效","分包商质量进度情况"],"answer":"ABCD","why":"对分包的定期安全考核评价：机构设置、人员配置资格、违约违章记录、安全绩效；「质量进度情况」属履约评价，与安全考核并列但不同类，故不选E。","expl":""}]};
const L = 'ABCDE';
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
document.getElementById('list').innerHTML = QUIZ.questions.map((q, i) => {
  let opts;
  if (q.type === '判断') {
    opts = ['对','错'].map(t => `<div class="opt ${t===q.answer?'right':''}">${t}</div>`).join('');
  } else {
    opts = q.options.map((o,k) => `<div class="opt ${q.answer.includes(L[k])?'right':''}"><b>${L[k]}</b>　${esc(o)}</div>`).join('');
  }
  const expl = (q.why ? esc(q.why) + '<br>' : '') + (q.expl ? '<b class="h">📖 详细讲解：</b><br>' + esc(q.expl) : (q.why || q.expl ? '' : '（讲解待补，先记答案）'));
  return `<div class="q">
    <div class="qno"><span class="badge">${q.type}</span>第 ${i+1} 题${q.key && q.key.startsWith('附') ? '（附录）' : ''}</div>
    <div class="stem">${esc(q.stem)}</div>
    ${opts}
    <div class="ansline">✔ 答案：${q.answer}</div>
    <div class="expl">${expl}</div>
  </div>`;
}).join('');
</script>
