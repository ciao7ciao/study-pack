<script>
const SEGS = [{"tag": "附7", "text": "附7，单选题。根据《企工与工事故分类》,本起事故类别（　） 选项：A，中毒；B，火灾；C，机械伤害；D，其他伤害。"}, {"tag": null, "text": "正确答案：B，火灾。"}, {"tag": "附8", "text": "附8，单选题。该起事故的直接原因是 （　） 选项：A，开工前未进行安全技术交底 C 切割现场未设火灾防护设施；B，切割现场未设火灾防护设施B 作业前未办理审批手续；C，缺乏监督检查。"}, {"tag": null, "text": "正确答案：C，缺乏监督检查。"}, {"tag": "附9", "text": "附9，单选题。该事故定性为责任事故,以下属于安全责任事故的是（　） 选项：A，为达到既定目的故意制造的事故；B，由于不可抗力事件所引发的事故；C，由于人的过失造成的事故；D，由于科技条件限制而造成的无法预料的事故。"}, {"tag": null, "text": "正确答案：C，由于人的过失造成的事故。"}, {"tag": "附10", "text": "附10，单选题。施工现场应当制定的消防安全管理制度不包括 ( 选项：A，)等.A 社区联防制度；B，用火用电作业及使用易燃易爆危险物品的管理制度；C，消防设施维护保养制度；D，消防安全检查制度案例三:2017 年 2 月某日下午,气温只有 3°C左右,某通讯公司员工沈某某带实习生到某电信代销店安装宽带,正好碰到旁边一用户的线路,因为高度不足,被过往的车子绊倒,要求修复,为将路两侧线路绑扎到 5.5米高处,沈某某使用用户处借来的人字型铝合金梯子展开成一字梯后,作为登高工具,在第三次下梯子过程中发生子连接处折断,人从约 0.75 米高处倒地,不幸头后部碰到水泥路边,水泥路面高出辅道 10cm,抢救无效死亡,根据调查所知,沈某某作业时未安全帽,爬梯也无人扶梯。。"}, {"tag": null, "text": "正确答案：A，)等.A 社区联防制度。"}, {"tag": "附1", "text": "附1，单选题。使用人字梯是两梯夹角宜为（　）。 选项：A，30°；B，40°；C，50°；D，60°。"}, {"tag": null, "text": "正确答案：B，40°。"}, {"tag": "附2", "text": "附2，单选题。使用直梯时,作业人员应站在距离梯顶不少于（　）梯蹬上。 选项：A，0.5m；B，0.8m；C，1m；D，1.2m。"}, {"tag": null, "text": "正确答案：C，1m。"}, {"tag": "附3", "text": "附3，单选题。梯子放置的斜度要适当,梯子与地面的夹角不符合规范要求的是（　）。 选项：A，60°；B，65°；C，70°；D，80°。"}, {"tag": null, "text": "正确答案：D，80°。"}, {"tag": "附4", "text": "附4，单选题。以下原因中,属于导致沈某死亡事故的间接原因是（　）。 选项：A，沈某某不带安全帽；B，梯子折断；C，水泥路面突出；D，无人扶梯监护。"}, {"tag": null, "text": "正确答案：D，无人扶梯监护。"}, {"tag": "附5", "text": "附5，单选题。可能造成高处坠落事故的非管理因素有（　）。 选项：A，监督管理不到位；B，安全交底不落实；C，未向作业人员提供安全帽；D，梯子质量差。"}, {"tag": null, "text": "正确答案：D，梯子质量差。"}, {"tag": "附6", "text": "附6，单选题。易引发高处坠落事故的主观原 因有（　）。 选项：A，风力超过 5 级的天气；B，作业时接听手机；C，地面不平；D，寒冷天气作业。"}, {"tag": null, "text": "正确答案：B，作业时接听手机。"}, {"tag": "附7", "text": "附7，单选题。按照高处作业分级,沈某本次作业（　）。 选项：A，一级；B，二级；C，三级；D，四级。"}, {"tag": null, "text": "正确答案：C，三级。"}, {"tag": "附8", "text": "附8，单选题。低温或高温环境下进行高处作 业,应采取保暖和防暑降温措施,作业时间（　）过长。 选项：A，禁止；B，严禁；C，不宜；D，不得。"}, {"tag": null, "text": "正确答案：C，不宜。"}, {"tag": "附9", "text": "附9，单选题。高处作业,在选择安全带挂点 时应当( 选项：A，),注意防止摆动碰撞。A.高挂低用；B，低挂高用；C，低挂低用；D，高挂高用。"}, {"tag": null, "text": "正确答案：A，),注意防止摆动碰撞。A.高挂低用。"}, {"tag": "附10", "text": "附10，单选题。安全帽的帽衬、衬带的顶部和 帽壳内顶之间应保持（　）mm 的空间。 选项：A，30-60；B，25-50；C，10-20；D，5-25。"}, {"tag": null, "text": "正确答案：B，25-50。"}, {"tag": "附11", "text": "附11，单选题。创伤急救原则是（　）。 选项：A，先固定,后搬运,再抢救；B，先搬运,后固定,再抢救；C，先抢救,后搬运,再固定；D，先抢救,后固定,再搬运。"}, {"tag": null, "text": "正确答案：D，先抢救,后固定,再搬运。"}, {"tag": "附12", "text": "附12，单选题。通信工程中选用的安全帽通常 有效期通常为( 选项：A，)年。A.2 年；B，3 年；C，5 年；D，6 年案例四:4 月 21 日,某电信工程公司接到某运营商下达的童卫路宽带工程施工任务后,安排具有 15 年工龄的职工张某(男 42 岁,兼职安全员),沿施工路由对管孔进行光缆放装现场资料的确认。下午 3 点 40 左右,张某独自一人来到位于童卫路附近的施工现场,打开人井盖,并将井盖放在旁边的路面上,用自己的黄色安全帽放在路面上当作警示牌,随后就进入了人井。不久,当他爬出人井时,正好一辆的长安面包车从人井上高速驶过。张某当即被汽车保险杠撞中头部并掉进了人井里。接警的消防队员、医护人员迅速赶来展开救援,不幸的是张某在被救上来时己经气绝身亡。。"}, {"tag": null, "text": "正确答案：A，)年。A.2 年。"}, {"tag": "附1", "text": "附1，单选题。道路上施工作业前,应设置安全警示标志,标志设置时应（　）。 选项：A，从警告区开始,直到终止区结束；B，从警告区开始,直到作业区结束；C，从作业区开始,往警告区起点处；D，从缓冲区开始,直到作业区结束答案:A。"}, {"tag": null, "text": "正确答案：A，从警告区开始,直到终止区结束。"}, {"tag": "附2", "text": "附2，单选题。该起事故的性质应认定为（　）。 选项：A，责任事故；B，意外事故；C，人身伤害事故；D，突发事件。"}, {"tag": null, "text": "正确答案：A，责任事故。"}, {"tag": "附3", "text": "附3，单选题。根据《生产安全事故报告和调查处理条例»(中华人民共和国国务院令第 493 号),该起事故属于（　）。 选项：A，一般事故；B，较大事故；C，重大事故；D，特别重大事故。"}, {"tag": null, "text": "正确答案：A，一般事故。"}, {"tag": "附4", "text": "附4，单选题。进入人井作业,作业人员应该佩戴（　）安全带。 选项：A，带缓冲器的绳式；B，全身式；C，围杆作业；D，区域限制式。"}, {"tag": null, "text": "正确答案：B，全身式。"}, {"tag": "附5", "text": "附5，单选题。以下属于该起事故的间接经济损失的有（　）。 选项：A，现场抢救费用；B，停业造成的损失；C，事故赔偿；D，汽车损坏价值。"}, {"tag": null, "text": "正确答案：B，停业造成的损失。"}, {"tag": "附6", "text": "附6，单选题。安全色中（　）常用于表示紧急停止、禁止和危险的信号。 选项：A，红色；B，黄色；C，蓝色；D，绿色。"}, {"tag": null, "text": "正确答案：A，红色。"}, {"tag": "附7", "text": "附7，单选题。城市道路施工时如需围蔽工作区的,围栏的高度一般应（　）,距交叉路口 20m 内、地面 0.8m 以上采用通透式围挡。 选项：A，≥2m；B，≥1.8m；C，≥2.0m；D，≥2.5m。"}, {"tag": null, "text": "正确答案：B，≥1.8m。"}, {"tag": "附8", "text": "附8，单选题。导致事故的发生的直接原因是包括机械、物质或环境的不安全状态和（　）。 选项：A，安全操作规程不健全；B，人的不安全行为；C，劳动组织不合理；D，现场缺乏检查或指导错误。"}, {"tag": null, "text": "正确答案：B，人的不安全行为。"}, {"tag": "附9", "text": "附9，单选题。建设工程工地四周应按规定设置连续、密闭的围栏:在市区主要路段和市容景观道路及机场、码头、车站广场设置的围栏其高度不得低于（　）。 选项：A，1m；B，1.2m；C，1.8m；D，2.5m。"}, {"tag": null, "text": "正确答案：D，2.5m。"}, {"tag": "附10", "text": "附10，单选题。在道路进行夜间施工作业时,应在路栏或渠化设施顶部设置施工警告灯,警告灯的问距应（　）。 选项：A，≤6m；B，≤10m；C，≤20m；D，≤25m案例五:某施工项目部承接一无线基站工程项目,项目经理施某。在进行某处楼顶铁塔天馈线安装作业由穆某带领的施工班组负责,穆某为班组兼职安全员,穆某安排马某(项目经理施某从另一作业班组的调来)负责楼顶室外走线架焊接连通工作,派佟某和李某负责上塔安装天馈线,由于人手不够穆某又从当地找了农民张某负责在塔下监护,以防止其他人员进入施工区内。作业前,穆某进行简单地交待了作业内容及安全事项,三人虽携带了安全带,但为了方便操作,都未系挂,马某作业时不慎摔下,当场死亡。据调查,施工队人员的持证情况如下:穆某技工证、佟某持登高证,马某持电焊证,其他人员无特种作业证。楼高 10 米周边无栏杆,楼顶上的走线架高 2 米,铁塔高 20 米。请根据背景资料完成以下各题。。"}, {"tag": null, "text": "正确答案：C，≤20m。"}, {"tag": "附1", "text": "附1，单选题。以下不属于造成本起该事故的直接原因是（　）。 选项：A，穆队长违章指挥；B，马某无证作业；C，马某未使用安全带；D，安全技术交底不规范。"}, {"tag": null, "text": "正确答案：D，安全技术交底不规范。"}, {"tag": "附2", "text": "附2，单选题。该事故中都是事故的直接责任者是（　）。 选项：A，马某；B，穆某；C，马某和穆某；D，穆某、马某、佟某和李某都是。"}, {"tag": null, "text": "正确答案：C，马某和穆某。"}, {"tag": "附3", "text": "附3，单选题。离开特种作业岗位达（　）以上的特种作业人员,应当重新进行实际操作考核,经确认合格后方可上岗作业。 选项：A，3 个月；B，6 个月；C，一年；D，两年。"}, {"tag": null, "text": "正确答案：B，6 个月。"}, {"tag": "附4", "text": "附4，单选题。楼顶临边作业时设置的防护栏杆应能承受的外力大小最小应达到（　）。 选项：A，500N；B，800N；C，1000 N；D，承受外力 2000 N。"}, {"tag": null, "text": "正确答案：C，1000 N。"}, {"tag": "附5", "text": "附5，单选题。佟某和李某塔上作业时,应使用有后备保护绳的双背带式或全身式安全带,当后备保护绳超过（　）时,应使用缓冲器。 选项：A，1 米；B，2 米；C，3 米；D，4 米。"}, {"tag": null, "text": "正确答案：C，3 米。"}, {"tag": "附6", "text": "附6，单选题。佟某和李某两人同时上塔,两人之间距离应保持在（　）以上 选项：A，2 米；B，2.5 米；C，3 米；D，4 米。"}, {"tag": null, "text": "正确答案：C，3 米。"}, {"tag": "附7", "text": "附7，单选题。移动通信铁塔天馈线安装时,其室外馈线防雷接地一般要求进行（　）接地方式。 选项：A，单点；B，二点；C，三点；D，四点。"}, {"tag": null, "text": "正确答案：C，三点。"}, {"tag": "附8", "text": "附8，单选题。在此项作业中,（　）无需持特种作业操作资格证。 选项：A，穆某；B，李某；C，佟某；D，马某。"}, {"tag": null, "text": "正确答案：A，穆某。"}, {"tag": "附9", "text": "附9，单选题。塔上作业时,应以塔基为圆心,（　）为半径,设置施工区,非作业人员不得入内。 选项：A，塔高的 20%；B，塔高的 50%；C，塔高；D，塔高的 1.05 倍。"}, {"tag": null, "text": "正确答案：D，塔高的 1.05 倍。"}, {"tag": "附10", "text": "附10，单选题。下列（　）情况不属于违章作业。 选项：A，上塔作业时穿防滑鞋；B，电焊作业时不带护目镜；C，高处作业时不系安全带；D，监护人员站在在施工禁区内监护案例六:某施工单位承担一项 30 个无线基站工程,其中 20 个基站天线安装在楼顶,10 个基站天线安装在铁塔上。其中在楼顶安装天线的基站,楼顶增高架、室外走线架需焊接连通,并连接至楼顶接地装置。某日,施工队在郊区一个基站铁塔上进行天馈线安装作业,监理单位由于路远,没有到场。由于现场人员不足,施工队长在当地临时雇佣了两名农民,并在现场对工作内容及安全事项进行了简单讲解。施工中,其中一人在塔上整理馈线时, 为了方便操作,松开安全带,不慎从未盖好的孔洞中摔下当场死亡。事故发生后, 队长及时上报项目经理,项目经理上报公司主要负责人,并按照主要负责人的要求赶往现场处理。项目经理到达现场并了解事故情况后,因死者是临时雇佣的农民工,并未办理任何保险,因此与死者家属就赔偿及后事处理等相关事项协商一致, 私下了结了此事。但安全监督管理部门在一个月后获知此事后对事故责任单位及人员进行了责任追究。问题:。"}, {"tag": null, "text": "正确答案：A，上塔作业时穿防滑鞋。"}, {"tag": "附1", "text": "附1，单选题。不需要持特种作业人员操作证上岗的是（　） 选项：A，电工；B，焊工；C，项目经理；D，高空作业人员。"}, {"tag": null, "text": "正确答案：C，项目经理。"}, {"tag": "附2", "text": "附2，单选题。本次事故的等级为（　）。 选项：A，严重事故；B，一般事故；C，重大事故；D，高空坠落事故。"}, {"tag": null, "text": "正确答案：B，一般事故。"}, {"tag": "附3", "text": "附3，单选题。不属于施工单位从本事故中应当汲取的教训的是（　） 选项：A，施工单位应当建立健全安全生产责任制度和安全生产教育培训制度,制定安全生产规章制度和操作规程,并贯彻落实；B，施工单位应当加强安全生产教育培训,提高现场人员安全意识和安全操作技能。；C，加强现场安全生产管理,保证操作人员按规定持证上岗。；D，施工单位应做好消息封锁,不能让安监部门知晓事故,以免受罚。案例七:某通信施工公司承接了总包单位分包的某电信运营商移动驻地网工程任务,需要从电力线杆路上附挂 1 条光缆到某办公大楼。2013 年 9 月 24 日上午 10 时,班组长扬某带领 3 名施工人员来到某宾馆大门西侧供电变压器边进行引上光缆穿放。班组长杨某安排作业人员冯某某上杆作业。当冯某某登上变压器 H 杆横担进行操作时, 头部不慎碰到电力线与变压器连接的铜鼻子裸露处,即遭到高压电击,从近3 米左右的高处坠落而死亡。经调查发现:该光缆原是从地下管道穿放的,后因现有通信管道不通,总包单位有关人员擅自更改设计路由,将光缆管道穿放更改为从电力线杆路上附挂。杨某班组进场前,无人到现场勘察,也无人进行安全技术交底。死者冯某某,1998 年 5 月出生,经熟人介绍进公司不到 3 个月,未经过教育培训考核,登杆时未系戴有近电预警器的安全帽,班组长扬某在一旁未做任何提醒。调查还发现:该通信施工公司无施工资质,未给冯某某办理工伤保险,只办理了 20 万的人身意外伤害保险,项目开工后, 该公司和总包单位均无人进行过安全检查。事发时,某监理单位监理员张某在场。本次事故总损失金额为 210 万元。其中:现场抢救费用 5.2 万元、处理事故事务性费用 7.8 万元、丧葬费和一次性工亡补助金、抚恤金等 95 万元、停产损失 25 万元、机房设备提失 55 万元、安监部门罚款 10 万元、其他损失 8 万元。1、 本次事故的事故等级是。( A )A、一般事故 B、重大事故 C、特别重大事故 D、电击事故2、 本次事故的直接经济损失为( A )A、173 万 B、210 万 C、188 万 D、177 万3、 如果事故发生在今年,则安监部门可以对事故发生单位处罚款为(C )A、20 万以上 50 万以下 B、30 万以上 50 万以下C、30 万以上 100 万以下 D、50 万以上 100 万以下。"}, {"tag": null, "text": "正确答案：C，加强现场安全生产管理,保证操作人员按规定持证上岗。。"}, {"tag": "附4", "text": "附4，单选题。不属于本起事故直接原因的是（　） 选项：A，擅自更改设计路由；B，作业人员未佩戴安全帽；C，作业人员违章作业；D，总包单位违法分包。"}, {"tag": null, "text": "正确答案：D，总包单位违法分包。"}, {"tag": "附6", "text": "附6，单选题。造成本次事故的危险源是( 选项：A，)A、裸露的铜鼻子；B，作业人员未佩戴安全帽；C，作业面距离高压电过近；D，安全技术交底缺失。"}, {"tag": null, "text": "正确答案：A，)A、裸露的铜鼻子。"}, {"tag": "附7", "text": "附7，单选题。冯某上杆作业可以不佩戴的物品包括（　）。 选项：A，安全帽；B，绝缘手套；C，防护眼镜；D，安全带。"}, {"tag": null, "text": "正确答案：C，防护眼镜。"}, {"tag": "附8", "text": "附8，单选题。事故调查处理工作中坚持（　）。 选项：A，优先保护职工权益的原则；B，企业利益至上的原则；C，公正、公开的原则；D，科学严谨、依法依规、实事求是、注重实效。"}, {"tag": null, "text": "正确答案：D，科学严谨、依法依规、实事求是、注重实效。"}, {"tag": "附9", "text": "附9，单选题。根据本次事故等级情况,安监部门可以对事故发生单位处（　）罚款。 选项：A，2~10 万；B，10~20 万；C，20~50 万；D，30~100 万。"}, {"tag": null, "text": "正确答案：D，30~100 万。"}, {"tag": "附10", "text": "附10，单选题。案例中,该起事故的事故发生单位是（　） 选项：A，电信运营商；B，监理公司；C，总包单位；D，某通信施工公司。"}, {"tag": null, "text": "正确答案：C，总包单位。"}, {"tag": "附11", "text": "附11，单选题。当施工人员在 10KV 的高压线附近进行作业时,其身体(含超出身体以外的金属工具或物件)离开高压线的最小间距应保证（　）米。 选项：A，1.5；B，2.5；C，4；D，8。"}, {"tag": null, "text": "正确答案：B，2.5。"}, {"tag": "附12", "text": "附12，单选题。建筑法规定,施工企业必须按照工程设计图纸和施工技术标准施工,不得偷工减料,如施工单位发现设计不合理需要修改的,由（　）负责修改。 选项：A，施工单位；B，原设计单位；C，建设单位；D，总包单位。"}, {"tag": null, "text": "正确答案：B，原设计单位。"}, {"tag": "附13", "text": "附13，单选题。根据通信线路设计规范要求,架空电缆线路不宜与电力线路合杆架设。在不可避免时,允许和（　）的电力线路合杆架设。 选项：A，1K 以下；B，10KV 以下；C，22KV 以下；D，35KV 以下案例八:某通信工程公司承接了一项 30Km 城区管道光缆敷设工程。工程公司针对此项目,任命了项目经理,组建了项目经理部。项目经理部在施工前做了以下工作:安排现场勘查,利用直观经验法辨识了危险源,并采用专家打分评价法找出了 2 个较大危险源:人井内可能存在的有毒有害气体、道路上的施工场所。针对人井内有毒有害气体编制了控制措施。组建了施工作业队伍,作业人员均参加过公司和项目部级安全生产教育。"}, {"tag": null, "text": "正确答案：B，10KV 以下。"}, {"tag": "附1", "text": "附1，单选题。不属于通信工程常用的危险源辨识方法的是（　） 选项：A，直观经验法；B，对照分析法；C，类比推断法；D，盲猜法。"}, {"tag": null, "text": "正确答案：D，盲猜法。"}, {"tag": "附2", "text": "附2，单选题。针对人孔内有可能存在有毒有害气体,下面那个防范措施是错误的（　） 选项：A，严禁将易燃、易爆物品带入管道人孔；B，严禁在人孔吸烟、生火取暖、点燃喷灯；C，进入人孔前,必须先通风,并使用专用气体检测仪器进行气体检测,确认无易燃、易爆、有毒、有害气体并通风后方可进入；D，在人孔内作业期间,上下人孔的梯子不得撤走,人孔上面必须有专人监护,如有人窒息可立刻进入人孔施救。"}, {"tag": null, "text": "正确答案：D，在人孔内作业期间,上下人孔的梯子不得撤走,人孔上面必须有专人监护,如有人窒息可立刻进入人孔施救。"}, {"tag": "附3", "text": "附3，单选题。本项目的安全生产费应按( 选项：A，)计取。A、建安费的 2%；B，施工费的 1.5%；C，建安费的 1.0%；D，施工费的 1.0%。"}, {"tag": null, "text": "正确答案：A，)计取。A、建安费的 2%。"}, {"tag": "附4", "text": "附4，单选题。不属于施工企业主要负责人安全职责的是（　） 选项：A，对本企业安全生产工作负全面责任。；B，建立、健全本单位安全生产责任制;组织制定本单位安全生产规章制度和操作规程；C，落实安全生产组织领导机构,成立安全生产委员会,担任主任；D，根据工程的特点组织制定安全施工措施,实施项目安全生产管理。"}, {"tag": null, "text": "正确答案：D，根据工程的特点组织制定安全施工措施,实施项目安全生产管理。"}, {"tag": "附5", "text": "附5，单选题。不属于施工企业专职安全员职责的是（　） 选项：A，组织或者参与拟订本单位安全生产规章制度、操作规程和生产安全事故应急救援预案；B，建立、健全本单位安全生产责任制,组织制定本单位安全生产规章制度和操作规程；C，督促落实本单位重大危险源的安全管理措施；D，检查本单位的安全生产状况,及时排查生产安全事故隐患,提出改进安全生产管理的建议案例九:某日,某通信施工公司 8 名施工人员在队长丁某带领下,进行人井铺缆作业。8 时 40 分,陈某首先撬开人井盖,顺着电缆托架下到井内观察,井下污水漫到膝盖,不到 3 分钟,陈某突然瘫倒在人井内。正在整理材料的潘某和李某见状,不由分说,先后跳下人井救人,也一头栽倒在井底。一旁作业的韩某发现后大声呼叫随后队长丁某摒住气迅速下到井底,把绳子拴到他们腰上,众人合力先后将 3 人拉出了井口,并随即报警。15 分钟后,110 民警和 120 急救人员赶到现场,检查发现,事故造成 1 人当场死亡,2 人经抢救无效于 2 天后死亡。经了解,这些施工人员是 2 个月前被队长丁某从老家召雇来干活的,无劳动合同,无工伤保险;该项目由丁某私人承包,开工已有一月之余,开工前无人进行安全技术交底,期间也无人进行过安全检查。施工人员韩某说:“也不知道管井里咋会有毒气!也没有人告诉我们这些”。作业现场除有一个锥形桩、二只工具包外,未发现有围档、警示标志、安全绳、排风设备,更没有气体检测仪等安全检测装备。请根据背景资料完成以下 10 题。。"}, {"tag": null, "text": "正确答案：B，建立、健全本单位安全生产责任制,组织制定本单位安全生产规章制度和操作规程。"}, {"tag": "附1", "text": "附1，单选题。通信建设工程安全费的提取标准应为( 选项：A，)A、建安费的 1.5% (2%)；B，施工费的 1.5%；C，建安费的 1%；D，施工费的 1%。"}, {"tag": null, "text": "正确答案：A，)A、建安费的 1.5% (2%)。"}, {"tag": "附2", "text": "附2，单选题。在该起事故中队长丁某涉嫌 ( 选项：A，)A、重大责任事故罪、；B，重大劳动安全事故罪、；C，强令违章冒险罪 、；D，工程重大安全事故罪(重大责任事故罪的主体为自然人;重大劳动安全事故罪的主体为法人。犯罪行为方式不同:重大责任事故罪是由于相关责任自然人的违规违章操作而造成的重大伤亡事故。其犯罪行为具有相对的主动性。重大劳动安全事故主要是指相关的工矿企业、施工单位和监管部门罔顾国家和政府相关的劳动安全规章制度,造成了施工现场的安全漏洞和设备的不健全,从而造成的伤亡事故。)。"}, {"tag": null, "text": "正确答案：A，)A、重大责任事故罪、。"}, {"tag": "附3", "text": "附3，单选题。以下属于导致潘某死亡的间接原因是（　）。 选项：A，人孔内毒气过量；B，未佩戴防毒面具盲目施救；C，人孔内氧浓度低；D，安全知识缺乏。"}, {"tag": null, "text": "正确答案：D，安全知识缺乏。"}, {"tag": "附4", "text": "附4，单选题。国家标准将作业场所空气中氧含量低于的状态定义为“缺氧”（　） 选项：A，17.5%；B，18.5%；C，19.5%；D，21.5%。"}, {"tag": null, "text": "正确答案：C，19.5%。"}, {"tag": "附5", "text": "附5，单选题。以下（　）不属于安全费的使用范围。 选项：A，气体检测仪购买；B，用于应急救援的安全绳的购买；C，为作业人员购买意外伤害保险的费用；D，对施工人员的安全教育培训的开支。"}, {"tag": null, "text": "正确答案：C，为作业人员购买意外伤害保险的费用。"}, {"tag": "附6", "text": "附6，单选题。进入人孔等有限空间内作业前必须进行气体检测,当硫化氢的浓度超过（　）严禁有限空间进行长时间作业。 选项：A，4.6 mg/m3；B，10mg/m3；C，15 mg/m3；D，30mg/m3。"}, {"tag": null, "text": "正确答案：B，10mg/m3。"}, {"tag": "附7", "text": "附7，单选题。有限空间作业每隔（　）组织作业人员进行演练。 选项：A，一个月；B，两个月；C，三个月；D，半年7、通信施工企业应当对新招的施工人员进行岗前三级安全教育,培训时长不少于( D )学时A、12 B、20 C、24 D、32。"}, {"tag": null, "text": "正确答案：D，半年7、通信施工企业应当对新招的施工人员进行岗前三级安全教育,培训时长不少于( D )学时A、12 B、20 C、24 D、32。"}, {"tag": "附8", "text": "附8，单选题。该起事故的原因中,导致陈某发生事故的直接原因的是（　） 。 选项：A，未参加安全教育培训；B，作业现场未设警示标志；C，未通风就贸然进入有毒气的人井；D，未参加安全交底。"}, {"tag": null, "text": "正确答案：C，未通风就贸然进入有毒气的人井。"}, {"tag": "附9", "text": "附9，单选题。关于劳动合同与劳动关系说法以下正确的是( 选项：A，)。A、建立劳动关系就应当订立书面劳动合同；B，提交工伤申请时应当提供劳动合同；C，双方劳动关系在劳动合同签订时确立；D，先工作后签合同的最迟不超过 1 个月。"}, {"tag": null, "text": "正确答案：A，)。A、建立劳动关系就应当订立书面劳动合同。"}, {"tag": "附10", "text": "附10，单选题。根据《生产安全事故报告和调查处理条例》,该起事故属于（　） 选项：A，一般事故；B，较大事故；C，重大事故；D，特别重大事故案例十:2014 年 8 月某日下午,H 施工单位的现场负责人带领 5 位施工人员对位于某市一交叉路口处进行通信管道开挖作业。经过几个小时的工作,己开挖好长约 10 米,深约 1.5 米的管道。下午 17: 00 时左右突然上方堆放的泥土石块坍塌,一名施工人员因躲避不及,胸部以下被泥石掩埋,经 120 医生现场抢救无效死亡,而另一名工人受伤。据调查,本工程项目的建设单位是 Y 公司,监理单位是 J 公司,开挖作业的 5 名施工人员来自于 L 劳务公司。请根据背景资料完成以下 10 题。。"}, {"tag": null, "text": "正确答案：B，较大事故。"}, {"tag": "附1", "text": "附1，单选题。本次事故中死亡员工的一次性工亡补助金的标准为（　）。 选项：A，2013 年全国城镇居民人均收入的 20 倍；B，2013 年全国城镇居民人均可支配收入的 20 倍；C，2013 年统筹地区居民人均收入的 20 倍；D，2013 年统筹地区城镇居民人均收入的 20 倍。"}, {"tag": null, "text": "正确答案：B，2013 年全国城镇居民人均可支配收入的 20 倍。"}, {"tag": "附2", "text": "附2，单选题。受伤人员在停工留薪期内,原工资福利待遇不变,停工留薪期最长不超过（　）。 选项：A，6 个月；B，12 个月；C，24 个月；D，36 个月。"}, {"tag": null, "text": "正确答案：C，24 个月。"}, {"tag": "附3", "text": "附3，单选题。土方开挖时,挖出的土、石应堆放在距离沟、坑边沿（　）以外,使土、石不致回落于沟内。 选项：A，30cm；B，40cm；C，50cm；D，60cm。"}, {"tag": null, "text": "正确答案：D，60cm。"}, {"tag": "附4", "text": "附4，单选题。开挖深度（　）的基坑(槽)的土方开挖工程不仅需要编制专项施工方案,还需要专家论证。 选项：A，1.5 m；B，3m；C，5m；D，6m。"}, {"tag": null, "text": "正确答案：C，5m。"}, {"tag": "附5", "text": "附5，单选题。事故发生后,应由（　）负责向统筹地区社会保险行政部门提出工伤认定申请。 选项：A，Y 公司；B，J 公司；C，H 公司；D，L 公司。"}, {"tag": null, "text": "正确答案：D，L 公司。"}, {"tag": "附6", "text": "附6，单选题。施工单位的现场负责人可能遭受的（　）的刑事处罚。 选项：A，3 年以下；B，5 年以下；C，3- 7 年；D，5 年以上。"}, {"tag": null, "text": "正确答案：A，3 年以下。"}, {"tag": "附7", "text": "附7，单选题。土方开挖时,沟坑深在（　）以上者,应有人在地面清土。 选项：A，1m；B，l.2m；C，1.5m；D，1.8m。"}, {"tag": null, "text": "正确答案：C，1.5m。"}, {"tag": "附8", "text": "附8，单选题。（　）是本起事故的间接原因。 选项：A，无专项施工方案；B，堆土高度过高；C，土质松软；D，不设挡士板。"}, {"tag": null, "text": "正确答案：A，无专项施工方案。"}, {"tag": "附9", "text": "附9，单选题。员工受伤后,用人单位应当自事故伤害发生之日起（　）内提出工伤认定申请。 选项：A，15 日；B，30 日；C，一个月；D，一年。"}, {"tag": null, "text": "正确答案：B，30 日。"}, {"tag": "附10", "text": "附10，单选题。土方开挖时,堆土积高度不宜超过（　）。 选项：A，1m；B，l.2m；C，l.5m；D，1.8m(以下新增)案例十一A 省 F 县两路的交叉路口,因市政道路改迁,由某施工单位( 注册地 H 省 Z 市)负责该路段的通信杆搬迁工作,某日在通信杆搬迁过程中,因吊装绳不堪重负突然断裂,导致通信杆突然掉落,重重砸在两辆正在等红灯的小轿车上,造成 3 人死亡,1 人重伤的安全事故,现场没有安全生产管理负责人。这次事故造成的损失包括:医疗费用(含护理费用)4 5 万元,丧葬及抚恤等费用 60 万元,处理事故和现场抢救费用28 万元,设备损失 50 万元,停产损失 150 万元。(施工单位法定代表人为 D,技术负责人为 E,本项目负责人为 M,吊车司机 L)。"}, {"tag": null, "text": "正确答案：C，l.5m。"}, {"tag": "附1", "text": "附1，单选题。下面（　） 不属于人的不安全行为。 选项：A，、驾驶人员忽视安全；B，作业使用吊绳强度不足；C，施工人员未设围档；D，吊车司机注意力分散。"}, {"tag": null, "text": "正确答案：B，作业使用吊绳强度不足。"}, {"tag": "附2", "text": "附2，单选题。根据《企业职工伤亡事故分类》, 该事故的类别应为（　） 选项：A，、物体打击；B，机械伤害 c 、起重伤害；C，D、交通事故。"}, {"tag": null, "text": "正确答案：C，D、交通事故。"}, {"tag": "附3", "text": "附3，单选题。事故发生后,施工企业应当及时向（　） 上报事故。 选项：A，、F 县安监局和 A 省管局；B，Z 市安监局和 H 省通管局c 、F 县安监局和 H 省通管, 局；C，、Z 市安监局和 A 省通管局。"}, {"tag": null, "text": "正确答案：A，、F 县安监局和 A 省管局。"}, {"tag": "附4", "text": "附4，单选题。此起事故中施工企业被处于（　） 罚款 选项：A，、10-20 万元；B，20-50 万；C，50-100 万元；D，100-500 万元。"}, {"tag": null, "text": "正确答案：D，100-500 万元。"}, {"tag": "附5", "text": "附5，单选题。根据上述情况描述, 此故的直接经济损失为（　） 。 选项：A，、105 万元；B，183 万元；C，283 万元；D，333 万元。"}, {"tag": null, "text": "正确答案：B，183 万元。"}, {"tag": "附6", "text": "附6，单选题。事故发生后, 应由（　） 负责向安全生产监督管理部门上报事故情况。 选项：A，、法定代表人；B，技术负责人 c 、项目负责人；C，、吊车司机。"}, {"tag": null, "text": "正确答案：A，、法定代表人。"}, {"tag": "附7", "text": "附7，单选题。建设工程工地四周应按规定设置连续、密闭的围挡;在市区主要路段和市容景观道路及机场、码头、车站广场设置的围栏其高度不得低于（　） 。 选项：A，、1.5；B，1.8m；C，2m；D，2. 5m。"}, {"tag": null, "text": "正确答案：D，2. 5m。"}, {"tag": "附8", "text": "附8，单选题。事故发生后, 施工企业应当最迟（　） 上报事故。 选项：A，、30 分钟内；B，1 小时内；C，2 小时内；D，1 天内。"}, {"tag": null, "text": "正确答案：B，1 小时内。"}, {"tag": "附9", "text": "附9，单选题。吊装作业中,夜间应有足够的照明,室外作业遇到大雪、暴雨、大雾及（　）以上大风时,应停止作业。 选项：A，、四级；B，五级；C，六级；D，八级。"}, {"tag": null, "text": "正确答案：C，六级。"}, {"tag": "附10", "text": "附10，单选题。从事起重机械的（　）不需要持《特种设备作业人员证》 选项：A，、安全管理人员；B，司机；C，指挥人员；D，项目负责人案例十二:某通信工程公司通过招投标,5 折中标了湖北某地城域网管道光缆线路工程,建设单位委托了监理单位。建设单位项目负责人要求设计院计列安全生产费按照“不参与竞争原则执行;在施工合同中与施工单位约定,安全生产费和施工费统一按照施工进度支付。2010 年 5 月 29 日,出发前,施工队长在驻地告诉大家“施工中要注意安全,一定要完成今天的工作量”\"。到达施工现场后,一名施工人员在下井开始管道光缆穿放时,被人孔内的有毒气体重晕,井上人员发现后,在没有采取任何防护措施的情况下,接二连三盲日下井施救,造成下井施救的 3 名工友死亡。 事故调查发现:作业人员在进入人井作业前,未进行通风,未使用专用气体检测仪器进行有毒有害气体检测,施救人员未佩戴防护用品、未携带救援设备等盲目下井施救,最终酿成事故。相关单位按照政府的意见处理了相关责任人。事故处理整改后,施工单位给现场配备了复合气体检测仪,并配齐了劳动防护用品,施工人员按照规程要求的照明条件进行人井中作业,完成施工任务,最后工程通过验收。。"}, {"tag": null, "text": "正确答案：D，项目负责人案例十二:某通信工程公司通过招投标,5 折中标了湖北某地城域网管道光缆线路工程,建设单位委托了监理单位。建设单位项目负责人要求设计院计列安全生产费按照“不参与竞争原则执行;在施工合同中与施工单位约定,安全生产费和施工费统一按照施工进度支付。2010 年 5 月 29 日,出发前,施工队长在驻地告诉大家“施工中要注意安全,一定要完成今天的工作量”\"。到达施工现场后,一名施工人员在下井开始管道光缆穿放时,被人孔内的有毒气体重晕,井上人员发现后,在没有采取任何防护措施的情况下,接二连三盲日下井施救,造成下井施救的 3 名工友死亡。 事故调查发现:作业人员在进入人井作业前,未进行通风,未使用专用气体检测仪器进行有毒有害气体检测,施救人员未佩戴防护用品、未携带救援设备等盲目下井施救,最终酿成事故。相关单位按照政府的意见处理了相关责任人。事故处理整改后,施工单位给现场配备了复合气体检测仪,并配齐了劳动防护用品,施工人员按照规程要求的照明条件进行人井中作业,完成施工任务,最后工程通过验收。。"}, {"tag": "附1", "text": "附1，单选题。在本工程潮湿的人井中施工时,相关规范规定照明灯具电压应不大于（　）V。 选项：A，3；B，6；C，12；D，24。"}, {"tag": null, "text": "正确答案：C，12。"}, {"tag": "附4", "text": "附4，单选题。按照法规规定,设计院应按照（　）计算安全生产费。 选项：A，建设单位文件要求和现行通信概预算定额计算的建安费乘 1.5%；B，现行通信概预算定额全额计算的建安费乘 1.5%；C，投标单位报价折扣和现行通信定额计算的建安费乘 1.5%；D，投标单位报价折扣和现行通信定额计算的建安费乘 0.75%。"}, {"tag": null, "text": "正确答案：A，建设单位文件要求和现行通信概预算定额计算的建安费乘 1.5%。"}, {"tag": "附5", "text": "附5，单选题。造成本工程安全事故的间接原因是（　）。 选项：A，施工人员违章作业；B，施救人员盲目施救；C，施工队长违章指挥；D，施工人员缺乏安全知识。"}, {"tag": null, "text": "正确答案：D，施工人员缺乏安全知识。"}, {"tag": "附6", "text": "附6，单选题。在事故处理后,施工单位为人井内作业人员配备的安全防护用品错误的是（　）。 选项：A，自吸式导管防毒面具；B，腰带式安全带；C，安全绳；D，安全帽。"}, {"tag": null, "text": "正确答案：B，腰带式安全带。"}, {"tag": "附7", "text": "附7，单选题。该事故的类别是（　）事故。 选项：A，高处坠落；B，瓦斯爆炸；C，中毒和窒息；D，其他伤害。"}, {"tag": null, "text": "正确答案：C，中毒和窒息。"}, {"tag": "附8", "text": "附8，单选题。事故发生处的施工作业,在《通信建设工程安全生产管理规定》中被称为（　）作业,有些省市按照持证上岗管理。 选项：A，井下空间；B，室外架设；C，光缆线路；D，有限空间。"}, {"tag": null, "text": "正确答案：D，有限空间。"}, {"tag": "附9", "text": "附9，单选题。在事故处理整改后,施工单位配备的复合气体检测仪至少应能检测的四种气体,( 选项：A，)不是其中之一。A.二氧化碳；B，可燃气 体；C，硫化氢；D，氧气。"}, {"tag": null, "text": "正确答案：A，)不是其中之一。A.二氧化碳。"}, {"tag": "附10", "text": "附10，单选题。该事故的等级是（　）事故。 选项：A，一般；B，较大；C，重大；D，特别重大。"}, {"tag": null, "text": "正确答案：B，较大。"}, {"tag": "附11", "text": "附11，单选题。以下（　）不属于安全费的使用范围。 选项：A，气体检测仪购买；B，用于应急救援的安全绳的购买；C，为作业人员购买意外伤害保险的费用；D，对施工人员的安全教育培训的开支。"}, {"tag": null, "text": "正确答案：C，为作业人员购买意外伤害保险的费用。"}, {"tag": "附12", "text": "附12，单选题。通信施工企业应当对新招收的施工人员开展岗前三级教育,培训时间不少于（　）学时。 选项：A，8；B，12；C，24；D，32。"}, {"tag": null, "text": "正确答案：D，32。"}, {"tag": "附2", "text": "附2，单选题。王某高处作业的等级是（　）。 选项：A，一级；B，二级；C，三级；D，特级。"}, {"tag": null, "text": "正确答案：B，二级。"}, {"tag": "附3", "text": "附3，单选题。根据相关法规,该公司下列哪种做法符合要求（　）。 选项：A，不设立安全生产管理机构,配备专职安全生产管理人员；B，配备兼职的安全生产管理人员；C，设立安全生产管理机构,配备专职安全生产管理人员；D，只配备注册安全工程师。"}, {"tag": null, "text": "正确答案：C，设立安全生产管理机构,配备专职安全生产管理人员。"}, {"tag": "附4", "text": "附4，单选题。如果事故发生在 2021 年 9 月,则应急管理部门对该公司的罚款金额最可能是（　） 选项：A，二十万元以上三十万元以下；B，三十万元以上一百万元以下；C，一百万元以上二百万元以下；D，二百万元以上三百万元 190 以下。"}, {"tag": null, "text": "正确答案：B，三十万元以上一百万元以下。"}, {"tag": "附6", "text": "附6，单选题。该案例中需要持《特种作业操作证》的人是（　）。 选项：A，吴某；B，李某；C，周某；D，王某。"}, {"tag": null, "text": "正确答案：D，王某。"}, {"tag": "附7", "text": "附7，单选题。该生产安全事故的类别是（　）。 选项：A，物体打击；B，触电；C，倒塌；D，高处坠落。"}, {"tag": null, "text": "正确答案：D，高处坠落。"}, {"tag": "附8", "text": "附8，单选题。事故发生后,公司的主要负责人应当（　）向县以上应急管理部门和省通信管理局报告。 选项：A，立即；B，在 1 小时内；C，在 2 小时内；D，在 24 小时内。"}, {"tag": null, "text": "正确答案：B，在 1 小时内。"}, {"tag": "附9", "text": "附9，单选题。此期间对该公司的安全生产工作全面负责的人是（　）。 选项：A，赵某；B，钱某；C，孙某；D，李某。"}, {"tag": null, "text": "正确答案：C，孙某。"}, {"tag": "附10", "text": "附10，单选题。造成该事故的直接原因是（　）。 选项：A，现场没有必要的安全管理制度；B，管理松懈,无章可循；C，现场作业人员违反操作规范；D，缺乏现场安全监督管理和检查预控案例 14:某年 9 月 18 日上午,天空正刮台风,下大雨,某施工单位两名施工人员在某新建基站挖掘孔桩施工时,因电线电缆没有穿管保护,配电箱的铁皮割破绝缘皮,造成电线外壳、提升机的钢绞线带电。其中一名施工人员不慎触及提升机钢绞线,受电击经抢救无效死亡。据调查,该项目施工组织设计中没有现场临时用电方案,也无专项施工方案,出事地点配电箱没有配备漏电保护开关,现场用电采用的是三相四线制,现场安全管理混乱,施工作业人员没有穿防护服,绝缘鞋,施工作业前未进行安全交底。。"}, {"tag": null, "text": "正确答案：C，现场作业人员违反操作规范。"}, {"tag": "附1", "text": "附1，单选题。施工现场配电系统的漏电保护开关应按（　）配置 选项：A，四级；B，三级；C，两级；D，一级。"}, {"tag": null, "text": "正确答案：C，两级。"}, {"tag": "附2", "text": "附2，单选题。低压带电作业断开导线时,应( 选项：A，)A、应先断开相线,后断开零线；B，先断开零线后断开相线；C，先断开相线或零线均可；D，两者同时断开。"}, {"tag": null, "text": "正确答案：A，)A、应先断开相线,后断开零线。"}, {"tag": "附3", "text": "附3，单选题。实施心肺复苏术时的按压频次为（　）次每分钟 选项：A，60~80；B，80~100；C，100~120；D，120~140。"}, {"tag": null, "text": "正确答案：C，100~120。"}, {"tag": "附4", "text": "附4，单选题。触电伤员呼吸微弱或停止时,应立即通畅触电者气道（　）用枕头等物垫在伤员的头下 选项：A，应当；B，宜；C，严禁；D，不宜。"}, {"tag": null, "text": "正确答案：C，严禁。"}, {"tag": "附6", "text": "附6，单选题。施工组织总设计是以( 选项：A，)为对象编制的A、单位工程；B，分部工程；C，分项工程；D，整个建设项目或群体工程。"}, {"tag": null, "text": "正确答案：A，)为对象编制的A、单位工程。"}, {"tag": "附7", "text": "附7，单选题。下列分部分项工程中,不需要编制专项施工方案的是（　） 选项：A，起重吊装工程；B，模板工程；C，砌筑工程；D，拆除爆破工程。"}, {"tag": null, "text": "正确答案：C，砌筑工程。"}, {"tag": "附8", "text": "附8，单选题。带电作业时,监护人应由（　）担任 选项：A，班组长；B，具有具备带电作业资格、带电作业实践经验的人员；C，经过培训的人员；D，技术人员。"}, {"tag": null, "text": "正确答案：B，具有具备带电作业资格、带电作业实践经验的人员。"}, {"tag": "附9", "text": "附9，单选题。施工现场临时用电应采用（　）保护系统 选项：A，TN-C；B，B、TN-S C、IT；C，TT。"}, {"tag": null, "text": "正确答案：B，B、TN-S C、IT。"}, {"tag": "附10", "text": "附10，单选题。起重机等大功率机械设备的供电开关箱（　）电缆向设备供电 选项：A，只可使用 5 芯 C、可使用 3 芯；B，可使用 3 芯 B、只可使用 4 芯；C，使用 4 芯 5 芯均可案例 15:某市通信工程公司在某郊区农田间进行光缆线路工程施工。该光缆路由是在 kV 电力线正下方 2 米多的位置。作业队长带领同村 4 名作业人员到达施工现场,传达了项目经理“施工中要注意安全”的要求,随后离开。作业人员使用铝合金伸缩梯子挂光缆,在放完一段光缆后,两人举着梯子在电力线下方移动,致使铝合金梯子上方与电力线接触,举梯人触电。另外 2 人直接用手施救,造成 3 人死亡,1 人受伤的事故。事故发生后,受伤人立即报告了现场情况。事故调查发现:本项目施工准备过程项目负责人没有组织危险源辨识和制定安全防范措施,没有书面安全技术交底,但项目经理在开工前强调“施工中要注意安全”。事后,公司按照“四不放过”原则对事故进行了处理。事故处理后,施工单位为现场配置了安全防护用品,本工程大部分段落,施工人员采用吊板方式布放光缆,测试过程中安全使用仪器仪表,最后工程通过验收。。"}, {"tag": null, "text": "正确答案：A，只可使用 5 芯 C、可使用 3 芯。"}, {"tag": "附1", "text": "附1，单选题。本项目安全技术交底应该由（　）向全部作业人员和管理人员进行详细说明。 选项：A，公司技术总监；B，公司安全总监；C，项目技术负责人；D，项目专职安全员。"}, {"tag": null, "text": "正确答案：C，项目技术负责人。"}, {"tag": "附2", "text": "附2，单选题。该事故的类别是（　）事故。 选项：A，高处坠落；B，机械伤害；C，触电；D，其他伤害。"}, {"tag": null, "text": "正确答案：C，触电。"}, {"tag": "附3", "text": "附3，单选题。造成本工程安全事故的直接原因是（　）。 选项：A，项目负责人安全意识缺乏；B，施工单位安全培训不到位；C，施工人员违章作业；D，施工人员安全知识缺乏。"}, {"tag": null, "text": "正确答案：C，施工人员违章作业。"}, {"tag": "附4", "text": "附4，单选题。按照相关规范要求,公司应为本工程所有参与人员配备的安全防护用品是（　）。 选项：A，安全帽；B，安全带；C，绝缘鞋；D，绝缘手套。"}, {"tag": null, "text": "正确答案：D，绝缘手套。"}, {"tag": "附5", "text": "附5，单选题。该事故的等级是（　）事故。 选项：A，一般；B，较大；C，重大；D，特别重大。"}, {"tag": null, "text": "正确答案：B，较大。"}, {"tag": "附6", "text": "附6，单选题。下列事故处理做法,不属于事故处理“四不放过”原则的是（　）。 选项：A，公司组织了安全生产标准化培训；B，公司对全员就本事故的教训进行专题教育培训；C，公司制定了线路施工常见事故预防措施并监督实施；D，行政主管部门对项目负责人进行了处罚。"}, {"tag": null, "text": "正确答案：A，公司组织了安全生产标准化培训。"}, {"tag": "附7", "text": "附7，单选题。本项目实施过程中,不得使用吊板作业的情形是（　）。 选项：A，在 7/2.2 规格的吊线上；B，在跨越公路杆档；C，在跨越水田杆档；D，吊板上的挂钩已磨损五分之一时。"}, {"tag": null, "text": "正确答案：B，在跨越公路杆档。"}, {"tag": "附8", "text": "附8，单选题。本工程实施过程中,人员与电力线的最小安全距离是（　）米。 选项：A，2.0；B，2.5；C，3.5；D，4.0。"}, {"tag": null, "text": "正确答案：A，2.0。"}, {"tag": "附9", "text": "附9，单选题。该事故发生后,现场人员应立即向（　）报告。 选项：A，项目负责人；B，项目安全负责人；C，公司主管安全副总；D，公司负责人。"}, {"tag": null, "text": "正确答案：D，公司负责人。"}, {"tag": "附10", "text": "附10，单选题。在测试过程中,（　）的测试接口不得正对着眼睛观察。 选项：A，数字万用表；B，PMD 分析仪(分析端)；C，光功率计；D，波长可调光源案例 16某施工项目部承接一无线基站工程项目,项目经理施某。在进行某处楼顶铁塔天馈线安装作业由穆某带领的施工班组负责,穆某为班组兼安全员,穆某安排马某(项目经理施某从另一作业班组的调来)负责楼顶室外走线架焊接连通工作,派佟某和李某负责上塔安装天馈线,由于人手不够穆某又从当地找了农民张某负责在塔下监护,以防止其他人员进入施工区内。作业前,穆某简单地交待了作业内容及安全事项,三人虽携带了安全带,但为了方便操作,都未系挂,马某作业时不慎摔下,当场死亡。据调查,施工队人员的持证情况如下:穆某技工证、佟某持登高证,马某持电焊证,其他人员无特种作业证。楼高 10 米周边无栏杆,楼顶上的走线架高 2 米,铁塔高 20 米。。"}, {"tag": null, "text": "正确答案：D，波长可调光源案例 16某施工项目部承接一无线基站工程项目,项目经理施某。在进行某处楼顶铁塔天馈线安装作业由穆某带领的施工班组负责,穆某为班组兼安全员,穆某安排马某(项目经理施某从另一作业班组的调来)负责楼顶室外走线架焊接连通工作,派佟某和李某负责上塔安装天馈线,由于人手不够穆某又从当地找了农民张某负责在塔下监护,以防止其他人员进入施工区内。作业前,穆某简单地交待了作业内容及安全事项,三人虽携带了安全带,但为了方便操作,都未系挂,马某作业时不慎摔下,当场死亡。据调查,施工队人员的持证情况如下:穆某技工证、佟某持登高证,马某持电焊证,其他人员无特种作业证。楼高 10 米周边无栏杆,楼顶上的走线架高 2 米,铁塔高 20 米。。"}, {"tag": "附1", "text": "附1，单选题。以下不属于造成本起事故的直接原因是（　）。 选项：A，穆队长违章指挥；B，马某无证作业；C，马某未使用安全带；D，安全技术交底不规范。"}, {"tag": null, "text": "正确答案：D，安全技术交底不规范。"}, {"tag": "附2", "text": "附2，单选题。该事故中事故的直接责任者是（　）。 选项：A，马某；B，穆某；C，马某和穆某；D，穆某、马某、佟某和李某都是。"}, {"tag": null, "text": "正确答案：C，马某和穆某。"}, {"tag": "附3", "text": "附3，单选题。离开特种作业岗位达（　）以上的特种作业人员,应当重新进行实际操作考核,经确认合格后方可上岗作业。 选项：A，3 个月；B，6 个月；C，一年；D，两年。"}, {"tag": null, "text": "正确答案：B，6 个月。"}, {"tag": "附4", "text": "附4，单选题。楼顶临边作业时设置的防护栏杆应能承受的外力大小最小应达到（　）。 选项：A，500 N；B，800N；C，1000N；D，承受外力 2000 N。"}, {"tag": null, "text": "正确答案：C，1000N。"}, {"tag": "附5", "text": "附5，单选题。佟某和李某塔上作业时,应使用有后备保护绳的双背带式或全身式安全带,当后备保护绳超过（　）时,应使用缓冲器。 选项：A，1 米；B，2 米；C，3 米；D，4 米。"}, {"tag": null, "text": "正确答案：C，3 米。"}, {"tag": "附6", "text": "附6，单选题。佟某和李某两人向时上塔,两人之间距离应保持在（　）以上 选项：A，2 米；B，2.5 米 c.3 米；C，D.4 米。"}, {"tag": null, "text": "正确答案：C，D.4 米。"}, {"tag": "附8", "text": "附8，单选题。在此项作业中,（　）无需持特种作业操作资格证。 选项：A，穆某；B，李某；C，佟某；D，马某。"}, {"tag": null, "text": "正确答案：A，穆某。"}, {"tag": "附9", "text": "附9，单选题。塔上作业时,应以塔基为圆心,（　）为半径,设置施工区,非作业人员不得入内。 选项：A，塔高的 20%；B，塔高的 50%；C，塔高；D，塔高的 1.05 倍。"}, {"tag": null, "text": "正确答案：D，塔高的 1.05 倍。"}, {"tag": "附10", "text": "附10，单选题。下列（　）情况下不属于违章作业。 选项：A，上塔作业时穿防滑鞋；B，电焊作业时不带护目镜；C，高处作业时不系安全带；D，监护人员站在在施工禁区内监护。"}, {"tag": null, "text": "正确答案：A，上塔作业时穿防滑鞋。"}, {"tag": "附11", "text": "附11，单选题。不需要持特种作业人员操作证上岗的是（　） 选项：A，电工；B，焊工；C，项目经理；D，高空作业人员。"}, {"tag": null, "text": "正确答案：C，项目经理。"}, {"tag": "附12", "text": "附12，单选题。不属于施工单位从本事故中应当汲取的教训的是（　） 选项：A，施工单位应当建立健全安全生产责任制度和安全生产教育培训 l 制度,制定安全生产规章制度和操作规程,并贯彻落实；B，施工单位应当加强安全生产教育培训,提高现场人员安全意识和安全操作技能。；C，加强现场安全生产管理,保证操作人员按规定持证上岗。；D，施工单位应做好消息封锁,不能让安监部门知晓事故,以免受罚。。"}, {"tag": null, "text": "正确答案：D，施工单位应做好消息封锁,不能让安监部门知晓事故,以免受罚。。"}];
const synth = window.speechSynthesis;
let cur = -1, playing = false, pass = 1, voice = null;
const starts = SEGS.map((s, i) => s.tag ? i : -1).filter(i => i >= 0);
const list = document.getElementById('list');

SEGS.forEach((s, i) => {
  if (s.tag) { const t = document.createElement('div'); t.className = 'tag'; t.textContent = s.tag; list.appendChild(t); }
  const d = document.createElement('div'); d.className = 'line'; d.textContent = s.text;
  d.onclick = () => { pass = 1; start(i); }; list.appendChild(d); s.el = d;
});

function pickVoice() {
  const vs = synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('zh'));
  voice = vs.find(v => /婷婷|Tingting|晓晓|Xiaoxiao|辉辉|Huihui|Yaoyao/.test(v.name)) || vs[0] || null;
}
pickVoice();
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = pickVoice;

function qStart(i) { let r = 0; for (const s of starts) { if (s <= i) r = s; else break; } return r; }
function qEnd(i) { for (const s of starts) { if (s > i) return s - 1; } return SEGS.length - 1; }

function start(i) {
  synth.cancel();
  if (i >= SEGS.length) { done(); return; }
  if (i < 0) i = 0;
  cur = i;
  document.querySelectorAll('.line').forEach((el, k) => {
    el.classList.toggle('now', k === cur);
    el.classList.toggle('done', k < cur);
  });
  SEGS[cur].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  document.getElementById('status').textContent = (pass === 2 ? '第2遍 · ' : '') + `第 ${cur + 1}/${SEGS.length} 句`;
  const u = new SpeechSynthesisUtterance(SEGS[cur].text);
  u.lang = 'zh-CN';
  if (voice) u.voice = voice;
  u.rate = parseFloat(document.getElementById('rate').value);
  u.onend = () => {
    if (!playing) return;
    if (cur < qEnd(cur)) { pass = pass; start(cur + 1); }
    else if (document.getElementById('mem').checked && pass === 1) { pass = 2; start(qStart(cur)); }
    else { pass = 1; const n = qEnd(cur) + 1; if (n < SEGS.length) start(n); else done(); }
  };
  synth.speak(u);
  playing = true; setBtn();
}
function done() { playing = false; setBtn(); document.getElementById('status').textContent = '✅ 讲完啦'; }
function setBtn() { document.getElementById('toggle').textContent = playing ? '⏸ 暂停' : '▶ 播放'; }
document.getElementById('toggle').onclick = () => {
  if (cur === -1) { start(0); return; }
  if (playing) { synth.pause(); playing = false; setBtn(); }
  else if (synth.paused && synth.speaking) { synth.resume(); playing = true; setBtn(); }
  else { playing = true; start(cur); }
};
document.getElementById('prev').onclick = () => { pass = 1; const p = qStart(Math.max(cur - 1, 0)); start(p === cur ? 0 : p); };
document.getElementById('next').onclick = () => { pass = 1; const n = starts.find(s => s > cur); start(n === undefined ? SEGS.length : n); };
document.getElementById('rate').onchange = () => { if (cur >= 0) { const c = cur; start(c); } };
</script>
</body>
</html>
