{ id:'f1', tab:'①安法', grp:'📖 法律法规篇', canDone:true, title:'法律篇 · 《安全生产法》（119条）',

  html: `
<div class="big">全书的<b>总纲</b>：119条＝总则19＋单位保障32＋从业权利义务10＋监督管理17＋应急救援调查11＋法律责任27＋附则3。案例里出现 <b>2021年9月</b> 以后的事故，一律按本法处理——时间点必考。</div>

<div class="q">适用范围与「管不了」的行业？</div>
<div class="k">境内从事生产经营活动的<b>所有单位</b>适用。但有 <span class="big-num">7个特殊行业</span> 另有规定的从其规定：<b>消防、道路交通、民用航空、铁路交通、水上交通、核与辐射、特种设备</b>。</div>

<div class="q">理念、方针、机制（第3条）？</div>
<div class="k">理念＝<b>以人为本、人民至上、生命至上</b>；方针＝<b>安全第一、预防为主、综合治理</b>（十二字，从源头防范化解重大安全风险）；三必须＝管行业/管业务/管生产经营<b>必须管安全</b>；机制五条＝<b>生产经营单位负责＋职工参与＋政府监管＋行业自律＋社会监督</b>，落实单位主体责任和政府监管责任。</div>

<div class="q">监管体系怎么分？（第10条，你的头号坑）</div>
<div class="k"><ul>
<li><b>综合监督管理</b>＝四级应急管理部门（国务院应急部＋省厅＋市局＋县局）——<b>乡镇没有综合监管权</b>。</li>
<li><b>监督管理</b>（行业专项）＝住建、交通等有关部门在职责范围内实施。</li>
<li><b>新兴行业</b>监管职责不明的，由县级以上政府按<b>业务相近</b>原则确定监管部门。</li>
<li>应急管理部门＋有关部门统称「<b>负有安全生产监督管理职责的部门</b>」。</li>
</ul></div>

<div class="q">主要负责人（第5、21条）？</div>
<div class="k"><b>主要决策人</b>＝第一责任人，对本单位安全生产工作<b>全面负责</b>；其他负责人对<b>职责范围内</b>负责。<b>七项职责</b>：①建立健全并落实<b>全员安全生产责任制</b>＋标准化建设 ②组织制定规章制度和操作规程 ③组织制定教育培训计划 ④保证投入 ⑤落实<b>双重预防机制</b>（风险分级管控＋隐患排查治理）⑥组织制定应急预案 ⑦及时如实报告事故。</div>

<div class="q">钱、机构、危险作业（第23、24、43条）？</div>
<div class="k"><ul>
<li><b>资金投入不足的后果</b>由决策机构、主要负责人或个人经营的投资人担责（股份制＝董事会、国企＝厂长经理、个体＝投资人）。</li>
<li><b>高危行业</b>（矿山/金属冶炼/建筑施工/运输/危险物品类）<b>必须</b>设机构或配专职安全员；其他单位<b>超过100人</b>必须设机构或专职，100人以下可兼职。</li>
<li><b>四类危险作业</b>（爆破、吊装、动火、临时用电）须安排<b>专门人员</b>现场安全管理。</li>
<li>淘汰目录：国务院制定，省市<b>只能增不能减</b>。</li>
</ul></div>

<div class="q">从业人员的权利和义务？（第53~59条）</div>
<div class="k"><ul>
<li><b>六权利</b>：知情权、建议权、<b>索赔权</b>（工伤之外还可提赔偿要求——所以要配雇主险/意外险）、批评检举控告权、<b>拒绝权</b>（违章指挥强令冒险）、<b>停止作业权</b>（撤离前<b>先采取可能的应急措施</b>，「直接撤离」是错的）。</li>
<li><b>三义务</b>：遵章守规正确佩戴防护用品、接受培训掌握技能、发现隐患<b>立即报告</b>。</li>
<li>单位不得因履职<b>降低工资福利或解除合同</b>；<b>免责协议无效</b>（签了也罚，第106条：主要负责人2万~10万）；被派遣劳动者<b>等同从业人员</b>。</li>
</ul></div>

<div class="q">保险怎么买？（第51条）</div>
<div class="k"><b>工伤保险</b>＝强制全员；<b>安责险</b>＝国家鼓励，<b>8大高危行业强制</b>：矿山、危化品、烟花爆竹、交通运输、建筑施工、民用爆炸物品、金属冶炼、渔业生产。高危未投→限期改正＋5万~10万，逾期10万~20万。</div>

<div class="q">监督检查与强制措施？（第65、70条）</div>
<div class="k">检查<b>不得影响正常生产经营</b>（不能要求停产配合检查）；职权＝调查了解/当场纠正/行政处罚/扣押查封/责令停产停业。查到隐患：立即处理→不能处理报负责人→负责人不处理<b>安管人员可越级报部门</b>。责令停产停业拒不执行、有现实危险的→经<b>本部门主要负责人批准</b>可停电、停供民用爆炸物品强制履行；<b>提前24小时</b>书面通知（紧急情形除外），隐患消除及时解除。执法<b>书面记录</b>，双方签字。</div>

<div class="q">罚则精选（数字必背）？</div>
<div class="k"><ul>
<li><b>94条</b> 主要负责人未履职：未出事故→限期改正＋<b>2万~5万</b>，逾期<b>5万~10万</b>＋停产整顿；出事故（不构成犯罪）→撤职＋<b>5年内不得担任任何单位主要负责人</b>；<b>重大、特大事故→终身不得担任本行业主要负责人</b>。</li>
<li><b>95条</b> 负责人未履职致事故按年收入罚：一般<b>40%</b>、较大<b>60%</b>、重大<b>80%</b>、特大<b>100%</b>——<span class="hide">口诀「四六八一百」</span>。</li>
<li><b>96条</b> 其他负责人和安管人员：未出事故<b>1万~3万</b>；出事故→暂停或吊销资格＋上年收入<b>20%~50%</b>。</li>
<li><b>97条</b> 七情形（未设机构配人员注册安全工程师/危险物品和三类人未考核/未培训派遣实习人员/培训无档案/隐患未通报/未预案演练/特种无证）：责令改正＋<b>10万以下</b>，逾期<b>10万~20万</b>＋主管人员<b>2万~5万</b>。</li>
<li><b>98条</b> 高危建设项目（矿山/金属冶炼/危险物品）无安全评价、设计未审、未按设计施工、未验收：10万~50万，主管2万~5万，逾期50万~100万。</li>
<li><b>103条</b> 违法发包出租：没收违法所得＋2~5倍（不足10万的罚10万~20万）；出事故承包承租方<b>连带责任</b>；未签安全协议→单位5万以下＋主管1万以下。</li>
<li><b>108条</b> 拒绝阻碍监督检查：单位<b>2万~20万</b>＋主管1万~2万。</li>
<li><b>113条</b> 吊销证照＋5年禁任（严重终身禁本行业）四情形：<b>重大隐患180日内3次或1年内4次受罚</b> / 停产整顿后仍不具备条件 / 不具备条件<b>导致重大特大事故</b> / <b>拒不执行</b>停产停业决定。</li>
<li><b>114条</b> 事故单位罚款四档：一般<b>30万~100万</b>、较大<b>100万~200万</b>、重大<b>200万~1000万</b>、特大<b>1000万~2000万</b>；<b>情节特别恶劣→2倍以上5倍以下</b>。予以关闭→<b>报县级以上政府决定</b>；拘留→<b>公安机关</b>决定。</li>
</ul></div>
<div class="mn"><b>口诀：</b>监管「应急综合到县级，乡镇无权按业近」；负责人「四六八一百，五年终身两道锁」；其他负责人「一三起步二到五成」；危险作业「爆吊动临电，专人盯现场」。</div>
` },
{ id:'f2', tab:'②建筑法', grp:'📖 法律法规篇', canDone:true, title:'法律篇 · 《建筑法》',
  law:'2019-04-23修正 · 题库考点少而稳，四类审批+第一责任人',
  html: `
<div class="k"><span class="t">施组：</span>编制施工组织设计时<b>制定安全技术措施</b>；专业性较强的项目<b>单独编制专项安全施工组织设计</b>。</div>
<div class="k"><span class="t">施工前办批准手续的四类情形</span>（<b>建设单位</b>去办）：①需要临时<b>占用规划批准以外场地</b> ②可能损坏<b>道路、管线、电力、通讯</b>等设施 ③需要<b>临时停水停电</b> ④需要进行<b>爆破作业</b>。</div>
<div class="k"><span class="t">责任人：</span>建筑施工企业的<b>法定代表人</b>对本企业安全生产负责（第一责任人）；现场安全由<b>施工企业</b>负责——总包<b>总负责</b>，分包向总包负责、服从管理。</div>
<div class="k"><span class="t">作业人员：</span>对影响人身健康的作业程序和条件有<b>建议权</b>；有<b>获得防护用品</b>权；有<b>批评检举控告</b>权。</div>
<div class="k"><span class="t">保险与装修：</span>工伤保险强制缴；<b>鼓励</b>为危险作业人员办意外险。涉及<b>建筑主体和承重结构变动</b>的装修工程：施工前由<b>原设计单位或有相应资质的设计单位</b>提出设计方案——<b>没有设计方案不得施工</b>。</div>
` },
{ id:'f3', tab:'③消防法', grp:'📖 法律法规篇', canDone:true, title:'法律篇 · 《消防法》',
  law:'2021-04-29修正 · 责任人+单位职责+动火持证+产品材料',
  html: `
<div class="k"><span class="t">责任人：</span>单位<b>主要负责人</b>＝本单位<b>消防安全责任人</b>（第16条）。</div>
<div class="k"><span class="t">单位消防职责六项：</span>①落实责任制，制定消防制度+<b>灭火和应急疏散预案</b> ②按标准配设施器材并定期检查 ③<b>每年至少一次全面检查</b>，记录存档备查 ④保障消防通道、安全出口<b>畅通</b> ⑤防火检查 ⑥有针对性<b>演练</b>。</div>
<div class="k"><span class="t">特殊场景：</span>同一建筑物<b>两个以上单位</b>管理使用→明确各方责任＋确定责任人<b>统一管理</b>共用区域；物业服务企业维护<b>共用消防设施</b>。易燃易爆危险品场所<b>不得与居住场所同一建筑物</b>＋保持安全距离。动火作业→<b>办审批手续</b>＋消防安全措施；<b>电焊气焊人员和自动消防系统操作人员持证上岗</b>。禁止非法携带易燃易爆危险品进入公共场所、乘坐公共交通工具。</div>

{ id:'s1', tab:'⑦393号条例', canDone:true, title:'⑦ 《建设工程安全生产管理条例》',
  law:'国务院令第393号 · 2004-02-01施行 · 全文8章71条（总则5/建设单位6/勘察设计监理8/施工单位19/监督管理8/应急救援6/法律责任16/附则3）',
  html: `
<h3 class="blk" style="display:none"></h3>
<div class="big">这部条例管的是<b>「建工程时谁该干什么」</b>：建设单位出钱出资料、勘察设计保源头、监理盯方案查隐患、施工单位干活守规矩——四方各管一段，谁越位缺位谁挨罚。</div>

<div class="q">适用范围和「建设工程」指什么？</div>
<div class="k">境内从事建设工程的<b>新建、扩建、改建和拆除</b>等活动及安全监督管理必须遵守。建设工程 = <b>土木工程 + 建筑工程 + 线路管道和设备安装工程 + 装修工程</b>（通信工程就是「线路管道和设备安装」，<b>拆除也算在内，别放松</b>）。方针：<b>安全第一、预防为主</b>（393号只有八个字；加「综合治理」十二字的是新安法和51号令）。</div>

<h3>建设单位的责任（第6~11条）</h3>
<div class="q">建设单位要做什么、不能做什么？</div>
<div class="k"><ul>
<li><b>提供资料</b>：向施工单位提供毗邻区域内供水排水供电供气供热<b>通信</b>广播电视等<b>地下管线资料</b>、气象水文观测资料、相邻建筑物构筑物地下工程资料，保证<b>真实、准确、完整</b>。</li>
<li><b>两个不得</b>：不得提出不符合安全生产法律法规和<b>强制性标准</b>的要求；<b>不得压缩合同约定的工期</b>。</li>
<li><b>概算定钱</b>：编制概算时确定<b>安全作业环境及安全施工措施费</b>；不得<b>明示或暗示</b>购买指定厂家的不合格用具设备。</li>
<li><b>施工许可证</b>：申领时提供安全施工措施资料；批准开工报告的，<span class="big-num">15日内</span>报县级以上建设行政主管部门<b>备案</b>。</li>
<li><b>拆除工程</b>：发包给<b>有相应资质</b>的施工单位；施工 <span class="big-num">15日前</span> 报备案（四样：资质证明 / 危及毗邻说明 / 拆除施组方案 / 废弃物堆清措施）；爆破作业遵守民爆物品管理规定。</li>
</ul></div>
<div class="mn"><b>口诀：</b>建设单位管给钱、管合同、管资料；<span class="hide">两个15日——开工报告批后15日内备案、拆除施工前15日备案。</span></div>

<h3>勘察、设计、监理（第12~14条）</h3>
<div class="q">勘察、设计、监理各管什么？</div>
<div class="k"><ul>
<li><b>勘察</b>：按强制性标准勘察；文件<b>真实准确</b>；作业时保证<b>管线、设施和周边建筑物构筑物</b>安全。</li>
<li><b>设计</b>：按强制性标准设计；考虑施工安全操作和防护需要，重点部位环节<b>在设计文件中注明</b>并提防范指导意见；<b>四新+特殊结构</b>提出<b>两个建议</b>（保作业人员安全+预防事故措施）；对设计负责。</li>
<li><b>监理</b>：审查<b>施组中安全技术措施/专项方案</b>是否符合强制性标准；一般隐患→<b>要求整改</b>；严重→<b>要求暂停施工+报建设单位</b>；拒不整改/不停工→<b>报主管部门</b>。承担<b>监理责任</b>。</li>
</ul></div>
<div class="mn"><b>口诀：</b>设计「注明+指导意见+两个建议」；监理四步走：<span class="hide">审查→整改→停工报甲方→拒不服报主管部门。</span></div>

<h3>设备相关单位（第15~19条）</h3>
<div class="k"><ul>
<li><b>提供单位</b>：配齐有效<b>保险、限位</b>等安全装置。</li>
<li><b>出租单位</b>：设备要有<b>两证</b>（生产制造许可证+产品合格证）；签租赁协议时出具<b>检测合格证明</b>；禁止出租检测不合格的。</li>
<li><b>安拆单位</b>：起重机械、整体提升脚手架、模板等自升式架设设施安拆须<b>有资质</b>；<b>拆装方案+安全措施+专业技术人员现场监督</b>；完毕后<b>自检合格证明+安全使用说明+验收签字</b>。</li>
<li><b>检测机构</b>：到期必须经有资质机构检测，不合格不得用；出具<b>安全合格证明</b>并对结果负责。</li>
</ul></div>

<h3>施工单位（第20~38条，本章最重）</h3>
<div class="q">施工单位和两类负责人怎么定责？</div>
<div class="k"><ul>
<li>具备<b>注册资本、专业技术人员、技术装备、安全生产条件</b>，<b>资质等级许可范围内</b>承揽。</li>
<li><b>主要负责人</b>对本单位安全生产<b>全面负责</b>；建<b>责任制+教育培训制度</b>；<b>定期和专项</b>检查并记录。</li>
<li><b>项目负责人</b>须<b>执业资格</b>；对项目安全施工负责，<b>确保安全费有效使用</b>，及时如实报事故。</li>
<li><b>安全费专款专用</b>：用于防护用具设施<b>采购更新</b>、措施<b>落实</b>、条件<b>改善</b>，不得挪用。</li>
<li>设<b>安管机构+配专职安全员</b>：现场监督检查；隐患报<b>项目负责人和安管机构</b>；违章<b>立即制止</b>。</li>
</ul></div>

<div class="q">总分包怎么分担责任？（必考）</div>
<div class="k"><ul>
<li><b>总承包对施工现场安全生产负总责</b>；<b>自行完成主体结构施工</b>（不得分包）。</li>
<li>分包合同明确各自权利义务；总包分包对分包工程安全承担<b>连带责任</b>。</li>
<li>分包<b>服从</b>总包管理；<b>分包不服从管理致事故→分包担主要责任</b>。</li>
</ul></div>
<div class="mn"><b>口诀：</b>总包「负总责、干主体」；分包「要服从、不服自己担主责」；对外两家<span class="hide">「连带」。</span></div>

<div class="q">特种作业和专项施工方案？</div>
<div class="k"><ul>
<li><b>特种作业人员</b>（垂直运输机械、安拆、爆破、起重信号、登高架设等）须<b>特种作业操作资格证</b>上岗。</li>
<li>施组中编<b>安全技术措施+临时用电方案</b>；危大工程编<b>专项施工方案</b>附<b>安全验算结果</b>，经<b>施工单位技术负责人+总监理工程师</b>双签字实施，专职安全员现场监督。</li>
<li>危大七类：<b>基坑支护降水/土方开挖/模板/起重吊装/脚手架/拆除爆破/国务院规定的其他</b>；其中<b>深基坑、地下暗挖、高大模板</b>须<b>专家论证</b>。（坑深超3m属基坑；超5m为深基坑）</li>
</ul></div>
<div class="mn"><b>口诀：</b>危大七兄弟「<span class="hide">基坑降水、挖土、支模、吊装、脚手架、拆爆，其他国务院定</span>」；「深暗高」三兄弟加专家论证。</div>

<div class="q">安全交底怎么交？（高频对比点）</div>
<div class="k">施工<b>前</b>，<b>负责项目管理的技术人员</b>向<b>作业班组、作业人员</b>详细说明安全施工技术要求，<b>双方签字确认</b>。</div>
<div class="tip"><b>⚠ 对比：</b>393号是「<b>技术人员</b>」交底；51号新规是「<b>项目负责人组织</b>」。通信行业考试按新规答「项目负责人」（详见④）。</div>

<div class="q">现场管理硬要求？（第28~31条）</div>
<div class="k"><ul>
<li><b>警示标志</b>（须符合国家标准）设在：<b>入口、通道口、楼梯口、电梯井口、孔洞口、桥梁口、隧道口、基坑边沿、爆破物及有害气体液体存放处、起重机械、临时用电、脚手架</b>等危险部位。</li>
<li>按<b>施工阶段、环境、季节气候</b>变化采取措施；停工做好防护，费用<b>责任方</b>承担。</li>
<li><b>办公生活区与作业区分开+安全距离</b>；膳食饮水休息场所卫生达标；<b>未竣工建筑物内不得设集体宿舍</b>；装配式活动房要有<b>产品合格证</b>。</li>
<li>毗邻建筑、地下管线可能受损→<b>专项防护</b>；<b>市区内封闭围挡</b>。</li>
<li><b>消防</b>：责任制+责任人；用火用电易燃易爆制度规程；消防通道水源器材；<b>入口处明显标志</b>。</li>
<li><b>书面告知</b>危险岗位操作规程和违章危害；提供防护用具和服装。</li>
</ul></div>

<div class="q">作业人员三权利一义务？（第32、33条）</div>
<div class="k"><ul>
<li>对作业条件、程序、方式中的安全问题有<b>批评、检举、控告权</b>。</li>
<li>有权<b>拒绝违章指挥和强令冒险作业</b>。</li>
<li>紧急情况有权<b>立即停止作业</b>，或<b>采取必要应急措施后撤离</b>。</li>
<li>义务：遵守强制性标准和规程，正确使用防护用具设备。</li>
</ul></div>

<div class="q">设备查验、验收、登记时限？（第34、35条）</div>
<div class="k"><ul>
<li>采购租赁的用具设备要有<b>两证</b>，<b>进场前查验</b>；专人管理、定期检查维修保养、建<b>资料档案</b>、及时报废（国家实行淘汰制度）。</li>
<li>承租设备由<b>总包+分包+出租+安装四方共同验收</b>，合格方可用；特种设备验收前须经有资质机构<b>监督检验</b>。</li>
<li>验收合格 <span class="big-num">30日内</span> 向建设行政主管部门<b>登记</b>，标志置<b>设备显著位置</b>。</li>
</ul></div>

<div class="q">三类人员、培训、意外险？（第36~38条）</div>
<div class="k"><ul>
<li>三类人（主要负责人/项目负责人/专职安全员）经<b>建设行政主管部门</b>考核合格任职（考<b>安全知识+管理能力</b>）。</li>
<li>管理人员和作业人员<b>每年至少一次</b>教育培训，考核不合格不得上岗；<b>新岗位新现场</b>前培训；<b>四新</b>时培训。</li>
<li><b>意外伤害保险</b>：为<b>危险作业人员</b>办理；费用<b>施工单位付（总包时总包付）</b>；期限<b>开工之日起至竣工验收合格止</b>。</li>
</ul></div>

<h3>监督管理 + 应急救援（第39~51条）</h3>
<div class="k"><ul>
<li>应急部门系统→<b>综合监管</b>；建设行政主管部门→<b>行业监管</b>（铁路交通水利等专业工程归口各部门）。</li>
<li>发<b>施工许可证</b>时审查有无安全措施，<b>没有不发</b>，审查<b>不得收费</b>。</li>
<li>检查四权：调资料 / 进现场 / 纠违章 / 责令排除隐患；<b>重大隐患无法保证安全的→撤人、停工</b>。</li>
<li>严重危及施工安全的<b>工艺设备材料实行淘汰制度</b>。</li>
<li>预案：建设行政主管部门定<b>特大事故预案</b>；施工单位定<b>本单位预案</b>并演练；<b>总承包统一组织编制</b>施工现场预案，总分包各自建组织配器材，定期演练。</li>
<li>事故：<b>总承包负责上报</b>；防止扩大、<b>保护现场</b>；移动现场物品要<b>标记+书面记录</b>。</li>
</ul></div>

<h3>法律责任罚款表（数字必背）</h3>
<table class="t">
<tr><th>主体 / 行为</th><th>处罚</th></tr>
<tr><td>政府工作人员违规发证/不查处</td><td><b>降级或撤职</b></td></tr>
<tr><td>建设单位未提供安全费用</td><td>限期改；逾期<b>停止施工</b></td></tr>
<tr><td>建设单位：违标要求 / <b>压缩工期</b> / 拆除发包无资质</td><td><span class="big-num">20万~50万</span></td></tr>
<tr><td>勘察设计：未按强标 / 四新未提两个建议</td><td><span class="big-num">10万~30万</span>；严重降资质直至吊销</td></tr>
<tr><td>监理：未审查 / 隐患未处置 / 拒不服未报告 / 未按强标监理</td><td><span class="big-num">10万~30万</span>；严重降资质直至吊销</td></tr>
<tr><td>注册执业人员未执行强标</td><td>停执业<b>3个月~1年</b>；严重吊证<b>5年不予注册</b>；重大事故<b>终身不予注册</b></td></tr>
<tr><td>设备提供单位未配保险限位</td><td><b>合同价款1~3倍</b></td></tr>
<tr><td>出租未检测/不合格设备</td><td><span class="big-num">5万~10万</span></td></tr>
<tr><td>安拆：无方案/无现场监督/假证明/未移交</td><td><span class="big-num">5万~10万</span>；严重降资质直至吊销</td></tr>
<tr class="hl"><td>施工单位<b>挪用安全费</b></td><td>罚<b>挪用额20%~50%</b></td></tr>
<tr><td>未交底/未围挡/未竣工楼设宿舍/临建不合格/无专项防护</td><td><span class="big-num">5万~10万</span></td></tr>
<tr><td>用具未查验即用 / 委托无资质安拆 / 未编方案</td><td><span class="big-num">10万~30万</span></td></tr>
<tr><td>主要负责人/项目负责人未履职（不够刑事）</td><td><span class="big-num">2万~20万</span>；<b>5年内不得担任任何施工单位负责人</b></td></tr>
</table>
<div class="mn"><b>罚款口诀：</b><span class="hide">建设50，设监30，出租拆装10，设备1-3倍，挪用两到五成，未交底不围挡5-10，未查验乱委托10-30，负责人2-20加5年禁任。</span></div>
<div class="why"><b>为什么这么设计：</b>注册执业人员（建筑师等）签字即担责，处罚走「资格罚」而非单纯罚款——停执业资格比罚钱更疼。</div>
` },

{ id:'s2', tab:'⑧708号应急条例', canDone:true, title:'⑧ 《生产安全事故应急条例》',
  law:'国务院令第708号 · 2019-04-01施行 · 管两件事：应急准备 + 应急救援',
  html: `
<div class="big">这部条例管的是<b>「事故来之前 ready 不 ready」</b>：预案要编、队伍要练、器材要养、现场要有人统一指挥。</div>

<div class="q">谁对应急工作负责？（第4条）</div>
<div class="k">生产经营单位建立健全应急工作<b>责任制</b>，<b>主要负责人对本单位应急工作全面负责</b>。国务院统一领导全国，县级以上地方政府统一领导本行政区域。</div>

<div class="q">预案怎么定、给谁看？（第5、7条）</div>
<div class="k"><ul>
<li>都从<b>风险辨识和评估</b>做起。</li>
<li>政府预案→<b>向社会公布</b>；生产经营单位预案→<b>向从业人员公布</b>。</li>
<li>预案要有<b>科学性、针对性、可操作性</b>。</li>
<li>高危单位（危险物品、矿山、金属冶炼、城轨运营、<b>建筑施工</b>、人员密集场所）预案报<b>县级以上安监职责部门备案</b>并向社会公布。</li>
</ul></div>

<div class="q">什么情况必须修订预案？（第6条）</div>
<div class="k">五种情形＋兜底：①依据的<b>法规标准</b>重大变化 ②<b>指挥机构及职责</b>调整 ③<b>风险</b>重大变化 ④<b>重要应急资源</b>重大变化 ⑤<b>演练或救援中发现</b>重大问题 ⑥其他。</div>
<div class="mn"><b>口诀：</b><span class="hide">「法变、队变、险变、资源变、演练发现问题」——五变必修订。</span></div>

<div class="q">演练频次？（第8条，高频数字题）</div>
<table class="t">
<tr><th>谁</th><th>多久一次</th><th>额外要求</th></tr>
<tr><td>县级以上政府+安监部门+乡镇街道</td><td class="c"><b>至少每2年1次</b></td><td>—</td></tr>
<tr><td>高危单位（含建筑施工）</td><td class="c"><b>至少每半年1次</b></td><td>演练情况<b>报送</b>县级以上安监职责部门；部门<b>抽查</b>，不合格责令限期改正</td></tr>
</table>

<div class="q">队伍、物资、值班制度？（第10、13、14条）</div>
<div class="k"><ul>
<li>高危单位应<b>建应急救援队伍</b>；小微企业可不建但<b>指定兼职应急救援人员</b>，可与邻近队伍<b>签救援协议</b>；园区可<b>联合建</b>。</li>
<li>救援人员<b>培训合格</b>方可参加救援；配备装备物资并定期训练。</li>
<li>高危单位配备<b>灭火、排水、通风</b>及危险物品<b>稀释掩埋收集</b>等器材设备物资，<b>经常性维护保养</b>。</li>
<li><b>应急值班制度</b>三类单位：①政府及安监部门 ②危险物品单位+矿山冶炼城轨<b>建筑施工</b> ③救援队伍。</li>
<li><b>规模较大、危险性较高</b>的危险物品单位：成立<b>应急处置技术组</b>，<span class="big-num">24小时</span>应急值班。</li>
</ul></div>

<div class="q">事故发生后单位要做哪几件事？（第17条，案例题常客）</div>
<div class="k"><b>立即启动预案</b>并报告，同时：①<b>迅速控制危险源，组织抢救遇险人员</b> ②组织<b>现场人员撤离</b>（或采取可能的应急措施后撤离）③<b>及时通知可能受影响的单位和人员</b> ④防止危害扩大和<b>次生衍生</b>灾害 ⑤必要时<b>请求邻近救援队伍</b>并提供技术资料 ⑥<b>维护现场秩序、保护现场和证据</b> ⑦其他法定措施。<br>救援费用由<b>事故责任单位</b>承担；无力承担的由政府协调（第19条）。</div>
<div class="mn"><b>口诀：</b><span class="hide">「控源救人、撤人通知、防灾求援、护场保证」——六件事一个不落。</span></div>

<div class="q">现场指挥谁说了算？</div>
<div class="k">政府认为必要可设<b>现场指挥部</b>并指定总指挥；<b>总指挥负责制</b>；参加救援的单位和个人<b>服从统一指挥</b>（第20、21条）。</div>

<div class="q">违反应急条例怎么罚？（第30~32条）</div>
<div class="k"><ul>
<li>没预案 / 没定期演练 / 没应急培训 / 负责人事故时不立即抢救 → <b>依《安全生产法》追究</b>。</li>
<li>器材没经常性维护致严重后果 / 事故后未立即采取应急措施 → <b>依《突发事件应对法》追究</b>。</li>
<li>预案<b>未备案</b>、未建<b>值班制度</b>或未配值班人员 → 限期改；逾期：单位 <span class="big-num">3万~5万</span>，直接责任人员 <span class="big-num">1万~2万</span>。</li>
</ul></div>
<div class="mn"><b>口诀：</b><span class="hide">没预案没演练没培训——找安法；没保养没应急——找突发事件应对法；没备案没值班——3到5万、个人1到2万。</span></div>
` },

{ id:'s3', tab:'⑨493号事故报告', canDone:true, title:'⑨ 《生产安全事故报告和调查处理条例》',
  law:'国务院令第493号 · 2007-06-01施行 · 全书数字最密集的一部',
  html: `
<div class="big">这部条例管的是<b>「出了事怎么报、怎么查、怎么罚」</b>：先分大小（四级）→ 再按时限报（立即/1小时/2小时）→ 按级别查（国省市县）→ 按档次罚。</div>

<div class="q">事故分几级？（第3条，必考中的必考）</div>
<table class="t">
<tr><th>等级</th><th class="c">死亡</th><th class="c">重伤（含急性工业中毒）</th><th class="c">直接经济损失</th></tr>
<tr><td><b>一般</b></td><td class="c">&lt;3人</td><td class="c">&lt;10人</td><td class="c">&lt;1000万</td></tr>
<tr><td><b>较大</b></td><td class="c">3~10人</td><td class="c">10~50人</td><td class="c">1000万~5000万</td></tr>
<tr><td><b>重大</b></td><td class="c">10~30人</td><td class="c">50~100人</td><td class="c">5000万~1亿</td></tr>
<tr><td><b>特别重大</b></td><td class="c">≥30人</td><td class="c">≥100人</td><td class="c">≥1亿</td></tr>
</table>
<div class="k"><b>「以上」包括本数，「以下」不包括本数</b>；三条线取最重。</div>
<div class="mn"><b>口诀：</b><span class="hide">「313、151、151」——死亡3-10-30，重伤10-50-100，钱1000万-5000万-1亿，三行全是往右翻倍涨。</span></div>

<div class="q">报告总要求和调查原则？（第4条）</div>
<div class="k">报告<b>及时、准确、完整</b>，不得<b>迟报、漏报、谎报、瞒报</b>；调查处理坚持<b>实事求是、尊重科学</b>。</div>
<div class="tip"><b>⚠ 四个「报」辨析：</b>迟报=超时限；漏报=过失漏内容；谎报=故意不如实；瞒报=干脆不报。</div>

<div class="q">报告链条和时限？（第9~11条，必考）</div>
<div class="k"><ul>
<li>现场人员<b>立即</b>报本单位负责人。</li>
<li>负责人 <span class="big-num">1小时内</span> 报<b>事故发生地县级以上安监部门和负有安监职责的有关部门</b>。</li>
<li>紧急时现场人员可<b>越级直报</b>。</li>
<li>安监系统逐级上报<b>每级不超2小时</b>；特大重大→国务院安监部门；较大→省级；一般→市级。</li>
</ul></div>
<div class="mn"><b>口诀：</b><span class="hide">「现场立即、负责人1小时、每级2小时；紧急可越级」。通信行业加一路见④。</span></div>

<div class="q">报告内容六项？（第12条）</div>
<div class="k">①单位概况 ②时间地点现场情况 ③<b>简要经过</b> ④已造成或可能造成的<b>伤亡人数（含下落不明）</b>和<b>初步估计的直接经济损失</b> ⑤已采取措施 ⑥其他。<b>有啥报啥，不脑补。</b></div>

<div class="q">伤亡人数变化怎么办？（第13、20条）</div>
<div class="k"> <span class="big-num">30日内</span> 补报；<b>道路交通、火灾事故7日内</b>。等级变化的，上级政府可<b>另行组织调查组</b>。</div>
<div class="why"><b>为什么30日/7日：</b>伤员可能抢救无效死亡，30日内伤情变化要补报升级；交通事故和火灾处置快结论早，只有7日。</div>

<div class="q">负责人接报先做什么？现场怎么保护？（第14、16条）</div>
<div class="k"><b>立即启动应急预案</b>或采取有效措施组织抢救；妥善保护<b>现场和证据</b>；因抢救/防扩大/疏交通需移动物件的：<b>做标志、绘制现场简图、书面记录</b>，保存痕迹物证。</div>

<div class="q">谁来组织调查？（第19~21条，必考）</div>
<table class="t">
<tr><th>等级</th><th>负责调查（事故发生地）</th></tr>
<tr><td>特别重大</td><td class="c"><b>国务院</b>或授权部门</td></tr>
<tr><td>重大</td><td class="c"><b>省级</b>政府</td></tr>
<tr><td>较大</td><td class="c"><b>设区的市级</b>政府</td></tr>
<tr><td>一般</td><td class="c"><b>县级</b>政府</td></tr>
</table>
<div class="k"><ul>
<li>可直接组织或<b>授权委托有关部门</b>组织调查组；<b>无伤亡的一般事故，县级可委托事故单位自查</b>。</li>
<li>上级政府认为必要时可调查下级负责的事故。</li>
<li>跨区域：由<b>事故发生地</b>政府负责调查，<b>单位所在地</b>政府<b>派人参加</b>。</li>
</ul></div>
<div class="mn"><b>口诀：</b><span class="hide">「特国、重省、较市、一般县」；出事地方管调查，单位老家来人陪。</span></div>

<div class="q">调查组和时限规矩？（第26、29、32条）</div>
<div class="k"><ul>
<li>调查组有权了解情况、调资料，<b>不得拒绝</b>；单位负责人和有关人员调查期间<b>不得擅离职守</b>；涉嫌犯罪<b>移交司法机关</b>。</li>
<li>提交调查报告：<b>事发起60日内</b>，可延长<b>最长60日</b>；技术鉴定时间<b>不计入</b>。</li>
<li>批复：重大较大一般=<b>收到报告15日内</b>；特别重大=<b>30日内</b>，可延长不超30日（最长60日）。</li>
</ul></div>

<div class="q">四张罚款表（第35~38条，数字必背）</div>
<table class="t">

<tr><td><b>36条</b> 单位+个人</td><td><b>谎报瞒报</b> / 伪造破坏现场 / 转移资金销毁证据 / 拒绝调查 / 伪证 / <b>逃匿</b></td><td>单位 <span class="big-num">100万~500万</span>；个人上年收入 <span class="big-num">60%~100%</span></td></tr>
</table>
<table class="t">
<tr><th>37条 对有责任的单位</th><th>罚款</th><th>38条 主要负责人未履职</th><th>年收入比例</th></tr>
<tr><td>一般</td><td class="c">10万~20万</td><td>一般</td><td class="c">30%</td></tr>
<tr><td>较大</td><td class="c">20万~50万</td><td>较大</td><td class="c">40%</td></tr>
<tr><td>重大</td><td class="c">50万~200万</td><td>重大</td><td class="c">60%</td></tr>
<tr><td>特别重大</td><td class="c">200万~500万</td><td>特别重大</td><td class="c">80%</td></tr>
</table>
<div class="k">另（第40条）：主要负责人受<b>刑事处罚或撤职</b>的，<b>5年内不得担任任何生产经营单位主要负责人</b>。</div>
<div class="mn"><b>口诀：</b><span class="hide">抢救迟漏擅离职守4到8成；谎报瞒报造假逃——单位100到500万、个人6到10成；单位罚款「10-20、20-50、50-200、200-500」；个人「30%、40%、60%、80%」。</span></div>
<div class="tip"><b>⚠ 口径提醒（2024新规已改线）：</b>第三章题库第87题「擅离职守」答<b>80%~100%</b>是旧规定口径；条例原文35条是<b>40%~80%</b>；<b>2024新罚款处罚规定改为60%~80%起</b>（贻误抢救/扩大才升80%~100%，漏报40%~60%起）。考试以新教材为准，详见上方「③⁺处罚罚款」。</div>

{ id:'s3b', tab:'⑩处罚罚款', canDone:true, title:'⑩ 《安全生产违法行为行政处罚办法》 & 《生产安全事故罚款处罚规定》',
  law:'处罚办法：2025-11-27公布 · 2026-02-01施行（新教材最新版）｜ 罚款处罚规定：2024-01-10公布 · 2024-03-01施行 · 法规篇第三章第五、六节（9/8 课堂）',
  html: `
<div class="big">这两部是法规篇的收官：<b>处罚办法</b>管「违法之后怎么罚」的程序（谁能罚、罚什么、简易还是普通、怎么送达、怎么执行）；<b>罚款处罚规定</b>是493号条例罚款的「放大镜」——把四档事故罚款按死亡人数/重伤/损失再细分三小档，把个人罚款比例重新划线。全部是新教材新数字。</div>

<h3>一、行政处罚办法：谁能罚、罚什么</h3>
<div class="q">处罚主体和当事人权利？</div>
<div class="k"><ul>
<li>由<b>县级以上人民政府应急管理部门</b>（安全生产监督管理部门）对生产经营单位和有关人员的违法行为实施行政处罚。</li>
<li>当事人享有<b>陈述权、申辩权、听证权</b>；不服处罚可申请<b>行政复议</b>或提起<b>行政诉讼</b>；因违法处罚受损有权依法申请<b>国家赔偿</b>。<b>不得因当事人申辩而加重处罚</b>。</li>
<li>处罚种类：通报批评/警告、罚款、没收违法所得、<b>暂扣或吊销证照/撤销有关职业资格</b>、责令停产停业、行政拘留等。</li>
<li>拓展（旧教材内容，了解）：暂扣或吊销许可证由<b>发证机关</b>决定；暂扣期限一般<b>不超过6个月</b>。</li>
</ul></div>

<div class="q">程序数字串（必背）？</div>
<div class="k"><ul>
<li>执法须<b>两名以上</b>具有行政执法资格的人员；执法人员与案件有利害关系应<b>回避</b>（做出回避决定前<b>不停止调查</b>）。</li>
<li>收到<b>行政处罚告知书</b>之日起 <span class="big-num">5日内</span> 可陈述申辩或要求听证，逾期视为放弃。</li>
<li>证据八类：<b>书证、物证、视听资料、电子数据、证人证言、当事人陈述、鉴定意见、勘验笔录</b>（现场笔录）。</li>
<li><b>重大事故隐患</b>排除后，须经应急管理部门<b>审查同意</b>方可恢复施工；责令停产停业一般<b>不超过6个月</b>。</li>
<li><b>查封扣押≤30日</b>；情况复杂经负责人批准可延长30日（<b>最长60日</b>）；延长的须<b>书面</b>告知当事人并说明理由。</li>
<li>停电停水等强制措施：本部门<b>主要负责人批准</b>；除紧急情形外<b>提前24小时</b>书面通知；隐患消除及时解除。</li>
<li><b>限期整改延期</b>：边整改边申请；期限届满<b>前10日内</b>提出延期申请；部门收到后<b>5日内书面答复</b>；届满或收到复查申请后<b>10日内</b>复查，复查意见书<b>双方签名</b>归档。</li>
<li>保密义务：国家秘密、<b>商业秘密</b>、个人隐私。</li>
</ul></div>

<div class="q">简易程序（当场处罚）的条件和要求？</div>
<div class="k">违法事实确凿并有法定证据，对<b>个人处200元以下</b>、对<b>单位处3000元以下</b>罚款或警告的，可<b>当场</b>做出处罚。要求：出示<b>执法证件</b>；填写<b>预定格式、编有号码</b>的处罚决定书（载明违法行为、种类依据、数额、时间地点、复议诉讼途径期限、部门名称）；执法人员<b>签名或盖章</b>；<span class="big-num">5日内</span>报所属应急管理部门<b>备案</b>。</div>

<div class="q">立案、调查、听证的时限？</div>
<div class="k"><ul>
<li><b>立案</b>：5日内决定是否立案；复杂经负责人批准可延长<b>不超过5日</b>（合计≤10日）；<b>事故类</b>行政处罚在收到事故调查报告<b>批复之日起5日内</b>立案。</li>
<li><b>调查检查</b>：主动出示执法证件——<b>不出示的有权拒绝</b>；询问/检查做笔录（时间地点+情况，双方签名盖章，拒签的注明并由执法人员签名）；勘验要<b>通知当事人到场</b>，无法到场邀请有关人员<b>见证</b>、注明原因、可录音录像。</li>
<li><b>听证</b>：告知后<b>5日内</b>提出要求→部门<b>15日内</b>举行→举行<b>7日前</b>通知时间地点；正当理由可延期但<b>只能延期一次</b>；无正当理由缺席或中途退出=<b>放弃</b>；<b>公开举行</b>（涉密除外）。</li>
</ul></div>

<div class="q">怎么算「送达」？</div>
<div class="k"><ul>
<li><b>送达回证</b>：签收日期=送达日期；经当事人同意签确认书的，可<b>传真、电子邮件</b>送达（到达受送达人<b>特定系统的日期</b>为送达日期）。</li>
<li>决定书宣告后<b>当场交付</b>；当事人不在场的 <span class="big-num">7日内</span> 送达。</li>
<li>直接送达：公民本人不在可交<b>同住成年家属</b>签收（注明关系）；法人由<b>法定代表人或负责人</b>或指定代收人签收。</li>
<li>邮寄送达以<b>回执收件日期</b>为准；也可委托送达。</li>
<li><b>拒收</b>：回证记明事由日期+见证人签章+决定书<b>留置住所</b>，可拍照录像取证。</li>
<li><b>下落不明</b>：公告送达，<b>发出满30日</b>视为送达，案卷记明原因经过。</li>
</ul></div>

<div class="q">处罚的适用与执行？</div>
<div class="k"><ul>
<li>实施处罚同时<b>责令改正</b>；适用<b>违法行为发生时</b>的法律法规，但新规定处罚较轻或不认为违法的<b>适用新规定</b>（从旧兼从轻）。</li>
<li><b>同一违法行为不得给予两次以上罚款</b>；一个行为违反多个法规的按<b>数额高的</b>规定处罚。</li>
<li>逾期不缴纳罚款：<b>每日按罚款数额3%</b>加处罚款，但<b>加处不超出罚款数额本身</b>；可拍卖查封扣押物、划拨存款抵缴。</li>
<li>申请<b>复议或诉讼期间不停止执行</b>，但<b>加处罚款在此期间不予计算</b>。</li>
<li>当场收缴罚款：执法人员<b>2日内</b>交所属部门；部门<b>2日内</b>缴付指定银行。</li>
</ul></div>
<div class="mn"><b>口诀：</b><span class="hide">两人执法要亮证，五日申辩五日听；查封三十加三十，停电停水提前一天整；简易二百三千整，立案五日加五日；听证五十五七前，延期只能批一回；送达当场七日到，公告三十才算达；三日加罚不翻倍，两日两日缴银行。</span></div>

<h3>二、罚款处罚规定（2024版，新线必背）</h3>
<div class="q">「四报」的准确定义？（第5条）</div>
<div class="k"><b>迟报</b>=报告超过规定时限；<b>漏报</b>=因<b>过失</b>应当上报的事故或时间地点类别伤亡人数损失等内容遗漏未报；<b>谎报</b>=<b>故意</b>不如实报告；<b>瞒报</b>=事故已发生、超过规定时限未报，经查证属实的。<br>
跨区域事故由<b>事故发生地</b>应急管理部门实施行政处罚。</div>

<div class="q">主要负责人的罚款线（2024新规）？</div>
<div class="k"><table class="t">
<tr><th>情形</th><th>处上年收入</th></tr>
<tr><td><b>不立即组织抢救 / 擅离职守 / 瞒报谎报迟报 / 逃匿</b></td><td class="c"><span class="big-num">60%~80%</span></td></tr>
<tr><td>上述行为<b>贻误事故抢救或造成事故扩大</b>的</td><td class="c"><b>80%~100%</b></td></tr>
<tr><td><b>漏报</b>事故</td><td class="c">40%~60%</td></tr>
<tr><td>漏报<b>贻误抢救或扩大</b>的</td><td class="c">60%~80%</td></tr>
<tr><td><b>伪造破坏现场 / 转移隐匿资金 / 销毁证据 / 伪证</b></td><td class="c">60%~80%</td></tr>
<tr><td>上述情节严重（贻误抢救等）</td><td class="c">80%~100%</td></tr>
<tr><td><b>直接负责的主管人员和其他直接责任人员</b></td><td class="c">60%~80%（严重80%~100%）</td></tr>
</table></div>
<div class="tip"><b>⚠ 新旧口径（重点！）：</b>第三章题库第87题「擅离职守80%~100%」是<b>旧规定口径</b>；2024新罚款处罚规定=<b>60%~80%起</b>（贻误抢救/扩大才升80%~100%），漏报更是降到40%~60%。<b>考试以新教材为准背新线</b>，刷到旧题知道答案过时即可。</div>

<div class="q">对事故单位的罚款：每档再分三小档（第13、14条）？</div>
<table class="t">
<tr><th>事故档</th><th>细分依据（死亡 / 重伤 / 损失）</th><th>罚款三小档</th></tr>
<tr><td><b>一般事故</b></td><td>死亡&lt;1 / 1 / 2人；重伤3~6 / 6~10；损失&lt;300 / 300~500 / 500~1000万</td><td class="c"><b>30~50万 / 50~70万 / 70~100万</b></td></tr>
<tr><td><b>较大事故</b></td><td>死亡3~5 / 5~7 / 7~10人；重伤10~20 / 20~30 / 30~50；损失1000~2000 / 2000~3000 / 3000~5000万</td><td class="c"><b>100~120万 / 120~150万 / 150~200万</b></td></tr>
<tr><td><b>重大事故</b></td><td>死亡10~15 / 15~20 / 20~30人；重伤50~70 / 70~90 / 90~100；损失5000~6000 / 6000~8000万 / 8000万~1亿</td><td class="c"><b>200~400万 / 400~600万 / 600~1000万</b></td></tr>
<tr><td><b>特别重大</b></td><td>死亡30~40 / 40~50 / 50+人；重伤100~120 / 120~150 / 150+；损失1~1.5亿 / 1.5~2亿 / 2亿+</td><td class="c"><b>1000~1200万 / 1200~1500万 / 1500~2000万</b></td></tr>
</table>
<div class="k"><b>情节特别恶劣</b>（关闭破坏安全生产设施 / 拒不执行停产停业指令 / 未经批准擅自高危作业 / 拒绝阻碍执法 / <b>明知有重大事故隐患仍冒险组织作业</b>等）→ 对单位处罚款 <span class="big-num">2倍以上5倍以下</span>。</div>

<div class="q">个人罚款的三张线？（第19~21条）</div>
<div class="k"><ul>
<li><b>主要负责人</b>未依法履职导致事故（安法95条）：一般<b>40%</b>、较大<b>60%</b>、重大<b>80%</b>、特别重大<b>100%</b>——口诀<span class="hide">「四六八一百」</span>。</li>
<li><b>其他负责人和安全生产管理人员</b>（96条细化）：20%~30% / 30%~40% / 40%~50% / 最高<b>50%</b>；<b>未发生事故</b>的处<b>1万~3万</b>罚款。</li>
<li><b>个人经营的投资人</b>（未保证资金投入致事故）：按事故等级处 <span class="big-num">2万~5万 / 5万~10万 / 10万~15万 / 15万~20万</span>——5万一个台阶。</li>
</ul></div>
<div class="mn"><b>口诀：</b><span class="hide">负责人「四六八一百」；其他负责人「二三四五成」；个人投资人「五十五十五二十」；单位罚款「一般三十七百、较大一百二百、重大二百一千、特大一千二千」再按人头发伤损失分三小档。</span></div>
` },

{ id:'s4', tab:'⑪51号新规', canDone:true, title:'⑪ 《通信建设工程安全生产管理规定》',
  law:'工信部2025年第51号 · 2025-05-01施行 · 教材全文引用 · 新教材核心变化',
  html: `
<div class="big">这是我们通信行业的<b>自家规定</b>，2025年刚修订：理念上「人民至上生命至上」，机制上「三必须」，责任上五方主体+安全费<b>全程管到死</b>（计列→支付→提取→使用→监督）。</div>

<div class="q">总纲：理念、方针、原则？</div>
<div class="k"><ul>
<li><b>人民至上、生命至上</b>，树牢安全发展理念，从<b>源头</b>防范化解重大安全风险。</li>
<li>方针：<b>安全第一、预防为主、综合治理</b>（十二字！393号只有八字）。</li>
<li><b>三必须</b>：管行业必须管安全、管业务必须管安全、管生产经营必须管安全。</li>
<li>适用：境内<b>公用电信网</b>新建扩建改建及配套设施建设；机房、钢塔桅等专业建设和拆除也适用。</li>
<li>责任主体：建设、勘察、设计、施工、监理单位；执行<b>国标+行标</b>；建<b>安全生产责任制</b>（责任人员、责任范围、考核标准）。</li>
</ul></div>

<div class="q">建设单位的责任？</div>
<div class="k"><ul>
<li>建安全管理制度，制定<b>应急预案并定期演练</b>。</li>
<li>概预算一旦明确<b>安全费不得打折、单独计列</b>；合同明确<b>支付方式数额时限</b>；特殊要求增加的要<b>单列</b>。</li>
<li><b>开工前</b>明确各相关单位安全生产责任。</li>
<li>不得违规<b>压缩工期</b>；不得明示暗示采购指定设备。</li>
</ul></div>

<div class="q">勘察设计单位的责任？</div>
<div class="k"><ul>
<li>勘察文件<b>真实准确</b>；作业保证管线设施建筑物安全。</li>
<li><b>设计交底环节</b>向施工单位<b>详细说明安全风险防范措施</b>。</li>
<li><b>四新</b>工程提出<b>两个保障</b>（作业人员安全+预防事故）。</li>
<li>编概预算<b>全额</b>计列安全费。</li>
</ul></div>

<div class="q">施工单位的责任？（重点背🔥新增项）</div>
<div class="k"><ul>
<li>设安管机构配专职安全员；制定规章制度和<b>各专业操作规范</b>；按要求制定<b>现场处置方案</b>。</li>
<li><b>项目负责人对安全施工负责</b>，确保安全费有效使用。</li>
<li>教育培训<b>每年至少一次</b>，合格才上岗，建<b>培训档案</b>（时间内容人员考核）；<b>两新</b>（新岗位新现场）<b>四新</b>（技术工艺材料设备）必训；<b>被派遣劳动者纳入统一管理</b>。</li>
<li>三类人经<b>通信主管部门</b>考核持证上岗；<b>特种作业100%持证</b>。</li>
<li><span class="fire">🔥新增</span> 开工前<b>关键岗位人员</b>与约定不一致→须<b>建设单位书面同意</b>。关键岗位=项目负责人、技术负责人、质量/安全管理人员、施工管理负责人、特种作业和危险作业人员。</li>
<li><span class="fire">🔥新增</span> 与分包单位签<b>安全生产协议</b>，督促其培训，规范关键岗位变更。</li>
<li>严格按<b>强制性标准和操作规范</b>施工。</li>
<li><span class="fire">🔥新增</span> <b>项目负责人组织安全技术交底</b>：对象=<b>全体班组和作业人员</b>；内容=重点部位环节+技术要求措施；<b>双方签字</b>。</li>
<li><span class="fire">🔥新增</span> 按国家规定配<b>项目专职安全员</b>；专职安全员<b>每天</b>现场检查，隐患报项目负责人和安管机构，违章<b>立即制止</b>。</li>
<li>保证资金投入；机具和防护装备<b>进场前查验</b>；监督佩戴劳保；<b>书面告知</b>操作规程和违章危害。</li>
<li><b>有限空间、动火、高处、带电</b>作业配<b>报警仪、消防器材、防护绳、防触电</b>等器具；防护装备专人管理定期维护建档案。</li>
<li>各「口」和临电起重机械设<b>符合国标的警示标志</b>；建现场<b>消防责任制</b>，入口设标志。</li>
<li><span class="fire">🔥新增</span> <b>有限空间</b>：<b>审批制度</b>严禁擅自进入；<b>先通风、再检测、后作业</b>；配防中毒窒息装备设警示标志；<b>监护人员全程监护</b>、保持联络、不得离开现场或进入；制定应急措施，<b>严禁盲目施救</b>。</li>
<li><span class="fire">🔥新增</span> <b>动火作业</b>严格<b>审批</b>、配现场消防器材、定应急措施；<b>危险作业</b>安排<b>专门人员现场安全管理</b>。</li>
<li>建<b>风险分级管控</b>制度；建<b>隐患排查治理</b>制度（如实记录并向<b>从业人员通报</b>）；<span class="fire">🔥新增</span> <b>重大隐患</b>排查治理报<b>工程所在地省通管局+职工大会（职代会）</b>。</li>
<li>应急预案向从业人员公布，<b>每半年至少演练一次</b>。</li>
<li>依法办安全生产相关保险，<b>未办理不得从事危险作业</b>。</li>
<li>作业人员有<b>批评检举控告权</b>、拒绝违章指挥和强令冒险作业权。</li>
</ul></div>
<div class="mn"><b>有限空间口诀：</b><span class="hide">「先通风、再检测、后作业；审批不能少、监护全程守、盲目施救要人命。」</span></div>

<div class="q">总分包和监理的责任？</div>
<div class="k"><ul>
<li><b>总包对现场安全生产负总责</b>；<span class="fire">🔥新增</span> <b>总包项目负责人定期考核分包安全管理情况</b>。</li>
<li>分包服从总包管理，建<b>生产协作机制</b>，对分包工程安全承担<b>主要责任</b>（总包连带）。</li>
<li><b>监理</b>：建监理人员培训制度（<b>主要负责人、总监、专业监理工程师、监理员、安全监理人员</b>考试合格上岗）；编含安全内容的<b>监理规划和实施细则</b>；配<b>安全监理人员</b>；审查措施方案是否符合强标并督促落实；<b>核验作业人员上岗资格</b>（人证匹配）；<b>巡视检查</b>；隐患立即整改；严重<b>暂停施工</b>并<b>信息化或书面报建设单位</b>；拒不整改<b>书面报通管局</b>。</li>
</ul></div>

<div class="q">通信工程事故报告链（51号特色，必背）？</div>
<div class="k"><ul>
<li>现场人员<b>立即</b>报本单位负责人。</li>
<li>负责人 <span class="big-num">1小时内</span> 报<b>县级以上安监职责部门+省通管局</b>；特殊情况可越级。</li>
<li><span class="fire">🔥新增</span> 现场<b>无建设单位人员</b>时：施工单位<b>立刻告知建设单位</b>→由<b>建设单位报通管局</b>。</li>
<li>接报后<b>立即启动应急预案</b>。</li>
<li><b>较大及以上</b>：通管局 <span class="big-num">2小时内</span> 报工信部。</li>
<li><b>一般事故</b>：通管局按月汇总，<b>每月初5个工作日内</b>书面报工信部。</li>
<li>通管局配抢救、参调查、监督处理落实并报工信部；公布举报电话信箱；<b>涉死亡举报转县级以上政府</b>处理。</li>
</ul></div>
<div class="mn"><b>口诀：</b><span class="hide">「现场立即、老板1小时（安监+省通管）、通管2小时报工信部（较大起）、一般按月5个工作日；没人在场告诉甲方、甲方去报通管局。」</span></div>

<div class="q">通信主管部门查什么、有什么权？</div>
<div class="k">查：标准规范落实、隐患台账、安全费<b>足额计列支付</b>、机构和责任制、演练、装备配备、专款专用、教育培训、交底、<b>持证上岗</b>。权：调资料、进现场<b>拍照录像</b>、询问、当场纠正违章、责令排除隐患；重大隐患不安全→<b>撤人</b>（必要时停工）。</div>

<h3>安全生产费专题（2022年新规）</h3>
<div class="k"><ul>
<li><b>定义</b>：按规定标准提取、<b>成本费用列支</b>、专门用于完善改进<b>安全生产条件</b>的资金。</li>
<li><b>提取标准</b>：<span class="big-num">2%</span>（2022年新标准；2012年旧标准1.5%）。</li>
<li><b>管理原则</b>：<b>筹措有章、支出有据、管理有序、监督有效</b>。</li>
<li>专项核算专款专用；<b>年度赤字年末补齐</b>。</li>
<li>招标<b>不得竞争性报价</b>；投标<b>包含并单列</b>，竞标不得删减。</li>
<li><span class="fire">2022新规</span> 建设单位<b>开工日1个月内</b>付<b>≥50%</b>；总包对分包同样<b>1个月内付≥50%</b>且<b>直接支付+监督使用</b>；<b>分包不重复提取</b>。</li>
<li><b>结算后结余退回建设单位</b>。</li>
<li>使用范围（含新增）：防护设施用具、应急演练救援、宣传教育培训、<span class="fire">🔥风险分级管控+隐患排查整改</span>、<span class="fire">🔥信息化建设运维+网络安全</span>、<span class="fire">🔥隐患报告奖励</span>、<span class="fire">🔥安责险</span>等。</li>
</ul></div>
<div class="mn"><b>口诀：</b><span class="hide">「提2%、月内付一半、招标不砍价、报价要单列、赤字年底补、结余还甲方、总包直付分包、分包不再提」。</span></div>
<div class="tip"><b>⚠ 结余两问两答：</b>「<b>施工单位年度提取</b>有结余」→结转下一年继续用于安全（企业层面）；「<b>工程结算后</b>有结余」→退回建设单位（项目层面）。</div>
` },

{ id:'s5', tab:'⑫255号考核', canDone:true, title:'⑫ 《通信工程施工企业安管人员安全生产考核管理规定》',
  law:'工信部通信〔2016〕255号 · 2016-09-05施行 · 替代2005年398号 · 管三类「安管人员」A/B/C证',
  html: `
<div class="big">管的是<b>「什么人能当安全官」</b>：A证管企业（主要负责人）、B证管项目（负责人）、C证管现场（专职安全员）——考证条件、证书寿命、日常责任、怎么被监督，全在这。</div>

<div class="q">三类人怎么定义？（第3条，定义题必考）</div>
<div class="k"><ul>
<li><b>企业主要负责人（A）</b>：对企业生产经营和安全有<b>决策权</b>的领导——法定代表人、总经理（总裁）、分管安全生产副总、分管生产经营副总、<b>技术负责人、安全总监</b>等。</li>
<li><b>项目负责人（B）</b>：<b>企业法定代表人授权</b>，负责具体工程项目管理。</li>
<li><b>专职安全生产管理人员（C）</b>：企业<b>专职</b>从事安全管理工作——含<b>企业安管机构人员+项目专职安全员</b>两类。</li>
</ul></div>

<div class="q">申请考核的条件？（第6条，必考数字）</div>
<table class="t">
<tr><th>条件</th><th>要求</th></tr>
<tr><td>年龄</td><td><b>所有申请人60岁以内；企业主要负责人除外（不限龄）</b></td></tr>
<tr><td>劳动关系</td><td>与受聘企业有<b>正式劳动关系</b></td></tr>
<tr><td>学历职称经历（A）</td><td><b>大专及以上</b>或<b>中级及以上</b>职称 + 通信工程建设<b>3年及以上</b>（法定代表人除外）</td></tr>
<tr><td>学历职称经历（B）</td><td><b>大专及以上</b>或<b>中级及以上</b>职称 + 通信工程建设<b>3年及以上</b></td></tr>
<tr><td>学历职称经历（C）</td><td><b>中专（含高中中技职高）及以上</b>或<b>初级及以上</b>职称 + 通信工程建设<b>2年及以上</b></td></tr>
<tr><td>事故记录</td><td>申请之日前 <span class="big-num">1年内</span> 无<b>一般及以上</b>事故责任记录</td></tr>
</table>
<div class="mn"><b>口诀：</b><span class="hide">「60岁封顶（老板不限）；两长大专3年、安全员中专2年；一年之内要清白」。</span></div>

<div class="q">证书怎么发、有效期多久？（第8~11条）</div>
<div class="k"><ul>
<li>受聘企业通过信息系统向<b>工商注册地省级通管局</b>申请；考核<b>不得收费</b>；合格后<b>20个工作日</b>发证并公告。</li>
<li>有效期 <span class="big-num">3年</span>，统一制作统一编号，<b>全国有效</b>。</li>
<li>延续：期满<b>前3个月内</b>申请；符合条件<b>20个工作日</b>内准延<b>3年</b>；不符合重新考核；<b>不办延续自动失效</b>。</li>
<li>延续三条件：①有效期内<b>未受行政处罚</b>（事故或违法）②信用档案<b>无不良记录</b> ③年度培训合格+<b>继续教育质量测试合格</b>（结果有效期1年）。</li>
</ul></div>

<div class="q">证书变更规则？（第12~14条）</div>
<div class="k"><ul>
<li>变更换新证<b>延续原有效期</b>。</li>
<li><b>换企业</b>：先解除劳动关系→向核发通管局申请。</li>
<li><b>跨省</b>：向<b>变更后所在地</b>通管局申请，经<b>原所在地同意</b>，由<b>变更后所在地办理</b>。</li>
<li><b>换类别</b>（如C转A）：<b>重新考核</b>，原证<b>注销</b>——<b>一人只能持一类</b>。</li>
<li>遗失：信息系统<b>声明作废</b>后补办。不得涂改倒卖出租出借。</li>
</ul></div>

<div class="q">三类人日常责任？（第15~23条，考「谁检查、记哪个档案」）</div>
<div class="k"><ul>
<li><b>企业</b>：建培训制度和档案，<b>每年</b>培训，不合格<b>不得上岗</b>。</li>
<li>按规定配<b>相应数量和专业</b>的专职安全员；<b>重点部位关键环节</b>施工安排现场监督。</li>
<li><b>主要负责人</b>：全面负责；与项目负责人签<b>安全生产责任书</b>（<b>考核目标、奖惩措施、企业为项目提供的安全管理和技术保障</b>）；总包与分包签<b>安全生产协议</b>；<b>检查项目、考核项目负责人</b>，履职不到位责令改正必要时<b>调整</b>，记<b>企业和项目档案</b>。</li>
<li><b>项目负责人</b>：对项目全面负责；<b>确保安全费有效使用</b>；监控<b>危大工程</b>；隐患排查处理记<b>项目档案</b>；事故及时报告并救援；总包的项目负责人<b>定期考核分包</b>。</li>
<li><b>企业安管机构的专职安全员</b>：检查在建项目，<b>重点检查项目负责人、项目专职安全员履责</b>，处理违规，记<b>企业档案</b>。</li>
<li><b>项目专职安全员</b>：<b>每天</b>现场检查，<b>现场监督危大工程专项方案实施</b>；隐患立即处理，不能处理报项目负责人和安管机构；记<b>项目档案</b>。</li>
</ul></div>
<div class="mn"><b>口诀：</b><span class="hide">企业机构的查「人」（查两个负责人）→记企业档案；项目的查「现场」（每天）→记项目档案。</span></div>

<div class="q">监督检查和违规处理？（第24~30条）</div>
<div class="k"><ul>
<li>监督检查<b>至少两名</b>人员参加；不妨碍经营、不索收财物。</li>
<li>信息系统建<b>信用档案</b>：未履职、违法受罚、事故责任认定记入<b>不良行为</b>并<b>向社会公开</b>。</li>
<li>未履职<b>导致事故</b>→依安法第93条<b>暂扣或撤销</b>证书。</li>
<li><b>隐瞒/虚假材料</b>申请考核→不予考核 + <span class="big-num">1年内</span>不得再申请。</li>
<li><b>涂改倒卖出租出借</b>证书→限期改正；逾期<b>收回证书+行业通报</b>。</li>
<li>企业五种情形（没培训没记录/没机构/没配安全员/危大现场无监督/人员未考核上岗或未办变更）→限期改正，逾期<b>行业通报</b>。</li>
</ul></div>
<div class="tip"><b>⚠ 联动（安法96条口径）：</b>其他负责人和安管人员未履职<b>未出事</b>→限期改正罚<b>1万~3万</b>；<b>导致事故</b>→暂停或吊销证书+上年收入<b>20%~50%</b>罚款。</div>

{ id:'s6', tab:'⑬128号许可证', canDone:true, title:'⑬ 《建筑施工企业安全生产许可证管理规定》',
  law:'建设部令第128号 · 2004-07-05发布 · 2015-01-22住建部令第23号修正 · 无证不得施工',
  html: `
<div class="big">管的是<b>「企业准入门槛」</b>：施工企业（含通信的线路管道设备安装）没取得安全生产许可证就不得施工——12个条件拿证，3年一审，出事先暂扣。</div>

<div class="q">建筑施工企业包括通信施工企业吗？</div>
<div class="k"><b>包括。</b>建筑施工企业=从事土木、建筑、<b>线路管道设备安装</b>、装修工程新建扩建改建拆除的企业——通信施工企业<b>必须取证</b>。</div>

<div class="q">取证12条件？（第4条，多选高频）</div>
<div class="k">①健全<b>安全生产责任制</b>+完备规章制度操作规程 ②保证安全条件所需<b>资金投入</b> ③设安管机构+按国家规定配<b>专职安全员</b> ④<b>三类人考核合格</b> ⑤<b>特种作业人员持证</b> ⑥管理人员作业人员<b>每年至少一次</b>培训考核合格 ⑦依法参加<b>工伤保险</b>+为危险作业人员办<b>意外伤害保险</b>（费用企业出） ⑧办公生活区及临设符合安全要求 ⑨配符合国标行标的<b>安全防护用具</b> ⑩危大工程和易出事部位有<b>预防监控措施和应急预案</b> ⑪有<b>应急救援预案、组织或人员</b>，配器材设备（总包分包分别配） ⑫其他法定条件。</div>
<div class="mn"><b>口诀：</b><span class="hide">「制度钱机构、三类人特证、年训两险、临设用具、预案监控、救援组织」。</span></div>

<div class="q">怎么申请、多久发证？（第6~8条）</div>
<div class="k">向<b>住房城乡建设主管部门</b>申请（申请表+法人营业执照+相关文件）；受理起 <span class="big-num">45日内</span> 审查完毕，不予颁发<b>书面通知说明理由</b>，整改后可再申请；涉铁路交通水利征询有关部门意见。</div>

<div class="q">有效期、延续、变更？（必考数字）</div>
<div class="k"><ul>
<li>有效期 <span class="big-num">3年</span>；期满<b>前3个月</b>申请延续；有效期内<b>无死亡事故</b>且原机关同意的<b>可直接延期</b>（不再审查）。</li>
<li>变更名称/地址/法定代表人：变更后 <span class="big-num">10日内</span> 办变更手续。</li>
<li>破产倒闭→交回<b>注销</b>；遗失→<b>补办</b>。</li>
</ul></div>

<div class="q">撤销、暂扣、吊销？（必考对比）</div>
<table class="t">
<tr><th>情形</th><th>后果</th></tr>
<tr><td><b>撤销（发证环节违法4种）</b>：①工作人员<b>滥用职权玩忽职守</b>颁发 ②<b>超越法定职权</b>颁发 ③<b>违反法定程序</b>颁发 ④对<b>不具备条件</b>的企业颁发</td><td>撤销许可证；企业权益受损的<b>依法赔偿</b></td></tr>
<tr><td>取证后发生<b>重大安全事故</b></td><td><b>暂扣</b>+限期整改</td></tr>
<tr><td>不再具备安全生产条件</td><td><b>暂扣</b>责令整改；<b>情节严重吊销</b></td></tr>
<tr><td><b>隐瞒/虚假材料</b>申请</td><td>不予受理或颁发 + <span class="big-num">1年内</span>不得再申请</td></tr>
<tr><td><b>欺骗贿赂</b>等不正当手段取得</td><td><b>撤销</b> + <span class="big-num">3年内</span>不得再申请</td></tr>
</table>
<div class="mn"><b>口诀：</b><span class="hide">「滥超程条」4种撤；重大事故先暂扣；条件不够暂扣、严重就吊销；虚假1年、骗贿3年。</span></div>
<div class="why"><b>为什么这么设计：</b>撤销=一开始就不该给（发证机关的错，所以还赔偿）；暂扣=拿了证后出事（给你机会整改）；吊销=屡教不改或情节严重（资格死刑）。三兄弟对应「出生错误/临时犯错/不可饶恕」。</div>
` },

{ id:'s7', tab:'⑭预案办法', canDone:true, title:'⑭ 《生产安全事故应急预案管理办法》',
  law:'安监总局令第88号 · 2016-07-01施行 · 2019年应急管理部令第2号修正（修正版2019-09-01施行）· 原则：属地为主、分级负责、分类指导、综合协调、动态管理',
  html: `
<div class="big">管的是<b>「预案本身的一生」</b>：编之前先摸家底（风险辨识+资源调查）→ 编（分三类）→ 评审 → 主要负责人签发公布 → 备案 → 演练 → 定期评估修订。老师讲到「评估」留的尾巴，明天补。</div>

<div class="q">预案谁负责编、谁负责落实？（第5条）</div>
<div class="k"><b>主要负责人</b>负责<b>组织编制和实施</b>，对预案的<b>真实性和实用性负责</b>；<b>各分管负责人</b>按职责分工落实。<b>签发</b>也是主要负责人。</div>
<div class="tip"><b>⚠</b> 题干换成「技术负责人负责组织编制」就是错的——一把手的事！（第三章题库第62题考过）</div>

<div class="q">预案分哪三类？各管什么？（第6条）</div>
<div class="k"><ul>
<li><b>综合应急预案</b>：应对<b>各种</b>事故的综合性方案，<b>总体程序、措施和体系总纲</b>。</li>
<li><b>专项应急预案</b>：应对<b>某一种或多种类型</b>事故，或针对<b>重要生产设施、重大危险源、重大活动</b>。</li>
<li><b>现场处置方案</b>：针对<b>具体场所、装置或设施</b>的应急处置措施。</li>
</ul></div>

<div class="q">什么情况编哪类？（第13~15条，考试最爱）</div>
<table class="t">
<tr><th>单位情况</th><th>编什么</th></tr>
<tr><td><b>风险种类多、可能多种类型事故</b></td><td class="c"><b>综合应急预案</b></td></tr>
<tr><td><b>某一种或多种类型事故风险</b></td><td class="c"><b>专项应急预案</b>（可并入综合）</td></tr>
<tr><td><b>危险性较大的场所、装置、设施</b></td><td class="c"><b>现场处置方案</b></td></tr>
<tr><td><b>事故风险单一、危险性小</b></td><td class="c">可<b>只编现场处置方案</b></td></tr>
</table>
<div class="mn"><b>口诀：</b><span class="hide">「险多编综合、单险编专项、危险点位编处置、又单一又小只编处置」。</span></div>

<div class="q">编制前必须做什么？（第10条）</div>
<div class="k"><b>事故风险辨识、评估 + 应急资源调查</b>。资源调查=本地区本单位<b>第一时间可调用</b>的资源+<b>合作区域内可请求援助</b>的资源。</div>
<div class="tip"><b>⚠</b> 评审和演练是编<b>完之后</b>的程序，顺序别颠倒——多选经典陷阱（第三章题库第69题）。</div>

<div class="q">附件信息和应急处置卡？（第16~19条）</div>
<div class="k">附件：<b>向上级应急机构报告的内容、组织机构和人员联系方式、应急物资储备清单</b>，变化及时更新；各类预案相互衔接（内部+政府部门+救援队伍）；<b>应急处置卡</b>：针对<b>工作场所岗位特点</b>编<b>简明实用有效</b>的卡，规定重点岗位人员的<b>处置程序措施+联络方式</b>，便于携带。</div>

<div class="q">谁要评审？注重什么？谁签发？（第21~24条）</div>
<div class="k"><ul>
<li><b>必须评审+书面评审纪要</b>：矿山、金属冶炼、易燃易爆危化品生产经营储存运输企业、达量化工、烟花爆竹、<b>中型规模以上的其他单位</b>；其他单位可<b>论证</b>。</li>
<li>评审注重五性：<b>完整性、合理性、针对性、可行性、衔接性</b>。</li>
<li><b>主要负责人签署</b>→向<b>从业人员公布</b>→发放到部门岗位和救援队伍；可能影响周边的<b>告知周边单位人员</b>。</li>
</ul></div>

<div class="q">备案时限和材料？（第26~28条，必考数字）</div>
<div class="k"><ul>
<li>高危单位（含<b>建筑施工</b>）在预案<b>公布之日起20个工作日内</b>（老师口播「20日」，原文<b>20个工作日</b>，按原文记更稳）按<b>分级属地</b>原则备案并向社会公布。</li>
<li>材料四样：<b>备案申报表、评审意见、电子文档、风险评估结果和应急资源调查清单</b>。</li>
<li>受理部门<b>5个工作日</b>核对：齐全→备案+登记表；不齐→<b>一次性告知</b>补齐；<b>逾期不回复视为已备案</b>。</li>
<li>已备案的，申请安全生产许可证时<b>只需提供备案登记表</b>。</li>
<li>央企层级：总部（上市公司）预案报<b>国务院主管的负有安监职责的部门</b>备案并<b>抄送应急管理部</b>；所属单位预案报所在地<b>省级或设区的市级</b>主管部门备案。</li>
<li>施工现场预案（393号49条）：按施工特点范围、针对<b>易发生重大事故的部位环节</b>制定；实行总承包的由<b>总承包单位统一组织编制</b>，总分包各自建立救援组织或配人员、配器材设备并<b>定期演练</b>。</li>
</ul></div>

<div class="q">演练频次？（第32、33条，必考中的必考）</div>
<table class="t">
<tr><th>谁</th><th>要求</th></tr>
<tr><td>政府应急管理部门</td><td class="c">至少<b>每2年</b>1次</td></tr>
<tr><td>生产经营单位（一般）</td><td class="c">综合<b>或</b>专项演练<b>每年≥1次</b>；现场处置方案<b>每半年≥1次</b></td></tr>
<tr><td>高危单位（含建筑施工）</td><td class="c"><b>每半年≥1次</b>+报送（部门抽查）</td></tr>
</table>
<div class="mn"><b>口诀：</b><span class="hide">「政府2年、综合专项1年、现场处置半年、高危半年加报送」。</span></div>

<div class="q">演练后评估和定期评估？（第34、35条）</div>
<div class="k">演练结束→<b>评估效果</b>、写<b>评估报告</b>、提<b>修订意见</b>；高危企业等<b>每3年一次</b>预案评估（可邀专家、有经验人员，必要时委托<b>安全生产技术服务机构</b>）；修订情形同708号五变，重大变更<b>重新备案</b>。</div>

<div class="q">违反办法怎么罚？（第44、45条）</div>
<table class="t">
<tr><th>违规</th><th>处罚</th></tr>
<tr><td><b>未编制预案 / 未定期演练</b></td><td>限期改正可罚<b>5万以下</b>；逾期→停产整顿+<b>5万~10万</b>，责任人员<b>1万~2万</b></td></tr>
<tr><td>编前未调查评估 / 未评审 / 未告知周边 / 未评估 / 未修订 / 未落实物资装备</td><td>限期改正可罚 <span class="big-num">1万~3万</span></td></tr>
<tr><td><b>未备案</b></td><td>限期改；逾期 <span class="big-num">3万~5万</span>，责任人员 <span class="big-num">1万~2万</span></td></tr>
</table>
` },


{ id:'m4', tab:'④管理概述', grp:'📗 管理篇', canDone:true, title:'管理篇 · 第四章 安全生产管理概述',

<div class="q">④ 许可证「撤销、暂扣、吊销」三兄弟。</div>

<div class="q">⑧ 企业档案 vs 项目档案。</div>

<div class="k">特种作业（电工、登高、焊割、制冷）→ <b>特种作业操作证</b>（应急管理部门发，<b>6年有效、3年复审</b>）；特种设备作业（起重机械司机、指挥司索、机动车辆驾驶）→ <b>特种设备作业人员证</b>（市场监管体系）。项目负责人两证都不要。</div>

<div class="q">⑮ 直接原因 vs 间接原因。</div>
<div class="k"><b>直接</b>＝人的不安全行为（未通风下井、不戴帽、盲目施救）＋物/环境的不安全状态（吊绳强度不足、梯子质量差、毒气超限）；<b>间接</b>＝管理缺陷（培训不足、无监护、无警示、知识缺乏）。海因里希两因素、博德说根源是管理缺陷。</div>

<div class="q">⑯ 检查频次 vs 演练频次（两套「多久一次」）。</div>
<div class="k">检查：<b>班组每天、项目每周、公司每月</b>；专职安全员<b>每天</b>现场检查。演练：政府<b>2年</b>；综合/专项预案<b>每年</b>；现场处置方案<b>每半年</b>；高危单位（含建筑施工）<b>每半年</b>+报送；预案评估<b>3年</b>。</div>

<div class="q">⑰ 高处作业分级 vs 坠落半径（数字不同别串）。</div>
<div class="k">作业高度分级：<b>2~5一级、5~15二级、15~30三级、30+四级</b>；坠落范围半径：<b>3、4、5、6米</b>对应2~5/5~15/15~20/<b>20以上</b>（注意半径的第三档只到20米）。五级阵风禁塔上、六级停吊装。</div>
` }
];

const LSKEY = 'fagui_recite_v2';
let st = { done:{}, last:'s1' };
try { const s = JSON.parse(localStorage.getItem(LSKEY)); if (s && s.done) st = s; } catch(e){}
function save(){ try { localStorage.setItem(LSKEY, JSON.stringify(st)); } catch(e){} }
const LAWIDS = SECTIONS.filter(s => s.canDone).map(s => s.id);

function renderNav(){
  const nav = document.getElementById('nav');
  let h = ''; let lastGrp = '';
  SECTIONS.forEach(s => {
    if(s.grp !== lastGrp){ h += '<span class="grp">' + s.grp + '</span>'; lastGrp = s.grp; }
    const d = st.done[s.id] ? '<span class="dn">✓</span>' : '';
    h += '<button data-s="' + s.id + '" class="' + (s.id === st.last ? 'on' : '') + '">' + d + s.tab + '</button>';
  });
  nav.innerHTML = h;
  nav.querySelectorAll('button').forEach(b => b.addEventListener('click', () => go(b.dataset.s)));
}
function go(id){ st.last = id; save(); renderNav(); renderSec(); window.scrollTo({ top: 0 }); }
function renderSec(){
  const s = SECTIONS.find(x => x.id === st.last) || SECTIONS[0];
  const idx = SECTIONS.indexOf(s);
  let h = '<div class="card"><div class="hrow"><h2>' + s.title + '</h2></div><div class="idline">' + s.law + '</div>' + s.html;
  h += '<div class="navrow"><button ' + (idx <= 0 ? 'disabled' : '') + ' onclick="go(SECTIONS[' + (idx-1) + '].id)">← 上一部</button><button ' + (idx >= SECTIONS.length-1 ? 'disabled' : '') + ' onclick="go(SECTIONS[' + (idx+1) + '].id)">下一部 →</button></div>';
  if (s.canDone){
    const d = !!st.done[s.id];
    h += '<div class="donebar"><button class="' + (d ? 'off' : '') + '" onclick="toggleDone(\'' + s.id + '\')">' + (d ? '↩ 取消已背标记' : '✅ 标记已背') + '</button></div>';
  }
  h += '</div>';
  document.getElementById('app').innerHTML = h;
}
function toggleDone(id){ st.done[id] = !st.done[id]; save(); renderNav(); renderSec(); }
function renderProg(){
  const n = LAWIDS.filter(id => st.done[id]).length;
  document.getElementById('prog').innerHTML = '已背 <b>' + n + '</b> / ' + LAWIDS.length + ' 部';
}
document.getElementById('app').addEventListener('click', function(ev){
  const el = ev.target.closest('.hide');
  if (el) el.classList.toggle('show');
});
renderNav(); renderSec(); renderProg();
</script>
</body>
