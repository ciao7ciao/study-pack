<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第十四章 · 背诵版（答案+解析）</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #eef2f6; color: #22303e; padding: 64px 14px 40px; }
#bar { position: fixed; top: 0; left: 0; right: 0; z-index: 9; background: #ffffffee; backdrop-filter: blur(8px); border-bottom: 1px solid #e0e6ec; padding: 10px 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
#bar .stat { font-size: 14px; color: #5a6572; }
#bar label { font-size: 14px; color: #4a5560; cursor: pointer; }
.wrap { max-width: 760px; margin: 0 auto; }
.q { background: #fff; border-radius: 14px; box-shadow: 0 1px 8px #0000000e; padding: 20px 22px; margin: 14px 0; }
.qno { font-size: 13px; color: #8a95a1; margin-bottom: 6px; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 20px; background: #e3edfb; color: #1a66d6; margin-right: 8px; }
.stem { font-size: 17px; line-height: 1.65; font-weight: 600; margin-bottom: 12px; }
.opt { font-size: 15px; line-height: 1.55; padding: 9px 13px; margin: 6px 0; border: 1.5px solid #e3e9ef; border-radius: 10px; background: #fbfcfe; }
.opt.right { border-color: #2e9e5b; background: #e9f7ef; font-weight: 600; }
.ansline { margin-top: 12px; font-size: 16px; font-weight: 800; color: #217a45; background: #e9f7ef; border: 1.5px solid #2e9e5b; border-radius: 10px; padding: 10px 14px; }
.expl { margin-top: 10px; padding: 12px 15px; border-radius: 10px; background: #fff8e6; border: 1px solid #eee0ae; color: #4a3f28; font-size: 14.5px; line-height: 1.8; white-space: pre-wrap; }
.expl b.h { color: #8a6d1a; }
body.hideans .ansline, body.hideans .opt.right, body.hideans .expl { display: none; }
</style>
</head>
<body>
<div id="bar">
  <span class="stat">第十四章 · 共 16 题</span>
  <label><input type="checkbox" onchange="document.body.classList.toggle('hideans', this.checked)"> 遮住答案自测</label>
</div>
<div class="wrap" id="list"></div>
<script>
const QUIZ = {"title":"第十四章","questions":[{"type":"判断","key":"第1题","stem":"应邀请人民检察院派人参加事故调查组。 （　）","options":[],"answer":"对","why":"依据《生产安全事故报告和调查处理条例》规定，事故造成人员死亡的，应邀请人民检察院派人参加事故调查组，便于依法查处事故背后的失职渎职等行为。该说法正确。","expl":""},{"type":"多选","key":"第2题","stem":"事故材料包括与事故鉴别、记录有关的材料与事故发生的有关事实两部分,其中与事故发生的有关包括（　）。","options":["个人防护措施状况","出事前受害人和肇事者的健康状况","事故发生前设备的性能和质量状况","有关工作环境方面的状况","受害人和肇事者接受安全教育情况"],"answer":"ABCD","why":"与事故发生有关的材料指事发时的事实状况：个人防护状况、受害人和肇事者健康状况、设备性能质量状况、工作环境状况。干扰项E接受安全教育情况属事故鉴别记录类材料，反映培训背景而非事发事实。","expl":""},{"type":"单选","key":"第3题","stem":"事故调查组应当自事故发生之日起 （　）日内提交事故调查报告。","options":["5","30","45","60"],"answer":"D","why":"依据《生产安全事故报告和调查处理条例》规定，事故调查组应自事故发生之日起60日内提交事故调查报告，经批准可适当延长。数字记忆：60日提交报告；30日是伤亡人数变化的补报时限，勿混淆。","expl":""},{"type":"多选","key":"第4题","stem":"海因里希认为事故的主要原因是由于 （　）造成的。C 管理的缺陷","options":["人的不安全行为","物的不安全状态","安全的环境","安全意识"],"answer":"AB","why":"依据海因里希事故因果连锁理论，事故的主要原因是人的不安全行为和物的不安全状态两大因素。干扰项安全的环境是管理追求的目标而非致因；安全意识表述笼统，不属该理论两大致因。","expl":""},{"type":"单选","key":"第5题","stem":"现代事故因果连锁理论的基础使人们逐渐认识到了,有效防止事故发生,控制（　）是最重要的。","options":["人的不安全行为","物的不安全状态","管理的缺陷","安全的环境"],"answer":"C","why":"依据博德现代事故因果连锁理论，管理失误是事故根源，有效防止事故最重要的是控制管理的缺陷。干扰项人的不安全行为、物的不安全状态只是表层现象，其背后根源在于管理缺陷。","expl":""},{"type":"判断","key":"第6题","stem":"对一起事故的原因详细分析,通常有两个层次,即直接原因和间接原因。 （　）","options":[],"answer":"对","why":"该说法正确。依据事故致因分析理论，事故原因通常分两个层次：直接原因是人的不安全行为和物、环境的不安全状态；间接原因是管理缺陷、教育培训不足等深层因素。","expl":""},{"type":"单选","key":"第7题","stem":"导致事故的发生的直接原因是包括机械、物质或环境的不安全状态和（　）","options":["安全操作规程不健全","人的不安全行为","劳动组织不合理","现场缺乏检查或指导错"],"answer":"B","why":"依据事故原因层次划分，直接原因包括机械、物质或环境的不安全状态和人的不安全行为。干扰项规程不健全、劳动组织不合理、缺乏检查指导均属管理缺陷，归为间接原因。","expl":""},{"type":"单选","key":"第8题","stem":"某日在通信杆搬迁过程中,因吊装绳索不堪重负突然断裂,导致通信杆突然掉落,重重砸在两辆正在等红灯的小轿车上,造成 3 人死亡,1 人重伤的安全事故,根据《企业职工伤亡事故分类》,该事故的类别应为（　）。","options":["物体打击","机械伤害","起重伤害","交通事故"],"answer":"C","why":"依据《企业职工伤亡事故分类》，吊装作业中断绳、脱钩、吊物坠落造成的伤害属起重伤害。干扰项物体打击不含起重作业场景，机械伤害指设备运动部件致伤，交通事故限定车辆运输过程。","expl":""},{"type":"单选","key":"第9题","stem":"在土质松软处挖沟,应有防止 （　） 措施。","options":["落物","塌方","陷落","跌落"],"answer":"B","why":"依据土方施工安全规程，土质松软处挖沟应有防止塌方措施，如放坡、打挡土板支撑。松软土质沟壁承载力差，塌方是首要风险；落物、陷落、跌落均非该场景的针对性措施。","expl":""},{"type":"单选","key":"第10题","stem":"下面（　） 不属于人的不安全行为。","options":["驾驶人员忽视安全","作业中使用的吊绳强度不足","施工人员未设围档","吊车司机注意力分散"],"answer":"B","why":"依据事故致因理论，吊绳强度不足属于物的不安全状态而非人的不安全行为。干扰项忽视安全、未设围档、注意力分散都是人的行为差错，区分物与人的致因是本题考点。","expl":""},{"type":"单选","key":"第11题","stem":"可能造成高处坠落事故的非管理因素有 （　）","options":["监督管理不到位","安全交底不落实","未向作业人员提供安全帽","梯子质量差"],"answer":"D","why":"高处坠落事故中，梯子质量差属物的不安全状态，是不依赖管理环节存在的非管理因素。干扰项监督管理不到位、安全交底不落实、未提供安全帽均属管理层面缺陷，是管理因素。","expl":""},{"type":"判断","key":"第12题","stem":"人的不安全行为在很多时候是导致事故发生的主要因素,但人的不安全行为并不是每次必然导致事故的发生。 （　）","options":[],"answer":"错","why":"该说法错误。依据海因里希因果连锁理论，事故主要原因是人的不安全行为和物的不安全状态两者互为因果、连锁引发，不能单独把人的不安全行为说成主要因素，也不能割裂行为与事故的联系。","expl":""},{"type":"单选","key":"第13题","stem":"在事故的原因中,下列导致发生事故的直接原因的是 （　）","options":["未参加安全教育培训","作业现场未设警示标志","未通风就贸然进入有毒气的人井","未参加安全交底"],"answer":"C","why":"未通风就贸然进入有毒气体人井，是直接引发中毒窒息的人的不安全行为，属直接原因。干扰项未参加教育培训、现场未设警示、未参加安全交底均属教育和管理缺陷，是间接原因。","expl":""},{"type":"单选","key":"第14题","stem":"以下属于导致死亡事故的间接原因是 （　）","options":["人孔内毒气过量","未佩戴防毒面具盲目施救","人孔内氧浓度低","安全知识缺乏"],"answer":"D","why":"依据事故原因层次划分，安全知识缺乏属教育培训不足、管理缺陷层面，是间接原因。干扰项毒气过量、氧浓度低是物和环境的不安全状态，盲目施救是人的不安全行为，均为直接原因。","expl":""},{"type":"单选","key":"第15题","stem":"施工人员沈某使用用户处借来的人字型铝合金梯,展开成一字梯后作为登高工具,且作业时未戴安全帽,爬梯时也无人扶梯,梯子从连接处折断,沈某从高处摔下死亡。以下原因中属于导致沈某死亡事故的间接原因是 （　）","options":["沈某不戴安全帽","梯子折断","水泥路面突出","无人扶梯监护"],"answer":"D","why":"无人扶梯监护属监护组织缺失，是间接原因。干扰项不戴安全帽是人的不安全行为，梯子折断是物的不安全状态，地面突出属环境不安全状态，它们都直接引发坠落，属直接原因。","expl":""},{"type":"判断","key":"第16题","stem":"造成事故的原因不是单一的,也不是并列的,往往是互为因果,相互作用。（　）","options":[],"answer":"对","why":"事故成因理论：事故的发生是人的不安全行为、物的不安全状态、环境不良和管理缺陷等多种因素互为因果、相互作用的结果，不是单一原因，也不是简单并列。判断题说法正确。","expl":""}]};
const L = 'ABCDE';
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
document.getElementById('list').innerHTML = QUIZ.questions.map((q, i) => {
  let opts;
  if (q.type === '判断') {
    opts = ['对','错'].map(t => `<div class="opt ${t===q.answer?'right':''}">${t}</div>`).join('');
  } else {
    opts = q.options.map((o,k) => `<div class="opt ${q.answer.includes(L[k])?'right':''}"><b>${L[k]}</b>　${esc(o)}</div>`).join('');
  }
  const expl = (q.why ? esc(q.why) + '<br>' : '') + (q.expl ? '<b class="h">📖 详细讲解：</b><br>' + esc(q.expl) : (q.why || q.expl ? '' : '（讲解待补，先记答案）'));
  return `<div class="q">
    <div class="qno"><span class="badge">${q.type}</span>第 ${i+1} 题${q.key && q.key.startsWith('附') ? '（附录）' : ''}</div>
    <div class="stem">${esc(q.stem)}</div>
    ${opts}
    <div class="ansline">✔ 答案：${q.answer}</div>
    <div class="expl">${expl}</div>
  </div>`;
}).join('');
</script>
</body>
</html>
