<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>第八章</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #eef2f6; color: #22303e; display: flex; justify-content: center; padding: 30px 16px; }
.card { background: #fff; border-radius: 16px; box-shadow: 0 2px 14px #00000012; max-width: 640px; width: 100%; padding: 26px 28px; }
.progress { font-size: 13px; color: #8a95a1; margin-bottom: 14px; }
.progress b { color: #1a66d6; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px; background: #e3edfb; color: #1a66d6; margin-bottom: 12px; }
.stem { font-size: 19px; line-height: 1.65; font-weight: 600; margin-bottom: 18px; }
.opt { display: block; width: 100%; text-align: left; font-size: 16px; line-height: 1.5; padding: 13px 16px; margin: 8px 0; border: 1.5px solid #dbe3ea; border-radius: 11px; background: #fbfcfe; cursor: pointer; font-family: inherit; color: #22303e; }
.opt:hover { border-color: #9ec2ee; background: #f2f7fd; }
.opt.sel { border-color: #1a66d6; background: #e8f1fd; }
.opt.right { border-color: #2e9e5b; background: #e9f7ef; }
.opt.wrong { border-color: #d64545; background: #fdecec; }
.opt:disabled { cursor: default; }
.tf { display: flex; gap: 14px; } .tf .opt { text-align: center; font-size: 18px; font-weight: 600; }
.confirm { margin-top: 14px; width: 100%; padding: 13px; font-size: 16px; font-weight: 700; border: none; border-radius: 11px; background: #1a66d6; color: #fff; cursor: pointer; font-family: inherit; }
.confirm:disabled { background: #b9c6d4; cursor: default; }
.why { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: 14.5px; line-height: 1.6; background: #fff8e6; color: #6b5416; }
.verdict { font-weight: 800; margin-bottom: 4px; }
.verdict.ok { color: #2e9e5b; } .verdict.no { color: #d64545; }
.nav { display: flex; justify-content: space-between; margin-top: 20px; }
.nav button { padding: 10px 22px; font-size: 14px; border: 1px solid #d3dce4; border-radius: 9px; background: #fff; cursor: pointer; font-family: inherit; }
.nav button:disabled { opacity: .35; cursor: default; }
.result { text-align: center; }
.score { font-size: 46px; font-weight: 800; margin: 10px 0; }
.score small { font-size: 18px; color: #8a95a1; font-weight: 600; }
.wronglist { text-align: left; font-size: 14.5px; line-height: 1.7; background: #f7f9fb; border-radius: 10px; padding: 14px 16px; margin: 14px 0; }
.copy { width: 100%; padding: 14px; font-size: 16px; font-weight: 700; border: none; border-radius: 11px; background: #1a66d6; color: #fff; cursor: pointer; font-family: inherit; }
.redo { margin-top: 10px; width: 100%; padding: 12px; font-size: 14px; border: 1px solid #d3dce4; border-radius: 11px; background: #fff; cursor: pointer; font-family: inherit; }
.mini { font-size: 12px; padding: 4px 10px; border: 1px solid #d3dce4; border-radius: 8px; background: #fff; cursor: pointer; font-family: inherit; color: #4a5560; }
.mini:hover { background: #eef2f6; }
.groupbar { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: #e8f1fd; border: 1px solid #bcd6f5; font-size: 14.5px; color: #17427e; line-height: 1.8; }
.groupbar .gbtn { font-size: 14px; padding: 8px 14px; background: #1a66d6; color: #fff; border: none; border-radius: 9px; cursor: pointer; font-family: inherit; font-weight: 700; }
.groupbar .ghint { color: #5a7ba6; font-size: 13px; margin-left: 8px; }
textarea { width: 100%; height: 64px; margin-top: 12px; font-size: 14px; padding: 10px; border: 1px solid #d3dce4; border-radius: 9px; font-family: inherit; }
</style>
</head>
<body>
<div class="card" id="app"></div>
<script>
const QUIZ = {"title":"第八章","questions":[{"type":"多选","stem":"应急管理是一个动态过程,包括（　）四个阶段。","options":["立项","预防","准备","响应","恢复"],"answer":"BCDE","why":"课堂口径：应急管理四阶段——预防（收集法规、制定制度、买保险、风险分析与评价）→准备（机构设立、预案编制、队伍建设、设施设备准备维护、演练）→响应（事故后立即采取的行动）→恢复（先恢复到相对安全，再逐步正常）。「立项」是工程词汇凑数的，口诀：防、备、响、恢。"},{"type":"单选","stem":"为迅速有效地开展应急行动,需要预先所做的各种准备不包括（　）。","options":["应急队伍建设","应急机构设立","应急预案演练","开展安全研究"],"answer":"D","why":"课堂口径：应急准备＝机构设立和职责落实、应急预案编制、应急救援队伍建设、应急设施设备准备和维护、应急演练；「开展安全研究」属预防阶段的风险管理工作，不是为应急行动做的准备。"},{"type":"单选","stem":"应急响应是在事故发生后应立即采取的（　） 行动。","options":["应急与事故处理","救援和事故处理","救援与上报","应急与救援"],"answer":"D","why":"课堂口径：应急响应＝事故发生后立即采取的应急与救援行动（报警、疏散、抢险、救人控险）；「事故处理」属事后环节。"},{"type":"判断","stem":"事故应急救援的总目标是通过有效的应急救援行动,尽可能降低事故的后果,包括人员伤亡、财产损失和环境破坏等。 （　）","options":[],"answer":"对","why":"课堂口径：应急救援总目标＝通过有效应急行动尽可能降低事故后果（人员伤亡、财产损失、环境破坏）；基本任务五件事：营救（首要任务）、控制事态发展、消除危害后果、查清事故原因、恢复现场。"},{"type":"单选","stem":"整个应急救援系统的重心 （　）","options":["应急救援中心","应急救援专家组","公众疏散组织","后勤保障组织"],"answer":"A","why":"课堂口径：应急救援组织十机构中，应急救援中心是整个系统的重心——统一指挥协调、统筹安排救援期间各机构运作；专家组只是参谋，疏散组织、后勤保障都是分支节点。"},{"type":"单选","stem":"为保障重大事故应急救援工作的有效开展,应建立重大事故应急救援体系的 （　）系统。","options":["检查分析","问题比对","支持保障","纠偏"],"answer":"C","why":"课堂口径：重大事故应急救援体系应建立支持保障系统，五方面＝法律法规、通信系统、警报系统、技术与信息支持、宣传教育培训；通信系统是救援工作开展的关键。"},{"type":"判断","stem":"应急救援体系可以有可靠的通信保障系统,保证整个应急救援过程中救援组织内部,以及内部与外部之间通畅的通信网络,并设立备用通信系统。 （　）","options":[],"answer":"错","why":"课堂口径：通信系统是救援工作开展的关键，应急救援体系必须设立可靠的通信保障系统并设立备用通信系统，保证救援全程内外通信畅通——「可以有」把强制性要求说成可有可无，故错误。"},{"type":"单选","stem":"临时应急恢复阶段不包括 （　）","options":["恢复现场","人员清点和撤离","警戒解除","事故处理和事故调查"],"answer":"A","why":"课堂口径：救援行动结束后进入临时应急恢复阶段＝现场清理、人员清点和撤离、警戒解除、善后处理、事故调查；「恢复现场」属长期恢复内容，且应急期恢复原状＝破坏现场，不允许。"},{"type":"单选","stem":"应急预案体系的构成不包含 （　）","options":["综合应急预案","专项应急预案","施工组织预案","现场处置预案"],"answer":"C","why":"课堂口径：应急预案体系三层＝综合应急预案、专项应急预案、现场处置方案；「施工组织预案」属施工组织设计体系，不是应急体系组成部分。"},{"type":"多选","stem":"生产经营单位应急预案编制程序包括 （　）、应急预案编制、桌面推演等步骤。","options":["成立编制工作组","收集资料","评估风险和应急资源调查","应急预案评审和批准","发布和执行预案"],"answer":"ABCD","why":"课堂口径：预案编制八步＝成立编制工作组→收集资料→风险评估→应急资源调查→应急预案编制→桌面推演→应急预案评审→批准发布。"},{"type":"单选","stem":"施工单位应急预案编制完成后,应由 （　） 组织评审。","options":["建设单位","设计单位","施工单位","监理单位"],"answer":"C","why":"课堂口径：预案评审三步＝评审准备→组织评审→修改完善；施工单位自行组织评审（可邀专家），评审通过后由本单位主要负责人签发发布。"},{"type":"单选","stem":"下列表述中不属于生产安全事故应急救援预案制定要求的是（　）","options":["系统性","科学性","针对性","可操作性"],"answer":"A","why":"课堂口径：应急预案制定要求＝科学性、针对性、可操作性（《生产安全事故应急条例》第6条同口径，另有合规性衔接性）；「系统性」不在其列。"},{"type":"多选","stem":"综合应急预案的应急响应部分的内容,一般应包括 （　）","options":["信息报告","响应分级","应急处置","应急支援","响应终止"],"answer":"ACDE","why":"课堂口径：综合应急预案的应急响应部分＝信息报告、应急处置、应急支援、响应终止；响应六阶段＝信息报告→预警→响应启动→应急处置→应急支援→响应终止；「响应分级」写在总则（适用范围+响应分级），不在响应部分。"},{"type":"单选","stem":"综合应急预案的应急响应部分的内容,一般不包括（　）","options":["信息报告","响应分级","应急处置","应急支援"],"answer":"B","why":"课堂口径：响应分级在总则；响应启动由应急领导小组做出决策并宣布。信息报告、应急处置、应急支援都在响应部分内——对照上一题记。"},{"type":"多选","stem":"综合应急预案中,应急响应终止应明确终止的 （　）","options":["基本条件","要求","责任人","信息公开","后勤保障"],"answer":"ABC","why":"课堂口径：应急响应终止应明确终止的基本条件、要求和责任人，保证响应结束有据可依、有人负责；信息公开、后勤保障不是终止章节的必列内容。"},{"type":"单选","stem":"用于事故应急响应的保障队伍,一般不包括 （　）","options":["专职应急队伍","兼职应急队伍","应急队伍","业余应急队伍"],"answer":"D","why":""},{"type":"多选","stem":"现场处置方案主要由（　）、注意事项等内容组成。","options":["事故风险分析","应急工作职责","应急预案管理","应急处置","安全制度"],"answer":"ABD","why":""},{"type":"单选","stem":"现场处置方案中应明确的注意事项,描述不准确的是 （　）","options":["使用施工机具方面的注意事项","使用救援装备方面的注意事项","现场自救互救方面的注意事项","现场人员安全防护的注意事项"],"answer":"A","why":""},{"type":"单选","stem":"综合应急预案、专项应急预案和现场处置方案最后都要列出一个附件,其主要内容不包括的是（　）","options":["有关应急部门、机构或人员的联系方式","应急物质装备的名称或清单","关键的路线、标识和图纸","公司相关的安全管理制度"],"answer":"D","why":""},{"type":"单选","stem":"应急演练是针对事故情景,依据应急预案而 （　） 开展的应急救援活动。","options":["提前","实际","模拟","准备"],"answer":"C","why":""},{"type":"判断","stem":"通过开展应急演练,可以实现评估应急准备状态,发现并及时修改应急预案、执行程序等相关工作的缺陷和不足。（　）","options":[],"answer":"对","why":""},{"type":"单选","stem":"作为应急演练的原则,不适合的是（　）","options":["注重知识水平提升","符合相关规定","切合企业实际","确保安全有序"],"answer":"A","why":""},{"type":"判断","stem":"桌面演练是选择(或模拟) 生产经营活动中的设备设施、装置或场所,设定事故情景,依据应急预案而模拟的应急演练活动。 （　）","options":[],"answer":"错","why":""},{"type":"单选","stem":"选择生产经营活动中的设备设施、场所,设定事故情景,依据应急预案而模拟开展的演练活动是 （　）","options":["桌面演练","现场演练","单项演练","综合演练"],"answer":"B","why":""},{"type":"多选","stem":"应急演练按照内容可分为 （　）","options":["桌面演练","现场演练","单项演练","综合演练","专项演练"],"answer":"CD","why":""},{"type":"单选","stem":"不属于应急演练计划内容的是 （　）","options":["演练目的及类型(形式)","参加单位和经营预算","演练的时间、地点及主要内容","演练效果评价"],"answer":"D","why":""},{"type":"单选","stem":"根据演练评估报告中对应急预案的改进建议,由应急预案的（　）按程序对预案进行修订完善。（　）","options":["编制部门","演练部门","管理部门","上级部门"],"answer":"A","why":""},{"type":"多选","stem":"通信工程有限空间作业中毒或窒息事故的现场处置方案,主要由（　）、注意事项、附件等内容组成。","options":["事故风险分析","应急工作职责","应急预案管理","应急处置","安全制度"],"answer":"ABD","why":""}]};
const KEY = 'quiz_' + QUIZ.title;
const GROUP = 5;
let idx = 0, answers = [], sel = [], locked = [];
const app = document.getElementById('app');

function copyGroup(gstart) {
  let text = [];
  for (let i = gstart; i < Math.min(gstart + GROUP, QUIZ.questions.length); i++) {
    if (answers[i]) text.push(`${i+1}${answers[i].mine}`);
  }
  text = text.join(' ') || '（本组还没答题）';
  const done = () => { const b = document.getElementById('gbtn' + gstart); if (b) { b.textContent = '✅ 已复制，去聊天粘贴'; } };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(done);
  else done();
}

function save() { try { localStorage.setItem(KEY, JSON.stringify({ answers, sel, locked })); } catch(e) {} }
function loadSaved() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.answers) { answers = s.answers; sel = s.sel; locked = s.locked; }
  } catch(e) {}
}

function answeredText() {
  return answers.map((a,i)=>a?`${i+1}${a.mine}`:null).filter(Boolean).join(' ');
}
function copyResult() {
  const text = answeredText() || '（还没答任何题）';
  const done = () => { const b = document.getElementById('copybtn'); if (b) { b.textContent = '✅ 已复制，去聊天粘贴'; setTimeout(()=>{ const x=document.getElementById('copybtn'); if(x) x.textContent='📋 复制已答成绩'; }, 2000); } };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(() => { const t=document.getElementById('ta'); if(t){t.select();document.execCommand('copy');} done(); });
  else { const t=document.getElementById('ta'); if(t){t.select();document.execCommand('copy');} done(); }
}
function clearProgress() {
  if (confirm('确定清空本章答题记录，从头再做吗？')) { localStorage.removeItem(KEY); location.reload(); }
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function letters(n){ return 'ABCDE'.slice(0, n).split(''); }

function render() {
  if (idx >= QUIZ.questions.length) { renderResult(); return; }
  const q = QUIZ.questions[idx];
  let html = `<div class="progress">第 <b>${idx+1}</b> / ${QUIZ.questions.length} 题 · 已做对 ${answers.filter((a,i)=>a && a.ok).length}
    <span style="float:right"><button class="mini" id="copybtn" onclick="copyResult()">📋 复制已答成绩</button> <button class="mini" onclick="clearProgress()">清空重做</button></span></div>`;
  html += `<span class="badge">${q.type}</span><div class="stem">${esc(q.stem)}</div>`;
  if (q.type === '判断') {
    html += `<div class="tf">` + ['对','错'].map(t =>
      `<button class="opt ${locked[idx] ? (t===q.answer?'right':(sel[idx]===t?'wrong':'')) : ''}" ${locked[idx]?'disabled':''} onclick="pick('${t}')">${t}</button>`).join('') + `</div>`;
  } else {
    html += letters(q.options.length).map((L,i) =>
      `<button class="opt ${locked[idx] ? (q.answer.includes(L)?'right':((sel[idx]||[]).includes(L)?'wrong':'')) : ((sel[idx]||[]).includes(L)?'sel':'')}" ${locked[idx]?'disabled':''} onclick="pick('${L}')"><b>${L}</b>　${esc(q.options[i])}</button>`).join('');
    if (q.type === '多选' && !locked[idx]) html += `<button class="confirm" ${sel[idx] && sel[idx].length ? '' : 'disabled'} onclick="confirmMulti()">确　认</button>`;
  }
  if (locked[idx]) {
    const ok = answers[idx].ok;
    html += `<div class="why"><div class="verdict ${ok?'ok':'no'}">${ok ? '✅ 答对了' : '❌ 答错了，正确答案 ' + q.answer}</div>${q.why ? esc(q.why) : ''}</div>`;
  }
  // 每完成一组（GROUP 题）弹出复制提示
  if (locked[idx] && (idx + 1) % GROUP === 0 && idx + 1 < QUIZ.questions.length) {
    const gs = idx + 1 - GROUP;
    html += `<div class="groupbar">✅ 第 ${gs+1}~${idx+1} 题完成（对 ${answers.slice(gs, idx+1).filter(a=>a&&a.ok).length} / ${GROUP}）<br>
      <button class="mini gbtn" id="gbtn${gs}" onclick="copyGroup(${gs})">📋 复制这 ${GROUP} 题成绩发给我</button>
      <span class="ghint">粘贴到聊天后，点「下一题 →」继续</span></div>`;
  }
  html += `<div class="nav"><button onclick="prev()" ${idx===0?'disabled':''}>← 上一题</button><button onclick="next()" ${locked[idx]?'':'disabled'}>${idx===QUIZ.questions.length-1?'看成绩 →':'下一题 →'}</button></div>`;
  app.innerHTML = html;
}

function pick(v) {
  if (locked[idx]) return;
  const q = QUIZ.questions[idx];
  if (q.type === '判断' || q.type === '单选') { submit([v]); }
  else { // 多选 toggle
    sel[idx] = sel[idx] || [];
    const i = sel[idx].indexOf(v);
    i >= 0 ? sel[idx].splice(i,1) : sel[idx].push(v);
    render();
  }
}
function confirmMulti() { if (sel[idx] && sel[idx].length) submit([...sel[idx]].sort()); }

function submit(vals) {
  const q = QUIZ.questions[idx];
  const std = q.type === '判断' ? q.answer : q.answer.split('').sort().join('');
  const mine = q.type === '判断' ? vals[0] : vals.join('');
  const ok = mine === std;
  answers[idx] = { mine, ok };
  locked[idx] = true;
  save();
  render();
}

function prev() { if (idx > 0) { idx--; render(); } }
function next() { if (locked[idx]) { idx++; render(); } }

function renderResult() {
  const total = QUIZ.questions.length;
  const right = answers.filter(a => a && a.ok).length;
  const wrongs = QUIZ.questions.map((q,i) => ({q,i,a:answers[i]})).filter(x => x.a && !x.a.ok);
  let html = `<div class="result"><div class="progress">${QUIZ.title}</div><div class="score">${right}<small> / ${total}</small></div>`;
  if (wrongs.length) {
    html += `<div class="wronglist"><b>❌ 错题（已记入待重测）：</b><br>` + wrongs.map(x =>
      `第${x.i+1}题 你答 ${x.a.mine} · 正确 ${x.q.answer}<br>　${esc(x.q.why)}`).join('<br>') + `</div>`;
  } else {
    html += `<div class="wronglist">🎉 全对！没有错题。</div>`;
  }
  html += `<button class="copy" onclick="copyResult()">📋 复制成绩（发给 ZCode 记错题本）</button>`;
  html += `<textarea id="ta" readonly>${answeredText()}</textarea>`;
  html += `<button class="redo" onclick="clearProgress()">🗑 清空本章记录，从头再做</button></div>`;
  app.innerHTML = html;
}

function copyResult() {
  copyResultBtn();  // 顶栏按钮复用同一函数
}
function copyResultBtn() {}  // 占位（顶栏直接用 copyResult）

answers = new Array(QUIZ.questions.length).fill(null);
sel = new Array(QUIZ.questions.length).fill(null);
locked = new Array(QUIZ.questions.length).fill(false);
loadSaved();
// 续做：跳到第一个未答的题；全答完则直接看成绩
idx = locked.findIndex(l => !l);
if (idx === -1) idx = QUIZ.questions.length;
render();
</script>
