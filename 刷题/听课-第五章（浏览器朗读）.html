<script>
const SEGS = [{"tag": "第1题", "text": "第1题，单选题。下面关于安全生产决策机构的说法,不正确的是 （　） 选项：A，安全生产决策机构可以是安全生产委员会或安全生产决策岗位；B，安全生产决策机构的负责人是企业主要负责人；C，安全生产决策机构的负责人是企业的实际控制人；D，安全生产决策机构的负责人应为安全生产管理机构的负责人。"}, {"tag": null, "text": "正确答案：D，安全生产决策机构的负责人应为安全生产管理机构的负责人。"}, {"tag": "第2题", "text": "第2题，单选题。施工单位应当在（　）的领导下开展安全生产管理。 选项：A，企业主要负责人；B，项目负责人；C，企业技术负责人；D，企业专职安全管理人员。"}, {"tag": null, "text": "正确答案：A，企业主要负责人。"}, {"tag": "第3题", "text": "第3题，单选题。关于中央施工企业安全生产委员会的有关规定,说法正确的是（　） 选项：A，各类企业均应成立安全生产委员会；B，董事长、党组书记、总经理对本企业安全生产工作共同承担领导责任；C，董事长承担领导责任；D，总经理承担领导责任。"}, {"tag": null, "text": "正确答案：B，董事长、党组书记、总经理对本企业安全生产工作共同承担领导责任。"}, {"tag": "第4题", "text": "第4题，单选题。关于安全生产委员会的组成,正确的是 （　） 选项：A，应由企业管理层人员及其直接领导下的各职能部门负责人组成；B，必须由企业管理层人员组成；C，必须由企业各部门负责人组成；D，应由安全生产管理机构的成员组成。"}, {"tag": null, "text": "正确答案：A，应由企业管理层人员及其直接领导下的各职能部门负责人组成。"}, {"tag": "第5题", "text": "第5题，单选题。通信施工企业的安全生产委员会每年度应有 （　）次以上安委会会议,并有安排、部署和记录 选项：A，3；B，4；C，5。"}, {"tag": null, "text": "正确答案：A，3。"}, {"tag": "第6题", "text": "第6题，单选题。施工企业设置的负责安全生产管理工作的独立职能部门是 （　） 选项：A，企业安全生产决策机构；B，企业安全生产管理机构；C，企业安全生产参与机构；D，企业安全生产委员会。"}, {"tag": null, "text": "正确答案：B，企业安全生产管理机构。"}, {"tag": "第7题", "text": "第7题，单选题。关于安全生产管理机构的设置,正确的是（　） 选项：A，各类企业均应设置；B，各种规模的企业均应设置；C，施工企业均应设置；D，中央施工企业必须设置。"}, {"tag": null, "text": "正确答案：D，中央施工企业必须设置。"}, {"tag": "第8题", "text": "第8题，单选题。安全生产管理机构必须依法配齐配强 （　）等专业安全管理人员 选项：A，注册建筑师；B，注册项目管理师；C，注册安全工程师；D，高级工程师。"}, {"tag": null, "text": "正确答案：C，注册安全工程师。"}, {"tag": "第9题", "text": "第9题，单选题。下面关于工程项目安全管理领导小组的说法,错误的是 （　） 选项：A，工程项目需要分包的,应成立项目安全管理领导小组；B，项目安全管理小组应配备考核合格的项目专职安全生产管理人员；C，总承包、专业承包和劳务分包单位的管理人员应为安全管理领导小组成员；D，劳务分包单位的技术员应为安全管理领导小组的成员。"}, {"tag": null, "text": "正确答案：D，劳务分包单位的技术员应为安全管理领导小组的成员。"}, {"tag": "第10题", "text": "第10题，单选题。企业最基本、最核心的安全生产管理制度是 （　） 选项：A，安全生产管理制度；B，安全生产检查制度；C，安全生产责任制度；D，安全隐患排查制度。"}, {"tag": null, "text": "正确答案：C，安全生产责任制度。"}, {"tag": "第11题", "text": "第11题，单选题。企业建立健全安全生产管理制度,应以企业的 （　）为核心。 选项：A，职业健康；B，经济责任制；C，安全生产责任制；D，质量管理体系。"}, {"tag": null, "text": "正确答案：C，安全生产责任制。"}, {"tag": "第12题", "text": "第12题，单选题。下面关于企业安全生产隐患排查与治理的要求,错误的是 （　） 选项：A，企业应建立健全生产安全事故隐患排查治理制度；B，发现一般事故隐患时,排查人员应立即上报,等待处理；C，企业应采取技术、管理措施,及时发现并消除事故隐患；D，企业记录的安全生产隐患应向从业人员通报。"}, {"tag": null, "text": "正确答案：B，发现一般事故隐患时,排查人员应立即上报,等待处理。"}, {"tag": "第13题", "text": "第13题，多选题。施工单位应当将施工现场的 （　）与作业区分开设置,并保持安全距离。 选项：A，绿化区；B，试验区；C，办公区；D，动火区；E，生活区。"}, {"tag": null, "text": "正确答案：C、E。"}, {"tag": "第14题", "text": "第14题，单选题。下面的安全生产责任制编制原则中,正确的是（　） 选项：A，应与工程项目的现场情况相适应；B，应突出重点、兼顾一般、抓住关键；C，在一定时期内应保持内容、要求不变；D，应满足建设单位、监理单位的要求。"}, {"tag": null, "text": "正确答案：B，应突出重点、兼顾一般、抓住关键。"}, {"tag": "第15题", "text": "第15题，多选题。企业安全生产责任制涉及的内容,一般应包括 （　） 选项：A，企业的安全生产岗位；B，企业的安全生产责任人员；C，安全生产责任范围；D，安全生产检查制度；E，安全生产考核标准。"}, {"tag": null, "text": "正确答案：B、C、E。"}, {"tag": "第16题", "text": "第16题，单选题。下述职责中,属于企业安全生产决策机构的是（　）。 选项：A，制定企业安全生产检查计划；B，研究解决企业安全生产工作中的重大问题；C，监督在建工程项目安全生产费用的使用情况；D，参加生产安全事故的调查和处理工作。"}, {"tag": null, "text": "正确答案：B，研究解决企业安全生产工作中的重大问题。"}, {"tag": "第17题", "text": "第17题，单选题。下述职责中,属于企业安全生产决策机构的是 （　）。 选项：A，研究决定企业安全生产方面的奖惩事项；B，制定企业安全生产检查计划；C，监督在建项目安全生产费用的使用；D，参加生产安全事故的调查和处理工作。"}, {"tag": null, "text": "正确答案：A，研究决定企业安全生产方面的奖惩事项。"}, {"tag": "第18题", "text": "第18题，单选题。下述职责中,属于企业安全生产管理部门的是（　） 选项：A，研究决定企业安全生产方面的奖惩事项；B，监督在建工程项目安全生产费用的使用；C，研究解决企业安全生产工作中的重大问题；D，确定企业的安全生产管理方针。"}, {"tag": null, "text": "正确答案：B，监督在建工程项目安全生产费用的使用。"}, {"tag": "第19题", "text": "第19题，单选题。下述职责中,属于企业安全生产管理部门的是 （　） 选项：A，研究决定企业安全生产方面的奖惩事项；B，制订企业安全生产考核计划；C，研究解决企业安全生产工作中的重大问题；D，确定企业的安全生产管理方针。"}, {"tag": null, "text": "正确答案：B，制订企业安全生产考核计划。"}, {"tag": "第20题", "text": "第20题，单选题。按照《施工企业安全生产管理规范》GB50656-2011) 的条文说明的规定,下列职责中,属于技术管理部门的是（　） 选项：A，协调配置安全生产所需的各项资源；B，监督检查机械设备和仪表的合规性；C，参与设备、仪表施工组织设计的会审；D，组织编制、审查专项安全施工方案。"}, {"tag": null, "text": "正确答案：D，组织编制、审查专项安全施工方案。"}, {"tag": "第21题", "text": "第21题，单选题。按照《施工企业安全生产管理规范》GB50656-2011) 的条文说明的规定,下列职责中,属于设备仪表管理部门的是 （　） 选项：A，协调配置安全生产所需的各项资源；B，制订安全技术措施和安全操作规程；C，参与机械设备施工组织设计的会审；D，组织编制、审查专项安全施工方案。"}, {"tag": null, "text": "正确答案：C，参与机械设备施工组织设计的会审。"}, {"tag": "第22题", "text": "第22题，单选题。按照《施工企业安全生产管理规范》GB50656-2011) 的条文说明的规定,下列职责中,属于物资管理部门的是 （　）。 选项：A，协调配置安全生产所需的各项资源；B，监督检查机械设备和仪表的合规性；C，负责劳动防护用品的安全管理工作；D，组织编制、审查专项安全施工方案。"}, {"tag": null, "text": "正确答案：C，负责劳动防护用品的安全管理工作。"}, {"tag": "第23题", "text": "第23题，单选题。按照《施工企业安全生产管理规范》(GB50656-2011) 的条文说明的规定,其他职能部门的安生产职责,人力资源部门的是 （　） 选项：A，审查安全管理人员资格；B，负责劳动防护用品的安全管理；C，审查劳务分包人员资格；D，协助办理安全奖、罚手续。"}, {"tag": null, "text": "正确答案：A，审查安全管理人员资格。"}, {"tag": "第24题", "text": "第24题，多选题。下列安全生产职责中,属于建筑施工企业安全生产领导小组的主要职责的是（　） 选项：A，编制并适时更新安全生产管理制度并监督实施；B，编制项目生产安全事故应急救援预案并组织实施；C，参加生产安全事故的调查和处理工作；D，协调配备项目专职安全生产管理人员；E，组织编制危险性较大工程安全专项施工方案。"}, {"tag": null, "text": "正确答案：B、E。"}, {"tag": "第25题", "text": "第25题，判断题。安全生产责任制涉及的人员范围为企业主要负责人到基层管理岗位人员。（　）"}, {"tag": null, "text": "答案：这个说法是错的。"}, {"tag": "第26题", "text": "第26题，单选题。不属于施工企业主要负责人安全生产主要管理工作的是 （　） 选项：A，领导企业安全生产管理工作；B，组织制定企业中长期安全管理目标和制度；C，做好施工现场的安全生产检查工作；D，审议、决策重大安全事项。"}, {"tag": null, "text": "正确答案：C，做好施工现场的安全生产检查工作。"}, {"tag": "第27题", "text": "第27题，单选题。下列安全生产管理职责中,属于企业主要负责人安全生产管理职责的是 （　） 选项：A，实施企业安全生产规章制度；B，实施企业制定安全生产操作规程；C，参加企业组织的安全生产教育培训；D，与现场施工人员签订安全生产责任书。"}, {"tag": null, "text": "正确答案：A，实施企业安全生产规章制度。"}, {"tag": "第28题", "text": "第28题，多选题。主要负责人与项目负责人签订的安全生产责任书的内容必须包括（　）。 选项：A，项目安全生产考核目标；B，项目安全生产奖惩措施；C，项目部应采购的劳动保护用品；D，项目承包额；E，企业为项目提供的安全管理和技术保障措施。"}, {"tag": null, "text": "正确答案：A、B、E。"}, {"tag": "第29题", "text": "第29题，多选题。企业与项目负责人签订的安全生产责任书的内容必须包括 （　） 选项：A，项目安全生产考核目标；B，项目安全生产奖惩措施；C，项目部应采购的劳动保护用品；D，项目的施工费承包额；E，企业为项目提供的安全管理和技术保障措施。"}, {"tag": null, "text": "正确答案：A、B、E。"}, {"tag": "第30题", "text": "第30题，单选题。关于通信施工企业主要负责人的安全职责,下面表述中错误的是（　） 选项：A，主要负责人对本企业安全生产工作全面负责；B，主要负责人应督促检查本企业安全生产工作；C，消除安全事故隐患由专职安全生产管理人员和项目负责人,企主要负责人分别负责；D，主要负责人应当与项目负责人签订安全生产责任书。"}, {"tag": null, "text": "正确答案：C，消除安全事故隐患由专职安全生产管理人员和项目负责人,企主要负责人分别负责。"}, {"tag": "第31题", "text": "第31题，单选题。关于通信施工企业主要负责人的安全职责,下面表述中错误的是（　） 选项：A，主要负责人应当按规定检查企业所承担的工程项目；B，主要负责人应当考核项目负责人安全生产管理能力；C，必要时,主要负责人可以调整项目负责人；D，主要负责人应当明确项目管理人员的安全职责。"}, {"tag": null, "text": "正确答案：D，主要负责人应当明确项目管理人员的安全职责。"}, {"tag": "第32题", "text": "第32题，单选题。下列职责中,属于企业主管安全生产负责人的安全生产职责的是（　） 选项：A，审批施工组织设计和专项施工方案；B，监督、检查安全生产费用使用情况；C，组织实施安全工作规划及实施计划；D，组织审查新工艺实施过程的安全性。"}, {"tag": null, "text": "正确答案：C，组织实施安全工作规划及实施计划。"}, {"tag": "第33题", "text": "第33题，单选题。下列职责中,属于企业技术负责人的安全生产职责的是 （　）。 选项：A，审批施工组织设计和专项施工方案；B，监督、检查安全生产费用使用情况；C，组织实施安全工作规划及实施计划；D，监督企业安全生产教育工作开展情况。"}, {"tag": null, "text": "正确答案：A，审批施工组织设计和专项施工方案。"}, {"tag": "第34题", "text": "第34题，单选题。企业的安全生产管理人员不包括（　） 选项：A，企业安全生产管理机构的人员；B，分支机构专职从事安全生产管理工作的人员；C，工程项目专职从事安全生产管理工作的人员；D，工程项目的兼职安全巡查人员。"}, {"tag": null, "text": "正确答案：D，工程项目的兼职安全巡查人员。"}, {"tag": "第35题", "text": "第35题，单选题。下列关于企业专职安全生产管理人员的安全生产管理职责,说法错误的是 （　）。 选项：A，检查在建项目安全生产管理情况；B，发现安全事故隐患,应及时向政府有关机构报告；C，对达到一定规模的危险性较大的分部分项工程进行现场监督；D，对工程施工的重点部位和关键环节进行现场监督。"}, {"tag": null, "text": "正确答案：B，发现安全事故隐患,应及时向政府有关机构报告。"}, {"tag": "第36题", "text": "第36题，单选题。下列安全生产要求中,不属于企业对项目负责人的安全生产要求是（　） 选项：A，项目负责人应取得相应的执业资格；B，项目负责人应经安全生产考核合格；C，企业应与项目负责人签订安全生产责任书；D，企业应与项目负责人签订承包合同。"}, {"tag": null, "text": "正确答案：D，企业应与项目负责人签订承包合同。"}, {"tag": "第37题", "text": "第37题，多选题。企业与项目负责人签订的安全生产责任书的内容必须包括 （　） 选项：A，项目安全生产考核目标；B，项目安全生产奖惩措施；C，项目部应采购的劳动防护用品；D，项目部的施工费承包额；E，企业为项目提供的安全管理和技术保障措施。"}, {"tag": null, "text": "正确答案：A、B、E。"}, {"tag": "第38题", "text": "第38题，单选题。工程项目施工现场安全生产第一责任人是 （　） 选项：A，企业法人；B，企业主管安全生产的负责人；C，项目负责人；D，项目专职安全生产管理人员。"}, {"tag": null, "text": "正确答案：C，项目负责人。"}, {"tag": "第39题", "text": "第39题，单选题。下列工程项目负责人的安全生产职责中,描述错误的是 （　） 选项：A，应当建立项目安全生产管理体系；B，负责编制工程项目施工组织设计；C，负责组织落实企业的安全生产责任制；D，负责组织落实企业安全生产规章制度。"}, {"tag": null, "text": "正确答案：B，负责编制工程项目施工组织设计。"}, {"tag": "第40题", "text": "第40题，单选题。下列工程项目负责人的安全生产职责中,描述错误的是（　） 选项：A，负责编制项目的施工组织设计；B，监控危险性较大分部分项工程；C，及时排查处理现场安全事故隐患；D，与分包企业签订安全生产协议书。"}, {"tag": null, "text": "正确答案：A，负责编制项目的施工组织设计。"}, {"tag": "第41题", "text": "第41题，多选题。项目负责人应当按照规定实施项目安全生产管理,（　） 隐患排查处理情况应当记入项目安全管理档案。 选项：A，监控危险性较大分部分项工程；B，定期考核分包企业安全生产管理情况；C，每天在施工现场开展安全生产检查；D，及时排查处理施工现场安全事故隐患；E，建立健全企业安全生产管理体系。"}, {"tag": null, "text": "正确答案：A、B、D。"}, {"tag": "第42题", "text": "第42题，多选题。施工安全技术交底应向施工作业班组、作业人员进行详细说明的内容有（　） 选项：A，施工安全重点部位；B，施工安全重点环节；C，安全施工所需费用；D，安全施工技术要求；E，安全施工技术措施。"}, {"tag": null, "text": "正确答案：A、B、D、E。"}, {"tag": "第43题", "text": "第43题，单选题。必须在安全技术交底记录上签字的人员是 （　） 选项：A，项目负责人；B，项目设计人员；C，项目技术人员；D，项目监理人员。"}, {"tag": null, "text": "正确答案：A，项目负责人。"}, {"tag": "第44题", "text": "第44题，单选题。下列施工现场班组长的安全生产职责中,描述错误的是 （　） 选项：A，负责进行项目施工组织设计交底工作；B，贯彻执行企业的安全生产的规定和要求；C，督促本班组的工人遵守安全生产规章；D，督促本班组的工人遵守安全操作规程。"}, {"tag": null, "text": "正确答案：A，负责进行项目施工组织设计交底工作。"}, {"tag": "第45题", "text": "第45题，多选题。施工企业不参加安全生产考核的人员是 （　） 选项：A，各管理层的主要负责人；B，安全生产相关职能部门及岗位的管理人员；C，工程项目的管理人员；D，施工现场的作业人员。"}, {"tag": null, "text": "正确答案：A、B、C。"}, {"tag": "第46题", "text": "第46题，单选题。下列行为中,不属于安全生产处罚范围的是 （　） 选项：A，偶尔出现安全生产考核成绩不达标的问题；B，没有及时对提出的问题进行整改；C，在生产安全事故中不积极抢救,而导致事故扩大化；D，在抢险活动中,项目负责人冒险作业导致身体残疾。"}, {"tag": null, "text": "正确答案：D，在抢险活动中,项目负责人冒险作业导致身体残疾。"}, {"tag": "第47题", "text": "第47题，多选题。应受到安全生产处罚的行为是 （　） 选项：A，强令职工冒险作业；B，冒险抢修损毁设施；C，重复发生安全事故；D，破坏或伪造事故现场；E，瞒报、谎报或不及时上报安全事故。"}, {"tag": null, "text": "正确答案：A、C、D、E。"}, {"tag": "第49题", "text": "第49题，单选题。通信建设工程安全生产涉及工程的规划设计、建设安装、生产调试、生产运行、技术改造等系列活动。因此,企业建立安全生产管理制度应遵循 （　） 选项：A，安全第一,预防为主,综合治理原则；B，主要负责人的原则；C，系统性原则；D，规范化和标准化原则。"}, {"tag": null, "text": "正确答案：C，系统性原则。"}, {"tag": "第50题", "text": "第50题，单选题。企业建立安全生产管理制度应坚持规范化和标准化原则,这是因为（　） 选项：A，要保证有效调动和使用企业的所有资源；B，要保证制度的目的明确,流程清晰,标准准确；C，制度涉及企业经的每个环节、岗位。"}, {"tag": null, "text": "正确答案：B，要保证制度的目的明确,流程清晰,标准准确。"}, {"tag": "第51题", "text": "第51题，多选题。按照标准化工作体系建立的安全生产管理制度,一般把安全生产管理制度分为（　）等几类体系。 选项：A，规范标准 C 工作标准；B，工作标准 B 技术标准；C，管理标准；D，系统标准。"}, {"tag": null, "text": "正确答案：B、C、D。"}, {"tag": "第52题", "text": "第52题，单选题。下列安全生产管理制度中,属于综合管理类管理制度的是 （　） 选项：A，安全教育培训制度；B，定期巡视检查制度；C，安全技术管理制度；D，职业卫生管理制度。"}, {"tag": null, "text": "正确答案：C，安全技术管理制度。"}, {"tag": "第53题", "text": "第53题，单选题。下列综合管理类安全管理制度中,属于安全技术管理制度的是（　） 选项：A，施工组织设计编制、审核和审批制度；B，隐患排查和治理制度；C，劳动防护用品发放、使用和管理制度；D，安全生产监督检查制度。"}, {"tag": null, "text": "正确答案：A，施工组织设计编制、审核和审批制度。"}, {"tag": "第54题", "text": "第54题，单选题。安全管理定期例行工作不包括（　） 选项：A，定期安全分析会议；B，定期安全学习制度；C，定期进度报表制度；D，定期安全生产检查。"}, {"tag": null, "text": "正确答案：C，定期进度报表制度。"}, {"tag": "第55题", "text": "第55题，单选题。不属于承包、分包与发包工程安全管理制度内容的是（　） 选项：A，参与各方的安全责任；B，安全生产管理协议 D 施工安全的组织措施；C，施工安全的组织措施 C 费用变更索赔条款。"}, {"tag": null, "text": "正确答案：C，施工安全的组织措施 C 费用变更索赔条款。"}, {"tag": "第56题", "text": "第56题，单选题。不属于安全生产监督检查制度内容的是（　） 选项：A，安全检查的人员；B，安全检查执行的标准；C，安全检查的费用标准；D，安全检查的内容、方式。"}, {"tag": null, "text": "正确答案：C，安全检查的费用标准。"}, {"tag": "第57题", "text": "第57题，多选题。安全防护用品发放、使用和管理制度应明确（　） 选项：A，用品的种类；B，用品的使用范围；C，用品合格标准；D，用品领用程序；E，用品寿命周期。"}, {"tag": null, "text": "正确答案：A、B、D、E。"}, {"tag": "第58题", "text": "第58题，多选题。安全生产管理持证上岗制度应明确（　） 选项：A，安全生产管理岗位、证件名称；B，持证人员资格条件；C，持证上岗考核内容；D，持证上岗考核费用；E，所持证书的有效期。"}, {"tag": null, "text": "正确答案：A、E。"}, {"tag": "第59题", "text": "第59题，单选题。企业设备设施安全管理定期检测、检验制度不明确 （　） 选项：A，企业必须进行定期检测的设备种类、名称、数量；B，有权进行检测的部门或人员；C，检测、检验费用的执行标准；D，监测的标准及检测结果管理。"}, {"tag": null, "text": "正确答案：C，检测、检验费用的执行标准。"}, {"tag": "第60题", "text": "第60题，单选题。企业安全生产管理制度的制定步骤应为 （　） 选项：A，起草一征求意见一签发一审核一发布一培训一反馈一持续改进；B，反锁一起草一征求意见一签发一审核一发布一培训一持续改进；C，起草一征求意见-审核一签发一发布一培训一反馈一持续改进；D，反馈一起草一征求意见一审核一签发一发布一持续改进一培训。"}, {"tag": null, "text": "正确答案：C，起草一征求意见-审核一签发一发布一培训一反馈一持续改进。"}, {"tag": "第61题", "text": "第61题，单选题。企业制定安全生产管理制度的准备过程中,审核工作的正确做法是（　） 选项：A，制度在征求意见时,不能达成一致,则应由分管领导组织讨论；B，涉及规范标准的制度,应由企业负责法务的部门进行合规性审查；C，涉及全员性的制度,应经过职工代表大会或职工代表进行审核；D，专业技术性较强的管理制度,应由企业安全主管部门负责审核。"}, {"tag": null, "text": "正确答案：C，涉及全员性的制度,应经过职工代表大会或职工代表进行审核。"}, {"tag": "第62题", "text": "第62题，单选题。涉及全局性综合管理的安全生产管理制度,应由企业 （　）签发 选项：A，主要负责人；B，主管生产的领导或总工程师；C，安全主管部门；D，技术管理部门。"}, {"tag": null, "text": "正确答案：A，主要负责人。"}];
const synth = window.speechSynthesis;
let cur = -1, playing = false, pass = 1, voice = null;
const starts = SEGS.map((s, i) => s.tag ? i : -1).filter(i => i >= 0);
const list = document.getElementById('list');

SEGS.forEach((s, i) => {
  if (s.tag) { const t = document.createElement('div'); t.className = 'tag'; t.textContent = s.tag; list.appendChild(t); }
  const d = document.createElement('div'); d.className = 'line'; d.textContent = s.text;
  d.onclick = () => { pass = 1; start(i); }; list.appendChild(d); s.el = d;
});

function pickVoice() {
  const vs = synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('zh'));
  voice = vs.find(v => /婷婷|Tingting|晓晓|Xiaoxiao|辉辉|Huihui|Yaoyao/.test(v.name)) || vs[0] || null;
}
pickVoice();
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = pickVoice;

function qStart(i) { let r = 0; for (const s of starts) { if (s <= i) r = s; else break; } return r; }
function qEnd(i) { for (const s of starts) { if (s > i) return s - 1; } return SEGS.length - 1; }

function start(i) {
  synth.cancel();
  if (i >= SEGS.length) { done(); return; }
  if (i < 0) i = 0;
  cur = i;
  document.querySelectorAll('.line').forEach((el, k) => {
    el.classList.toggle('now', k === cur);
    el.classList.toggle('done', k < cur);
  });
  SEGS[cur].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  document.getElementById('status').textContent = (pass === 2 ? '第2遍 · ' : '') + `第 ${cur + 1}/${SEGS.length} 句`;
  const u = new SpeechSynthesisUtterance(SEGS[cur].text);
  u.lang = 'zh-CN';
  if (voice) u.voice = voice;
  u.rate = parseFloat(document.getElementById('rate').value);
  u.onend = () => {
    if (!playing) return;
    if (cur < qEnd(cur)) { pass = pass; start(cur + 1); }
    else if (document.getElementById('mem').checked && pass === 1) { pass = 2; start(qStart(cur)); }
    else { pass = 1; const n = qEnd(cur) + 1; if (n < SEGS.length) start(n); else done(); }
  };
  synth.speak(u);
  playing = true; setBtn();
}
function done() { playing = false; setBtn(); document.getElementById('status').textContent = '✅ 讲完啦'; }
function setBtn() { document.getElementById('toggle').textContent = playing ? '⏸ 暂停' : '▶ 播放'; }
document.getElementById('toggle').onclick = () => {
  if (cur === -1) { start(0); return; }
  if (playing) { synth.pause(); playing = false; setBtn(); }
  else if (synth.paused && synth.speaking) { synth.resume(); playing = true; setBtn(); }
  else { playing = true; start(cur); }
};
document.getElementById('prev').onclick = () => { pass = 1; const p = qStart(Math.max(cur - 1, 0)); start(p === cur ? 0 : p); };
document.getElementById('next').onclick = () => { pass = 1; const n = starts.find(s => s > cur); start(n === undefined ? SEGS.length : n); };
document.getElementById('rate').onchange = () => { if (cur >= 0) { const c = cur; start(c); } };
</script>
</body>
</html>
